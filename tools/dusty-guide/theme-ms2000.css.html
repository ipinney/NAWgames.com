<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ground: #0F1420;
    --card: #182032;
    --card-2: #1F2940;
    --deep: #121A2B;
    --ink: #EEF2F8;
    --ink-2: #A9B6CA;
    --ink-3: #74839B;
    --line: #2B3650;
    --pink: #F0609E;
    --pink-soft: rgba(240,96,158,.12);
    --lime: #9BE15D;
    --lime-soft: rgba(155,225,93,.10);
    --sky: #5DB7F0;
    --sky-soft: rgba(93,183,240,.10);
    --amber: #F5B642;
    --amber-soft: rgba(245,182,66,.10);
    --red: #F0605E;
    --red-soft: rgba(240,96,94,.10);
  }
  body { font-family: 'Nunito', system-ui, sans-serif; background: var(--ground); color: var(--ink); line-height: 1.55; padding: 18px; font-size: 16px; }
  a { color: var(--sky); }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  h1, h2, h3, h4, .num { font-family: 'Fredoka', 'Nunito', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .92em; color: var(--lime); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }

  /* hero */
  .hero { text-align: center; padding: 32px 22px 26px; border: none; background: radial-gradient(120% 90% at 50% 0%, #3A2150 0%, #1B2238 60%, #182032 100%); }
  .hero .bug { font-size: 50px; line-height: 1; display: block; margin-bottom: 6px; }
  .hero h1 { font-size: clamp(32px, 7vw, 50px); font-weight: 700; line-height: 1.02; }
  .hero h1 span { display: block; font-size: .4em; letter-spacing: .16em; color: var(--pink); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
  .hero h1 em { font-style: normal; color: var(--lime); }
  .hero p { color: var(--ink-2); max-width: 52ch; margin: 10px auto 0; }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .fact { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .05em; color: var(--ink-2); }
  .fact b { color: var(--lime); font-weight: 600; }
  .jump { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 18px; }
  .jump a { text-decoration: none; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--card-2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 10px; }

  /* section heads */
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--pink); margin-bottom: 5px; }
  h2 { font-size: 28px; font-weight: 600; line-height: 1.15; margin-bottom: 8px; }
  h3 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  p.lead { color: var(--ink-2); }

  /* safety */
  .safety { background: var(--red-soft); border: 1px solid rgba(240,96,94,.45); border-radius: 16px; padding: 20px 24px; }
  .safety h2 { color: var(--red); font-size: 24px; }
  .safety ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px 22px; margin-top: 10px; }
  .safety li { font-size: 15px; color: var(--ink-2); padding-left: 25px; position: relative; }
  .safety li::before { content: "!"; position: absolute; left: 0; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: var(--red); color: #1a0e18; font-family: 'Fredoka', sans-serif; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .safety li b { color: var(--ink); }

  /* jobs */
  .jobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
  .job { background: var(--card-2); border-radius: 12px; padding: 14px 16px; }
  .job h3 { font-size: 17px; }
  .job.a h3 { color: var(--pink); }
  .job.g h3 { color: var(--amber); }
  .job ul { padding-left: 18px; font-size: 14.5px; color: var(--ink-2); }
  .job li + li { margin-top: 3px; }

  /* tools */
  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin-top: 14px; }
  .tool { background: var(--card-2); border-radius: 12px; padding: 14px 10px; text-align: center; }
  .tool svg { display: block; margin: 0 auto 7px; width: 46px; height: 42px; }
  .tool b { display: block; font-size: 14.5px; }
  .tool span { font-size: 12.5px; color: var(--ink-3); }

  /* parts */
  .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-top: 14px; }
  .pcard { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .pic { background: var(--deep); padding: 14px; display: grid; place-items: center; border-bottom: 1px solid var(--line); }
  .pic svg { width: 100%; max-width: 210px; height: auto; display: block; }
  .pbody { padding: 14px 16px 15px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .pbody h3 { margin: 0; }
  .pbody h3 small { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-3); font-weight: 500; margin-left: 6px; }
  .pbody .what { font-size: 14.5px; color: var(--ink-2); }
  .pbody .does { font-size: 14.5px; background: var(--pink-soft); border-radius: 8px; padding: 9px 11px; }
  .pbody .does b { color: var(--pink); }
  .pbody .spec { margin-top: auto; padding-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-3); letter-spacing: .03em; border-top: 1px dashed var(--line); text-transform: uppercase; }

  /* explainers, tips */
  .explain { background: var(--sky-soft); border: 1px solid rgba(93,183,240,.35); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .explain h4 { font-size: 16.5px; color: var(--sky); margin-bottom: 4px; display: flex; align-items: center; gap: 7px; }
  .explain h4::before { content: "?"; flex: none; width: 21px; height: 21px; border-radius: 50%; background: var(--sky); color: #0b1522; font-size: 14px; display: grid; place-items: center; }
  .explain p { font-size: 14.5px; color: var(--ink-2); }
  .explain p + p { margin-top: 7px; }
  .explain b { color: var(--ink); }
  .try { margin-top: 12px; background: var(--pink-soft); border: 1px solid rgba(240,96,158,.35); border-radius: 12px; padding: 12px 15px; font-size: 14.5px; color: var(--ink-2); }
  .try b { color: var(--pink); }
  .gotcha { margin-top: 12px; background: var(--amber-soft); border-left: 3px solid var(--amber); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14.5px; color: var(--ink-2); }
  .gotcha b { color: var(--amber); }
  .grownup { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #1a1206; background: var(--amber); border-radius: 5px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }

  /* steps */
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px 20px; scroll-margin-top: 12px; }
  .step-head { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 4px; }
  .num { flex: none; width: 46px; height: 46px; border-radius: 12px; background: var(--pink); color: #1a0e18; font-size: 23px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
  .part-head .num { background: var(--lime); }
  .step-head h2 { margin: 0; font-size: 26px; }
  .step-head .when { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-3); letter-spacing: .07em; text-transform: uppercase; margin-top: 3px; }
  .why { color: var(--ink-2); font-size: 15.5px; margin-top: 8px; }
  .chapter { text-align: center; padding: 8px 0 0; }
  .chapter .eyebrow { color: var(--lime); }
  .chapter h2 { font-size: 30px; }
  .chapter p { color: var(--ink-2); max-width: 56ch; margin: 0 auto; }

  .diagram { background: var(--deep); border-radius: 12px; padding: 14px; margin-top: 16px; overflow-x: auto; }
  .diagram svg { display: block; width: 100%; min-width: 440px; height: auto; }
  .diagram svg.fit { min-width: 0; max-width: 560px; margin: 0 auto; }
  .diagram img { display: block; width: 100%; max-width: 620px; height: auto; margin: 0 auto; border-radius: 8px; }
  .caption { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-3); margin-top: 9px; letter-spacing: .04em; text-transform: uppercase; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .pair .diagram { margin-top: 0; }

  ol.do { list-style: none; counter-reset: d; margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }
  ol.do li { counter-increment: d; padding-left: 34px; position: relative; font-size: 15.5px; }
  ol.do li::before { content: counter(d); position: absolute; left: 0; top: 1px; width: 23px; height: 23px; border-radius: 7px; background: var(--ink); color: var(--ground); font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 600; display: grid; place-items: center; }
  ol.do li .tip { display: block; font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }

  .checkpoint { margin-top: 16px; background: var(--lime-soft); border: 1px solid rgba(155,225,93,.4); border-radius: 12px; padding: 13px 16px; display: flex; gap: 13px; align-items: flex-start; }
  .checkpoint .tick { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; margin-top: 1px; }
  .checkpoint .tick svg { width: 13px; height: 13px; display: block; }
  .checkpoint h4 { font-size: 15.5px; color: var(--lime); margin-bottom: 2px; }
  .checkpoint p { font-size: 14.5px; color: var(--ink-2); }
  .journal { margin-top: 10px; font-size: 14px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 10px; padding: 9px 13px; }
  .journal b { color: var(--pink); font-family: 'Fredoka', sans-serif; font-weight: 600; }

  .order { list-style: none; counter-reset: o; display: grid; gap: 10px; margin-top: 14px; }
  .order li { counter-increment: o; background: var(--card-2); border-radius: 12px; padding: 12px 14px 12px 54px; position: relative; }
  .order li::before { content: counter(o); position: absolute; left: 14px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: var(--sky); color: #0b1522; font-family: 'Fredoka', sans-serif; font-weight: 600; display: grid; place-items: center; }
  .order b { display: block; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; }
  .order span { font-size: 14.5px; color: var(--ink-2); }
  .order .t { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-3); letter-spacing: .05em; display: block; margin-top: 3px; text-transform: uppercase; }
  .order .w { color: var(--ink); background: #EEF2F8; color: #111; border-radius: 4px; padding: 0 5px; font-size: 11px; }

  /* MakeCode blocks, in MakeCode's own colors */
  .prog { margin-top: 16px; background: var(--deep); border-radius: 12px; padding: 14px; }
  .prog h4 { font-size: 16px; margin-bottom: 2px; }
  .prog > p { font-size: 13.5px; color: var(--ink-3); margin-bottom: 10px; }
  .blocks { display: flex; flex-direction: column; gap: 5px; }
  .blk { border-radius: 8px; padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #fff; position: relative; }
  .blk i { font-style: normal; float: right; font-family: 'Nunito', sans-serif; font-size: 10.5px; opacity: .75; margin-left: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .blk small { display: block; font-family: 'Nunito', sans-serif; font-size: 12.5px; opacity: .85; margin-top: 1px; }
  .blk.gap { margin-top: 8px; }
  .i1 { margin-left: 18px; } .i2 { margin-left: 36px; } .i3 { margin-left: 54px; }
  .b-basic { background: #1E90FF; } .b-input { background: #B400B4; } .b-music { background: #D0301F; }
  .b-radio { background: #C8007C; } .b-loops { background: #00902F; } .b-logic { background: #00888A; }
  .b-var { background: #C4122F; } .b-math { background: #7E00B5; } .b-pins { background: #A21E1E; }
  .b-led { background: #5C2D91; } .b-fn { background: #3455DB; } .b-husky { background: #C9580A; } .b-xiami { background: #0B9A0E; } .b-log { background: #378273; }
  .keylist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .keylist span { font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; color: #fff; padding: 2px 8px; border-radius: 6px; }

  /* tables */
  .table-wrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 520px; }
  th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 9px 12px; border-bottom: 2px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
  td:first-child { color: var(--ink); font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  .screws td:nth-child(2), .screws td:nth-child(3) { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; color: var(--lime); }

  /* glossary */
  .gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
  .gterm { background: var(--card-2); border-radius: 11px; padding: 12px 14px; }
  .gterm b { display: block; font-family: 'Fredoka', sans-serif; font-size: 16px; color: var(--sky); margin-bottom: 2px; font-weight: 600; }
  .gterm span { font-size: 14px; color: var(--ink-2); }

  .linkrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .linkrow a { flex: 1 1 200px; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px; padding: 12px 16px; border-radius: 11px; }
  .linkrow a.primary { background: var(--pink); color: #1a0e18; }
  .linkrow a.secondary { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); }
  .link3d { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--sky); text-decoration: none; font-size: 14.5px; }
  footer { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-3); letter-spacing: .06em; padding: 6px 0 14px; }

  @media (max-width: 560px) {
    body { padding: 10px; font-size: 15.5px; }
    .card, .step { padding: 16px; }
    .step-head { gap: 11px; }
    .num { width: 38px; height: 38px; font-size: 19px; }
    .step-head h2 { font-size: 21px; }
    h2 { font-size: 23px; }
    .diagram { padding: 10px; }
    .blk { font-size: 12px; padding: 7px 10px; }
    .i1 { margin-left: 12px; } .i2 { margin-left: 24px; } .i3 { margin-left: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media print {
    .step, .card, .pcard, .prog { break-inside: avoid; page-break-inside: avoid; }
    .jump { display: none; }
  }

  /* Dusty additions on the MS-2000 theme */
  .hero .bot { font-size: 50px; line-height: 1; display: block; margin-bottom: 6px; }
  .pcard .pic.new svg { max-width: 190px; }
  .blk.start { background: #1E90FF; } .blk.loop { background: #00902F; } .blk.logic { background: #00888A; }
  .blk.act { background: #C9580A; } .blk.var { background: #C4122F; }
  .blk .ind { display: inline-block; width: 18px; }
  .math { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-family: 'Fredoka', sans-serif; font-size: 20px; }
  .math .box { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; text-align: center; line-height: 1.1; }
  .math .box small { display: block; font-family: 'Nunito', sans-serif; font-size: 11.5px; color: var(--ink-3); }
  .tool svg rect, .tool svg circle { }
</style>
