<style>
:root{--ink:#0d1b2e;--panel:#10233b;--grid:#1c3150;--line:#8fd3ea;--part:#9be15d;--text:#dbe5f1;--dim:#7d93ad}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:"Barlow Semi Condensed",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.dl{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:var(--line);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl small{color:var(--dim);font-weight:500;margin-left:4px}
.hidden .dl{display:none}
header{position:fixed;top:14px;left:16px;right:16px;pointer-events:none}
h1{font-size:26px;font-weight:700;line-height:1.1}
h1 span{color:var(--part)}
header p{color:var(--dim);font-size:15px;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--ink) 18%)}
.pad{padding:0 14px}
#card{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:10px 12px;margin-bottom:8px}
#card h2{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
#card h2 i{width:12px;height:12px;border-radius:3px;flex:none}
#card h2 em{font-style:normal;color:var(--dim);font-weight:500;font-size:16px}
#meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px;margin:6px 0 4px}
#meta div{border-left:2px solid var(--grid);padding-left:7px;min-width:0}
dt{color:var(--dim);font-size:12px}
dd{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#note{color:var(--text);font-size:14px;line-height:1.3;opacity:.85}
.row{display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:#152a45;border:1px solid var(--grid);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--line);outline-offset:2px}
button.on{border-color:var(--line);color:var(--line)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips .sep{flex:none;align-self:center;color:var(--dim);font-size:13px;padding:0 2px 0 6px}
#chips button{flex:none;display:flex;align-items:center;gap:6px;font-weight:500}
#chips button i{width:9px;height:9px;border-radius:2px}
#chips button.on{font-weight:600}
@media (max-height:560px){header p,#note{display:none}h1{font-size:20px}}
</style></head><body>

  items.forEach((it,i)=>{if(it.g===g)chip(it.n+(it.q>1?' x'+it.q:''),String(i),it.c);});
});
document.getElementById('sub').textContent=`${items.length} components. Drag to rotate, pinch to zoom. All sizes in mm.`;
document.getElementById('alone').onclick=()=>{alone=true;apply();};
document.getElementById('inrobot').onclick=()=>{alone=false;apply();};
document.getElementById('dims').onclick=e=>{showDims=!showDims;e.currentTarget.classList.toggle('on',showDims);apply();};

// orbit
const ptrs=new Map(); let pinch0=0,z0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);z0=zoom;}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){theta-=(e.clientX-p.x)*.008;phi=Math.min(Math.PI-.02,Math.max(.02,phi-(e.clientY-p.y)*.008));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoom=Math.min(3,Math.max(.3,z0*pinch0/d));}});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,e=>ptrs.delete(e.pointerId)));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(3,Math.max(.3,zoom*Math.exp(e.deltaY*.001)));},{passive:false});

let shiftNdc=0;
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,true);camera.aspect=w/h;camera.updateProjectionMatrix();
  const top=document.querySelector('header').getBoundingClientRect().bottom+6;
  const bot=document.getElementById('card').getBoundingClientRect().top-6;
  const availH=Math.max(120,bot-top),half=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const vHalf=Math.atan(half*availH/h),hHalf=Math.atan(half*w/h);
  fitDist=1/Math.sin(Math.min(vHalf,hHalf*.92));
  shiftNdc=1-2*((top+bot)/2)/h;
  camera.projectionMatrix.elements[9]=-shiftNdc;
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}
addEventListener('resize',resize);
new ResizeObserver(resize).observe(document.querySelector('footer'));
if(document.fonts)document.fonts.ready.then(resize);
const tmp=new THREE.Vector3();
function loop(){
  const k=reduce?1:.14;
  tgt.lerp(tgtTo,k); fitR+=(fitRTo-fitR)*k;
  const r=fitR*fitDist*zoom;
  camera.position.set(tgt.x+r*Math.sin(phi)*Math.sin(theta),tgt.y+r*Math.cos(phi),tgt.z+r*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(tgt); renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  labels.forEach(L=>{tmp.copy(L.p).project(camera);L.el.style.left=(tmp.x*.5+.5)*w+'px';L.el.style.top=(-tmp.y*.5+.5)*h+'px';L.el.style.visibility=tmp.z<1?'visible':'hidden';});
  requestAnimationFrame(loop);
}
frame(BB,1.0); tgt.copy(tgtTo); fitR=fitRTo;
apply(); requestAnimationFrame(loop);
