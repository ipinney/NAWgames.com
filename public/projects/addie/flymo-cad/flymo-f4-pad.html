<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Flying Mosquito launch pad, Rev A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1b2e;--grid:#1c3150;--line:#8fd3ea;--part:#f0b43c;--text:#dbe5f1;--dim:#7d93ad}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:"Barlow Semi Condensed",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.dl{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:var(--line);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl small{color:var(--dim);font-weight:500;margin-left:4px}
.hidden .dl{display:none}
header{position:fixed;top:14px;left:16px;right:16px;pointer-events:none}
h1{font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.1}
h1 span{color:var(--part)}
header p{color:var(--dim);font-size:15px;margin-top:2px}
footer{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--ink) 30%)}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:#152a45;border:1px solid var(--grid);border-radius:6px;padding:7px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--line);outline-offset:2px}
button.on{border-color:var(--line);color:var(--line)}
button.go{background:var(--part);color:var(--ink);border-color:var(--part);margin-left:auto}
dl.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 14px;margin:0 0 10px;font-size:15px}
dl.specs div{border-left:2px solid var(--grid);padding-left:8px}
dt{color:var(--dim);font-size:13px}
dd{font-weight:600;font-variant-numeric:tabular-nums}
@media (max-height:520px){dl.specs{grid-template-columns:repeat(4,auto)}#hint{display:none}h1{font-size:20px}header p{display:none}}
#hint{color:var(--dim);font-size:13px;margin-top:8px}
#hint a{color:var(--line)}
</style></head><body>
<canvas id="stage"></canvas>
<div id="labels"></div>
<header><h1>Flying Mosquito <span>launch pad</span>, Rev A</h1><p>Drag to rotate, pinch or scroll to zoom. All dimensions in mm.</p></header>
<footer>
<dl class="specs"><div><dt>Size</dt><dd>150 x 150 mm</dd></div><div><dt>Feet</dt><dd>4 cone cups</dd></div><div><dt>Arrow</dt><dd>points at the MS-2000</dd></div><div><dt>Print</dt><dd>flat, no supports</dd></div></dl>
<div class="row">
<button data-v="iso" class="on">3D</button><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="top">Top</button>
<button id="dims" class="on">Dimensions</button>
<button id="dl" class="go">Download STL</button>
</div>
<p id="hint">Glue the flight pattern paper on top between the cups. The arrow points at the turret.</p>
</footer>

const CX=(BB[0][0]+BB[1][0])/2, CY=(BB[0][1]+BB[1][1])/2, CZ=(BB[0][2]+BB[1][2])/2;
const DIAG=Math.hypot(BB[1][0]-BB[0][0],BB[1][1]-BB[0][1],BB[1][2]-BB[0][2]);
const grid = new THREE.GridHelper(Math.ceil(DIAG*2.5/10)*10,30,0x2a4a73,0x1c3150); grid.position.set(CX,BB[0][2]-.05,-CY); scene.add(grid);

// dimension lines (DATA.dims, model coords)
const dimMat = new THREE.LineBasicMaterial({color:0x8fd3ea});
const dimGroup = new THREE.Group(); scene.add(dimGroup);
const labelsEl = document.getElementById('labels');
const labels = [];
const V = (x,y,z)=>new THREE.Vector3(x,z,-y); // model coords -> three
function dim(a,b,off,text,note){
  const A=V(...a),B=V(...b),o=V(...off);
  const A2=A.clone().add(o),B2=B.clone().add(o);
  const ext=o.clone().setLength(3);
  const pts=[A,A2.clone().add(ext),B,B2.clone().add(ext),A2,B2];
  const dir=B2.clone().sub(A2).normalize(), t=Math.max(1.5,DIAG*.02);
  const perp=o.clone().normalize().multiplyScalar(t);
  const tk=[A2.clone().add(dir.clone().multiplyScalar(t)).add(perp),A2.clone().sub(dir.clone().multiplyScalar(t)).sub(perp),
            B2.clone().add(dir.clone().multiplyScalar(t)).add(perp),B2.clone().sub(dir.clone().multiplyScalar(t)).sub(perp)];
  dimGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([...pts,...tk]),dimMat));
  const el=document.createElement('div'); el.className='dl';
  el.textContent=text; if(note){const s=document.createElement('small');s.textContent=note;el.appendChild(s);}
  labelsEl.appendChild(el);
  labels.push({el,p:A2.clone().add(B2).multiplyScalar(.5)});
}
(DATA.dims||[]).forEach(d=>dim(d.a,d.b,d.off,d.text,d.note));

// orbit controls
const target=V(CX,CY,CZ);                    // orbit around the part's center
const FIT_R=DIAG*.5*(DATA.fitPad||1.3);      // bounding sphere of part + dimension labels
let theta=-.75, phi=1.0, zoom=1, fitDist=300, anim=null, shiftNdc=0;
const views={iso:[-.75,1.0],front:[0,1.45],side:[Math.PI/2,1.45],top:[0,.02]};
function place(){const radius=fitDist*zoom;camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);}
const ptrs=new Map(); let pinch0=0, z0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});anim=null;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);z0=zoom;}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){theta-=(e.clientX-p.x)*.008;phi=Math.min(Math.PI-.02,Math.max(.02,phi-(e.clientY-p.y)*.008));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoom=Math.min(3,Math.max(.35,z0*pinch0/d));}
  setActive(null);});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,e=>ptrs.delete(e.pointerId)));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(3,Math.max(.35,zoom*Math.exp(e.deltaY*.001)));},{passive:false});

function setActive(k){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===k));}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const [t,p]=views[b.dataset.v];const r=1;setActive(b.dataset.v);
  if(reduce){theta=t;phi=p;zoom=r;return;}
  let dt=((t-theta)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;
  anim={f:{t:theta,p:phi,r:zoom},to:{t:theta+dt,p,r},s:performance.now()};});
const dimsBtn=document.getElementById('dims');
dimsBtn.onclick=()=>{const on=!dimsBtn.classList.contains('on');dimsBtn.classList.toggle('on',on);dimGroup.visible=on;labelsEl.classList.toggle('hidden',!on);};

// STL download, built from the same mesh
document.getElementById('dl').onclick=()=>{
  const f=DATA.f, n=f.length/3, buf=new ArrayBuffer(84+n*50), dv=new DataView(buf);
  dv.setUint32(80,n,true);
  for(let i=0;i<n;i++){const o=84+i*50;
    const a=f[i*3]*3,b=f[i*3+1]*3,c=f[i*3+2]*3;
    const ux=v[b]-v[a],uy=v[b+1]-v[a+1],uz=v[b+2]-v[a+2],wx=v[c]-v[a],wy=v[c+1]-v[a+1],wz=v[c+2]-v[a+2];
    let nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx;const l=Math.hypot(nx,ny,nz)||1;
    [nx/l,ny/l,nz/l,v[a],v[a+1],v[a+2],v[b],v[b+1],v[b+2],v[c],v[c+1],v[c+2]].forEach((x,j)=>dv.setFloat32(o+j*4,x,true));}
  const url=URL.createObjectURL(new Blob([buf],{type:'model/stl'}));
  const l=document.createElement('a');l.href=url;l.download=DATA.stlName;l.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,true);camera.aspect=w/h;camera.updateProjectionMatrix();
  const top=document.querySelector('header').getBoundingClientRect().bottom+8;
  const bot=document.querySelector('.specs').getBoundingClientRect().top-8;
  const availH=Math.max(120,bot-top), half=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const vHalf=Math.atan(half*availH/h), hHalf=Math.atan(half*w/h);
  fitDist=FIT_R/Math.sin(Math.min(vHalf,hHalf*.94));
  shiftNdc=1-2*((top+bot)/2)/h;          // move the image center into the open area
  camera.projectionMatrix.elements[9]=-shiftNdc;
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}
addEventListener('resize',resize);
new ResizeObserver(resize).observe(document.querySelector('footer'));
if(document.fonts)document.fonts.ready.then(resize);
resize();
canvas.addEventListener('dblclick',()=>document.querySelector('[data-v="iso"]').click());
const tmp=new THREE.Vector3();
function loop(now){
  if(anim){const k=Math.min(1,(now-anim.s)/600),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    theta=anim.f.t+(anim.to.t-anim.f.t)*e;phi=anim.f.p+(anim.to.p-anim.f.p)*e;zoom=anim.f.r+(anim.to.r-anim.f.r)*e;if(k===1)anim=null;}
  place();renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  labels.forEach(L=>{tmp.copy(L.p).project(camera);L.el.style.left=(tmp.x*.5+.5)*w+'px';L.el.style.top=(-tmp.y*.5+.5)*h+'px';L.el.style.visibility=tmp.z<1?'visible':'hidden';});
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
