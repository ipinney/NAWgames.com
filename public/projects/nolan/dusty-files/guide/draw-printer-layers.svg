<svg xmlns="http://www.w3.org/2000/svg" class="fit" viewBox="0 0 420 235" role="img" aria-label="A printer nozzle laying thin layers of melted plastic on a heated bed">
  <path d="M210 0 V40" stroke="#F0B43C" stroke-width="5"/>
  <path d="M190 40 h40 v34 l-12 14 h-16 l-12 -14 z" fill="#B9C4D1" stroke="#8A99B0" stroke-width="2"/>
  <path d="M205 88 h10 l-3 10 h-4 z" fill="#D8A34A" stroke="#8A99B0" stroke-width="1.5"/>
  <text x="244" y="56" font-family="Fredoka, sans-serif" font-size="16" fill="#EEF2F8">Nozzle, about 220&deg;C</text>
  <text x="244" y="75" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A9B6CA">melts the plastic</text>
  <g fill="#F0B43C" stroke="#9A6A12" stroke-width="1">
    <rect x="60" y="166" width="240" height="12" rx="6"/><rect x="60" y="154" width="240" height="12" rx="6"/>
    <rect x="60" y="142" width="240" height="12" rx="6"/><rect x="60" y="130" width="240" height="12" rx="6"/>
    <rect x="60" y="118" width="150" height="12" rx="6"/>
  </g>
  <text x="60" y="110" font-family="IBM Plex Mono, monospace" font-size="12" fill="#F0609E">new layer going down</text>
  <path d="M304 136 h10" stroke="#8A99B0" stroke-width="1.5"/>
  <text x="318" y="140" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A9B6CA">each layer</text>
  <text x="318" y="156" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A9B6CA">0.2 mm</text>
  <rect x="20" y="178" width="380" height="16" rx="4" fill="#F4C9C0"/>
  <text x="210" y="220" font-family="IBM Plex Mono, monospace" font-size="12" fill="#A9B6CA" text-anchor="middle">heated bed, about 60&deg;C, so the first layer sticks</text>
</svg>