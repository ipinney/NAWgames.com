<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dinosaur Jump</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1330;overflow:hidden;touch-action:none;user-select:none;font-family:'Segoe UI',Arial,sans-serif}
canvas#c{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
#startScreen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#87CEEB 0%,#f4a460 70%,#8B4513 100%)}
#startScreen h1{font-size:clamp(36px,9vw,80px);color:#2d5016;text-shadow:0 4px 20px rgba(0,0,0,0.3),0 0 40px rgba(45,80,22,0.3);margin-bottom:5px;font-weight:900}
#startScreen .dino-art{font-size:clamp(60px,15vw,120px);margin-bottom:10px}
#startScreen .subtitle{font-size:clamp(14px,3vw,22px);color:#5a3e1b;margin-bottom:25px}
#startScreen .controls{color:#4a3520;font-size:clamp(11px,2.5vw,15px);margin-bottom:25px;text-align:center;line-height:1.8;max-width:380px}
#startScreen button{padding:16px 48px;font-size:clamp(18px,4vw,28px);background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border:none;border-radius:50px;cursor:pointer;font-weight:900;box-shadow:0 6px 30px rgba(34,197,94,0.4);transition:transform 0.2s}
#startScreen button:hover{transform:scale(1.05)}
#gameOver{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)}
#gameOver h1{font-size:clamp(30px,8vw,65px);color:#ef4444;margin-bottom:10px;text-shadow:0 0 30px rgba(239,68,68,0.5)}
#gameOver .stats{color:#ccc;font-size:clamp(14px,3vw,20px);margin-bottom:25px;text-align:center;line-height:1.8}
#gameOver button{padding:14px 40px;font-size:clamp(16px,3.5vw,24px);background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border:none;border-radius:50px;cursor:pointer;font-weight:900;box-shadow:0 6px 30px rgba(34,197,94,0.4)}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:50;display:none;pointer-events:none}
.hud-row{display:flex;justify-content:space-between;align-items:center}
.hud-item{padding:6px 14px;background:rgba(0,0,0,0.5);border-radius:12px;color:#fff;font-size:clamp(12px,2.8vw,18px);font-weight:700}
.hud-score{color:#ffd700}
.hud-level{color:#22c55e}
.hud-time{color:#60a5fa}
#jumpBtn{position:fixed;bottom:20px;right:20px;z-index:60;display:none;width:clamp(60px,15vw,90px);height:clamp(60px,15vw,90px);border-radius:50%;background:linear-gradient(135deg,#22c55e,#15803d);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:clamp(12px,3vw,18px);font-weight:900;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
#duckBtn{position:fixed;bottom:20px;left:20px;z-index:60;display:none;width:clamp(60px,15vw,90px);height:clamp(60px,15vw,90px);border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:clamp(12px,3vw,18px);font-weight:900;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
#levelBanner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;display:none;color:#22c55e;font-size:clamp(30px,8vw,60px);font-weight:900;text-shadow:0 0 30px rgba(34,197,94,0.5);pointer-events:none}
</style>
</head>
<body>

<div id="startScreen">
  <div class="dino-art">🦕</div>
  <h1>DINOSAUR JUMP</h1>
  <div class="subtitle">Run, Jump & Survive!</div>
  <div class="controls">
    Jump over cacti and duck under pterodactyls!<br>
    Survive 3 minutes to level up.<br>
    SPACE/TAP = Jump &nbsp;|&nbsp; DOWN/DUCK = Duck<br>
    Each level gets faster!
  </div>
  <button onclick="startGame()">START RUNNING</button>
</div>

<div id="gameOver">
  <h1>EXTINCT!</h1>
  <div class="stats" id="goStats"></div>
  <button onclick="location.reload()">TRY AGAIN</button>
</div>

<div id="hud">
  <div class="hud-row">
    <span class="hud-item hud-score" id="hudScore">Score: 0</span>
    <span class="hud-item hud-level" id="hudLevel">Level 1</span>
    <span class="hud-item hud-time" id="hudTime">3:00</span>
  </div>
</div>

<div id="levelBanner">LEVEL UP!</div>

<button id="jumpBtn" ontouchstart="jumpPress(event)" ontouchend="jumpRelease(event)">JUMP</button>
<button id="duckBtn" ontouchstart="duckPress(event)" ontouchend="duckRelease(event)">DUCK</button>

<canvas id="c"></canvas>

<script>
// ===== AUDIO ENGINE =====
const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume()}
function playSound(type){
  if(!audioCtx)return;const t=audioCtx.currentTime;const master=audioCtx.createGain();master.connect(audioCtx.destination);
  if(type==='jump'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';
    o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(600,t+0.15);
    g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);master.gain.setValueAtTime(0.4,t);
  } else if(type==='land'){
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.1,audioCtx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.15));
    const ns=audioCtx.createBufferSource();ns.buffer=buf;
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    ns.connect(g);g.connect(master);ns.start(t);ns.stop(t+0.12);master.gain.setValueAtTime(0.4,t);
  } else if(type==='hit'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(40,t+0.5);
    g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    o.connect(g);g.connect(master);
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.5,audioCtx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.1));
    const ns=audioCtx.createBufferSource();ns.buffer=buf;const ng=audioCtx.createGain();
    ng.gain.setValueAtTime(0.3,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    ns.connect(ng);ng.connect(master);o.start(t);o.stop(t+0.6);ns.start(t);ns.stop(t+0.6);
    master.gain.setValueAtTime(0.5,t);
  } else if(type==='collect'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';
    o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(1400,t+0.1);
    g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);master.gain.setValueAtTime(0.35,t);
  } else if(type==='levelup'){
    const notes=[523,659,784,1047,1319];
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.1);
      g.gain.linearRampToValueAtTime(0.12,t+i*0.1+0.04);g.gain.linearRampToValueAtTime(0,t+i*0.1+0.35);
      o.connect(g);g.connect(master);o.start(t+i*0.1);o.stop(t+i*0.1+0.35);});
    master.gain.setValueAtTime(0.5,t);
  } else if(type==='gameover'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';
    o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(80,t+1.0);
    g.gain.setValueAtTime(0.2,t);g.gain.linearRampToValueAtTime(0,t+1.2);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+1.2);master.gain.setValueAtTime(0.4,t);
  } else if(type==='duck'){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';
    o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(150,t+0.1);
    g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.12);master.gain.setValueAtTime(0.3,t);
  } else if(type==='footstep'){
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.04,audioCtx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.2));
    const ns=audioCtx.createBufferSource();ns.buffer=buf;const g=audioCtx.createGain();
    g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    ns.connect(g);g.connect(master);ns.start(t);ns.stop(t+0.05);master.gain.setValueAtTime(0.2,t);
  }
}
let ambientStarted=false;
function startAmbient(){
  if(ambientStarted||!audioCtx)return;ambientStarted=true;
  // Wind ambient
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*4,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const ns=audioCtx.createBufferSource();ns.buffer=buf;ns.loop=true;
  const filt=audioCtx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=300;
  const g=audioCtx.createGain();g.gain.value=0.03;
  ns.connect(filt);filt.connect(g);g.connect(audioCtx.destination);ns.start();
}

// ===== PARTICLES =====
let particles=[];
function addParticle(x,y,type,count){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2,speed=0.5+Math.random()*3;
    let life,r,g,b,size;
    if(type==='dust'){life=20+Math.random()*20;const v=160+Math.floor(Math.random()*60);r=v;g=v-30;b=v-60;size=2+Math.random()*4;}
    else if(type==='star'){life=30+Math.random()*20;r=255;g=215;b=0;size=2+Math.random()*3;}
    else if(type==='explosion'){life=40+Math.random()*30;r=255;g=Math.floor(80+Math.random()*160);b=Math.floor(Math.random()*40);size=3+Math.random()*5;}
    else if(type==='leaf'){life=40+Math.random()*30;r=34+Math.floor(Math.random()*40);g=140+Math.floor(Math.random()*60);b=22;size=3+Math.random()*4;}
    else if(type==='sparkle'){life=15+Math.random()*10;r=255;g=255;b=200;size=1+Math.random()*2;}
    else{life=25;r=200;g=200;b=200;size=2;}
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1,life,maxLife:life,r,g,b,size,type});
  }
}
function updateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy+=0.05;p.life--;});particles=particles.filter(p=>p.life>0);}
function drawParticles(ctx2){particles.forEach(p=>{const lr=p.life/p.maxLife;ctx2.globalAlpha=lr;ctx2.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
  if(p.type==='leaf'){ctx2.save();ctx2.translate(p.x,p.y);ctx2.rotate(p.life*0.15);ctx2.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx2.restore();}
  else{ctx2.beginPath();ctx2.arc(p.x,p.y,p.size*lr,0,Math.PI*2);ctx2.fill();}});ctx2.globalAlpha=1;}

// ===== SCREEN SHAKE =====
let camShake=0;

// ===== CANVAS =====
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;}
resize();window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ===== GAME STATE =====
let gameActive=false;
let score=0,level=1,levelTimer=0,totalTime=0;
let groundY=0; // set on start
let gameSpeed=5;
let baseSpeed=5;
let dino={x:0,y:0,w:44,h:50,vy:0,jumping:false,ducking:false,duckH:28,frame:0,runFrame:0};
let obstacles=[]; // {x, y, w, h, type: 'cactus'|'cactus_tall'|'cactus_double'|'pterodactyl'|'rock'}
let collectibles=[]; // {x, y, type: 'star'|'meat', w, h}
let clouds=[];
let bgMountains=[];
let groundTiles=[];
let highScore=0;
let obstacleTimer=0;
let collectTimer=0;
let starsCollected=0;
let cactiDodged=0;
let footstepTimer=0;
let levelBannerTimer=0;
let flashTimer=0;
const GRAVITY=0.6;
const JUMP_FORCE=-14;
const LEVEL_TIME=180*60; // 3 minutes in frames at 60fps
const MAX_LEVEL=10;

// ===== OBSTACLE GENERATION =====
function spawnObstacle(){
  const r=Math.random();
  const spd=gameSpeed;
  if(r<0.3){
    // Small cactus
    obstacles.push({x:W+50,y:groundY-36,w:20,h:36,type:'cactus',speed:spd});
  } else if(r<0.5){
    // Tall cactus
    obstacles.push({x:W+50,y:groundY-55,w:22,h:55,type:'cactus_tall',speed:spd});
  } else if(r<0.7){
    // Double cactus
    obstacles.push({x:W+50,y:groundY-40,w:40,h:40,type:'cactus_double',speed:spd});
  } else if(r<0.85&&level>=2){
    // Pterodactyl (flying, must duck)
    const flyY=groundY-dino.h-20-Math.random()*15;
    obstacles.push({x:W+50,y:flyY,w:45,h:25,type:'pterodactyl',speed:spd+1,frame:0});
  } else {
    // Rock
    obstacles.push({x:W+50,y:groundY-22,w:30,h:22,type:'rock',speed:spd});
  }
}

function spawnCollectible(){
  const type=Math.random()<0.7?'star':'meat';
  const yOff=type==='star'?-70-Math.random()*40:-30;
  collectibles.push({x:W+30,y:groundY+yOff,w:20,h:20,type,speed:gameSpeed,glow:0});
}

// ===== DRAWING FUNCTIONS =====
function drawSky(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  if(level<=3){grad.addColorStop(0,'#87CEEB');grad.addColorStop(0.6,'#f0d090');grad.addColorStop(1,'#c2956a');}
  else if(level<=6){grad.addColorStop(0,'#ff9966');grad.addColorStop(0.5,'#ff5e62');grad.addColorStop(1,'#3a1c0f');}
  else{grad.addColorStop(0,'#1a1a3e');grad.addColorStop(0.5,'#2d1b4e');grad.addColorStop(1,'#0a0a1a');}
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
}

function drawMountains(){
  if(bgMountains.length===0){
    for(let i=0;i<8;i++)bgMountains.push({x:i*W/4-W/4,h:80+Math.random()*100,w:W/3+Math.random()*100});
  }
  ctx.fillStyle='rgba(60,40,20,0.3)';
  bgMountains.forEach(m=>{
    ctx.beginPath();ctx.moveTo(m.x,groundY);ctx.lineTo(m.x+m.w/2,groundY-m.h);ctx.lineTo(m.x+m.w,groundY);ctx.fill();
    m.x-=gameSpeed*0.15;if(m.x+m.w<0){m.x=W+Math.random()*100;m.h=80+Math.random()*100;}
  });
}

function drawClouds(){
  if(clouds.length<4&&Math.random()<0.01)clouds.push({x:W+50,y:30+Math.random()*80,w:60+Math.random()*80,h:20+Math.random()*20});
  ctx.fillStyle=level<=3?'rgba(255,255,255,0.7)':level<=6?'rgba(255,200,150,0.4)':'rgba(100,80,120,0.3)';
  clouds.forEach(c=>{
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x-c.w*0.25,c.y+5,c.w*0.3,c.h*0.4,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+c.w*0.25,c.y+3,c.w*0.35,c.h*0.45,0,0,Math.PI*2);ctx.fill();
    c.x-=gameSpeed*0.3;
  });
  clouds=clouds.filter(c=>c.x+c.w>-50);
}

function drawGround(){
  // Main ground
  ctx.fillStyle='#8B6914';ctx.fillRect(0,groundY,W,H-groundY);
  // Ground line
  ctx.strokeStyle='#6B4F12';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();
  // Ground texture - dashes moving
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;
  const offset=(Date.now()*gameSpeed*0.3)%40;
  for(let x=-offset;x<W;x+=40){
    ctx.beginPath();ctx.moveTo(x,groundY+8);ctx.lineTo(x+15,groundY+8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+20,groundY+18);ctx.lineTo(x+30,groundY+18);ctx.stroke();
  }
}

function drawDino(){
  const dx=dino.x,dy=dino.y;
  const w=dino.w,h=dino.ducking?dino.duckH:dino.h;
  
  // Flash on hit
  if(flashTimer>0){ctx.globalAlpha=Math.sin(flashTimer*0.5)>0?1:0.3;flashTimer--;}
  
  ctx.save();
  // Body
  const bodyColor='#2d8a4e';const bellyColor='#7ec89a';
  
  if(dino.ducking){
    // Ducking dino - wider, shorter
    ctx.fillStyle=bodyColor;
    ctx.fillRect(dx-5,dy+h-20,w+10,20);
    ctx.fillStyle=bellyColor;
    ctx.fillRect(dx,dy+h-14,w,10);
    // Head
    ctx.fillStyle=bodyColor;
    ctx.fillRect(dx+w-5,dy+h-26,18,16);
    // Eye
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(dx+w+6,dy+h-22,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(dx+w+7,dy+h-22,2,0,Math.PI*2);ctx.fill();
    // Legs
    ctx.fillStyle=bodyColor;
    const legFrame=Math.sin(dino.runFrame*0.3)*5;
    ctx.fillRect(dx+5,dy+h,6,8+legFrame);
    ctx.fillRect(dx+w-10,dy+h,6,8-legFrame);
  } else {
    // Standing dino
    // Tail
    ctx.fillStyle=bodyColor;
    ctx.beginPath();ctx.moveTo(dx-8,dy+20);ctx.lineTo(dx-20,dy+10);ctx.lineTo(dx-5,dy+25);ctx.fill();
    // Body
    ctx.fillRect(dx,dy+8,w-8,h-20);
    // Belly
    ctx.fillStyle=bellyColor;
    ctx.fillRect(dx+4,dy+16,w-16,h-30);
    // Head
    ctx.fillStyle=bodyColor;
    ctx.fillRect(dx+w-20,dy-8,26,24);
    // Eye
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(dx+w-2,dy-1,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(dx+w-1,dy-1,2.5,0,Math.PI*2);ctx.fill();
    // Mouth
    ctx.strokeStyle='#1a5a2e';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(dx+w,dy+8);ctx.lineTo(dx+w+6,dy+8);ctx.stroke();
    // Arms
    ctx.fillStyle=bodyColor;
    ctx.fillRect(dx+w-18,dy+18,8,12);
    // Legs
    if(dino.jumping){
      ctx.fillRect(dx+5,dy+h-12,8,14);ctx.fillRect(dx+20,dy+h-12,8,14);
    } else {
      const lf=Math.sin(dino.runFrame*0.3)*8;
      ctx.fillRect(dx+5,dy+h-12,8,12+lf);
      ctx.fillRect(dx+20,dy+h-12,8,12-lf);
    }
    // Spikes on back
    ctx.fillStyle='#1a6a3a';
    for(let i=0;i<4;i++){
      const sx=dx+5+i*9,sy=dy+6;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+4,sy-7);ctx.lineTo(sx+8,sy);ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawObstacle(o){
  if(o.type==='cactus'||o.type==='cactus_tall'){
    // Green cactus
    ctx.fillStyle='#2d8a2d';
    ctx.fillRect(o.x+6,o.y,o.w-12,o.h);
    // Arms
    ctx.fillRect(o.x,o.y+o.h*0.3,8,10);
    ctx.fillRect(o.x,o.y+o.h*0.3-8,8,8);
    ctx.fillRect(o.x+o.w-8,o.y+o.h*0.5,8,10);
    ctx.fillRect(o.x+o.w-8,o.y+o.h*0.5-8,8,8);
    // Spines
    ctx.strokeStyle='#90ee90';ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      const sy=o.y+10+i*(o.h/4);
      ctx.beginPath();ctx.moveTo(o.x+o.w/2-2,sy);ctx.lineTo(o.x-3,sy-3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(o.x+o.w/2+2,sy);ctx.lineTo(o.x+o.w+3,sy-3);ctx.stroke();
    }
  } else if(o.type==='cactus_double'){
    for(let j=0;j<2;j++){
      const cx=o.x+j*22;
      ctx.fillStyle='#2d8a2d';ctx.fillRect(cx+4,o.y,12,o.h);
      ctx.fillRect(cx,o.y+o.h*0.35,6,8);ctx.fillRect(cx,o.y+o.h*0.35-6,6,6);
    }
  } else if(o.type==='pterodactyl'){
    // Flying dinosaur
    o.frame=(o.frame||0)+0.08;
    const wingY=Math.sin(o.frame*3)*10;
    ctx.fillStyle='#8B4513';
    // Body
    ctx.fillRect(o.x+10,o.y+8,25,10);
    // Head
    ctx.fillRect(o.x+32,o.y+5,15,10);
    // Beak
    ctx.fillStyle='#f59e0b';ctx.fillRect(o.x+44,o.y+8,8,4);
    // Wings
    ctx.fillStyle='#a0522d';
    ctx.beginPath();ctx.moveTo(o.x+12,o.y+10);ctx.lineTo(o.x,o.y+wingY);ctx.lineTo(o.x+25,o.y+10);ctx.fill();
    ctx.beginPath();ctx.moveTo(o.x+15,o.y+10);ctx.lineTo(o.x+5,o.y+20-wingY);ctx.lineTo(o.x+28,o.y+10);ctx.fill();
    // Eye
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(o.x+38,o.y+8,2,0,Math.PI*2);ctx.fill();
  } else if(o.type==='rock'){
    ctx.fillStyle='#666';
    ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+5,o.y);ctx.lineTo(o.x+o.w-5,o.y+2);
    ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();
    ctx.fillStyle='#888';
    ctx.beginPath();ctx.moveTo(o.x+5,o.y);ctx.lineTo(o.x+15,o.y-5);ctx.lineTo(o.x+o.w-5,o.y+2);ctx.fill();
  }
}

function drawCollectible(c){
  c.glow=(c.glow||0)+0.08;
  const pulse=1+Math.sin(c.glow)*0.15;
  ctx.save();ctx.translate(c.x+c.w/2,c.y+c.h/2);ctx.scale(pulse,pulse);
  if(c.type==='star'){
    ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=10;
    ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⭐',0,0);
  } else {
    ctx.fillStyle='#ef4444';ctx.shadowColor='#ef4444';ctx.shadowBlur=8;
    ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍖',0,0);
  }
  ctx.restore();ctx.shadowBlur=0;
}

// ===== COLLISION =====
function checkCollision(a,b){
  const pad=4;
  return a.x+pad<b.x+b.w-pad&&a.x+a.w-pad>b.x+pad&&a.y+pad<b.y+b.h-pad&&a.y+a.h-pad>b.y+pad;
}

// ===== MAIN UPDATE =====
function update(){
  if(!gameActive)return;
  
  // Timers
  totalTime++;
  levelTimer++;
  dino.runFrame++;
  
  // Level up every 3 minutes
  if(levelTimer>=LEVEL_TIME&&level<MAX_LEVEL){
    level++;levelTimer=0;
    gameSpeed=baseSpeed+level*1.2;
    showLevelBanner();
    playSound('levelup');
    addParticle(dino.x+dino.w/2,dino.y,'star',20);
  }
  
  // Score
  score+=Math.floor(gameSpeed*0.5);
  
  // Dino physics
  if(dino.jumping){
    dino.vy+=GRAVITY;
    dino.y+=dino.vy;
    if(dino.y>=groundY-dino.h){
      dino.y=groundY-dino.h;dino.vy=0;dino.jumping=false;
      playSound('land');addParticle(dino.x+dino.w/2,groundY,'dust',8);
    }
  }
  
  // Footstep sound
  if(!dino.jumping&&!dino.ducking){
    footstepTimer++;
    if(footstepTimer>=Math.floor(18/Math.max(1,gameSpeed/5))){footstepTimer=0;playSound('footstep');}
  }
  
  // Dust while running
  if(!dino.jumping&&Math.random()<0.15){
    addParticle(dino.x+5,groundY-2,'dust',1);
  }
  
  // Spawn obstacles
  obstacleTimer++;
  const spawnRate=Math.max(40,90-level*5);
  if(obstacleTimer>=spawnRate){
    obstacleTimer=0;
    if(Math.random()<0.7+level*0.03)spawnObstacle();
  }
  
  // Spawn collectibles
  collectTimer++;
  if(collectTimer>=120+Math.random()*60){collectTimer=0;spawnCollectible();}
  
  // Move obstacles
  obstacles.forEach(o=>{o.x-=o.speed||gameSpeed;});
  obstacles=obstacles.filter(o=>o.x+o.w>-50);
  
  // Move collectibles
  collectibles.forEach(c=>{c.x-=c.speed||gameSpeed;});
  collectibles=collectibles.filter(c=>c.x+c.w>-30);
  
  // Collision with obstacles
  const dinoBox={x:dino.x,y:dino.y+(dino.ducking?dino.h-dino.duckH:0),w:dino.w,h:dino.ducking?dino.duckH:dino.h};
  for(let o of obstacles){
    if(checkCollision(dinoBox,o)){
      gameOver();return;
    }
  }
  
  // Collision with collectibles
  for(let i=collectibles.length-1;i>=0;i--){
    if(checkCollision(dinoBox,collectibles[i])){
      const c=collectibles[i];
      if(c.type==='star'){score+=500;starsCollected++;playSound('collect');addParticle(c.x,c.y,'star',12);}
      else{score+=200;playSound('collect');addParticle(c.x,c.y,'sparkle',8);}
      collectibles.splice(i,1);
    }
  }
  
  // Track dodged cacti
  obstacles.forEach(o=>{
    if(!o.counted&&o.x+o.w<dino.x){o.counted=true;cactiDodged++;score+=50;}
  });
  
  camShake*=0.9;
  
  updateHUD();
}

function gameOver(){
  gameActive=false;
  playSound('hit');playSound('gameover');
  camShake=15;
  addParticle(dino.x+dino.w/2,dino.y+dino.h/2,'explosion',30);
  flashTimer=30;
  
  setTimeout(()=>{
    document.getElementById('hud').style.display='none';
    document.getElementById('jumpBtn').style.display='none';
    document.getElementById('duckBtn').style.display='none';
    const go=document.getElementById('gameOver');
    go.style.display='flex';
    const mins=Math.floor(totalTime/3600);const secs=Math.floor((totalTime%3600)/60);
    document.getElementById('goStats').innerHTML=`
      Score: ${score.toLocaleString()}<br>
      Level Reached: ${level}<br>
      Time Survived: ${mins}:${secs.toString().padStart(2,'0')}<br>
      Stars Collected: ${starsCollected}<br>
      Obstacles Dodged: ${cactiDodged}
    `;
  },1500);
}

function showLevelBanner(){
  const banner=document.getElementById('levelBanner');
  banner.textContent=`LEVEL ${level}!`;
  banner.style.display='block';
  levelBannerTimer=120;
}

function updateHUD(){
  document.getElementById('hudScore').textContent='Score: '+score.toLocaleString();
  document.getElementById('hudLevel').textContent='Level '+level;
  const remaining=Math.max(0,LEVEL_TIME-levelTimer);
  const mins=Math.floor(remaining/3600);const secs=Math.floor((remaining%3600)/60);
  document.getElementById('hudTime').textContent=mins+':'+secs.toString().padStart(2,'0');
}

// ===== RENDER =====
function render(){
  ctx.save();
  if(camShake>0.5){
    ctx.translate((Math.random()-0.5)*camShake,(Math.random()-0.5)*camShake);
  }
  
  drawSky();
  drawMountains();
  drawClouds();
  drawGround();
  
  // Draw collectibles
  collectibles.forEach(c=>drawCollectible(c));
  
  // Draw obstacles
  obstacles.forEach(o=>drawObstacle(o));
  
  // Draw dino
  drawDino();
  
  // Draw particles
  drawParticles(ctx);
  
  ctx.restore();
  
  // Level banner
  if(levelBannerTimer>0){
    levelBannerTimer--;
    if(levelBannerTimer<=0)document.getElementById('levelBanner').style.display='none';
  }
}

// ===== GAME LOOP =====
function gameLoop(){
  try{
    update();
    render();
    updateParticles();
  }catch(e){console.error(e);}
  requestAnimationFrame(gameLoop);
}

// ===== INPUT =====
let keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if((e.code==='Space'||e.code==='ArrowUp')&&gameActive){
    e.preventDefault();
    if(!dino.jumping){dino.jumping=true;dino.vy=JUMP_FORCE;dino.ducking=false;playSound('jump');addParticle(dino.x+dino.w/2,groundY,'dust',5);}
  }
  if(e.code==='ArrowDown'&&gameActive&&!dino.jumping){
    dino.ducking=true;playSound('duck');
  }
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='ArrowDown')dino.ducking=false;
});

// Mobile buttons
function jumpPress(e){e.preventDefault();if(gameActive&&!dino.jumping){dino.jumping=true;dino.vy=JUMP_FORCE;dino.ducking=false;playSound('jump');addParticle(dino.x+dino.w/2,groundY,'dust',5);}}
function jumpRelease(e){e.preventDefault();}
function duckPress(e){e.preventDefault();if(gameActive&&!dino.jumping){dino.ducking=true;playSound('duck');}}
function duckRelease(e){e.preventDefault();dino.ducking=false;}

// Tap anywhere to jump (simple mobile fallback)
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameActive&&!dino.jumping){dino.jumping=true;dino.vy=JUMP_FORCE;dino.ducking=false;playSound('jump');addParticle(dino.x+dino.w/2,groundY,'dust',5);}
});

// ===== START =====
function startGame(){
  ensureAudio();startAmbient();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('jumpBtn').style.display='block';
  document.getElementById('duckBtn').style.display='block';
  
  resize();
  groundY=H*0.75;
  dino.x=W*0.12;
  dino.y=groundY-dino.h;
  score=0;level=1;levelTimer=0;totalTime=0;
  gameSpeed=baseSpeed;obstacleTimer=0;collectTimer=0;
  starsCollected=0;cactiDodged=0;
  obstacles=[];collectibles=[];particles=[];
  clouds=[];bgMountains=[];
  gameActive=true;
}

// Attract mode
function attractLoop(){
  groundY=H*0.75;
  drawSky();drawMountains();drawClouds();drawGround();
  // Idle dino
  dino.x=W*0.12;dino.y=groundY-dino.h;dino.runFrame++;
  drawDino();
  // Some cacti
  const t=Date.now()*0.001;
  [{x:W*0.5+Math.sin(t)*30,type:'cactus',y:groundY-36,w:20,h:36},
   {x:W*0.7+Math.cos(t*0.7)*20,type:'cactus_tall',y:groundY-55,w:22,h:55}].forEach(o=>drawObstacle(o));
  // Floating stars
  if(Math.random()<0.03)addParticle(W*0.5+Math.random()*200,groundY-60-Math.random()*40,'star',1);
  drawParticles(ctx);updateParticles();
}
function attractFrame(){if(document.getElementById('startScreen').style.display!=='none'){attractLoop();}requestAnimationFrame(attractFrame);}
attractFrame();

requestAnimationFrame(gameLoop);
</script>
