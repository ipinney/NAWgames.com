<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Nuggets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================================
// CHICKEN NUGGETS - NAW Games
// A top-down farmyard rescue game with physics, particles, and sounds
// ============================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// World constants
const WORLD_W = 1400;
const WORLD_H = 1000;

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

// Game states
const GAME_STATE = {
    START: 0,
    PLAYING: 1,
    LEVEL_COMPLETE: 2,
    GAME_OVER: 3
};

// ============================================================================
// GLOBAL GAME STATE
// ============================================================================

let gameState = GAME_STATE.START;
let currentLevel = 1;
let cameraX = 0;
let cameraY = 0;
let particles = [];

// Level config
const levels = [
    { chickens: 8, saveTarget: 5, timeLimit: 65, hawkSwoopInterval: 8 },
    { chickens: 10, saveTarget: 7, timeLimit: 60, hawkSwoopInterval: 6 },
    { chickens: 12, saveTarget: 9, timeLimit: 55, hawkSwoopInterval: 5 },
    { chickens: 14, saveTarget: 10, timeLimit: 50, hawkSwoopInterval: 4 },
];

function getLevelConfig() {
    const idx = Math.min(currentLevel - 1, levels.length - 1);
    return levels[idx];
}

// ============================================================================
// WORLD GENERATION (at init time, NOT in draw loops)
// ============================================================================

let grassColors = [];
let grassTufts = [];
let flowers = [];
let hayBales = [];
let fence = [];

function initWorldGeneration() {
    // Generate grass color grid (DETERMINISTIC, not random in draw)
    // Use 20px tiles with VERY subtle color variation — just 3-5 RGB units
    const GRASS_COLS = Math.ceil(WORLD_W / 20);
    const GRASS_ROWS = Math.ceil(WORLD_H / 20);
    grassColors = [];

    for (let r = 0; r < GRASS_ROWS; r++) {
        grassColors[r] = [];
        for (let c = 0; c < GRASS_COLS; c++) {
            // Deterministic hash, subtle variation only
            const hash = ((r * 7 + c * 13 + r * c * 3) % 6);
            // Base green: rgb(76, 153, 56) with +/- 5 variation
            const g = 148 + hash * 2;      // 148-158 range
            const rb = 54 + hash;           // 54-59 range
            grassColors[r][c] = `rgb(${rb + 18}, ${g}, ${rb})`;
        }
    }

    // Pre-generate grass tufts (small decorative V-shapes)
    grassTufts = [];
    for (let i = 0; i < 150; i++) {
        grassTufts.push({
            x: seededRandom(i * 17) * WORLD_W,
            y: seededRandom(i * 23) * WORLD_H,
            size: seededRandom(i * 41) * 3 + 2
        });
    }

    // Pre-generate flowers (small colored dots)
    flowers = [];
    const flowerColors = ['#FFD700', '#FFFFFF', '#FFB6C1', '#DDA0DD', '#87CEEB'];
    for (let i = 0; i < 80; i++) {
        flowers.push({
            x: seededRandom(i * 31) * WORLD_W,
            y: seededRandom(i * 37) * WORLD_H,
            color: flowerColors[Math.floor(seededRandom(i * 43) * flowerColors.length)],
            size: seededRandom(i * 47) * 1.5 + 1
        });
    }

    // Pre-generate hay bales (6-8 scattered around)
    hayBales = [];
    const hayPositions = [
        { x: 200, y: 150 },
        { x: 1100, y: 200 },
        { x: 300, y: 700 },
        { x: 900, y: 600 },
        { x: 600, y: 850 },
        { x: 1200, y: 500 },
        { x: 250, y: 450 },
    ];
    for (let i = 0; i < hayPositions.length; i++) {
        hayBales.push({
            x: hayPositions[i].x,
            y: hayPositions[i].y,
            w: 50,
            h: 35,
        });
    }

    // Fence around perimeter
    fence = [];
    const fenceSpacing = 40;
    // Top and bottom
    for (let x = 0; x < WORLD_W; x += fenceSpacing) {
        fence.push({ x1: x, y1: 10, x2: x + fenceSpacing, y2: 10 });
        fence.push({ x1: x, y1: WORLD_H - 10, x2: x + fenceSpacing, y2: WORLD_H - 10 });
    }
    // Left and right
    for (let y = 0; y < WORLD_H; y += fenceSpacing) {
        fence.push({ x1: 10, y1: y, x2: 10, y2: y + fenceSpacing });
        fence.push({ x1: WORLD_W - 10, y1: y, x2: WORLD_W - 10, y2: y + fenceSpacing });
    }
}

// Simple seeded random (deterministic based on seed)
function seededRandom(seed) {
    const x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

// ============================================================================
// PLAYER (FARMER)
// ============================================================================

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.speed = 150;
        this.width = 24;
        this.height = 40;
        this.carryingChickens = [];
        this.direction = 1; // 1 = right, -1 = left
        this.legOffset = 0;
        this.animTime = 0;
    }

    update(dt, inputX, inputY) {
        // Movement
        const mag = Math.sqrt(inputX * inputX + inputY * inputY);
        if (mag > 0.1) {
            this.vx = (inputX / mag) * this.speed;
            this.vy = (inputY / mag) * this.speed;
            if (inputX !== 0) this.direction = inputX > 0 ? 1 : -1;
        } else {
            this.vx = 0;
            this.vy = 0;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Clamp to world
        this.x = Math.max(this.width / 2, Math.min(WORLD_W - this.width / 2, this.x));
        this.y = Math.max(this.height / 2, Math.min(WORLD_H - this.height / 2, this.y));

        // Walking animation
        this.animTime += dt;
        if (mag > 0.1) {
            this.legOffset = Math.sin(this.animTime * 8) * 3;
        } else {
            this.legOffset = 0;
        }
    }

    draw(ctx) {
        ctx.save();

        // Glow ring so player pops against background
        ctx.fillStyle = 'rgba(255, 255, 100, 0.15)';
        ctx.beginPath();
        ctx.arc(this.x, this.y - 4, 28, 0, Math.PI * 2);
        ctx.fill();

        // Shadow on ground
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 16, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Dark outline for all parts
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2.5;

        // Body (blue overalls) - large rounded rectangle
        ctx.fillStyle = '#003DA5';
        roundRect(ctx, this.x - 14, this.y - 10, 28, 22, 4);
        ctx.fill();
        ctx.stroke();

        // Overall straps
        ctx.strokeStyle = '#0050CC';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - 8, this.y - 10);
        ctx.lineTo(this.x - 5, this.y - 15);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x + 8, this.y - 10);
        ctx.lineTo(this.x + 5, this.y - 15);
        ctx.stroke();

        // Face (peach circle)
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = '#F0C8A0';
        ctx.beginPath();
        ctx.arc(this.x, this.y - 18, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x - 3, this.y - 19, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x + 3, this.y - 19, 2, 0, Math.PI * 2);
        ctx.fill();

        // Smile
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y - 16, 4, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // Hat (brown straw, wider than face)
        ctx.fillStyle = '#C47A2C';
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        // Hat brim
        roundRect(ctx, this.x - 14, this.y - 28, 28, 6, 2);
        ctx.fill();
        ctx.stroke();
        // Hat crown
        roundRect(ctx, this.x - 8, this.y - 34, 16, 8, 2);
        ctx.fill();
        ctx.stroke();

        // Boots (brown)
        ctx.fillStyle = '#654321';
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        const legOffL = this.legOffset;
        const legOffR = -this.legOffset;
        roundRect(ctx, this.x - 9, this.y + 10 + legOffL, 7, 10, 2);
        ctx.fill();
        ctx.stroke();
        roundRect(ctx, this.x + 2, this.y + 10 + legOffR, 7, 10, 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    pickUpChicken(chicken) {
        this.carryingChickens.push(chicken);
        addParticles(this.x, this.y, 3, 'sparkle');
    }

    dropChickens(barn) {
        const saved = this.carryingChickens.filter(c => {
            const dx = barn.x - c.x;
            const dy = barn.y - c.y;
            return Math.sqrt(dx * dx + dy * dy) < 60;
        });

        for (let c of saved) {
            c.saved = true;
            addParticles(c.x, c.y, 5, 'feather');
        }

        this.carryingChickens = this.carryingChickens.filter(c => !c.saved);
        return saved.length;
    }
}

// ============================================================================
// CHICKENS
// ============================================================================

class Chicken {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 60;
        this.vy = (Math.random() - 0.5) * 60;
        this.speed = 60;
        this.width = 20;
        this.height = 20;
        this.alive = true;
        this.saved = false;
        this.scaredTime = 0;
        this.bobOffset = Math.random() * Math.PI * 2;
        this.direction = this.vx > 0 ? 1 : -1;
    }

    update(dt, player, hawk, allChickens) {
        if (!this.alive || this.saved) return;

        // Scare if hawk is near
        const dxH = hawk.x - this.x;
        const dyH = hawk.y - this.y;
        const distH = Math.sqrt(dxH * dxH + dyH * dyH);

        if (distH < 150) {
            this.scaredTime = 0.5;
        }

        if (this.scaredTime > 0) {
            this.scaredTime -= dt;
            // Flee from hawk
            this.vx = (-dxH / distH) * this.speed * 1.5;
            this.vy = (-dyH / distH) * this.speed * 1.5;
        } else {
            // Wander randomly
            if (Math.random() < 0.02) {
                this.vx = (Math.random() - 0.5) * this.speed;
                this.vy = (Math.random() - 0.5) * this.speed;
            }
        }

        // Collision with other chickens (simple)
        for (let other of allChickens) {
            if (other === this || !other.alive || other.saved) continue;
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < 20) {
                const angle = Math.atan2(dy, dx);
                this.vx = -Math.cos(angle) * 30;
                this.vy = -Math.sin(angle) * 30;
            }
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Clamp to world
        this.x = Math.max(this.width / 2, Math.min(WORLD_W - this.width / 2, this.x));
        this.y = Math.max(this.height / 2, Math.min(WORLD_H - this.height / 2, this.y));

        // Update direction
        if (Math.abs(this.vx) > 5) this.direction = this.vx > 0 ? 1 : -1;

        this.bobOffset += dt * 3;
    }

    draw(ctx) {
        ctx.save();

        const bobY = Math.sin(this.bobOffset) * 2;
        const scared = this.scaredTime > 0;

        // Body (white fluffy circles)
        ctx.fillStyle = '#FFF';
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;

        // Front circle
        ctx.beginPath();
        ctx.arc(this.x + 3, this.y + bobY, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Back circle
        ctx.beginPath();
        ctx.arc(this.x - 5, this.y + bobY, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Comb (red triangle)
        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 10 + bobY);
        ctx.lineTo(this.x - 3, this.y - 6 + bobY);
        ctx.lineTo(this.x + 3, this.y - 6 + bobY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Eyes (bigger if scared)
        ctx.fillStyle = '#000';
        const eyeSize = scared ? 2 : 1.5;
        ctx.beginPath();
        ctx.arc(this.x + 5, this.y - 2 + bobY, eyeSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x + 9, this.y - 2 + bobY, eyeSize, 0, Math.PI * 2);
        ctx.fill();

        // Beak (orange, pointing in direction)
        ctx.fillStyle = '#FF8800';
        const beakDir = this.direction;
        const beakX = this.x + 10 * beakDir;
        ctx.beginPath();
        ctx.moveTo(beakX, this.y + 1 + bobY);
        ctx.lineTo(beakX + 3 * beakDir, this.y - 1 + bobY);
        ctx.lineTo(beakX + 3 * beakDir, this.y + 3 + bobY);
        ctx.closePath();
        ctx.fill();

        // Feet (orange sticks)
        ctx.strokeStyle = '#FF8800';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x + 2, this.y + 9 + bobY);
        ctx.lineTo(this.x + 2, this.y + 13 + bobY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x + 6, this.y + 9 + bobY);
        ctx.lineTo(this.x + 6, this.y + 13 + bobY);
        ctx.stroke();

        ctx.restore();
    }
}

// ============================================================================
// HAWK
// ============================================================================

class Hawk {
    constructor() {
        this.centerX = WORLD_W / 2;
        this.centerY = WORLD_H / 2;
        this.radius = 250;
        this.angle = 0;
        this.x = this.centerX + this.radius;
        this.y = this.centerY;
        this.speed = 0.5;
        this.size = 30;

        this.telegraphTime = 0;
        this.swoopTime = 0;
        this.targetChicken = null;
        this.nextSwoopTime = 0;
    }

    update(dt, chickens, currentTime) {
        // Normal circling
        this.angle += this.speed * dt;
        this.x = this.centerX + Math.cos(this.angle) * this.radius;
        this.y = this.centerY + Math.sin(this.angle) * this.radius;

        // Handle swoop sequence
        if (this.telegraphTime > 0) {
            this.telegraphTime -= dt;
            if (this.telegraphTime <= 0) {
                // Start swoop
                const alive = chickens.filter(c => c.alive && !c.saved);
                if (alive.length > 0) {
                    this.targetChicken = alive[Math.floor(Math.random() * alive.length)];
                    this.swoopTime = 0.6;
                    playSound('screech');
                }
            }
        }

        if (this.swoopTime > 0) {
            this.swoopTime -= dt;
            if (this.targetChicken) {
                // Swoop toward target
                const progress = 1 - (this.swoopTime / 0.6);
                this.x = this.x + (this.targetChicken.x - this.x) * 0.15;
                this.y = this.y + (this.targetChicken.y - this.y) * 0.15;

                if (progress > 0.7) {
                    // Grab attempt
                    const dx = this.targetChicken.x - this.x;
                    const dy = this.targetChicken.y - this.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        this.targetChicken.alive = false;
                        addParticles(this.targetChicken.x, this.targetChicken.y, 8, 'feather');
                    }
                }
            }
        }

        // Schedule next swoop
        if (currentTime > this.nextSwoopTime) {
            const config = getLevelConfig();
            this.nextSwoopTime = currentTime + config.hawkSwoopInterval;
            this.telegraphTime = 1.0;
            playSound('warning');
        }
    }

    draw(ctx) {
        ctx.save();

        // Shadow on ground
        const shadowX = this.x;
        const shadowY = this.y + 30;
        const shadowColor = this.telegraphTime > 0 ? 'rgba(255, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.2)';
        ctx.fillStyle = shadowColor;
        ctx.beginPath();
        ctx.ellipse(shadowX, shadowY, this.size * 1.2, this.size * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pulsing glow if telegraphing
        if (this.telegraphTime > 0) {
            const pulse = Math.sin(this.telegraphTime * Math.PI * 4) * 0.5 + 0.5;
            ctx.strokeStyle = `rgba(255, 0, 0, ${pulse * 0.6})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(shadowX, shadowY, this.size * 1.2 * (1 + pulse * 0.3), this.size * 0.4 * (1 + pulse * 0.3), 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Hawk body (dark brown ellipse)
        ctx.fillStyle = '#3D2817';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.size * 0.6, this.size * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2A1810';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Wings (left and right)
        ctx.fillStyle = '#2A1810';
        ctx.beginPath();
        ctx.ellipse(this.x - this.size * 0.7, this.y, this.size * 0.5, this.size * 0.2, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(this.x + this.size * 0.7, this.y, this.size * 0.5, this.size * 0.2, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    isTelegraphing() {
        return this.telegraphTime > 0;
    }
}

// ============================================================================
// BARN
// ============================================================================

class Barn {
    constructor() {
        this.x = WORLD_W - 80;
        this.y = WORLD_H / 2;
        this.w = 60;
        this.h = 80;
        this.glowTime = 0;
    }

    update(dt) {
        this.glowTime += dt;
    }

    draw(ctx) {
        ctx.save();

        // Glow ring
        const glowPulse = Math.sin(this.glowTime * 2) * 0.5 + 0.5;
        ctx.strokeStyle = `rgba(255, 215, 0, ${glowPulse * 0.4})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 120, 0, Math.PI * 2);
        ctx.stroke();

        // Barn body (red)
        ctx.fillStyle = '#D32F2F';
        ctx.fillRect(this.x - this.w / 2, this.y - this.h / 2 + 10, this.w, this.h - 20);

        // Roof (brown triangle)
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.moveTo(this.x - this.w / 2 - 5, this.y - this.h / 2 + 10);
        ctx.lineTo(this.x, this.y - this.h / 2 - 15);
        ctx.lineTo(this.x + this.w / 2 + 5, this.y - this.h / 2 + 10);
        ctx.closePath();
        ctx.fill();

        // Door with X pattern (white)
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x - 12, this.y - 10, 24, 30);
        ctx.beginPath();
        ctx.moveTo(this.x - 12, this.y - 10);
        ctx.lineTo(this.x + 12, this.y + 20);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x + 12, this.y - 10);
        ctx.lineTo(this.x - 12, this.y + 20);
        ctx.stroke();

        // "COOP" text
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 1;
        ctx.fillText('COOP', this.x, this.y - this.h / 2 - 10);

        ctx.restore();
    }
}

// ============================================================================
// PARTICLES
// ============================================================================

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.life = 1;
        this.maxLife = type === 'feather' ? 2 : type === 'sparkle' ? 0.5 : 1.5;

        if (type === 'feather') {
            this.vx = (Math.random() - 0.5) * 80;
            this.vy = -Math.random() * 60 - 20;
            this.spinSpeed = Math.random() * 8;
            this.spin = 0;
            this.size = 4;
        } else if (type === 'sparkle') {
            this.vx = (Math.random() - 0.5) * 120;
            this.vy = (Math.random() - 0.5) * 120;
            this.size = 3;
        } else if (type === 'dust') {
            this.vx = (Math.random() - 0.5) * 40;
            this.vy = Math.random() * 20;
            this.size = 2 + Math.random() * 2;
        }
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt / this.maxLife;

        if (this.type === 'feather') {
            this.spin += this.spinSpeed * dt;
            this.vy += 20 * dt; // gravity
        }
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life);

        if (this.type === 'feather') {
            ctx.save();
            ctx.globalAlpha = alpha * 0.7;
            ctx.fillStyle = '#FFF';
            ctx.translate(this.x, this.y);
            ctx.rotate(this.spin);
            ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
            ctx.restore();
        } else if (this.type === 'sparkle') {
            ctx.save();
            ctx.globalAlpha = alpha * 0.8;
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (this.type === 'dust') {
            ctx.save();
            ctx.globalAlpha = alpha * 0.5;
            ctx.fillStyle = '#8B7355';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
}

function addParticles(x, y, count, type) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, type));
    }
}

// ============================================================================
// INPUT HANDLING
// ============================================================================

let inputX = 0;
let inputY = 0;
let keys = {};

document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

let touchX = 0;
let touchY = 0;
let touching = false;

document.addEventListener('touchstart', e => {
    const touch = e.touches[0];
    touchX = touch.clientX;
    touchY = touch.clientY;
    touching = true;
}, { passive: true });

document.addEventListener('touchmove', e => {
    if (!touching) return;
    const touch = e.touches[0];
    touchX = touch.clientX;
    touchY = touch.clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
    touching = false;
}, { passive: true });

function updateInput() {
    inputX = 0;
    inputY = 0;

    if (keys['w'] || keys['arrowup']) inputY -= 1;
    if (keys['s'] || keys['arrowdown']) inputY += 1;
    if (keys['a'] || keys['arrowleft']) inputX -= 1;
    if (keys['d'] || keys['arrowright']) inputX += 1;

    // Mobile joystick (bottom-left)
    if (touching && W > 600) { // Only on touch devices
        const joyX = 50;
        const joyY = H - 50;
        const dx = touchX - joyX;
        const dy = touchY - joyY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 10) {
            inputX = dx / Math.max(30, dist);
            inputY = dy / Math.max(30, dist);
        }
    }
}

// ============================================================================
// SOUNDS (Web Audio API)
// ============================================================================

let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        gain.gain.setValueAtTime(0.1, now);

        if (type === 'cluck') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'screech') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'warning') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'footstep') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'victory') {
            const notes = [261.63, 329.63, 392, 523.25];
            for (let i = 0; i < notes.length; i++) {
                const noteOsc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                noteOsc.connect(noteGain);
                noteGain.connect(audioCtx.destination);
                noteOsc.type = 'sine';
                noteOsc.frequency.setValueAtTime(notes[i], now + i * 0.15);
                noteGain.gain.setValueAtTime(0.1, now + i * 0.15);
                noteGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.15);
                noteOsc.start(now + i * 0.15);
                noteOsc.stop(now + i * 0.15 + 0.15);
            }
        } else if (type === 'gameover') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'chime') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    } catch (e) {
        // Silently fail if audio fails
    }
}

// ============================================================================
// DRAWING HELPERS
// ============================================================================

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ============================================================================
// GAME WORLD DRAWING
// ============================================================================

function drawWorld(ctx) {
    ctx.save();

    // Translate to camera
    ctx.translate(-cameraX, -cameraY);

    // Draw grass (read from pre-generated color array, NO randomization)
    const GRASS_SIZE = 20;
    const GRASS_COLS = Math.ceil(WORLD_W / GRASS_SIZE);
    const GRASS_ROWS = Math.ceil(WORLD_H / GRASS_SIZE);

    for (let r = 0; r < GRASS_ROWS; r++) {
        for (let c = 0; c < GRASS_COLS; c++) {
            ctx.fillStyle = grassColors[r][c];
            ctx.fillRect(c * GRASS_SIZE, r * GRASS_SIZE, GRASS_SIZE, GRASS_SIZE);
        }
    }

    // Draw fence (brown lines)
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 3;
    for (let f of fence) {
        ctx.beginPath();
        ctx.moveTo(f.x1, f.y1);
        ctx.lineTo(f.x2, f.y2);
        ctx.stroke();
    }

    // Draw hay bales (golden yellow with rounded shape and shadow)
    for (let bale of hayBales) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        roundRect(ctx, bale.x - bale.w / 2 + 3, bale.y - bale.h / 2 + 3, bale.w, bale.h, 8);
        ctx.fill();
        // Main bale body
        ctx.fillStyle = '#E8D44D';
        roundRect(ctx, bale.x - bale.w / 2, bale.y - bale.h / 2, bale.w, bale.h, 8);
        ctx.fill();
        // Dark outline
        ctx.strokeStyle = '#C4A830';
        ctx.lineWidth = 2;
        roundRect(ctx, bale.x - bale.w / 2, bale.y - bale.h / 2, bale.w, bale.h, 8);
        ctx.stroke();
        // Straw texture (horizontal lines)
        ctx.strokeStyle = 'rgba(180, 140, 20, 0.4)';
        ctx.lineWidth = 1;
        for (let i = 5; i < bale.h - 4; i += 5) {
            ctx.beginPath();
            ctx.moveTo(bale.x - bale.w / 2 + 4, bale.y - bale.h / 2 + i);
            ctx.lineTo(bale.x + bale.w / 2 - 4, bale.y - bale.h / 2 + i);
            ctx.stroke();
        }
    }

    // Draw flowers
    for (let flower of flowers) {
        ctx.fillStyle = flower.color;
        ctx.beginPath();
        ctx.arc(flower.x, flower.y, flower.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw grass tufts (decorative)
    ctx.strokeStyle = '#2D5016';
    ctx.lineWidth = 1;
    for (let tuft of grassTufts) {
        ctx.beginPath();
        ctx.moveTo(tuft.x - tuft.size, tuft.y + tuft.size);
        ctx.lineTo(tuft.x, tuft.y - tuft.size);
        ctx.lineTo(tuft.x + tuft.size, tuft.y + tuft.size);
        ctx.stroke();
    }

    // Draw barn
    barn.draw(ctx);

    // Draw hawk
    if (hawk) hawk.draw(ctx);

    // Draw chickens
    for (let chicken of chickens) {
        chicken.draw(ctx);
    }

    // Draw player
    if (player) player.draw(ctx);

    // Draw carried chickens trailing behind
    for (let i = 0; i < player.carryingChickens.length; i++) {
        const c = player.carryingChickens[i];
        const trailX = player.x - (i + 1) * 12 * player.direction;
        const trailY = player.y;

        ctx.save();
        ctx.globalAlpha = 0.6;

        // Mini chicken icon
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(trailX, trailY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(trailX - 2, trailY, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.moveTo(trailX - 1, trailY - 4);
        ctx.lineTo(trailX - 2, trailY - 2);
        ctx.lineTo(trailX, trailY - 2);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // Draw particles
    for (let p of particles) {
        p.draw(ctx);
    }

    ctx.restore();
}

function drawHUD(ctx, elapsedTime, gameTime, savedCount) {
    // HUD is in screen space, not world space
    ctx.save();

    ctx.font = 'bold 24px Arial';
    ctx.textBaseline = 'top';

    // Level
    ctx.fillStyle = '#FFF';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${currentLevel}`, 20, 20);

    // Saved chickens
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    const config = getLevelConfig();
    ctx.fillText(`Saved: ${savedCount} / ${config.saveTarget}`, W / 2, 20);

    // Timer
    const timeLeft = Math.max(0, gameTime - elapsedTime);
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'right';

    let timerColor = '#FFF';
    if (timeLeft < 10) timerColor = '#FF4444';
    else if (timeLeft < 20) timerColor = '#FFDD00';

    ctx.fillStyle = timerColor;
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;
    ctx.fillText(`${Math.ceil(timeLeft)}s`, W - 20, 20);

    // Carrying count (bottom-left)
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#FFF';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 1;
    const carryText = 'Carrying: ' + player.carryingChickens.length + ' chickens';
    ctx.fillText(carryText, 20, H - 40);

    // Hawk warning (center, big)
    if (hawk.isTelegraphing()) {
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FF4444';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fillText('HAWK INCOMING!', W / 2, H / 3);
    }

    // Minimap (bottom-right)
    drawMinimap(ctx, savedCount);

    ctx.restore();
}

function drawMinimap(ctx, savedCount) {
    const mmW = 160;
    const mmH = 115;
    const mmX = W - mmW - 20;
    const mmY = H - mmH - 20;

    // Background
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(mmX, mmY, mmW, mmH);

    // Border
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2;
    ctx.strokeRect(mmX, mmY, mmW, mmH);

    // Scale factors
    const scaleX = mmW / WORLD_W;
    const scaleY = mmH / WORLD_H;

    // Player (green dot)
    ctx.fillStyle = '#00FF00';
    ctx.fillRect(
        mmX + player.x * scaleX - 2,
        mmY + player.y * scaleY - 2,
        4, 4
    );

    // Alive chickens (yellow dots)
    ctx.fillStyle = '#FFFF00';
    for (let chicken of chickens) {
        if (chicken.alive && !chicken.saved) {
            ctx.fillRect(
                mmX + chicken.x * scaleX - 1.5,
                mmY + chicken.y * scaleY - 1.5,
                3, 3
            );
        }
    }

    // Hawk (red dot)
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(
        mmX + hawk.x * scaleX - 2,
        mmY + hawk.y * scaleY - 2,
        4, 4
    );

    // Barn (white rect)
    ctx.fillStyle = '#FFF';
    ctx.fillRect(
        mmX + (barn.x - barn.w / 2) * scaleX,
        mmY + (barn.y - barn.h / 2) * scaleY,
        barn.w * scaleX,
        barn.h * scaleY
    );

    // Camera viewport rect (correct formula, NOT divided by 64)
    const vpW = W * scaleX;
    const vpH = H * scaleY;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(
        mmX + cameraX * scaleX,
        mmY + cameraY * scaleY,
        vpW,
        vpH
    );
}

// ============================================================================
// GAME INITIALIZATION
// ============================================================================

let player;
let chickens = [];
let hawk;
let barn;

let startBtn = null;
let nextBtn = null;
let retryBtn = null;

let elapsedTime = 0;
let savedCount = 0;
let lastSavedCount = 0;

function initGame() {
    const config = getLevelConfig();

    // Create player
    player = new Player(200, 500);

    // Create chickens scattered around
    chickens = [];
    for (let i = 0; i < config.chickens; i++) {
        let x, y, valid;
        do {
            valid = true;
            x = 100 + Math.random() * (WORLD_W - 200);
            y = 100 + Math.random() * (WORLD_H - 200);

            // Don't spawn too close to barn
            const dx = barn.x - x;
            const dy = barn.y - y;
            if (Math.sqrt(dx * dx + dy * dy) < 200) valid = false;
        } while (!valid);

        chickens.push(new Chicken(x, y));
    }

    // Create hawk
    hawk = new Hawk();

    // Reset timers
    elapsedTime = 0;
    savedCount = 0;
    lastSavedCount = 0;
    particles = [];
}

// ============================================================================
// MAIN GAME LOOP
// ============================================================================

let lastFrameTime = Date.now();

function update(dt) {
    updateInput();

    if (gameState === GAME_STATE.PLAYING) {
        // Update player
        player.update(dt, inputX, inputY);

        // Update chickens
        for (let chicken of chickens) {
            chicken.update(dt, player, hawk, chickens);
        }

        // Update hawk
        hawk.update(dt, chickens, elapsedTime);

        // Update barn
        barn.update(dt);

        // Check collisions: player picking up chickens
        for (let chicken of chickens) {
            if (!chicken.alive || chicken.saved) continue;

            const dx = chicken.x - player.x;
            const dy = chicken.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 25) {
                if (player.carryingChickens.length < 5) {
                    chicken.alive = false;
                    player.pickUpChicken(chicken);
                    playSound('cluck');
                }
            }
        }

        // Check barn delivery
        const newSaved = player.dropChickens(barn);
        if (newSaved > 0) {
            savedCount += newSaved;
            playSound('chime');
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }

        elapsedTime += dt;

        // Check level complete
        const config = getLevelConfig();
        if (savedCount >= config.saveTarget) {
            gameState = GAME_STATE.LEVEL_COMPLETE;
            playSound('victory');
        }

        // Check game over (time limit)
        if (elapsedTime > config.timeLimit) {
            gameState = GAME_STATE.GAME_OVER;
            playSound('gameover');
        }
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Update camera (CORRECT formula, NO /64)
    if (player) {
        cameraX += (player.x - W / 2 - cameraX) * 0.1;
        cameraY += (player.y - H / 2 - cameraY) * 0.1;
    }

    // Clamp camera to world (CORRECT formula)
    cameraX = Math.max(0, Math.min(WORLD_W - W, cameraX));
    cameraY = Math.max(0, Math.min(WORLD_H - H, cameraY));

    // Draw world
    drawWorld(ctx);

    // Draw HUD (in screen space)
    if (gameState === GAME_STATE.PLAYING) {
        const config = getLevelConfig();
        drawHUD(ctx, elapsedTime, config.timeLimit, savedCount);
    }

    // Draw screen overlays
    if (gameState === GAME_STATE.START) {
        drawStartScreen(ctx);
    } else if (gameState === GAME_STATE.LEVEL_COMPLETE) {
        const config = getLevelConfig();
        drawLevelCompleteScreen(ctx, savedCount, {
            target: config.saveTarget,
            timeTaken: elapsedTime
        });
    } else if (gameState === GAME_STATE.GAME_OVER) {
        const config = getLevelConfig();
        drawGameOverScreen(ctx, savedCount, {
            target: config.saveTarget
        });
    }
}

function gameLoop() {
    try {
        const now = Date.now();
        const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;

        update(dt);
        draw();
    } catch (e) {
        console.error('Game error:', e);
    }

    requestAnimationFrame(gameLoop);
}

// ============================================================================
// MOUSE CLICK HANDLING
// ============================================================================

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (gameState === GAME_STATE.START && startBtn) {
        if (mx > startBtn.x && mx < startBtn.x + startBtn.w &&
            my > startBtn.y && my < startBtn.y + startBtn.h) {
            gameState = GAME_STATE.PLAYING;
            initGame();
            initAudio();
        }
    } else if (gameState === GAME_STATE.LEVEL_COMPLETE && nextBtn) {
        if (mx > nextBtn.x && mx < nextBtn.x + nextBtn.w &&
            my > nextBtn.y && my < nextBtn.y + nextBtn.h) {
            currentLevel++;
            gameState = GAME_STATE.PLAYING;
            initGame();
        }
    } else if (gameState === GAME_STATE.GAME_OVER && retryBtn) {
        if (mx > retryBtn.x && mx < retryBtn.x + retryBtn.w &&
            my > retryBtn.y && my < retryBtn.y + retryBtn.h) {
            gameState = GAME_STATE.PLAYING;
            initGame();
        }
    }
});

    const my = touch.clientY - rect.top;

    if (gameState === GAME_STATE.START && startBtn) {
        if (mx > startBtn.x && mx < startBtn.x + startBtn.w &&
            my > startBtn.y && my < startBtn.y + startBtn.h) {
            gameState = GAME_STATE.PLAYING;
            initGame();
            initAudio();
        }
    } else if (gameState === GAME_STATE.LEVEL_COMPLETE && nextBtn) {
        if (mx > nextBtn.x && mx < nextBtn.x + nextBtn.w &&
            my > nextBtn.y && my < nextBtn.y + nextBtn.h) {
            currentLevel++;
            gameState = GAME_STATE.PLAYING;
            initGame();
        }
    } else if (gameState === GAME_STATE.GAME_OVER && retryBtn) {
        if (mx > retryBtn.x && mx < retryBtn.x + retryBtn.w &&
            my > retryBtn.y && my < retryBtn.y + retryBtn.h) {
            gameState = GAME_STATE.PLAYING;
            initGame();
        }
    }
}, { passive: true });

// ============================================================================
// WINDOW RESIZE HANDLING
// ============================================================================

window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
});

// ============================================================================
// STARTUP
// ============================================================================

// Initialize world generation (before any drawing)
barn = new Barn();
initWorldGeneration();

// Initialize game for attract mode
initGame();

// Start game loop
gameLoop();

</script>
