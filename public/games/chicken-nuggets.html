<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Nuggets - NAW Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            background: #87CEEB;
        }

        #joystickContainer {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            z-index: 100;
            touch-action: none;
        }

        #joystickThumb {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .mobile-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #fff;
            font-size: 12px;
            text-align: right;
            z-index: 99;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="joystickContainer">
        <div id="joystickThumb"></div>
    </div>
    <div class="mobile-info"></div>

    <script>
        // ===== GLOBALS & CONFIG =====
        const CANVAS = document.getElementById('gameCanvas');
        const CTX = CANVAS.getContext('2d');
        const WORLD_WIDTH = 1600;
        const WORLD_HEIGHT = 1200;
        let SCREEN_WIDTH = window.innerWidth;
        let SCREEN_HEIGHT = window.innerHeight;

        const LEVELS = [
            { numChickens: 8, targetSave: 5, duration: 60, hawkSwoop: 8 },
            { numChickens: 10, targetSave: 7, duration: 55, hawkSwoop: 6 },
            { numChickens: 12, targetSave: 9, duration: 50, hawkSwoop: 5 },
            { numChickens: 15, targetSave: 11, duration: 50, hawkSwoop: 4 },
            { numChickens: 18, targetSave: 13, duration: 50, hawkSwoop: 3.5 }
        ];

        let gameState = {
            screen: 'start',
            level: 0,
            score: 0,
            chickensCarrying: 0,
            chickensSaved: 0,
            timeLeft: 0,
            gameTime: 0,
            isPaused: false
        };

        let player = null;
        let chickens = [];
        let hawk = null;
        let particles = [];
        let camera = { x: 0, y: 0 };
        let keys = {};
        let mobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let joystick = { active: false, x: 0, y: 0 };

        // ===== AUDIO ENGINE =====
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, options = {}) {
            try {
                const now = audioContext.currentTime;
                const duration = options.duration || 0.2;

                if (type === 'cluck') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + duration);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                    osc.start(now);
                    osc.stop(now + duration);
                } else if (type === 'screech') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + duration);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                    osc.start(now);
                    osc.stop(now + duration);
                } else if (type === 'chime') {
                    const notes = [261.63, 329.63, 392, 523.25];
                    notes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        const t = now + i * 0.1;
                        gain.gain.setValueAtTime(0.1, t);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                        osc.start(t);
                        osc.stop(t + 0.2);
                    });
                } else if (type === 'warning') {
                    for (let i = 0; i < 3; i++) {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = 'sine';
                        osc.frequency.value = 800;
                        const t = now + i * 0.15;
                        gain.gain.setValueAtTime(0.1, t);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                        osc.start(t);
                        osc.stop(t + 0.1);
                    }
                } else if (type === 'footstep') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 150 + Math.random() * 50;
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'poof') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtValue(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'gameover') {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        const t = now + i * 0.15;
                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
                        osc.start(t);
                        osc.stop(t + 0.25);
                    });
                }
            } catch (e) {
                console.error('Audio error:', e);
            }
        }

        // ===== PARTICLE SYSTEM =====
        class Particle {
            constructor(x, y, vx, vy, type = 'feather') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 1.0;
                this.maxLife = type === 'confetti' ? 2.0 : 1.0;
                this.type = type;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life -= 1.0 / (60 * this.maxLife);
                this.rotation += this.rotSpeed;
            }

            draw() {
                const alpha = Math.max(0, this.life);
                CTX.save();
                CTX.globalAlpha = alpha;
                CTX.fillStyle = this.type === 'feather' ? '#fff' :
                                this.type === 'dust' ? '#d2a679' :
                                this.type === 'sparkle' ? '#ffd700' : '#ffcccc';
                CTX.translate(this.x, this.y);
                CTX.rotate(this.rotation);

                if (this.type === 'feather') {
                    CTX.fillRect(-3, -6, 6, 12);
                } else if (this.type === 'dust') {
                    CTX.fillRect(-2, -2, 4, 4);
                } else if (this.type === 'sparkle') {
                    CTX.fillRect(-2, -2, 4, 4);
                } else {
                    CTX.fillRect(-2, -2, 4, 4);
                }

                CTX.restore();
            }
        }

        function addParticles(x, y, count, type, vxRange = 3, vyRange = 3) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = 2 + Math.random() * 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed - 1;
                particles.push(new Particle(x, y, vx, vy, type));
            }
        }

        // ===== PLAYER CLASS =====
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 40;
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.85;
                this.accel = 0.8;
                this.maxSpeed = 4;
                this.facing = 1;
                this.walkAnim = 0;
                this.carrying = [];
            }

            update() {
                let moveX = 0;
                let moveY = 0;

                if (keys['ArrowLeft'] || keys['a']) moveX -= 1;
                if (keys['ArrowRight'] || keys['d']) moveX += 1;
                if (keys['ArrowUp'] || keys['w']) moveY -= 1;
                if (keys['ArrowDown'] || keys['s']) moveY += 1;

                if (joystick.active) {
                    const mag = Math.sqrt(joystick.x ** 2 + joystick.y ** 2);
                    if (mag > 0.1) {
                        moveX += joystick.x / mag * 0.8;
                        moveY += joystick.y / mag * 0.8;
                    }
                }

                const magnitude = Math.sqrt(moveX ** 2 + moveY ** 2);
                if (magnitude > 0) {
                    if (moveX !== 0) this.facing = moveX > 0 ? 1 : -1;
                    this.vx += (moveX / magnitude) * this.accel;
                    this.vy += (moveY / magnitude) * this.accel;
                    this.walkAnim += 0.2;
                    if (this.walkAnim % (Math.PI * 2) > Math.PI * 1.5) {
                        playSound('footstep');
                    }
                } else {
                    this.walkAnim = 0;
                }

                const speed = Math.sqrt(this.vx ** 2 + this.vy ** 2);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                this.x = Math.max(this.width / 2, Math.min(WORLD_WIDTH - this.width / 2, this.x));
                this.y = Math.max(this.height / 2, Math.min(WORLD_HEIGHT - this.height / 2, this.y));

                this.carrying = this.carrying.filter(c => c.alive);
            }

            draw() {
                const legOffsetY = Math.sin(this.walkAnim) * 3;
                CTX.fillStyle = '#FFC0CB';
                CTX.fillRect(this.x - 8, this.y - 15, 16, 20);

                CTX.fillStyle = '#4169E1';
                CTX.fillRect(this.x - 12, this.y - 10, 24, 15);

                CTX.fillStyle = '#8B4513';
                const legY = this.y + 10 + legOffsetY;
                CTX.fillRect(this.x - 6, legY, 4, 8);
                CTX.fillRect(this.x + 2, legY, 4, 8);

                CTX.fillStyle = '#FFD700';
                CTX.beginPath();
                CTX.arc(this.x + this.facing * 8, this.y - 18, 6, 0, Math.PI * 2);
                CTX.fill();

                const armOffsetY = Math.sin(this.walkAnim + Math.PI) * 2;
                CTX.strokeStyle = '#FFC0CB';
                CTX.lineWidth = 3;
                CTX.beginPath();
                CTX.moveTo(this.x - this.facing * 6, this.y - 5);
                CTX.lineTo(this.x - this.facing * 12, this.y + armOffsetY);
                CTX.stroke();

                CTX.fillStyle = '#FFC0CB';
                CTX.beginPath();
                CTX.arc(this.x - this.facing * 12, this.y + armOffsetY, 3, 0, Math.PI * 2);
                CTX.fill();
            }

            pickupChicken(chicken) {
                if (this.carrying.length < 5) {
                    this.carrying.push(chicken);
                    chicken.alive = false;
                    gameState.chickensCarrying++;
                    playSound('cluck');
                    addParticles(chicken.x, chicken.y, 8, 'feather');
                    playSound('poof');
                    return true;
                }
                return false;
            }
        }

        // ===== CHICKEN CLASS =====
        class Chicken {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 22;
                this.height = 22;
                this.vx = 0;
                this.vy = 0;
                this.alive = true;
                this.scared = false;
                this.scaredTimer = 0;
                this.wanderTimer = 0;
                this.wanderDir = Math.random() * Math.PI * 2;
                this.bobOffset = Math.random() * Math.PI * 2;
                this.speed = 1.5;
            }

            update() {
                this.scaredTimer = Math.max(0, this.scaredTimer - 1);
                if (this.scaredTimer === 0) this.scared = false;

                this.wanderTimer--;
                if (this.wanderTimer <= 0) {
                    this.wanderDir = Math.random() * Math.PI * 2;
                    this.wanderTimer = 30 + Math.random() * 30;
                }

                const hawkDist = Math.hypot(this.x - hawk.x, this.y - hawk.y);
                if (hawkDist < 200 && hawk.state !== 'circling') {
                    this.scared = true;
                    this.scaredTimer = 60;
                }

                if (this.scared && hawk.state === 'swooping') {
                    const angle = Math.atan2(this.y - hawk.y, this.x - hawk.x);
                    this.vx += Math.cos(angle) * 0.4;
                    this.vy += Math.sin(angle) * 0.4;
                    this.speed = 2.5;
                } else {
                    this.vx += Math.cos(this.wanderDir) * 0.1;
                    this.vy += Math.sin(this.wanderDir) * 0.1;
                    this.speed = this.scared ? 2.0 : 1.5;
                }

                const speed = Math.sqrt(this.vx ** 2 + this.vy ** 2);
                if (speed > this.speed) {
                    this.vx = (this.vx / speed) * this.speed;
                    this.vy = (this.vy / speed) * this.speed;
                }

                this.vx *= 0.9;
                this.vy *= 0.9;

                this.x += this.vx;
                this.y += this.vy;

                this.x = Math.max(20, Math.min(WORLD_WIDTH - 20, this.x));
                this.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, this.y));

                this.bobOffset += 0.05;
            }

            draw() {
                if (!this.alive) return;

                const bodyY = this.y + Math.sin(this.bobOffset) * 1;

                CTX.fillStyle = this.scared ? '#fff' : '#fff';
                CTX.beginPath();
                CTX.arc(this.x - 4, bodyY - 2, 8, 0, Math.PI * 2);
                CTX.fill();

                CTX.beginPath();
                CTX.arc(this.x + 4, bodyY, 7, 0, Math.PI * 2);
                CTX.fill();

                CTX.fillStyle = '#FF6347';
                CTX.beginPath();
                CTX.arc(this.x, bodyY - 8, 3, 0, Math.PI * 2);
                CTX.fill();

                const direction = Math.atan2(this.vy, this.vx);
                CTX.fillStyle = '#FFA500';
                CTX.save();
                CTX.translate(this.x + 8, bodyY - 1);
                CTX.rotate(direction);
                CTX.fillRect(0, -2, 5, 4);
                CTX.restore();

                if (this.scared) {
                    CTX.fillStyle = '#000';
                    CTX.beginPath();
                    CTX.arc(this.x - 3, bodyY - 4, 2, 0, Math.PI * 2);
                    CTX.fill();
                    CTX.beginPath();
                    CTX.arc(this.x + 3, bodyY - 4, 2, 0, Math.PI * 2);
                    CTX.fill();
                } else {
                    CTX.fillStyle = '#000';
                    CTX.beginPath();
                    CTX.arc(this.x - 3, bodyY - 3, 1.5, 0, Math.PI * 2);
                    CTX.fill();
                    CTX.beginPath();
                    CTX.arc(this.x + 3, bodyY - 3, 1.5, 0, Math.PI * 2);
                    CTX.fill();
                }

                CTX.fillStyle = '#FFA500';
                CTX.fillRect(this.x - 5, bodyY + 8, 3, 4);
                CTX.fillRect(this.x + 2, bodyY + 8, 3, 4);
            }

            getDistance(x, y) {
                return Math.hypot(this.x - x, this.y - y);
            }
        }

        // ===== HAWK CLASS =====
        class Hawk {
            constructor() {
                this.x = WORLD_WIDTH / 2;
                this.y = 150;
                this.radius = 300;
                this.angle = 0;
                this.state = 'circling';
                this.swoopTimer = 0;
                this.targetChicken = null;
                this.diveProgress = 0;
                this.shadowAlpha = 0.3;
                this.shadowWarnColor = false;
                this.wingFlap = 0;
            }

            pickTarget() {
                if (chickens.length === 0) return;
                const aliveChickens = chickens.filter(c => c.alive);
                if (aliveChickens.length === 0) return;
                this.targetChicken = aliveChickens[Math.floor(Math.random() * aliveChickens.length)];
                this.shadowWarnColor = true;
                playSound('warning');
                this.swoopTimer = 90;
            }

            update() {
                this.wingFlap += 0.15;

                if (this.state === 'circling') {
                    this.angle += 0.03;
                    this.x = WORLD_WIDTH / 2 + Math.cos(this.angle) * this.radius;
                    this.y = 150 + Math.sin(this.angle) * 100;

                    this.swoopTimer++;
                    const level = LEVELS[gameState.level] || LEVELS[LEVELS.length - 1];
                    const interval = Math.ceil(level.hawkSwoop * 60);
                    if (this.swoopTimer >= interval) {
                        this.swoopTimer = 0;
                        this.pickTarget();
                        this.state = 'telegraphing';
                    }
                } else if (this.state === 'telegraphing') {
                    this.swoopTimer--;
                    if (this.swoopTimer <= 0) {
                        this.state = 'swooping';
                        this.diveProgress = 0;
                        playSound('screech');
                        this.swoopTimer = 30;
                    }
                } else if (this.state === 'swooping') {
                    this.diveProgress += 1 / this.swoopTimer;
                    if (this.targetChicken && this.targetChicken.alive) {
                        this.x = this.targetChicken.x + (WORLD_WIDTH / 2 - this.targetChicken.x) * (1 - this.diveProgress);
                        this.y = 150 + (this.targetChicken.y - 150) * this.diveProgress;
                    }

                    this.swoopTimer--;
                    if (this.swoopTimer <= 0) {
                        if (this.targetChicken && this.targetChicken.alive) {
                            const dist = Math.hypot(this.x - this.targetChicken.x, this.y - this.targetChicken.y);
                            if (dist < 40) {
                                this.targetChicken.alive = false;
                                addParticles(this.targetChicken.x, this.targetChicken.y, 12, 'feather');
                                gameState.gameTime = Math.max(0, gameState.gameTime - 2);
                                CTX.canvas.style.filter = 'brightness(0.8)';
                                setTimeout(() => {
                                    CTX.canvas.style.filter = 'brightness(1)';
                                }, 100);
                            }
                        }
                        this.state = 'circling';
                        this.swoopTimer = 0;
                        this.shadowWarnColor = false;
                    }
                }

                this.shadowAlpha = this.state === 'telegraphing' ? 0.6 : 0.3;
            }

            draw() {
                if (this.state === 'swooping') {
                    const scale = 0.8 + this.diveProgress * 0.4;
                    this.drawHawk(scale);
                } else {
                    this.drawHawk(1);
                }

                this.drawShadow();
            }

            drawHawk(scale = 1) {
                const size = 60 * scale;
                CTX.save();
                CTX.translate(this.x, this.y);

                if (this.x < WORLD_WIDTH / 2) {
                    CTX.scale(-1, 1);
                }

                CTX.fillStyle = '#654321';
                CTX.beginPath();
                CTX.arc(0, 0, size / 6, 0, Math.PI * 2);
                CTX.fill();

                CTX.fillStyle = '#8B4513';
                const flapOffset = Math.sin(this.wingFlap) * 5;
                CTX.beginPath();
                CTX.ellipse(-size / 3, flapOffset, size / 2.5, size / 4, -0.3, 0, Math.PI * 2);
                CTX.fill();
                CTX.beginPath();
                CTX.ellipse(size / 3, flapOffset, size / 2.5, size / 4, 0.3, 0, Math.PI * 2);
                CTX.fill();

                CTX.fillStyle = '#FFD700';
                CTX.beginPath();
                CTX.arc(size / 4, -size / 8, size / 12, 0, Math.PI * 2);
                CTX.fill();

                CTX.restore();
            }

            drawShadow() {
                const shadowX = this.x;
                const shadowY = WORLD_HEIGHT - 100;
                const shadowScale = this.state === 'swooping' ? 0.5 + (1 - this.diveProgress) * 0.5 : 1;
                const shadowSize = 40 * shadowScale;

                CTX.save();
                CTX.globalAlpha = this.shadowWarnColor ? 0.6 : this.shadowAlpha;
                CTX.fillStyle = this.shadowWarnColor ? '#FF0000' : '#000';
                CTX.beginPath();
                CTX.ellipse(shadowX, shadowY, shadowSize, shadowSize / 2, 0, 0, Math.PI * 2);
                CTX.fill();
                CTX.restore();
            }
        }

        // ===== BARN CLASS =====
        class Barn {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 120;
                this.height = 100;
            }

            update() {}

            draw() {
                CTX.fillStyle = '#DC143C';
                CTX.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);

                CTX.fillStyle = '#8B4513';
                CTX.beginPath();
                CTX.moveTo(this.x - this.width / 2, this.y - this.height / 2);
                CTX.lineTo(this.x, this.y - this.height / 2 - 30);
                CTX.lineTo(this.x + this.width / 2, this.y - this.height / 2);
                CTX.fill();

                CTX.fillStyle = '#333';
                CTX.fillRect(this.x - 20, this.y - 20, 40, 40);

                CTX.strokeStyle = '#FFD700';
                CTX.lineWidth = 3;
                CTX.beginPath();
                CTX.moveTo(this.x - 10, this.y - 20);
                CTX.lineTo(this.x + 10, this.y + 20);
                CTX.stroke();
                CTX.beginPath();
                CTX.moveTo(this.x + 10, this.y - 20);
                CTX.lineTo(this.x - 10, this.y + 20);
                CTX.stroke();

                CTX.strokeStyle = '#FFD700';
                CTX.lineWidth = 3;
                CTX.globalAlpha = 0.3;
                CTX.beginPath();
                CTX.arc(this.x, this.y, 80, 0, Math.PI * 2);
                CTX.stroke();
                CTX.globalAlpha = 1;
            }

            contains(x, y) {
                return (
                    x > this.x - this.width / 2 &&
                    x < this.x + this.width / 2 &&
                    y > this.y - this.height / 2 &&
                    y < this.y + this.height / 2
                );
            }
        }

        let barn = null;

        // ===== INPUT HANDLING =====
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        const joystickContainer = document.getElementById('joystickContainer');
        const joystickThumb = document.getElementById('joystickThumb');

        joystickContainer.addEventListener('touchstart', (e) => {
            joystick.active = true;
        });

        joystickContainer.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = rect.width / 2 - 25;
            if (dist > maxDist) {
                const ratio = maxDist / dist;
                joystick.x = dx * ratio;
                joystick.y = dy * ratio;
            } else {
                joystick.x = dx;
                joystick.y = dy;
            }
        });

        joystickContainer.addEventListener('touchend', () => {
            joystick.active = false;
            joystick.x = 0;
            joystick.y = 0;
        });

        // ===== INIT / LEVEL SETUP =====
        function initLevel(levelNum) {
            gameState.level = Math.min(levelNum, LEVELS.length - 1);
            const levelConfig = LEVELS[gameState.level];

            gameState.timeLeft = levelConfig.duration;
            gameState.gameTime = 0;
            gameState.chickensCarrying = 0;
            gameState.chickensSaved = 0;

            player = new Player(WORLD_WIDTH / 2, WORLD_HEIGHT - 200);
            chickens = [];
            particles = [];

            for (let i = 0; i < levelConfig.numChickens; i++) {
                let x, y, valid;
                do {
                    valid = true;
                    x = 200 + Math.random() * (WORLD_WIDTH - 400);
                    y = 200 + Math.random() * (WORLD_HEIGHT - 400);
                    for (let c of chickens) {
                        if (Math.hypot(c.x - x, c.y - y) < 50) {
                            valid = false;
                            break;
                        }
                    }
                } while (!valid);
                chickens.push(new Chicken(x, y));
            }

            hawk = new Hawk();
            barn = new Barn(1500, WORLD_HEIGHT - 150);

            if (mobile) {
                joystickContainer.style.display = 'block';
            }
        }

        // ===== UPDATE FUNCTIONS =====
        function updateGame() {
            gameState.gameTime += 1 / 60;
            gameState.timeLeft = Math.max(0, LEVELS[gameState.level].duration - gameState.gameTime);

            player.update();

            for (let c of chickens) {
                if (c.alive) {
                    c.update();
                    const dist = Math.hypot(c.x - player.x, c.y - player.y);
                    if (dist < 30) {
                        player.pickupChicken(c);
                    }
                }
            }

            if (barn.contains(player.x, player.y) && player.carrying.length > 0) {
                const saved = player.carrying.length;
                gameState.chickensSaved += saved;
                player.carrying = [];
                gameState.chickensCarrying = 0;
                playSound('chime');
                addParticles(barn.x, barn.y, 20, 'sparkle');
            }

            hawk.update();

            particles = particles.filter(p => p.life > 0);
            for (let p of particles) {
                p.update();
            }

            camera.x += (player.x - SCREEN_WIDTH / 2 - camera.x) * 0.08;
            camera.y += (player.y - SCREEN_HEIGHT / 2 - camera.y) * 0.08;

            camera.x = Math.max(0, Math.min(WORLD_WIDTH - SCREEN_WIDTH / 64, camera.x));
            camera.y = Math.max(0, Math.min(WORLD_HEIGHT - SCREEN_HEIGHT / 64, camera.y));

            if (gameState.timeLeft <= 0) {
                if (gameState.chickensSaved >= LEVELS[gameState.level].targetSave) {
                    gameState.screen = 'levelcomplete';
                    playSound('victory');
                } else {
                    gameState.screen = 'gameover';
                    playSound('gameover');
                }
            }
        }

        // ===== DRAW FUNCTIONS =====
        function drawWorld() {
            CTX.fillStyle = '#87CEEB';
            CTX.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            CTX.save();
            CTX.translate(-camera.x, -camera.y);

            CTX.fillStyle = '#228B22';
            const grassVariation = 15;
            for (let x = 0; x < WORLD_WIDTH; x += 50) {
                for (let y = 0; y < WORLD_HEIGHT; y += 50) {
                    CTX.fillStyle = ['#228B22', '#2E8B57', '#3CB371'][Math.floor(Math.random() * 3)];
                    CTX.fillRect(x, y, 50, 50);
                }
            }

            CTX.fillStyle = '#FFD700';
            for (let i = 0; i < 200; i++) {
                const x = (i * 73) % WORLD_WIDTH;
                const y = ((i * 97) % WORLD_HEIGHT);
                if (Math.sin(i) > 0.5) {
                    CTX.beginPath();
                    CTX.arc(x, y, 2, 0, Math.PI * 2);
                    CTX.fill();
                }
            }

            CTX.strokeStyle = '#8B4513';
            CTX.lineWidth = 3;
            CTX.strokeRect(10, 10, WORLD_WIDTH - 20, WORLD_HEIGHT - 20);

            CTX.fillStyle = '#8B7355';
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 6; j++) {
                    const x = 150 + i * 180;
                    const y = 150 + j * 150;
                    CTX.fillRect(x, y, 80, 60);
                }
            }

            barn.draw();

            for (let c of chickens) {
                c.draw();
            }

            player.draw();
            hawk.draw();

            for (let p of particles) {
                p.draw();
            }

            CTX.restore();
        }

        function drawHUD() {
            const padding = 20;
            CTX.fillStyle = '#000';
            CTX.font = 'bold 24px Arial';
            CTX.textAlign = 'left';
            CTX.fillText(`Level ${gameState.level + 1}`, padding, padding + 30);

            const level = LEVELS[gameState.level];
            CTX.font = '20px Arial';
            CTX.textAlign = 'center';
            const chickensText = `🐔 ${gameState.chickensSaved}/${level.targetSave}`;
            CTX.fillText(chickensText, SCREEN_WIDTH / 2, padding + 30);

            CTX.textAlign = 'right';
            const timeColor = gameState.timeLeft < 10 ? '#FF0000' : gameState.timeLeft < 20 ? '#FFD700' : '#00AA00';
            CTX.fillStyle = timeColor;
            CTX.font = 'bold 20px Arial';
            const timeText = Math.ceil(gameState.timeLeft).toString().padStart(2, '0');
            CTX.fillText(timeText, SCREEN_WIDTH - padding, padding + 30);

            if (gameState.chickensCarrying > 0) {
                CTX.fillStyle = '#000';
                CTX.font = '16px Arial';
                CTX.textAlign = 'left';
                let carryText = 'Carrying: ';
                for (let i = 0; i < gameState.chickensCarrying; i++) {
                    carryText += '🐔';
                }
                CTX.fillText(carryText, padding, SCREEN_HEIGHT - padding);
            }

            if (hawk.state === 'telegraphing') {
                CTX.fillStyle = '#FF0000';
                CTX.font = 'bold 24px Arial';
                CTX.textAlign = 'center';
                CTX.fillText('⚠️ HAWK INCOMING!', SCREEN_WIDTH / 2, 80);
            }

            drawMinimap();
        }

        function drawMinimap() {
            const minimapX = SCREEN_WIDTH - 170;
            const minimapY = SCREEN_HEIGHT - 140;
            const minimapW = 150;
            const minimapH = 120;

            CTX.fillStyle = 'rgba(0, 0, 0, 0.5)';
            CTX.fillRect(minimapX, minimapY, minimapW, minimapH);
            CTX.strokeStyle = '#fff';
            CTX.lineWidth = 2;
            CTX.strokeRect(minimapX, minimapY, minimapW, minimapH);

            const scaleX = minimapW / WORLD_WIDTH;
            const scaleY = minimapH / WORLD_HEIGHT;

            CTX.fillStyle = '#0F0';
            const playerMmX = minimapX + player.x * scaleX;
            const playerMmY = minimapY + player.y * scaleY;
            CTX.fillRect(playerMmX - 2, playerMmY - 2, 4, 4);

            CTX.fillStyle = '#FF0';
            for (let c of chickens) {
                if (c.alive) {
                    CTX.fillRect(minimapX + c.x * scaleX - 1, minimapY + c.y * scaleY - 1, 2, 2);
                }
            }

            CTX.fillStyle = '#F00';
            CTX.fillRect(minimapX + hawk.x * scaleX - 2, minimapY + hawk.y * scaleY - 2, 4, 4);

            CTX.fillStyle = '#FFF';
            CTX.fillRect(minimapX + barn.x * scaleX - 4, minimapY + barn.y * scaleY - 3, 8, 6);

            const vpX = minimapX + (camera.x) * scaleX;
            const vpY = minimapY + (camera.y) * scaleY;
            const vpW = (SCREEN_WIDTH / 64) * scaleX;
            const vpH = (SCREEN_HEIGHT / 64) * scaleY;
            CTX.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            CTX.lineWidth = 1;
            CTX.strokeRect(vpX, vpY, vpW, vpH);
        }

        function drawStartScreen() {
            CTX.fillStyle = '#87CEEB';
            CTX.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            CTX.fillStyle = '#228B22';
            for (let x = 0; x < SCREEN_WIDTH; x += 50) {
                for (let y = 0; y < SCREEN_HEIGHT; y += 50) {
                    CTX.fillStyle = ['#228B22', '#2E8B57', '#3CB371'][Math.floor(Math.random() * 3)];
                    CTX.fillRect(x, y, 50, 50);
                }
            }

            for (let c of chickens) {
                if (c.alive) {
                    c.x += (Math.random() - 0.5) * 2;
                    c.y += (Math.random() - 0.5) * 2;
                    c.bobOffset += 0.02;
                }
            }

            for (let c of chickens) {
                c.draw();
            }

            if (hawk) {
                hawk.angle += 0.02;
                hawk.x = SCREEN_WIDTH / 2 + Math.cos(hawk.angle) * 150;
                hawk.y = 100 + Math.sin(hawk.angle) * 60;
                hawk.wingFlap += 0.1;
                hawk.drawHawk(0.8);
            }

            CTX.fillStyle = 'rgba(0, 0, 0, 0.4)';
            CTX.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            CTX.fillStyle = '#FFD700';
            CTX.font = 'bold 80px Arial';
            CTX.textAlign = 'center';
            CTX.fillText('CHICKEN NUGGETS', SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 - 80);

            CTX.fillStyle = '#FFF';
            CTX.font = '32px Arial';
            CTX.fillText('Save the chickens from the hawk!', SCREEN_WIDTH / 2, SCREEN_HEIGHT / 2 + 20);

            const buttonY = SCREEN_HEIGHT / 2 + 100;
            const buttonW = 200;
            const buttonH = 60;
            const buttonX = SCREEN_WIDTH / 2 - buttonW / 2;

            CTX.fillStyle = '#FF6347';
            CTX.fillRect(buttonX, buttonY, buttonW, buttonH);
            CTX.fillStyle = '#FFF';
            CTX.font = 'bold 28px Arial';
            CTX.textAlign = 'center';
            CTX.fillText('TAP TO PLAY', SCREEN_WIDTH / 2, buttonY + 45);

            gameState.startButtonRect = { x: buttonX, y: buttonY, w: buttonW, h: buttonH };
        }

        function drawLevelComplete() {
            CTX.fillStyle = 'rgba(0, 0, 0, 0.7)';
            CTX.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            CTX.fillStyle = '#FFD700';
            CTX.font = 'bold 60px Arial';
            CTX.textAlign = 'center';
            CTX.fillText('LEVEL COMPLETE!', SCREEN_WIDTH / 2, 100);

            const level = LEVELS[gameState.level];
            CTX.fillStyle = '#FFF';
            CTX.font = '24px Arial';
            CTX.fillText(`Saved ${gameState.chickensSaved}/${level.targetSave} chickens`, SCREEN_WIDTH / 2, 180);

            const timeBonus = Math.max(0, Math.floor(gameState.timeLeft * 10));
            CTX.fillText(`Time bonus: +${timeBonus} points`, SCREEN_WIDTH / 2, 220);

            const stars = gameState.chickensSaved >= level.targetSave ? '⭐⭐⭐' : '⭐⭐';
            CTX.fillStyle = '#FFD700';
            CTX.font = 'bold 40px Arial';
            CTX.fillText(stars, SCREEN_WIDTH / 2, 300);

            const nextButtonY = SCREEN_HEIGHT / 2 + 120;
            const buttonW = 200;
            const buttonH = 60;
            const buttonX = SCREEN_WIDTH / 2 - buttonW / 2;

            CTX.fillStyle = '#228B22';
            CTX.fillRect(buttonX, nextButtonY, buttonW, buttonH);
            CTX.fillStyle = '#FFF';
            CTX.font = 'bold 28px Arial';
            CTX.textAlign = 'center';
            CTX.fillText('NEXT LEVEL', SCREEN_WIDTH / 2, nextButtonY + 45);

            gameState.nextButtonRect = { x: buttonX, y: nextButtonY, w: buttonW, h: buttonH };
        }

        function drawGameOver() {
            CTX.fillStyle = 'rgba(0, 0, 0, 0.7)';
            CTX.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            CTX.fillStyle = '#FF0000';
            CTX.font = 'bold 60px Arial';
            CTX.textAlign = 'center';
            CTX.fillText('TIME\'S UP!', SCREEN_WIDTH / 2, 100);

            const level = LEVELS[gameState.level];
            CTX.fillStyle = '#FFF';
            CTX.font = '24px Arial';
            CTX.fillText(`You saved ${gameState.chickensSaved}/${level.targetSave} chickens`, SCREEN_WIDTH / 2, 180);
            CTX.fillText(`Need ${level.targetSave} to advance`, SCREEN_WIDTH / 2, 220);

            const retryButtonY = SCREEN_HEIGHT / 2 + 100;
            const buttonW = 200;
            const buttonH = 60;
            const buttonX = SCREEN_WIDTH / 2 - buttonW / 2;

            CTX.fillStyle = '#FF6347';
            CTX.fillRect(buttonX, retryButtonY, buttonW, buttonH);
            CTX.fillStyle = '#FFF';
            CTX.font = 'bold 28px Arial';
            CTX.textAlign = 'center';
            CTX.fillText('PLAY AGAIN', SCREEN_WIDTH / 2, retryButtonY + 45);

            gameState.retryButtonRect = { x: buttonX, y: retryButtonY, w: buttonW, h: buttonH };
        }

        // ===== GAME LOOP =====
        function gameLoop() {
            try {
                if (gameState.screen === 'start') {
                    if (!chickens || chickens.length === 0) {
                        initLevel(0);
                        for (let c of chickens) {
                            c.x = Math.random() * SCREEN_WIDTH;
                            c.y = Math.random() * SCREEN_HEIGHT;
                        }
                    }
                    drawStartScreen();
                } else if (gameState.screen === 'playing') {
                    updateGame();
                    drawWorld();
                    drawHUD();
                } else if (gameState.screen === 'levelcomplete') {
                    drawLevelComplete();
                } else if (gameState.screen === 'gameover') {
                    drawGameOver();
                }
            } catch (e) {
                console.error('Game loop error:', e);
            }

            requestAnimationFrame(gameLoop);
        }

        // ===== SCREEN MANAGEMENT =====
        window.addEventListener('click', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            if (gameState.screen === 'start' && gameState.startButtonRect) {
                const btn = gameState.startButtonRect;
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    gameState.screen = 'playing';
                    initLevel(0);
                }
            } else if (gameState.screen === 'levelcomplete' && gameState.nextButtonRect) {
                const btn = gameState.nextButtonRect;
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    gameState.screen = 'playing';
                    initLevel(gameState.level + 1);
                }
            } else if (gameState.screen === 'gameover' && gameState.retryButtonRect) {
                const btn = gameState.retryButtonRect;
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    gameState.screen = 'playing';
                    initLevel(gameState.level);
                }
            }
        });

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const x = touch.clientX;
            const y = touch.clientY;

            if (gameState.screen === 'start' && gameState.startButtonRect) {
                const btn = gameState.startButtonRect;
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    gameState.screen = 'playing';
                    initLevel(0);
                }
            } else if (gameState.screen === 'levelcomplete' && gameState.nextButtonRect) {
                const btn = gameState.nextButtonRect;
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    gameState.screen = 'playing';
                    initLevel(gameState.level + 1);
                }
            } else if (gameState.screen === 'gameover' && gameState.retryButtonRect) {
                const btn = gameState.retryButtonRect;
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    gameState.screen = 'playing';
                    initLevel(gameState.level);
                }
            }
        });

        window.addEventListener('resize', () => {
            SCREEN_WIDTH = window.innerWidth;
            SCREEN_HEIGHT = window.innerHeight;
            CANVAS.width = SCREEN_WIDTH;
            CANVAS.height = SCREEN_HEIGHT;
        });

        // ===== BOOTSTRAP =====
        CANVAS.width = SCREEN_WIDTH;
        CANVAS.height = SCREEN_HEIGHT;

        gameState.screen = 'start';
        chickens = [];
        particles = [];
        initLevel(0);
        for (let c of chickens) {
            c.x = Math.random() * SCREEN_WIDTH;
            c.y = Math.random() * SCREEN_HEIGHT;
        }

        gameLoop();
    </script>
</body>
