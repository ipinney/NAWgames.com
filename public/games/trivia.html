<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAIN BLAST! - The Ultimate Trivia Gameshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* SPOTLIGHT EFFECTS */
        .spotlight {
            position: fixed;
            pointer-events: none;
            opacity: 0.3;
            z-index: 0;
        }

        .spotlight1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 70%);
            top: -200px;
            left: -200px;
            animation: spotlight-sweep 8s infinite ease-in-out;
        }

        .spotlight2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
            bottom: -200px;
            right: -200px;
            animation: spotlight-sweep 8s infinite ease-in-out reverse;
        }

        @keyframes spotlight-sweep {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(100px, 50px); }
        }

        /* SCREEN SECTIONS */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .screen.active {
            display: flex;
        }

        /* START SCREEN */
        #startScreen {
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-title {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #00d4ff, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: title-glow 2s ease-in-out infinite;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes title-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); }
        }

        .game-subtitle {
            font-size: 1.5em;
            color: #00d4ff;
            margin-bottom: 30px;
            text-align: center;
        }

        .play-button {
            padding: 20px 60px;
            font-size: 2em;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin: 20px;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            transform: scale(1);
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        /* CATEGORY SELECTION SCREEN */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 900px;
            width: 90%;
        }

        .category-card {
            padding: 30px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s;
            border: 3px solid;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transform: scale(1);
        }

        .category-card.math {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border-color: #ff6b6b;
        }

        .category-card.science {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-color: #4facfe;
            color: #000;
        }

        .category-card.history {
            background: linear-gradient(135deg, #fa709a, #fee140);
            border-color: #fa709a;
            color: #000;
        }

        .category-card.english {
            background: linear-gradient(135deg, #30cfd0, #330867);
            border-color: #30cfd0;
        }

        .category-card.computers {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            border-color: #a8edea;
            color: #000;
        }

        .category-card.random {
            background: linear-gradient(135deg, #ffd700, #ff1493);
            border-color: #ffd700;
        }

        .category-card:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .category-icon {
            font-size: 2.5em;
        }

        /* GAMEPLAY SCREEN */
        .gameplay-content {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 20px;
            padding: 20px;
            flex-direction: column;
        }

        @media (min-width: 1024px) {
            .gameplay-content {
                flex-direction: row;
            }
        }

        .main-game {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .coin-display {
            color: #ffd700;
            font-size: 1.4em;
        }

        .streak-badge {
            background: linear-gradient(45deg, #ff6b00, #ffaa00);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            animation: pulse-badge 0.5s ease-out;
        }

        .streak-badge.fire {
            display: block;
        }

        @keyframes pulse-badge {
            0% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* TIMER */
        .timer-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 15px;
        }

        .timer-bar {
            width: 100%;
            height: 30px;
            background: linear-gradient(90deg, #00ff00 0%, #ffff00 50%, #ff0000 100%);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00 0%, #ffff00 50%, #ff0000 100%);
            width: 100%;
            transition: width 0.1s linear;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-weight: bold;
            color: #000;
        }

        /* QUESTION AREA */
        .question-area {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border: 3px solid rgba(255, 215, 0, 0.3);
        }

        .question-number {
            color: #00d4ff;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.4;
        }

        /* ANSWER BUTTONS */
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .answer-button {
            padding: 25px;
            font-size: 1.3em;
            font-weight: bold;
            border: 3px solid;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            color: white;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.8), rgba(50, 100, 255, 0.8));
            border-color: #64c8ff;
            transform: scale(1);
        }

        .answer-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s;
        }

        .answer-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.6);
        }

        .answer-button:hover:not(:disabled):before {
            left: 100%;
        }

        .answer-button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .answer-button.correct {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border-color: #00ff00;
            animation: correct-pulse 0.5s ease-out;
        }

        .answer-button.wrong {
            background: linear-gradient(135deg, #ff0000, #aa0000);
            border-color: #ff0000;
            animation: wrong-shake 0.5s ease-out;
        }

        @keyframes correct-pulse {
            0% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes wrong-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* LIFELINE BUTTONS */
        .lifelines {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .lifeline-button {
            padding: 12px 20px;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: 2px solid #ff1493;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s;
            position: relative;
        }

        .lifeline-button:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        .lifeline-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: #666;
            border-color: #666;
        }

        /* PRIZE LADDER */
        .prize-ladder {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 15px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            min-width: 200px;
            order: -1;
        }

        @media (min-width: 1024px) {
            .prize-ladder {
                order: 0;
            }
        }

        .ladder-title {
            text-align: center;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .ladder-item {
            padding: 10px;
            margin: 5px 0;
            text-align: center;
            border-radius: 8px;
            font-size: 0.95em;
            color: #ccc;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .ladder-item.current {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.3), rgba(0, 212, 255, 0.3));
            border-left-color: #ffd700;
            color: white;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .ladder-item.passed {
            color: #00ff00;
        }

        .ladder-item.safe {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
        }

        /* GAME OVER SCREEN */
        .game-over-content {
            text-align: center;
            padding: 40px;
        }

        .game-over-title {
            font-size: 3em;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .game-over-stats {
            font-size: 1.5em;
            margin: 20px 0;
            line-height: 2;
        }

        .game-over-coins {
            font-size: 2.5em;
            color: #ffd700;
            margin: 30px 0;
            font-weight: bold;
        }

        .game-over-button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 30px;
            transition: all 0.3s;
        }

        .game-over-button:hover {
            transform: scale(1.05);
        }

        /* PRIZE WHEEL SCREEN */
        .wheel-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            gap: 20px;
        }

        .wheel-canvas-wrap {
            position: relative;
            display: inline-block;
        }

        .wheel-canvas-wrap canvas {
            display: block;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 36px solid #ffd700;
            z-index: 10;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.9));
        }

        .wheel-spin-btn {
            margin-top: 24px;
            padding: 16px 48px;
            font-size: 1.4em;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0a2e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.5);
            transition: transform 0.2s;
        }

        .wheel-spin-btn:hover {
            transform: scale(1.05);
        }

        .wheel-spin-btn:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .wheel-result {
            font-size: 1.6em;
            font-weight: 900;
            color: #ffd700;
            margin-top: 16px;
            min-height: 1.6em;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        /* CONFETTI & PARTICLES */
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 5;
        }

        .floating-coin {
            position: fixed;
            font-size: 2em;
            pointer-events: none;
            z-index: 20;
            animation: float-up 1.5s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .game-title {
                font-size: 2.5em;
            }

            .question-text {
                font-size: 1.3em;
            }

            .answer-button {
                font-size: 1em;
                padding: 18px;
            }

            .category-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 20px;
            }

            .prize-ladder {
                font-size: 0.9em;
                padding: 10px;
            }

            .ladder-item {
                padding: 8px;
                margin: 3px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spotlight spotlight1"></div>
        <div class="spotlight spotlight2"></div>

        <!-- START SCREEN -->
        <div id="startScreen" class="screen active">
            <div class="game-title">🎮 BRAIN BLAST! 🎮</div>
            <div class="game-subtitle">The Ultimate Trivia Gameshow</div>
            <button class="play-button" onclick="game.goToCategories()">PLAY NOW</button>
        </div>

        <!-- CATEGORY SELECTION -->
        <div id="categoryScreen" class="screen">
            <h2 style="margin-bottom: 30px; font-size: 2em;">Pick Your Category!</h2>
            <div class="category-grid" id="categoryGrid"></div>
        </div>

        <!-- GAMEPLAY -->
        <div id="gameplayScreen" class="screen">
            <div class="gameplay-content">
                <div class="main-game">
                    <div class="hud">
                        <div class="hud-item coin-display">🪙 <span id="coinDisplay">0</span></div>
                        <div class="streak-badge fire" id="streakBadge"></div>
                        <div class="lifelines" id="lifelinesContainer"></div>
                    </div>

                    <div class="timer-container">
                        <div class="timer-bar">
                            <div class="timer-fill" id="timerFill" style="width: 100%;">
                                <span id="timerText">30s</span>
                            </div>
                        </div>
                    </div>

                    <div class="question-area">
                        <div class="question-number" id="questionNumber">Question 1 of 10</div>
                        <div class="question-text" id="questionText"></div>
                    </div>

                    <div class="answers-grid" id="answersGrid"></div>
                </div>

                <div class="prize-ladder" id="prizeLadder"></div>
            </div>
        </div>

        <!-- PRIZE WHEEL -->
        <div id="wheelScreen" class="screen">
            <div class="wheel-container">
                <h2 style="font-size: 2em; margin-bottom: 10px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5);">🎡 PRIZE WHEEL! 🎡</h2>
                <div class="wheel-canvas-wrap">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="320" height="320"></canvas>
                </div>
                <button class="wheel-spin-btn" id="wheelSpinBtn" onclick="game.spinWheel()">SPIN!</button>
                <div class="wheel-result" id="wheelResult"></div>
            </div>
        </div>

        <!-- GAME OVER -->
        <div id="gameOverScreen" class="screen">
            <div class="game-over-content">
                <div class="game-over-title" id="gameOverTitle">YOU DID IT!</div>
                <div class="game-over-stats">
                    <div>Questions Correct: <span id="statsCorrect">0</span>/10</div>
                    <div>Highest Streak: <span id="statsStreak">0</span></div>
                    <div>Final Position: <span id="statsFinal">Q1</span></div>
                </div>
                <div class="game-over-coins">💰 <span id="finalCoins">0</span> Coins! 💰</div>
                <button class="game-over-button" onclick="location.reload()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        // AUDIO SYNTHESIS
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, duration = 0.2) {
            const now = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + duration);

            switch(type) {
                case 'correct':
                    oscillator.frequency.setValueAtTime(523.25, now);
                    oscillator.frequency.setValueAtTime(659.25, now + 0.1);
                    oscillator.frequency.setValueAtTime(783.99, now + 0.2);
                    break;
                case 'wrong':
                    oscillator.frequency.setValueAtTime(392, now);
                    oscillator.frequency.setValueAtTime(329.63, now + duration);
                    break;
                case 'question':
                    oscillator.frequency.setValueAtTime(300, now);
                    oscillator.frequency.setValueAtTime(400, now + 0.05);
                    break;
                case 'timer':
                    oscillator.frequency.setValueAtTime(800, now);
                    gainNode.gain.setValueAtTime(0.15, now);
                    break;
                case 'streak':
                    oscillator.frequency.setValueAtTime(440, now);
                    oscillator.frequency.setValueAtTime(554.37, now + 0.1);
                    oscillator.frequency.setValueAtTime(659.25, now + 0.2);
                    break;
                case 'wheel':
                    oscillator.frequency.setValueAtTime(1000, now);
                    duration = 0.05;
                    break;
                case 'lifeline':
                    oscillator.frequency.setValueAtTime(880, now);
                    oscillator.frequency.setValueAtTime(1100, now + 0.1);
                    break;
            }

            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        function playCrowd() {
            const now = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(400 + Math.random() * 200, now);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            filter.frequency.value = 2000;

            oscillator.start(now);
            oscillator.stop(now + 0.3);
        }

        // GAME STATE
        const game = {
            currentScreen: 'start',
            category: null,
            questionIndex: 0,
            coins: 0,
            correctAnswers: 0,
            streak: 0,
            maxStreak: 0,
            lifelines: { 'fifty': true, 'double': true },
            usedLifelines: new Set(),
            transitioning: false,
            timerRunning: false,
            questions: [],
            currentQuestion: null,
            wheelSpun: false,

            // Question Database - 16+ per category
            questionBank: {
                math: [
                    { q: "What is 5 + 3?", correct: "8", wrong: ["7", "9", "6"], diff: 1 },
                    { q: "What is 10 - 4?", correct: "6", wrong: ["7", "5", "4"], diff: 1 },
                    { q: "What is 6 × 2?", correct: "12", wrong: ["10", "14", "8"], diff: 1 },
                    { q: "What is 20 ÷ 4?", correct: "5", wrong: ["4", "6", "3"], diff: 1 },
                    { q: "What is 15 + 25?", correct: "40", wrong: ["35", "45", "50"], diff: 1 },
                    { q: "What is 100 - 30?", correct: "70", wrong: ["60", "80", "75"], diff: 2 },
                    { q: "What is 7 × 8?", correct: "56", wrong: ["54", "58", "48"], diff: 2 },
                    { q: "What is 1/2 + 1/4?", correct: "3/4", wrong: ["1/2", "1/4", "1"], diff: 2 },
                    { q: "How many sides does a triangle have?", correct: "3", wrong: ["4", "5", "6"], diff: 1 },
                    { q: "How many sides does a hexagon have?", correct: "6", wrong: ["5", "7", "8"], diff: 2 },
                    { q: "What time is it when hour hand points to 3?", correct: "3:00", wrong: ["2:00", "4:00", "5:00"], diff: 1 },
                    { q: "If you have 10 dollars and spend 3, how much left?", correct: "7 dollars", wrong: ["6 dollars", "8 dollars", "5 dollars"], diff: 1 },
                    { q: "What is 50 + 50?", correct: "100", wrong: ["90", "110", "80"], diff: 1 },
                    { q: "What is 9 × 9?", correct: "81", wrong: ["72", "90", "64"], diff: 2 },

            initializeGame() {
                this.loadQuestions();
                this.startQuestion();
            },

            loadQuestions() {
                let bankQuestions;
                if (this.category === 'random') {
                    // Mix from ALL categories
                    const allQ = [];
                    const cats = ['math', 'science', 'history', 'english', 'computers'];
                    cats.forEach(cat => allQ.push(...this.questionBank[cat]));
                    bankQuestions = allQ.sort(() => Math.random() - 0.5);
                } else {
                    bankQuestions = [...(this.questionBank[this.category] || [])].sort(() => Math.random() - 0.5);
                }
                this.questions = [];

                for (let i = 0; i < 10; i++) {
                    const q = bankQuestions[i % bankQuestions.length];
                    const answers = [q.correct, ...q.wrong].sort(() => Math.random() - 0.5);
                    this.questions.push({
                        ...q,
                        answers,
                        answerIndex: answers.indexOf(q.correct)
                    });
                }
            },

            goToCategories() {
                playSound('question');
                this.currentScreen = 'categories';
                document.getElementById('startScreen').classList.remove('active');
                document.getElementById('categoryScreen').classList.add('active');
                this.renderCategories();
            },

            renderCategories() {
                const grid = document.getElementById('categoryGrid');
                const categories = [
                    { name: 'Math', icon: '🔢', id: 'math' },
                    { name: 'Science', icon: '🔬', id: 'science' },
                    { name: 'History', icon: '📚', id: 'history' },
                    { name: 'English', icon: '📖', id: 'english' },
                    { name: 'Computers', icon: '💻', id: 'computers' },
                    { name: 'Random Mix', icon: '🎲', id: 'random' }
                ];

                grid.innerHTML = categories.map(cat => `
                    <div class="category-card ${cat.id}" onclick="game.selectCategory('${cat.id}')">
                        <div class="category-icon">${cat.icon}</div>
                        <div>${cat.name}</div>
                    </div>
                `).join('');
            },

            selectCategory(categoryId) {
                playSound('lifeline');
                if (categoryId === 'random') {
                    this.category = 'random';
                } else {
                    this.category = categoryId;
                }

                this.currentScreen = 'gameplay';
                document.getElementById('categoryScreen').classList.remove('active');
                document.getElementById('gameplayScreen').classList.add('active');

                this.resetGame();
                this.initializeGame();
                this.renderGameplay();
            },

            resetGame() {
                this.questionIndex = 0;
                this.coins = 0;
                this.correctAnswers = 0;
                this.streak = 0;
                this.maxStreak = 0;
                this.lifelines = { 'fifty': true, 'double': true };
                this.usedLifelines = new Set();
                this.transitioning = false;
                this.timerRunning = false;
                this.wheelSpun = false;
                this.doubleDipActive = false;
            },

            renderGameplay() {
                this.renderLifelines();
                this.renderLadder();
                this.startQuestion();
            },

            renderLifelines() {
                const container = document.getElementById('lifelinesContainer');
                container.innerHTML = `
                    <button class="lifeline-button ${this.usedLifelines.has('fifty') ? 'disabled' : ''}" onclick="game.use50()" ${this.usedLifelines.has('fifty') ? 'disabled' : ''}>50/50</button>
                    <button class="lifeline-button ${this.usedLifelines.has('double') ? 'disabled' : ''}" onclick="game.useDouble()" ${this.usedLifelines.has('double') ? 'disabled' : ''}>Double Dip</button>
                `;
            },

            renderLadder() {
                const ladder = document.getElementById('prizeLadder');
                const prizeValues = [10, 25, 50, 100, 250, 500, 750, 1000, 2500, 5000];

                let html = '<div class="ladder-title">PRIZE LADDER</div>';

                for (let i = 9; i >= 0; i--) {
                    const isCurrent = i === this.questionIndex;
                    const isPassed = i < this.questionIndex;
                    const isSafe = i === 4;

                    let className = 'ladder-item';
                    if (isCurrent) className += ' current';
                    if (isPassed) className += ' passed';
                    if (isSafe) className += ' safe';

                    const mark = isCurrent ? '>' : '';
                    const star = isSafe ? '*' : '';

                    html += `<div class="${className}">${mark} Q${i+1}: ${star}${prizeValues[i]}${star} ${mark}</div>`;
                }

                ladder.innerHTML = html;
            },

            startQuestion() {
                if (this.questionIndex >= 10) {
                    this.endGame();
                    return;
                }

                this.currentQuestion = this.questions[this.questionIndex];
                this.transitioning = false;
                this.timerRunning = true;

                playSound('question');
                this.renderQuestion();
                this.startTimer();
            },

            renderQuestion() {
                const number = this.questionIndex + 1;
                document.getElementById('questionNumber').textContent = 'Question ' + number + ' of 10';
                document.getElementById('questionText').textContent = this.currentQuestion.q;

                const grid = document.getElementById('answersGrid');
                grid.innerHTML = this.currentQuestion.answers.map((ans, idx) => `
                    <button class="answer-button" onclick="game.answerQuestion(${idx})" id="answer-${idx}">
                        ${String.fromCharCode(65 + idx)}: ${ans}
                    </button>
                `).join('');

                document.getElementById('coinDisplay').textContent = this.coins;
                this.updateStreakBadge();
            },

            startTimer() {
                const duration = 30;
                let elapsed = 0;
                const timerInterval = setInterval(() => {
                    if (!this.timerRunning) {
                        clearInterval(timerInterval);
                        return;
                    }

                    elapsed++;
                    const remaining = duration - elapsed;
                    const percent = (remaining / duration) * 100;

                    document.getElementById('timerFill').style.width = percent + '%';
                    document.getElementById('timerText').textContent = remaining + 's';

                    if (remaining <= 5) {
                        playSound('timer');
                    }

                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        this.handleTimeout();
                    }
                }, 1000);
            },

            handleTimeout() {
                this.timerRunning = false;
                if (this.transitioning) return;
                this.transitioning = true;

                const buttons = document.querySelectorAll('.answer-button');
                buttons.forEach(btn => btn.disabled = true);

                playSound('wrong');
                this.streak = 0;
                this.updateStreakBadge();

                setTimeout(() => {
                    this.questionIndex++;
                    this.nextQuestion();
                }, 1500);
            },

            answerQuestion(index) {
                if (this.transitioning || !this.timerRunning) return;
                this.transitioning = true;
                this.timerRunning = false;

                const buttons = document.querySelectorAll('.answer-button');
                buttons.forEach(btn => btn.disabled = true);

                const isCorrect = index === this.currentQuestion.answerIndex;

                if (isCorrect) {
                    playSound('correct');
                    playCrowd();
                    this.handleCorrectAnswer(index);
                } else {
                    playSound('wrong');
                    this.handleWrongAnswer(index);
                }
            },

            handleCorrectAnswer(index) {
                document.getElementById('answer-' + index).classList.add('correct');

                this.streak++;
                this.correctAnswers++;
                this.maxStreak = Math.max(this.maxStreak, this.streak);

                const prizeValues = [10, 25, 50, 100, 250, 500, 750, 1000, 2500, 5000];
                let earnedCoins = prizeValues[this.questionIndex];

                if (this.streak === 3) {
                    playSound('streak');
                    earnedCoins *= 2;
                }
                if (this.streak >= 5) {
                    playSound('streak');
                    earnedCoins *= 3;
                }

                this.coins += earnedCoins;
                this.createFloatingCoin(earnedCoins);
                this.updateStreakBadge();
                document.getElementById('coinDisplay').textContent = this.coins;

                setTimeout(() => {
                    if (this.questionIndex === 4 && !this.wheelSpun) {
                        this.wheelSpun = true;
                        this.spinWheelAfter();
                    } else {
                        this.questionIndex++;
                        this.nextQuestion();
                    }
                }, 1500);
            },

            handleWrongAnswer(index) {
                if (this.doubleDipActive) {
                    // Double Dip: disable the wrong answer and let them try again
                    this.doubleDipActive = false;
                    document.getElementById('answer-' + index).classList.add('wrong');
                    document.getElementById('answer-' + index).disabled = true;
                    this.transitioning = false;
                    this.timerRunning = true;
                    const badge = document.getElementById('streakBadge');
                    badge.textContent = 'TRY AGAIN!';
                    // Re-enable remaining buttons
                    const buttons = document.querySelectorAll('.answer-button');
                    buttons.forEach(btn => {
                        if (!btn.classList.contains('wrong')) btn.disabled = false;
                    });
                    return;
                }

                const correctIndex = this.currentQuestion.answerIndex;
                document.getElementById('answer-' + index).classList.add('wrong');
                document.getElementById('answer-' + correctIndex).classList.add('correct');

                this.streak = 0;
                this.updateStreakBadge();

                setTimeout(() => {
                    this.questionIndex++;
                    this.nextQuestion();
                }, 1500);
            },

            updateStreakBadge() {
                const badge = document.getElementById('streakBadge');
                if (this.streak >= 5) {
                    badge.textContent = '3x MULTIPLIER - UNSTOPPABLE!';
                    badge.classList.add('fire');
                } else if (this.streak >= 3) {
                    badge.textContent = '2x MULTIPLIER - ON FIRE!';
                    badge.classList.add('fire');
                } else {
                    badge.classList.remove('fire');
                }
            },

            use50() {
                if (this.usedLifelines.has('fifty') || this.transitioning) return;

                playSound('lifeline');
                this.usedLifelines.add('fifty');

                const buttons = document.querySelectorAll('.answer-button');
                const correct = this.currentQuestion.answerIndex;
                const wrongIndices = Array.from({length: 4}, (_, i) => i).filter(i => i !== correct);
                const toRemove = wrongIndices.slice(0, 2);

                toRemove.forEach(idx => {
                    document.getElementById('answer-' + idx).style.opacity = '0.2';
                    document.getElementById('answer-' + idx).disabled = true;
                });

                this.renderLifelines();
            },

            useDouble() {
                if (this.usedLifelines.has('double') || this.transitioning) return;

                playSound('lifeline');
                this.usedLifelines.add('double');
                this.doubleDipActive = true;
                this.renderLifelines();

                const badge = document.getElementById('streakBadge');
                badge.textContent = '2nd CHANCE ACTIVE!';
                badge.classList.add('fire');
            },

            // ── PRIZE WHEEL (Canvas-based) ──
            wheelSegments: [
                { label: '+100', color: '#ff6b6b', coins: 100, text: '+100 Bonus Coins!' },
                { label: '+200', color: '#ff8e53', coins: 200, text: '+200 Bonus Coins!' },
                { label: '+500', color: '#ffd700', coins: 500, text: '+500 Bonus Coins!' },
                { label: '2x', color: '#4facfe', coins: 0, text: '2x Next Question!' },
                { label: 'LIFE', color: '#00d4ff', coins: 0, text: 'Extra Lifeline!' },
                { label: 'JACKPOT', color: '#ff1493', coins: 1000, text: '🎉 JACKPOT! +1000 Coins! 🎉' }
            ],
            wheelAngle: 0,
            wheelSpinning: false,

            spinWheelAfter() {
                this.currentScreen = 'wheel';
                document.getElementById('gameplayScreen').classList.remove('active');
                document.getElementById('wheelScreen').classList.add('active');
                document.getElementById('wheelSpinBtn').disabled = false;
                document.getElementById('wheelResult').textContent = '';
                this.wheelAngle = 0;
                this.drawWheel(0);
            },

            drawWheel(rotation) {
                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const r = cx - 10;
                const segs = this.wheelSegments;
                const n = segs.length;
                const sliceAngle = (2 * Math.PI) / n;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation);

                for (let i = 0; i < n; i++) {
                    const startA = i * sliceAngle;
                    const endA = startA + sliceAngle;

                    // Draw pie slice
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, r, startA, endA);
                    ctx.closePath();
                    ctx.fillStyle = segs[i].color;
                    ctx.fill();
                    ctx.strokeStyle = '#1a0a2e';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Draw label
                    ctx.save();
                    ctx.rotate(startA + sliceAngle / 2);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.shadowColor = 'rgba(0,0,0,0.7)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(segs[i].label, r * 0.6, 0);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }

                // Center circle
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, 2 * Math.PI);
                ctx.fillStyle = '#1a0a2e';
                ctx.fill();
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('NAW', 0, 0);

                ctx.restore();

                // Gold border ring
                ctx.beginPath();
                ctx.arc(cx, cy, r + 4, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 6;
                ctx.stroke();
            },

            spinWheel() {
                if (this.wheelSpinning) return;
                this.wheelSpinning = true;
                document.getElementById('wheelSpinBtn').disabled = true;

                // Pick which segment to land on (pointer is at top = -PI/2)
                const n = this.wheelSegments.length;
                const sliceAngle = (2 * Math.PI) / n;
                const landIndex = Math.floor(Math.random() * n);

                // Calculate final angle so pointer (at top, -PI/2) points into the landed segment
                // Pointer is at angle -PI/2 (top). The segment center at rest is at landIndex * sliceAngle + sliceAngle/2.
                // We need: finalAngle + segCenter = -PI/2 + 2*PI*k  (modulo alignment)
                // But we also want clockwise, so we go negative offset
                const segCenter = landIndex * sliceAngle + sliceAngle / 2;
                const targetAngle = -segCenter - Math.PI / 2;
                const fullSpins = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
                const finalAngle = targetAngle + fullSpins;

                const duration = 4000;
                const startTime = performance.now();
                const startAngle = this.wheelAngle;
                const totalSpin = finalAngle - startAngle;

                // Tick sound interval (slows down)
                let lastTickAngle = startAngle;

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    // Ease out cubic
                    const eased = 1 - Math.pow(1 - t, 3);
                    const currentAngle = startAngle + totalSpin * eased;

                    this.drawWheel(currentAngle);

                    // Tick sound every ~30 degrees
                    const angleDiff = Math.abs(currentAngle - lastTickAngle);
                    if (angleDiff > 0.5) {
                        playSound('wheel');
                        lastTickAngle = currentAngle;
                    }

                    if (t < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.wheelAngle = currentAngle;
                        this.wheelSpinning = false;
                        this.onWheelLanded(landIndex);
                    }
                };
                requestAnimationFrame(animate);
            },

            onWheelLanded(segIndex) {
                const seg = this.wheelSegments[segIndex];
                playSound('correct');
                playCrowd();

                this.coins += seg.coins;
                document.getElementById('wheelResult').textContent = seg.text;

                // Flash the canvas border
                const canvas = document.getElementById('wheelCanvas');
                canvas.style.filter = 'drop-shadow(0 0 40px rgba(255, 215, 0, 1))';
                setTimeout(() => { canvas.style.filter = 'drop-shadow(0 0 20px rgba(255, 215, 0, 0.5))'; }, 500);

                setTimeout(() => {
                    this.currentScreen = 'gameplay';
                    document.getElementById('wheelScreen').classList.remove('active');
                    document.getElementById('gameplayScreen').classList.add('active');
                    this.questionIndex++;
                    this.nextQuestion();
                }, 2500);
            },

            nextQuestion() {
                this.renderLadder();
                this.startQuestion();
            },

            createFloatingCoin(amount) {
                const coin = document.createElement('div');
                coin.className = 'floating-coin';
                coin.textContent = '+' + amount + '!';
                coin.style.left = Math.random() * window.innerWidth + 'px';
                coin.style.top = window.innerHeight * 0.5 + 'px';
                document.body.appendChild(coin);

                setTimeout(() => coin.remove(), 1500);
            },

            endGame() {
                this.currentScreen = 'gameOver';
                document.getElementById('gameplayScreen').classList.remove('active');
                document.getElementById('gameOverScreen').classList.add('active');

                playSound('correct');
                setTimeout(() => playCrowd(), 200);
                setTimeout(() => playCrowd(), 400);

                const finalQuestion = this.questionIndex;
                const prizeValues = [10, 25, 50, 100, 250, 500, 750, 1000, 2500, 5000];
                const finalPrize = prizeValues[Math.min(finalQuestion - 1, 9)];

                document.getElementById('gameOverTitle').textContent = this.correctAnswers === 10 ? 'PERFECT GAME!' : 'YOU DID IT!';
                document.getElementById('statsCorrect').textContent = this.correctAnswers;
                document.getElementById('statsStreak').textContent = this.maxStreak;
                document.getElementById('statsFinal').textContent = 'Q' + finalQuestion;
                document.getElementById('finalCoins').textContent = this.coins;
            }
        };
    </script>
</body>
</html>
