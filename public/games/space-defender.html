<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Defender</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 20px;
    display: flex; justify-content: space-between;
    color: #06b6d4; font-size: 16px; font-weight: bold;
    text-shadow: 0 0 10px rgba(6,182,212,0.5);
    pointer-events: none;
  }
  #start-screen, #game-over {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center;
    background: rgba(10,10,26,0.9);
  }
  #game-over { display: none; }
  h1 { font-size: 28px; margin-bottom: 10px; color: #06b6d4;
    text-shadow: 0 0 20px rgba(6,182,212,0.5); }
  .sub { color: #888; font-size: 14px; margin-bottom: 30px; }
  .btn {
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    border: none; color: white; padding: 12px 32px;
    font-size: 16px; border-radius: 12px; cursor: pointer;
    font-family: 'Courier New', monospace; font-weight: bold;
  }
  .btn:hover { opacity: 0.9; }
  .controls { color: #666; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span id="score-display">Score: 0</span>
  <span id="lives-display">Lives: 3</span>
</div>

<div id="start-screen">
  <h1>SPACE DEFENDER</h1>
  <p class="sub">Defend Earth from alien invaders!</p>
  <button class="btn" onclick="startGame()">START GAME</button>
  <p class="controls">Arrow keys or A/D to move | Space to shoot</p>
</div>

<div id="game-over">
  <h1>GAME OVER</h1>
  <p class="sub" id="final-score">Score: 0</p>
  <button class="btn" onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let player, bullets, enemies, particles, stars, score, lives, gameRunning, spawnTimer;

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if(e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', e => keys[e.key] = false);

// Stars background
function initStars() {
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.5 + 0.2 });
  }
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  player = { x: W / 2, y: H - 60, w: 30, h: 30, speed: 5, cooldown: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  spawnTimer = 0;
  gameRunning = true;
  initStars();
  loop();
}

function spawnEnemy() {
  const types = [
    { w: 25, h: 25, speed: 1.5, color: '#ef4444', hp: 1, points: 10 },
    { w: 35, h: 35, speed: 1, color: '#f59e0b', hp: 2, points: 25 },
    { w: 20, h: 20, speed: 2.5, color: '#ec4899', hp: 1, points: 15 },
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  enemies.push({ x: Math.random() * (W - 60) + 30, y: -30, ...t });
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
      life: 1, color, size: Math.random() * 3 + 1
    });
  }
}

function update() {
  // Player movement
  if ((keys['ArrowLeft'] || keys['a']) && player.x > 15) player.x -= player.speed;
  if ((keys['ArrowRight'] || keys['d']) && player.x < W - 15) player.x += player.speed;

  // Shooting
  if (keys[' '] && player.cooldown <= 0) {
    bullets.push({ x: player.x, y: player.y - 15, vy: -8 });
    player.cooldown = 12;
  }
  player.cooldown--;

  // Bullets
  bullets = bullets.filter(b => {
    b.y += b.vy;
    return b.y > -10;
  });

  // Enemies
  spawnTimer++;
  if (spawnTimer > Math.max(30, 90 - score / 5)) {
    spawnEnemy();
    spawnTimer = 0;
  }

  enemies = enemies.filter(e => {
    e.y += e.speed;
    // Hit player
    if (Math.abs(e.x - player.x) < (e.w + player.w) / 2 && Math.abs(e.y - player.y) < (e.h + player.h) / 2) {
      lives--;
      addParticles(e.x, e.y, '#ef4444', 15);
      document.getElementById('lives-display').textContent = 'Lives: ' + lives;
      if (lives <= 0) {
        gameRunning = false;
        document.getElementById('final-score').textContent = 'Score: ' + score;
        document.getElementById('game-over').style.display = 'flex';
      }
      return false;
    }
    // Off screen
    if (e.y > H + 30) return false;

    // Check bullet hits
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (Math.abs(b.x - e.x) < e.w / 2 + 4 && Math.abs(b.y - e.y) < e.h / 2 + 4) {
        bullets.splice(i, 1);
        e.hp--;
        addParticles(b.x, b.y, e.color, 8);
        if (e.hp <= 0) {
          score += e.points;
          document.getElementById('score-display').textContent = 'Score: ' + score;
          addParticles(e.x, e.y, e.color, 20);
          return false;
        }
      }
    }
    return true;
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    return p.life > 0;
  });

  // Stars
  stars.forEach(s => {
    s.y += s.sp;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  });
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${s.s / 3})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });

  // Player (triangle ship)
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle = '#06b6d4';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#06b6d4';
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(-12, 12);
  ctx.lineTo(12, 12);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Bullets
  bullets.forEach(b => {
    ctx.fillStyle = '#7c3aed';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#7c3aed';
    ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    ctx.shadowBlur = 0;
  });

  // Enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.w / 2, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.fillRect(e.x - 5, e.y - 3, 3, 4);
    ctx.fillRect(e.x + 2, e.y - 3, 3, 4);
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function loop() {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
