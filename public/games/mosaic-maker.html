<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mosaic Maker</title>
<style>
  :root {
    --bg: #17112b;
    --bg2: #2a1f4d;
    --card: #2f2554;
    --gold: #f6c445;
    --orange: #f59e0b;
    --ink: #fff8e7;
    --round: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--round); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  .screen {
    position: fixed; inset: 0; display: none;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    background: radial-gradient(circle at 50% 12%, var(--bg2), var(--bg) 70%);
  }
  .screen.active { display: flex; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  /* Start */
  #start { flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin; }
  #start.wide { flex-direction: row; gap: 6vmin; }
  #startText { display: flex; flex-direction: column; align-items: center; gap: 3vmin; }
  #demoFrame { padding: 7px; border-radius: 22px; background: linear-gradient(145deg, #ffe08a, #c98a1d); box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: floaty 4s ease-in-out infinite; }
  #demo { display: block; border-radius: 16px; width: min(72vw, 52vh); height: min(72vw, 52vh); }
  #start.wide #demo { width: 72vh; height: 72vh; }
  h1 { font-size: clamp(38px, 10vmin, 78px); line-height: .95; text-align: center; letter-spacing: 1px; text-shadow: 0 5px 0 #8a4c00, 0 10px 22px rgba(0,0,0,.5); color: var(--gold); }
  h1 span { display: block; color: #fff; }
  .bigBtn {
    display: flex; align-items: center; justify-content: center; font-size: 42px; width: 140px; height: 86px; border-radius: 28px;
    background: linear-gradient(#ffd25e, var(--orange)); box-shadow: 0 8px 0 #a55f00, 0 14px 24px rgba(0,0,0,.45); color: #4d2a00;
    animation: bob 1.3s ease-in-out infinite;
  }
  .bigBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #a55f00; animation: none; }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.05); } }
  @keyframes floaty { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg) translateY(-5px); } }

  /* Gallery */
  #gallery { flex-direction: column; gap: 10px; align-items: center; }
  #tabs { display: flex; gap: 8px; width: 100%; max-width: 760px; align-items: center; }
  .tab, .iconBtn {
    flex: 1; height: 64px; font-size: 36px; border-radius: 18px; background: var(--card);
    box-shadow: 0 4px 0 #181030; transition: transform .12s;
  }
  .iconBtn { flex: 0 0 56px; height: 56px; font-size: 26px; }
  .tab.on { background: linear-gradient(#ffd25e, var(--orange)); box-shadow: 0 4px 0 #a55f00; transform: translateY(-2px) scale(1.05); }
  .tab:active, .iconBtn:active { transform: translateY(3px); }
  #cards { flex: 1; min-height: 0; width: 100%; max-width: 760px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
  #cards.wide { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; max-width: 1100px; align-items: center; }
  .pic {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 0; min-width: 0;
    border-radius: 18px; background: var(--card); padding: 7px; box-shadow: 0 5px 0 #181030; animation: popIn .32s both;
  }
  .pic:active { transform: translateY(4px) scale(.98); }
  .pic canvas { flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; display: block; }
  .dots { display: flex; gap: 4px; height: 12px; flex: none; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .pic .starRow { position: absolute; top: 2px; right: 6px; font-size: 19px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); }
  @keyframes popIn { 0% { transform: scale(.4) rotate(-5deg); opacity: 0; } 65% { transform: scale(1.05) rotate(1deg); opacity: 1; } 100% { transform: scale(1); } }

  /* Play */
  #play { display: none; flex-direction: column; gap: 8px; }
  #play.active { display: grid; grid-template-rows: auto minmax(0,1fr) auto; grid-template-columns: minmax(0,1fr); }
  #play.wide.active { grid-template-columns: minmax(0,1fr) minmax(190px, 25vw); grid-template-rows: auto minmax(0,1fr); }
  #hud { display: flex; gap: 8px; align-items: center; }
  #play.wide #hud { grid-column: 1 / 3; }
  #bar { flex: 1; height: 24px; border-radius: 14px; background: #120c24; box-shadow: inset 0 2px 5px #000; overflow: hidden; }
  #barFill { height: 100%; width: 0; border-radius: 14px; background: linear-gradient(90deg, #ff6a88, #ffc246, #65dc6f, #47bff5, #a071ff); background-size: 300px 100%; transition: width .2s; }
  #boardWrap { display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
  #frame { padding: 6px; border-radius: 16px; background: linear-gradient(145deg, #ffe08a, #b97b14); box-shadow: 0 8px 26px rgba(0,0,0,.5); }
  #board { display: block; border-radius: 10px; touch-action: none; cursor: crosshair; }
  #dock { position: relative; min-height: 148px; display: flex; align-items: center; justify-content: center; }
  #play.wide #dock { min-height: 0; height: 100%; }
  #palette { display: grid; grid-template-columns: repeat(4, minmax(0, 76px)); gap: 7px 9px; width: 100%; justify-content: center; }
  #palette.five { grid-template-columns: repeat(5, minmax(0, 68px)); }
  #play.wide #palette, #play.wide #palette.five { grid-template-columns: repeat(2, minmax(0, 88px)); }
  .pot {
    position: relative; aspect-ratio: 1; width: 100%; border-radius: 50%; padding: 6px;
    background: conic-gradient(#fff var(--p, 0%), rgba(255,255,255,.17) 0);
    box-shadow: 0 5px 0 rgba(0,0,0,.42); transition: transform .14s cubic-bezier(.3,1.7,.5,1);
  }
  .pot b {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%;
    font-size: clamp(24px, 8vmin, 38px); font-weight: 900; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.3);
  }
  .pot.sel { transform: translateY(-6px) scale(1.14); box-shadow: 0 0 0 4px var(--gold), 0 9px 16px rgba(0,0,0,.5); z-index: 2; }
  .pot.done b { opacity: .5; }
  .pot.done::after {
    content: "\2713"; position: absolute; right: -2px; top: -4px; width: 30px; height: 30px; border-radius: 50%;
    background: #36c763; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900;
    animation: popIn .4s both;
  }
  .pot.nudge { animation: nudge .55s; }
  #palette.wake .pot:not(.done) { animation: bob 1s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 25% { transform: scale(1.3) rotate(-8deg); } 55% { transform: scale(1.22) rotate(8deg); } }
  #hand { position: absolute; font-size: 42px; pointer-events: none; display: none; z-index: 20; animation: tap 1s ease-in-out infinite; filter: drop-shadow(0 3px 3px rgba(0,0,0,.6)); }
  @keyframes tap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

  #donePanel { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; animation: popIn .45s both; }
  #doneName { font-size: clamp(26px, 7vmin, 44px); font-weight: 900; color: var(--gold); text-shadow: 0 3px 0 #6e3f00; line-height: 1; }
  #doneStars { font-size: 28px; height: 32px; letter-spacing: 2px; }
  #doneStars span { display: inline-block; animation: popIn .45s both; }
  #doneBtns { display: flex; gap: 10px; }
  #doneBtns button { width: 76px; height: 54px; border-radius: 16px; font-size: 28px; background: var(--card); box-shadow: 0 5px 0 #181030; }
  #doneBtns button:active { transform: translateY(4px); }
  #btnNext { background: linear-gradient(#ffd25e, var(--orange)) !important; box-shadow: 0 5px 0 #a55f00 !important; color: #4d2a00; animation: bob 1.3s ease-in-out infinite; }
  #play.wide #doneBtns { flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<div id="start" class="screen active">
  <div id="demoFrame"><canvas id="demo"></canvas></div>
  <div id="startText">
    <h1>Mosaic<span>Maker</span></h1>
    <button id="btnPlay" class="bigBtn" aria-label="Play">&#9654;</button>
  </div>
</div>

<div id="gallery" class="screen">
  <div id="tabs"></div>
  <div id="cards"></div>
</div>

<div id="play" class="screen">
  <div id="hud">
    <button id="btnHome" class="iconBtn" aria-label="Back to pictures">&#127968;</button>
    <div id="bar"><div id="barFill"></div></div>
    <button id="btnMute" class="iconBtn" aria-label="Sound on or off">&#128266;</button>
  </div>
  <div id="boardWrap"><div id="frame"><canvas id="board"></canvas></div></div>
  <div id="dock">
    <div id="palette"></div>
    <div id="donePanel">
      <div id="doneName"></div>
      <div id="doneStars"></div>
      <div id="doneBtns">
        <button id="btnAgain" aria-label="Paint again">&#128260;</button>
        <button id="btnGallery" aria-label="All pictures">&#128444;&#65039;</button>
        <button id="btnNext" aria-label="Next picture">&#9654;</button>
      </div>
    </div>
  </div>
</div>
<div id="hand">&#128070;</div>
<canvas id="fx"></canvas>

<script>
'use strict';
/* ==========================================================================
   PICTURES. Each one is drawn in a 200 x 200 space with palette indexes.
   The builder turns the drawing into hand-set mosaic tiles.
   ========================================================================== */
const THEMES = [
  { id: 'dino', icon: '\u{1F995}' },
  { id: 'truck', icon: '\u{1F69A}' },
  { id: 'animal', icon: '\u{1F981}' },
  { id: 'space', icon: '\u{1F680}' },
];

const PICS = [
  /* ---------- DINOSAURS ---------- */
  { id: 'longneck', theme: 'dino', name: 'Long Neck!', sfx: 'roar', tiles: 72,
    pal: [['#58c1f2','blue'],['#ffd02e','yellow'],['#56b947','green'],['#8d5bd8','purple'],['#2a2140','black']],
    draw(g) {
      g.bg(0); g.c(1, 42, 42, 25);
      g.rect(2, 0, 164, 200, 36);
      g.l(3, 15, 62, 124, 30, 138, 8, 160);
      g.e(3, 100, 118, 54, 33);
      g.rect(3, 62, 130, 19, 44, 6); g.rect(3, 118, 130, 19, 44, 6);
      g.l(3, 22, 135, 104, 158, 72, 162, 42);
      g.e(3, 170, 36, 24, 16);
      g.c(4, 176, 31, 7);
    } },
  { id: 'trex', theme: 'dino', name: 'T-Rex!', sfx: 'roar', tiles: 105,
    pal: [['#ff8a3d','orange'],['#ffd25e','yellow'],['#3fae49','green'],['#b7e36b','light green'],['#ffffff','white'],['#2a2140','black']],
    draw(g) {
      g.rings(145, 50, 28, 0, 1);
      g.p(2, 62, 90, 6, 158, 16, 168, 78, 150);
      g.e(2, 88, 115, 44, 44);
      g.rect(2, 66, 145, 24, 42, 6); g.rect(2, 104, 145, 24, 42, 6);
      g.e(3, 104, 124, 22, 28);
      g.rect(2, 86, 32, 104, 48, 18);
      g.rect(2, 100, 88, 78, 20, 8);
      g.rect(5, 112, 78, 78, 10);
      g.p(4, 124, 78, 138, 78, 131, 91); g.p(4, 146, 78, 160, 78, 153, 91); g.p(4, 168, 78, 184, 78, 176, 91);
      g.c(4, 118, 53, 14); g.c(5, 122, 53, 8);
      g.l(2, 9, 108, 110, 132, 126);
      g.rect(5, 0, 184, 200, 16);
    } },
  { id: 'trike', theme: 'dino', name: 'Triceratops!', sfx: 'roar', tiles: 135,
    pal: [['#bcd7ff','sky blue'],['#65c24f','green'],['#7d4a26','brown'],['#2c7fd6','blue'],['#ff7f27','orange'],['#fff2c8','cream'],['#221a35','black']],
    draw(g) {
      g.bg(0);
      g.p(2, 0, 150, 55, 42, 110, 150); g.p(4, 40, 70, 55, 42, 70, 70);
      g.rect(1, 0, 156, 200, 44);
      g.p(3, 45, 108, 42, 136, 2, 150);
      g.e(3, 86, 124, 52, 34);
      g.rect(3, 50, 136, 20, 42, 6); g.rect(3, 104, 136, 20, 42, 6);
      g.c(4, 126, 96, 37);
      g.c(5, 106, 76, 7); g.c(5, 132, 66, 7); g.c(5, 156, 78, 7);
      g.e(3, 145, 118, 30, 26);
      g.p(3, 165, 110, 196, 126, 165, 142);
      g.p(5, 146, 100, 160, 104, 192, 66);
      g.p(5, 172, 112, 182, 118, 192, 92);
      g.c(6, 151, 113, 8);
    } },
  { id: 'stego', theme: 'dino', name: 'Stegosaurus!', sfx: 'roar', tiles: 165,
    pal: [['#3cc4c4','teal'],['#ffffff','white'],['#ffd93d','yellow'],['#4fb64a','green'],['#1e6e3a','dark green'],['#f39c34','orange'],['#df3f4e','red'],['#231a36','black']],
    draw(g) {
      g.bg(0); g.c(2, 165, 34, 20);
      g.e(1, 70, 30, 30, 12); g.e(1, 95, 40, 22, 10);
      g.rect(4, 12, 72, 12, 95, 4);
      g.e(3, 18, 66, 32, 13, -.35); g.e(3, 22, 72, 30, 12, .45);
      g.rect(3, 0, 160, 200, 40);
      const plates = [[50,102],[73,88],[97,82],[121,85],[143,97]];
      plates.forEach(q => g.p(6, q[0]-14, q[1]+18, q[0], q[1]-14, q[0]+14, q[1]+18));
      g.l(5, 14, 50, 124, 22, 140, 4, 160);
      g.p(7, 12, 142, 6, 122, 22, 136); g.p(7, 24, 138, 22, 116, 36, 130);
      g.e(5, 98, 124, 56, 30);
      g.rect(5, 62, 134, 19, 42, 6); g.rect(5, 116, 134, 19, 42, 6);
      g.l(5, 16, 148, 124, 172, 134);
      g.e(5, 178, 136, 19, 13);
      g.c(7, 184, 132, 4);
    } },

  /* ---------- TRUCKS AND MACHINES ---------- */
  { id: 'dump', theme: 'truck', name: 'Dump Truck!', sfx: 'horn', tiles: 72,
    pal: [['#6bc9f5','blue'],['#ffc928','yellow'],['#25202f','black'],['#9a5b2c','brown'],['#ffffff','white']],
    draw(g) {
      g.bg(0);
      g.rect(3, 0, 172, 200, 28);
      g.e(3, 68, 62, 46, 28);
      g.p(1, 12, 62, 124, 62, 112, 128, 30, 128);
      g.rect(1, 124, 74, 62, 62, 10);
      g.rect(4, 140, 84, 36, 28, 4);
      g.rect(2, 18, 126, 168, 16);
      g.c(2, 54, 150, 26); g.c(4, 54, 150, 10);
      g.c(2, 152, 150, 26); g.c(4, 152, 150, 10);
    } },
  { id: 'fire', theme: 'truck', name: 'Fire Truck!', sfx: 'siren', tiles: 105,
    pal: [['#9ad9f7','sky blue'],['#e8352f','red'],['#ffffff','white'],['#25202f','black'],['#ffd21f','yellow'],['#8f93a3','gray']],
    draw(g) {
      g.bg(0);
      g.rect(5, 0, 170, 200, 30);
      g.rect(1, 8, 78, 132, 70, 6);
      g.p(1, 136, 148, 136, 58, 170, 58, 194, 102, 194, 148);
      g.p(2, 148, 68, 167, 68, 182, 100, 148, 100);
      g.rect(2, 8, 112, 186, 12);
      g.rect(4, 24, 128, 28, 14, 3); g.rect(4, 72, 128, 28, 14, 3);
      g.l(5, 7, 14, 60, 128, 60);
      g.l(5, 7, 14, 44, 128, 44);
      [28, 50, 72, 94, 116].forEach(x => g.l(5, 6, x, 44, x, 60));
      g.rect(4, 150, 42, 20, 16, 4);
      g.c(3, 44, 156, 24); g.c(5, 44, 156, 10);
      g.c(3, 156, 156, 24); g.c(5, 156, 156, 10);
    } },
  { id: 'digger', theme: 'truck', name: 'Excavator!', sfx: 'rumble', tiles: 135,
    pal: [['#8fd8f7','blue'],['#d6f2ff','light blue'],['#ffbf1f','yellow'],['#272230','black'],['#9196a6','gray'],['#ffffff','white'],['#a2632f','brown']],
    draw(g) {
      g.rays(100, 100, 14, 0, 1);
      g.rect(6, 0, 172, 200, 28); g.e(6, 172, 170, 38, 24);
      g.rect(3, 12, 146, 112, 36, 18);
      [32, 68, 104].forEach(x => g.c(4, x, 164, 11));
      g.rect(2, 22, 94, 92, 52, 8);
      g.rect(5, 34, 62, 44, 44, 6);
      g.rect(2, 28, 56, 56, 11, 4);
      g.l(2, 18, 100, 116, 134, 44);
      g.l(2, 14, 134, 44, 172, 92);
      g.p(4, 158, 94, 188, 86, 190, 124, 160, 128);
    } },
  { id: 'monster', theme: 'truck', name: 'Monster Truck!', sfx: 'rumble', tiles: 165,
    pal: [['#3b2a86','purple'],['#6a4bd1','violet'],['#e8302f','red'],['#ff8b1f','orange'],['#ffdf2e','yellow'],['#ffffff','white'],['#191622','black'],['#9da2b2','gray']],
    draw(g) {
      g.rings(100, 90, 24, 0, 1);
      g.rect(3, 0, 182, 200, 18);
      [[46,144],[154,144]].forEach(w => {
        g.c(6, w[0], w[1], 42);
        for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; g.c(6, w[0] + Math.cos(a) * 42, w[1] + Math.sin(a) * 42, 7); }
        g.c(7, w[0], w[1], 17);
      });
      g.rect(7, 40, 104, 120, 12);
      g.rect(2, 8, 66, 184, 42, 14);
      g.p(2, 62, 70, 80, 26, 140, 26, 154, 70);
      g.p(5, 86, 34, 106, 34, 106, 66, 72, 66); g.p(5, 114, 34, 136, 34, 146, 66, 114, 66);
      g.p(3, 12, 102, 30, 78, 38, 88, 52, 72, 60, 86, 76, 76, 70, 102);
      g.p(4, 22, 102, 34, 88, 42, 96, 54, 84, 62, 102);
      g.c(4, 186, 80, 7);
    } },

  /* ---------- ANIMALS ---------- */
  { id: 'lion', theme: 'animal', name: 'Lion!', sfx: 'roar', tiles: 72,
    pal: [['#54c6a8','green'],['#e9791d','orange'],['#ffd052','yellow'],['#ffffff','white'],['#2b1f24','black']],
    draw(g) {
      g.bg(0);
      for (let i = 0; i < 14; i++) { const a = i * Math.PI / 7; g.c(1, 100 + Math.cos(a) * 66, 100 + Math.sin(a) * 66, 24); }
      g.c(1, 100, 100, 72);
      g.c(2, 54, 58, 19); g.c(2, 146, 58, 19);
      g.c(2, 100, 104, 53);
      g.c(4, 78, 90, 9); g.c(4, 122, 90, 9);
      g.e(3, 100, 128, 29, 21);
      g.p(4, 86, 110, 114, 110, 100, 126);
    } },
  { id: 'turtle', theme: 'animal', name: 'Sea Turtle!', sfx: 'bloop', tiles: 105,
    pal: [['#27a7dc','blue'],['#74d5f4','light blue'],['#238a4b','dark green'],['#b9dd4b','lime'],['#74c66e','green'],['#1f2233','black']],
    draw(g) {
      g.rings(100, 100, 26, 0, 1);
      g.e(4, 42, 54, 30, 15, .75); g.e(4, 158, 54, 30, 15, -.75);
      g.e(4, 52, 150, 24, 13, -.7); g.e(4, 148, 150, 24, 13, .7);
      g.e(4, 100, 34, 22, 25);
      g.c(5, 88, 26, 7); g.c(5, 112, 26, 7);
      g.e(2, 100, 106, 58, 64);
      const hex = (cx, cy, r) => { const a = []; for (let i = 0; i < 6; i++) { a.push(cx + Math.cos(i * Math.PI / 3 + Math.PI / 6) * r, cy + Math.sin(i * Math.PI / 3 + Math.PI / 6) * r); } g.p(3, ...a); };
      hex(100, 106, 21); hex(100, 66, 15); hex(100, 146, 15); hex(66, 86, 14); hex(134, 86, 14); hex(66, 128, 14); hex(134, 128, 14);
    } },
  { id: 'fox', theme: 'animal', name: 'Fox!', sfx: 'chirp', tiles: 135,
    pal: [['#90d8f5','blue'],['#63bd55','green'],['#f47b20','orange'],['#ffffff','white'],['#231c27','black'],['#ff6fae','pink'],['#ffdc35','yellow']],
    draw(g) {
      g.bg(0);
      g.e(1, 100, 196, 150, 50);
      [[20,160],[180,160],[36,186],[166,186]].forEach((q) => {
        for (let i = 0; i < 5; i++) g.c(5, q[0] + Math.cos(i * 1.26) * 11, q[1] + Math.sin(i * 1.26) * 11, 7);
        g.c(6, q[0], q[1], 7);
      });
      g.p(2, 30, 16, 80, 56, 40, 82); g.p(2, 170, 16, 120, 56, 160, 82);
      g.p(4, 30, 16, 46, 28, 36, 42); g.p(4, 170, 16, 154, 28, 164, 42);
      g.p(2, 24, 76, 60, 48, 140, 48, 176, 76, 164, 112, 100, 178, 36, 112);
      g.p(3, 24, 80, 88, 118, 100, 178, 36, 112);

      const need = tiles.filter(t => t.c === sel && !t.done);
      const idle = now - lastAct > 5000, few = need.length <= 4;
      if (idle || few) {
        const pulse = .28 + .28 * Math.sin(now / 230);
        bctx.fillStyle = `rgba(255,255,255,${pulse})`;
        need.forEach(t => { fillShape(bctx, t, bScale); });
      }
    } else if (!finished && !inWave && now - lastAct > 6000) {
      wakePalette(true);
    }
    anims = anims.filter(a => now < a.start + a.dur);
    for (const a of anims) {
      if (now < a.start) continue;
      const q = (now - a.start) / a.dur, t = a.t;
      bctx.save();
      if (a.type === 'wiggle') {
        bctx.translate(Math.sin(q * 18) * 4 * (1 - q), 0);
                paintTile(bctx, t, bScale, cur.pal, { sel });
      } else {
        const big = a.type === 'wave' ? .55 : .42;
        const sc = 1 + big * Math.sin(Math.min(1, q) * Math.PI) * (1 - q * .35);
        bctx.translate(t.cx * bScale, t.cy * bScale); bctx.scale(sc, sc); bctx.translate(-t.cx * bScale, -t.cy * bScale);
        paintTile(bctx, t, bScale, cur.pal, { sel, forcePaint: true });
        bctx.fillStyle = `rgba(255,255,255,${(1 - q) * .55})`; fillShape(bctx, t, bScale);
        if (a.type === 'wave' && !a.rang) { a.rang = true; const p = tileScreen(t); if (t.i % 3 === 0) burst(p[0], p[1], '#ffe99a', 2, 2); }
      }
      bctx.restore();
    }
    // Golden shine sweeping over a finished mosaic.
    if (finished && !inWave) {
      const cycle = (now - shineAt) % 3400;
      if (cycle < 1300) {
        const x = (cycle / 1300) * bSize * 1.8 - bSize * .4;
        const gr = bctx.createLinearGradient(x - 70, 0, x + 70, 44);
        gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.42)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        bctx.save(); bctx.globalCompositeOperation = 'lighter'; bctx.fillStyle = gr; bctx.fillRect(0, 0, bSize, bSize); bctx.restore();
      }
    }
  } catch (err) { console.error(err); }
}

/* ---------- Buttons ---------- */
$('btnPlay').onclick = () => { ensureAudio(); play('colorDone'); renderGallery(); show('gallery'); };
$('btnHome').onclick = () => { ensureAudio(); play('pick'); persist(); renderGallery(); show('gallery'); };
$('btnGallery').onclick = () => { play('pick'); renderGallery(); show('gallery'); };
$('btnAgain').onclick = () => { play('pick'); openPic(cur.id, true); };
$('btnNext').onclick = () => { play('colorDone'); openPic(nextPic().id); };
function syncMute() { $('btnMute').textContent = muted ? '\u{1F507}' : '\u{1F50A}'; }
$('btnMute').onclick = () => {
  ensureAudio(); muted = !muted; save.muted = muted; persist(); syncMute();
  if (muted && window.speechSynthesis) speechSynthesis.cancel(); else play('pick');
};
document.addEventListener('keydown', e => {
  if (screen !== 'play') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= cur.pal.length) pickColor(n - 1);
  if (e.key === 'Escape') $('btnHome').click();
});
document.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 220));

syncMute();
layout();
startDemo();
requestAnimationFrame(frame);
</script>
