<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOMBIE ESCAPE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            gap: 20px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bar {
            width: 150px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s;
        }

        .hp-fill {
            background: #ff3333;
        }

        .xp-fill {
            background: #ffff00;
        }

        .hud-right {
            text-align: right;
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .start-screen.hidden {
            display: none;
        }

        .game-title {
            font-size: 80px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px #00aa00, 0 0 60px #00aa00;
            margin-bottom: 30px;
            letter-spacing: 4px;
            font-style: italic;
        }

        .start-text {
            font-size: 32px;
            color: white;
            animation: pulse 1s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(200, 0, 0, 0.7);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .game-over-screen.hidden {
            display: none;
        }

        .game-over-title {
            font-size: 80px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px #ff0000;
            margin-bottom: 30px;
        }

        .game-over-stats {
            font-size: 24px;
            color: white;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .play-again-btn {
            padding: 15px 40px;
            font-size: 28px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .play-again-btn:hover {
            background: #ff6666;
            box-shadow: 0 0 30px rgba(255, 0, 0, 1);
        }

        .joystick-container {
            position: fixed;
            bottom: 40px;
            left: 40px;
            z-index: 15;
            display: none;
        }

        .joystick-container.show {
            display: block;
        }

        .joystick-bg {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(100, 100, 100, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.5);
            position: relative;
            touch-action: none;
        }

        .joystick-stick {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 100, 100, 0.8);
            position: absolute;
            top: 30px;
            left: 30px;
            cursor: grab;
            touch-action: none;
        }

        .weapons-display {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            gap: 15px;
        }

        .weapon-icon {
            width: 50px;
            height: 50px;
            background: rgba(100, 100, 100, 0.6);
            border: 2px solid white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .ability-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.7);
            border: 2px solid white;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            touch-action: none;
        }

        .ability-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="start-screen" id="startScreen">
        <div class="game-title">ZOMBIE ESCAPE</div>
        <div class="start-text">TAP TO PLAY</div>
    </div>

    <div class="game-over-screen hidden" id="gameOverScreen">
        <div class="game-over-title">YOU DIED</div>
        <div class="game-over-stats">
            <div>Wave: <span id="finalWave">1</span></div>
            <div>Zombies Killed: <span id="finalKills">0</span></div>
            <div>Time Survived: <span id="finalTime">0:00</span></div>
            <div>Max Combo: <span id="finalCombo">0</span></div>
        </div>
        <button class="play-again-btn">PLAY AGAIN</button>
    </div>

    <div class="hud" id="hud">
        <div class="hud-left">
            <div class="stat">
                <div>HP:</div>
                <div class="bar">
                    <div class="bar-fill hp-fill" id="hpBar"></div>
                </div>
            </div>
            <div class="stat">
                <div>LVL <span id="level">1</span>:</div>
                <div class="bar">
                    <div class="bar-fill xp-fill" id="xpBar"></div>
                </div>
            </div>
        </div>
        <div class="hud-right">
            <div>Wave: <span id="waveNum">1</span></div>
            <div>Killed: <span id="killCount">0</span></div>
            <div>Time: <span id="timeDisplay">0:00</span></div>
            <div>Combo: <span id="comboDisplay">x0</span></div>
        </div>
    </div>

    <div class="joystick-container" id="joystickContainer">
        <div class="joystick-bg" id="joystickBg">
            <div class="joystick-stick" id="joystickStick"></div>
        </div>
    </div>

    <div class="weapons-display" id="weaponsDisplay"></div>
    <button class="ability-btn" id="abilityBtn">DASH</button>

    <script>
        // ============ AUDIO ENGINE ============
        const AudioEngine = {
            ctx: null,
            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },

            playSound(freq, duration, type = 'sine', volume = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = type;
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            },

            playNoise(duration, volume = 0.1) {
                if (!this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * duration;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    source.start(this.ctx.currentTime);
                } catch (e) {}
            },

            shoot() {
                this.playSound(200, 0.05, 'sine', 0.15);
                this.playNoise(0.03, 0.05);
            },

            shotgun() {
                this.playSound(80, 0.1, 'sine', 0.2);
                this.playNoise(0.1, 0.15);
            },

            bow() {
                this.playSound(300, 0.1, 'sine', 0.12);
            },

            rifle() {
                this.playSound(150, 0.02, 'sine', 0.1);
            },

            rocket() {
                this.playSound(100, 0.2, 'sine', 0.25);
                this.playNoise(0.15, 0.2);
            },

            pickup() {
                this.playSound(800, 0.1, 'sine', 0.2);
                this.playSound(1000, 0.08, 'sine', 0.15);
            },

            levelup() {
                this.playSound(400, 0.1, 'sine', 0.2);
                this.playSound(600, 0.1, 'sine', 0.2);
                this.playSound(800, 0.15, 'sine', 0.2);
            },

            damage() {
                this.playNoise(0.08, 0.1);
            },

            zombieDeath() {
                this.playNoise(0.1, 0.08);
                this.playSound(150, 0.08, 'sine', 0.08);
            }
        };

        // ============ CANVAS SETUP ============
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
        }
        resize();
        window.addEventListener('resize', resize);

        // ============ GAME STATE ============
        const WORLD_SIZE = 1600;
        const WAVE_DURATION = 30;

        let gameState = {
            running: false,
            gameOver: false,
            wave: 1,
            time: 0,
            kills: 0,
            combo: 0,
            maxCombo: 0,
            comboTimer: 0
        };

        let player = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            vx: 0,
            vy: 0,
            speed: 4,
            radius: 12,
            hp: 100,
            maxHp: 100,
            level: 1,
            xp: 0,
            xpToLevel: 10,
            weapons: [],
            dashCooldown: 0
        };

        // CRITICAL: Initialize all arrays
        let zombies = [];
        let bullets = [];
        let particles = [];
        let gems = [];
        let weapons = [];
        let messages = [];
        let cars = [];

        const WEAPON_TYPES = {
            PISTOL: 'pistol',
            SHOTGUN: 'shotgun',
            BOW: 'bow',
            RIFLE: 'rifle',
            ROCKET: 'rocket',
            FLAMETHROWER: 'flamethrower'
        };

        const ZOMBIE_TYPES = {
            SHAMBLER: 'shambler',
            RUNNER: 'runner',
            CRAWLER: 'crawler',
            BLOATER: 'bloater',
            SPITTER: 'spitter',
            BOSS: 'boss'
        };

        // ============ WEAPON DEFINITIONS ============
        const weaponConfigs = {
            [WEAPON_TYPES.PISTOL]: {
                name: 'Pistol',
                damage: 10,
                fireRate: 0.3,
                range: 600,
                bulletSpeed: 8,
                bulletCount: 1,
                spread: 0,
                color: '#ffff00',
                emoji: '🔫'
            },
            [WEAPON_TYPES.SHOTGUN]: {
                name: 'Shotgun',
                damage: 15,
                fireRate: 0.8,
                range: 300,
                bulletSpeed: 6,
                bulletCount: 5,
                spread: 30,
                color: '#ff6600',
                emoji: '🔫'
            },
            [WEAPON_TYPES.BOW]: {
                name: 'Bow',
                damage: 20,
                fireRate: 0.5,
                range: 800,
                bulletSpeed: 7,
                bulletCount: 1,
                spread: 0,
                color: '#00ff00',
                emoji: '🏹',
                piercing: true
            },
            [WEAPON_TYPES.RIFLE]: {
                name: 'Rifle',
                damage: 8,
                fireRate: 0.1,
                range: 700,
                bulletSpeed: 10,
                bulletCount: 1,
                spread: 5,
                color: '#ffff99',
                emoji: '🔫'
            },
            [WEAPON_TYPES.ROCKET]: {
                name: 'Rocket',
                damage: 40,
                fireRate: 1.2,
                range: 600,
                bulletSpeed: 5,
                bulletCount: 1,
                spread: 0,
                color: '#ff3333',
                emoji: '🚀',
                explosion: 150
            },
            [WEAPON_TYPES.FLAMETHROWER]: {
                name: 'Flamethrower',
                damage: 12,
                fireRate: 0.05,
                range: 250,
                bulletSpeed: 3,
                bulletCount: 3,
                spread: 40,
                color: '#ff9900',
                emoji: '🔥'
            }
        };

        // ============ WEAPON SYSTEM ============
        class Weapon {
            constructor(type) {
                this.type = type;
                this.config = JSON.parse(JSON.stringify(weaponConfigs[type]));
                this.cooldown = 0;
                this.level = 1;
            }

            update(dt) {
                this.cooldown = Math.max(0, this.cooldown - dt);
            }

            canFire() {
                return this.cooldown <= 0;
            }

            fire(fromX, fromY, targetX, targetY) {
                if (!this.canFire()) return;

                this.cooldown = this.config.fireRate;
                const angle = Math.atan2(targetY - fromY, targetX - fromX);

                AudioEngine.shoot();

                for (let i = 0; i < this.config.bulletCount; i++) {
                    let bulletAngle = angle;
                    if (this.config.spread) {
                        bulletAngle += (Math.random() - 0.5) * this.config.spread * Math.PI / 180;
                    }

                    bullets.push({
                        x: fromX + Math.cos(angle) * this.config.range * 0.2,
                        y: fromY + Math.sin(angle) * this.config.range * 0.2,
                        vx: Math.cos(bulletAngle) * this.config.bulletSpeed,
                        vy: Math.sin(bulletAngle) * this.config.bulletSpeed,
                        damage: this.config.damage * (0.8 + this.level * 0.1),
                        type: this.type,
                        piercing: this.config.piercing ? 3 : 0,
                        lifetime: 5,
                        explosion: this.config.explosion || 0,
                        color: this.config.color
                    });
                }
            }
        }

        // ============ ZOMBIE SYSTEM ============
        function spawnZombie(type = ZOMBIE_TYPES.SHAMBLER) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 400;
            const x = player.x + Math.cos(angle) * dist;
            const y = player.y + Math.sin(angle) * dist;

            const configs = {
                [ZOMBIE_TYPES.SHAMBLER]: {
                    speed: 1.5,
                    hp: 20,
                    radius: 15,
                    color: '#44aa44',
                    damage: 5
                },
                [ZOMBIE_TYPES.RUNNER]: {
                    speed: 3,
                    hp: 15,
                    radius: 12,
                    color: '#cc4444',
                    damage: 8
                },
                [ZOMBIE_TYPES.CRAWLER]: {
                    speed: 2.5,
                    hp: 10,
                    radius: 8,
                    color: '#99aa44',
                    damage: 3
                },
                [ZOMBIE_TYPES.BLOATER]: {
                    speed: 1,
                    hp: 40,
                    radius: 20,
                    color: '#888844',
                    damage: 10,
                    explodes: true
                },
                [ZOMBIE_TYPES.SPITTER]: {
                    speed: 1.2,
                    hp: 25,
                    radius: 14,
                    color: '#aa44cc',
                    damage: 6,
                    spits: true
                },
                [ZOMBIE_TYPES.BOSS]: {
                    speed: 2,
                    hp: 300,
                    radius: 30,
                    color: '#ffff00',
                    damage: 20,
                    boss: true
                }
            };

            const config = configs[type];
            zombies.push({
                x, y,
                vx: 0, vy: 0,
                type,
                ...config,
                maxHp: config.hp,
                spit: 0,
                hitFlash: 0
            });
        }

        // ============ UPGRADE SYSTEM ============
        const upgrades = [
            { name: 'New Pistol', type: 'weapon', weapon: WEAPON_TYPES.PISTOL },
            { name: 'New Shotgun', type: 'weapon', weapon: WEAPON_TYPES.SHOTGUN },
            { name: 'New Bow', type: 'weapon', weapon: WEAPON_TYPES.BOW },
            { name: 'New Rifle', type: 'weapon', weapon: WEAPON_TYPES.RIFLE },
            { name: 'New Rocket', type: 'weapon', weapon: WEAPON_TYPES.ROCKET },
            { name: 'New Flamethrower', type: 'weapon', weapon: WEAPON_TYPES.FLAMETHROWER },
            { name: 'Damage +', type: 'damageUp' },
            { name: 'Fire Rate +', type: 'fireRateUp' },
            { name: 'Max HP +', type: 'hpUp' },
            { name: 'Speed +', type: 'speedUp' },
            { name: 'XP Magnet', type: 'magnetUp' },
            { name: 'Car Keys', type: 'carSpawn' }
        ];

        function getRandomUpgrades(count = 3) {
            const chosen = [];
            for (let i = 0; i < count; i++) {
                chosen.push(upgrades[Math.floor(Math.random() * upgrades.length)]);
            }
            return chosen;
        }

        function applyUpgrade(upgrade) {
            if (upgrade.type === 'weapon') {
                const existingWeapon = player.weapons.find(w => w.type === upgrade.weapon);
                if (existingWeapon) {
                    existingWeapon.level++;
                } else if (player.weapons.length < 6) {
                    player.weapons.push(new Weapon(upgrade.weapon));
                }
            } else if (upgrade.type === 'damageUp') {
                player.weapons.forEach(w => w.level += 0.5);
            } else if (upgrade.type === 'fireRateUp') {
                player.weapons.forEach(w => {
                    w.config.fireRate *= 0.85;
                });
            } else if (upgrade.type === 'hpUp') {
                player.maxHp += 25;
                player.hp = player.maxHp;
            } else if (upgrade.type === 'speedUp') {
                player.speed += 1;
            } else if (upgrade.type === 'magnetUp') {
                magnetRange += 50;
            } else if (upgrade.type === 'carSpawn') {
                cars.push({
                    x: player.x + 100,
                    y: player.y,
                    vx: 0,
                    vy: 0,
                    width: 50,
                    height: 30,
                    hp: 100,
                    maxHp: 100
                });
            }
        }

        // ============ INPUT SYSTEM ============
        const keys = {};
        let joystickInput = { x: 0, y: 0 };

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Joystick
        const joystickContainer = document.getElementById('joystickContainer');
        const joystickBg = document.getElementById('joystickBg');
        const joystickStick = document.getElementById('joystickStick');

        function handleJoystickInput(e) {
            const rect = joystickBg.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const touches = e.touches[0] || e.changedTouches[0];
            const x = touches.clientX - centerX;
            const y = touches.clientY - centerY;
            const dist = Math.hypot(x, y);
            const maxDist = 50;

            if (dist > maxDist) {
                joystickInput.x = (x / dist) * maxDist;
                joystickInput.y = (y / dist) * maxDist;
            } else {
                joystickInput.x = x;
                joystickInput.y = y;
            }

            joystickStick.style.transform = `translate(${joystickInput.x}px, ${joystickInput.y}px)`;
        }

        function handleJoystickEnd() {
            joystickInput.x = 0;
            joystickInput.y = 0;
            joystickStick.style.transform = 'translate(0px, 0px)';
        }

        joystickBg.addEventListener('touchmove', handleJoystickInput);
        joystickBg.addEventListener('touchend', handleJoystickEnd);
        joystickBg.addEventListener('touchcancel', handleJoystickEnd);

        // Ability button
        const abilityBtn = document.getElementById('abilityBtn');
        abilityBtn.addEventListener('click', () => {
            if (player.dashCooldown <= 0) {
                player.vx *= 3;
                player.vy *= 3;
                player.dashCooldown = 2;
                AudioEngine.rifle();
            }
        });

        // ============ PARTICLE SYSTEM ============
        function createParticle(x, y, vx, vy, color, lifetime = 0.5) {
            particles.push({
                x, y, vx, vy, color, lifetime,
                maxLifetime: lifetime,
                size: 2 + Math.random() * 4
            });
        }

        function createExplosion(x, y, count = 20, color = '#ff9900') {
            screenShake = 10;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                createParticle(x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    color, 0.8);
            }
        }

        // ============ GAME MECHANICS ============
        let screenShake = 0;
        let waveTimer = WAVE_DURATION;
        let upgradeSelection = null;
        let magnetRange = 150;

        function startWave() {
            const zombieCount = 15 + gameState.wave * 8;
            const types = [
                ZOMBIE_TYPES.SHAMBLER,
                ZOMBIE_TYPES.SHAMBLER,
                ZOMBIE_TYPES.RUNNER,
                ZOMBIE_TYPES.CRAWLER,
                gameState.wave > 3 ? ZOMBIE_TYPES.BLOATER : ZOMBIE_TYPES.SHAMBLER,
                gameState.wave > 4 ? ZOMBIE_TYPES.SPITTER : ZOMBIE_TYPES.SHAMBLER
            ];

            for (let i = 0; i < zombieCount; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                spawnZombie(type);
            }

            if (gameState.wave % 5 === 0) {
                spawnZombie(ZOMBIE_TYPES.BOSS);
            }
        }

        function levelUp() {
            AudioEngine.levelup();
            player.level++;
            player.xp = 0;
            player.xpToLevel = Math.floor(10 * (1 + player.level * 0.3));

            const choices = getRandomUpgrades(3);
            upgradeSelection = choices;

            createExplosion(player.x, player.y, 30, '#ffff00');
        }

        // ============ START SCREEN ============
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        function showStartScreen() {
            startScreen.classList.remove('hidden');
            joystickContainer.classList.remove('show');
        }

        function hideStartScreen() {
            startScreen.classList.add('hidden');
            joystickContainer.classList.add('show');
            gameState.running = true;
            gameState.gameOver = false;
            startGame();
        }

        function startGame() {
            player = {
                x: WORLD_SIZE / 2,
                y: WORLD_SIZE / 2,
                vx: 0, vy: 0,
                speed: 4,
                radius: 12,
                hp: 100,
                maxHp: 100,
                level: 1,
                xp: 0,
                xpToLevel: 10,
                weapons: [new Weapon(WEAPON_TYPES.PISTOL)],
                dashCooldown: 0
            };

            gameState = {
                running: true,
                gameOver: false,
                wave: 1,
                time: 0,
                kills: 0,
                combo: 0,
                maxCombo: 0,
                comboTimer: 0
            };

            zombies = [];
            bullets = [];
            particles = [];
            gems = [];
            weapons = [];
            messages = [];
            cars = [];
            upgradeSelection = null;
            waveTimer = WAVE_DURATION;
            screenShake = 0;
            magnetRange = 150;

            startWave();
        }

        function showGameOver() {
            gameState.running = false;
            gameState.gameOver = true;
            document.getElementById('finalWave').textContent = gameState.wave;
            document.getElementById('finalKills').textContent = gameState.kills;
            const minutes = Math.floor(gameState.time / 60);
            const seconds = Math.floor(gameState.time % 60);
            document.getElementById('finalTime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('finalCombo').textContent = gameState.maxCombo;
            gameOverScreen.classList.remove('hidden');
            joystickContainer.classList.remove('show');
        }

        startScreen.addEventListener('click', hideStartScreen);
        gameOverScreen.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            showStartScreen();
        });

        document.querySelector('.play-again-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            gameOverScreen.classList.add('hidden');
            hideStartScreen();
        });

        // ============ MAIN UPDATE LOOP ============
        function update(dt) {
            if (!gameState.running) return;

            gameState.time += dt;
            gameState.comboTimer -= dt;
            if (gameState.comboTimer <= 0) {
                gameState.combo = 0;
            }

            player.dashCooldown = Math.max(0, player.dashCooldown - dt);

            // Input
            let moveX = 0, moveY = 0;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) moveY -= 1;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) moveY += 1;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) moveX += 1;

            if (joystickInput.x !== 0 || joystickInput.y !== 0) {
                moveX = joystickInput.x / 50;
                moveY = joystickInput.y / 50;
            }

            const moveLen = Math.hypot(moveX, moveY);
            if (moveLen > 0) {
                moveX /= moveLen;
                moveY /= moveLen;
                player.vx = moveX * player.speed;
                player.vy = moveY * player.speed;
            } else {
                player.vx *= 0.8;
                player.vy *= 0.8;
            }

            if (player.dashCooldown > 0) {
                player.vx *= 0.95;
                player.vy *= 0.95;
            }

            player.x += player.vx;
            player.y += player.vy;
            player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y));

            // Weapon updates
            player.weapons.forEach(w => w.update(dt));

            // Auto-fire weapons
            if (zombies.length > 0 && !upgradeSelection) {
                const closest = zombies.reduce((a, b) => {
                    const distA = Math.hypot(a.x - player.x, a.y - player.y);
                    const distB = Math.hypot(b.x - player.x, b.y - player.y);
                    return distA < distB ? a : b;
                });

                player.weapons.forEach(w => {
                    if (w.canFire()) {
                        w.fire(player.x, player.y, closest.x, closest.y);
                    }
                });
            }

            // Zombie updates
            for (let zidx = zombies.length - 1; zidx >= 0; zidx--) {
                const z = zombies[zidx];
                const dx = player.x - z.x;
                const dy = player.y - z.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    z.vx = (dx / dist) * z.speed;
                    z.vy = (dy / dist) * z.speed;
                }

                z.x += z.vx;
                z.y += z.vy;

                // Spitter behavior
                if (z.spits) {
                    z.spit -= dt;
                    if (z.spit <= 0) {
                        z.spit = 2;
                        const angle = Math.atan2(dy, dx);
                        bullets.push({
                            x: z.x,
                            y: z.y,
                            vx: Math.cos(angle) * 2,
                            vy: Math.sin(angle) * 2,
                            damage: 10,
                            type: 'spit',
                            lifetime: 5,
                            color: '#ff00ff',
                            piercing: 0,
                            explosion: 0
                        });
                    }
                }

                // Collision with player
                const pdist = Math.hypot(z.x - player.x, z.y - player.y);
                if (pdist < z.radius + player.radius) {
                    player.hp -= z.damage * dt;
                    if (player.hp <= 0) {
                        showGameOver();
                    }
                }
            }

            // Bullet updates
            for (let bidx = bullets.length - 1; bidx >= 0; bidx--) {
                const b = bullets[bidx];
                b.x += b.vx;
                b.y += b.vy;
                b.lifetime -= dt;

                if (b.lifetime <= 0) {
                    bullets.splice(bidx, 1);
                    continue;
                }

                // Check collisions with zombies
                let hitAny = false;
                for (let zidx = zombies.length - 1; zidx >= 0; zidx--) {
                    const z = zombies[zidx];
                    const dist = Math.hypot(z.x - b.x, z.y - b.y);
                    if (dist < z.radius) {
                        z.hp -= b.damage;
                        createParticle(b.x, b.y, 0, 0, '#ff0000', 0.2);

                        if (!b.piercing) {
                            hitAny = true;
                        } else {
                            b.piercing--;
                        }

                        if (z.hp <= 0) {
                            zombies.splice(zidx, 1);
                            gameState.kills++;
                            gameState.combo++;
                            gameState.maxCombo = Math.max(gameState.maxCombo, gameState.combo);
                            gameState.comboTimer = 1;
                            AudioEngine.zombieDeath();
                            createExplosion(z.x, z.y, 15, '#ff6600');

                            // Drop gems
                            const gemCount = 1 + Math.floor(Math.random() * 2);
                            for (let i = 0; i < gemCount; i++) {
                                const angle = Math.random() * Math.PI * 2;
                                gems.push({
                                    x: z.x,
                                    y: z.y,
                                    vx: Math.cos(angle) * 2,
                                    vy: Math.sin(angle) * 2,
                                    value: 1
                                });
                            }

                            // Bloater explosion
                            if (z.explodes) {
                                createExplosion(z.x, z.y, 30, '#ff9900');
                                for (let zz of zombies) {
                                    const zdist = Math.hypot(zz.x - z.x, zz.y - z.y);
                                    if (zdist < 150 && zdist > 0) {
                                        zz.hp -= 30;
                                    }
                                }
                                player.hp -= 20;
                            }
                        } else if (z.hp > 0) {
                            z.hitFlash = 0.1;
                        }
                    }
                }

                if (hitAny) {
                    bullets.splice(bidx, 1);
                }

                // Rocket explosion
                if (b.explosion && b.lifetime <= 0.1) {
                    createExplosion(b.x, b.y, 40, '#ff3333');
                    for (let z of zombies) {
                        const zdist = Math.hypot(z.x - b.x, z.y - b.y);
                        if (zdist < b.explosion) {
                            z.hp -= b.damage * 0.5;
                        }
                    }
                }
            }

            // Gem updates
            for (let gidx = gems.length - 1; gidx >= 0; gidx--) {
                const g = gems[gidx];
                g.x += g.vx;
                g.y += g.vy;
                g.vx *= 0.95;
                g.vy *= 0.95;

                const pdist = Math.hypot(g.x - player.x, g.y - player.y);
                if (pdist < magnetRange && pdist > 0) {
                    const angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.vx = Math.cos(angle) * 5;
                    g.vy = Math.sin(angle) * 5;
                }

                if (pdist < player.radius) {
                    player.xp += g.value;
                    AudioEngine.pickup();
                    gems.splice(gidx, 1);

                    if (player.xp >= player.xpToLevel) {
                        levelUp();
                    }
                }
            }

            // Particle updates
            for (let pidx = particles.length - 1; pidx >= 0; pidx--) {
                const p = particles[pidx];
                p.x += p.vx;
                p.y += p.vy;
                p.lifetime -= dt;
                p.vy += 0.1;

                if (p.lifetime <= 0) {
                    particles.splice(pidx, 1);
                }
            }

            // Car updates
            for (let cidx = cars.length - 1; cidx >= 0; cidx--) {
                const car = cars[cidx];
                const dx = player.x - car.x;
                const dy = player.y - car.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 30) {
                    player.vx *= 1.5;
                    player.vy *= 1.5;

                    for (let z of zombies) {
                        const zdist = Math.hypot(z.x - player.x, z.y - player.y);
                        if (zdist < 40) {
                            z.hp -= 100;
                        }
                    }

                    cars.splice(cidx, 1);
                }
            }

            // Wave timer
            if (!upgradeSelection) {
                waveTimer -= dt;
                if (waveTimer <= 0 || zombies.length === 0) {
                    gameState.wave++;
                    waveTimer = WAVE_DURATION;
                    startWave();
                }
            }

            screenShake = Math.max(0, screenShake - dt);
        }

        // ============ RENDER LOOP ============
        function render() {
            ctx.save();
            if (screenShake > 0) {
                const shake = screenShake * 5;
                ctx.translate(
                    (Math.random() - 0.5) * shake,
                    (Math.random() - 0.5) * shake
                );
            }

            // Background
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, W, H);

            // Draw world from player perspective
            ctx.save();
            ctx.translate(W / 2, H / 2);
            ctx.translate(-player.x, -player.y);

            // World background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Grid
            ctx.strokeStyle = 'rgba(100, 100, 100, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= WORLD_SIZE; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, WORLD_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(WORLD_SIZE, i);
                ctx.stroke();
            }

            // Draw zombies
            zombies.forEach(z => {
                const opacity = z.hitFlash ? 1 : 0.9;
                ctx.fillStyle = z.hitFlash ? '#ffffff' : z.color;
                ctx.globalAlpha = opacity;

                ctx.beginPath();
                ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(z.x - z.radius * 0.4, z.y - z.radius * 0.3, z.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(z.x + z.radius * 0.4, z.y - z.radius * 0.3, z.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // HP bar for boss
                if (z.boss) {
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(z.x - z.radius, z.y + z.radius + 10, z.radius * 2 * (z.hp / z.maxHp), 5);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(z.x - z.radius, z.y + z.radius + 10, z.radius * 2, 5);
                }

                z.hitFlash = Math.max(0, (z.hitFlash || 0) - 0.016);
                ctx.globalAlpha = 1;
            });

            // Draw bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw gems
            gems.forEach(g => {
                ctx.fillStyle = '#00ff00';
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                ctx.arc(g.x, g.y, 6, 0, Math.PI * 2);
                ctx.fill();

                // Sparkle
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(g.x - 8, g.y);
                ctx.lineTo(g.x + 8, g.y);
                ctx.moveTo(g.x, g.y - 8);
                ctx.lineTo(g.x, g.y + 8);
                ctx.stroke();
            });

            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.lifetime / p.maxLifetime;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw cars
            cars.forEach(car => {
                ctx.fillStyle = '#ff4444';
                ctx.globalAlpha = 0.8;
                ctx.fillRect(car.x - car.width / 2, car.y - car.height / 2, car.width, car.height);
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 2;
                ctx.strokeRect(car.x - car.width / 2, car.y - car.height / 2, car.width, car.height);
            });

            // Draw player
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Player direction indicator
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            // Draw upgrade selection
            if (upgradeSelection) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('CHOOSE UPGRADE', W / 2, 80);

                const cardWidth = 150;
                const cardHeight = 150;
                const cardGap = 40;
                const totalWidth = upgradeSelection.length * cardWidth + (upgradeSelection.length - 1) * cardGap;
                const startX = (W - totalWidth) / 2;

                upgradeSelection.forEach((upgrade, idx) => {
                    const x = startX + idx * (cardWidth + cardGap);
                    const y = H / 2 - cardHeight / 2;

                    // Card
                    ctx.fillStyle = '#3333ff';
                    ctx.fillRect(x, y, cardWidth, cardHeight);
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, cardWidth, cardHeight);

                    // Text
                    ctx.fillStyle = '#ffff00';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(upgrade.name, x + cardWidth / 2, y + cardHeight / 2);

                    // Click area
                    if (keys['' + (idx + 1)]) {
                        applyUpgrade(upgrade);
                        upgradeSelection = null;
                        keys['' + (idx + 1)] = false;
                    }
                });

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Press 1, 2, or 3 to choose', W / 2, H - 40);
            }

            ctx.restore();

            // Update HUD
            const hpPercent = (player.hp / player.maxHp) * 100;
            const xpPercent = (player.xp / player.xpToLevel) * 100;
            document.getElementById('hpBar').style.width = hpPercent + '%';
            document.getElementById('xpBar').style.width = xpPercent + '%';
            document.getElementById('level').textContent = player.level;
            document.getElementById('waveNum').textContent = gameState.wave;
            document.getElementById('killCount').textContent = gameState.kills;

            const minutes = Math.floor(gameState.time / 60);
            const seconds = Math.floor(gameState.time % 60);
            document.getElementById('timeDisplay').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('comboDisplay').textContent = `x${gameState.combo}`;

            // Weapons display
            const weaponsDisplay = document.getElementById('weaponsDisplay');
            weaponsDisplay.innerHTML = '';
            player.weapons.forEach(w => {
                const icon = document.createElement('div');
                icon.className = 'weapon-icon';
                icon.title = w.config.name;
                icon.textContent = w.config.emoji + ' Lv' + Math.floor(w.level);
                weaponsDisplay.appendChild(icon);
            });

            // Ability button
            abilityBtn.disabled = player.dashCooldown > 0;
            const cooldownPercent = (1 - player.dashCooldown / 2) * 100;
            abilityBtn.style.background = `conic-gradient(#6496ff ${cooldownPercent}%, rgba(100, 150, 255, 0.4) ${cooldownPercent}%)`;
        }

        // ============ GAME LOOP ============
        let lastTime = performance.now();

        function gameLoop(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
            lastTime = currentTime;

            try {
                update(dt);
                render();
            } catch (e) {
                console.error(e);
            }

            requestAnimationFrame(gameLoop);
        }

        // Initialize
        showStartScreen();
        AudioEngine.init();
        requestAnimationFrame(gameLoop);

        // Handle number key selection for upgrades
        window.addEventListener('keydown', e => {
            if (upgradeSelection) {
                const num = parseInt(e.key);
                if (num >= 1 && num <= 3 && num <= upgradeSelection.length) {
                    applyUpgrade(upgradeSelection[num - 1]);
                    upgradeSelection = null;
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
