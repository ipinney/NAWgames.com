<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pom Pom Coders</title>
<style>
:root{--ink:#fffaf0;--bg:#17112b;--card:#2a2050;--gold:#ffcf4a;--green:#35d07f;--pink:#ff5fa8;--teal:#22d3c5;--red:#ff5a5a;--blue:#4f8dff;--purple:#a06bff;--round:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--round);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.chunky{border-radius:18px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.chunky:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.icon{width:46px;height:46px;font-size:23px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.coinpill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);padding:7px 13px;border-radius:99px;font-weight:900;font-size:18px;color:var(--gold)}
.coinpill.pop{animation:cpop .35s}
@keyframes cpop{50%{transform:scale(1.28)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes popIn{0%{transform:scale(0) rotate(-10deg)}65%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1)}}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,207,74,.75)}50%{box-shadow:0 0 0 11px rgba(255,207,74,0)}}
/* TITLE */
#title{background:radial-gradient(circle at 50% 18%,#51309c,#17112b 72%);align-items:center;justify-content:center;gap:12px;padding:14px;text-align:center}
#title h1{font-size:clamp(34px,9vw,58px);line-height:1;color:var(--gold);text-shadow:0 4px 0 #a2500d}
#title h1 span{display:block;color:#fff;font-size:.62em;text-shadow:0 3px 0 #6d3bd1}
.heroes{display:flex;justify-content:center;height:clamp(76px,18vh,130px);gap:0}
.heroes svg{height:100%;width:auto;animation:bob 1.3s ease-in-out infinite}
.heroes svg:nth-child(2){animation-delay:.2s}.heroes svg:nth-child(3){animation-delay:.4s}
.players{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.player{width:clamp(92px,27vw,132px);padding:8px 6px 10px;background:var(--card);font-size:19px;color:#fff}
.player svg{width:100%;height:auto;max-height:82px;display:block}
.player small{display:block;color:var(--gold);font-size:13px;margin-top:2px}
.player.wy{background:#b86a07}.player.ad{background:#b82f73}.player.no{background:#2966bd}
/* MAP */
#map{background:linear-gradient(#34206f,#17112b)}
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;flex:none}
.top .mid{flex:1;min-width:0;text-align:center;font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:60px;padding:7px 4px;background:rgba(255,255,255,.1);font-size:12px;color:#fff;position:relative;box-shadow:none}
.tab b{display:block;font-size:24px}
.tab.sel{background:var(--gold);color:#3a2300}
.tab.locked{opacity:.45}
.nodes{flex:1;overflow-y:auto;padding:8px 14px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;max-width:720px;width:100%;margin:0 auto}
.worldhead{grid-column:1/-1;text-align:center;font-size:21px;font-weight:900;padding-bottom:2px}
.worldhead small{display:block;font-size:13px;color:#d7c9ff;font-weight:700}
.node{aspect-ratio:1.18;background:#fff;color:#2a2050;font-size:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.node .st{font-size:13px;letter-spacing:-1px;height:16px;color:#e39b00}
.node.lock{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:24px}
.node.next{background:var(--gold);animation:bob 1s ease-in-out infinite}
.node.chest::after{content:"🎁";position:absolute;top:-7px;right:-4px;font-size:21px}
/* CLOSET */
#closet{background:linear-gradient(#35205f,#17112b)}
.dress{display:flex;justify-content:center;flex:none;height:clamp(92px,21vh,170px)}
.dress svg{height:100%;width:auto}
.ctabs{display:flex;gap:6px;padding:6px 10px;flex:none}
.ctab{flex:1;padding:8px 2px;font-size:23px;background:rgba(255,255,255,.1);box-shadow:none;border-radius:13px}
.ctab.sel{background:var(--gold)}
.shelf{flex:1;overflow-y:auto;padding:8px 10px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;align-content:start}
.item{background:rgba(255,255,255,.11);border-radius:15px;padding:5px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.25);min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.item svg{width:100%;max-width:82px;height:78px;display:block}
.item .pr{font-size:14px;font-weight:900;color:var(--gold);margin-top:1px}
.item.on{outline:4px solid var(--green)}
.item.no{opacity:.45}
.item.lockd svg{filter:brightness(0) opacity(.55)}
/* PLAY */
#play{background:linear-gradient(var(--w1,#65c9ff),var(--w2,#b8eb9a))}
.game{flex:1;min-height:0;display:flex;flex-direction:column}
.boardwrap{flex:1;min-height:90px;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 8px}
#board{position:relative;transition:transform .05s}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900}
.deco{position:absolute;opacity:.5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.floor{position:absolute;background:var(--track,#fff6d6);border-radius:22%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 2px 0 rgba(0,0,0,.22)}
.coin{width:62%;height:62%;background:radial-gradient(circle at 35% 30%,#fff2a6,#ffc62a 55%,#d68800);border-radius:50%;border:2px solid #b87400;font-size:.55em;color:#a86600;display:flex;align-items:center;justify-content:center;animation:bob 1.1s infinite ease-in-out}
.btn-t{width:68%;height:68%;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.26),0 0 0 3px #fff}
.btn-t.pressed{transform:scale(.72);filter:brightness(.72)}
.door{width:100%;height:100%;border-radius:18%;background:repeating-linear-gradient(90deg,var(--c) 0 22%,rgba(0,0,0,.28) 22% 30%);display:flex;align-items:center;justify-content:center;font-size:.62em;transition:opacity .25s,transform .25s}
.door.open{opacity:.12;transform:scaleY(.2)}
.pad{width:86%;height:86%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.62em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 0 0 3px #fff}
.pad.myst{background:conic-gradient(var(--pink) 0 50%,var(--teal) 50% 100%);animation:wiggle 1.3s infinite}
.flag{font-size:.86em;line-height:1;animation:bob 1.2s infinite ease-in-out}
.flagc{width:86%;height:86%;border-radius:20%;display:flex;align-items:center;justify-content:center;font-size:.58em}
#ball{position:absolute;left:0;top:0;pointer-events:none;z-index:6;will-change:transform}
#ball svg{width:100%;height:100%;overflow:visible;display:block}
#ball .bi{width:100%;height:100%;transform-origin:50% 88%}
#ball.rolling .fur{animation:spin .35s linear infinite;transform-origin:50px 58px}
@keyframes spin{to{transform:rotate(360deg)}}
.squash{animation:squash .24s}
@keyframes squash{35%{transform:scale(1.26,.72)}70%{transform:scale(.9,1.12)}}
.dance{animation:dance .5s infinite}
@keyframes dance{25%{transform:translateY(-22%) rotate(-10deg)}75%{transform:translateY(-22%) rotate(10deg)}}
.dizzy{animation:dizzy .7s 2}
@keyframes dizzy{25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
.falling{animation:falling .55s forwards}
@keyframes falling{to{transform:scale(.05) rotate(360deg);opacity:.2}}
.fx{position:absolute;pointer-events:none;z-index:9;font-size:18px;font-weight:900;animation:fx .8s forwards}
@keyframes fx{to{transform:translate(var(--dx,0),var(--dy,-40px)) scale(.4);opacity:0}}
#daybar{position:absolute;top:6px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:99px;background:rgba(0,0,0,.55);font-weight:900;font-size:15px;display:none;z-index:8;align-items:center;gap:7px;white-space:nowrap}
.panel{flex:none;background:#21183f;border-radius:20px 20px 0 0;padding:7px 8px max(8px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px;max-height:50%;min-height:0}
.rails{overflow-y:auto;min-height:48px;display:flex;flex-direction:column;gap:5px;flex:0 1 auto}
.rail{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.06)}
.rail.spell{background:rgba(160,107,255,.25)}
.rail .lab{font-size:21px;width:28px;text-align:center}
.blk{height:42px;min-width:42px;border-radius:11px;font-size:23px;font-weight:900;color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.3);position:relative}
.blk.U{background:#ff8a2a}.blk.D{background:#2e9df7}.blk.L{background:#a664ff}.blk.R{background:#2fbd6d}.blk.fn{background:linear-gradient(135deg,#c084fc,#7c3aed)}
.blk.active{outline:3px solid #fff;transform:scale(1.14);z-index:2}
.blk.pip{animation:popIn .2s}
.box{display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px;padding:3px 5px;border-radius:12px;border:3px solid;min-height:50px;position:relative}
.box.rep{border-color:#ffb02e;background:rgba(255,176,46,.17)}
.box.ifp{border-color:var(--pink);background:rgba(255,95,168,.17)}
.box.ift{border-color:var(--teal);background:rgba(34,211,197,.17)}
.box.unt{border-color:#7ee081;background:rgba(126,224,129,.15)}
.box.active{box-shadow:0 0 0 3px #fff}
.bh{height:38px;min-width:38px;border-radius:9px;font-size:19px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 4px;color:#3a2300;background:#ffb02e}
.ifp>.bh{background:var(--pink);color:#fff}.ift>.bh{background:var(--teal);color:#063}.unt>.bh{background:#7ee081;color:#063}
.num{min-width:34px;height:38px;border-radius:9px;background:#fff;color:#3a2300;font-size:22px;font-weight:900}
.brack{font-size:29px;font-weight:900;opacity:.8;color:#ffe6a8;line-height:1}
.slot{width:42px;height:42px;border-radius:11px;border:2px dashed rgba(255,255,255,.35);color:rgba(255,255,255,.5);font-size:21px;font-weight:900}
.slot.cur{border-color:var(--gold);color:var(--gold);background:rgba(255,207,74,.15);animation:glow 1.1s infinite}
.toolrow{display:flex;gap:5px;align-items:center;flex:none;flex-wrap:wrap;justify-content:center}
.tool{height:48px;min-width:48px;border-radius:12px;font-size:26px;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3);flex:1 1 44px;max-width:72px;display:flex;align-items:center;justify-content:center;gap:1px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tool.U{background:#ff8a2a}.tool.D{background:#2e9df7}.tool.L{background:#a664ff}.tool.R{background:#2fbd6d}
.tool.rep{background:#ffb02e;color:#3a2300}.tool.ifp{background:var(--pink)}.tool.ift{background:var(--teal);color:#063}.tool.fn{background:linear-gradient(135deg,#c084fc,#7c3aed)}.tool.unt{background:#7ee081;color:#063}
.tool.dis{opacity:.32}
.actions{display:flex;gap:6px;align-items:stretch;flex:none}
#go{flex:1;height:52px;background:var(--green);font-size:26px;color:#053;display:flex;align-items:center;justify-content:center;gap:8px}
#go.stop{background:var(--red);color:#fff}
#go.want{animation:glow 1s infinite}
.act2{width:52px;height:52px;font-size:23px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center}
#hint.want{background:var(--gold);animation:wiggle .7s infinite}
.limit{font-size:13px;font-weight:900;color:#d9ccff;text-align:center;flex:none;line-height:1}
.limit.full{color:var(--gold)}
#finger{position:fixed;z-index:40;font-size:38px;pointer-events:none;display:none;transform:translate(-20%,6px);animation:tapf .75s infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes tapf{50%{margin-top:13px}}
.want-t{outline:4px solid var(--gold)!important;outline-offset:1px;z-index:3}
@media (min-aspect-ratio:5/4){
 .game{flex-direction:row}
 .panel{width:min(46%,430px);max-height:none;border-radius:20px 0 0 20px;padding-top:max(8px,env(safe-area-inset-top));justify-content:flex-end}
 .rails{flex:1 1 auto}
}
/* OVERLAY */
#over{position:fixed;inset:0;z-index:30;background:rgba(10,6,28,.78);display:none;align-items:center;justify-content:center;padding:14px}
#over.on{display:flex}
.card{background:linear-gradient(#3f2a7f,#25194e);border-radius:26px;padding:15px;width:min(430px,100%);max-height:100%;overflow-y:auto;text-align:center;animation:popIn .32s;border:3px solid rgba(255,255,255,.2)}
.card h2{font-size:27px;color:var(--gold)}
.stars{font-size:46px;letter-spacing:3px;height:60px}
.stars span{display:inline-block;opacity:.22;filter:grayscale(1)}
.stars span.got{opacity:1;filter:none;animation:popIn .4s backwards}
.cardrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.big{padding:12px 20px;background:var(--green);color:#053;font-size:22px;min-width:88px}
.big.alt{background:rgba(255,255,255,.14);color:#fff}
.code{margin-top:9px;background:#0d0a1f;border-radius:13px;padding:10px;text-align:left;font:700 14px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#9df2c0;white-space:pre-wrap;display:none;user-select:text;-webkit-user-select:text}
.card .reward svg{height:130px;width:auto}
.conf{position:fixed;top:-20px;width:11px;height:15px;z-index:50;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
.intro{font-size:16px;font-weight:700;margin:6px 0 2px;color:#efe7ff;line-height:1.3}
</style>
</head>
<body>
<div id="title" class="screen on">
  <div class="heroes" id="heroes"></div>
  <h1>Pom Pom<span>Coders</span></h1>
  <div class="players" id="players"></div>
</div>
<div id="map" class="screen">
  <div class="top"><button class="icon chunky" id="mapBack">🏠</button><div class="mid" id="mapName"></div><button class="icon chunky" id="muteBtn">🔊</button><button class="icon chunky" id="toCloset">👕</button><div class="coinpill coinC">🪙 <span>0</span></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="nodes" id="nodes"></div>
</div>
<div id="closet" class="screen">
  <div class="top"><button class="icon chunky" id="closetBack">⬅️</button><div class="mid" id="closetName">My Pom</div><div class="coinpill coinC">🪙 <span>0</span></div></div>
  <div class="dress" id="dress"></div>
  <div class="ctabs" id="ctabs"></div>
  <div class="shelf" id="shelf"></div>
</div>
<div id="play" class="screen">
  <div class="top"><button class="icon chunky" id="playBack">🗺️</button><div class="mid" id="lvName"></div><button class="icon chunky" id="sayAgain">🗣️</button><div class="coinpill coinC">🪙 <span>0</span></div></div>
  <div class="game">
    <div class="boardwrap" id="bw"><div id="daybar"></div><div id="board"></div></div>
    <div class="panel">
      <div class="rails" id="rails"></div>
      <div class="limit" id="limit"></div>
      <div class="toolrow" id="tools"></div>
      <div class="actions"><button class="act2 chunky" id="trash">🗑️</button><button id="go" class="chunky">▶ GO</button><button class="act2 chunky" id="hint">💡</button></div>
    </div>
  </div>
</div>
<div id="over"><div class="card" id="card"></div></div>
<div id="finger">👆</div>

<script>
'use strict';
/* ENGINE-START */
const DIRS={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
function parseProg(str){
  let s=(str||'').replace(/\s+/g,''),i=0,spell=[];
  function seq(){
    const out=[];
    while(i<s.length){
      const c=s[i];
      if(c===')'||c==='}')break;
      if('UDLR'.includes(c)){out.push({k:'m',d:c});i++;}
      else if(c==='*'){out.push({k:'fn'});i++;}
      else if(c==='~'){i+=2;const b=seq();i++;out.push({k:'until',b});}
      else if(c==='p'||c==='t'){i+=2;const b=seq();i++;out.push({k:'if',c,b});}
      else if(/\d/.test(c)){const n=+c;i+=2;const b=seq();i++;out.push({k:'rep',n,b});}
      else throw new Error('bad program '+str+' at '+i);
    }
    return out;
  }
  if(s[0]==='{'){i=1;spell=seq();i++;}
  return {main:seq(),spell};
}
function countBlocks(list){let n=0;for(const b of list){n++;if(b.b)n+=countBlocks(b.b);}return n;}
function progCount(p){return countBlocks(p.main)+countBlocks(p.spell);}
function hasKind(list,k){return list.some(b=>b.k===k||(b.b&&hasKind(b.b,k)));}
function normLevel(l){
  let rows=l.m.slice();
  const w=Math.max(...rows.map(r=>r.length));
  rows=rows.map(r=>r.padEnd(w,' '));
  let sol=l.s,pre=l.pre||'';
  if(l.flip){
    rows=rows.map(r=>r.split('').reverse().join(''));
    const sw=t=>t.replace(/[LR]/g,c=>c==='L'?'R':'L');
    sol=sw(sol);pre=sw(pre);
  }
  let start=null,coins=[];const pads={};
  rows.forEach((r,y)=>r.split('').forEach((c,x)=>{
    if(c==='S')start=[y,x];
    if(c==='c')coins.push(y+','+x);
  }));
  const text=rows.join('');
  return Object.assign({},l,{rows,w,h:rows.length,sol,pre,start,coins,
    days:text.includes('?')?['p','t']:[null],
    hasP:text.includes('p')||text.includes('?'),hasT:text.includes('t')||text.includes('?')});
}
function simulate(lv,prog,day){
  const at=(y,x)=>(y<0||x<0||y>=lv.h||x>=lv.w)?' ':lv.rows[y][x];
  const open={};let [y,x]=lv.start;let done=false,win=false,fell=false,steps=0;
  const ev=[],coins=new Set();
  const padHere=()=>{const c=at(y,x);if(c==='p'||c==='t')return c;if(c==='?')return day;return null;};
  function roll(d){
    const [dy,dx]=DIRS[d];let moved=0;
    for(;;){
      if(++steps>600){done=true;return;}
      const c=at(y+dy,x+dx);
      if(c===' '||c==='#'||((c==='A'||c==='B')&&!open[c])){ev.push({e:'bump',d,moved});return;}
      y+=dy;x+=dx;moved++;ev.push({e:'step',y,x,d});
      if(c==='c'){const key=y+','+x;if(!coins.has(key)){coins.add(key);ev.push({e:'coin',y,x});}}
      if(c==='a'&&!open.A){open.A=1;ev.push({e:'press',y,x,door:'A'});}
      if(c==='b'&&!open.B){open.B=1;ev.push({e:'press',y,x,door:'B'});}
      if(c==='G'||(c==='x'&&day==='p')||(c==='y'&&day==='t')){win=true;done=true;ev.push({e:'win'});return;}
      if(c==='x'||c==='y'){fell=true;done=true;ev.push({e:'fall',y,x});return;}
      if(c==='p'||c==='t'||c==='?'){ev.push({e:'padstop',y,x});return;}
    }
  }
  function run(list,path){
    for(let i=0;i<list.length&&!done;i++){
      const b=list[i],pp=path+'.'+i;
      if(b.k==='m'){ev.push({e:'act',p:pp});roll(b.d);}
      else if(b.k==='rep'){for(let n=0;n<b.n&&!done;n++){ev.push({e:'act',p:pp});run(b.b,pp);}}
      else if(b.k==='if'){ev.push({e:'act',p:pp});if(padHere()===b.c)run(b.b,pp);}
      else if(b.k==='fn'){ev.push({e:'act',p:pp});run(prog.spell,'s');}
      else if(b.k==='until'){let n=0;while(!done&&n++<40){ev.push({e:'act',p:pp});const before=steps;run(b.b,pp);if(steps===before&&!done)break;}}
      if(steps>600)done=true;
    }
  }
  run(prog.main,'m');
  return {ev,win,fell,coins,y,x};
}
function runAllDays(lv,prog){

 const sp=parseProg(L.sol),pp=parseProg(L.pre);const all=[...sp.main,...sp.spell,...pp.main,...pp.spell];
 const has=k=>hasKind(all,k);
 return {rep:(LW>=2&&L.no!=='rep'&&LW!==3)||has('rep'),ifp:LW>=3&&L.hasP,ift:LW>=3&&L.hasT,fn:has('fn'),until:has('until')};
}
function renderTools(){
 const t=toolSet();let h='';
 for(const d of 'ULDR')h+=`<button class="tool ${d}" data-tool="m${d}">${ARW[d]}</button>`;
 if(t.rep)h+=`<button class="tool rep" data-tool="rep">🔁</button>`;
 if(t.until)h+=`<button class="tool unt" data-tool="until" style="font-size:19px">🔁🏁</button>`;
 if(t.ifp)h+=`<button class="tool ifp" data-tool="ifp">♥?</button>`;
 if(t.ift)h+=`<button class="tool ift" data-tool="ift">◆?</button>`;
 if(t.fn)h+=`<button class="tool fn" data-tool="fn">⭐</button>`;
 $('tools').innerHTML=h;
}
function addTool(tool){
 if(running)return;ensureAudio();
 if(L.max&&progCount(prog)>=L.max){sfx('nope');say('full');const l=$('limit');l.style.animation='wiggle .3s';setTimeout(()=>l.style.animation='',310);return;}
 if(tool==='fn'&&cur.list==='spell'){sfx('nope');return;}
 let b;
 if(tool[0]==='m'&&tool.length===2)b={k:'m',d:tool[1]};
 else if(tool==='rep')b={k:'rep',n:3,b:[]};
 else if(tool==='until')b={k:'until',b:[]};
 else if(tool==='ifp')b={k:'if',c:'p',b:[]};
 else if(tool==='ift')b={k:'if',c:'t',b:[]};
 else if(tool==='fn')b={k:'fn'};
 const list=getList(cur);list.push(b);
 if(b.b)cur={list:cur.list,path:cur.path.concat(list.length-1)};
 sfx('pick');renderProg();updateTut();
}
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)addTool(b.dataset.tool);});
$('trash').onclick=()=>{if(running)return;ensureAudio();const p=parseProg(L.pre);prog=clone(p);cur={list:'main',path:[]};sfx('rem');shake(4);renderProg();updateTut();};
function toggleMute(){muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';if(muted&&curAudio)curAudio.pause();if(muted&&window.speechSynthesis)speechSynthesis.cancel();}
$('muteBtn').onclick=toggleMute;
$('sayAgain').onclick=()=>{ensureAudio();say(sayId||'rolls_bump');};
$('playBack').onclick=()=>{sfx('pick');stopAll();openMap(LW);};
/* COACH FINGER: computes the next correct step toward the reference solution */
function nextStep(){
 const sol=parseProg(L.sol);
 const full=L.max&&progCount(prog)>=L.max;
 function walk(have,want,list,path,skipAdd){
  for(let i=0;i<Math.max(have.length,want.length);i++){
   const h=have[i],w=want[i],p=path.concat(i);
   if(!w)return {act:'rm',list,path:p};
   if(!h){if(skipAdd)continue;return {act:'add',list,path,tool:toolOf(w)};}
   if(h.k!==w.k||h.d!==w.d||h.c!==w.c)return {act:'rm',list,path:p};
   if(h.k==='rep'&&h.n!==w.n)return {act:'num',list,path:p};
   if(h.b){const r=walk(h.b,w.b,list,p,skipAdd);if(r)return r;}
  }
  return null;
 }
 if(full){const r=walk(prog.spell,sol.spell,'spell',[],1)||walk(prog.main,sol.main,'main',[],1);if(r&&r.act!=='add')return r;}
 return walk(prog.spell,sol.spell,'spell',[])||walk(prog.main,sol.main,'main',[]);
}
function toolOf(b){if(b.k==='m')return'm'+b.d;if(b.k==='rep')return'rep';if(b.k==='until')return'until';if(b.k==='fn')return'fn';return b.c==='p'?'ifp':'ift';}
function hideFinger(){$('finger').style.display='none';document.querySelectorAll('.want-t').forEach(e=>e.classList.remove('want-t'));$('go').classList.remove('want');}
function pointAt(el){
 document.querySelectorAll('.want-t').forEach(e=>e.classList.remove('want-t'));
 if(!el){$('finger').style.display='none';return;}
 el.classList.add('want-t');
 if(el.scrollIntoView)el.scrollIntoView({block:'nearest'});
 const r=el.getBoundingClientRect(),f=$('finger');
 f.style.display='block';f.style.left=(r.left+r.width/2-10)+'px';f.style.top=Math.min(innerHeight-46,r.top+r.height*.45)+'px';
}
function showStep(){
 const s=nextStep();$('go').classList.remove('want');
 if(!s){pointAt($('go'));$('go').classList.add('want');return;}
 if(s.act==='rm'){const id=s.list+':'+s.path.join(',');pointAt(document.querySelector(`[data-rm="${id}"]`));return;}
 if(s.act==='num'){const id=s.list+':'+s.path.join(',');pointAt(document.querySelector(`[data-num="${id}"]`));return;}
 if(cur.list!==s.list||cur.path.join()!==s.path.join()){pointAt(document.querySelector(`[data-slot="${s.list}:${s.path.join(',')}"]`));return;}
 pointAt(document.querySelector(`[data-tool="${s.tool}"]`));
}
function updateTut(){if(running){hideFinger();return;}if(tutOn||hintShown)showStep();else hideFinger();}
$('hint').onclick=()=>{if(running)return;ensureAudio();sfx('pick');$('hint').classList.remove('want');hintShown=true;showStep();};
/* RUN */
$('go').onclick=()=>{ensureAudio();if(running){runToken++;endRun();resetBoardState();sfx('rem');return;}if(!progCount(prog)){sfx('nope');return;}execute();};
function setGo(){const g=$('go');g.classList.toggle('stop',running);g.textContent=running?'■ STOP':'▶ GO';}
function endRun(){running=false;setGo();document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));updateTut();}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function lightBlock(p){
 document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));
 const a=(p[0]==='s'?'s':'m')+p.slice(1);
 const el=document.querySelector(`[data-a="${a}"]`);if(el)el.classList.add('active');
}
async function execute(){
 running=true;setGo();hideFinger();const tok=++runToken;
 const results=[];let union=new Set(),ok=true,lastFell=false;
 for(let i=0;i<L.days.length;i++){
  const day=L.days[i];resetBoardState();
  if(day){
   const db=$('daybar');db.style.display='flex';db.innerHTML=`<span style="color:${day==='p'?'var(--pink)':'var(--teal)'};font-size:20px">${day==='p'?'♥':'◆'}</span> ${i+1} / 2`;
   const m=document.querySelector('.pad.myst');if(m){m.style.background=day==='p'?'var(--pink)':'var(--teal)';m.textContent=day==='p'?'♥':'◆';m.style.animationPlayState='paused';}
   sfx('pad');await wait(520);if(tok!==runToken)return;
  }else $('daybar').style.display='none';
  const r=simulate(L,prog,day);results.push(r);r.coins.forEach(c=>union.add(c));
  const good=await animate(r,tok);if(tok!==runToken)return;
  if(!good){ok=false;lastFell=r.fell;break;}
  if(i<L.days.length-1){await wait(520);if(tok!==runToken)return;}
 }
 $('daybar').style.display='none';
 if(ok){await finishWin(union);return;}
 fails++;sfx('fail');
 const bi=document.querySelector('#ball .bi');if(!lastFell&&bi)bi.className='bi dizzy';
 say(lastFell?'fall':'fail'+(fails%3));
 if(fails>=2)$('hint').classList.add('want');
 await wait(1050);if(tok!==runToken)return;
 resetBoardState();endRun();
}
async function animate(r,tok){
 const ball=$('ball'),bi=document.querySelector('#ball .bi'),T=LW>=2?95:125;let i=0,trail=P.outfit.trail&&itemById(P.outfit.trail);
 for(const ev of r.ev){
  if(tok!==runToken)return false;
  if(ev.e==='act'){lightBlock(ev.p);await wait(75);}
  else if(ev.e==='step'){
   ball.classList.add('rolling');placeBall(ev.y,ev.x,T);sfx('step');
   if(trail)fx(trail.e,ev.x*cell+cell*.25,ev.y*cell+cell*.25,(Math.random()-.5)*26,-18,cell*.35);
   await wait(T);
  }
  else if(ev.e==='bump'){ball.classList.remove('rolling');sfx('bump');bi.classList.remove('squash');void bi.offsetWidth;bi.classList.add('squash');if(ev.moved)shake(3);await wait(170);}
  else if(ev.e==='coin'){sfx('coin');const t=document.querySelector(`[data-k="${ev.y},${ev.x}"]`);if(t)t.style.visibility='hidden';fx('🪙',ev.x*cell+cell*.2,ev.y*cell,0,-48,cell*.55);}
  else if(ev.e==='press'){sfx('press');const t=document.querySelector(`[data-k="${ev.y},${ev.x}"] .btn-t`);if(t)t.classList.add('pressed');openDoor(ev.door);shake(5);await wait(120);}
  else if(ev.e==='padstop'){ball.classList.remove('rolling');sfx('pad');await wait(150);}
  else if(ev.e==='win'){ball.classList.remove('rolling');bi.className='bi dance';return true;}
  else if(ev.e==='fall'){ball.classList.remove('rolling');sfx('fall');const t=document.querySelector(`[data-k="${ev.y},${ev.x}"]`);if(t)t.style.opacity='.25';bi.className='bi falling';await wait(550);return false;}
 }
 ball.classList.remove('rolling');
 return r.win;
}
function openDoor(d){const col=d==='A'?'var(--red)':'var(--blue)';document.querySelectorAll('.door').forEach(e=>{if(e.style.getPropertyValue('--c')===col)e.classList.add('open');});}
/* WIN */
function code(p){
 const ind=n=>'  '.repeat(n);const W={U:'up',D:'down',L:'left',R:'right'};
 function seq(l,n){return l.map(b=>{
  if(b.k==='m')return `${ind(n)}roll("${W[b.d]}");`;
  if(b.k==='fn')return `${ind(n)}spell();`;
  if(b.k==='rep')return `${ind(n)}repeat(${b.n}) {\n${seq(b.b,n+1)}\n${ind(n)}}`;
  if(b.k==='if')return `${ind(n)}if (pad == "${b.c==='p'?'pink':'teal'}") {\n${seq(b.b,n+1)}\n${ind(n)}}`;
  if(b.k==='until')return `${ind(n)}while (!atFlag()) {\n${seq(b.b,n+1)}\n${ind(n)}}`;
 }).join('\n');}
 return (p.spell.length?`function spell() {\n${seq(p.spell,1)}\n}\n\n`:'')+seq(p.main,0);
}
async function finishWin(union){
 sfx('win');confetti();shake(6);
 const total=L.coins.length,gotAll=L.coins.every(c=>union.has(c));
 const par=progCount(parseProg(L.sol)),n=progCount(prog);
 const stars=1+(gotAll?1:0)+(n<=par?1:0);
 const k=key(LW,LI),old=P.done[k];
 let gain=old?1:5;
 const newStars=stars-(old?old.stars:0);if(newStars>0)gain+=newStars*3;
 const oldC=old?old.c||0:0;const nc=union.size;if(nc>oldC)gain+=nc-oldC;
 P.done[k]={stars:Math.max(stars,old?old.stars:0),c:Math.max(nc,oldC)};
 save();
 say('win'+Math.floor(Math.random()*5));
 const wDone=worldDone(LW)&&!(old);
 const isChest=!old&&(LI+1)%5===0;
 const tokW=runToken;await wait(700);if(tokW!==runToken)return;
 const hasNext=LI<14||LW<4;
 const allDone=WORLDS.every((_,i)=>worldDone(i));
 const notes=(n>par?`<div class="intro">💡 ${par} blocks can do it!</div>`:'')+(!gotAll&&total?`<div class="intro">🪙 ${union.size}/${total}</div>`:'');
 $('card').innerHTML=`<h2>${LW===4&&LI===14&&!old?'CHAMPION!':'You did it!'}</h2><div class="reward" style="height:88px">${pomSvg(P.char,P.outfit).replace('<svg','<svg style="height:88px"')}</div><div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'got':''}" style="animation-delay:${i*.18}s">⭐</span>`).join('')}</div>${notes}<div class="coinpill" style="display:inline-flex;margin-top:3px">+${gain} 🪙</div><div class="cardrow"><button class="big alt chunky" id="again">↺</button><button class="big alt chunky" id="peek" style="font-family:ui-monospace,monospace">{ }</button><button class="big chunky" id="next">${hasNext?'▶':'🏠'}</button></div><div class="code" id="codeBox"></div>`;
 $('over').classList.add('on');
 [0,1,2].forEach(i=>{if(i<stars)setTimeout(()=>sfx('star'),i*180+120);});
 earn(gain);
 $('again').onclick=()=>{sfx('pick');startRetain();};
 $('peek').onclick=()=>{sfx('pick');const c=$('codeBox');c.textContent=code(prog);c.style.display=c.style.display==='block'?'none':'block';};
 $('next').onclick=async()=>{
  sfx('pick');
  if(isChest&&!P.seen['c'+k]){P.seen['c'+k]=1;save();showChest(()=>afterLevel(wDone,allDone));return;}
  afterLevel(wDone,allDone);
 };
 running=false;setGo();
}
function startRetain(){$('over').classList.remove('on');const keep=clone(prog);startLevel(LW,LI);prog=keep;cur={list:'main',path:[]};tutOn=false;renderProg();hideFinger();}
function afterLevel(wDone,allDone){
 if(wDone&&LW<4&&!P.seen['set'+(LW+1)]){P.seen['set'+(LW+1)]=1;save();showNewSet(LW+1,()=>go2());return;}
 if(allDone&&!P.seen.champ){P.seen.champ=1;save();showChampion();return;}
 go2();
 function go2(){
  $('over').classList.remove('on');
  if(LI<14)startLevel(LW,LI+1);
  else if(LW<4)openMap(LW+1);
  else openMap(LW);
 }
}
function showChest(cb){
 const pool=ITEMS.filter(i=>!P.owned.includes(i.id)&&i.p<=40+LW*25);
 const it=pool.length&&Math.random()<.75?pool[Math.floor(Math.random()*pool.length)]:null;
 let body;
 if(it){P.owned.push(it.id);if(!P.outfit[it.slot])P.outfit[it.slot]=it.id;const art=it.slot==='trail'?`<span style="font-size:90px">${it.e}</span>`:pomSvg(P.char,{[it.slot]:it.id});body=`<div class="reward">${art}</div>`;}
 else{const g=25+LW*10;P.coins+=g;body=`<div style="font-size:70px">🪙</div><div class="coinpill" style="display:inline-flex">+${g}</div>`;}
 save();setCoins(true);
 $('card').innerHTML=`<div style="font-size:76px;animation:wiggle .35s 4">🎁</div><button class="big chunky" id="openC" style="background:var(--gold);color:#3a2300">OPEN!</button>`;
 say('chest');
 $('openC').onclick=()=>{sfx('chest');confetti();shake(8);
  $('card').innerHTML=`<h2>Treasure!</h2>${body}<div class="cardrow"><button class="big alt chunky" id="wear">👕</button><button class="big chunky" id="ok">▶</button></div>`;
  $('wear').onclick=()=>{$('over').classList.remove('on');stopAll();ctab=it?it.slot:'char';openCloset();};
  $('ok').onclick=()=>{sfx('pick');cb();};
 };
}
function showNewSet(s,cb){
 sfx('chest');confetti(60);say('newset');
 const S=SETS[s];
 $('card').innerHTML=`<h2>${S.ico} ${S.name}!</h2><div class="reward" style="display:grid;grid-template-columns:repeat(4,1fr);gap:0">${S.chars.map((c,i)=>pomSvg(s+'-'+i,{})).join('').replace(/<svg/g,'<svg style="height:auto;width:100%"')}</div><div class="cardrow"><button class="big alt chunky" id="wear">🐾</button><button class="big chunky" id="ok">▶</button></div>`;
 $('wear').onclick=()=>{$('over').classList.remove('on');stopAll();ctab='char';mapW=Math.min(LW+1,4);openCloset();};
 $('ok').onclick=()=>{sfx('pick');cb();};
}
function showChampion(){
 sfx('chest');confetti(120);say('champion');P.coins+=200;save();setCoins(true);
 $('card').innerHTML=`<h2>🏆 Real Coder!</h2><div class="reward">${pomSvg(P.char,Object.assign({},P.outfit,{head:'crown'}))}</div><div class="coinpill" style="display:inline-flex">+200 🪙</div><div class="cardrow"><button class="big chunky" id="ok">🏠</button></div>`;
 if(!P.owned.includes('crown'))P.owned.push('crown');save();
 $('ok').onclick=()=>{$('over').classList.remove('on');openMap(4);};
}
/* KEYBOARD */
document.addEventListener('keydown',e=>{
 if(!$('play').classList.contains('on')||$('over').classList.contains('on'))return;
 const m={ArrowUp:'mU',ArrowDown:'mD',ArrowLeft:'mL',ArrowRight:'mR'}[e.key];
 if(m){e.preventDefault();addTool(m);}
 if(e.key==='Enter'||e.key===' '){e.preventDefault();$('go').click();}
 if(e.key==='Backspace'){const l=getList(cur);if(l.length){l.pop();sfx('rem');renderProg();updateTut();}}
});
window.addEventListener('error',e=>{console.error(e.message);if(running){running=false;setGo();}});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.nodes,.shelf,.rails,.card,.tabs'))e.preventDefault();},{passive:false});
buildTitle();
</script>
