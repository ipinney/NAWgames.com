<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KeyHero</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08001a; overflow: hidden; touch-action: none; user-select: none; }
canvas#c { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

/* ---- MENU OVERLAY ---- */
#menu {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center; padding: 20px; overflow-y: auto;
}
.m-icon { font-size: clamp(36px,7vw,64px); margin-bottom: 4px; animation: iconPop 1.5s ease-in-out infinite; }
@keyframes iconPop { 0%,100%{transform:scale(1) rotate(-3deg)} 50%{transform:scale(1.1) rotate(3deg)} }
.m-title { font-family:'Courier New',monospace; font-size:clamp(28px,7vw,60px); font-weight:bold; color:#cc44ff; text-shadow:0 0 30px #cc44ff, 0 0 60px #8800ff; letter-spacing:4px; animation:glow 2s ease-in-out infinite; margin-bottom:4px; }
.m-sub   { font-family:'Courier New',monospace; font-size:clamp(11px,2vw,16px); color:#dd88ff; margin-bottom:14px; opacity:0.85; }
@keyframes glow { 0%,100%{text-shadow:0 0 30px #cc44ff,0 0 60px #8800ff} 50%{text-shadow:0 0 50px #dd66ff,0 0 100px #aa00ff,0 0 140px #cc44ff} }

/* Song card */
.song-card {
  background: linear-gradient(135deg, #1e0550 0%, #3a0070 100%);
  border: 2px solid #cc44ff44; border-radius: 16px; padding: 14px 32px; margin-bottom: 14px;
  box-shadow: 0 0 40px #cc44ff22;
}
.song-card-title  { font-family:'Courier New',monospace; font-size:clamp(16px,3.5vw,26px); font-weight:bold; color:#ffffff; letter-spacing:2px; }
.song-card-artist { font-family:'Courier New',monospace; font-size:clamp(11px,2vw,16px); color:#dd88ff; margin-top:3px; opacity:0.85; }

/* section title */
.sec-title { font-family:'Courier New',monospace; font-size:clamp(10px,1.8vw,14px); color:#aa88cc; margin-bottom:8px; letter-spacing:2px; opacity:0.9; }
.btn-row   { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }

/* difficulty */
.diff-btn { font-family:'Courier New',monospace; font-size:clamp(11px,1.8vw,15px); padding:9px 18px; border:2px solid #888; color:#aaa; border-radius:8px; cursor:pointer; background:transparent; transition:all 0.1s; }
.diff-btn.sel { border-color:#cc44ff; color:#cc44ff; background:#cc44ff22; box-shadow:0 0 15px #cc44ff66; }

/* hand/mode buttons */
.hand-btn { font-family:'Courier New',monospace; font-size:clamp(11px,1.8vw,15px); padding:10px 20px; border:2px solid #555; color:#888; border-radius:10px; cursor:pointer; background:transparent; transition:all 0.15s; min-width:clamp(110px,20vw,160px); }
.hand-keys { font-size:clamp(9px,1.3vw,11px); opacity:0.6; margin-top:2px; letter-spacing:1px; }
.hand-btn.sel-left   { border-color:#44aaff; color:#44aaff; background:#44aaff22; box-shadow:0 0 18px #44aaff66; }
.hand-btn.sel-right  { border-color:#ff8844; color:#ff8844; background:#ff884422; box-shadow:0 0 18px #ff884466; }
.hand-btn.sel-both   { border-color:#44ffcc; color:#44ffcc; background:#44ffcc22; box-shadow:0 0 18px #44ffcc66; }
.hand-btn.sel-expert { border-color:#ffcc00; color:#ffcc00; background:#ffcc0022; box-shadow:0 0 18px #ffcc0066; }

/* Play button */
.play-btn {
  font-family:'Courier New',monospace; font-size:clamp(14px,2.5vw,20px); font-weight:bold;
  background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none;
  padding:12px 46px; border-radius:50px; cursor:pointer; letter-spacing:3px;
  box-shadow:0 0 30px #cc44ff88; transition:transform 0.1s, box-shadow 0.1s;
}
.play-btn:hover { transform:scale(1.05); box-shadow:0 0 50px #cc44ffcc; }
.play-btn:active { transform:scale(0.96); }

/* ---- RESULTS SCREEN ---- */
#results {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: rgba(0,0,0,0.92); display: none; flex-direction: column;
  align-items: center; justify-content: center; color: white; text-align: center; padding: 20px;
}
#res-title { font-family:'Courier New',monospace; font-size:clamp(24px,6vw,52px); font-weight:bold; margin-bottom:8px; }
#res-stars { font-size:clamp(28px,6vw,50px); margin-bottom:14px; }
#res-stats { font-family:'Courier New',monospace; font-size:clamp(12px,2.2vw,17px); color:#dd88ff; line-height:2.2; margin-bottom:24px; }
#res-again { font-family:'Courier New',monospace; font-size:16px; background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none; padding:11px 32px; border-radius:40px; cursor:pointer; letter-spacing:2px; margin:4px; }
#res-menu  { font-family:'Courier New',monospace; font-size:15px; background:transparent; color:#aa88cc; border:2px solid #664499; padding:10px 26px; border-radius:40px; cursor:pointer; letter-spacing:2px; }

/* ---- HUD ---- */
#hud { position: fixed; top: 8px; left: 0; right: 0; z-index: 50; pointer-events: none; display: none; align-items: flex-start; justify-content: space-between; padding: 0 14px; }
#hud-combo { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,20px); color:#ffdd44; text-shadow:0 0 10px #ffdd44; }
#hud-score { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,20px); color:#cc44ff; text-shadow:0 0 10px #cc44ff; }
#hud-song  { font-family:'Courier New',monospace; font-size:clamp(9px,1.6vw,13px); color:#aa88cc; text-align:center; }

/* HP bar */
#hp-wrap { position:fixed; bottom:0; left:0; right:0; height:4px; z-index:50; pointer-events:none; background:rgba(0,0,0,0.4); display:none; }
#hp-bar  { height:100%; background:linear-gradient(90deg,#cc44ff,#ff44aa); transition:width 0.3s; }

/* Countdown */
#countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 110; display: none; pointer-events: none; font-family:'Courier New',monospace; font-size:clamp(60px,18vw,120px); font-weight:bold; color:#cc44ff; text-shadow:0 0 60px #cc44ff; }

/* Loading */
#loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%); display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
#loading-icon { font-size: 64px; animation: spin 1s linear infinite; }
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
#loading-text { font-family:'Courier New',monospace; font-size: 20px; color:#dd88ff; margin-top:16px; letter-spacing:3px; }
#loading-sub  { font-family:'Courier New',monospace; font-size: 14px; color:#886699; margin-top:8px; }

/* ── Phase nav ── */
#phase-mode { display:flex; flex-direction:column; align-items:center; width:100%; }
#phase-song { display:none; flex-direction:column; align-items:center; width:100%; max-width:900px; }

/* "Pick a Song" CTA */
.pick-song-btn {
  font-family:'Courier New',monospace; font-size:clamp(14px,2.5vw,20px); font-weight:bold;
  background:linear-gradient(135deg,#330088,#880033); color:white; border:2px solid #cc44ff88;
  padding:13px 48px; border-radius:50px; cursor:pointer; letter-spacing:3px; margin-top:6px;
  box-shadow:0 0 24px #8800ff66; transition:transform 0.1s, box-shadow 0.1s;
}
.pick-song-btn:hover { transform:scale(1.05); box-shadow:0 0 44px #cc44ffaa; }
.pick-song-btn:active { transform:scale(0.96); }

/* Song grid */
#song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  width: 100%;
  max-height: 58vh;
  overflow-y: auto;
  padding: 4px 2px 4px;
  margin-bottom: 14px;
  scrollbar-width: thin;
  scrollbar-color: #cc44ff44 transparent;
}
#song-grid::-webkit-scrollbar { width: 4px; }
#song-grid::-webkit-scrollbar-thumb { background: #cc44ff44; border-radius: 4px; }

/* Song card */
.s-card {
  border-radius: 14px; padding: 14px 12px 10px; cursor: pointer;
  border: 2px solid rgba(255,255,255,0.1); text-align: left;
  transition: all 0.15s; position: relative; overflow: hidden;
  min-height: 110px; display: flex; flex-direction: column; justify-content: flex-end;
}
.s-card:hover  { transform: scale(1.04); border-color: rgba(255,255,255,0.35); }
.s-card.sel    { border-color: white !important; box-shadow: 0 0 22px rgba(255,255,255,0.45); transform: scale(1.07); }
.s-check       { position: absolute; top: 7px; right: 9px; font-size: 14px; display: none; }
.s-card.sel .s-check { display: block; }
.s-card-emoji  { font-size: 28px; margin-bottom: 8px; }
.s-card-title  { font-family:'Courier New',monospace; font-size:clamp(9px,1.6vw,12px); font-weight:bold; color:#fff; line-height:1.25; }
.s-card-artist { font-family:'Courier New',monospace; font-size:clamp(8px,1.2vw,10px); color:rgba(255,255,255,0.6); margin-top:3px; }

/* Bottom bar on song screen */
.song-nav { display:flex; gap:12px; justify-content:center; align-items:center; margin-top:2px; }
.back-btn {
  font-family:'Courier New',monospace; font-size:clamp(12px,2vw,16px);
  background:transparent; color:#aa88cc; border:2px solid #664499;
  padding:10px 24px; border-radius:40px; cursor:pointer; letter-spacing:2px;
  transition:all 0.15s;
}
.back-btn:hover { background:#44224433; }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="menu">
  <div class="m-icon">🎵</div>
  <div class="m-title">KEY HERO</div>

  <!-- ── STEP 1: Mode selection ── -->
  <div id="phase-mode">
    <div class="m-sub" id="m-sub-hint">Hit the keys as notes reach the circles!</div>

    <div class="sec-title">DIFFICULTY</div>
    <div class="btn-row" id="diff-btns">
      <button class="diff-btn sel" onclick="selectDiff(0)">😊 EASY</button>
      <button class="diff-btn" onclick="selectDiff(1)">😤 MEDIUM</button>
      <button class="diff-btn" onclick="selectDiff(2)">💀 HARD</button>
    </div>

    <div class="sec-title">HAND MODE</div>
    <div class="btn-row" id="hand-btns">
      <button class="hand-btn sel-left" id="hand-left" onclick="selectMode(0)">
        ✋ LEFT HAND<div class="hand-keys">A &nbsp; S &nbsp; D &nbsp; F</div>
      </button>
      <button class="hand-btn" id="hand-right" onclick="selectMode(1)">
        🤚 RIGHT HAND<div class="hand-keys">J &nbsp; K &nbsp; L &nbsp; ;</div>
      </button>
      <button class="hand-btn" id="hand-both" onclick="selectMode(2)">
        🙌 BOTH HANDS<div class="hand-keys">A S D F + J K L ;</div>
      </button>
      <button class="hand-btn" id="hand-expert" onclick="selectMode(3)">
        ⌨️ EXPERT<div class="hand-keys">QW·AS·ZX + UI·JK·NM</div>
      </button>
    </div>

    <button class="pick-song-btn" onclick="showSongPicker()">🎵 PICK A SONG →</button>
  </div>

  <!-- ── STEP 2: Song picker ── -->
  <div id="phase-song">
    <div class="sec-title" style="margin-bottom:10px">CHOOSE YOUR SONG</div>
    <div id="song-grid"></div>
    <div class="song-nav">
      <button class="back-btn" onclick="showModePicker()">← BACK</button>
      <button class="play-btn" onclick="startCountdown()">▶ PLAY</button>
    </div>
    <div id="loading-track" style="color:#aaa;font-size:13px;margin-top:8px;display:none">🎵 Loading audio…</div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-combo">COMBO: 0</div>
  <div id="hud-song"></div>
  <div id="hud-score">0</div>
</div>
<div id="hp-wrap"><div id="hp-bar" style="width:100%"></div></div>

<!-- Countdown -->
<div id="countdown"></div>

<!-- Loading -->
<div id="loading-overlay">
  <div id="loading-icon">🎵</div>
  <div id="loading-text">LOADING MUSIC</div>
  <div id="loading-sub">Tuning piano...</div>
</div>

<!-- Results -->
<div id="results">
  <div id="res-title">SONG CLEAR!</div>
  <div id="res-stars">⭐⭐⭐</div>
  <div id="res-stats"></div>
  <button id="res-again" onclick="replayGame()">▶ PLAY AGAIN</button>
  <button id="res-menu"  onclick="goMenu()">🏠 MENU</button>
</div>

      const local   = isRight ? l - 12 : l;
      const col     = local % 4;                    // 0-3 within the hand
      const kRow    = Math.floor(local / 4);        // 0=bottom, 1=home, 2=top
      const colW    = isRight ? colW_R : colW_L;
      const startX  = isRight ? RH_X   : 0;
      // Keyboard stagger: top row shifts left, bottom row shifts right
      const sx      = kRow === 2 ? -STAGGER : kRow === 0 ? STAGGER : 0;
      const hitX    = startX + (col + 0.5) * colW + sx;
      const hitY    = HOME_Y + (kRow === 0 ? ROW_GAP : kRow === 2 ? -ROW_GAP : 0);
      const color   = `hsl(${laneHue(l,24)},100%,62%)`;
      LANE_CFG.push({ key:k.key, code:k.code, hitX, hitY, color, row:kRow, laneW:colW });
    }
  }

  lanePressed = new Array(NUM_LANES).fill(false);
  hitFlash    = new Array(NUM_LANES).fill(0);
  nextPerLane = new Array(NUM_LANES).fill(null);
}
buildLaneConfig();

// Build keyCode→lane lookup
function buildKeyMap() {
  const map = {};
  LANE_CFG.forEach((cfg, i) => { map[cfg.code] = i; });
  return map;
}
let KEY_MAP = buildKeyMap();

// ── Note chart building ───────────────────────────────────────
function firstInWindow(notes, windowBeats) {
  const wins = {};
  notes.forEach(n => {
    const key = Math.floor(n[1] / windowBeats);
    if (!(key in wins) || n[1] < wins[key][1]) wins[key] = n;
  });
  return Object.values(wins).sort((a,b) => a[1]-b[1]);
}

function varietyChart(notes, windowBeats) {
  const wins = {};
  notes.forEach(n => {
    const key = Math.floor(n[1] / windowBeats);
    if (!wins[key]) wins[key] = [];
    wins[key].push(n);
  });
  const result = []; let prevLane = -1;
  Object.keys(wins).map(Number).sort((a,b)=>a-b).forEach(key => {
    const cands  = wins[key];
    const diff   = cands.filter(n => n[0] !== prevLane);
    const pool   = diff.length ? diff : cands;
    const strong = pool.filter(n => Math.abs(n[1] - Math.round(n[1])) < 0.01);
    const best   = (strong.length ? strong : pool).reduce((a,b) => b[1] < a[1] ? b : a);
    result.push(best); prevLane = best[0];
  });
  return result;
}

function buildNoteChart() {
  const song    = SONGS[selectedSong];
  const maxBeat = song.maxBeats[selectedDiff];
  const breaks  = buildPitchBreaks(NUM_LANES);
  const clipped = song.pitches.filter(([, beat]) => beat <= maxBeat);
  const mapped  = clipped.map(([pitch, beat]) => [pitchToLane(pitch, breaks), beat]);
  let src;
  if      (selectedDiff === 0) src = firstInWindow(mapped, 4.0);
  else if (selectedDiff === 1) src = varietyChart(mapped, 2.0);
  else                          src = mapped;
  return src.map(([lane, beat]) => ({ lane, beat, state:'pending' }));
}

// ============================================================
// AUDIO — OGG backing track + Web Audio hit sounds
// ============================================================
const _AudioCtx  = window.AudioContext || window.webkitAudioContext;
let audioCtx     = null;
let trackBuffer  = null;
let trackSource  = null;
let trackLoading = false;
let trackLoaded  = false;

function loadTrack() {
  if (trackLoading || trackLoaded) return;
  trackLoading = true;
  fetch(SONGS[selectedSong].audioFile)
    .then(r => r.arrayBuffer())
    .then(ab => { if (!audioCtx) audioCtx = new _AudioCtx(); return audioCtx.decodeAudioData(ab); })
    .then(buf => {
      trackBuffer = buf; trackLoaded = true; trackLoading = false;
      const ldEl = document.getElementById('loading-track');
      if (ldEl) ldEl.style.display = 'none';
    })
    .catch(e => { console.error('Track load failed', e); trackLoading = false; });
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new _AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  loadTrack();
}

function playNote(hz, vol, dur) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = hz;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.05);
}

function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(80,t+0.15);
  g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.2);
}

function playPerfect() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [2200,3300].forEach((freq,i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0,t+i*0.04); g.gain.linearRampToValueAtTime(0.06,t+i*0.04+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.04+0.12);
    o.connect(g); g.connect(audioCtx.destination); o.start(t+i*0.04); o.stop(t+i*0.04+0.15);
  });
}

function synthVoice(hz, t, dur, gain, cutoff) {
  if (!audioCtx) return;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = cutoff||3000; filt.Q.value = 1.4;
  const mg = audioCtx.createGain();
  mg.gain.setValueAtTime(0,t); mg.gain.linearRampToValueAtTime(gain,t+0.003);
  mg.gain.exponentialRampToValueAtTime(gain*0.6,t+0.08);
  mg.gain.setValueAtTime(gain*0.6,t+Math.max(dur-0.08,0.01));
  mg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  filt.connect(mg); mg.connect(audioCtx.destination);
  [1.0,1.004].forEach(det => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz*det; g.gain.value = 0.5;
    o.connect(g); g.connect(filt); o.start(t); o.stop(t+dur+0.05);
  });
}

// pitch→hz for hit sound feedback
function midiToHz(midi) { return 440 * Math.pow(2, (midi-69)/12); }

function playHitNote(lane, isPerfect) {
  if (!audioCtx) return;
  // play a note in the melody's register (use lane index to pick pitch)
  const breaks = buildPitchBreaks(NUM_LANES);
  const pitchIdx = Math.round((lane / (NUM_LANES-1)) * (_sortedPitches.length-1));
  const hz = midiToHz(_sortedPitches[pitchIdx] || 81);
  synthVoice(hz, audioCtx.currentTime, 0.5, isPerfect ? 0.60 : 0.40, 4200);
}

function playWrongNote(lane) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const breaks = buildPitchBreaks(NUM_LANES);
  const pitchIdx = Math.round((lane / Math.max(NUM_LANES-1,1)) * (_sortedPitches.length-1));
  const hz = midiToHz((_sortedPitches[pitchIdx] || 81) - 1);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = hz * 0.97;
  g.gain.setValueAtTime(0.07,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.22);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+0.25);
}

function scheduleMelody() {
  if (!audioCtx || !trackBuffer) return;
  if (trackSource) { try { trackSource.stop(); } catch(e){} }
  trackSource = audioCtx.createBufferSource();
  trackSource.buffer = trackBuffer;
  const gainNode = audioCtx.createGain(); gainNode.gain.value = 0.55;
  trackSource.connect(gainNode); gainNode.connect(audioCtx.destination);
  trackSource.start(songStartTime, 0);
}

function stopMelody() {
  if (trackSource) { try { trackSource.stop(); } catch(e){} trackSource = null; }
  if (audioCtx)    { try { audioCtx.close();   } catch(e){} audioCtx = null; }
  trackLoaded = false; trackBuffer = null; trackLoading = false;
}
// ============================================================
// GAME STATE
// ============================================================
const FALL_BEATS_BY_DIFF  = [10.0, 5.5,  2.5];
const HIT_PERFECT_BEATS  = [0.55, 0.28, 0.12];
const HIT_GOOD_BEATS     = [0.85, 0.48, 0.22];
let FALL_BEATS, HIT_PERFECT, HIT_GOOD;

let gameActive = false, songStartTime = 0;
let score = 0, combo = 0, maxCombo = 0, hp = 100;
let perfects = 0, goods = 0, misses = 0;
let noteQueue = [], particles = [], floatingTexts = [];
let frameCount = 0;

function getCurrentBeat() {
  if (!audioCtx || !gameActive) return 0;
  return (audioCtx.currentTime - songStartTime) * (SONGS[selectedSong].bpm / 60);
}

// ============================================================
// GAME START / END
// ============================================================
let countdownTimer = null;
function startCountdown() {
  ensureAudio();
  FALL_BEATS  = FALL_BEATS_BY_DIFF[selectedDiff];
  HIT_PERFECT = HIT_PERFECT_BEATS[selectedDiff];
  HIT_GOOD    = HIT_GOOD_BEATS[selectedDiff];
  document.getElementById('menu').style.display = 'none';
  const cdEl = document.getElementById('countdown');
  cdEl.style.display = 'block'; let count = 3; cdEl.textContent = count; playNote(440,0.15,0.1);
  countdownTimer = setInterval(() => {
    count--;
    if (count > 0) { cdEl.textContent = count; playNote(440,0.15,0.1); }
    else { clearInterval(countdownTimer); cdEl.textContent = 'GO!'; setTimeout(() => { cdEl.style.display='none'; startGame(); }, 400); }
  }, 1000);
}

function startGame() {
  ensureAudio();
  if (!trackLoaded) {
    const ldEl = document.getElementById('loading-track');
    if (ldEl) { ldEl.textContent='🎵 Loading audio…'; ldEl.style.display='block'; }
    document.getElementById('menu').style.display = 'flex';
    const waitId = setInterval(() => {
      if (trackLoaded) { clearInterval(waitId); if (ldEl) ldEl.style.display='none'; document.getElementById('menu').style.display='none'; startGame(); }
    }, 200);
    return;
  }
  score=0; combo=0; maxCombo=0; hp=100; perfects=0; goods=0; misses=0;
  frameCount=0; particles=[]; floatingTexts=[];
  hitFlash = new Array(NUM_LANES).fill(0);
  nextPerLane = new Array(NUM_LANES).fill(null);

  buildLaneConfig();
  KEY_MAP = buildKeyMap();
  noteQueue = buildNoteChart();

  songStartTime = audioCtx.currentTime + 0.5;
  gameActive = true;

  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hp-wrap').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  const modeLabel = ['✋ ASDF','🤚 JKL;','🙌 BOTH','⌨️ EXPERT'][selectedMode];
  document.getElementById('hud-song').textContent = SONGS[selectedSong].title + '  ' + modeLabel;

  scheduleMelody();
  const totalBeats = SONGS[selectedSong].maxBeats[selectedDiff] + 4;
  setTimeout(() => { if (gameActive) endGame(true); }, totalBeats * (60000 / SONGS[selectedSong].bpm) + 2000);
}

function endGame(completed) {
  if (!gameActive) return;
  gameActive = false; stopMelody();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hp-wrap').style.display = 'none';
  const total    = perfects + goods + misses;
  const accuracy = total > 0 ? Math.round(((perfects + goods*0.5)/total)*100) : 0;
  const stars    = accuracy>=95?'⭐⭐⭐':accuracy>=75?'⭐⭐':accuracy>=50?'⭐':'💀';
  document.getElementById('res-title').textContent = completed ? (accuracy>=95?'🎉 PERFECT!':'🎵 SONG CLEAR!') : '💀 GAME OVER';
  document.getElementById('res-title').style.color = accuracy>=75?'#cc44ff':'#ff4444';
  document.getElementById('res-stars').textContent = stars;
  document.getElementById('res-stats').innerHTML =
    `${SONGS[selectedSong].title}<br><br>✨ Perfect: ${perfects}&nbsp;&nbsp;👍 Good: ${goods}&nbsp;&nbsp;❌ Miss: ${misses}<br><br>🎯 Accuracy: ${accuracy}%<br>🔥 Max Combo: ×${maxCombo}<br>⭐ Score: ${score}`;
  document.getElementById('results').style.display = 'flex';
}

function replayGame() { document.getElementById('results').style.display='none'; startCountdown(); }
function goMenu() {
  document.getElementById('results').style.display='none';
  document.getElementById('menu').style.display='flex';
  gameActive=false; stopMelody();
  selectMode(selectedMode);
}

// ============================================================
// HIT DETECTION
// ============================================================
function tryHit(lane) {
  if (!gameActive) return;
  const cb = getCurrentBeat();
  let bestNote=null, bestDist=Infinity;
  noteQueue.forEach(n => {
    if (n.lane!==lane || n.state!=='pending') return;
    const dist = Math.abs(n.beat - cb);
    if (dist < HIT_GOOD && dist < bestDist) { bestDist=dist; bestNote=n; }
  });
  if (bestNote) {
    const isPerfect = bestDist <= HIT_PERFECT;
    bestNote.state = 'hit';
    if (isPerfect) {
      perfects++; combo++; if (combo>maxCombo) maxCombo=combo;
      const mult = Math.min(4, 1+Math.floor(combo/5));
      score += 100*mult;
      addFeedback(lane,'✨ PERFECT','#cc44ff',100*mult);
      playHitNote(lane, true); playPerfect();
      spawnParticles(lane, LANE_CFG[lane].color, 18);
    } else {
      goods++; combo++; if (combo>maxCombo) maxCombo=combo;
      const mult = Math.min(4, 1+Math.floor(combo/5));
      score += 50*mult;
      addFeedback(lane,'👍 GOOD','#44ff88',50*mult);
      playHitNote(lane, false);
      spawnParticles(lane, LANE_CFG[lane].color, 8);
    }
    hitFlash[lane] = 1.0;
  } else {
    hitFlash[lane] = 0.4;
    playWrongNote(lane);
  }
}

function addFeedback(lane, text, color, pts) {
  const cfg = LANE_CFG[lane];
  floatingTexts.push({ x:cfg.hitX, y:cfg.hitY-40, text, color, life:55, vy:-1.2 });
  if (pts) floatingTexts.push({ x:cfg.hitX, y:cfg.hitY-60, text:'+'+pts, color:'#ffdd44', life:45, vy:-0.8 });
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(lane, color, count) {
  const cfg = LANE_CFG[lane];
  for (let i=0; i<count; i++) {
    const a=Math.random()*Math.PI*2, spd=1+Math.random()*5;
    const [r,g,b] = hexToRgb(color);
    particles.push({ x:cfg.hitX, y:cfg.hitY, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-2, life:25+Math.random()*20, maxLife:45, r,g,b });
  }
}
function hexToRgb(hex) {
  if (hex.startsWith('hsl')) {
    // convert hsl to rgb approximation using canvas
    const tmp=document.createElement('canvas'); tmp.width=tmp.height=1;
    const c=tmp.getContext('2d'); c.fillStyle=hex; c.fillRect(0,0,1,1);
    const d=c.getImageData(0,0,1,1).data; return [d[0],d[1],d[2]];
  }
  if (hex.length===7) return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  return [200,100,255];
}
// ============================================================
// UPDATE
// ============================================================
function update() {
  if (!gameActive) return;
  const cb = getCurrentBeat();
  noteQueue.forEach(n => {
    if (n.state==='pending' && cb > n.beat + HIT_GOOD + 0.05) {
      n.state='missed'; misses++; combo=0;
      hp = Math.max(0, hp-8);
      addFeedback(n.lane,'❌ MISS','#ff4444',0);
      playMiss();
      if (hp<=0) endGame(false);
    }
  });
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; });
  particles     = particles.filter(p=>p.life>0);
  floatingTexts.forEach(f => { f.y+=f.vy; f.life--; });
  floatingTexts = floatingTexts.filter(f=>f.life>0);
  hitFlash      = hitFlash.map(f=>Math.max(0,f-0.08));
  document.getElementById('hud-combo').textContent = combo>=2?`🔥 ×${combo}`:`COMBO: ${combo}`;
  document.getElementById('hud-score').textContent = score.toLocaleString();
  document.getElementById('hp-bar').style.width = hp+'%';
  document.getElementById('hp-bar').style.background =
    hp>50?'linear-gradient(90deg,#cc44ff,#ff44aa)':hp>25?'linear-gradient(90deg,#ffcc00,#ff8800)':'linear-gradient(90deg,#ff4444,#cc0000)';
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  ctx.fillStyle = '#08001a'; ctx.fillRect(0,0,W,H);

  // Floating bg music notes
  const bgChars = ['♩','♪','♫','♬'];
  ctx.globalAlpha=0.05; ctx.font='24px Arial';
  for (let i=0; i<16; i++) {
    ctx.fillStyle=LANE_CFG[i%NUM_LANES].color;
    ctx.fillText(bgChars[i%4], ((i*137+frameCount*0.3)%W), H-((frameCount*0.4+i*80)%H));
  }
  ctx.globalAlpha=1;

  if (selectedMode===3) {
    drawExpert();
  } else {
    drawStandard();
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
    const sz=6*(p.life/p.maxLife);
    ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);
  });
  ctx.globalAlpha=1;

  // Floating feedback texts
  floatingTexts.forEach(f => {
    ctx.globalAlpha=Math.min(1,f.life/30);
    ctx.font='bold 15px Courier New'; ctx.fillStyle=f.color; ctx.textAlign='center';
    ctx.fillText(f.text,f.x,f.y);
  });
  ctx.globalAlpha=1; ctx.textAlign='left';

  // Combo burst
  if (gameActive && combo>=3) {
    const pulse=1+Math.sin(frameCount*0.2)*0.08;
    ctx.save(); ctx.translate(W/2,55); ctx.scale(pulse,pulse);
    ctx.font=`bold ${Math.min(W*0.045,28)}px Courier New`;
    ctx.fillStyle='#ffdd44'; ctx.textAlign='center';
    ctx.shadowColor='#ffdd44'; ctx.shadowBlur=15;
    ctx.fillText(`🔥 COMBO ×${combo}`,0,0);
    ctx.shadowBlur=0; ctx.restore(); ctx.textAlign='left';
  }
}

// ── Standard draw (4 or 8 lanes, flat hit line) ───────────────
function drawStandard() {
  const N = NUM_LANES;

  // Compute "next note per lane" for anticipation
  if (gameActive) {
    const cb = getCurrentBeat();
    nextPerLane = new Array(N).fill(null);
    noteQueue.forEach(n => {
      if (n.state!=='pending') return;
      const bu=n.beat-cb; if (bu<0) return;
      if (!nextPerLane[n.lane] || n.beat<nextPerLane[n.lane].beat) nextPerLane[n.lane]=n;
    });
  }

  // Lane backgrounds + dividers
  for (let i=0; i<N; i++) {
    const cfg=LANE_CFG[i];
    const lx=cfg.hitX-cfg.laneW/2;
    ctx.fillStyle=cfg.color+'09'; ctx.fillRect(lx,0,cfg.laneW,HIT_Y);
    if (i>0) { ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke(); }
  }

  // Hit line
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=2; ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(0,HIT_Y); ctx.lineTo(W,HIT_Y); ctx.stroke();
  ctx.setLineDash([]);

  // Falling notes
  if (gameActive) {
    const cb=getCurrentBeat();
    const FALL_DIST=HIT_Y+10;
    const noteH=Math.min(44,H*0.058);
    noteQueue.forEach(note => {
      if (note.state==='hit'||note.state==='missed') return;
      const bu=note.beat-cb;
      if (bu>FALL_BEATS+0.2||bu<-0.5) return;
      const cfg=LANE_CFG[note.lane];
      const noteW=cfg.laneW*0.72;
      const ny=cfg.hitY-(bu/FALL_BEATS)*FALL_DIST - noteH/2;
      const nx=cfg.hitX-noteW/2;
      const alpha=Math.min(1,(1-bu/FALL_BEATS)*3);
      const pulse=bu<2?((1-bu/2)*0.4):0;
      ctx.globalAlpha=Math.max(0.12,alpha);
      ctx.shadowColor=cfg.color; ctx.shadowBlur=14+pulse*20;
      ctx.fillStyle=cfg.color;
      ctx.beginPath(); ctx.roundRect?ctx.roundRect(nx,ny,noteW,noteH,8):ctx.rect(nx,ny,noteW,noteH); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.26)';
      ctx.beginPath(); ctx.roundRect?ctx.roundRect(nx+4,ny+4,noteW-8,noteH*0.38,4):ctx.rect(nx+4,ny+4,noteW-8,noteH*0.38); ctx.fill();
      ctx.globalAlpha=Math.max(0.4,alpha);
      ctx.font=`bold ${Math.min(cfg.laneW*0.2,18)}px Courier New`;
      ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.textAlign='center';
      ctx.fillText(cfg.key,cfg.hitX,ny+noteH*0.7);
      ctx.textAlign='left'; ctx.shadowBlur=0; ctx.globalAlpha=1;
    });
  }

  // Hit circles
  const cb2=gameActive?getCurrentBeat():0;
  for (let i=0; i<N; i++) {
    const cfg=LANE_CFG[i];
    const flash=hitFlash[i], isP=lanePressed[i];
    const r=Math.min(cfg.laneW*0.30,36);
    const next=nextPerLane[i];
    const ba=next?(next.beat-cb2):999;
    const anticip=ba<2&&ba>0?(1-ba/2):0;
    const pr=r+anticip*7;
    ctx.shadowColor=cfg.color; ctx.shadowBlur=10+flash*28+anticip*16;
    ctx.strokeStyle=cfg.color+(isP?'ff':(anticip>0.3?'ee':'88'));
    ctx.lineWidth=3+anticip*2;
    ctx.beginPath(); ctx.arc(cfg.hitX,cfg.hitY,pr,0,Math.PI*2); ctx.stroke();
    const fval=Math.floor((0.07+flash*0.36+anticip*0.20+(isP?0.26:0))*255).toString(16).padStart(2,'0');
    ctx.fillStyle=cfg.color+fval;
    ctx.beginPath(); ctx.arc(cfg.hitX,cfg.hitY,pr,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.font=`bold ${Math.min(cfg.laneW*0.22,22)}px Courier New`;
    ctx.fillStyle=`rgba(255,255,255,${0.5+flash*0.5+anticip*0.3})`;
    ctx.textAlign='center'; ctx.fillText(cfg.key,cfg.hitX,cfg.hitY+7); ctx.textAlign='left';
  }
}

// ── Expert draw (24 lanes, staggered keyboard) ────────────────
function drawExpert() {
  if (!gameActive) { drawExpertIdle(); return; }
  const cb=getCurrentBeat();
  const FALL_DIST=HIT_Y+10;
  const ROW_GAP=Math.min(H*0.095,76);

  // Compute next-per-lane
  nextPerLane=new Array(24).fill(null);
  noteQueue.forEach(n=>{
    if (n.state!=='pending') return;
    const bu=n.beat-cb; if(bu<0) return;
    if(!nextPerLane[n.lane]||n.beat<nextPerLane[n.lane].beat) nextPerLane[n.lane]=n;
  });

  // Draw keyboard zone backgrounds (3 rows × 2 hands)
  drawKeyboardFrame();

  // Falling notes — fall straight down toward hitX, hitY
  noteQueue.forEach(note=>{
    if (note.state==='hit'||note.state==='missed') return;
    const bu=note.beat-cb;
    if (bu>FALL_BEATS+0.2||bu<-0.5) return;
    const cfg=LANE_CFG[note.lane];
    const noteW=Math.min(cfg.laneW*0.68,42);
    const noteH=Math.min(H*0.05,38);
    // note falls from above toward its hitY, landing at hitX
    const ny=cfg.hitY-(bu/FALL_BEATS)*FALL_DIST - noteH/2;
    const nx=cfg.hitX-noteW/2;
    const alpha=Math.min(1,(1-bu/FALL_BEATS)*3);
    const pulse=bu<2?((1-bu/2)*0.35):0;
    ctx.globalAlpha=Math.max(0.1,alpha);
    ctx.shadowColor=cfg.color; ctx.shadowBlur=12+pulse*16;
    ctx.fillStyle=cfg.color;
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(nx,ny,noteW,noteH,6):ctx.rect(nx,ny,noteW,noteH); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(nx+3,ny+3,noteW-6,noteH*0.35,3):ctx.rect(nx+3,ny+3,noteW-6,noteH*0.35); ctx.fill();
    ctx.globalAlpha=Math.max(0.5,alpha);
    ctx.font=`bold ${Math.min(cfg.laneW*0.18,13)}px Courier New`;
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.textAlign='center';
    ctx.fillText(cfg.key,cfg.hitX,ny+noteH*0.72);
    ctx.textAlign='left'; ctx.shadowBlur=0; ctx.globalAlpha=1;
  });

  // Hit circles for expert
  for (let i=0; i<24; i++) {
    const cfg=LANE_CFG[i];
    const flash=hitFlash[i], isP=lanePressed[i];
    const r=Math.min(cfg.laneW*0.28,26);
    const next=nextPerLane[i];
    const ba=next?(next.beat-cb):999;
    const anticip=ba<2&&ba>0?(1-ba/2):0;
    const pr=r+anticip*5;
    ctx.shadowColor=cfg.color; ctx.shadowBlur=8+flash*22+anticip*12;
    ctx.strokeStyle=cfg.color+(isP?'ff':(anticip>0.3?'dd':'77'));
    ctx.lineWidth=2+anticip;
    ctx.beginPath(); ctx.arc(cfg.hitX,cfg.hitY,pr,0,Math.PI*2); ctx.stroke();
    const fval=Math.floor((0.06+flash*0.32+anticip*0.18+(isP?0.22:0))*255).toString(16).padStart(2,'0');
    ctx.fillStyle=cfg.color+fval;
    ctx.beginPath(); ctx.arc(cfg.hitX,cfg.hitY,pr,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.font=`bold ${Math.min(cfg.laneW*0.2,12)}px Courier New`;
    ctx.fillStyle=`rgba(255,255,255,${0.45+flash*0.5+anticip*0.3})`;
    ctx.textAlign='center'; ctx.fillText(cfg.key,cfg.hitX,cfg.hitY+5); ctx.textAlign='left';
  }
}

function drawExpertIdle() {
  drawKeyboardFrame();
  // Show idle hit circles
  for (let i=0; i<24; i++) {
    const cfg=LANE_CFG[i];
    const r=Math.min(cfg.laneW*0.28,26);
    ctx.strokeStyle=cfg.color+'55'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cfg.hitX,cfg.hitY,r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=cfg.color+'11';
    ctx.beginPath(); ctx.arc(cfg.hitX,cfg.hitY,r,0,Math.PI*2); ctx.fill();
    ctx.font=`bold ${Math.min(cfg.laneW*0.2,12)}px Courier New`;
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.textAlign='center';
    ctx.fillText(cfg.key,cfg.hitX,cfg.hitY+5); ctx.textAlign='left';
  }
}

function drawKeyboardFrame() {
  const ROW_GAP=Math.min(H*0.095,76);
  const STAGGER=Math.min(W*0.016,15);
  const HOME_Y=HIT_Y;

  // For each hand side, draw row connecting lines showing keyboard structure
  [[0,W*0.44,0],[W*0.56,W,12]].forEach(([sx,ex,laneOff])=>{
    // three row lines (dashed, very faint)
    [HOME_Y-ROW_GAP-STAGGER, HOME_Y, HOME_Y+ROW_GAP+STAGGER].forEach((ry,ri)=>{
      const rowCols = ['rgba(100,220,255,0.06)','rgba(180,80,255,0.06)','rgba(255,140,60,0.06)'];
      ctx.fillStyle=rowCols[ri];
      ctx.fillRect(sx, ry-ROW_GAP*0.5, ex-sx, ROW_GAP*0.9);
    });
  });

  // Gap label
  ctx.font=`${Math.min(W*0.014,13)}px Courier New`;
  ctx.fillStyle='rgba(150,100,200,0.4)'; ctx.textAlign='center';
  ctx.fillText('⌨', W/2, HOME_Y);
  ctx.textAlign='left';

  // Row labels (left side)
  const rowLabels=[['Q W E R','top row'],['A S D F','home row'],['Z X C V','bottom row']];
  rowLabels.forEach(([keys,label],ri)=>{
    const ry=[HOME_Y-ROW_GAP,HOME_Y,HOME_Y+ROW_GAP][ri];
    ctx.font=`${Math.min(W*0.01,10)}px Courier New`;
    ctx.fillStyle='rgba(150,100,200,0.35)'; ctx.textAlign='right';
    ctx.fillText(keys, W*0.43, ry-4);
    ctx.textAlign='left';
  });
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() { frameCount++; update(); draw(); requestAnimationFrame(gameLoop); }

// ============================================================
// INPUT
// ============================================================
const keys = {};
document.addEventListener('keydown', e => {
  if (keys[e.code]) return; keys[e.code]=true;
  const li=KEY_MAP[e.code];
  if (li!==undefined) { lanePressed[li]=true; tryHit(li); ensureAudio(); }
  if (e.code==='Space') e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code]=false;
  const li=KEY_MAP[e.code];
  if (li!==undefined) lanePressed[li]=false;
});

// Touch: map x,y position to nearest lane circle
const activeTouches=new Map();
function touchToLane(cx,cy) {
  let best=-1, bestDist=Infinity;
  LANE_CFG.forEach((cfg,i)=>{
    const d=Math.hypot(cx-cfg.hitX, cy-cfg.hitY);
    if (d<bestDist) { bestDist=d; best=i; }
  });
  return bestDist < (W/NUM_LANES)*1.5 ? best : -1;
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); ensureAudio();
  for (const t of e.changedTouches) {
    const lane=touchToLane(t.clientX,t.clientY);
    if (lane>=0) { activeTouches.set(t.identifier,lane); lanePressed[lane]=true; tryHit(lane); }
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  for (const t of e.changedTouches) {
    const lane=activeTouches.get(t.identifier);
    if (lane!==undefined) { lanePressed[lane]=false; activeTouches.delete(t.identifier); }
  }
},{passive:false});
canvas.addEventListener('mousedown',e=>{
  ensureAudio();
  const lane=touchToLane(e.clientX,e.clientY);
  if (lane>=0) { lanePressed[lane]=true; tryHit(lane); }
});
canvas.addEventListener('mouseup',e=>{
  const lane=touchToLane(e.clientX,e.clientY);
  if (lane>=0) lanePressed[lane]=false;
});

// ============================================================
// INIT
// ============================================================
resize();
selectMode(0);
gameLoop();
</script>
<script>
document.addEventListener('click',function initAudio(){
  document.removeEventListener('click',initAudio);
  ensureAudio();
},{once:true});
window.addEventListener('load',()=>{
  try { if (!audioCtx) audioCtx=new _AudioCtx(); document.getElementById('loading-track').style.display='block'; loadTrack(); } catch(e){}
  // Show loading hint for song 0
  setTimeout(() => { if (!trackLoaded) { const ldEl = document.getElementById('loading-track'); if(ldEl) ldEl.style.display='block'; }}, 500);
});
</script>
