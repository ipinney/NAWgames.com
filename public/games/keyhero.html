<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KeyHero</title>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08001a; overflow: hidden; touch-action: none; user-select: none; }
canvas#c { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

/* ---- MENU OVERLAY ---- */
#menu {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center; padding: 20px;
}
.m-icon { font-size: clamp(44px,9vw,80px); margin-bottom: 6px; animation: iconPop 1.5s ease-in-out infinite; }
@keyframes iconPop { 0%,100%{transform:scale(1) rotate(-3deg)} 50%{transform:scale(1.1) rotate(3deg)} }
.m-title { font-family:'Courier New',monospace; font-size:clamp(32px,8vw,68px); font-weight:bold; color:#cc44ff; text-shadow:0 0 30px #cc44ff, 0 0 60px #8800ff; letter-spacing:4px; animation:glow 2s ease-in-out infinite; margin-bottom:6px; }
.m-sub   { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,20px); color:#dd88ff; margin-bottom:20px; opacity:0.85; }
@keyframes glow { 0%,100%{text-shadow:0 0 30px #cc44ff,0 0 60px #8800ff} 50%{text-shadow:0 0 50px #dd66ff,0 0 100px #aa00ff,0 0 140px #cc44ff} }

/* Song card */
.song-card {
  background: linear-gradient(135deg, #1e0550 0%, #3a0070 100%);
  border: 2px solid #cc44ff44;
  border-radius: 16px; padding: 18px 36px; margin-bottom: 20px;
  box-shadow: 0 0 40px #cc44ff22;
}
.song-card-title { font-family:'Courier New',monospace; font-size:clamp(18px,4vw,30px); font-weight:bold; color:#ffffff; letter-spacing:2px; }
.song-card-artist { font-family:'Courier New',monospace; font-size:clamp(12px,2.5vw,18px); color:#dd88ff; margin-top:4px; opacity:0.85; }
.song-card-note { font-family:'Courier New',monospace; font-size:clamp(10px,1.8vw,13px); color:#886699; margin-top:6px; }

/* difficulty */
.sec-title { font-family:'Courier New',monospace; font-size:clamp(11px,2vw,15px); color:#aa88cc; margin-bottom:10px; letter-spacing:2px; opacity:0.9; }
.btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
.diff-btn { font-family:'Courier New',monospace; font-size:clamp(12px,2vw,16px); padding:10px 20px; border:2px solid #888; color:#aaa; border-radius:8px; cursor:pointer; background:transparent; transition:all 0.1s; }
.diff-btn.sel { border-color:#cc44ff; color:#cc44ff; background:#cc44ff22; box-shadow:0 0 15px #cc44ff66; }

/* Play button */
.play-btn {
  font-family:'Courier New',monospace; font-size:clamp(16px,3vw,22px); font-weight:bold;
  background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none;
  padding:14px 52px; border-radius:50px; cursor:pointer; letter-spacing:3px;
  box-shadow:0 0 30px #cc44ff88; transition:transform 0.1s, box-shadow 0.1s;
}
.play-btn:hover { transform:scale(1.05); box-shadow:0 0 50px #cc44ffcc; }
.play-btn:active { transform:scale(0.96); }

/* ---- RESULTS SCREEN ---- */
#results {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: rgba(0,0,0,0.92); display: none; flex-direction: column;
  align-items: center; justify-content: center; color: white; text-align: center; padding: 20px;
}
#res-title { font-family:'Courier New',monospace; font-size:clamp(28px,7vw,60px); font-weight:bold; margin-bottom:8px; }
#res-stars { font-size:clamp(32px,7vw,56px); margin-bottom:16px; }
#res-stats { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,18px); color:#dd88ff; line-height:2.2; margin-bottom:28px; }
#res-again { font-family:'Courier New',monospace; font-size:17px; background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none; padding:12px 36px; border-radius:40px; cursor:pointer; letter-spacing:2px; margin:4px; }
#res-menu  { font-family:'Courier New',monospace; font-size:16px; background:transparent; color:#aa88cc; border:2px solid #664499; padding:11px 30px; border-radius:40px; cursor:pointer; letter-spacing:2px; }

/* ---- HUD OVERLAY ---- */
#hud {
  position: fixed; top: 8px; left: 0; right: 0; z-index: 50; pointer-events: none;
  display: none; align-items: flex-start; justify-content: space-between; padding: 0 14px;
}
#hud-combo  { font-family:'Courier New',monospace; font-size:clamp(14px,3vw,22px); color:#ffdd44; text-shadow:0 0 10px #ffdd44; }
#hud-score  { font-family:'Courier New',monospace; font-size:clamp(14px,3vw,22px); color:#cc44ff; text-shadow:0 0 10px #cc44ff; }
#hud-song   { font-family:'Courier New',monospace; font-size:clamp(10px,2vw,14px); color:#aa88cc; text-align:center; }

/* HP bar */
#hp-wrap { position:fixed; bottom:0; left:0; right:0; height:4px; z-index:50; pointer-events:none; background:rgba(0,0,0,0.4); display:none; }
#hp-bar  { height:100%; background:linear-gradient(90deg,#cc44ff,#ff44aa); transition:width 0.3s; }

/* ---- Countdown ---- */
#countdown {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 110; display: none; pointer-events: none;
  font-family:'Courier New',monospace; font-size:clamp(60px,18vw,120px); font-weight:bold;
  color:#cc44ff; text-shadow:0 0 60px #cc44ff;
}

/* ---- Loading overlay ---- */
#loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center;
}
#loading-icon { font-size: 64px; animation: spin 1s linear infinite; }
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
#loading-text { font-family:'Courier New',monospace; font-size: 20px; color:#dd88ff; margin-top:16px; letter-spacing:3px; }
#loading-sub  { font-family:'Courier New',monospace; font-size: 14px; color:#886699; margin-top:8px; }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="menu">
  <div class="m-icon">🎵</div>
  <div class="m-title">KEY HERO</div>
  <div class="m-sub">Hit A S D F as the notes reach the circles!</div>

  <div class="song-card">
    <div class="song-card-title">🎤 Shake It Off</div>
    <div class="song-card-artist">Taylor Swift</div>
    <div class="song-card-note">Piano arrangement · 160 BPM</div>
  </div>

  <div class="sec-title">DIFFICULTY</div>
  <div class="btn-row" id="diff-btns">
    <button class="diff-btn sel" onclick="selectDiff(0)">😊 EASY</button>
    <button class="diff-btn" onclick="selectDiff(1)">😤 MEDIUM</button>
    <button class="diff-btn" onclick="selectDiff(2)">💀 HARD</button>
  </div>

  <button class="play-btn" onclick="startCountdown()">▶ PLAY</button>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-combo">COMBO: 0</div>
  <div id="hud-song"></div>
  <div id="hud-score">0</div>
</div>
<div id="hp-wrap"><div id="hp-bar" style="width:100%"></div></div>

<!-- Countdown -->
<div id="countdown"></div>

<!-- Loading -->
<div id="loading-overlay">
  <div id="loading-icon">🎵</div>
  <div id="loading-text">LOADING MUSIC</div>
  <div id="loading-sub">Tuning piano...</div>
</div>

<!-- Results -->
<div id="results">
  <div id="res-title">SONG CLEAR!</div>
  <div id="res-stars">⭐⭐⭐</div>
  <div id="res-stats"></div>
  <button id="res-again" onclick="replayGame()">▶ PLAY AGAIN</button>
  <button id="res-menu"  onclick="goMenu()">🏠 MENU</button>
</div>

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, HIT_Y;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  HIT_Y = H * 0.80;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const AudioCtx = window.AudioContext || window.webkitAudioContext;
// ============================================================
// AUDIO — Tone.js: Transport clock, synth drums, melody synth
// ============================================================
let audioCtx = null;

function ensureAudio() {
  Tone.start();
  if (!audioCtx) audioCtx = Tone.context.rawContext;
}

// Countdown beep
function playNote(hz, vol, dur) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = hz;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

// Missed note thud
function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.15);
  g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.2);
}

// Sparkle ping on perfect hit
function playPerfect() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [2200, 3300].forEach((freq, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t + i * 0.04);
    g.gain.linearRampToValueAtTime(0.06, t + i * 0.04 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.04 + 0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t + i * 0.04); o.stop(t + i * 0.04 + 0.15);
  });
}

// ── Synth instruments ─────────────────────────────────────────────────────
let kick = null, snare = null, hihat = null;
let melodySynth = null, hitSynth = null;
let drumsReady  = false;
let melodyNodes = [];   // kept for API compat (unused with Tone.Transport)

function freqToMidi(hz) {
  return Math.round(69 + 12 * Math.log2(hz / 440));
}
function freqToNote(hz) {
  return Tone.Frequency(freqToMidi(hz), 'midi').toNote();
}

function initSynths() {
  if (drumsReady) return;

  // Kick — deep, punchy thump
  kick = new Tone.MembraneSynth({
    pitchDecay : 0.05,
    octaves    : 10,
    envelope   : { attack: 0.001, decay: 0.30, sustain: 0, release: 1.0 }
  }).toDestination();
  kick.volume.value = -4;

  // Snare — crisp white-noise burst
  snare = new Tone.NoiseSynth({
    noise    : { type: 'white' },
    envelope : { attack: 0.001, decay: 0.13, sustain: 0, release: 0.1 }
  }).toDestination();
  snare.volume.value = -6;

  // Hi-hat — short metallic click
  hihat = new Tone.MetalSynth({
    frequency      : 400,
    envelope       : { attack: 0.001, decay: 0.035, release: 0.01 },
    harmonicity    : 5.1,
    modulationIndex: 32,
    resonance      : 4000,
    octaves        : 1.5
  }).toDestination();
  hihat.volume.value = -16;

  // Background melody guide (soft, so player's hits pop out)
  // Triangle wave sounds like a music-box / glockenspiel at these high freqs
  melodySynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope  : { attack: 0.02, decay: 0.15, sustain: 0.4, release: 0.5 }
  }).toDestination();
  melodySynth.volume.value = -14;   // quiet guide track

  // Hit synth — same timbre but loud. Correct hit = THIS IS the music
  hitSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope  : { attack: 0.005, decay: 0.1, sustain: 0.6, release: 0.4 }
  }).toDestination();
  hitSynth.volume.value = -2;       // foreground

  drumsReady = true;
}

// Correct-lane hit — the full note
function playHitNote(hz, isPerfect) {
  if (!hitSynth) return;
  hitSynth.volume.value = isPerfect ? -2 : -5;
  hitSynth.triggerAttackRelease(freqToNote(hz), 0.45, Tone.now());
}

// Guitar Hero wrong-key press — plays a slightly flat/dissonant version of
// that lane's home note. It clashes with the guide melody = clear "wrong" signal.
const LANE_HOME_HZ = [1174.66, 1567.98, 1760.0, 2093.0]; // D6 G6 A6 C7
function playWrongNote(lane) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const hz  = LANE_HOME_HZ[lane] * 0.97; // ~50 cents flat = dissonant
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = hz;
  g.gain.setValueAtTime(0.07, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now + 0.25);
}

// ── Schedule melody + drums using Tone.Transport (perfect sync) ─────────────
function scheduleMelody(song) {
  if (!audioCtx) return;
  initSynths();
  melodyNodes = [];

  const beatDur    = 60 / song.bpm;
  const totalBeats = Math.max(...song.notes.map(n => n[1])) + 8;

  Tone.Transport.bpm.value = song.bpm;
  Tone.Transport.cancel(0);   // wipe previous schedule

  // Melody: one note per beat (highest pitch = melodic lead line)
  const perBeat = {};
  song.notes.forEach(([lane, beat, hz]) => {
    if (!perBeat[beat] || hz > perBeat[beat]) perBeat[beat] = hz;
  });
  Object.entries(perBeat).forEach(([beatStr, hz]) => {
    const beat = parseFloat(beatStr);
    const note = freqToNote(hz);
    const dur  = Math.min(beatDur * 0.85, 0.45);
    Tone.Transport.schedule(time => {
      melodySynth.triggerAttackRelease(note, dur, time);
    }, beat * beatDur);
  });

  // Drums: kick on 1&3, snare on 2&4, hi-hat every 8th note
  for (let beat = 0; beat < totalBeats; beat += 0.5) {
    const b4    = beat % 4;
    const is8th = (beat % 1) !== 0;
    const t     = beat * beatDur;

    if (!is8th) {
      if (b4 === 0 || b4 === 2) {
        Tone.Transport.schedule(time => { kick.triggerAttackRelease('C1', '8n', time); }, t);
      }
      if (b4 === 1 || b4 === 3) {
        Tone.Transport.schedule(time => { snare.triggerAttackRelease('8n', time); }, t);
      }
    }
    const hhVel = is8th ? 0.4 : 0.7;
    Tone.Transport.schedule(time => { hihat.triggerAttackRelease('16n', time, hhVel); }, t);
  }

  // Start Transport — '+0.15' gives a tiny buffer just like old songStartTime
  Tone.Transport.start('+0.15');
}

function stopMelody() {
  Tone.Transport.stop();
  Tone.Transport.cancel(0);
  melodyNodes = [];
}
}

// GAME STATE

const LANE_COLORS    = ['#ff4488', '#ffaa00', '#44ff88', '#4488ff'];
const LANE_KEYS      = ['A', 'S', 'D', 'F'];
const LANE_KEY_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF'];

let selectedDiff  = 0;
let gameActive    = false, songStartTime = 0;
let score = 0, combo = 0, maxCombo = 0, hp = 100;
let perfects = 0, goods = 0, misses = 0;

let noteQueue = [], particles = [], hitFlash = [0,0,0,0], floatingTexts = [];
let frameCount = 0;

// Easy: very slow fall + half the notes. Medium: full chart. Hard: fast + all notes.
const FALL_BEATS_BY_DIFF  = [10.0, 5.0,  2.5];
const HIT_PERFECT_BEATS   = [0.40, 0.25, 0.12];
const HIT_GOOD_BEATS      = [0.65, 0.42, 0.22];
let FALL_BEATS, HIT_PERFECT, HIT_GOOD;

function getCurrentBeat() {
  if (!gameActive) return 0;
  return Tone.Transport.seconds * (SONG.bpm / 60);
}

// ============================================================
// MENU
// ============================================================
function selectDiff(d) {
  selectedDiff = d;
  document.querySelectorAll('.diff-btn').forEach((b, i) => b.classList.toggle('sel', i === d));
}

// ============================================================
// GAME START / END
// ============================================================
let countdownTimer = null;
function startCountdown() {
  ensureAudio();
  FALL_BEATS  = FALL_BEATS_BY_DIFF[selectedDiff];
  HIT_PERFECT = HIT_PERFECT_BEATS[selectedDiff];
  HIT_GOOD    = HIT_GOOD_BEATS[selectedDiff];
  document.getElementById('menu').style.display = 'none';

  // Synths are instant — no loading needed
  initSynths();

  const cdEl = document.getElementById('countdown');
  cdEl.style.display = 'block';
  let count = 3;
  cdEl.textContent = count;
  playNote(440, 0.15, 0.1);
  countdownTimer = setInterval(() => {
    count--;
    if (count > 0) {
      cdEl.textContent = count;
      playNote(440, 0.15, 0.1);
    } else {
      clearInterval(countdownTimer);
      cdEl.textContent = 'GO!';
      setTimeout(() => { cdEl.style.display = 'none'; startGame(); }, 400);
    }
  }, 1000);
}

function startGame() {
  ensureAudio();
  score = 0; combo = 0; maxCombo = 0; hp = 100;
  perfects = 0; goods = 0; misses = 0;
  frameCount = 0; particles = []; floatingTexts = []; hitFlash = [0,0,0,0];

  // Easy: every 4th note (sparse, learn the lanes), Medium: every 2nd note, Hard: all notes
  const src = selectedDiff === 0
    ? SONG.notes.filter((_, i) => i % 4 === 0)
    : selectedDiff === 1
    ? SONG.notes.filter((_, i) => i % 2 === 0)
    : SONG.notes;
  noteQueue = src.map(n => ({ lane: n[0], beat: n[1], hz: n[2], state: 'pending' }));

  songStartTime = audioCtx.currentTime + 0.15;
  gameActive    = true;

  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hp-wrap').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('hud-song').textContent = SONG.title + ' — ' + SONG.artist;

  scheduleMelody(SONG);

  // End song when music finishes
  const totalBeats = Math.max(...SONG.notes.map(n => n[1])) + 4;
  setTimeout(() => { if (gameActive) endGame(true); }, totalBeats * (60000 / SONG.bpm) + 2000);
}

function endGame(completed) {
  if (!gameActive) return;
  gameActive = false; stopMelody();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hp-wrap').style.display = 'none';
  const total    = perfects + goods + misses;
  const accuracy = total > 0 ? Math.round(((perfects + goods * 0.5) / total) * 100) : 0;
  const stars    = accuracy >= 95 ? '⭐⭐⭐' : accuracy >= 75 ? '⭐⭐' : accuracy >= 50 ? '⭐' : '💀';
  document.getElementById('res-title').textContent = completed ? (accuracy >= 95 ? '🎉 PERFECT!' : '🎵 SONG CLEAR!') : '💀 GAME OVER';
  document.getElementById('res-title').style.color = accuracy >= 75 ? '#cc44ff' : '#ff4444';
  document.getElementById('res-stars').textContent = stars;
  document.getElementById('res-stats').innerHTML =
    `${SONG.title}<br><br>` +
    `✨ Perfect: ${perfects}&nbsp;&nbsp;👍 Good: ${goods}&nbsp;&nbsp;❌ Miss: ${misses}<br><br>` +
    `🎯 Accuracy: ${accuracy}%<br>🔥 Max Combo: ×${maxCombo}<br>⭐ Score: ${score}`;
  document.getElementById('results').style.display = 'flex';
}

function replayGame() {
  document.getElementById('results').style.display = 'none';
  startCountdown();
}
function goMenu() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  gameActive = false; stopMelody();
  currentInstrument = null;
}

// ============================================================
// HIT DETECTION
// ============================================================
function tryHit(lane) {
  if (!gameActive) return;
  const cb = getCurrentBeat();
  let bestNote = null, bestDist = Infinity;
  noteQueue.forEach(n => {
    if (n.lane !== lane || n.state !== 'pending') return;
    const dist = Math.abs(n.beat - cb);
    if (dist < HIT_GOOD && dist < bestDist) { bestDist = dist; bestNote = n; }
  });
  if (bestNote) {
    const isPerfect = bestDist <= HIT_PERFECT;
    bestNote.state = 'hit';
    if (isPerfect) {
      perfects++; combo++; if (combo > maxCombo) maxCombo = combo;
      const mult = Math.min(4, 1 + Math.floor(combo / 5));
      score += 100 * mult;
      addFeedback(lane, '✨ PERFECT', '#cc44ff', 100 * mult);
      playHitNote(bestNote.hz, true);   // perfect: full volume
      playPerfect();                    // tiny sparkle ping on top (very quiet)
      spawnParticles(lane, LANE_COLORS[lane], 18);
    } else {
      goods++; combo++; if (combo > maxCombo) maxCombo = combo;
      const mult = Math.min(4, 1 + Math.floor(combo / 5));
      score += 50 * mult;
      addFeedback(lane, '👍 GOOD', '#44ff88', 50 * mult);
      playHitNote(bestNote.hz, false);  // good: slightly softer
      spawnParticles(lane, LANE_COLORS[lane], 8);
    }
    hitFlash[lane] = 1.0;
  } else {
    hitFlash[lane] = 0.4;
    playWrongNote(lane);  // Guitar Hero: press = wrong note sound
  }
}

function addFeedback(lane, text, color, pts) {
  const lx = (lane + 0.5) * (W / 4);
  floatingTexts.push({ x: lx, y: HIT_Y - 40, text, color, life: 55, vy: -1.2 });
  if (pts) floatingTexts.push({ x: lx, y: HIT_Y - 60, text: '+' + pts, color: '#ffdd44', life: 45, vy: -0.8 });
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(lane, color, count) {
  const lx = (lane + 0.5) * (W / 4);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1 + Math.random() * 5;
    const [r, g, b] = hexToRgb(color);
    particles.push({ x: lx, y: HIT_Y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 2, life: 25 + Math.random()*20, maxLife: 45, r, g, b });
  }
}
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (!gameActive) return;
  const cb = getCurrentBeat();

  noteQueue.forEach(n => {
    if (n.state === 'pending' && cb > n.beat + HIT_GOOD + 0.05) {
      n.state = 'missed';
      misses++; combo = 0;
      hp = Math.max(0, hp - 8);
      addFeedback(n.lane, '❌ MISS', '#ff4444', 0);
      playMiss();
      if (hp <= 0) endGame(false);
    }
  });
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
  particles     = particles.filter(p => p.life > 0);
  floatingTexts.forEach(f => { f.y += f.vy; f.life--; });
  floatingTexts = floatingTexts.filter(f => f.life > 0);
  hitFlash      = hitFlash.map(f => Math.max(0, f - 0.08));

  document.getElementById('hud-combo').textContent = combo >= 2 ? `🔥 ×${combo}` : `COMBO: ${combo}`;
  document.getElementById('hud-score').textContent = score.toLocaleString();
  document.getElementById('hp-bar').style.width    = hp + '%';
  document.getElementById('hp-bar').style.background =
    hp > 50 ? 'linear-gradient(90deg,#cc44ff,#ff44aa)' :
    hp > 25 ? 'linear-gradient(90deg,#ffcc00,#ff8800)' :
              'linear-gradient(90deg,#ff4444,#cc0000)';
}

// ============================================================
// RENDERING
// ============================================================
function draw() {
  ctx.fillStyle = '#08001a';
  ctx.fillRect(0, 0, W, H);

  // Floating bg music notes
  const bgChars = ['♩','♪','♫','♬'];
  ctx.globalAlpha = 0.06; ctx.font = '28px Arial';
  for (let i = 0; i < 12; i++) {
    const x = ((i * 137 + frameCount * 0.3) % W);
    const y = H - ((frameCount * 0.4 + i * 80) % H);
    ctx.fillStyle = LANE_COLORS[i % 4];
    ctx.fillText(bgChars[i % 4], x, y);
  }
  ctx.globalAlpha = 1;

  const laneW = W / 4;

  // Lane backgrounds
  for (let i = 0; i < 4; i++) {
    const lx  = i * laneW;
    const col = LANE_COLORS[i];
    ctx.fillStyle   = col + '08';
    ctx.fillRect(lx, 0, laneW, HIT_Y);
    ctx.strokeStyle = col + '18'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx + laneW/2, 0); ctx.lineTo(lx + laneW/2, HIT_Y); ctx.stroke();
    if (i > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
    }
  }

  // Hit zone line
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();
  ctx.setLineDash([]);

  // Falling notes
  if (gameActive) {
    const cb    = getCurrentBeat();
    const noteH = Math.min(40, H * 0.055);
    const noteW = laneW * 0.72;
    noteQueue.forEach(note => {
      if (note.state === 'hit' || note.state === 'missed') return;
      const bu = note.beat - cb;
      if (bu > FALL_BEATS + 0.2 || bu < -0.5) return;
      const progress = 1 - (bu / FALL_BEATS);
      const ny    = progress * HIT_Y - noteH / 2;
      const nx    = note.lane * laneW + (laneW - noteW) / 2;
      const col   = LANE_COLORS[note.lane];
      const alpha = Math.min(1, (1 - bu / FALL_BEATS) * 3);
      ctx.globalAlpha = Math.max(0.1, alpha);
      ctx.shadowColor = col; ctx.shadowBlur = 16;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(nx, ny, noteW, noteH, 8) : ctx.rect(nx, ny, noteW, noteH);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(nx + 4, ny + 4, noteW - 8, noteH * 0.4, 4) : ctx.rect(nx + 4, ny + 4, noteW - 8, noteH * 0.4);
      ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    });
  }

  // Hit zone circles
  for (let i = 0; i < 4; i++) {
    const cx    = (i + 0.5) * laneW;
    const col   = LANE_COLORS[i];
    const flash = hitFlash[i];
    const isP   = lanePressed[i];
    const r     = Math.min(laneW * 0.32, 38);
    ctx.shadowColor = col; ctx.shadowBlur = 10 + flash * 25;
    ctx.strokeStyle = col + (isP ? 'ff' : '88'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, HIT_Y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col + Math.floor((0.1 + flash * 0.35 + (isP ? 0.25 : 0)) * 255).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(cx, HIT_Y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = `bold ${Math.min(laneW * 0.22, 24)}px Courier New`;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + flash * 0.5) + ')';
    ctx.textAlign = 'center';
    ctx.fillText(LANE_KEYS[i], cx, HIT_Y + 7);
    ctx.textAlign = 'left';
  }

  // Particles
  particles.forEach(p => {
    const lr = p.life / p.maxLife;
    ctx.globalAlpha = lr;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x - 3, p.y - 3, 6 * lr, 6 * lr);
  });
  ctx.globalAlpha = 1;

  // Floating feedback texts
  floatingTexts.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life / 30);
    ctx.font = 'bold 16px Courier New'; ctx.fillStyle = f.color; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Combo burst center-top
  if (gameActive && combo >= 3) {
    const pulse = 1 + Math.sin(frameCount * 0.2) * 0.08;
    ctx.save(); ctx.translate(W/2, 60); ctx.scale(pulse, pulse);
    ctx.font = `bold ${Math.min(W * 0.05, 32)}px Courier New`;
    ctx.fillStyle = '#ffdd44'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 15;
    ctx.fillText(`🔥 COMBO ×${combo}`, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore(); ctx.textAlign = 'left';
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() {
  frameCount++;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT
// ============================================================
const lanePressed = [false, false, false, false];
const keys = {};
document.addEventListener('keydown', e => {
  if (keys[e.code]) return;
  keys[e.code] = true;
  const li = LANE_KEY_CODES.indexOf(e.code);
  if (li >= 0) { lanePressed[li] = true; tryHit(li); ensureAudio(); }
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  const li = LANE_KEY_CODES.indexOf(e.code);
  if (li >= 0) lanePressed[li] = false;
});

const activeTouches = new Map();
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); ensureAudio();
  for (const t of e.changedTouches) {
    const lane = Math.floor(t.clientX / (W / 4));
    if (lane >= 0 && lane < 4) { activeTouches.set(t.identifier, lane); lanePressed[lane] = true; tryHit(lane); }
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    const lane = activeTouches.get(t.identifier);
    if (lane !== undefined) { lanePressed[lane] = false; activeTouches.delete(t.identifier); }
  }
}, { passive: false });
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  const lane = Math.floor(e.clientX / (W / 4));
  if (lane >= 0 && lane < 4) { lanePressed[lane] = true; tryHit(lane); }
});
canvas.addEventListener('mouseup', e => {
  const lane = Math.floor(e.clientX / (W / 4));
  if (lane >= 0 && lane < 4) lanePressed[lane] = false;
});

// ============================================================
// INIT
// ============================================================
gameLoop();
</script>
</body>
