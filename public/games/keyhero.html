<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KeyHero</title>
<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08001a; overflow: hidden; touch-action: none; user-select: none; }
canvas#c { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

/* ---- MENU OVERLAY ---- */
#menu {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center; padding: 20px;
}
.m-icon { font-size: clamp(44px,9vw,80px); margin-bottom: 6px; animation: iconPop 1.5s ease-in-out infinite; }
@keyframes iconPop { 0%,100%{transform:scale(1) rotate(-3deg)} 50%{transform:scale(1.1) rotate(3deg)} }
.m-title { font-family:'Courier New',monospace; font-size:clamp(32px,8vw,68px); font-weight:bold; color:#cc44ff; text-shadow:0 0 30px #cc44ff, 0 0 60px #8800ff; letter-spacing:4px; animation:glow 2s ease-in-out infinite; margin-bottom:6px; }
.m-sub   { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,20px); color:#dd88ff; margin-bottom:20px; opacity:0.85; }
@keyframes glow { 0%,100%{text-shadow:0 0 30px #cc44ff,0 0 60px #8800ff} 50%{text-shadow:0 0 50px #dd66ff,0 0 100px #aa00ff,0 0 140px #cc44ff} }

/* Song card */
.song-card {
  background: linear-gradient(135deg, #1e0550 0%, #3a0070 100%);
  border: 2px solid #cc44ff44;
  border-radius: 16px; padding: 18px 36px; margin-bottom: 20px;
  box-shadow: 0 0 40px #cc44ff22;
}
.song-card-title { font-family:'Courier New',monospace; font-size:clamp(18px,4vw,30px); font-weight:bold; color:#ffffff; letter-spacing:2px; }
.song-card-artist { font-family:'Courier New',monospace; font-size:clamp(12px,2.5vw,18px); color:#dd88ff; margin-top:4px; opacity:0.85; }
.song-card-note { font-family:'Courier New',monospace; font-size:clamp(10px,1.8vw,13px); color:#886699; margin-top:6px; }

/* difficulty */
.sec-title { font-family:'Courier New',monospace; font-size:clamp(11px,2vw,15px); color:#aa88cc; margin-bottom:10px; letter-spacing:2px; opacity:0.9; }
.btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
.diff-btn { font-family:'Courier New',monospace; font-size:clamp(12px,2vw,16px); padding:10px 20px; border:2px solid #888; color:#aaa; border-radius:8px; cursor:pointer; background:transparent; transition:all 0.1s; }
.diff-btn.sel { border-color:#cc44ff; color:#cc44ff; background:#cc44ff22; box-shadow:0 0 15px #cc44ff66; }

/* Play button */
.play-btn {
  font-family:'Courier New',monospace; font-size:clamp(16px,3vw,22px); font-weight:bold;
  background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none;
  padding:14px 52px; border-radius:50px; cursor:pointer; letter-spacing:3px;
  box-shadow:0 0 30px #cc44ff88; transition:transform 0.1s, box-shadow 0.1s;
}
.play-btn:hover { transform:scale(1.05); box-shadow:0 0 50px #cc44ffcc; }
.play-btn:active { transform:scale(0.96); }

/* ---- RESULTS SCREEN ---- */
#results {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: rgba(0,0,0,0.92); display: none; flex-direction: column;
  align-items: center; justify-content: center; color: white; text-align: center; padding: 20px;
}
#res-title { font-family:'Courier New',monospace; font-size:clamp(28px,7vw,60px); font-weight:bold; margin-bottom:8px; }
#res-stars { font-size:clamp(32px,7vw,56px); margin-bottom:16px; }
#res-stats { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,18px); color:#dd88ff; line-height:2.2; margin-bottom:28px; }
#res-again { font-family:'Courier New',monospace; font-size:17px; background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none; padding:12px 36px; border-radius:40px; cursor:pointer; letter-spacing:2px; margin:4px; }
#res-menu  { font-family:'Courier New',monospace; font-size:16px; background:transparent; color:#aa88cc; border:2px solid #664499; padding:11px 30px; border-radius:40px; cursor:pointer; letter-spacing:2px; }

/* ---- HUD OVERLAY ---- */
#hud {
  position: fixed; top: 8px; left: 0; right: 0; z-index: 50; pointer-events: none;
  display: none; align-items: flex-start; justify-content: space-between; padding: 0 14px;
}
#hud-combo  { font-family:'Courier New',monospace; font-size:clamp(14px,3vw,22px); color:#ffdd44; text-shadow:0 0 10px #ffdd44; }
#hud-score  { font-family:'Courier New',monospace; font-size:clamp(14px,3vw,22px); color:#cc44ff; text-shadow:0 0 10px #cc44ff; }
#hud-song   { font-family:'Courier New',monospace; font-size:clamp(10px,2vw,14px); color:#aa88cc; text-align:center; }

/* HP bar */
#hp-wrap { position:fixed; bottom:0; left:0; right:0; height:4px; z-index:50; pointer-events:none; background:rgba(0,0,0,0.4); display:none; }
#hp-bar  { height:100%; background:linear-gradient(90deg,#cc44ff,#ff44aa); transition:width 0.3s; }

/* ---- Countdown ---- */
#countdown {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 110; display: none; pointer-events: none;
  font-family:'Courier New',monospace; font-size:clamp(60px,18vw,120px); font-weight:bold;
  color:#cc44ff; text-shadow:0 0 60px #cc44ff;
}

/* ---- Loading overlay ---- */
#loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center;
}
#loading-icon { font-size: 64px; animation: spin 1s linear infinite; }
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
#loading-text { font-family:'Courier New',monospace; font-size: 20px; color:#dd88ff; margin-top:16px; letter-spacing:3px; }
#loading-sub  { font-family:'Courier New',monospace; font-size: 14px; color:#886699; margin-top:8px; }

/* ---- REQUEST SONG BUTTON ---- */
.req-btn {
  font-family:'Courier New',monospace; font-size:clamp(11px,2vw,14px);
  background:transparent; color:#aa88cc; border:2px solid #664499;
  padding:10px 24px; border-radius:40px; cursor:pointer; letter-spacing:2px;
  margin-top:16px; transition:all 0.15s;
}
.req-btn:hover { border-color:#cc44ff; color:#cc44ff; box-shadow:0 0 15px #cc44ff44; }

/* ---- SONG REQUEST MODAL ---- */
#req-modal {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:300;
  background:rgba(0,0,0,0.88); display:none; flex-direction:column;
  align-items:center; justify-content:center; color:white; text-align:center; padding:20px;
}
#req-modal .modal-card {
  background:linear-gradient(135deg,#1e0550 0%,#3a0070 100%);
  border:2px solid #cc44ff44; border-radius:20px; padding:28px 32px;
  max-width:440px; width:90%; box-shadow:0 0 60px #cc44ff22;
}
#req-modal .modal-title {
  font-family:'Courier New',monospace; font-size:clamp(18px,4vw,26px);
  font-weight:bold; color:#cc44ff; margin-bottom:6px; letter-spacing:2px;
}
#req-modal .modal-sub {
  font-family:'Courier New',monospace; font-size:clamp(11px,2vw,14px);
  color:#aa88cc; margin-bottom:20px; opacity:0.85;
}
#req-modal input {
  width:100%; padding:12px 16px; font-family:'Courier New',monospace;
  font-size:15px; border:2px solid #664499; border-radius:10px;
  background:#0f0b1a; color:white; outline:none; margin-bottom:12px;
  transition:border-color 0.15s;
}
#req-modal input:focus { border-color:#cc44ff; box-shadow:0 0 12px #cc44ff44; }
#req-modal input::placeholder { color:#665588; }
#req-modal .modal-btns { display:flex; gap:10px; justify-content:center; margin-top:16px; }
#req-modal .submit-btn {
  font-family:'Courier New',monospace; font-size:14px; font-weight:bold;
  background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none;
  padding:11px 28px; border-radius:40px; cursor:pointer; letter-spacing:2px;
  transition:transform 0.1s, box-shadow 0.1s; box-shadow:0 0 20px #cc44ff66;
}
#req-modal .submit-btn:hover { transform:scale(1.05); box-shadow:0 0 35px #cc44ffaa; }
#req-modal .submit-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
#req-modal .cancel-btn {
  font-family:'Courier New',monospace; font-size:14px;
  background:transparent; color:#aa88cc; border:2px solid #664499;
  padding:10px 22px; border-radius:40px; cursor:pointer; letter-spacing:2px;
}
#req-modal .cancel-btn:hover { border-color:#cc44ff; color:#cc44ff; }
#req-modal .modal-status {
  font-family:'Courier New',monospace; font-size:12px;
  margin-top:12px; min-height:18px; letter-spacing:1px;
}
.signin-prompt {
  font-family:'Courier New',monospace; font-size:clamp(11px,2vw,13px);
  color:#886699; margin-top:8px;
}
.signin-link {
  color:#cc44ff; cursor:pointer; text-decoration:underline;
}
.signin-link:hover { color:#ff44aa; }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="menu">
  <div class="m-icon">🎵</div>
  <div class="m-title">KEY HERO</div>
  <div class="m-sub">Hit A S D F as the notes reach the circles!</div>

  <div class="song-card">
    <div class="song-card-title">🎤 Shake It Off</div>
    <div class="song-card-artist">Taylor Swift</div>
    <div class="song-card-note">Piano arrangement · 160 BPM</div>
  </div>

  <div class="sec-title">DIFFICULTY</div>
  <div class="btn-row" id="diff-btns">
    <button class="diff-btn" onclick="selectDiff(0)">😊 EASY</button>
    <button class="diff-btn sel" onclick="selectDiff(1)">😤 MEDIUM</button>
    <button class="diff-btn" onclick="selectDiff(2)">💀 HARD</button>
  </div>

  <button class="play-btn" onclick="startCountdown()">▶ PLAY</button>
  <button class="req-btn" onclick="openSongRequest()">🎶 REQUEST A SONG</button>
</div>

<!-- SONG REQUEST MODAL -->
<div id="req-modal">
  <div class="modal-card">
    <div class="modal-title">🎶 REQUEST A SONG</div>
    <div class="modal-sub">Tell us what you want to play next!</div>
    <div id="req-auth-wall" style="display:none">
      <div class="signin-prompt">Sign in with Google to submit a request</div>
      <button class="submit-btn" style="margin-top:14px" onclick="signInGoogle()">🔑 SIGN IN</button>
      <div style="height:10px"></div>
    </div>
    <div id="req-form" style="display:none">
      <input type="text" id="req-song" placeholder="Song name (e.g. Flowers)" maxlength="120" />
      <input type="text" id="req-artist" placeholder="Artist (e.g. Miley Cyrus)" maxlength="120" />
      <input type="text" id="req-notes" placeholder="Any notes? (optional)" maxlength="250" />
      <div id="req-user-info" style="font-family:'Courier New',monospace;font-size:11px;color:#886699;margin-bottom:4px;"></div>
    </div>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeSongRequest()">CANCEL</button>
      <button class="submit-btn" id="req-submit-btn" onclick="submitSongRequest()" style="display:none">🚀 SUBMIT</button>
    </div>
    <div class="modal-status" id="req-status"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-combo">COMBO: 0</div>
  <div id="hud-song"></div>
  <div id="hud-score">0</div>
</div>
<div id="hp-wrap"><div id="hp-bar" style="width:100%"></div></div>

<!-- Countdown -->
<div id="countdown"></div>

<!-- Loading -->
<div id="loading-overlay">
  <div id="loading-icon">🎵</div>
  <div id="loading-text">LOADING MUSIC</div>
  <div id="loading-sub">Tuning piano...</div>
</div>

<!-- Results -->
<div id="results">
  <div id="res-title">SONG CLEAR!</div>
  <div id="res-stars">⭐⭐⭐</div>
  <div id="res-stats"></div>
  <button id="res-again" onclick="replayGame()">▶ PLAY AGAIN</button>
  <button id="res-menu"  onclick="goMenu()">🏠 MENU</button>
</div>

<canvas id="c"></canvas>
<script>
// ============================================================
// FIREBASE + SONG REQUEST SYSTEM
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDf1s-6iPaJ5GmZgTgPnwLJsvwAj_7tYmA",
  authDomain: "chorizomejor-app.firebaseapp.com",
  projectId: "chorizomejor-app",
  storageBucket: "chorizomejor-app.firebasestorage.app",
  messagingSenderId: "616108968942",
  appId: "1:616108968942:web:927666cffd3c0a15851cff"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
let currentUser = null;

auth.onAuthStateChanged(user => {
  currentUser = user;
  updateReqModalAuth();
});

function signInGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    console.warn('Sign-in failed:', err);
    document.getElementById('req-status').textContent = 'Sign-in failed. Try again.';
    document.getElementById('req-status').style.color = '#ff4444';
  });
}

function updateReqModalAuth() {
  const authWall  = document.getElementById('req-auth-wall');
  const form      = document.getElementById('req-form');
  const submitBtn = document.getElementById('req-submit-btn');
  const userInfo  = document.getElementById('req-user-info');
  if (currentUser) {
    authWall.style.display  = 'none';
    form.style.display      = 'block';
    submitBtn.style.display = 'inline-block';
    userInfo.textContent    = 'Signed in as ' + (currentUser.displayName || currentUser.email);
  } else {
    authWall.style.display  = 'block';
    form.style.display      = 'none';
    submitBtn.style.display = 'none';
    userInfo.textContent    = '';
  }
}

function openSongRequest() {
  document.getElementById('req-modal').style.display = 'flex';
  document.getElementById('req-status').textContent = '';
  document.getElementById('req-song').value  = '';
  document.getElementById('req-artist').value = '';
  document.getElementById('req-notes').value  = '';
  document.getElementById('req-submit-btn').disabled = false;
  updateReqModalAuth();
}

function closeSongRequest() {
  document.getElementById('req-modal').style.display = 'none';
}

async function submitSongRequest() {
  const songName = document.getElementById('req-song').value.trim();
  const artist   = document.getElementById('req-artist').value.trim();
  const notes    = document.getElementById('req-notes').value.trim();
  const status   = document.getElementById('req-status');
  const btn      = document.getElementById('req-submit-btn');

  if (!songName) {
    status.textContent = 'Please enter a song name!';
    status.style.color = '#ff8844';
    return;
  }
  if (!currentUser) {
    status.textContent = 'Please sign in first!';
    status.style.color = '#ff4444';
    return;
  }

  btn.disabled = true;
  status.textContent = 'Submitting...';
  status.style.color = '#dd88ff';

  try {
    await db.collection('keyhero_song_requests').add({
      songName:       songName,
      artist:         artist || 'Unknown',
      notes:          notes,
      requesterName:  currentUser.displayName || 'Anonymous',
      requesterEmail: currentUser.email || '',
      requesterUid:   currentUser.uid,
      status:         'pending',
      createdAt:      firebase.firestore.FieldValue.serverTimestamp()
    });
    status.textContent = '✅ Song requested! We\'ll add it soon!';
    status.style.color = '#44ff88';
    document.getElementById('req-song').value  = '';
    document.getElementById('req-artist').value = '';
    document.getElementById('req-notes').value  = '';
    setTimeout(() => closeSongRequest(), 2200);
  } catch (err) {
    console.error('Submit error:', err);
    status.textContent = '❌ Error submitting. Try again.';
    status.style.color = '#ff4444';
    btn.disabled = false;
  }
}

// ============================================================
// SONG — Shake It Off (Taylor Swift)
// Key: G major · 160 BPM
// Notes: [lane 0-3, beat (float), freq_hz]
// Lane 0 = lowest pitch (pink), Lane 3 = highest (blue)
// Melody spans ~40 beats = ~15 seconds. Loops back.
// ============================================================
// Frequency reference (G major scale):
//   D4=293.66  E4=329.63  F#4=369.99  G4=392
//   A4=440     B4=493.88  C5=523.25   D5=587.33
//   E5=659.25

const SONG = {
  title: 'Shake It Off',
  artist: 'Taylor Swift',
  bpm: 160,
  notes: [
    // ── INTRO HOOK – rising arpeggio (beats 0-7) ────────────────
    [0, 0,   293.66], [1, 0.5, 329.63],
    [2, 1,   392.00], [3, 1.5, 440.00],
    [3, 2,   493.88], [2, 2.5, 440.00],
    [1, 3,   392.00], [0, 3.5, 329.63],

    [0, 4,   293.66], [1, 4.5, 369.99],
    [2, 5,   392.00], [3, 5.5, 493.88],
    [3, 6,   587.33], [2, 6.5, 493.88],
    [1, 7,   440.00],

    // ── VERSE 1 – "I stay out too late…" (beats 8-15) ───────────
    [1, 8,   329.63], [1, 8.5, 369.99],
    [2, 9,   392.00],
    [2, 10,  440.00], [1, 10.5,392.00],
    [1, 11,  369.99], [0, 11.5,329.63],

    [0, 12,  293.66], [1, 12.5,329.63],
    [2, 13,  392.00], [2, 13.5,440.00],
    [3, 14,  493.88], [2, 14.5,440.00],
    [1, 15,  392.00],

    // ── VERSE 2 – "Got nothing in my brain…" (beats 16-23) ──────
    [1, 16,  329.63], [1, 16.5,369.99],
    [2, 17,  392.00], [3, 17.5,440.00],
    [2, 18,  440.00], [1, 18.5,392.00],
    [0, 19,  329.63],

    [0, 20,  293.66], [1, 20.5,329.63],
    [2, 21,  392.00], [2, 21.5,440.00],
    [3, 22,  493.88], [2, 22.5,440.00],
    [1, 23,  392.00],

    // ── PRE-CHORUS – climbing energy (beats 24-31) ──────────────
    [2, 24,  440.00], [3, 24.5,493.88],
    [3, 25,  523.25], [3, 25.5,587.33],
    [3, 26,  659.25], [2, 27,  587.33],
    [1, 27.5,523.25], [0, 28,  493.88],

    [1, 28.5,440.00], [2, 29,  493.88],
    [3, 29.5,523.25], [3, 30,  587.33],
    [2, 30.5,523.25], [1, 31,  440.00],
    [0, 31.5,392.00],

    // ── CHORUS – "I shake it off, I shake it off" (beats 32-39) ─
    [1, 32,  329.63], [2, 32.5,392.00],
    [2, 33,  440.00], [3, 33.5,493.88],
    [3, 34,  523.25], [2, 34.5,493.88],
    [1, 35,  440.00],

    [0, 35.5,392.00], [1, 36,  329.63],
    [2, 36.5,392.00], [2, 37,  440.00],
    [3, 37.5,493.88], [3, 38,  523.25],
    [2, 38.5,493.88], [1, 39,  440.00],
    [0, 39.5,392.00],

    // ── CHORUS PEAK – "Shake it off!" high notes (beats 40-47) ─
    [2, 40,  493.88], [3, 40.5,523.25],
    [3, 41,  587.33], [3, 41.5,659.25],
    [3, 42,  659.25], [2, 42.5,587.33],
    [1, 43,  523.25], [0, 43.5,493.88],

    [1, 44,  440.00], [2, 44.5,493.88],
    [3, 45,  523.25], [3, 45.5,587.33],
    [3, 46,  659.25], [2, 46.5,587.33],
    [1, 47,  523.25], [0, 47.5,440.00],

    // ── OUTRO – resolving back down (beats 48-51) ────────────────
    [2, 48,  440.00], [1, 48.5,392.00],
    [1, 49,  369.99], [0, 49.5,329.63],
    [0, 50,  293.66], [1, 51,  392.00],
  ]
};

// ============================================================
// CANVAS + AUDIO
// ============================================================
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, HIT_Y;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  HIT_Y = H * 0.80;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playNote(hz, vol, dur) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = hz;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.15);
  g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.2);
}
function playPerfect() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [1.0, 1.25].forEach((mult, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880 * mult;
    g.gain.setValueAtTime(0, t + i * 0.05); g.gain.linearRampToValueAtTime(0.12, t + i * 0.05 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.2);
    o.connect(g); g.connect(audioCtx.destination); o.start(t + i * 0.05); o.stop(t + i * 0.05 + 0.25);
  });
}

// ============================================================
// SOUNDFONT INSTRUMENT
// ============================================================
let currentInstrument = null;
let melodyNodes       = [];

function freqToMidi(hz) {
  return Math.round(69 + 12 * Math.log2(hz / 440));
}

async function loadInstrument() {
  ensureAudio();
  document.getElementById('loading-overlay').style.display = 'flex';
  document.getElementById('loading-sub').textContent = 'Loading piano samples...';
  try {
    currentInstrument = await Soundfont.instrument(audioCtx, 'electric_piano_1', {
      soundfont: 'FluidR3_GM',
      gain: 4.0
    });
  } catch(e) {
    console.warn('Soundfont failed, using oscillator fallback', e);
    currentInstrument = null;
  }
  document.getElementById('loading-overlay').style.display = 'none';
}

function scheduleMelody(song) {
  melodyNodes = [];
  if (!audioCtx) return;
  const beatDur    = 60 / song.bpm;
  const totalBeats = Math.max(...song.notes.map(n => n[1])) + 8;

  // ── MELODY: every note pre-scheduled via soundfont ───────────────────
  song.notes.forEach(([lane, beat, hz]) => {
    const t      = songStartTime + beat * beatDur;
    if (t <= audioCtx.currentTime) return;
    const dur    = Math.min(beatDur * 0.9, 0.55);
    const midi   = freqToMidi(hz);

    if (currentInstrument) {
      const node = currentInstrument.play(midi, t, { duration: dur, gain: 4.0 });
      if (node) melodyNodes.push(node);
    } else {
      // Fallback oscillator if CDN failed
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = hz;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.40, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
      melodyNodes.push(o);
    }
  });

  // ── RHYTHM: kick on 1 & 3, snare on 2 & 4 ──────────────────────────
  for (let beat = 0; beat < totalBeats; beat++) {
    const t = songStartTime + beat * beatDur;
    if (t <= audioCtx.currentTime) continue;
    const b4 = beat % 4;

    if (b4 === 0 || b4 === 2) {
      // Kick drum
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
      g.gain.setValueAtTime(0.30, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.16);
      melodyNodes.push(o);
    }
    if (b4 === 1 || b4 === 3) {
      // Snare: noise burst
      const bufLen = Math.floor(audioCtx.sampleRate * 0.1);
      const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(bufLen*0.2));
      const ns = audioCtx.createBufferSource(), ng = audioCtx.createGain();
      ns.buffer = buf;
      ng.gain.setValueAtTime(0.20, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      ns.connect(ng); ng.connect(audioCtx.destination);
      ns.start(t);
      melodyNodes.push(ns);
      // Snare body tone
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(280, t);
      o.frequency.exponentialRampToValueAtTime(120, t + 0.06);
      g.gain.setValueAtTime(0.10, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.08);
      melodyNodes.push(o);
    }
  }
}

function stopMelody() {
  const now = audioCtx ? audioCtx.currentTime : 0;
  melodyNodes.forEach(n => { try { n.stop(now + 0.04); } catch(e) {} });
  melodyNodes = [];
}

// ============================================================
// GAME STATE
// ============================================================
const LANE_COLORS    = ['#ff4488', '#ffaa00', '#44ff88', '#4488ff'];
const LANE_KEYS      = ['A', 'S', 'D', 'F'];
const LANE_KEY_CODES = ['KeyA', 'KeyS', 'KeyD', 'KeyF'];

let selectedDiff  = 1;
let gameActive    = false, songStartTime = 0;
let score = 0, combo = 0, maxCombo = 0, hp = 100;
let perfects = 0, goods = 0, misses = 0;

let noteQueue = [], particles = [], hitFlash = [0,0,0,0], floatingTexts = [];
let frameCount = 0;

// Easy: very slow fall + half the notes. Medium: comfortable. Hard: fast.
const FALL_BEATS_BY_DIFF  = [9.0,  4.5,  2.0];
const HIT_PERFECT_BEATS   = [0.22, 0.14, 0.10];
const HIT_GOOD_BEATS      = [0.38, 0.24, 0.16];
let FALL_BEATS, HIT_PERFECT, HIT_GOOD;

function getCurrentBeat() {
  if (!audioCtx || !gameActive) return 0;
  return (audioCtx.currentTime - songStartTime) * (SONG.bpm / 60);
}

// ============================================================
// MENU
// ============================================================
function selectDiff(d) {
  selectedDiff = d;
  document.querySelectorAll('.diff-btn').forEach((b, i) => b.classList.toggle('sel', i === d));
}

// ============================================================
// GAME START / END
// ============================================================
let countdownTimer = null;
async function startCountdown() {
  ensureAudio();
  FALL_BEATS  = FALL_BEATS_BY_DIFF[selectedDiff];
  HIT_PERFECT = HIT_PERFECT_BEATS[selectedDiff];
  HIT_GOOD    = HIT_GOOD_BEATS[selectedDiff];
  document.getElementById('menu').style.display = 'none';

  // Load electric piano samples (shows loading overlay)
  await loadInstrument();

  const cdEl = document.getElementById('countdown');
  cdEl.style.display = 'block';
  let count = 3;
  cdEl.textContent = count;
  playNote(440, 0.15, 0.1);
  countdownTimer = setInterval(() => {
    count--;
    if (count > 0) {
      cdEl.textContent = count;
      playNote(440, 0.15, 0.1);
    } else {
      clearInterval(countdownTimer);
      cdEl.textContent = 'GO!';
      setTimeout(() => { cdEl.style.display = 'none'; startGame(); }, 400);
    }
  }, 1000);
}

function startGame() {
  ensureAudio();
  score = 0; combo = 0; maxCombo = 0; hp = 100;
  perfects = 0; goods = 0; misses = 0;
  frameCount = 0; particles = []; floatingTexts = []; hitFlash = [0,0,0,0];

  // Easy: every other note to reduce density
  const src = selectedDiff === 0
    ? SONG.notes.filter((_, i) => i % 2 === 0)
    : SONG.notes;
  noteQueue = src.map(n => ({ lane: n[0], beat: n[1], hz: n[2], state: 'pending' }));

  songStartTime = audioCtx.currentTime + 0.15;
  gameActive    = true;

  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hp-wrap').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('hud-song').textContent = SONG.title + ' — ' + SONG.artist;

  scheduleMelody(SONG);

  // End song when music finishes
  const totalBeats = Math.max(...SONG.notes.map(n => n[1])) + 4;
  setTimeout(() => { if (gameActive) endGame(true); }, totalBeats * (60000 / SONG.bpm) + 2000);
}

function endGame(completed) {
  if (!gameActive) return;
  gameActive = false; stopMelody();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hp-wrap').style.display = 'none';
  const total    = perfects + goods + misses;
  const accuracy = total > 0 ? Math.round(((perfects + goods * 0.5) / total) * 100) : 0;
  const stars    = accuracy >= 95 ? '⭐⭐⭐' : accuracy >= 75 ? '⭐⭐' : accuracy >= 50 ? '⭐' : '💀';
  document.getElementById('res-title').textContent = completed ? (accuracy >= 95 ? '🎉 PERFECT!' : '🎵 SONG CLEAR!') : '💀 GAME OVER';
  document.getElementById('res-title').style.color = accuracy >= 75 ? '#cc44ff' : '#ff4444';
  document.getElementById('res-stars').textContent = stars;
  document.getElementById('res-stats').innerHTML =
    `${SONG.title}<br><br>` +
    `✨ Perfect: ${perfects}&nbsp;&nbsp;👍 Good: ${goods}&nbsp;&nbsp;❌ Miss: ${misses}<br><br>` +
    `🎯 Accuracy: ${accuracy}%<br>🔥 Max Combo: ×${maxCombo}<br>⭐ Score: ${score}`;
  document.getElementById('results').style.display = 'flex';
}

function replayGame() {
  document.getElementById('results').style.display = 'none';
  startCountdown();
}
function goMenu() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  gameActive = false; stopMelody();
  currentInstrument = null;
}

// ============================================================
// HIT DETECTION
// ============================================================
function tryHit(lane) {
  if (!gameActive) return;
  const cb = getCurrentBeat();
  let bestNote = null, bestDist = Infinity;
  noteQueue.forEach(n => {
    if (n.lane !== lane || n.state !== 'pending') return;
    const dist = Math.abs(n.beat - cb);
    if (dist < HIT_GOOD && dist < bestDist) { bestDist = dist; bestNote = n; }
  });
  if (bestNote) {
    const isPerfect = bestDist <= HIT_PERFECT;
    bestNote.state = 'hit';
    if (isPerfect) {
      perfects++; combo++; if (combo > maxCombo) maxCombo = combo;
      const mult = Math.min(4, 1 + Math.floor(combo / 5));
      score += 100 * mult;
      addFeedback(lane, '✨ PERFECT', '#cc44ff', 100 * mult);
      playPerfect();
      spawnParticles(lane, LANE_COLORS[lane], 18);
    } else {
      goods++; combo++; if (combo > maxCombo) maxCombo = combo;
      const mult = Math.min(4, 1 + Math.floor(combo / 5));
      score += 50 * mult;
      addFeedback(lane, '👍 GOOD', '#44ff88', 50 * mult);
      playNote(bestNote.hz, 0.2, 0.3);
      spawnParticles(lane, LANE_COLORS[lane], 8);
    }
    hitFlash[lane] = 1.0;
    playNote(bestNote.hz, 0.25, 0.35);
  } else {
    hitFlash[lane] = 0.4;
    playNote(220, 0.06, 0.08);
  }
}

function addFeedback(lane, text, color, pts) {
  const lx = (lane + 0.5) * (W / 4);
  floatingTexts.push({ x: lx, y: HIT_Y - 40, text, color, life: 55, vy: -1.2 });
  if (pts) floatingTexts.push({ x: lx, y: HIT_Y - 60, text: '+' + pts, color: '#ffdd44', life: 45, vy: -0.8 });
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(lane, color, count) {
  const lx = (lane + 0.5) * (W / 4);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1 + Math.random() * 5;
    const [r, g, b] = hexToRgb(color);
    particles.push({ x: lx, y: HIT_Y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 2, life: 25 + Math.random()*20, maxLife: 45, r, g, b });
  }
}
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (!gameActive) return;
  const cb = getCurrentBeat();

  noteQueue.forEach(n => {
    if (n.state === 'pending' && cb > n.beat + HIT_GOOD + 0.05) {
      n.state = 'missed';
      misses++; combo = 0;
      hp = Math.max(0, hp - 8);
      addFeedback(n.lane, '❌ MISS', '#ff4444', 0);
      playMiss();
      if (hp <= 0) endGame(false);
    }
  });
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
  particles     = particles.filter(p => p.life > 0);
  floatingTexts.forEach(f => { f.y += f.vy; f.life--; });
  floatingTexts = floatingTexts.filter(f => f.life > 0);
  hitFlash      = hitFlash.map(f => Math.max(0, f - 0.08));

  document.getElementById('hud-combo').textContent = combo >= 2 ? `🔥 ×${combo}` : `COMBO: ${combo}`;
  document.getElementById('hud-score').textContent = score.toLocaleString();
  document.getElementById('hp-bar').style.width    = hp + '%';
  document.getElementById('hp-bar').style.background =
    hp > 50 ? 'linear-gradient(90deg,#cc44ff,#ff44aa)' :
    hp > 25 ? 'linear-gradient(90deg,#ffcc00,#ff8800)' :
              'linear-gradient(90deg,#ff4444,#cc0000)';
}

// ============================================================
// RENDERING
// ============================================================
function draw() {
  ctx.fillStyle = '#08001a';
  ctx.fillRect(0, 0, W, H);

  // Floating bg music notes
  const bgChars = ['♩','♪','♫','♬'];
  ctx.globalAlpha = 0.06; ctx.font = '28px Arial';
  for (let i = 0; i < 12; i++) {
    const x = ((i * 137 + frameCount * 0.3) % W);
    const y = H - ((frameCount * 0.4 + i * 80) % H);
    ctx.fillStyle = LANE_COLORS[i % 4];
    ctx.fillText(bgChars[i % 4], x, y);
  }
  ctx.globalAlpha = 1;

  const laneW = W / 4;

  // Lane backgrounds
  for (let i = 0; i < 4; i++) {
    const lx  = i * laneW;
    const col = LANE_COLORS[i];
    ctx.fillStyle   = col + '08';
    ctx.fillRect(lx, 0, laneW, HIT_Y);
    ctx.strokeStyle = col + '18'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx + laneW/2, 0); ctx.lineTo(lx + laneW/2, HIT_Y); ctx.stroke();
    if (i > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
    }
  }

  // Hit zone line
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();
  ctx.setLineDash([]);

  // Falling notes
  if (gameActive) {
    const cb    = getCurrentBeat();
    const noteH = Math.min(40, H * 0.055);
    const noteW = laneW * 0.72;
    noteQueue.forEach(note => {
      if (note.state === 'hit' || note.state === 'missed') return;
      const bu = note.beat - cb;
      if (bu > FALL_BEATS + 0.2 || bu < -0.5) return;
      const progress = 1 - (bu / FALL_BEATS);
      const ny    = progress * HIT_Y - noteH / 2;
      const nx    = note.lane * laneW + (laneW - noteW) / 2;
      const col   = LANE_COLORS[note.lane];
      const alpha = Math.min(1, (1 - bu / FALL_BEATS) * 3);
      ctx.globalAlpha = Math.max(0.1, alpha);
      ctx.shadowColor = col; ctx.shadowBlur = 16;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(nx, ny, noteW, noteH, 8) : ctx.rect(nx, ny, noteW, noteH);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(nx + 4, ny + 4, noteW - 8, noteH * 0.4, 4) : ctx.rect(nx + 4, ny + 4, noteW - 8, noteH * 0.4);
      ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    });
  }

  // Hit zone circles
  for (let i = 0; i < 4; i++) {
    const cx    = (i + 0.5) * laneW;
    const col   = LANE_COLORS[i];
    const flash = hitFlash[i];
    const isP   = lanePressed[i];
    const r     = Math.min(laneW * 0.32, 38);
    ctx.shadowColor = col; ctx.shadowBlur = 10 + flash * 25;
    ctx.strokeStyle = col + (isP ? 'ff' : '88'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, HIT_Y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col + Math.floor((0.1 + flash * 0.35 + (isP ? 0.25 : 0)) * 255).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(cx, HIT_Y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = `bold ${Math.min(laneW * 0.22, 24)}px Courier New`;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + flash * 0.5) + ')';
    ctx.textAlign = 'center';
    ctx.fillText(LANE_KEYS[i], cx, HIT_Y + 7);
    ctx.textAlign = 'left';
  }

  // Particles
  particles.forEach(p => {
    const lr = p.life / p.maxLife;
    ctx.globalAlpha = lr;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x - 3, p.y - 3, 6 * lr, 6 * lr);
  });
  ctx.globalAlpha = 1;

  // Floating feedback texts
  floatingTexts.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life / 30);
    ctx.font = 'bold 16px Courier New'; ctx.fillStyle = f.color; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Combo burst center-top
  if (gameActive && combo >= 3) {
    const pulse = 1 + Math.sin(frameCount * 0.2) * 0.08;
    ctx.save(); ctx.translate(W/2, 60); ctx.scale(pulse, pulse);
    ctx.font = `bold ${Math.min(W * 0.05, 32)}px Courier New`;
    ctx.fillStyle = '#ffdd44'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 15;
    ctx.fillText(`🔥 COMBO ×${combo}`, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore(); ctx.textAlign = 'left';
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() {
  frameCount++;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT
// ============================================================
const lanePressed = [false, false, false, false];
const keys = {};
document.addEventListener('keydown', e => {
  // Don't capture keys when typing in input fields (song request modal)
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (keys[e.code]) return;
  keys[e.code] = true;
  const li = LANE_KEY_CODES.indexOf(e.code);
  if (li >= 0) { lanePressed[li] = true; tryHit(li); ensureAudio(); }
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  keys[e.code] = false;
  const li = LANE_KEY_CODES.indexOf(e.code);
  if (li >= 0) lanePressed[li] = false;
});

const activeTouches = new Map();
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); ensureAudio();
  for (const t of e.changedTouches) {
    const lane = Math.floor(t.clientX / (W / 4));
    if (lane >= 0 && lane < 4) { activeTouches.set(t.identifier, lane); lanePressed[lane] = true; tryHit(lane); }
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    const lane = activeTouches.get(t.identifier);
    if (lane !== undefined) { lanePressed[lane] = false; activeTouches.delete(t.identifier); }
  }
}, { passive: false });
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  const lane = Math.floor(e.clientX / (W / 4));
  if (lane >= 0 && lane < 4) { lanePressed[lane] = true; tryHit(lane); }
});
canvas.addEventListener('mouseup', e => {
  const lane = Math.floor(e.clientX / (W / 4));
  if (lane >= 0 && lane < 4) lanePressed[lane] = false;
});

// ============================================================
// INIT
// ============================================================
gameLoop();
</script>
</body>
</html>
