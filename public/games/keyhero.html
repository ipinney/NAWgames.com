<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KeyHero</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08001a; overflow: hidden; touch-action: none; user-select: none; }
canvas#c { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

/* ---- MENU OVERLAY ---- */
#menu {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center; padding: 20px;
}
.m-icon { font-size: clamp(44px,9vw,80px); margin-bottom: 6px; animation: iconPop 1.5s ease-in-out infinite; }
@keyframes iconPop { 0%,100%{transform:scale(1) rotate(-3deg)} 50%{transform:scale(1.1) rotate(3deg)} }
.m-title { font-family:'Courier New',monospace; font-size:clamp(32px,8vw,68px); font-weight:bold; color:#cc44ff; text-shadow:0 0 30px #cc44ff, 0 0 60px #8800ff; letter-spacing:4px; animation:glow 2s ease-in-out infinite; margin-bottom:6px; }
.m-sub   { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,20px); color:#dd88ff; margin-bottom:20px; opacity:0.85; }
@keyframes glow { 0%,100%{text-shadow:0 0 30px #cc44ff,0 0 60px #8800ff} 50%{text-shadow:0 0 50px #dd66ff,0 0 100px #aa00ff,0 0 140px #cc44ff} }

/* Song card */
.song-card {
  background: linear-gradient(135deg, #1e0550 0%, #3a0070 100%);
  border: 2px solid #cc44ff44;
  border-radius: 16px; padding: 18px 36px; margin-bottom: 20px;
  box-shadow: 0 0 40px #cc44ff22;
}
.song-card-title { font-family:'Courier New',monospace; font-size:clamp(18px,4vw,30px); font-weight:bold; color:#ffffff; letter-spacing:2px; }
.song-card-artist { font-family:'Courier New',monospace; font-size:clamp(12px,2.5vw,18px); color:#dd88ff; margin-top:4px; opacity:0.85; }
.song-card-note { font-family:'Courier New',monospace; font-size:clamp(10px,1.8vw,13px); color:#886699; margin-top:6px; }

/* difficulty */
.sec-title { font-family:'Courier New',monospace; font-size:clamp(11px,2vw,15px); color:#aa88cc; margin-bottom:10px; letter-spacing:2px; opacity:0.9; }
.btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
.diff-btn { font-family:'Courier New',monospace; font-size:clamp(12px,2vw,16px); padding:10px 20px; border:2px solid #888; color:#aaa; border-radius:8px; cursor:pointer; background:transparent; transition:all 0.1s; }
.diff-btn.sel { border-color:#cc44ff; color:#cc44ff; background:#cc44ff22; box-shadow:0 0 15px #cc44ff66; }
.hand-btn { font-family:'Courier New',monospace; font-size:clamp(13px,2.2vw,18px); padding:12px 28px; border:2px solid #555; color:#888; border-radius:10px; cursor:pointer; background:transparent; transition:all 0.15s; min-width:clamp(120px,25vw,180px); }
.hand-btn.sel-left  { border-color:#44aaff; color:#44aaff; background:#44aaff22; box-shadow:0 0 18px #44aaff66; }
.hand-btn.sel-right { border-color:#ff8844; color:#ff8844; background:#ff884422; box-shadow:0 0 18px #ff884466; }
.hand-keys { font-size:clamp(10px,1.6vw,13px); opacity:0.65; margin-top:3px; letter-spacing:1px; }

/* Play button */
.play-btn {
  font-family:'Courier New',monospace; font-size:clamp(16px,3vw,22px); font-weight:bold;
  background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none;
  padding:14px 52px; border-radius:50px; cursor:pointer; letter-spacing:3px;
  box-shadow:0 0 30px #cc44ff88; transition:transform 0.1s, box-shadow 0.1s;
}
.play-btn:hover { transform:scale(1.05); box-shadow:0 0 50px #cc44ffcc; }
.play-btn:active { transform:scale(0.96); }

/* ---- RESULTS SCREEN ---- */
#results {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: rgba(0,0,0,0.92); display: none; flex-direction: column;
  align-items: center; justify-content: center; color: white; text-align: center; padding: 20px;
}
#res-title { font-family:'Courier New',monospace; font-size:clamp(28px,7vw,60px); font-weight:bold; margin-bottom:8px; }
#res-stars { font-size:clamp(32px,7vw,56px); margin-bottom:16px; }
#res-stats { font-family:'Courier New',monospace; font-size:clamp(13px,2.5vw,18px); color:#dd88ff; line-height:2.2; margin-bottom:28px; }
#res-again { font-family:'Courier New',monospace; font-size:17px; background:linear-gradient(135deg,#8800ff,#ff0088); color:white; border:none; padding:12px 36px; border-radius:40px; cursor:pointer; letter-spacing:2px; margin:4px; }
#res-menu  { font-family:'Courier New',monospace; font-size:16px; background:transparent; color:#aa88cc; border:2px solid #664499; padding:11px 30px; border-radius:40px; cursor:pointer; letter-spacing:2px; }

/* ---- HUD OVERLAY ---- */
#hud {
  position: fixed; top: 8px; left: 0; right: 0; z-index: 50; pointer-events: none;
  display: none; align-items: flex-start; justify-content: space-between; padding: 0 14px;
}
#hud-combo  { font-family:'Courier New',monospace; font-size:clamp(14px,3vw,22px); color:#ffdd44; text-shadow:0 0 10px #ffdd44; }
#hud-score  { font-family:'Courier New',monospace; font-size:clamp(14px,3vw,22px); color:#cc44ff; text-shadow:0 0 10px #cc44ff; }
#hud-song   { font-family:'Courier New',monospace; font-size:clamp(10px,2vw,14px); color:#aa88cc; text-align:center; }

/* HP bar */
#hp-wrap { position:fixed; bottom:0; left:0; right:0; height:4px; z-index:50; pointer-events:none; background:rgba(0,0,0,0.4); display:none; }
#hp-bar  { height:100%; background:linear-gradient(90deg,#cc44ff,#ff44aa); transition:width 0.3s; }

/* ---- Countdown ---- */
#countdown {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 110; display: none; pointer-events: none;
  font-family:'Courier New',monospace; font-size:clamp(60px,18vw,120px); font-weight:bold;
  color:#cc44ff; text-shadow:0 0 60px #cc44ff;
}

/* ---- Loading overlay ---- */
#loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
  background: radial-gradient(ellipse at 50% 30%, #12003a 0%, #050010 80%);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center;
}
#loading-icon { font-size: 64px; animation: spin 1s linear infinite; }
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
#loading-text { font-family:'Courier New',monospace; font-size: 20px; color:#dd88ff; margin-top:16px; letter-spacing:3px; }
#loading-sub  { font-family:'Courier New',monospace; font-size: 14px; color:#886699; margin-top:8px; }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="menu">
  <div class="m-icon">🎵</div>
  <div class="m-title">KEY HERO</div>
  <div class="m-sub" id="m-sub-hint">Hit  A  S  D  F  as the notes reach the circles!</div>

  <div class="song-card">
    <div class="song-card-title">🎤 Shake It Off</div>
    <div class="song-card-artist">Taylor Swift · 160 BPM</div>
  </div>

  <div class="sec-title">CHOOSE YOUR HAND</div>
  <div class="btn-row" id="hand-btns">
    <button class="hand-btn sel-left" id="hand-left" onclick="selectHand(0)">
      ✋ LEFT HAND
      <div class="hand-keys">A &nbsp; S &nbsp; D &nbsp; F</div>
    </button>
    <button class="hand-btn" id="hand-right" onclick="selectHand(1)">
      🤚 RIGHT HAND
      <div class="hand-keys">J &nbsp; K &nbsp; L &nbsp; ;</div>
    </button>
  </div>

  <div class="sec-title">DIFFICULTY</div>
  <div class="btn-row" id="diff-btns">
    <button class="diff-btn sel" onclick="selectDiff(0)">😊 EASY</button>
    <button class="diff-btn" onclick="selectDiff(1)">😤 MEDIUM</button>
    <button class="diff-btn" onclick="selectDiff(2)">💀 HARD</button>
  </div>

  <button class="play-btn" id="play-btn" onclick="startCountdown()">▶ PLAY</button>
  <div id="loading-track" style="color:#aaa;font-size:13px;margin-top:8px;display:none">🎵 Loading audio…</div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-combo">COMBO: 0</div>
  <div id="hud-song"></div>
  <div id="hud-score">0</div>
</div>
<div id="hp-wrap"><div id="hp-bar" style="width:100%"></div></div>

<!-- Countdown -->
<div id="countdown"></div>

<!-- Loading -->
<div id="loading-overlay">
  <div id="loading-icon">🎵</div>
  <div id="loading-text">LOADING MUSIC</div>
  <div id="loading-sub">Tuning piano...</div>
</div>

<!-- Results -->
<div id="results">
  <div id="res-title">SONG CLEAR!</div>
  <div id="res-stars">⭐⭐⭐</div>
  <div id="res-stats"></div>
  <button id="res-again" onclick="replayGame()">▶ PLAY AGAIN</button>
  <button id="res-menu"  onclick="goMenu()">🏠 MENU</button>
</div>

const canvas = document.getElementById('c');

let W, H, HIT_Y;

const AudioCtx = window.AudioContext || window.webkitAudioContext;
// ============================================================
// AUDIO — OGG backing track + Web Audio API hit sounds
// ──────────────────────────────────────────────────────────────────────────
// Architecture:
//   • Pre-rendered OGG (FluidSynth + FluidR3_GM) = melody + drums + bass
//   • AudioBufferSourceNode plays the OGG — audioCtx.currentTime IS the clock
//   • Hit sounds: synthVoice (correct note) or square buzz (wrong key)
//   • No scheduling storm: zero lookahead nodes, just one AudioBufferSource
// ──────────────────────────────────────────────────────────────────────────
const _AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx     = null;
let trackBuffer  = null;   // decoded OGG AudioBuffer
let trackSource  = null;   // currently playing AudioBufferSourceNode
let trackLoading = false;
let trackLoaded  = false;

// Decode the OGG once on page load (or first user gesture)
function loadTrack() {
  if (trackLoading || trackLoaded) return;
  trackLoading = true;
  fetch('/games/shake-it-off.ogg')
    .then(r => r.arrayBuffer())
    .then(ab => {
      if (!audioCtx) audioCtx = new _AudioCtx();
      return audioCtx.decodeAudioData(ab);
    })
    .then(buf => {
      trackBuffer  = buf;
      trackLoaded  = true;
      trackLoading = false;
      // Hide loading indicator if shown
      const ldEl = document.getElementById('loading-track');
      if (ldEl) ldEl.style.display = 'none';
    })
    .catch(e => { console.error('Track load failed', e); trackLoading = false; });
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new _AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  loadTrack();  // kick off fetch if not started
}

// Countdown / UI beep
function playNote(hz, vol, dur) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = hz;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.05);
}

// Missed note thud
function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.15);
  g.gain.setValueAtTime(0.10, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.2);
}

// Perfect-hit sparkle
function playPerfect() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [2200, 3300].forEach((freq, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t + i*0.04); g.gain.linearRampToValueAtTime(0.06, t + i*0.04 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.04 + 0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t + i*0.04); o.stop(t + i*0.04 + 0.15);
  });
}

// ── Synth voice for HIT feedback only ─────────────────────────────────────
// Correct hit = bright sawtooth chord at the note's exact frequency.
// This IS the melody note — the OGG guide track plays softly beneath.
function synthVoice(hz, t, dur, gain, cutoff) {
  if (!audioCtx) return;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = cutoff || 3000; filt.Q.value = 1.4;
  const mg = audioCtx.createGain();
  mg.gain.setValueAtTime(0,          t);
  mg.gain.linearRampToValueAtTime(gain,       t + 0.003);
  mg.gain.exponentialRampToValueAtTime(gain*0.6, t + 0.08);
  mg.gain.setValueAtTime(gain*0.6,   t + Math.max(dur - 0.08, 0.01));
  mg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  filt.connect(mg); mg.connect(audioCtx.destination);
  [1.0, 1.004].forEach(det => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz * det; g.gain.value = 0.5;
    o.connect(g); g.connect(filt);
    o.start(t); o.stop(t + dur + 0.05);
  });
}

// Correct-lane hit → full-volume synth voice at that note's frequency
function playHitNote(hz, isPerfect) {
  if (!audioCtx) return;
  synthVoice(hz, audioCtx.currentTime, 0.5, isPerfect ? 0.60 : 0.40, 4200);
}

// Wrong-lane press → detuned square buzz (clearly wrong)
const LANE_HOME_HZ = [1174.66, 1567.98, 1760.0, 2093.0];
function playWrongNote(lane) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = LANE_HOME_HZ[lane] * 0.97;
  g.gain.setValueAtTime(0.07, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.25);
}

// ── Backing track playback ─────────────────────────────────────────────────
// scheduleMelody() now plays the OGG from the exact offset so it is
// perfectly locked to songStartTime = audioCtx.currentTime + 0.5
function scheduleMelody(song) {
  if (!audioCtx || !trackBuffer) return;
  if (trackSource) { try { trackSource.stop(); } catch(e){} }
  trackSource = audioCtx.createBufferSource();
  trackSource.buffer = trackBuffer;
  // Lower the guide track volume so hit sounds stand out on top
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.55;
  trackSource.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  // songStartTime is set in startGame() just before this call.
  // Start the source at songStartTime (scheduled, not immediate).
  const delay = songStartTime - audioCtx.currentTime;
  trackSource.start(songStartTime, 0);  // offset=0: play from beginning
}

function stopMelody() {
  if (trackSource) {
    try { trackSource.stop(); } catch(e) {}
    trackSource = null;
  }
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
  trackLoaded  = false;
  trackBuffer  = null;
  trackLoading = false;
}

// Easy: very slow fall + half the notes. Medium: full chart. Hard: fast + all notes.
// Easy: very wide windows (forgiving), Medium: normal, Hard: tight
// At 160 BPM: 1 beat = 0.375s. Easy perfect=0.55 beats ≈ 0.21s each side.
const FALL_BEATS_BY_DIFF  = [10.0, 5.5,  2.5];
const HIT_PERFECT_BEATS   = [0.55, 0.28, 0.12];
const HIT_GOOD_BEATS      = [0.85, 0.48, 0.22];
let FALL_BEATS, HIT_PERFECT, HIT_GOOD;

function getCurrentBeat() {
  if (!audioCtx || !gameActive) return 0;

let countdownTimer = null;
function startCountdown() {
  ensureAudio();
  FALL_BEATS  = FALL_BEATS_BY_DIFF[selectedDiff];
  HIT_PERFECT = HIT_PERFECT_BEATS[selectedDiff];
  HIT_GOOD    = HIT_GOOD_BEATS[selectedDiff];
  document.getElementById('menu').style.display = 'none';


  const cdEl = document.getElementById('countdown');
  cdEl.style.display = 'block';
  let count = 3;
  cdEl.textContent = count;

    count--;
    if (count > 0) {
      cdEl.textContent = count;
      playNote(440, 0.15, 0.1);
    } else {
      clearInterval(countdownTimer);
      cdEl.textContent = 'GO!';
      setTimeout(() => { cdEl.style.display = 'none'; startGame(); }, 400);
    }
  }, 1000);
}

function startGame() {
  ensureAudio();

  // If track not loaded yet, show loading state and wait
  if (!trackLoaded) {
    const ldEl = document.getElementById('loading-track');
    if (ldEl) { ldEl.textContent = '🎵 Loading audio…'; ldEl.style.display = 'block'; }
    document.getElementById('menu').style.display = 'flex';
    // Retry once loaded
    const waitId = setInterval(() => {
      if (trackLoaded) {
        clearInterval(waitId);
        if (ldEl) ldEl.style.display = 'none';
        document.getElementById('menu').style.display = 'none';
        startGame();
      }
    }, 200);
    return;
  }

  score = 0; combo = 0; maxCombo = 0; hp = 100;
  perfects = 0; goods = 0; misses = 0;
  frameCount = 0; particles = []; floatingTexts = []; hitFlash = [0,0,0,0];

  // ── Chart selection (phrase-aware, research-backed) ────────────────────────
  // Easy:   1 note per 4-beat measure — the FIRST note of each phrase.
  //         72 hits @ 0.63 notes/sec.  Lane spread: A 22% / S 21% / D 35% / F 22%.
  //         The phrase-opener is the melodic anchor — you hear it start each section.
  // Medium: 1 note per 2 beats — variety-aware (avoids same lane twice in a row),
  //         prefers integer-beat position. 130 hits @ 1.1 notes/sec.
  //         Near-perfect 28/27/23/22% lane spread.
  // Hard:   Full chart (all 428 notes).

  function firstInWindow(windowBeats) {
    const wins = {};
    SONG.notes.forEach(n => {
      const key = Math.floor(n[1] / windowBeats);
      if (!(key in wins) || n[1] < wins[key][1]) wins[key] = n;
    });
    return Object.values(wins).sort((a, b) => a[1] - b[1]);
  }

  function varietyChart(windowBeats) {
    const wins = {};
    SONG.notes.forEach(n => {
      const key = Math.floor(n[1] / windowBeats);
      if (!wins[key]) wins[key] = [];
      wins[key].push(n);
    });
    const result = [];
    let prevLane = -1;
    Object.keys(wins).map(Number).sort((a,b)=>a-b).forEach(key => {
      const cands = wins[key];
      const diff  = cands.filter(n => n[0] !== prevLane);
      const pool  = diff.length ? diff : cands;
      // prefer integer-beat onset within pool (most grounded rhythmically)
      const strong = pool.filter(n => Math.abs(n[1] - Math.round(n[1])) < 0.01);
      const best   = (strong.length ? strong : pool).reduce((a,b) => b[1] < a[1] ? b : a);
      result.push(best);
      prevLane = best[0];
    });
    return result;
  }

  const src = selectedDiff === 0 ? firstInWindow(4.0)
            : selectedDiff === 1 ? varietyChart(2.0)
            : SONG.notes;
  noteQueue = src.map(n => ({ lane: n[0], beat: n[1], hz: n[2], state: 'pending' }));

  songStartTime = audioCtx.currentTime + 0.5;  // 500ms lead-in
  gameActive    = true;

  document.getElementById('hud').style.display = 'flex';
  document.getElementById('hp-wrap').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  const handLabel = selectedHand === 0 ? '✋ A S D F' : '🤚 J K L ;';
  document.getElementById('hud-song').textContent = SONG.title + '  ' + handLabel;

  scheduleMelody(SONG);

  // End song when music finishes
  const totalBeats = Math.max(...SONG.notes.map(n => n[1])) + 4;
  setTimeout(() => { if (gameActive) endGame(true); }, totalBeats * (60000 / SONG.bpm) + 2000);
}

function endGame(completed) {
  if (!gameActive) return;
  gameActive = false; stopMelody();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hp-wrap').style.display = 'none';
  const total    = perfects + goods + misses;
  const accuracy = total > 0 ? Math.round(((perfects + goods * 0.5) / total) * 100) : 0;
  const stars    = accuracy >= 95 ? '⭐⭐⭐' : accuracy >= 75 ? '⭐⭐' : accuracy >= 50 ? '⭐' : '💀';
  document.getElementById('res-title').textContent = completed ? (accuracy >= 95 ? '🎉 PERFECT!' : '🎵 SONG CLEAR!') : '💀 GAME OVER';
  document.getElementById('res-title').style.color = accuracy >= 75 ? '#cc44ff' : '#ff4444';
  document.getElementById('res-stars').textContent = stars;

    `${SONG.title}<br><br>` +
    `✨ Perfect: ${perfects}&nbsp;&nbsp;👍 Good: ${goods}&nbsp;&nbsp;❌ Miss: ${misses}<br><br>` +
    `🎯 Accuracy: ${accuracy}%<br>🔥 Max Combo: ×${maxCombo}<br>⭐ Score: ${score}`;
  document.getElementById('results').style.display = 'flex';
}

// ============================================================
// HIT DETECTION
// ============================================================
function tryHit(lane) {
  if (!gameActive) return;
  const cb = getCurrentBeat();
  let bestNote = null, bestDist = Infinity;
  noteQueue.forEach(n => {
    if (n.lane !== lane || n.state !== 'pending') return;
    const dist = Math.abs(n.beat - cb);
    if (dist < HIT_GOOD && dist < bestDist) { bestDist = dist; bestNote = n; }
  });
  if (bestNote) {
    const isPerfect = bestDist <= HIT_PERFECT;
    bestNote.state = 'hit';
    if (isPerfect) {
      perfects++; combo++; if (combo > maxCombo) maxCombo = combo;
      const mult = Math.min(4, 1 + Math.floor(combo / 5));
      score += 100 * mult;
      addFeedback(lane, '✨ PERFECT', '#cc44ff', 100 * mult);
      playHitNote(bestNote.hz, true);   // perfect: full volume
      playPerfect();                    // tiny sparkle ping on top (very quiet)
      spawnParticles(lane, LANE_COLORS[lane], 18);
    } else {
      goods++; combo++; if (combo > maxCombo) maxCombo = combo;
      const mult = Math.min(4, 1 + Math.floor(combo / 5));
      score += 50 * mult;
      addFeedback(lane, '👍 GOOD', '#44ff88', 50 * mult);
      playHitNote(bestNote.hz, false);  // good: slightly softer
      spawnParticles(lane, LANE_COLORS[lane], 8);
    }
    hitFlash[lane] = 1.0;
  } else {
    hitFlash[lane] = 0.4;
    playWrongNote(lane);  // Guitar Hero: press = wrong note sound
  }
}

function addFeedback(lane, text, color, pts) {
  const lx = (lane + 0.5) * (W / 4);
  floatingTexts.push({ x: lx, y: HIT_Y - 40, text, color, life: 55, vy: -1.2 });
  if (pts) floatingTexts.push({ x: lx, y: HIT_Y - 60, text: '+' + pts, color: '#ffdd44', life: 45, vy: -0.8 });
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(lane, color, count) {
  const lx = (lane + 0.5) * (W / 4);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1 + Math.random() * 5;
    const [r, g, b] = hexToRgb(color);
    particles.push({ x: lx, y: HIT_Y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 2, life: 25 + Math.random()*20, maxLife: 45, r, g, b });
  }
}
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (!gameActive) return;
  const cb = getCurrentBeat();

  noteQueue.forEach(n => {
    if (n.state === 'pending' && cb > n.beat + HIT_GOOD + 0.05) {
      n.state = 'missed';
      misses++; combo = 0;
      hp = Math.max(0, hp - 8);
      addFeedback(n.lane, '❌ MISS', '#ff4444', 0);
      playMiss();
      if (hp <= 0) endGame(false);
    }
  });
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
  particles     = particles.filter(p => p.life > 0);
  floatingTexts.forEach(f => { f.y += f.vy; f.life--; });
  floatingTexts = floatingTexts.filter(f => f.life > 0);
  hitFlash      = hitFlash.map(f => Math.max(0, f - 0.08));

  document.getElementById('hud-combo').textContent = combo >= 2 ? `🔥 ×${combo}` : `COMBO: ${combo}`;
  document.getElementById('hud-score').textContent = score.toLocaleString();
  document.getElementById('hp-bar').style.width    = hp + '%';
  document.getElementById('hp-bar').style.background =
    hp > 50 ? 'linear-gradient(90deg,#cc44ff,#ff44aa)' :
    hp > 25 ? 'linear-gradient(90deg,#ffcc00,#ff8800)' :
              'linear-gradient(90deg,#ff4444,#cc0000)';
}

// ============================================================
// RENDERING
// ============================================================
function draw() {
  ctx.fillStyle = '#08001a';
  ctx.fillRect(0, 0, W, H);

  // Floating bg music notes
  const bgChars = ['♩','♪','♫','♬'];
  ctx.globalAlpha = 0.06; ctx.font = '28px Arial';
  for (let i = 0; i < 12; i++) {
    const x = ((i * 137 + frameCount * 0.3) % W);
    const y = H - ((frameCount * 0.4 + i * 80) % H);
    ctx.fillStyle = LANE_COLORS[i % 4];
    ctx.fillText(bgChars[i % 4], x, y);
  }
  ctx.globalAlpha = 1;

  const laneW = W / 4;

  // Lane backgrounds
  for (let i = 0; i < 4; i++) {
    const lx  = i * laneW;
    const col = LANE_COLORS[i];
    ctx.fillStyle   = col + '08';
    ctx.fillRect(lx, 0, laneW, HIT_Y);
    ctx.strokeStyle = col + '18'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx + laneW/2, 0); ctx.lineTo(lx + laneW/2, HIT_Y); ctx.stroke();
    if (i > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
    }
  }

  // Hit zone line
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();
  ctx.setLineDash([]);

  // Falling notes
  if (gameActive) {
    const cb    = getCurrentBeat();
    const noteH = Math.min(44, H * 0.058);
    const noteW = laneW * 0.72;

    // "Anticipation glow" — find the next pending note per lane, pulse hit circle
    const nextPerLane = [null, null, null, null];
    noteQueue.forEach(note => {
      if (note.state !== 'pending') return;
      const bu = note.beat - cb;
      if (bu < 0) return;
      const l = note.lane;
      if (!nextPerLane[l] || note.beat < nextPerLane[l].beat) nextPerLane[l] = note;
    });
    // Store for hit-zone draw below
    window._nextPerLane = nextPerLane;

    noteQueue.forEach(note => {
      if (note.state === 'hit' || note.state === 'missed') return;
      const bu = note.beat - cb;
      if (bu > FALL_BEATS + 0.2 || bu < -0.5) return;
      const progress = 1 - (bu / FALL_BEATS);
      const ny    = progress * HIT_Y - noteH / 2;
      const nx    = note.lane * laneW + (laneW - noteW) / 2;
      const col   = LANE_COLORS[note.lane];
      const alpha = Math.min(1, (1 - bu / FALL_BEATS) * 3);
      // Pulse note when within 2 beats of the hit line
      const closePulse = bu < 2.0 ? (1 - bu / 2.0) * 0.4 : 0;
      ctx.globalAlpha = Math.max(0.12, alpha);
      ctx.shadowColor = col; ctx.shadowBlur = 16 + closePulse * 20;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(nx, ny, noteW, noteH, 8) : ctx.rect(nx, ny, noteW, noteH);
      ctx.fill();
      // Shine stripe
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(nx + 4, ny + 4, noteW - 8, noteH * 0.38, 4) : ctx.rect(nx + 4, ny + 4, noteW - 8, noteH * 0.38);
      ctx.fill();
      // Lane key label on the note
      ctx.globalAlpha = Math.max(0.4, alpha);
      ctx.font = `bold ${Math.min(laneW * 0.18, 18)}px Courier New`;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.textAlign = 'center';
      ctx.fillText(LANE_KEYS[note.lane], nx + noteW / 2, ny + noteH * 0.68);
      ctx.textAlign = 'left';
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    });
  }

  // Hit zone circles — with anticipation pulse when note is close
  for (let i = 0; i < 4; i++) {
    const cx    = (i + 0.5) * laneW;
    const col   = LANE_COLORS[i];
    const flash = hitFlash[i];
    const isP   = lanePressed[i];
    const r     = Math.min(laneW * 0.32, 38);
    // Anticipation: pulse when next note on this lane is within 2 beats
    const nextN = window._nextPerLane && window._nextPerLane[i];
    const cb2   = gameActive ? getCurrentBeat() : 0;
    const beatsAway = nextN ? (nextN.beat - cb2) : 999;
    const anticip = beatsAway < 2.0 && beatsAway > 0 ? (1 - beatsAway / 2.0) : 0;
    const pulseR  = r + anticip * 8;
    ctx.shadowColor = col; ctx.shadowBlur = 10 + flash * 30 + anticip * 18;
    ctx.strokeStyle = col + (isP ? 'ff' : (anticip > 0.3 ? 'ee' : '88'));
    ctx.lineWidth = 3 + anticip * 2;
    ctx.beginPath(); ctx.arc(cx, HIT_Y, pulseR, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col + Math.floor((0.08 + flash * 0.38 + anticip * 0.22 + (isP ? 0.28 : 0)) * 255).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(cx, HIT_Y, pulseR, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = `bold ${Math.min(laneW * 0.22, 24)}px Courier New`;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + flash * 0.5 + anticip * 0.3) + ')';
    ctx.textAlign = 'center';
    ctx.fillText(LANE_KEYS[i], cx, HIT_Y + 7);
    ctx.textAlign = 'left';
  }

  // Particles
  particles.forEach(p => {
    const lr = p.life / p.maxLife;
    ctx.globalAlpha = lr;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x - 3, p.y - 3, 6 * lr, 6 * lr);
  });
  ctx.globalAlpha = 1;

  // Floating feedback texts
  floatingTexts.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life / 30);
    ctx.font = 'bold 16px Courier New'; ctx.fillStyle = f.color; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Combo burst center-top
  if (gameActive && combo >= 3) {
    const pulse = 1 + Math.sin(frameCount * 0.2) * 0.08;
    ctx.save(); ctx.translate(W/2, 60); ctx.scale(pulse, pulse);
    ctx.font = `bold ${Math.min(W * 0.05, 32)}px Courier New`;
    ctx.fillStyle = '#ffdd44'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 15;
    ctx.fillText(`🔥 COMBO ×${combo}`, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore(); ctx.textAlign = 'left';
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() {
  frameCount++;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT
// ============================================================
const lanePressed = [false, false, false, false];
const keys = {};
document.addEventListener('keydown', e => {
  if (keys[e.code]) return;
  keys[e.code] = true;
  const li = LANE_KEY_CODES.indexOf(e.code);
  if (li >= 0) { lanePressed[li] = true; tryHit(li); ensureAudio(); }
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  const li = LANE_KEY_CODES.indexOf(e.code);
  if (li >= 0) lanePressed[li] = false;
});

const activeTouches = new Map();
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); ensureAudio();
  for (const t of e.changedTouches) {
    const lane = Math.floor(t.clientX / (W / 4));
    if (lane >= 0 && lane < 4) { activeTouches.set(t.identifier, lane); lanePressed[lane] = true; tryHit(lane); }
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    const lane = activeTouches.get(t.identifier);
    if (lane !== undefined) { lanePressed[lane] = false; activeTouches.delete(t.identifier); }
  }
}, { passive: false });
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  const lane = Math.floor(e.clientX / (W / 4));
  if (lane >= 0 && lane < 4) { lanePressed[lane] = true; tryHit(lane); }
});
canvas.addEventListener('mouseup', e => {
  const lane = Math.floor(e.clientX / (W / 4));
  if (lane >= 0 && lane < 4) lanePressed[lane] = false;
});

// ============================================================
// INIT
// ============================================================
gameLoop();
</script>
<script>
// Kick off OGG decode as soon as page loads (needs user gesture first on some browsers)
document.addEventListener('click', function initAudio() {
  document.removeEventListener('click', initAudio);
  ensureAudio();
}, { once: true });
// Also try immediately (works if autoplay policy allows)
window.addEventListener('load', () => {
  try {
    if (!audioCtx) audioCtx = new _AudioCtx();
    const ldEl = document.getElementById('loading-track');
    if (ldEl) ldEl.style.display = 'block';
    loadTrack();
  } catch(e) {}
});
</script>
