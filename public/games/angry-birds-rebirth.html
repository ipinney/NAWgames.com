<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds ReBirth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 100;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            font-size: 48px;
            color: white;
            flex-direction: column;
            gap: 30px;
        }
        .overlay.active { display: flex; }
        .overlay h1 { font-size: 72px; text-shadow: 3px 3px 10px rgba(0,0,0,0.8); }
        .overlay h2 { font-size: 56px; color: #FFD700; }
        .overlay button {
            padding: 15px 40px;
            font-size: 32px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .overlay button:hover { background: #FF5520; transform: scale(1.05); }
        .overlay button:active { transform: scale(0.98); }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
        }
        .level-btn {
            padding: 20px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .level-btn:hover { background: #45a049; transform: scale(1.05); }
        .level-btn.locked { background: #ccc; cursor: not-allowed; opacity: 0.5; }
        .level-btn .stars {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 14px;
        }
        .hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            z-index: 50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .hud-birds {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .bird-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay" class="overlay">
        <h1>🐦 ANGRY BIRDS ReBirth</h1>
        <div style="text-align: center; font-size: 36px;">
            🔴 ⚡ 💎 💣 🥚
        </div>
        <button onclick="game.startLevel(0)">PLAY</button>
    </div>

    <div id="levelSelect" class="overlay">
        <h2>SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <button onclick="game.toMenu()">BACK</button>
    </div>

    <div id="levelComplete" class="overlay">
        <h2>LEVEL CLEAR!</h2>
        <div id="levelScore" style="font-size: 40px; color: #FFD700;"></div>
        <div id="levelStars" style="font-size: 60px;"></div>
        <div>
            <button onclick="game.nextLevel()">NEXT</button>
            <button onclick="game.startLevel(game.currentLevel)">RETRY</button>
            <button onclick="game.toLevelSelect()">LEVELS</button>
        </div>
    </div>

    <div id="levelFailed" class="overlay">
        <h2>TRY AGAIN!</h2>
        <div id="failScore" style="font-size: 40px; color: #FFD700;"></div>
        <div>
            <button onclick="game.startLevel(game.currentLevel)">RETRY</button>
            <button onclick="game.toLevelSelect()">LEVELS</button>
        </div>
    </div>

    <div class="hud">
        <div>Score: <span id="scoreDisplay">0</span></div>
        <div>Level: <span id="levelDisplay">1</span></div>
        <div class="hud-birds" id="birdsHud"></div>
    </div>

    <script>
// ============================================================================
// PHYSICS ENGINE - Rigid Body Dynamics
// ============================================================================
class PhysicsBody {
    constructor(x, y, w, h, isDynamic = true, mass = 1) {
        this.x = x;
        this.y = y;
        this.width = w;
        this.height = h;
        this.isDynamic = isDynamic;
        this.mass = mass;
        this.vx = 0;
        this.vy = 0;
        this.angularVelocity = 0;
        this.angle = 0;
        this.gravityScale = 1;
        this.friction = 0.98;
        this.restitution = 0.6;
        this.sleeping = false;
        this.sleepThreshold = 0.5;
    }

    applyForce(fx, fy) {
        if (!this.isDynamic) return;
        this.vx += fx / this.mass;
        this.vy += fy / this.mass;
    }

    applyImpulse(ix, iy, contactX = null, contactY = null) {
        if (!this.isDynamic) return;
        this.vx += ix / this.mass;
        this.vy += iy / this.mass;
        if (contactX !== null && contactY !== null) {
            const rx = contactX - (this.x + this.width / 2);
            const ry = contactY - (this.y + this.height / 2);
            const angularImpulse = (rx * iy - ry * ix) / (this.mass * (this.width * this.width + this.height * this.height) / 12);
            this.angularVelocity += angularImpulse * 0.3;
        }
    }

    update(gravity, dt) {
        if (!this.isDynamic || this.sleeping) return;

        this.vy += gravity * this.gravityScale * dt;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.angularVelocity *= 0.95;

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angle += this.angularVelocity * dt;

        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed < this.sleepThreshold && Math.abs(this.angularVelocity) < 0.01) {
            this.sleeping = true;
            this.vx = 0;
            this.vy = 0;
            this.angularVelocity = 0;
        }
    }

    wake() {
        this.sleeping = false;
    }

    getAABB() {
        const hw = this.width / 2;
        const hh = this.height / 2;
        const cx = this.x + hw;
        const cy = this.y + hh;
        const rotatedCorners = [
            this.rotatePoint(-hw, -hh, cx, cy),
            this.rotatePoint(hw, -hh, cx, cy),
            this.rotatePoint(hw, hh, cx, cy),
            this.rotatePoint(-hw, hh, cx, cy)
        ];
        let minX = rotatedCorners[0].x;
        let maxX = rotatedCorners[0].x;
        let minY = rotatedCorners[0].y;
        let maxY = rotatedCorners[0].y;
        for (let c of rotatedCorners) {
            minX = Math.min(minX, c.x);
            maxX = Math.max(maxX, c.x);
            minY = Math.min(minY, c.y);
            maxY = Math.max(maxY, c.y);
        }
        return { minX, maxX, minY, maxY };
    }

    rotatePoint(px, py, cx, cy) {
        const cos = Math.cos(this.angle);
        const sin = Math.sin(this.angle);
        const x = px * cos - py * sin;
        const y = px * sin + py * cos;
        return { x: x + cx, y: y + cy };
    }

    containsPoint(px, py) {
        const cos = Math.cos(-this.angle);
        const sin = Math.sin(-this.angle);
        const cx = this.x + this.width / 2;
        const cy = this.y + this.height / 2;
        const localX = (px - cx) * cos - (py - cy) * sin;
        const localY = (px - cx) * sin + (py - cy) * cos;
        return Math.abs(localX) < this.width / 2 && Math.abs(localY) < this.height / 2;
    }
}

class CollisionInfo {
    constructor(a, b, penetration, normalX, normalY, contactX, contactY) {
        this.a = a;
        this.b = b;
        this.penetration = penetration;
        this.normalX = normalX;
        this.normalY = normalY;
        this.contactX = contactX;
        this.contactY = contactY;
    }
}

function checkAABBCollision(bodyA, bodyB) {
    const aabb1 = bodyA.getAABB();
    const aabb2 = bodyB.getAABB();

    if (aabb1.maxX < aabb2.minX || aabb1.minX > aabb2.maxX ||
        aabb1.maxY < aabb2.minY || aabb1.minY > aabb2.maxY) {
        return null;
    }

    const cx1 = (aabb1.minX + aabb1.maxX) / 2;
    const cy1 = (aabb1.minY + aabb1.maxY) / 2;
    const cx2 = (aabb2.minX + aabb2.maxX) / 2;
    const cy2 = (aabb2.minY + aabb2.maxY) / 2;

    const w = (aabb1.maxX - aabb1.minX) / 2 + (aabb2.maxX - aabb2.minX) / 2;
    const h = (aabb1.maxY - aabb1.minY) / 2 + (aabb2.maxY - aabb2.minY) / 2;

    const dx = Math.abs(cx1 - cx2);
    const dy = Math.abs(cy1 - cy2);

    if (dx > w || dy > h) return null;

    let normalX = 0, normalY = 0, penetration = 0;
    if (w - dx < h - dy) {
        penetration = w - dx;
        normalX = cx1 > cx2 ? 1 : -1;
    } else {
        penetration = h - dy;
        normalY = cy1 > cy2 ? 1 : -1;
    }

    const contactX = (cx1 + cx2) / 2;
    const contactY = (cy1 + cy2) / 2;

    return new CollisionInfo(bodyA, bodyB, penetration, normalX, normalY, contactX, contactY);
}

function resolveCollision(collision, restitution = 0.6) {
    const a = collision.a;
    const b = collision.b;

    if (!a.isDynamic && !b.isDynamic) return;

    const nx = collision.normalX;
    const ny = collision.normalY;

    const dvx = b.vx - a.vx;
    const dvy = b.vy - a.vy;
    const dvDotN = dvx * nx + dvy * ny;

    if (dvDotN >= 0) return;

    let impulseMagnitude = -(1 + restitution) * dvDotN;
    if (a.isDynamic && b.isDynamic) {
        impulseMagnitude /= (1 / a.mass + 1 / b.mass);
    } else if (!a.isDynamic) {
        impulseMagnitude /= (1 / b.mass);
    } else {
        impulseMagnitude /= (1 / a.mass);
    }

    const impulseX = impulseMagnitude * nx;
    const impulseY = impulseMagnitude * ny;

    if (a.isDynamic) {
        a.vx -= impulseX / a.mass;
        a.vy -= impulseY / a.mass;
    }
    if (b.isDynamic) {
        b.vx += impulseX / b.mass;
        b.vy += impulseY / b.mass;
    }

    // Separate bodies
    if (a.isDynamic && b.isDynamic) {
        const separation = collision.penetration / 2 + 0.01;
        a.x -= nx * separation;
        a.y -= ny * separation;
        b.x += nx * separation;
        b.y += ny * separation;
    } else if (b.isDynamic) {
        const separation = collision.penetration + 0.01;
        b.x += nx * separation;
        b.y += ny * separation;
    } else {
        const separation = collision.penetration + 0.01;
        a.x -= nx * separation;
        a.y -= ny * separation;
    }

    a.wake();
    b.wake();
}

// ============================================================================
// AUDIO - Synthesized sounds
// ============================================================================
const audioContext = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type, pitch = 440, duration = 0.1, volume = 0.3) {
    try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.connect(gain);
        gain.connect(audioContext.destination);

        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        switch(type) {
            case 'launch':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(200, now + duration);
                break;
            case 'impact':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + duration);
                break;
            case 'wood':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + duration * 0.7);
                break;
            case 'stone':
                osc.type = 'square';
                osc.frequency.setValueAtTime(pitch * 1.5, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, now + duration);
                break;
            case 'ice':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch * 2, now);
                osc.frequency.exponentialRampToValueAtTime(pitch, now + duration);
                break;
            case 'pig':
                osc.type = 'square';
                osc.frequency.setValueAtTime(pitch * 0.8, now);
                osc.frequency.linearRampToValueAtTime(pitch * 0.5, now + duration);
                break;
            case 'explosion':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(pitch * 3, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.3, now + duration * 1.5);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration * 1.5);
                break;
            case 'speedboost':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.linearRampToValueAtTime(pitch * 2, now + duration * 0.5);
                break;
            case 'split':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.linearRampToValueAtTime(pitch * 1.5, now + duration);
                break;
            case 'victory':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.linearRampToValueAtTime(pitch * 1.5, now + duration * 0.7);
                break;
            case 'fail':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.3, now + duration);
                break;
        }

        osc.start(now);
        osc.stop(now + (type === 'explosion' ? duration * 1.5 : duration));
    } catch (e) {
        console.log('Audio error:', e);
    }
}

// ============================================================================
// PARTICLES
// ============================================================================
class Particle {
    constructor(x, y, vx, vy, color, life = 0.8) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = 4;
    }

    update(gravity, dt) {
        this.vy += gravity * dt * 0.5;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
    }
}

class FloatingText {
    constructor(x, y, text, color = '#FFD700') {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1;
        this.maxLife = 1;
    }

    update(dt) {
        this.y -= 30 * dt;
        this.life -= dt;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 24px Arial';
        ctx.fillStyle = this.color;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
    }
}

// ============================================================================
// GAME ENTITIES
// ============================================================================
class Block {
    constructor(x, y, w, h, material = 'wood') {
        this.body = new PhysicsBody(x, y, w, h, true, w * h * 0.002);
        this.material = material;
        this.maxHP = { ice: 1, wood: 3, stone: 5 }[material] || 3;
        this.hp = this.maxHP;
        this.crackLevel = 0;

        const colors = { ice: '#B0E0E6', wood: '#8B4513', stone: '#808080' };
        this.color = colors[material];
    }

    takeDamage(amount) {
        this.hp -= amount;
        this.crackLevel = Math.floor((this.maxHP - this.hp) / this.maxHP * 3);
        if (this.hp <= 0) return true;
        return false;
    }

    update(gravity, dt) {
        this.body.update(gravity, dt);
    }

    draw(ctx) {
        const hw = this.body.width / 2;
        const hh = this.body.height / 2;
        const cx = this.body.x + hw;
        const cy = this.body.y + hh;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(this.body.angle);

        ctx.fillStyle = this.color;
        ctx.fillRect(-hw, -hh, this.body.width, this.body.height);

        if (this.crackLevel > 0) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i < this.crackLevel; i++) {
                ctx.beginPath();
                ctx.moveTo(-hw + Math.random() * this.body.width, -hh + Math.random() * this.body.height);
                ctx.lineTo(-hw + Math.random() * this.body.width, -hh + Math.random() * this.body.height);
                ctx.stroke();
            }
        }

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.strokeRect(-hw, -hh, this.body.width, this.body.height);

        ctx.restore();
    }
}

class Pig {
    constructor(x, y) {
        this.body = new PhysicsBody(x, y, 18, 18, true, 0.5);
        this.hp = 2;
        this.maxHP = 2;
    }

    takeDamage(amount) {
        this.hp -= amount;
        return this.hp <= 0;
    }

    update(gravity, dt) {
        this.body.update(gravity, dt);
    }

    draw(ctx) {
        const cx = this.body.x + this.body.width / 2;
        const cy = this.body.y + this.body.height / 2;
        const radius = 9;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(this.body.angle);

        ctx.fillStyle = '#7CB342';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#558B2F';
        ctx.lineWidth = 2;
        ctx.stroke();

        const damageRatio = 1 - (this.hp / this.maxHP);
        ctx.font = '14px Arial';
        ctx.fillStyle = damageRatio > 0.5 ? '#FF0000' : '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(damageRatio > 0.5 ? '😢' : '🐷', 0, 1);

        ctx.restore();
    }
}

class Bird {
    constructor(x, y, type = 'red') {
        this.body = new PhysicsBody(x, y, 16, 16, true, 0.8);
        this.type = type;
        this.launched = false;
        this.abilityActive = false;
        this.trail = [];

        const colors = { red: '#EF5350', yellow: '#FDD835', blue: '#42A5F5', black: '#424242', white: '#FAFAFA' };
        this.color = colors[type];
    }

    update(gravity, dt) {
        this.body.update(gravity, dt);

        if (this.launched) {
            this.trail.push({ x: this.body.x + 8, y: this.body.y + 8, life: 0.3 });
            if (this.trail.length > 15) this.trail.shift();
            for (let t of this.trail) t.life -= dt;
            this.trail = this.trail.filter(t => t.life > 0);
        }
    }

    draw(ctx) {
        const cx = this.body.x + 8;
        const cy = this.body.y + 8;

        if (this.trail.length > 0 && this.launched) {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.stroke();
        }

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(this.body.angle);

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.stroke();

        const emoji = { red: '😡', yellow: '⚡', blue: '💎', black: '💣', white: '🥚' }[this.type];
        ctx.font = '10px Arial';
        ctx.fillStyle = '#000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, 0, 0);

        ctx.restore();
    }

    activateAbility(birds, blocks, pigs) {
        if (this.abilityActive) return;
        this.abilityActive = true;

        switch(this.type) {
            case 'yellow':
                this.body.vx *= 1.8;
                this.body.vy *= 1.8;
                playSound('speedboost', 400, 0.2);
                break;
            case 'blue':
                const bx = this.body.x + 8;
                const by = this.body.y + 8;
                const offsets = [[-10, -10], [10, 10], [0, 15]];
                for (let offset of offsets) {
                    const newBird = new Bird(bx + offset[0], by + offset[1], 'red');
                    newBird.body.vx = this.body.vx * 0.7 + offset[0] * 0.5;
                    newBird.body.vy = this.body.vy * 0.7 + offset[1] * 0.5;
                    newBird.launched = true;
                    birds.push(newBird);
                }
                playSound('split', 600, 0.15);
                playSound('split', 700, 0.15);
                this.body.vx = 0;
                this.body.vy = 0;
                break;
            case 'black':
                playSound('explosion', 200, 0.3, 0.5);
                this.explode(blocks, pigs);
                this.body.vx = 0;
                this.body.vy = 0;
                break;
            case 'white':
                const cx = this.body.x + 8;
                const cy = this.body.y + 8;
                const egg = new EggBomb(cx, cy);
                egg.body.vx = this.body.vx * 0.3;
                egg.body.vy = -300;
                blocks.push(egg);
                this.body.vy = -200;
                playSound('split', 500, 0.2);
                break;
        }
    }

    explode(blocks, pigs) {
        const cx = this.body.x + 8;
        const cy = this.body.y + 8;
        const radius = 80;

        for (let block of blocks) {
            if (block instanceof Block) {
                const dx = (block.body.x + block.body.width / 2) - cx;
                const dy = (block.body.y + block.body.height / 2) - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < radius) {
                    const force = (1 - dist / radius) * 500;
                    const angle = Math.atan2(dy, dx);
                    block.body.applyImpulse(Math.cos(angle) * force, Math.sin(angle) * force, cx + Math.cos(angle) * 20, cy + Math.sin(angle) * 20);
                    if (block.takeDamage(2)) game.blocksDestroyed.push(block);
                }
            }
        }

        for (let pig of pigs) {
            const dx = (pig.body.x + 9) - cx;
            const dy = (pig.body.y + 9) - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < radius) {
                const force = (1 - dist / radius) * 400;
                const angle = Math.atan2(dy, dx);
                pig.body.applyImpulse(Math.cos(angle) * force, Math.sin(angle) * force);
                if (pig.takeDamage(2)) game.pigsKilled.push(pig);
            }
        }
    }
}

class EggBomb {
    constructor(x, y) {
        this.body = new PhysicsBody(x, y, 12, 12, true, 0.3);
        this.active = false;
        this.life = -1;
    }

    explode(blocks, pigs) {
        const cx = this.body.x + 6;
        const cy = this.body.y + 6;
        const radius = 60;

        playSound('explosion', 150, 0.25, 0.4);

        for (let block of blocks) {
            if (block instanceof Block) {
                const dx = (block.body.x + block.body.width / 2) - cx;
                const dy = (block.body.y + block.body.height / 2) - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < radius) {
                    const force = (1 - dist / radius) * 300;
                    const angle = Math.atan2(dy, dx);
                    block.body.applyImpulse(Math.cos(angle) * force, Math.sin(angle) * force, cx + Math.cos(angle) * 15, cy + Math.sin(angle) * 15);
                    if (block.takeDamage(1.5)) game.blocksDestroyed.push(block);
                }
            }
        }

        for (let pig of pigs) {
            const dx = (pig.body.x + 9) - cx;
            const dy = (pig.body.y + 9) - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < radius) {
                const force = (1 - dist / radius) * 300;
                const angle = Math.atan2(dy, dx);
                pig.body.applyImpulse(Math.cos(angle) * force, Math.sin(angle) * force);
                if (pig.takeDamage(1.5)) game.pigsKilled.push(pig);
            }
        }
    }

    update(gravity, dt) {
        this.body.update(gravity, dt);
        if (this.active) {
            this.life += dt;
            if (this.life > 0.3) this.active = false;
        }
    }

    draw(ctx) {
        const cx = this.body.x + 6;
        const cy = this.body.y + 6;
        ctx.fillStyle = '#FFF8DC';
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#DAA520';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.font = '8px Arial';
        ctx.fillStyle = '#000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🥚', cx, cy);
    }
}

class Game {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = canvas.width = window.innerWidth;
        this.height = canvas.height = window.innerHeight;

        this.state = 'menu'; // menu, levelselect, playing, levelcomplete, levelfailed
        this.currentLevel = 0;
        this.score = 0;
        this.levelScore = 0;

        this.birds = [];
        this.blocks = [];
        this.pigs = [];
        this.particles = [];
        this.floatingTexts = [];

        this.blocksDestroyed = [];
        this.pigsKilled = [];

        this.currentBirdIndex = 0;
        this.birdInFlight = false;
        this.slingshot = { x: Math.floor(this.width * 0.15), y: Math.floor(this.height * 0.7) };
        this.dragStart = null;
        this.dragCurrent = null;
        this.maxPullDistance = 80;

        this.gravity = 600;
        this.camera = { x: 0, y: 0 };
        this.screenShake = 0;

        this.unlockedLevels = 1;
        this.levelStars = Array(8).fill(0);

        this.setupEventListeners();
        this.gameLoop = this.gameLoop.bind(this);
        requestAnimationFrame(this.gameLoop);
    }

    setupEventListeners() {
        window.addEventListener('resize', () => {
            this.width = this.canvas.width = window.innerWidth;
            this.height = this.canvas.height = window.innerHeight;
        });

        this.canvas.addEventListener('mousedown', (e) => this.handleDragStart(e));
        this.canvas.addEventListener('mousemove', (e) => this.handleDragMove(e));
        this.canvas.addEventListener('mouseup', (e) => this.handleDragEnd(e));

        this.canvas.addEventListener('touchstart', (e) => this.handleDragStart(e.touches[0]));
        this.canvas.addEventListener('touchmove', (e) => this.handleDragMove(e.touches[0]));
        this.canvas.addEventListener('touchend', (e) => this.handleDragEnd(e));

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && this.state === 'playing' && this.birdInFlight && this.currentBirdIndex > 0) {
                const bird = this.birds[this.currentBirdIndex - 1];
                if (!bird.abilityActive) {
                    bird.activateAbility(this.birds, this.blocks, this.pigs);
                }
            }
        });
    }

    handleDragStart(e) {
        if (this.state !== 'playing' || this.birdInFlight) return;
        const rect = this.canvas.getBoundingClientRect();
        const x = (e.clientX || e.pageX) - rect.left;
        const y = (e.clientY || e.pageY) - rect.top;
        const bird = this.birds[this.currentBirdIndex];
        const bx = bird.body.x + 8;
        const by = bird.body.y + 8;

        if (Math.hypot(x - bx, y - by) < 40) {
            this.dragStart = { x, y };
            this.dragCurrent = { x, y };
        }
    }

    handleDragMove(e) {
        if (!this.dragStart) return;
        const rect = this.canvas.getBoundingClientRect();
        this.dragCurrent = {
            x: (e.clientX || e.pageX) - rect.left,
            y: (e.clientY || e.pageY) - rect.top
        };
    }

    handleDragEnd(e) {
        if (!this.dragStart) return;

        const dx = this.dragStart.x - this.dragCurrent.x;
        const dy = this.dragStart.y - this.dragCurrent.y;
        const distance = Math.min(Math.hypot(dx, dy), this.maxPullDistance);
        const angle = Math.atan2(dy, dx);

        const bird = this.birds[this.currentBirdIndex];
        bird.body.vx = Math.cos(angle) * distance * 8;
        bird.body.vy = Math.sin(angle) * distance * 8;
        bird.launched = true;
        this.birdInFlight = true;
        this.currentBirdIndex++;

        playSound('launch', 300, 0.15);

        this.dragStart = null;
        this.dragCurrent = null;
    }

    toMenu() {
        this.state = 'menu';
        document.getElementById('overlay').classList.add('active');
        document.getElementById('levelSelect').classList.remove('active');
        document.getElementById('levelComplete').classList.remove('active');
        document.getElementById('levelFailed').classList.remove('active');
    }

    toLevelSelect() {
        this.state = 'levelselect';
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('levelSelect').classList.add('active');

        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            if (i >= this.unlockedLevels) btn.classList.add('locked');
            btn.textContent = `L${i + 1}`;
            btn.innerHTML = `L${i + 1}<div class="stars">${'⭐'.repeat(this.levelStars[i])}</div>`;
            btn.onclick = () => {
                if (i < this.unlockedLevels) this.startLevel(i);
            };
            grid.appendChild(btn);
        }
    }

    startLevel(levelIndex) {
        this.currentLevel = levelIndex;
        const levelData = LEVELS[levelIndex];

        this.birds = [];
        this.blocks = [];
        this.pigs = [];
        this.particles = [];
        this.floatingTexts = [];
        this.blocksDestroyed = [];
        this.pigsKilled = [];

        this.currentBirdIndex = 0;
        this.birdInFlight = false;
        this.levelScore = 0;

        for (let birdData of levelData.birds) {
            const bird = new Bird(this.slingshot.x - 30, this.slingshot.y, birdData.type);
            this.birds.push(bird);
        }

        for (let blockData of levelData.blocks) {
            const block = new Block(blockData.x, blockData.y, blockData.w, blockData.h, blockData.material);
            this.blocks.push(block);
        }

        for (let pigData of levelData.pigs) {
            const pig = new Pig(pigData.x, pigData.y);
            this.pigs.push(pig);
        }

        this.state = 'playing';
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('levelSelect').classList.remove('active');
        document.getElementById('levelComplete').classList.remove('active');
        document.getElementById('levelFailed').classList.remove('active');
    }

    nextLevel() {
        if (this.currentLevel < 7) {
            this.startLevel(this.currentLevel + 1);
            if (this.currentLevel <= this.unlockedLevels) this.unlockedLevels++;
        } else {
            this.toMenu();
        }
    }

    gameLoop(time) {
        const dt = 0.016;

        // Update
        if (this.state === 'playing') {
            const levelData = LEVELS[this.currentLevel];

            // Update physics
            for (let block of this.blocks) {
                if (block instanceof Block) block.update(this.gravity, dt);
                else if (block instanceof EggBomb) block.update(this.gravity, dt);
            }
            for (let bird of this.birds) bird.update(this.gravity, dt);
            for (let pig of this.pigs) pig.update(this.gravity, dt);

            // Collisions
            for (let i = 0; i < this.blocks.length; i++) {
                for (let j = i + 1; j < this.blocks.length; j++) {
                    const blockA = this.blocks[i];
                    const blockB = this.blocks[j];
                    if ((blockA instanceof Block || blockA instanceof EggBomb) &&
                        (blockB instanceof Block || blockB instanceof EggBomb)) {
                        const collision = checkAABBCollision(blockA.body, blockB.body);
                        if (collision) {
                            resolveCollision(collision, 0.5);
                            if (blockA instanceof Block && blockB instanceof Block) {
                                const dmg = Math.sqrt(blockA.body.vx ** 2 + blockA.body.vy ** 2) * 0.05;
                                if (dmg > 1 && blockB.takeDamage(dmg)) this.blocksDestroyed.push(blockB);
                                if (dmg > 1 && blockA.takeDamage(dmg)) this.blocksDestroyed.push(blockA);
                            }
                        }
                    }
                }
            }

            for (let i = 0; i < this.birds.length; i++) {
                for (let j = 0; j < this.blocks.length; j++) {
                    const collision = checkAABBCollision(this.birds[i].body, this.blocks[j].body);
                    if (collision) {
                        resolveCollision(collision, 0.3);
                        const dmg = Math.sqrt(this.birds[i].body.vx ** 2 + this.birds[i].body.vy ** 2) * 0.08;
                        if (this.blocks[j] instanceof Block) {
                            if (dmg > 1 && this.blocks[j].takeDamage(dmg)) {
                                this.blocksDestroyed.push(this.blocks[j]);
                            }
                        } else if (this.blocks[j] instanceof EggBomb) {
                            this.blocks[j].active = true;
                            this.blocks[j].life = 0;
                        }
                    }
                }

                for (let pig of this.pigs) {
                    const collision = checkAABBCollision(this.birds[i].body, pig.body);
                    if (collision) {
                        resolveCollision(collision, 0.3);
                        const dmg = Math.sqrt(this.birds[i].body.vx ** 2 + this.birds[i].body.vy ** 2) * 0.1;
                        if (dmg > 0.5 && pig.takeDamage(dmg)) this.pigsKilled.push(pig);
                    }
                }
            }

            // Ground collisions
            const groundY = this.height - 80;
            for (let block of this.blocks) {
                if ((block instanceof Block || block instanceof EggBomb) && block.body.y + block.body.height > groundY) {
                    block.body.y = groundY - block.body.height;
                    block.body.vy *= -0.4;
                    block.body.vx *= 0.95;
                    block.body.wake();
                }
            }

            for (let bird of this.birds) {
                if (bird.body.y + 16 > groundY) {
                    bird.body.y = groundY - 16;
                    bird.body.vy *= -0.3;
                    bird.body.vx *= 0.9;
                    bird.body.wake();
                }
            }

            for (let pig of this.pigs) {
                if (pig.body.y + 18 > groundY) {
                    pig.body.y = groundY - 18;
                    pig.body.vy *= -0.4;
                    pig.body.vx *= 0.95;
                    pig.body.wake();
                }
            }

            // EggBomb explosions
            for (let i = this.blocks.length - 1; i >= 0; i--) {
                if (this.blocks[i] instanceof EggBomb) {
                    const egg = this.blocks[i];
                    if (egg.active && egg.life > 0.3) {
                        egg.explode(this.blocks, this.pigs);
                        this.blocks.splice(i, 1);
                        this.screenShake = 10;
                        this.createExplosionParticles(egg.body.x + 6, egg.body.y + 6);
                    }
                }
            }

            // Particle updates
            for (let i = this.particles.length - 1; i >= 0; i--) {
                this.particles[i].update(this.gravity, dt);
                if (this.particles[i].life <= 0) this.particles.splice(i, 1);
            }

            // Floating text
            for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                this.floatingTexts[i].update(dt);
                if (this.floatingTexts[i].life <= 0) this.floatingTexts.splice(i, 1);
            }

            // Process destroyed blocks
            for (let block of this.blocksDestroyed) {
                const idx = this.blocks.indexOf(block);
                if (idx >= 0) {
                    this.blocks.splice(idx, 1);
                    const cx = block.body.x + block.body.width / 2;
                    const cy = block.body.y + block.body.height / 2;
                    this.createBlockParticles(cx, cy, block.material);

                    const points = { ice: 30, wood: 50, stone: 100 }[block.material];
                    this.levelScore += points;
                    this.floatingTexts.push(new FloatingText(cx, cy, `+${points}`));

                    const sound = { ice: 'ice', wood: 'wood', stone: 'stone' }[block.material];
                    playSound(sound, 400, 0.15);
                    this.screenShake = 3;
                }
            }
            this.blocksDestroyed = [];

            // Process killed pigs
            for (let pig of this.pigsKilled) {
                const idx = this.pigs.indexOf(pig);
                if (idx >= 0) {
                    this.pigs.splice(idx, 1);
                    const cx = pig.body.x + 9;
                    const cy = pig.body.y + 9;
                    this.createPigParticles(cx, cy);

                    this.levelScore += 500;
                    this.floatingTexts.push(new FloatingText(cx, cy, '+500'));

                    playSound('pig', 200, 0.2);
                    this.screenShake = 5;
                }
            }
            this.pigsKilled = [];

            // Check level complete
            if (this.pigs.length === 0 && this.birdInFlight === false) {
                this.levelComplete();
            }

            // Check level failed
            if (this.currentBirdIndex >= this.birds.length && this.birdInFlight === false && this.pigs.length > 0) {
                setTimeout(() => this.levelFailed(), 1500);
            }

            // Camera follow
            if (this.currentBirdIndex > 0) {
                const bird = this.birds[this.currentBirdIndex - 1];
                const targetX = bird.body.x - this.width / 3;
                const targetY = Math.max(0, bird.body.y - this.height / 3);
                this.camera.x += (targetX - this.camera.x) * 0.1;
                this.camera.y += (targetY - this.camera.y) * 0.1;
            } else {
                this.camera.x += (0 - this.camera.x) * 0.1;
                this.camera.y += (0 - this.camera.y) * 0.1;
            }

            // Check if bird in flight settled
            if (this.currentBirdIndex > 0) {
                const bird = this.birds[this.currentBirdIndex - 1];
                if (bird.body.sleeping && !this.birdInFlight) {
                    // Still in flight but sleeping, wait a bit
                } else if (bird.body.sleeping) {
                    this.birdInFlight = false;
                }
            }

            this.screenShake *= 0.9;
        }

        // Draw
        this.draw();
        requestAnimationFrame(this.gameLoop);
    }

    createBlockParticles(x, y, material) {
        const colors = { ice: '#B0E0E6', wood: '#8B4513', stone: '#A9A9A9' };
        const color = colors[material];
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 100 + Math.random() * 150;
            this.particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, 0.6));
        }
    }

    createPigParticles(x, y) {
        for (let i = 0; i < 10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 80 + Math.random() * 120;
            this.particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, '#7CB342', 0.7));
        }
    }

    createExplosionParticles(x, y) {
        for (let i = 0; i < 20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 200 + Math.random() * 300;
            const colors = ['#FFD700', '#FF6347', '#FFA500', '#FF4500'];
            this.particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, colors[Math.floor(Math.random() * colors.length)], 0.8));
        }
    }

    levelComplete() {
        this.state = 'levelcomplete';

        const levelData = LEVELS[this.currentLevel];
        let stars = 1;
        if (this.levelScore >= levelData.starThresholds[1]) stars = 2;
        if (this.levelScore >= levelData.starThresholds[2]) stars = 3;

        const bonusPoints = Math.max(0, this.birds.length - this.currentBirdIndex) * 1000;
        const totalScore = this.levelScore + bonusPoints;

        this.score += totalScore;
        this.levelStars[this.currentLevel] = Math.max(this.levelStars[this.currentLevel], stars);

        if (this.currentLevel + 1 <= this.unlockedLevels) this.unlockedLevels = Math.min(8, this.currentLevel + 2);

        document.getElementById('levelScore').textContent = `Score: ${totalScore} (${this.levelScore} + ${bonusPoints} bonus)`;
        document.getElementById('levelStars').textContent = '⭐'.repeat(stars);
        document.getElementById('levelComplete').classList.add('active');

        playSound('victory', 400, 0.3);
        playSound('victory', 500, 0.25, 0.2);
    }

    levelFailed() {
        this.state = 'levelfailed';
        document.getElementById('failScore').textContent = `Score: ${this.levelScore}`;
        document.getElementById('levelFailed').classList.add('active');
        playSound('fail', 300, 0.4);
    }

    draw() {
        const ctx = this.ctx;

        // Clear
        ctx.fillStyle = 'rgba(135, 206, 235, 0.1)';
        ctx.fillRect(0, 0, this.width, this.height);

        // Apply camera and shake
        ctx.save();
        ctx.translate(-this.camera.x + (Math.random() - 0.5) * this.screenShake,
                      -this.camera.y + (Math.random() - 0.5) * this.screenShake);

        // Draw ground
        ctx.fillStyle = '#2D5016';
        ctx.fillRect(0, this.height - 80, 10000, 80);
        ctx.fillStyle = '#558B2F';
        for (let i = 0; i < 100; i++) {
            ctx.fillRect(i * 100, this.height - 70, 50, 10);
        }

        // Draw blocks
        for (let block of this.blocks) {
            block.draw(ctx);
        }

        // Draw pigs
        for (let pig of this.pigs) {
            pig.draw(ctx);
        }

        // Draw birds
        for (let bird of this.birds) {
            bird.draw(ctx);
        }

        // Draw particles
        ctx.globalAlpha = 1;
        for (let particle of this.particles) {
            particle.draw(ctx);
        }

        // Draw floating text
        for (let text of this.floatingTexts) {
            text.draw(ctx);
        }

        ctx.restore();
        ctx.globalAlpha = 1;

        // Draw slingshot (always visible, not affected by camera)
        if (this.state === 'playing' && this.currentBirdIndex === 0) {
            const bird = this.birds[0];
            const bx = bird.body.x + 8;
            const by = bird.body.y + 8;

            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            // Y-fork
            ctx.beginPath();
            ctx.moveTo(this.slingshot.x, this.slingshot.y - 20);
            ctx.lineTo(this.slingshot.x - 15, this.slingshot.y + 20);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(this.slingshot.x, this.slingshot.y - 20);
            ctx.lineTo(this.slingshot.x + 15, this.slingshot.y + 20);
            ctx.stroke();

            // Rubber band
            ctx.strokeStyle = '#FF6347';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(this.slingshot.x - 15, this.slingshot.y + 20);
            ctx.lineTo(bx, by);
            ctx.lineTo(this.slingshot.x + 15, this.slingshot.y + 20);
            ctx.stroke();

            // Trajectory line
            if (this.dragCurrent) {
                const dx = this.dragStart.x - this.dragCurrent.x;
                const dy = this.dragStart.y - this.dragCurrent.y;
                const distance = Math.min(Math.hypot(dx, dy), this.maxPullDistance);
                const angle = Math.atan2(dy, dx);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(bx, by);

                let px = bx + Math.cos(angle) * distance * 8;
                let py = by + Math.sin(angle) * distance * 8;

                for (let i = 0; i < 20; i++) {
                    py += this.gravity * 0.016 * 0.016;
                    ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // Draw HUD
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(`Score: ${this.score + this.levelScore}`, 15, 35);
        ctx.fillText(`Level ${this.currentLevel + 1}`, 15, 65);

        // Draw remaining birds
        ctx.font = '20px Arial';
        let birdsLeft = this.birds.length - this.currentBirdIndex;
        ctx.fillText(`Birds: ${birdsLeft}`, 15, 95);
    }
}

// Initialize game
const canvas = document.getElementById('gameCanvas');
const game = new Game(canvas);

    </script>
