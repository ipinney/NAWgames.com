<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Designer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0b1a;overflow:hidden;touch-action:none;user-select:none;font-family:'Segoe UI',sans-serif}
canvas#c{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
#startScreen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(15,11,26,0.92),rgba(26,16,64,0.92),rgba(42,16,96,0.92))}
#startScreen h1{font-size:clamp(2rem,6vw,3.5rem);background:linear-gradient(90deg,#10b981,#06b6d4,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#startScreen p{color:#a0a0c0;font-size:clamp(0.85rem,2.2vw,1.1rem);margin-bottom:15px;text-align:center;padding:0 20px}
#designArea{display:none;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px}
#designLabel{color:#10b981;font-size:1rem;font-weight:bold}
#colorPicker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:300px}
.colorBtn{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform 0.2s,border-color 0.2s}
.colorBtn.selected{border-color:#fff;transform:scale(1.2)}
#patternPicker{display:flex;gap:8px;margin-top:5px}
.patternBtn{padding:8px 16px;border-radius:10px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;font-size:0.85rem;transition:background 0.2s}
.patternBtn.selected{background:rgba(124,58,237,0.4);border-color:#7c3aed}
#snakePreview{width:200px;height:60px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1)}
#playBtn{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:none;padding:16px 45px;font-size:clamp(1.1rem,3vw,1.5rem);border-radius:50px;cursor:pointer;font-weight:bold;box-shadow:0 5px 0 #065f46,0 8px 20px rgba(0,0,0,0.4);margin-top:10px}
#designBtn{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;padding:12px 35px;font-size:1rem;border-radius:50px;cursor:pointer;font-weight:bold;box-shadow:0 4px 0 #5b21b6;margin-bottom:10px}
#hud{position:fixed;top:0;left:0;right:0;z-index:50;padding:10px 15px;display:none;pointer-events:none;text-align:center}
#scoreDisplay{font-size:clamp(1.3rem,3.5vw,2rem);color:#10b981;font-weight:bold;text-shadow:0 0 10px rgba(16,185,129,0.5)}
#levelDisplay{font-size:clamp(0.7rem,2vw,0.9rem);color:#a0a0c0}
#dpad{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:none}
.dBtn{position:absolute;width:55px;height:55px;border-radius:12px;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:rgba(255,255,255,0.7);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dBtn:active{background:rgba(124,58,237,0.4)}
#dUp{left:60px;top:0}#dDown{left:60px;top:120px}#dLeft{left:0;top:60px}#dRight{left:120px;top:60px}
#gameOver{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85)}
#gameOver h1{font-size:clamp(2rem,5vw,3rem);color:#ef4444;margin-bottom:10px}
#gameOver p{color:#a0a0c0;font-size:1rem;margin-bottom:5px}
#gameOver button{margin-top:15px;background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:none;padding:14px 40px;font-size:1.2rem;border-radius:50px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div id="startScreen">
  <h1>🐍 Snake Designer</h1>
  <p>Design your own snake, then play!<br>Eat pellets, grow longer, avoid AI snakes!</p>
  <button id="designBtn">🎨 Design Your Snake</button>
  <div id="designArea">
    <div id="designLabel">Pick Your Color:</div>
    <div id="colorPicker"></div>
    <div id="designLabel">Pick Your Pattern:</div>
    <div id="patternPicker">
      <div class="patternBtn selected" data-pat="solid">Solid</div>
      <div class="patternBtn" data-pat="striped">Striped</div>
      <div class="patternBtn" data-pat="rainbow">Rainbow</div>
      <div class="patternBtn" data-pat="spots">Spots</div>
    </div>
    <canvas id="snakePreview" width="200" height="60"></canvas>
  </div>
  <button id="playBtn">PLAY!</button>
</div>
<div id="hud">
  <div id="scoreDisplay">Score: 0</div>
  <div id="levelDisplay">Level 1 | Length: 3</div>
</div>
<div id="dpad">
  <div class="dBtn" id="dUp">▲</div>
  <div class="dBtn" id="dDown">▼</div>
  <div class="dBtn" id="dLeft">◀</div>
  <div class="dBtn" id="dRight">▶</div>
</div>
<div id="gameOver">
  <h1>Game Over!</h1>
  <p id="goScore"></p>
  <p id="goLength"></p>
  <p id="goLevel"></p>
  <p id="goPellets"></p>
  <button id="replayBtn">Play Again</button>
</div>
<canvas id="c"></canvas>
<script>
// === AUDIO ===
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume()}
function playSound(type){
  if(!audioCtx)return;const t=audioCtx.currentTime;const m=audioCtx.createGain();m.connect(audioCtx.destination);
  if(type==='eat'){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sine';
    o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.1);
    g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g);g.connect(m);o.start(t);o.stop(t+0.15);m.gain.setValueAtTime(0.5,t);
  } else if(type==='powerup'){
    const notes=[600,900,1200];
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator();const g=audioCtx.createGain();
      o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.07);
      g.gain.linearRampToValueAtTime(0.12,t+i*0.07+0.03);g.gain.linearRampToValueAtTime(0,t+i*0.07+0.2);
      o.connect(g);g.connect(m);o.start(t+i*0.07);o.stop(t+i*0.07+0.2);});
    m.gain.setValueAtTime(0.5,t);
  } else if(type==='die'){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(50,t+0.8);
    g.gain.setValueAtTime(0.2,t);g.gain.linearRampToValueAtTime(0,t+1);
    o.connect(g);g.connect(m);o.start(t);o.stop(t+1);m.gain.setValueAtTime(0.5,t);
    // noise
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.5,audioCtx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.2));
    const ns=audioCtx.createBufferSource();ns.buffer=buf;const ng=audioCtx.createGain();
    ng.gain.setValueAtTime(0.15,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    ns.connect(ng);ng.connect(m);ns.start(t);ns.stop(t+0.5);
  } else if(type==='turn'){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sine';
    o.frequency.value=200+Math.random()*100;g.gain.setValueAtTime(0.03,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    o.connect(g);g.connect(m);o.start(t);o.stop(t+0.05);m.gain.setValueAtTime(0.3,t);
  } else if(type==='levelup'){
    const notes=[523,659,784,1047];
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator();const g=audioCtx.createGain();
      o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.12);
      g.gain.linearRampToValueAtTime(0.15,t+i*0.12+0.04);g.gain.linearRampToValueAtTime(0,t+i*0.12+0.4);
      o.connect(g);g.connect(m);o.start(t+i*0.12);o.stop(t+i*0.12+0.4);});
    m.gain.setValueAtTime(0.6,t);
  }
}
let ambientOn=false;
function startAmbient(){
  if(ambientOn||!audioCtx)return;ambientOn=true;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*4,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const ns=audioCtx.createBufferSource();ns.buffer=buf;ns.loop=true;
  const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=150;
  const g=audioCtx.createGain();g.gain.value=0.015;
  ns.connect(f);f.connect(g);g.connect(audioCtx.destination);ns.start();
}

// === CANVAS ===
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
let W,H;function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H}
resize();window.addEventListener('resize',resize);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// === DESIGN STATE ===
const snakeColors=['#10b981','#06b6d4','#7c3aed','#ec4899','#ef4444','#f59e0b','#ff6b35','#8b5cf6','#14b8a6','#f472b6','#a855f7','#22d3ee'];
let selectedColor='#10b981',selectedPattern='solid';
let designShowing=false;

function initDesignUI(){
  const cp=document.getElementById('colorPicker');
  snakeColors.forEach(c=>{
    const btn=document.createElement('div');btn.className='colorBtn'+(c===selectedColor?' selected':'');
    btn.style.background=c;btn.onclick=()=>{
      selectedColor=c;document.querySelectorAll('.colorBtn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');updatePreview();
    };cp.appendChild(btn);
  });
  document.querySelectorAll('.patternBtn').forEach(b=>{
    b.onclick=()=>{selectedPattern=b.dataset.pat;
      document.querySelectorAll('.patternBtn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');updatePreview();};
  });
  updatePreview();
}

function updatePreview(){
  const pc=document.getElementById('snakePreview').getContext('2d');
  pc.clearRect(0,0,200,60);
  const cellSize=18;const startX=10;const startY=30;
  for(let i=0;i<9;i++){
    const x=startX+i*cellSize;
    pc.fillStyle=getSegmentColor(i,9);
    pc.beginPath();pc.roundRect(x,startY-cellSize/2,cellSize-2,cellSize-2,4);pc.fill();
    if(selectedPattern==='spots'&&i%2===0){
      pc.fillStyle='rgba(255,255,255,0.3)';pc.beginPath();pc.arc(x+cellSize/2-1,startY,3,0,Math.PI*2);pc.fill();
    }
    if(selectedPattern==='striped'&&i%2===0){
      pc.fillStyle='rgba(255,255,255,0.2)';pc.fillRect(x+2,startY-cellSize/2,cellSize-6,cellSize-2);
    }
  }
  // Head
  pc.fillStyle='#fff';pc.beginPath();pc.arc(startX+3,startY-3,2,0,Math.PI*2);pc.fill();
  pc.beginPath();pc.arc(startX+8,startY-3,2,0,Math.PI*2);pc.fill();
}

function getSegmentColor(idx,total){
  if(selectedPattern==='rainbow'){
    const hue=(idx/total)*360;return `hsl(${hue},80%,55%)`;
  }
  if(selectedPattern==='striped'){
    if(idx%2===0)return selectedColor;
    const c=hexToRgb(selectedColor);return `rgb(${Math.min(255,c.r+40)},${Math.min(255,c.g+40)},${Math.min(255,c.b+40)})`;
  }
  if(selectedPattern==='spots'){
    const c=hexToRgb(selectedColor);
    const darkFactor=0.7+Math.sin(idx*0.8)*0.15;
    return `rgb(${Math.floor(c.r*darkFactor)},${Math.floor(c.g*darkFactor)},${Math.floor(c.b*darkFactor)})`;
  }
  return selectedColor;
}
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b}}

// === GAME STATE ===
const GRID=25;let cols,rows;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0};
let pellets=[],powerups=[],aiSnakes=[];
let score=0,level=1,pelletsEaten=0,gameRunning=false,gameOver=false;
let moveTimer=0,moveInterval=150;
let particles=[],floatingTexts=[];
let camShake=0,tick=0;
let bgStars=[];

function initGrid(){cols=Math.floor(W/GRID);rows=Math.floor(H/GRID)}

// Particles
function addParticle(x,y,type,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    let life,r,g,b,sz;
    if(type==='eat'){life=25+Math.random()*15;r=16;g=185;b=129;sz=3+Math.random()*3}
    else if(type==='die'){life=40+Math.random()*30;r=239;g=68;b=68;sz=4+Math.random()*5}
    else if(type==='power'){life=30+Math.random()*20;r=255;g=215;b=0;sz=3+Math.random()*4}
    else if(type==='sparkle'){life=15+Math.random()*10;r=255;g=255;b=255;sz=2+Math.random()*2}
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,maxLife:life,r,g,b,size:sz,type});
  }
}
function updateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life--});particles=particles.filter(p=>p.life>0)}
function drawParticles(){
  particles.forEach(p=>{const lr=p.life/p.maxLife;ctx.globalAlpha=lr;
    ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*lr,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
}

// Floating texts
function addFloat(x,y,text,color,size){floatingTexts.push({x,y,text,color,size,life:50,maxLife:50})}
function updateFloats(){floatingTexts.forEach(f=>{f.y-=1.2;f.life--});floatingTexts=floatingTexts.filter(f=>f.life>0)}
function drawFloats(){
  floatingTexts.forEach(f=>{ctx.globalAlpha=f.life/f.maxLife;ctx.font=`bold ${f.size}px sans-serif`;
    ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y)});
  ctx.globalAlpha=1;
}

// === PELLETS & POWERUPS ===
function spawnPellet(){
  let x,y,tries=0;
  do{x=Math.floor(Math.random()*cols);y=Math.floor(Math.random()*rows);tries++}
  while(tries<100&&(snake.some(s=>s.x===x&&s.y===y)||pellets.some(p=>p.x===x&&p.y===y)));
  const type=Math.random()<0.15?'golden':'normal';
  pellets.push({x,y,type,pulse:Math.random()*Math.PI*2});
}
function spawnPowerup(){
  let x,y,tries=0;
  do{x=Math.floor(Math.random()*cols);y=Math.floor(Math.random()*rows);tries++}
  while(tries<100&&snake.some(s=>s.x===x&&s.y===y));
  const types=['speed','slow','shield'];
  powerups.push({x,y,type:types[Math.floor(Math.random()*types.length)],life:400,pulse:0});
}

function drawPellets(){
  pellets.forEach(p=>{
    p.pulse+=0.05;const sz=GRID*0.35+Math.sin(p.pulse)*GRID*0.05;
    const px=p.x*GRID+GRID/2,py=p.y*GRID+GRID/2;
    if(p.type==='golden'){
      ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=10;
    }else{
      ctx.fillStyle='#ef4444';ctx.shadowColor='#ef4444';ctx.shadowBlur=6;
    }
    ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Glow ring
    ctx.strokeStyle=p.type==='golden'?'rgba(255,215,0,0.3)':'rgba(239,68,68,0.3)';
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,sz+4+Math.sin(p.pulse*2)*2,0,Math.PI*2);ctx.stroke();
  });
}
function drawPowerups(){
  powerups.forEach(p=>{
    p.pulse+=0.06;p.life--;
    const px=p.x*GRID+GRID/2,py=p.y*GRID+GRID/2;
    const alpha=p.life<60?p.life/60:1;ctx.globalAlpha=alpha;
    const colors={speed:'#06b6d4',slow:'#f59e0b',shield:'#7c3aed'};
    const icons={speed:'⚡',slow:'🐢',shield:'🛡'};
    ctx.fillStyle=colors[p.type];ctx.shadowColor=colors[p.type];ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(px,py,GRID*0.4+Math.sin(p.pulse)*3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icons[p.type],px,py);
    ctx.globalAlpha=1;
  });
  powerups=powerups.filter(p=>p.life>0);
}

// === AI SNAKES ===
function spawnAISnake(){
  const len=4+Math.floor(Math.random()*4);
  const sx=Math.floor(Math.random()*cols);const sy=Math.floor(Math.random()*rows);
  const aiColors=['#ef4444','#f97316','#eab308','#a855f7','#f472b6'];
  const body=[];for(let i=0;i<len;i++)body.push({x:sx-i,y:sy});
  aiSnakes.push({body,dir:{x:1,y:0},color:aiColors[Math.floor(Math.random()*aiColors.length)],
    turnTimer:0,turnInterval:8+Math.floor(Math.random()*12),speed:Math.max(1,3-Math.floor(level/3)),moveCount:0});
}
function updateAISnakes(){
  aiSnakes.forEach(ai=>{
    ai.moveCount++;
    if(ai.moveCount%ai.speed!==0)return;
    ai.turnTimer++;
    if(ai.turnTimer>=ai.turnInterval){
      ai.turnTimer=0;
      // Random turn or chase nearest pellet
      if(pellets.length>0&&Math.random()<0.5){
        const head=ai.body[0];let nearest=pellets[0],nd=Infinity;
        pellets.forEach(p=>{const d=Math.abs(p.x-head.x)+Math.abs(p.y-head.y);if(d<nd){nd=d;nearest=p}});
        const dx=nearest.x-head.x,dy=nearest.y-head.y;
        if(Math.abs(dx)>Math.abs(dy))ai.dir={x:Math.sign(dx),y:0};
        else ai.dir={x:0,y:Math.sign(dy)||1};
      } else {
        const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
        const opposite={x:-ai.dir.x,y:-ai.dir.y};
        const valid=dirs.filter(d=>!(d.x===opposite.x&&d.y===opposite.y));
        ai.dir=valid[Math.floor(Math.random()*valid.length)];
      }
    }
    const newHead={x:ai.body[0].x+ai.dir.x,y:ai.body[0].y+ai.dir.y};
    // Wrap
    if(newHead.x<0)newHead.x=cols-1;if(newHead.x>=cols)newHead.x=0;
    if(newHead.y<0)newHead.y=rows-1;if(newHead.y>=rows)newHead.y=0;
    ai.body.unshift(newHead);
    // Check if AI eats pellet
    const pi=pellets.findIndex(p=>p.x===newHead.x&&p.y===newHead.y);
    if(pi>=0){pellets.splice(pi,1);spawnPellet()}
    else ai.body.pop();
  });
}
function drawAISnakes(){
  aiSnakes.forEach(ai=>{
    ai.body.forEach((seg,i)=>{
      const alpha=1-i/(ai.body.length*2);
      ctx.globalAlpha=Math.max(0.4,alpha);
      ctx.fillStyle=ai.color;
      const x=seg.x*GRID+1,y=seg.y*GRID+1;
      ctx.beginPath();ctx.roundRect(x,y,GRID-2,GRID-2,i===0?6:3);ctx.fill();
      if(i===0){
        ctx.fillStyle='#fff';
        const ex=seg.x*GRID+GRID/2+ai.dir.x*4,ey=seg.y*GRID+GRID/2+ai.dir.y*4-3;
        ctx.beginPath();ctx.arc(ex-3,ey,2.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(ex+3,ey,2.5,0,Math.PI*2);ctx.fill();
      }
    });ctx.globalAlpha=1;
  });
}

// === DRAW PLAYER SNAKE ===
function drawSnake(){
  snake.forEach((seg,i)=>{
    const color=getSegmentColor(i,snake.length);
    ctx.fillStyle=color;
    const x=seg.x*GRID+1,y=seg.y*GRID+1;
    ctx.shadowColor=color;ctx.shadowBlur=i===0?8:3;
    ctx.beginPath();ctx.roundRect(x,y,GRID-2,GRID-2,i===0?7:4);ctx.fill();
    ctx.shadowBlur=0;
    // Pattern overlays
    if(selectedPattern==='spots'&&i%3===0&&i>0){
      ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();
      ctx.arc(x+GRID/2,y+GRID/2,GRID*0.2,0,Math.PI*2);ctx.fill();
    }
    if(selectedPattern==='striped'&&i%2===0){
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fillRect(x+3,y+1,GRID-8,GRID-4);
    }
    if(i===0){
      // Eyes
      ctx.fillStyle='#fff';
      const ex=seg.x*GRID+GRID/2+dir.x*5,ey=seg.y*GRID+GRID/2+dir.y*5-3;
      ctx.beginPath();ctx.arc(ex-4,ey,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex+4,ey,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(ex-4+dir.x,ey+dir.y,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex+4+dir.x,ey+dir.y,1.5,0,Math.PI*2);ctx.fill();
      // Tongue when moving
      if(tick%20<10){
        ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;
        const tx=seg.x*GRID+GRID/2+dir.x*GRID*0.6;
        const ty=seg.y*GRID+GRID/2+dir.y*GRID*0.6;
        ctx.beginPath();ctx.moveTo(seg.x*GRID+GRID/2+dir.x*10,seg.y*GRID+GRID/2+dir.y*10);
        ctx.lineTo(tx,ty);ctx.stroke();
      }
    }
  });
}

// === BACKGROUND ===
function initBgStars(){bgStars=[];for(let i=0;i<80;i++)bgStars.push({x:Math.random()*2000,y:Math.random()*2000,size:0.5+Math.random()*1.5,blink:Math.random()*Math.PI*2})}
function drawBg(){
  // Gradient background
  const grad=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H));
  grad.addColorStop(0,'#1a1050');grad.addColorStop(0.5,'#0f0b1a');grad.addColorStop(1,'#0a0612');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Grid lines
  ctx.strokeStyle='rgba(124,58,237,0.08)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // Edge glow
  ctx.fillStyle='rgba(16,185,129,0.06)';ctx.fillRect(0,0,W,3);ctx.fillRect(0,H-3,W,3);
  ctx.fillRect(0,0,3,H);ctx.fillRect(W-3,0,3,H);
  // Stars
  bgStars.forEach(s=>{s.blink+=0.02;ctx.globalAlpha=0.4+Math.sin(s.blink)*0.4;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x%W,s.y%H,s.size,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
  // Corner decorations
  const cornerSize=80;
  ctx.fillStyle='rgba(124,58,237,0.1)';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(cornerSize,0);ctx.lineTo(0,cornerSize);ctx.fill();
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W-cornerSize,0);ctx.lineTo(W,cornerSize);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(cornerSize,H);ctx.lineTo(0,H-cornerSize);ctx.fill();
  ctx.beginPath();ctx.moveTo(W,H);ctx.lineTo(W-cornerSize,H);ctx.lineTo(W,H-cornerSize);ctx.fill();
}

// === GAME LOGIC ===
let shieldActive=false,shieldTimer=0,speedBoost=false,speedTimer=0;

function moveSnake(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  // Wrap
  if(head.x<0)head.x=cols-1;if(head.x>=cols)head.x=0;
  if(head.y<0)head.y=rows-1;if(head.y>=rows)head.y=0;
  // Check self collision
  if(!shieldActive&&snake.some(s=>s.x===head.x&&s.y===head.y)){die();return}
  // Check AI collision
  if(!shieldActive){
    for(const ai of aiSnakes){
      if(ai.body.some(s=>s.x===head.x&&s.y===head.y)){die();return}
    }
  }
  snake.unshift(head);
  // Check pellet
  const pi=pellets.findIndex(p=>p.x===head.x&&p.y===head.y);
  if(pi>=0){
    const pellet=pellets[pi];pellets.splice(pi,1);
    const pts=pellet.type==='golden'?50:10;
    score+=pts;pelletsEaten++;
    addFloat(head.x*GRID+GRID/2,head.y*GRID,'+'+pts,pellet.type==='golden'?'#ffd700':'#10b981',pellet.type==='golden'?24:18);
    addParticle(head.x*GRID+GRID/2,head.y*GRID+GRID/2,pellet.type==='golden'?'power':'eat',12);
    playSound(pellet.type==='golden'?'powerup':'eat');
    camShake=pellet.type==='golden'?8:3;
    spawnPellet();
    // Level up every 10 pellets
    if(pelletsEaten%10===0){
      level++;moveInterval=Math.max(60,150-level*8);
      playSound('levelup');addFloat(W/2,H/3,'LEVEL '+level+'!','#7c3aed',32);
      camShake=10;
      if(level%2===0&&aiSnakes.length<5)spawnAISnake();
      if(level%3===0)spawnPowerup();
    }
  } else {
    snake.pop();
  }
  // Check powerup
  const pui=powerups.findIndex(p=>p.x===head.x&&p.y===head.y);
  if(pui>=0){
    const pu=powerups[pui];powerups.splice(pui,1);
    playSound('powerup');addParticle(head.x*GRID+GRID/2,head.y*GRID+GRID/2,'power',15);
    camShake=5;
    if(pu.type==='shield'){shieldActive=true;shieldTimer=200;addFloat(W/2,H/3,'🛡 Shield!','#7c3aed',26)}
    else if(pu.type==='speed'){speedBoost=true;speedTimer=150;moveInterval=Math.max(40,moveInterval-30);addFloat(W/2,H/3,'⚡ Speed!','#06b6d4',26)}
    else if(pu.type==='slow'){aiSnakes.forEach(ai=>ai.speed=Math.min(5,ai.speed+2));addFloat(W/2,H/3,'🐢 AI Slowed!','#f59e0b',26)}
  }
  // Timers
  if(shieldActive){shieldTimer--;if(shieldTimer<=0)shieldActive=false}
  if(speedBoost){speedTimer--;if(speedTimer<=0){speedBoost=false;moveInterval=Math.max(60,150-level*8)}}
  updateHUD();
}

function die(){
  gameRunning=false;gameOver=true;
  playSound('die');camShake=15;
  snake.forEach(s=>addParticle(s.x*GRID+GRID/2,s.y*GRID+GRID/2,'die',5));
  document.getElementById('goScore').textContent='Score: '+score;
  document.getElementById('goLength').textContent='Snake Length: '+snake.length;
  document.getElementById('goLevel').textContent='Level: '+level;
  document.getElementById('goPellets').textContent='Pellets Eaten: '+pelletsEaten;
  document.getElementById('gameOver').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('dpad').style.display='none';
}

function updateHUD(){
  document.getElementById('scoreDisplay').textContent='Score: '+score;
  document.getElementById('levelDisplay').textContent='Level '+level+' | Length: '+snake.length;
}

// === MAIN LOOP ===
let lastTime=0;
function loop(now){
  try{
    tick++;const dt=now-lastTime;
    if(gameRunning){
      moveTimer+=dt;
      while(moveTimer>=moveInterval){moveTimer-=moveInterval;moveSnake()}
      updateAISnakes();
    }
    updateParticles();updateFloats();
    camShake*=0.9;
    const shakeX=(Math.random()-0.5)*camShake;const shakeY=(Math.random()-0.5)*camShake;
    ctx.save();ctx.translate(shakeX,shakeY);
    drawBg();
    if(!gameRunning&&!gameOver){attractUpdate();drawPellets();drawDemoSnake()}
    if(gameRunning||gameOver){
      drawPellets();drawPowerups();drawAISnakes();drawSnake();
      // Shield glow
      if(shieldActive&&snake.length>0){
        ctx.strokeStyle='rgba(124,58,237,0.4)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(snake[0].x*GRID+GRID/2,snake[0].y*GRID+GRID/2,GRID*0.8+Math.sin(tick*0.1)*3,0,Math.PI*2);ctx.stroke();
      }
    }
    drawParticles();drawFloats();
    ctx.restore();
    lastTime=now;
  }catch(e){console.error(e)}
  requestAnimationFrame(loop);
}

// === INPUT ===
document.addEventListener('keydown',e=>{
  if(!gameRunning)return;
  if((e.key==='ArrowUp'||e.key==='w')&&dir.y!==1){nextDir={x:0,y:-1};playSound('turn')}
  if((e.key==='ArrowDown'||e.key==='s')&&dir.y!==-1){nextDir={x:0,y:1};playSound('turn')}
  if((e.key==='ArrowLeft'||e.key==='a')&&dir.x!==1){nextDir={x:-1,y:0};playSound('turn')}
  if((e.key==='ArrowRight'||e.key==='d')&&dir.x!==-1){nextDir={x:1,y:0};playSound('turn')}
});
// D-pad
function setupDpad(){
  const isMobile='ontouchstart'in window||navigator.maxTouchPoints>0;
  if(isMobile)document.getElementById('dpad').style.display='block';
  const dirs={dUp:{x:0,y:-1,block:'y',val:1},dDown:{x:0,y:1,block:'y',val:-1},dLeft:{x:-1,y:0,block:'x',val:1},dRight:{x:1,y:0,block:'x',val:-1}};
  Object.entries(dirs).forEach(([id,d])=>{
    const el=document.getElementById(id);
    const handler=e=>{e.preventDefault();if(!gameRunning)return;
      if(dir[d.block]!==d.val){nextDir={x:d.x,y:d.y};playSound('turn')}};
    el.addEventListener('touchstart',handler,{passive:false});el.addEventListener('mousedown',handler);
  });
}
// Swipe
let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!gameRunning)return;
  const dx=e.changedTouches[0].clientX-touchStartX;const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0&&dir.x!==-1){nextDir={x:1,y:0};playSound('turn')}
    else if(dx<0&&dir.x!==1){nextDir={x:-1,y:0};playSound('turn')}
  }else{
    if(dy>0&&dir.y!==-1){nextDir={x:0,y:1};playSound('turn')}
    else if(dy<0&&dir.y!==1){nextDir={x:0,y:-1};playSound('turn')}
  }
});

// === START GAME ===
function startGame(){
  ensureAudio();startAmbient();
  resize();initGrid();initBgStars();
  snake=[];const sx=Math.floor(cols/2),sy=Math.floor(rows/2);
  for(let i=0;i<3;i++)snake.push({x:sx-i,y:sy});
  dir={x:1,y:0};nextDir={x:1,y:0};
  pellets=[];powerups=[];aiSnakes=[];particles=[];floatingTexts=[];
  score=0;level=1;pelletsEaten=0;moveTimer=0;moveInterval=150;
  shieldActive=false;speedBoost=false;gameOver=false;gameRunning=true;camShake=0;
  for(let i=0;i<5;i++)spawnPellet();
  spawnAISnake();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOver').style.display='none';
  document.getElementById('hud').style.display='block';
  setupDpad();updateHUD();
}

document.getElementById('designBtn').onclick=()=>{
  designShowing=!designShowing;
  document.getElementById('designArea').style.display=designShowing?'flex':'none';
};
document.getElementById('playBtn').onclick=startGame;
document.getElementById('replayBtn').onclick=startGame;
initDesignUI();
// Attract mode with demo
initBgStars();
initGrid();
// Spawn demo elements for attract screen
for(let i=0;i<5;i++)spawnPellet();
let demoSnake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];
let demoDir={x:1,y:0};
let demoTick=0;
function attractUpdate(){
  demoTick++;
  if(demoTick%10===0){
    const head={x:demoSnake[0].x+demoDir.x,y:demoSnake[0].y+demoDir.y};
    if(head.x<0)head.x=cols-1;if(head.x>=cols)head.x=0;
    if(head.y<0)head.y=rows-1;if(head.y>=rows)head.y=0;
    demoSnake.unshift(head);
    if(demoSnake.length>8)demoSnake.pop();
    if(Math.random()<0.15){
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const opp={x:-demoDir.x,y:-demoDir.y};
      const valid=dirs.filter(d=>!(d.x===opp.x&&d.y===opp.y));
      demoDir=valid[Math.floor(Math.random()*valid.length)];
    }
  }
}
function drawDemoSnake(){
  demoSnake.forEach((seg,i)=>{
    ctx.globalAlpha=0.6-i*0.05;ctx.fillStyle=getSegmentColor(i,demoSnake.length);
    ctx.beginPath();ctx.roundRect(seg.x*GRID+1,seg.y*GRID+1,GRID-2,GRID-2,i===0?7:4);ctx.fill();
  });ctx.globalAlpha=1;
}
requestAnimationFrame(loop);
</script>
