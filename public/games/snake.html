<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake — NAW Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  canvas#c {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
  }

  /* ─── Overlays ─── */
  #startScreen, #gameOverScreen, #designScreen {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(6,6,20,0.95);
    transition: opacity 0.3s;
  }
  .hidden { display: none !important; }

  .title {
    font-size: clamp(2rem, 8vw, 4rem);
    font-weight: 900;
    background: linear-gradient(135deg, #00ff88, #00ccff, #ff44cc);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(0,255,136,0.3);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .subtitle {
    color: rgba(255,255,255,0.5);
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    margin-bottom: 32px;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 36px;
    border: none; border-radius: 14px;
    font-size: 1.1rem; font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    color: #fff;
  }
  .btn:active { transform: scale(0.95); }
  .btn-play {
    background: linear-gradient(135deg, #00cc66, #00aa55);
    box-shadow: 0 4px 20px rgba(0,204,102,0.4);
  }
  .btn-play:hover { box-shadow: 0 6px 30px rgba(0,204,102,0.6); }
  .btn-design {
    background: linear-gradient(135deg, #8844ff, #6622cc);
    box-shadow: 0 4px 20px rgba(136,68,255,0.3);
    margin-top: 12px;
  }
  .btn-retry {
    background: linear-gradient(135deg, #ff4466, #cc2244);
    box-shadow: 0 4px 20px rgba(255,68,102,0.4);
  }
  .btn-small {
    padding: 10px 24px;
    font-size: 0.9rem;
    border-radius: 10px;
  }

  .controls-hint {
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    margin-top: 24px;
    text-align: center;
    line-height: 1.6;
  }

  /* ─── Game Over ─── */
  .go-title {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 900;
    color: #ff4466;
    margin-bottom: 6px;
  }
  .go-score {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 900;
    color: #fff;
    margin: 8px 0;
  }
  .go-label { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
  .go-stats {
    display: flex; gap: 24px;
    margin: 16px 0 28px;
  }
  .go-stat {
    text-align: center;
  }
  .go-stat-val {
    font-size: 1.4rem; font-weight: 800; color: #00ff88;
  }
  .go-stat-label {
    font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 2px;
  }
  .go-best {
    color: #ffcc00;
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .go-buttons { display: flex; gap: 12px; }

  /* ─── Design Screen ─── */
  .design-panel {
    background: rgba(20,20,40,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px;
    max-width: 340px;
    width: 90%;
  }
  .design-title {
    font-size: 1.3rem; font-weight: 800; color: #fff;
    text-align: center; margin-bottom: 16px;
  }
  .design-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .design-label {
    color: rgba(255,255,255,0.6); font-size: 0.85rem;
    min-width: 80px;
  }
  .color-grid {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #fff; transform: scale(1.15); }
  .pattern-grid {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .pattern-btn {
    padding: 6px 14px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
    font-size: 0.8rem; font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pattern-btn:hover { border-color: rgba(255,255,255,0.3); }
  .pattern-btn.active {
    border-color: #00ff88;
    color: #00ff88;
    background: rgba(0,255,136,0.1);
  }
  .design-preview {
    width: 100%; height: 60px;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    margin: 16px 0;
    overflow: hidden;
  }
  .design-preview canvas { width: 100%; height: 100%; }
  .design-actions {
    display: flex; gap: 10px; justify-content: center;
  }

  /* ─── HUD ─── */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px;
    pointer-events: none;
  }
  .hud-score {
    font-size: 1.4rem; font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .hud-right {
    display: flex; gap: 16px; align-items: center;
  }
  .hud-level {
    font-size: 0.8rem; font-weight: 700;
    color: #00ccff;
    background: rgba(0,204,255,0.15);
    padding: 4px 12px;
    border-radius: 20px;
  }
  .hud-best {
    font-size: 0.75rem; font-weight: 600;
    color: rgba(255,204,0,0.8);
  }

  /* ─── Mobile D-Pad ─── */
  #dpad {
    position: fixed;
    z-index: 40;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 160px;
    display: none;
  }
  @media (pointer: coarse) {
    #dpad { display: block; }
  }
  .dpad-btn {
    position: absolute;
    width: 52px; height: 52px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 1.2rem;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(0,255,136,0.25);
    border-color: rgba(0,255,136,0.5);
    color: #00ff88;
  }
  .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); }
  .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
  .dpad-left  { left: 0; top: 50%; transform: translateY(-50%); }
  .dpad-right { right: 0; top: 50%; transform: translateY(-50%); }

  /* ─── Level Up Toast ─── */
  #levelToast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 60;
    font-size: 2rem;
    font-weight: 900;
    color: #00ccff;
    text-shadow: 0 0 30px rgba(0,204,255,0.6);
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    opacity: 0;
  }
  #levelToast.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* Swipe hint overlay */
  #swipeHint {
    position: fixed;
    z-index: 40;
    inset: 0;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Start Screen -->
<div id="startScreen">
  <div class="title">🐍 SNAKE</div>
  <div class="subtitle">Eat, grow, survive!</div>
  <button class="btn btn-play" id="startBtn" onclick="startGame()">▶ Play</button>
  <button class="btn btn-design" onclick="openDesign()">🎨 Design Snake</button>
  <div class="controls-hint">
    Arrow keys / WASD to move<br>
    Swipe or D-Pad on mobile
  </div>
</div>

<!-- Design Screen -->
<div id="designScreen" class="hidden">
  <div class="design-panel">
    <div class="design-title">🎨 Snake Designer</div>

    <div class="design-row">
      <div class="design-label">Color</div>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="design-row">
      <div class="design-label">Eyes</div>
      <div class="color-grid" id="eyeGrid"></div>
    </div>

    <div class="design-row">
      <div class="design-label">Pattern</div>
      <div class="pattern-grid" id="patternGrid"></div>
    </div>

    <div class="design-preview">
      <canvas id="previewCanvas"></canvas>
    </div>

    <div class="design-actions">
      <button class="btn btn-small btn-play" onclick="closeDesign()">✓ Done</button>
      <button class="btn btn-small" style="background:rgba(255,255,255,0.1)" onclick="closeDesign()">Cancel</button>
    </div>
  </div>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen" class="hidden">
  <div class="go-title">GAME OVER</div>
  <div class="go-label">Score</div>
  <div class="go-score" id="finalScore">0</div>
  <div class="go-stats">
    <div class="go-stat">
      <div class="go-stat-val" id="finalLength">0</div>
      <div class="go-stat-label">Length</div>
    </div>
    <div class="go-stat">
      <div class="go-stat-val" id="finalLevel">0</div>
      <div class="go-stat-label">Level</div>
    </div>
    <div class="go-stat">
      <div class="go-stat-val" id="finalTime">0s</div>
      <div class="go-stat-label">Time</div>
    </div>
  </div>
  <div class="go-best hidden" id="newBest">⭐ NEW BEST!</div>
  <div class="go-buttons">
    <button class="btn btn-retry" onclick="startGame()">↻ Retry</button>
    <button class="btn btn-small" style="background:rgba(255,255,255,0.1)" onclick="goHome()">Home</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-score" id="hudScore">0</div>
  <div class="hud-right">
    <div class="hud-level" id="hudLevel">Level 1</div>
    <div class="hud-best" id="hudBest"></div>
  </div>
</div>

<!-- Level Up Toast -->
<div id="levelToast"></div>

<!-- Mobile D-Pad -->
<div id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">▲</div>
  <div class="dpad-btn dpad-down" data-dir="down">▼</div>
  <div class="dpad-btn dpad-left" data-dir="left">◀</div>
  <div class="dpad-btn dpad-right" data-dir="right">▶</div>
</div>

<!-- Swipe Hint -->
<div id="swipeHint"></div>

<canvas id="c"></canvas>

<script>
// ═══════════════════════════════════════════
//  AUDIO ENGINE
// ═══════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.connect(audioCtx.destination);

  if (type === 'eat') {
    // Satisfying crunch + rising tone
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(500, t);
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
    // Pop
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(1400, t + 0.02);
    o2.frequency.exponentialRampToValueAtTime(800, t + 0.08);
    g2.gain.setValueAtTime(0.15, t + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o2.connect(g2); g2.connect(master);
    o2.start(t + 0.02); o2.stop(t + 0.12);
    master.gain.setValueAtTime(0.5, t);
  }
  else if (type === 'bonus') {
    // Sparkling collect
    const notes = [800, 1000, 1200, 1600];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t + i * 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.2);
      o.connect(g); g.connect(master);
      o.start(t + i * 0.05); o.stop(t + i * 0.05 + 0.2);
    });
    master.gain.setValueAtTime(0.4, t);
  }
  else if (type === 'levelup') {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.12);
      g.gain.linearRampToValueAtTime(0.15, t + i * 0.12 + 0.04);
      g.gain.linearRampToValueAtTime(0, t + i * 0.12 + 0.4);
      o.connect(g); g.connect(master);
      o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.4);
    });
    master.gain.setValueAtTime(0.5, t);
  }
  else if (type === 'die') {
    // Descending wah
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.8);
    g.gain.setValueAtTime(0.3, t);
    g.gain.linearRampToValueAtTime(0, t + 1.0);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.0);
    // Noise burst
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.1));
    const ns = audioCtx.createBufferSource(); ns.buffer = buf;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.2, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    ns.connect(ng); ng.connect(master);
    ns.start(t); ns.stop(t + 0.5);
    master.gain.setValueAtTime(0.5, t);
  }
  else if (type === 'turn') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(600, t);
    o.frequency.exponentialRampToValueAtTime(400, t + 0.04);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.06);
    master.gain.setValueAtTime(0.25, t);
  }
  else if (type === 'click') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(800, t);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.05);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.08);
    master.gain.setValueAtTime(0.3, t);
  }
}

// ═══════════════════════════════════════════
//  CANVAS SETUP
// ═══════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ═══════════════════════════════════════════
//  PARTICLE SYSTEM
// ═══════════════════════════════════════════
let particles = [];

function addParticle(x, y, type, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    let life, r, g, b, size;
    if (type === 'eat') {
      life = 20 + Math.random() * 20;
      r = 255; g = 200 + Math.random() * 55; b = 50;
      size = 3 + Math.random() * 4;
    } else if (type === 'die') {
      life = 30 + Math.random() * 30;
      r = 255; g = 60 + Math.random() * 60; b = 60;
      size = 4 + Math.random() * 6;
    } else if (type === 'bonus') {
      life = 25 + Math.random() * 20;
      r = 100 + Math.random() * 155; g = 200 + Math.random() * 55; b = 255;
      size = 2 + Math.random() * 4;
    } else if (type === 'trail') {
      life = 8 + Math.random() * 8;
      r = 0; g = 255; b = 136;
      size = 1.5 + Math.random() * 2;
    } else if (type === 'levelup') {
      life = 40 + Math.random() * 30;
      const t2 = Math.random();
      r = t2 > 0.5 ? 0 : 255; g = t2 > 0.5 ? 204 : 204; b = 255;
      size = 3 + Math.random() * 5;
    }
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life, maxLife: life,
      r, g, b, size, type
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const ratio = p.life / p.maxLife;
    ctx.globalAlpha = ratio * 0.8;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    const s = p.size * ratio;
    if (p.type === 'die' || p.type === 'levelup') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
//  SCREEN SHAKE
// ═══════════════════════════════════════════
let camShake = 0;
let camOffX = 0, camOffY = 0;

function updateShake() {
  if (camShake > 0.5) {
    camOffX = (Math.random() - 0.5) * camShake;
    camOffY = (Math.random() - 0.5) * camShake;
    camShake *= 0.88;
  } else {
    camShake = 0;
    camOffX = 0;
    camOffY = 0;
  }
}

// ═══════════════════════════════════════════
//  FLOATING TEXT
// ═══════════════════════════════════════════
let floatingTexts = [];

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 50, maxLife: 50 });
}

function updateFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.2;
    ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const ratio = ft.life / ft.maxLife;
    ctx.globalAlpha = ratio;
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${14 + (1 - ratio) * 6}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x + camOffX, ft.y + camOffY);
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
//  GAME CONFIG
// ═══════════════════════════════════════════
const CELL = 20;        // Grid cell size in pixels
let COLS, ROWS;         // Grid dimensions
let OFFSET_X, OFFSET_Y; // Centering offset

function calcGrid() {
  // Leave room for HUD and d-pad
  const usableW = W - 20;
  const usableH = H - 60;
  COLS = Math.floor(usableW / CELL);
  ROWS = Math.floor(usableH / CELL);
  // Minimum size
  if (COLS < 15) COLS = 15;
  if (ROWS < 15) ROWS = 15;
  // Max size to keep it reasonable
  if (COLS > 40) COLS = 40;
  if (ROWS > 30) ROWS = 30;
  OFFSET_X = Math.floor((W - COLS * CELL) / 2);
  OFFSET_Y = Math.floor((H - ROWS * CELL) / 2) + 20;
}

// Speed: ms between moves. Starts slow, gentle ramp
const BASE_MOVE_INTERVAL = 180;  // Much slower start
const MIN_MOVE_INTERVAL = 85;    // Don't get crazy fast
const SPEED_DECREASE_PER_LEVEL = 8; // Gentle decrease

// ═══════════════════════════════════════════
//  SNAKE DESIGN
// ═══════════════════════════════════════════
const SNAKE_COLORS = [
  '#00ff88', '#00ccff', '#ff44cc', '#ffcc00',
  '#ff6644', '#aa44ff', '#44ffcc', '#ff8800',
  '#66ff44', '#ff4466', '#4488ff', '#ffffff'
];

let snake = [];           // Array of {x, y} grid positions
let direction = { x: 1, y: 0 };  // Current direction
let inputQueue = [];      // Queued direction changes (max 3)
let food = null;
let bonusFood = null;
let bonusTimer = 0;
let score = 0;
let level = 1;
let moveTimer = 0;
let moveInterval = BASE_MOVE_INTERVAL;
let gameRunning = false;
let gameStartTime = 0;
let pelletsEaten = 0;

// Smooth interpolation
let moveProgress = 0;    // 0 to 1, how far between grid moves
let prevPositions = [];   // Previous positions for interpolation

// Wall mode (walls kill or wrap)
let wallMode = 'wrap';    // 'wrap' or 'wall'

// ═══════════════════════════════════════════
//  DIRECTION HELPERS
// ═══════════════════════════════════════════
const DIR = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 }
};

function isOpposite(d1, d2) {
  return d1.x === -d2.x && d1.y === -d2.y;
}

function sameDir(d1, d2) {
  return d1.x === d2.x && d1.y === d2.y;
}

function queueDirection(newDir) {
  // Get the effective current direction (considering queued moves)
  const lastQueued = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
  // Don't queue opposite or same direction
  if (isOpposite(newDir, lastQueued)) return;
  if (sameDir(newDir, lastQueued)) return;
  // Max queue size = 3
  if (inputQueue.length >= 3) return;
  inputQueue.push(newDir);
  playSound('turn');
}

// ═══════════════════════════════════════════
//  INPUT — KEYBOARD
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W':
      e.preventDefault(); queueDirection(DIR.up); break;
    case 'ArrowDown': case 's': case 'S':
      e.preventDefault(); queueDirection(DIR.down); break;
    case 'ArrowLeft': case 'a': case 'A':
      e.preventDefault(); queueDirection(DIR.left); break;
    case 'ArrowRight': case 'd': case 'D':
      e.preventDefault(); queueDirection(DIR.right); break;
  }
});

let touchStartX = 0, touchStartY = 0;
let touchStartTime = 0;

canvas.addEventListener('touchstart', e => {
  if (!gameRunning) return;
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchStartTime = Date.now();
}, { passive: true });

canvas.addEventListener('touchend', e => {
  if (!gameRunning) return;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const elapsed = Date.now() - touchStartTime;

  // Quick swipe: at least 15px within 300ms
  if (dist > 15 && elapsed < 300) {
    if (Math.abs(dx) > Math.abs(dy)) {
      queueDirection(dx > 0 ? DIR.right : DIR.left);
    } else {
      queueDirection(dy > 0 ? DIR.down : DIR.up);
    }
  }
}, { passive: true });

// ═══════════════════════════════════════════
//  FOOD SPAWNING
// ═══════════════════════════════════════════
const FOOD_TYPES = [
  { emoji: '🍎', points: 10, color: '#ff4444' },
  { emoji: '🍊', points: 10, color: '#ff8800' },
  { emoji: '🍇', points: 10, color: '#aa44ff' },
  { emoji: '🍓', points: 10, color: '#ff2266' },
  { emoji: '🍒', points: 10, color: '#cc0033' },
];
const BONUS_TYPES = [
  { emoji: '⭐', points: 50, color: '#ffcc00' },
  { emoji: '💎', points: 100, color: '#00ccff' },
  { emoji: '🌟', points: 75, color: '#ffaa00' },
];

function randomFreeCell() {
  let attempts = 0;
  while (attempts < 500) {
    const x = Math.floor(Math.random() * COLS);
    const y = Math.floor(Math.random() * ROWS);
    // Check not on snake
    if (!snake.some(s => s.x === x && s.y === y)) {
      // Check not on other food
      if (!food || (food.x !== x || food.y !== y)) {
        if (!bonusFood || (bonusFood.x !== x || bonusFood.y !== y)) {
          return { x, y };
        }
      }
    }
    attempts++;
  }
  return { x: 0, y: 0 };
}

function spawnFood() {
  const pos = randomFreeCell();
  const type = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
  food = { ...pos, ...type, pulse: 0 };
}

function spawnBonus() {
  const pos = randomFreeCell();
  const type = BONUS_TYPES[Math.floor(Math.random() * BONUS_TYPES.length)];
  bonusFood = { ...pos, ...type, pulse: 0 };
  bonusTimer = 300; // ~5 seconds at 60fps
}

// ═══════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════
function startGame() {
  ensureAudio();
  playSound('click');
  resize();
  calcGrid();

  // Init snake in center, 4 segments
  const startX = Math.floor(COLS / 2);

  for (let i = 0; i < 4; i++) {
    snake.push({ x: startX - i, y: startY });
  }
  // Store prev positions for interpolation
  prevPositions = snake.map(s => ({ x: s.x, y: s.y }));

  direction = { x: 1, y: 0 };
  inputQueue = [];
  score = 0;
  level = 1;
  pelletsEaten = 0;
  moveInterval = BASE_MOVE_INTERVAL;
  moveTimer = 0;
  moveProgress = 0;
  gameRunning = true;

  bonusFood = null;
  bonusTimer = 0;

  floatingTexts = [];

  document.getElementById('gameOverScreen').classList.add('hidden');

}

// ═══════════════════════════════════════════
//  GAME LOGIC — MOVE SNAKE
// ═══════════════════════════════════════════
function moveSnake() {
  // Consume from input queue
  if (inputQueue.length > 0) {
    const nextDir = inputQueue.shift();
    // Final safety check: don't allow opposite
    if (!isOpposite(nextDir, direction)) {
      direction = nextDir;
    }
  }

  // Save previous positions for smooth interpolation
  prevPositions = snake.map(s => ({ x: s.x, y: s.y }));

  // Calculate new head position
  let newX = snake[0].x + direction.x;
  let newY = snake[0].y + direction.y;

  // Wrap around
  if (wallMode === 'wrap') {
    if (newX < 0) newX = COLS - 1;
    if (newX >= COLS) newX = 0;
    if (newY < 0) newY = ROWS - 1;
    if (newY >= ROWS) newY = 0;
  } else {
    // Wall mode — die on wall
    if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) {
      gameOver();
      return;
    }
  }

  // Self collision (skip first segment — that's the current head moving away)
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].x === newX && snake[i].y === newY) {
      gameOver();
      return;
    }
  }

  // Move: add new head, remove tail
  const newHead = { x: newX, y: newY };
  snake.unshift(newHead);

  let ate = false;

  // Check food
  if (food && newX === food.x && newY === food.y) {
    ate = true;
    score += food.points * level;
    pelletsEaten++;
    const px = OFFSET_X + food.x * CELL + CELL / 2;
    const py = OFFSET_Y + food.y * CELL + CELL / 2;
    addParticle(px, py, 'eat', 12);
    addFloatingText(px, py - 10, '+' + (food.points * level), '#ffcc00');
    playSound('eat');
    camShake = 4;

    // Level up every 8 pellets
    if (pelletsEaten % 8 === 0) {
      levelUp();
    }

    // Chance to spawn bonus
    if (!bonusFood && Math.random() < 0.25) {
      spawnBonus();
    }

    spawnFood();
  }

  // Check bonus food
  if (bonusFood && newX === bonusFood.x && newY === bonusFood.y) {
    ate = true;
    score += bonusFood.points * level;
    const px = OFFSET_X + bonusFood.x * CELL + CELL / 2;
    const py = OFFSET_Y + bonusFood.y * CELL + CELL / 2;
    addParticle(px, py, 'bonus', 20);
    addFloatingText(px, py - 10, '+' + (bonusFood.points * level), '#00ccff');
    playSound('bonus');
    camShake = 8;
    bonusFood = null;
    bonusTimer = 0;
  }

  if (!ate) {
    snake.pop(); // Remove tail if didn't eat
  } else {
    // Add the new tail entry to prevPositions too
    prevPositions.push(prevPositions[prevPositions.length - 1]);
  }

  updateHUD();
}

function levelUp() {
  level++;
  moveInterval = Math.max(MIN_MOVE_INTERVAL, BASE_MOVE_INTERVAL - (level - 1) * SPEED_DECREASE_PER_LEVEL);
  playSound('levelup');
  camShake = 10;

  // Particles from center
  const cx = W / 2, cy = H / 2;
  addParticle(cx, cy, 'levelup', 30);

  // Show toast
  const toast = document.getElementById('levelToast');
  toast.textContent = '⚡ LEVEL ' + level + '!';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);

  updateHUD();
}

function gameOver() {
  gameRunning = false;
  playSound('die');
  camShake = 15;

  // Death particles from each segment
  for (const seg of snake) {
    const px = OFFSET_X + seg.x * CELL + CELL / 2;
    const py = OFFSET_Y + seg.y * CELL + CELL / 2;
    addParticle(px, py, 'die', 4);
  }

  const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);

  // Check best
  let isNewBest = false;
  if (score > bestScore) {
    bestScore = score;
    saveBest();
    isNewBest = true;
  }

  // Show game over after brief delay
  setTimeout(() => {
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalLength').textContent = snake.length;
    document.getElementById('finalLevel').textContent = level;
    document.getElementById('finalTime').textContent = elapsed + 's';

    const bestEl = document.getElementById('newBest');
    if (isNewBest && score > 0) {
      bestEl.classList.remove('hidden');
    } else {
      bestEl.classList.add('hidden');
    }
  }, 800);
}

function goHome() {
  playSound('click');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

// ═══════════════════════════════════════════
//  DRAWING — GRID
// ═══════════════════════════════════════════
function drawGrid() {
  // Dark background with subtle grid
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Play area background
  const areaX = OFFSET_X + camOffX;
  const areaY = OFFSET_Y + camOffY;
  const areaW = COLS * CELL;
  const areaH = ROWS * CELL;

  // Checkerboard grid for visual texture
  for (let gx = 0; gx < COLS; gx++) {
    for (let gy = 0; gy < ROWS; gy++) {
      ctx.fillStyle = (gx + gy) % 2 === 0 ? '#0d0d26' : '#10102c';
      ctx.fillRect(areaX + gx * CELL, areaY + gy * CELL, CELL, CELL);
    }
  }

  // Border glow
  ctx.strokeStyle = 'rgba(0,255,136,0.15)';
  ctx.lineWidth = 2;
  ctx.strokeRect(areaX - 1, areaY - 1, areaW + 2, areaH + 2);
}

// ═══════════════════════════════════════════
//  DRAWING — FOOD
// ═══════════════════════════════════════════
function drawFood(timestamp) {
  if (!food) return;
  const px = OFFSET_X + food.x * CELL + camOffX;
  const py = OFFSET_Y + food.y * CELL + camOffY;
  const pulse = 1 + Math.sin(timestamp / 300) * 0.12;

  ctx.save();
  ctx.translate(px + CELL / 2, py + CELL / 2);
  ctx.scale(pulse, pulse);

  // Glow
  ctx.shadowColor = food.color;
  ctx.shadowBlur = 12;
  ctx.font = `${CELL - 2}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(food.emoji, 0, 1);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawBonusFood(timestamp) {
  if (!bonusFood) return;
  const px = OFFSET_X + bonusFood.x * CELL + camOffX;
  const py = OFFSET_Y + bonusFood.y * CELL + camOffY;
  const pulse = 1 + Math.sin(timestamp / 150) * 0.18;
  const fade = Math.min(1, bonusTimer / 60); // Fade out near end

  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(px + CELL / 2, py + CELL / 2);
  ctx.scale(pulse, pulse);

  ctx.shadowColor = bonusFood.color;
  ctx.shadowBlur = 18;
  ctx.font = `${CELL + 2}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(bonusFood.emoji, 0, 1);
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
//  DRAWING — SNAKE (SMOOTH)
// ═══════════════════════════════════════════
function getSnakeColor(index, total) {
  const design = snakeDesign;
  const base = design.color;

  if (design.pattern === 'solid') return base;
  if (design.pattern === 'striped') return index % 2 === 0 ? base : shadeColor(base, -30);
  if (design.pattern === 'dotted') return index % 3 === 0 ? '#ffffff' : base;
  if (design.pattern === 'gradient') {
    const t = index / Math.max(1, total - 1);
    return lerpColor(base, shadeColor(base, -60), t);
  }
  if (design.pattern === 'rainbow') {
    const hue = (index * 25) % 360;
    return `hsl(${hue}, 80%, 55%)`;
  }
  return base;
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + percent));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
  const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
  return `rgb(${r},${g},${b})`;
}

function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
  // Parse rgb format
  let br, bg, bb;
  if (b.startsWith('rgb')) {
    const m = b.match(/(\d+)/g);
    br = +m[0]; bg = +m[1]; bb = +m[2];
  } else {
    br = parseInt(b.slice(1, 3), 16); bg = parseInt(b.slice(3, 5), 16); bb = parseInt(b.slice(5, 7), 16);
  }
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return `rgb(${rr},${rg},${rb})`;
}

function drawSnake(timestamp) {
  const total = snake.length;
  const t = moveProgress; // 0..1 smooth interpolation factor

  for (let i = total - 1; i >= 0; i--) {
    // Interpolate position between previous and current
    const curr = snake[i];
    const prev = prevPositions[i] || curr;

    // Handle wrapping interpolation
    let lx = prev.x, ly = prev.y;
    let cx = curr.x, cy = curr.y;

    // If wrapping occurred (distance > half grid), snap instead of interpolate
    if (Math.abs(cx - lx) > COLS / 2) lx = cx;
    if (Math.abs(cy - ly) > ROWS / 2) ly = cy;

    const ix = lx + (cx - lx) * t;
    const iy = ly + (cy - ly) * t;

    const px = OFFSET_X + ix * CELL + camOffX;
    const py = OFFSET_Y + iy * CELL + camOffY;

    const color = getSnakeColor(i, total);
    const isHead = i === 0;

    // Body segment
    const segSize = isHead ? CELL - 2 : CELL - 3 - (i / total) * 2;
    const radius = isHead ? 5 : 4;

    ctx.fillStyle = color;
    if (isHead) {
      ctx.shadowColor = snakeDesign.color;
      ctx.shadowBlur = 10;
    }

    // Rounded rect
    const sx = px + (CELL - segSize) / 2;
    const sy = py + (CELL - segSize) / 2;
    ctx.beginPath();
    ctx.moveTo(sx + radius, sy);
    ctx.lineTo(sx + segSize - radius, sy);
    ctx.quadraticCurveTo(sx + segSize, sy, sx + segSize, sy + radius);
    ctx.lineTo(sx + segSize, sy + segSize - radius);
    ctx.quadraticCurveTo(sx + segSize, sy + segSize, sx + segSize - radius, sy + segSize);
    ctx.lineTo(sx + radius, sy + segSize);
    ctx.quadraticCurveTo(sx, sy + segSize, sx, sy + segSize - radius);
    ctx.lineTo(sx, sy + radius);
    ctx.quadraticCurveTo(sx, sy, sx + radius, sy);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Eyes on head
    if (isHead) {
      const eyeSize = 3.5;
      const eyeOffset = 5;
      let ex1, ey1, ex2, ey2;
      const cx2 = px + CELL / 2;
      const cy2 = py + CELL / 2;

      if (direction.x === 1) { // right
        ex1 = cx2 + eyeOffset - 1; ey1 = cy2 - 4;
        ex2 = cx2 + eyeOffset - 1; ey2 = cy2 + 4;
      } else if (direction.x === -1) { // left
        ex1 = cx2 - eyeOffset + 1; ey1 = cy2 - 4;
        ex2 = cx2 - eyeOffset + 1; ey2 = cy2 + 4;
      } else if (direction.y === -1) { // up
        ex1 = cx2 - 4; ey1 = cy2 - eyeOffset + 1;
        ex2 = cx2 + 4; ey2 = cy2 - eyeOffset + 1;
      } else { // down
        ex1 = cx2 - 4; ey1 = cy2 + eyeOffset - 1;
        ex2 = cx2 + 4; ey2 = cy2 + eyeOffset - 1;
      }

      // Eye whites
      ctx.fillStyle = snakeDesign.eyeColor;
      ctx.beginPath();
      ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
      ctx.fill();

      // Pupils
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(ex1 + direction.x * 1.2, ey1 + direction.y * 1.2, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex2 + direction.x * 1.2, ey2 + direction.y * 1.2, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Tongue (flickers)
      if (Math.sin(timestamp / 120) > 0.2) {
        const tongueLen = 7;
        const tongueX = cx2 + direction.x * (CELL / 2 + 2);
        const tongueY = cy2 + direction.y * (CELL / 2 + 2);
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx2 + direction.x * CELL / 2, cy2 + direction.y * CELL / 2);
        ctx.lineTo(tongueX, tongueY);
        // Fork
        const forkAngle = Math.atan2(direction.y, direction.x);
        ctx.moveTo(tongueX, tongueY);
        ctx.lineTo(tongueX + Math.cos(forkAngle + 0.5) * 3, tongueY + Math.sin(forkAngle + 0.5) * 3);
        ctx.moveTo(tongueX, tongueY);
        ctx.lineTo(tongueX + Math.cos(forkAngle - 0.5) * 3, tongueY + Math.sin(forkAngle - 0.5) * 3);
        ctx.stroke();
      }
    }
  }
}

// ═══════════════════════════════════════════
//  BACKGROUND EFFECTS
// ═══════════════════════════════════════════
let bgStars = [];
function initStars() {
  bgStars = [];
  for (let i = 0; i < 50; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 0.5 + Math.random() * 1.5,
      speed: 0.1 + Math.random() * 0.3,
      alpha: 0.1 + Math.random() * 0.3
    });

}
initStars();

function drawStars(timestamp) {

    ctx.fillStyle = `rgba(255,255,255,${twinkle})`;

}

// ═══════════════════════════════════════════
//  MAIN GAME LOOP
// ═══════════════════════════════════════════
let lastTime = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  try {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    if (gameRunning) {
      // Accumulate move timer
      moveTimer += dt;
      moveProgress = Math.min(1, moveTimer / moveInterval);

      // Time to move?
      if (moveTimer >= moveInterval) {
        moveTimer -= moveInterval;
        moveProgress = 0;
        moveSnake();
      }

      // Update bonus timer
      if (bonusFood) {
        bonusTimer--;
        if (bonusTimer <= 0) {
          bonusFood = null;
        }
      }

      // Occasional trail particles from head
      if (snake.length > 0 && Math.random() < 0.15) {
        const head = snake[0];
        const hx = OFFSET_X + head.x * CELL + CELL / 2 + (Math.random() - 0.5) * 6;
        const hy = OFFSET_Y + head.y * CELL + CELL / 2 + (Math.random() - 0.5) * 6;
        addParticle(hx, hy, 'trail', 1);
      }
    }

    // Update effects (even after game over for death animation)
    updateShake();
    updateParticles();
    updateFloatingTexts();

    // Draw
    drawGrid();
    drawStars(timestamp);

    if (gameRunning || particles.length > 0 || floatingTexts.length > 0) {
      drawFood(timestamp);
      drawBonusFood(timestamp);
      drawSnake(timestamp);
      drawParticles();
      drawFloatingTexts();
    }
  } catch (err) {
    console.error('Game loop error:', err);
  }
}

requestAnimationFrame(gameLoop);

// ═══════════════════════════════════════════
//  DESIGN SCREEN
// ═══════════════════════════════════════════
function openDesign() {
  ensureAudio();
  playSound('click');
  document.getElementById('designScreen').classList.remove('hidden');
  buildDesignUI();
  updateDesignPreview();
}

function closeDesign() {
  playSound('click');
  saveDesign();
  document.getElementById('designScreen').classList.add('hidden');
}

function buildDesignUI() {
  // Color grid
  const colorGrid = document.getElementById('colorGrid');
  colorGrid.innerHTML = '';
  SNAKE_COLORS.forEach(c => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (snakeDesign.color === c ? ' active' : '');
    swatch.style.background = c;
    swatch.onclick = () => {
      snakeDesign.color = c;
      buildDesignUI();
      updateDesignPreview();
      playSound('click');
    };
    colorGrid.appendChild(swatch);
  });

  // Eye color grid
  const eyeGrid = document.getElementById('eyeGrid');
  eyeGrid.innerHTML = '';
  EYE_COLORS.forEach(c => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (snakeDesign.eyeColor === c ? ' active' : '');
    swatch.style.background = c;
    swatch.onclick = () => {
      snakeDesign.eyeColor = c;
      buildDesignUI();
      updateDesignPreview();
      playSound('click');
    };
    eyeGrid.appendChild(swatch);
  });

  // Pattern grid
  const patternGrid = document.getElementById('patternGrid');
  patternGrid.innerHTML = '';
  PATTERNS.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'pattern-btn' + (snakeDesign.pattern === p ? ' active' : '');
    btn.textContent = p.charAt(0).toUpperCase() + p.slice(1);
    btn.onclick = () => {
      snakeDesign.pattern = p;
      buildDesignUI();
      updateDesignPreview();
      playSound('click');
    };
    patternGrid.appendChild(btn);
  });
}

function updateDesignPreview() {
  const canvas = document.getElementById('previewCanvas');
  const c = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  c.clearRect(0, 0, canvas.width, canvas.height);

  const segCount = 12;
  const segW = Math.min(30, (canvas.width - 20) / segCount);
  const startX = (canvas.width - segCount * segW) / 2;
  const cy = canvas.height / 2;

  for (let i = 0; i < segCount; i++) {
    const color = getSnakeColor(i, segCount);
    c.fillStyle = color;
    const x = startX + i * segW;
    const size = i === 0 ? segW - 2 : segW - 4;
    const y = cy - size / 2;

    c.beginPath();
    const r = 4;
    c.moveTo(x + r, y);
    c.lineTo(x + size - r, y);
    c.quadraticCurveTo(x + size, y, x + size, y + r);
    c.lineTo(x + size, y + size - r);
    c.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
    c.lineTo(x + r, y + size);
    c.quadraticCurveTo(x, y + size, x, y + size - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.fill();

    // Eyes on head
    if (i === 0) {
      c.fillStyle = snakeDesign.eyeColor;
      c.beginPath();
      c.arc(x + size - 5, cy - 4, 3, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(x + size - 5, cy + 4, 3, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#111';
      c.beginPath();
      c.arc(x + size - 4, cy - 4, 1.5, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(x + size - 4, cy + 4, 1.5, 0, Math.PI * 2);
      c.fill();
    }
  }
}
