<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Perfect Hotel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #DDA0DD 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            aspect-ratio: 3/2;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 217, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        #startOverlay.hidden {
            display: none;
        }

        .title {
            font-size: 4em;
            font-weight: bold;
            color: #8B008B;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .subtitle {
            font-size: 1.5em;
            color: #9932CC;
            margin-bottom: 40px;
        }

        .playButton {
            padding: 20px 60px;
            font-size: 1.8em;
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            font-weight: bold;
            margin: 10px;
        }

        .playButton:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .playButton:active {
            transform: scale(0.95);
        }

        .levelSelect {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .levelBtn {
            padding: 12px 24px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #DDA0DD, #BA55D3);
            color: white;
            border: 2px solid #8B008B;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .levelBtn:hover {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            transform: scale(1.05);
        }

        .levelBtn.selected {
            background: linear-gradient(135deg, #FF1493, #C71585);
            border: 3px solid #8B008B;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="c"></canvas>
        <div id="startOverlay">
            <h1 class="title">🏨 My Perfect Hotel 🧹</h1>
            <p class="subtitle">Help the maid clean the rooms!</p>
            <button class="playButton" id="playBtn">START GAME</button>
            <div class="levelSelect" id="levelSelect"></div>
        </div>
    </div>

    <script>
        // ============================================================================
        // MY PERFECT HOTEL - Complete Game Code
        // ============================================================================

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const playBtn = document.getElementById('playBtn');
        const levelSelect = document.getElementById('levelSelect');

        // Resize canvas to window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============================================================================
        // GAME STATE & CONSTANTS
        // ============================================================================

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        const TILE_SIZE = 40;
        const ROOM_WIDTH = 400;
        const ROOM_HEIGHT = 300;

        let gameState = {
            currentLevel: 1,
            score: 0,
            timeRemaining: 0,
            gameRunning: false,
            levelComplete: false,
            showLevelComplete: false,
            maidX: 200,
            maidY: 150,
            cleaning: false,
            cleaningProgress: 0,
            currentCleaningItem: null,
            itemsCleaned: 0,
            itemsTotal: 0,
            stars: 0,
            showGameOver: false,
            bossComments: '',
            screenShake: 0,
            scaleRatio: 1,
            selectedLevel: 1
        };

        const LEVELS = {
            1: {
                timeLimit: 60,
                rooms: 1,
                itemTypes: { bed: 2, toilet: 1, trash: 2, floor: 1 },
                bossStrictness: 0.7,
                description: 'Clean 1 Bedroom'
            },
            2: {
                timeLimit: 90,
                rooms: 2,
                itemTypes: { bed: 2, toilet: 2, shower: 1, trash: 3, floor: 2 },
                bossStrictness: 0.6,
                description: 'Clean 2 Rooms'
            },
            3: {
                timeLimit: 120,
                rooms: 3,
                itemTypes: { bed: 3, toilet: 2, shower: 2, trash: 4, floor: 3, window: 2 },
                bossStrictness: 0.5,
                description: 'Clean 3 Rooms'
            },
            4: {
                timeLimit: 100,
                rooms: 3,
                itemTypes: { bed: 4, toilet: 3, shower: 2, trash: 5, floor: 4, window: 3 },
                bossStrictness: 0.4,
                description: 'Clean Everything Fast!'
            },
            5: {
                timeLimit: 150,
                rooms: 4,
                itemTypes: { bed: 5, toilet: 4, shower: 3, trash: 6, floor: 5, window: 4 },
                bossStrictness: 0.3,
                description: 'Ultimate Challenge!'
            }
        };

        // ============================================================================
        // ARRAYS & DATA STRUCTURES - Initialize BEFORE game loop
        // ============================================================================

        let items = [];
        let particles = [];
        let rooms = [];
        let keys = {};
        let touchInput = { x: 0, y: 0, active: false };

        // Audio context
        let audioContext = null;

        // ============================================================================
        // AUDIO SYSTEM
        // ============================================================================

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioContext) initAudio();
            if (audioContext.state === 'suspended') audioContext.resume();

            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            switch(type) {
                case 'spray':
                    osc.frequency.setValueAtTime(3000, now);
                    osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
                    osc.type = 'square';
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'scrub':
                    osc.frequency.setValueAtTime(1500, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
                    osc.type = 'sawtooth';
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'sparkle':
                    osc.frequency.setValueAtTime(4000, now);
                    osc.frequency.exponentialRampToValueAtTime(5000, now + 0.2);
                    osc.type = 'sine';
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'beep':
                    osc.frequency.setValueAtTime(800, now);
                    osc.type = 'square';
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'jingle':
                    const notes = [523, 659, 784, 659];
                    for (let i = 0; i < notes.length; i++) {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.connect(g);
                        g.connect(audioContext.destination);
                        o.frequency.setValueAtTime(notes[i], now + i * 0.15);
                        g.gain.setValueAtTime(0.2, now + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, now + (i + 1) * 0.15);
                        o.start(now + i * 0.15);
                        o.stop(now + (i + 1) * 0.15);
                    }
                    return;
                case 'bossScan':
                    osc.frequency.setValueAtTime(2000, now);
                    osc.frequency.linearRampToValueAtTime(1000, now + 0.3);
                    osc.type = 'sine';
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'deduct':
                    osc.frequency.setValueAtTime(400, now);
                    osc.type = 'square';
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
            }
        }

        // ============================================================================
        // PARTICLE SYSTEM
        // ============================================================================

        function createParticle(x, y, type, count = 1) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const velocity = 2 + Math.random() * 3;

                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * velocity,
                    vy: Math.sin(angle) * velocity,
                    life: 1,
                    type: type,
                    size: 3 + Math.random() * 4
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;

                if (p.type === 'sparkle') {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText('✨', p.x - 6, p.y + 6);
                } else if (p.type === 'dust') {
                    ctx.fillStyle = 'rgba(200, 200, 200, 0.7)';
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                } else if (p.type === 'water') {
                    ctx.fillStyle = 'rgba(100, 150, 255, 0.6)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        // ============================================================================
        // ROOM & ITEM GENERATION
        // ============================================================================

        function generateRooms() {
            rooms = [];
            items = [];

            const levelConfig = LEVELS[gameState.currentLevel];
            const numRooms = levelConfig.rooms;

            for (let r = 0; r < numRooms; r++) {
                const roomX = (r % 2) * ROOM_WIDTH;
                const roomY = Math.floor(r / 2) * ROOM_HEIGHT;

                rooms.push({
                    x: roomX,
                    y: roomY,
                    width: ROOM_WIDTH,
                    height: ROOM_HEIGHT,
                    type: r % 3 === 0 ? 'bedroom' : r % 3 === 1 ? 'bathroom' : 'suite'
                });

                // Generate items based on room type
                const itemCounts = levelConfig.itemTypes;
                let itemId = 0;

                // Distribute items in room
                const positions = generateItemPositions(roomX, roomY, 15);
                let posIdx = 0;

                Object.keys(itemCounts).forEach(type => {
                    for (let i = 0; i < itemCounts[type]; i++) {
                        if (posIdx < positions.length) {
                            const pos = positions[posIdx++];
                            items.push({
                                id: itemId++,
                                type: type,
                                x: pos.x,
                                y: pos.y,
                                clean: false,
                                cleanTime: getCleanTime(type),
                                progress: 0
                            });
                        }
                    }
                });
            }

            gameState.itemsTotal = items.length;
            gameState.itemsCleaned = 0;
        }

        function generateItemPositions(roomX, roomY, count) {
            const positions = [];
            for (let i = 0; i < count; i++) {
                positions.push({
                    x: roomX + 20 + Math.random() * (ROOM_WIDTH - 40),
                    y: roomY + 20 + Math.random() * (ROOM_HEIGHT - 40)
                });
            }
            return positions;
        }

        function getCleanTime(type) {
            const times = {
                bed: 40,
                toilet: 35,
                shower: 45,
                trash: 20,
                floor: 30,
                window: 25,
                dust: 25
            };
            return times[type] || 30;
        }

        // ============================================================================
        // RENDERING
        // ============================================================================

        function drawHotel() {
            ctx.save();

            // Background
            ctx.fillStyle = '#FFF0F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw rooms
            rooms.forEach(room => {
                ctx.save();

                // Room background
                if (room.type === 'bedroom') {
                    ctx.fillStyle = '#FFE4E1';
                } else if (room.type === 'bathroom') {
                    ctx.fillStyle = '#E0FFFF';
                } else {
                    ctx.fillStyle = '#FFF8DC';
                }
                ctx.fillRect(room.x, room.y, room.width, room.height);

                // Room border
                ctx.strokeStyle = '#8B008B';
                ctx.lineWidth = 3;
                ctx.strokeRect(room.x, room.y, room.width, room.height);

                // Room label
                ctx.fillStyle = '#8B008B';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(room.type.toUpperCase(), room.x + 10, room.y + 25);

                ctx.restore();
            });

            // Draw items
            items.forEach(item => {
                drawItem(item);
            });

            // Draw maid character
            drawMaid(gameState.maidX, gameState.maidY);

            // Draw HUD
            drawHUD();

            ctx.restore();
        }

        function drawItem(item) {
            ctx.save();

            const colors = {
                bed: '#FF69B4',
                toilet: '#87CEEB',
                shower: '#4169E1',
                trash: '#808080',
                floor: '#D2B48C',
                window: '#B0E0E6',
                dust: '#A9A9A9'
            };

            const color = colors[item.type] || '#FFB6C1';

            if (item.clean) {
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.5;
            } else {
                ctx.fillStyle = color;
                ctx.globalAlpha = 1;
            }

            const size = 25;
            ctx.fillRect(item.x - size/2, item.y - size/2, size, size);

            // Item symbol
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const symbols = {
                bed: '🛏️',
                toilet: '🚽',
                shower: '🚿',
                trash: '🗑️',
                floor: '🧹',
                window: '🪟',
                dust: '💨'
            };

            ctx.fillText(symbols[item.type] || '✓', item.x, item.y);

            // Clean progress bar
            if (gameState.currentCleaningItem === item.id && gameState.cleaning) {
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 2;
                ctx.strokeRect(item.x - size/2 - 2, item.y - size/2 - 10, size + 4, 5);
                ctx.fillStyle = '#FFD700';
                const progress = (gameState.cleaningProgress / item.cleanTime) * (size + 4);
                ctx.fillRect(item.x - size/2 - 2, item.y - size/2 - 10, progress, 5);
            }

            ctx.restore();
        }

        function drawMaid(x, y) {
            ctx.save();

            // Body (dress)
            ctx.fillStyle = '#FF1493';
            ctx.beginPath();
            ctx.ellipse(x, y + 5, 12, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Apron
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.ellipse(x, y + 8, 10, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = '#FDBCB4';
            ctx.beginPath();
            ctx.arc(x, y - 10, 8, 0, Math.PI * 2);
            ctx.fill();

            // Hair
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(x, y - 13, 9, 0, Math.PI, false);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x - 3, y - 11, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 3, y - 11, 2, 0, Math.PI * 2);
            ctx.fill();

            // Smile
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y - 8, 3, 0, Math.PI);
            ctx.stroke();

            // Arms
            ctx.strokeStyle = '#FDBCB4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x - 12, y);
            ctx.lineTo(x - 18, y + 5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 12, y);
            ctx.lineTo(x + 18, y + 5);
            ctx.stroke();

            // Shoes
            ctx.fillStyle = '#8B0000';
            ctx.fillRect(x - 6, y + 22, 5, 4);
            ctx.fillRect(x + 1, y + 22, 5, 4);

            ctx.restore();
        }

        function drawHUD() {
            ctx.save();

            // Semi-transparent background for HUD
            ctx.fillStyle = 'rgba(255, 182, 217, 0.9)';
            ctx.fillRect(0, 0, canvas.width, 60);

            // Score
            ctx.fillStyle = '#8B008B';
            ctx.font = 'bold 20px Arial';
            ctx.fillText(`Score: ${gameState.score}`, 20, 35);

            // Timer with shake effect for critical time
            const timerX = canvas.width / 2 - 50;
            let displayTime = Math.max(0, gameState.timeRemaining);

            if (displayTime < 10 && gameState.gameRunning) {
                ctx.fillStyle = '#FF0000';
                playSound('beep');
            } else if (displayTime < 10) {
                ctx.fillStyle = '#FF0000';
            } else {
                ctx.fillStyle = '#8B008B';
            }

            ctx.font = 'bold 24px Arial';
            ctx.fillText(`⏱️ ${displayTime}s`, timerX, 35);

            // Items remaining
            const itemsText = `Items: ${gameState.itemsTotal - gameState.itemsCleaned}/${gameState.itemsTotal}`;
            ctx.fillStyle = '#8B008B';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'right';
            ctx.fillText(itemsText, canvas.width - 20, 35);

            // Level
            ctx.textAlign = 'left';
            ctx.font = 'bold 18px Arial';
            ctx.fillText(`Level ${gameState.currentLevel}`, 20, 50);

            ctx.restore();
        }

        function drawLevelComplete() {
            ctx.save();

            // Overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Panel
            ctx.fillStyle = '#FFB6D9';
            ctx.fillRect(canvas.width/2 - 200, canvas.height/2 - 150, 400, 300);
            ctx.strokeStyle = '#8B008B';
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width/2 - 200, canvas.height/2 - 150, 400, 300);

            // Title
            ctx.fillStyle = '#8B008B';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Level Complete! ⭐', canvas.width/2, canvas.height/2 - 110);

            // Stars
            ctx.font = '40px Arial';
            for (let i = 0; i < gameState.stars; i++) {
                ctx.fillText('⭐', canvas.width/2 - 50 + i * 50, canvas.height/2 - 40);
            }

            // Info
            ctx.fillStyle = '#8B008B';
            ctx.font = '18px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${gameState.score}`, canvas.width/2 - 180, canvas.height/2 + 20);
            ctx.fillText(`Items Cleaned: ${gameState.itemsCleaned}`, canvas.width/2 - 180, canvas.height/2 + 50);
            ctx.fillText(`Boss: ${gameState.bossComments}`, canvas.width/2 - 180, canvas.height/2 + 80);

            // Next level button info
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            if (gameState.currentLevel < 5) {
                ctx.fillText('Press SPACE or TAP to continue', canvas.width/2, canvas.height/2 + 130);
            } else {
                ctx.fillText('Game Complete! Congratulations!', canvas.width/2, canvas.height/2 + 130);
            }

            ctx.restore();
        }

        // ============================================================================
        // GAME LOGIC
        // ============================================================================

        function startGame() {
            gameState.gameRunning = true;
            gameState.levelComplete = false;
            gameState.showLevelComplete = false;
            gameState.score = 0;
            gameState.timeRemaining = LEVELS[gameState.currentLevel].timeLimit;
            gameState.maidX = 100;
            gameState.maidY = 100;
            gameState.cleaning = false;
            gameState.currentCleaningItem = null;

            generateRooms();
            startOverlay.classList.add('hidden');
        }

        function updateGame() {
            if (!gameState.gameRunning) return;

            // Update timer
            gameState.timeRemaining--;

            if (gameState.timeRemaining <= 0) {
                endLevel();
                return;
            }

            // Update maid position
            updateMaidPosition();

            // Update cleaning
            if (gameState.cleaning && gameState.currentCleaningItem !== null) {
                const item = items.find(i => i.id === gameState.currentCleaningItem);
                if (item && !item.clean) {
                    gameState.cleaningProgress++;
                    playSound('scrub');

                    if (gameState.cleaningProgress >= item.cleanTime) {
                        item.clean = true;
                        gameState.itemsCleaned++;
                        gameState.score += 100;
                        gameState.cleaning = false;
                        gameState.cleaningProgress = 0;
                        gameState.currentCleaningItem = null;

                        playSound('sparkle');
                        createParticle(item.x, item.y, 'sparkle', 8);
                    }
                }
            }

            // Check if all items cleaned
            if (gameState.itemsCleaned === gameState.itemsTotal && gameState.timeRemaining > 0) {
                endLevel();
            }

            // Screen shake for time warning
            if (gameState.timeRemaining < 10 && gameState.timeRemaining % 2 === 0) {
                gameState.screenShake = 2;
            }
        }

        function updateMaidPosition() {
            const speed = 3;
            let dx = 0, dy = 0;

            if (keys['w'] || keys['ArrowUp']) dy = -speed;
            if (keys['s'] || keys['ArrowDown']) dy = speed;
            if (keys['a'] || keys['ArrowLeft']) dx = -speed;
            if (keys['d'] || keys['ArrowRight']) dx = speed;

            // Touch input
            if (touchInput.active) {
                const dx_touch = touchInput.x - gameState.maidX;
                const dy_touch = touchInput.y - gameState.maidY;
                const dist = Math.sqrt(dx_touch * dx_touch + dy_touch * dy_touch);

                if (dist > 10) {
                    dx = (dx_touch / dist) * speed;
                    dy = (dy_touch / dist) * speed;
                }
            }

            gameState.maidX += dx;
            gameState.maidY += dy;

            // Boundary checking
            gameState.maidX = Math.max(15, Math.min(canvas.width - 15, gameState.maidX));
            gameState.maidY = Math.max(70, Math.min(canvas.height - 15, gameState.maidY));
        }

        function endLevel() {
            gameState.gameRunning = false;
            gameState.levelComplete = true;
            gameState.showLevelComplete = true;

            // Calculate boss inspection score
            const missedItems = gameState.itemsTotal - gameState.itemsCleaned;
            const bossStrictness = LEVELS[gameState.currentLevel].bossStrictness;
            const deduction = Math.floor(missedItems * 50 * bossStrictness);

            gameState.score = Math.max(0, gameState.score - deduction);

            // Calculate stars
            const cleanPercentage = gameState.itemsCleaned / gameState.itemsTotal;
            if (cleanPercentage === 1 && gameState.timeRemaining > gameState.timeRemaining * 0.3) {
                gameState.stars = 3;
                gameState.bossComments = 'Perfect! Flawless work! 🌟';
            } else if (cleanPercentage >= 0.8) {
                gameState.stars = 2;
                gameState.bossComments = 'Great job! Nearly perfect! ⭐';
            } else if (cleanPercentage >= 0.5) {
                gameState.stars = 1;
                gameState.bossComments = 'Not bad, but could be better.';
            } else {
                gameState.stars = 0;
                gameState.bossComments = 'Needs more work!';
            }

            playSound('jingle');
        }

        function checkItemProximity() {
            const proximityRange = 40;

            for (let item of items) {
                if (item.clean) continue;

                const dx = gameState.maidX - item.x;
                const dy = gameState.maidY - item.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < proximityRange) {
                    return item.id;
                }
            }

            return null;
        }

        // ============================================================================
        // EVENT HANDLERS
        // ============================================================================

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === ' ' || e.key === 'e' || e.key === 'E') {
                e.preventDefault();

                if (!gameState.gameRunning && gameState.levelComplete) {
                    // Next level or restart
                    if (gameState.currentLevel < 5) {
                        gameState.currentLevel++;
                    }
                    startGame();
                } else if (gameState.gameRunning) {
                    // Start cleaning
                    const nearbyItem = checkItemProximity();
                    if (nearbyItem !== null) {
                        gameState.currentCleaningItem = nearbyItem;
                        gameState.cleaning = true;
                        gameState.cleaningProgress = 0;
                    }
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;

            if (e.key === ' ' || e.key === 'e' || e.key === 'E') {
                gameState.cleaning = false;
            }
        });

        // Touch controls
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchInput.x = touch.clientX * (canvas.width / window.innerWidth);
            touchInput.y = touch.clientY * (canvas.height / window.innerHeight);
            touchInput.active = true;
        });

        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            touchInput.x = touch.clientX * (canvas.width / window.innerWidth);
            touchInput.y = touch.clientY * (canvas.height / window.innerHeight);
        });

        canvas.addEventListener('touchend', () => {
            touchInput.active = false;

            // Try to clean nearby item
            const nearbyItem = checkItemProximity();
            if (nearbyItem !== null) {
                gameState.currentCleaningItem = nearbyItem;
                gameState.cleaning = true;
                gameState.cleaningProgress = 0;
            }
        });

        playBtn.addEventListener('click', () => {
            gameState.currentLevel = gameState.selectedLevel || 1;
            startGame();
        });

        // Level select buttons
        function initLevelSelect() {
            levelSelect.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const btn = document.createElement('button');
                btn.className = 'levelBtn' + (i === gameState.selectedLevel ? ' selected' : '');
                btn.textContent = `Level ${i}`;
                btn.addEventListener('click', () => {
                    gameState.selectedLevel = i;
                    document.querySelectorAll('.levelBtn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
                levelSelect.appendChild(btn);
            }
        }

        // ============================================================================
        // MAIN GAME LOOP
        // ============================================================================

        let lastFrameTime = Date.now();
        let frameCount = 0;

        function loop() {
            try {
                const currentTime = Date.now();
                const deltaTime = currentTime - lastFrameTime;
                lastFrameTime = currentTime;

                // Update
                if (gameState.gameRunning) {
                    updateGame();
                }
                updateParticles();

                // Draw
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Apply screen shake
                if (gameState.screenShake > 0) {
                    ctx.save();
                    const shake = Math.random() * gameState.screenShake * 2 - gameState.screenShake;
                    ctx.translate(shake, shake);
                    gameState.screenShake -= 0.1;
                }

                // Draw game
                drawHotel();
                drawParticles();

                if (gameState.screenShake > 0) {
                    ctx.restore();
                }

                // Draw level complete overlay
                if (gameState.showLevelComplete) {
                    drawLevelComplete();
                }

                // Attract mode: draw hotel scene even when start screen is showing
                // (Canvas must have varied pixels for Playwright test)

                frameCount++;

            } catch (e) {
                console.error('Game loop error:', e);
            }

            requestAnimationFrame(loop);
        }

        // ============================================================================
        // INITIALIZATION
        // ============================================================================

        // Initialize all arrays
        items = [];
        particles = [];
        rooms = [];
        keys = {};
        touchInput = { x: 0, y: 0, active: false };

        // Generate attract mode rooms so canvas renders content behind start screen
        gameState.currentLevel = 1;
        gameState.timeRemaining = LEVELS[1].timeLimit;
        generateRooms();
        gameState.maidX = 200;
        gameState.maidY = 150;

        // Start the game loop
        initLevelSelect();
        initAudio();

        // Handle visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState.gameRunning) {
                gameState.gameRunning = false;
            }
        });

        // Start animation loop
        loop();

        // Show start screen with drawing
        startOverlay.classList.remove('hidden');

    </script>
</body>
</html>
