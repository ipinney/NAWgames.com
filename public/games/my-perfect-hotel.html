<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Perfect Hotel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #FFD700;
        }

        /* ===== START SCREEN ===== */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .start-content {
            text-align: center;
            animation: slideInDown 0.6s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hotel-title {
            font-size: 72px;
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .game-title {
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
        }

        .game-subtitle {
            font-size: 24px;
            color: #FFE4B5;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .character-preview {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 40px;
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .char-label {
            position: absolute;
            font-size: 14px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        #startBtn {
            font-size: 28px;
            padding: 20px 40px;
            background: linear-gradient(135deg, #FF6B6B, #FFE66D);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #startBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        #startBtn:active {
            transform: scale(0.96);
        }

        /* ===== TOP HUD ===== */
        .hud {
            background: linear-gradient(to bottom, #FFD700, #FFA500);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 3px solid #FF8C00;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .timer-bar {
            width: 150px;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid #333;
        }

        .timer-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #FFE66D, #4CAF50);
            width: 100%;
            transition: width 0.1s linear;
        }

        /* ===== MAIN GAME AREA ===== */
        .game-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .left-panel {
            width: 200px;
            background: #FFE4B5;
            padding: 15px;
            border-right: 3px solid #FF8C00;
            overflow-y: auto;
            position: relative;
        }

        .door {
            width: 100%;
            height: 80px;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            border: 3px solid #654321;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin-bottom: 10px;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .door::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: gold;
            border-radius: 50%;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .guest-queue {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guest-item {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFB6C1, #FFB6C1);
            border: 2px solid #FF69B4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            position: relative;
        }

        .guest-item:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.4);
        }

        .guest-item.selected {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 2px solid #FF6347;
            box-shadow: 0 0 20px rgba(255, 99, 71, 0.6);
        }

        .guest-item.waiting {
            animation: wiggle 0.3s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .guest-emoji {
            font-size: 28px;
        }

        .guest-name {
            flex: 1;
        }

        /* ===== CENTER PANEL (ROOMS) ===== */
        .center-panel {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #E0F6FF;
        }

        .desk-label {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex: 1;
        }

        .room {
            background: #90EE90;
            border: 3px solid #228B22;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            position: relative;
            overflow: hidden;
            font-weight: bold;
            font-size: 14px;
        }

        .room:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .room.clean {
            background: linear-gradient(135deg, #90EE90, #7CFC00);
            border-color: #228B22;
        }

        .room.clean::after {
            content: '✨';
            position: absolute;
            font-size: 20px;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .room.occupied {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-color: #FF8C00;
            animation: pulse-room 1s infinite;
        }

        @keyframes pulse-room {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 0 0 10px rgba(255, 165, 0, 0); }
        }

        .room.dirty {
            background: linear-gradient(135deg, #8B7355, #A0826D);
            border-color: #5C4033;
            animation: dirty-shake 0.4s ease-out;
        }

        @keyframes dirty-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .room.cleaning {
            background: linear-gradient(135deg, #87CEEB, #4DB8FF);
            border-color: #0099FF;
            animation: cleaning-shimmer 0.6s ease-in-out;
        }

        @keyframes cleaning-shimmer {
            0%, 100% { background: linear-gradient(135deg, #87CEEB, #4DB8FF); }
            50% { background: linear-gradient(135deg, #4DB8FF, #87CEEB); }
        }

        .room-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
            text-align: center;
        }

        .room-number {
            font-size: 12px;
            opacity: 0.7;
        }

        .room-emoji {
            font-size: 36px;
        }

        .room-timer {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 8px;
            border-radius: 4px;
            min-width: 40px;
        }

        .room.clean .room-text {
            font-size: 16px;
            color: #228B22;
        }

        .room.occupied .room-text {
            font-size: 16px;
            color: #FF8C00;
        }

        .room.dirty .room-text {
            font-size: 16px;
            color: #E8E8E8;
        }

        /* ===== BOTTOM PANEL (SHOP) ===== */
        .shop-panel {
            background: linear-gradient(to top, #FFE4B5, #FFE4B5);
            padding: 12px 15px;
            border-top: 3px solid #FF8C00;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .shop-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, #FF6B6B, #FF4757);
            border: 2px solid #FF3838;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .shop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 71, 87, 0.5);
        }

        .shop-btn:active {
            transform: translateY(0);
        }

        .shop-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== DAY END SCREEN ===== */
        #dayEndScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .day-end-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            max-width: 400px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .day-end-content h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .day-stat {
            font-size: 18px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .day-stat-value {
            font-weight: bold;
            color: #FFD700;
        }

        .stars-display {
            font-size: 48px;
            margin: 20px 0;
            letter-spacing: 8px;
            animation: starPop 0.6s ease-out;
        }

        @keyframes starPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .continue-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
        }

        /* ===== FLOATING TEXT ===== */
        .floating-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px);
            }
        }

        /* ===== JANITOR CHARACTER ===== */
        .janitor {
            position: absolute;
            font-size: 36px;
            z-index: 50;
            animation: janitorWalk 1s linear forwards;
        }

        @keyframes janitorWalk {
            from { opacity: 1; }
            to { opacity: 1; }
        }

        .janitor-working {
            animation: janitorClean 0.6s ease-in-out infinite !important;
        }

        @keyframes janitorClean {
            0%, 100% { transform: rotate(0deg) scaleX(1); }
            50% { transform: rotate(-10deg) scaleX(-1); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .game-container {
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
            }

            .hud {
                font-size: 18px;
            }

            .game-title {
                font-size: 36px;
            }

            .hotel-title {
                font-size: 56px;
            }

            .rooms-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== SCROLLBAR STYLING ===== */
        .left-panel::-webkit-scrollbar,
        .center-panel::-webkit-scrollbar {
            width: 8px;
        }

        .left-panel::-webkit-scrollbar-track,
        .center-panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }

        .left-panel::-webkit-scrollbar-thumb,
        .center-panel::-webkit-scrollbar-thumb {
            background: #FF8C00;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- START SCREEN -->
        <div id="startScreen">
            <div class="start-content">
                <div class="hotel-title">🏨</div>
                <div class="game-title">My Perfect Hotel</div>
                <div class="game-subtitle">Can you keep all the guests happy?</div>

                <div class="character-preview">
                    <div style="position: relative;">
                        🧑‍💼
                        <div class="char-label" style="bottom: -30px;">Manager</div>
                    </div>
                    <div style="position: relative;">
                        👤
                        <div class="char-label" style="bottom: -30px;">Guest</div>
                    </div>
                </div>

                <button id="startBtn">OPEN FOR BUSINESS! 🚀</button>
            </div>
        </div>

        <!-- DAY END SCREEN -->
        <div id="dayEndScreen">
            <div class="day-end-content">
                <h2 id="dayEndTitle">Day Complete!</h2>
                <div class="day-stat">
                    <span>Guests Served:</span>
                    <span class="day-stat-value" id="guestsServed">0</span>
                </div>
                <div class="day-stat">
                    <span>Guests Missed:</span>
                    <span class="day-stat-value" id="guestsMissed">0</span>
                </div>
                <div class="day-stat">
                    <span>Money Earned:</span>
                    <span class="day-stat-value" id="moneyEarned">$0</span>
                </div>
                <div class="stars-display" id="starsDisplay">⭐</div>
                <button class="continue-btn" onclick="game.nextDay()">Next Day →</button>
            </div>
        </div>

        <!-- GAME HUD -->
        <div class="hud">
            <div class="hud-item">
                <span>🏨</span>
                <span id="hotelName">My Perfect Hotel</span>
            </div>
            <div class="hud-item">
                <span>💰</span>
                <span id="moneyDisplay">$0</span>
            </div>
            <div class="hud-item">
                <span>⭐</span>
                <span id="dayDisplay">Day 1</span>
            </div>
            <div class="hud-item">
                <span>⏱️</span>
                <div class="timer-bar">
                    <div class="timer-bar-fill" id="timerBar"></div>
                </div>
            </div>
        </div>

        <!-- MAIN GAME AREA -->
        <div class="game-area">
            <!-- LEFT PANEL: DOOR & QUEUE -->
            <div class="left-panel">
                <div class="door">🚪</div>
                <div class="guest-queue" id="guestQueue"></div>
            </div>

            <!-- CENTER PANEL: ROOMS -->
            <div class="center-panel">
                <div class="desk-label">🛎️ FRONT DESK</div>
                <div class="rooms-grid" id="roomsGrid"></div>
            </div>
        </div>

        <!-- SHOP PANEL -->
        <div class="shop-panel">
            <button class="shop-btn" id="janitorbtn" onclick="game.hireJanitor()">
                <span>👷 Hire Janitor</span><br><span style="font-size: 12px;">$50</span>
            </button>
            <button class="shop-btn" id="roombtn" onclick="game.buyMoreRooms()">
                <span>🏠 +2 Rooms</span><br><span style="font-size: 12px;">$80</span>
            </button>
            <button class="shop-btn" id="upgradeBtn" onclick="game.upgradeJanitor()">
                <span>⚡ Janitor++</span><br><span style="font-size: 12px;">$120</span>
            </button>
        </div>
    </div>

    <script>
        // ===== AUDIO SYNTHESIS =====
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const now = audioContext.currentTime;
            const masterVolume = 0.3;

            switch(type) {
                case 'bell':
                    // Two-note ascending chime
                    [587.33, 783.99].forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3 * masterVolume, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.3);
                    });
                    break;

                case 'checkin':
                    // Pop sound - high frequency
                    const osc1 = audioContext.createOscillator();
                    const gain1 = audioContext.createGain();
                    osc1.connect(gain1);
                    gain1.connect(audioContext.destination);
                    osc1.frequency.setValueAtTime(1200, now);
                    osc1.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain1.gain.setValueAtTime(0.3 * masterVolume, now);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc1.start(now);
                    osc1.stop(now + 0.15);
                    break;

                case 'checkout':
                    // Ka-ching coin sound
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    osc2.frequency.setValueAtTime(800, now);
                    osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                    gain2.gain.setValueAtTime(0.3 * masterVolume, now);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc2.start(now);
                    osc2.stop(now + 0.4);
                    break;

                case 'clean_start':
                    // Swoosh sound
                    const noise = audioContext.createBufferSource();
                    const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.3, audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < buffer.length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    noise.buffer = buffer;
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 1000;
                    const gainClean = audioContext.createGain();
                    noise.connect(filter);
                    filter.connect(gainClean);
                    gainClean.connect(audioContext.destination);
                    gainClean.gain.setValueAtTime(0.2 * masterVolume, now);
                    gainClean.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    noise.start(now);
                    noise.stop(now + 0.3);
                    break;

                case 'clean_done':
                    // Sparkle ascending chime
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.connect(g);
                        g.connect(audioContext.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2 * masterVolume, now + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
                        o.start(now + i * 0.08);
                        o.stop(now + i * 0.08 + 0.2);
                    });
                    break;

                case 'hire':
                    // Power-up fanfare
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.connect(g);
                        g.connect(audioContext.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.25 * masterVolume, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.3);
                    });
                    break;

                case 'miss':
                    // Sad descending tone
                    [400, 300, 200].forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.connect(g);
                        g.connect(audioContext.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2 * masterVolume, now + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
                        o.start(now + i * 0.15);
                        o.stop(now + i * 0.15 + 0.3);
                    });
                    break;

                case 'day_end':
                    // End of day jingle
                    [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 523.25].forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.connect(g);
                        g.connect(audioContext.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2 * masterVolume, now + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
                        o.start(now + i * 0.12);
                        o.stop(now + i * 0.12 + 0.25);
                    });
                    break;
            }
        }

        // ===== GAME STATE & LOGIC =====
        const game = {
            state: 'start',
            money: 0,
            day: 1,
            dayTime: 90,
            dayTimeMax: 90,
            rooms: [],
            guests: [],
            guestQueue: [],
            selectedGuest: null,
            guestSpawnRate: 1.5,
            guestSpawnTimer: 0,
            dayStats: {
                guestsServed: 0,
                guestsMissed: 0,
                moneyEarned: 0,
                dayStartMoney: 0
            },
            hasJanitor: false,
            janitorLevel: 1,
            janitorCleaning: false,
            janitorCleanTime: 4,

            init() {
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                this.createRooms(4);
            },

            createRooms(count) {
                this.rooms = [];
                for (let i = 0; i < count; i++) {
                    this.rooms.push({
                        id: i,
                        state: 'clean', // 'clean', 'occupied', 'dirty', 'cleaning'
                        guest: null,
                        timer: 0,
                        cleanTimer: 0,
                        element: null
                    });
                }
                this.renderRooms();
            },

            startGame() {
                this.state = 'playing';
                document.getElementById('startScreen').style.display = 'none';
                this.money = 0;
                this.day = 1;
                this.dayStats = {
                    guestsServed: 0,
                    guestsMissed: 0,
                    moneyEarned: 0,
                    dayStartMoney: 0
                };
                this.hasJanitor = false;
                this.janitorLevel = 1;
                this.startDay();
            },

            startDay() {
                this.dayTime = this.dayTimeMax;
                this.dayStats.dayStartMoney = this.money;
                this.dayStats.guestsServed = 0;
                this.dayStats.guestsMissed = 0;
                this.dayStats.moneyEarned = 0;
                this.guestSpawnRate = 1.5 - (this.day * 0.1);
                this.guestSpawnRate = Math.max(0.5, this.guestSpawnRate);
                this.guestQueue = [];
                this.guests = [];
                this.selectedGuest = null;
                this.guestSpawnTimer = 0;
                this.updateUI();
                this.gameLoop();
            },

            gameLoop() {
                if (this.state !== 'playing') return;

                const deltaTime = 0.016; // ~60fps
                this.dayTime -= deltaTime;

                // Spawn guests
                this.guestSpawnTimer += deltaTime;
                if (this.guestSpawnTimer > this.guestSpawnRate && this.guests.length < 10) {
                    this.spawnGuest();
                    this.guestSpawnTimer = 0;
                }

                // Update guests in queue
                this.guests.forEach(guest => {
                    if (!guest.assigned) {
                        guest.waitTime += deltaTime;
                        if (guest.waitTime > 8) {
                            // Guest leaves sad
                            playSound('miss');
                            this.dayStats.guestsMissed++;
                            this.guests = this.guests.filter(g => g !== guest);
                            this.renderGuestQueue();
                        }
                    }
                });

                // Update rooms
                this.rooms.forEach(room => {
                    if (room.state === 'occupied') {
                        room.timer -= deltaTime;
                        if (room.timer <= 0) {
                            this.checkoutGuest(room);
                        }
                    }
                    if (room.state === 'cleaning') {
                        room.cleanTimer -= deltaTime;
                        if (room.cleanTimer <= 0) {
                            room.state = 'clean';
                            playSound('clean_done');
                            this.renderRooms();
                        }
                    }
                });

                // Janitor AI
                if (this.hasJanitor && !this.janitorCleaning) {
                    const dirtyRooms = this.rooms.filter(r => r.state === 'dirty');
                    if (dirtyRooms.length > 0) {
                        const room = dirtyRooms[0];
                        this.janitorCleanRoom(room);
                    }
                }

                // Update UI
                this.updateUI();

                // Check if day is over
                if (this.dayTime <= 0) {
                    this.endDay();
                    return;
                }

                requestAnimationFrame(() => this.gameLoop());
            },

            spawnGuest() {
                const guestEmojis = ['😊', '👨‍💼', '👩‍💼', '👶', '👴', '👵', '🧑‍🎨', '👨‍👩‍👧', '🧑‍💻'];
                const guest = {
                    id: Math.random(),
                    emoji: guestEmojis[Math.floor(Math.random() * guestEmojis.length)],
                    waitTime: 0,
                    assigned: false,
                    element: null,
                    stayTime: 8 + Math.random() * 7, // 8-15 seconds
                    payment: 8 + Math.floor(Math.random() * 8) // $8-15
                };
                this.guests.push(guest);
                playSound('bell');
                this.renderGuestQueue();
            },

            selectGuest(guest) {
                if (this.selectedGuest === guest) {
                    this.selectedGuest = null;
                } else {
                    this.selectedGuest = guest;
                }
                this.renderGuestQueue();
            },

            assignGuestToRoom(room) {
                if (!this.selectedGuest || room.state !== 'clean') return;

                const guest = this.selectedGuest;
                playSound('checkin');

                room.state = 'occupied';
                room.guest = guest;
                room.timer = guest.stayTime;
                guest.assigned = true;
                guest.roomId = room.id;

                this.guests = this.guests.filter(g => g !== guest);
                this.selectedGuest = null;
                this.dayStats.guestsServed++;

                this.renderRooms();
                this.renderGuestQueue();
            },

            checkoutGuest(room) {
                const earnings = room.guest.payment;
                this.money += earnings;
                this.dayStats.moneyEarned += earnings;

                // Floating text animation
                const roomElement = room.element;
                if (roomElement) {
                    const floatingText = document.createElement('div');
                    floatingText.className = 'floating-text';
                    floatingText.textContent = `+$${earnings}! ✨`;
                    floatingText.style.color = '#FFD700';
                    floatingText.style.left = roomElement.offsetLeft + 30 + 'px';
                    floatingText.style.top = roomElement.offsetTop + 30 + 'px';
                    document.querySelector('.game-area').appendChild(floatingText);
                    setTimeout(() => floatingText.remove(), 1000);
                }

                playSound('checkout');
                room.state = 'dirty';
                room.guest = null;
                room.timer = 0;
                this.renderRooms();
            },

            cleanRoom(room) {
                if (room.state !== 'dirty') return;

                room.state = 'cleaning';
                room.cleanTimer = 3;
                playSound('clean_start');
                this.renderRooms();
            },

            janitorCleanRoom(room) {
                const cleanTime = this.janitorLevel === 1 ? 4 : 2;
                room.state = 'cleaning';
                room.cleanTimer = cleanTime;
                this.janitorCleaning = true;

                // Animate janitor moving to room
                const janitor = document.createElement('div');
                janitor.className = 'janitor janitor-working';
                janitor.textContent = '👷';
                janitor.style.left = '50px';
                janitor.style.top = '150px';
                document.querySelector('.game-area').appendChild(janitor);

                setTimeout(() => {
                    janitor.remove();
                    this.janitorCleaning = false;
                }, cleanTime * 1000);
            },

            hireJanitor() {
                if (this.money < 50) return;
                if (this.hasJanitor) return;

                playSound('hire');
                this.money -= 50;
                this.hasJanitor = true;
                this.updateUI();
            },

            upgradeJanitor() {
                if (!this.hasJanitor || this.money < 120) return;
                if (this.janitorLevel === 2) return;

                playSound('hire');
                this.money -= 120;
                this.janitorLevel = 2;
                this.updateUI();
            },

            buyMoreRooms() {
                if (this.money < 80 || this.rooms.length >= 6) return;

                playSound('hire');
                this.money -= 80;
                this.rooms.push({
                    id: this.rooms.length,
                    state: 'clean',
                    guest: null,
                    timer: 0,
                    cleanTimer: 0,
                    element: null
                });
                this.renderRooms();
                this.updateUI();
            },

            renderRooms() {
                const grid = document.getElementById('roomsGrid');
                grid.innerHTML = '';

                this.rooms.forEach(room => {
                    const div = document.createElement('div');
                    div.className = `room ${room.state}`;

                    let emoji = '🟢';
                    let status = 'CLEAN ✅';

                    if (room.state === 'occupied') {
                        emoji = room.guest.emoji;
                        status = `⏱️ ${Math.ceil(room.timer)}s`;
                    } else if (room.state === 'dirty') {
                        emoji = '🗑️';
                        status = 'DIRTY 🗑️';
                    } else if (room.state === 'cleaning') {
                        emoji = '✨';
                        status = 'CLEANING...';
                    }

                    div.innerHTML = `
                        <div class="room-content">
                            <div class="room-number">Room ${room.id + 1}</div>
                            <div class="room-emoji">${emoji}</div>
                            <div class="room-text">${status}</div>
                        </div>
                    `;

                    div.addEventListener('click', () => {
                        if (this.selectedGuest && room.state === 'clean') {
                            this.assignGuestToRoom(room);
                        } else if (room.state === 'dirty' && !this.hasJanitor) {
                            this.cleanRoom(room);
                        }
                    });

                    div.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        if (this.selectedGuest && room.state === 'clean') {
                            this.assignGuestToRoom(room);
                        } else if (room.state === 'dirty' && !this.hasJanitor) {
                            this.cleanRoom(room);
                        }
                    });

                    grid.appendChild(div);
                    room.element = div;
                });
            },

            renderGuestQueue() {
                const queue = document.getElementById('guestQueue');
                queue.innerHTML = '';

                this.guests.forEach(guest => {
                    const div = document.createElement('div');
                    div.className = 'guest-item';
                    if (guest === this.selectedGuest) div.classList.add('selected');
                    if (guest.waitTime > 3) div.classList.add('waiting');

                    const face = guest.waitTime > 6 ? '😡' : guest.waitTime > 3 ? '😤' : '😊';

                    div.innerHTML = `
                        <span class="guest-emoji">${guest.emoji}</span>
                        <span class="guest-name">${face}</span>
                    `;

                    div.addEventListener('click', () => this.selectGuest(guest));
                    div.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.selectGuest(guest);
                    });

                    queue.appendChild(div);
                });
            },

            updateUI() {
                document.getElementById('moneyDisplay').textContent = `$${Math.floor(this.money)}`;
                document.getElementById('dayDisplay').textContent = `Day ${this.day}`;

                const timerPercent = (this.dayTime / this.dayTimeMax) * 100;
                document.getElementById('timerBar').style.width = timerPercent + '%';

                // Update shop buttons
                document.getElementById('janitorbtn').classList.toggle('disabled', this.money < 50 || this.hasJanitor);
                document.getElementById('roombtn').classList.toggle('disabled', this.money < 80 || this.rooms.length >= 6);
                document.getElementById('upgradeBtn').classList.toggle('disabled', !this.hasJanitor || this.money < 120 || this.janitorLevel === 2);
            },

            endDay() {
                this.state = 'day_end';
                playSound('day_end');

                const missRate = this.dayStats.guestsMissed / (this.dayStats.guestsServed + this.dayStats.guestsMissed || 1);
                let stars = 3;
                if (missRate > 0.25) stars = 1;
                else if (missRate > 0.1) stars = 2;

                document.getElementById('guestsServed').textContent = this.dayStats.guestsServed;
                document.getElementById('guestsMissed').textContent = this.dayStats.guestsMissed;
                document.getElementById('moneyEarned').textContent = `$${this.dayStats.moneyEarned}`;
                document.getElementById('starsDisplay').textContent = '⭐'.repeat(stars);

                document.getElementById('dayEndScreen').style.display = 'flex';
            },

            nextDay() {
                this.day++;
                document.getElementById('dayEndScreen').style.display = 'none';
                this.createRooms(this.rooms.length);
                this.startDay();
            }
        };

        // Start game
        game.init();
    </script>
