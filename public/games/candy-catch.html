<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Catch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a0a2e; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 20px;
    display: flex; justify-content: space-between;
    color: #ec4899; font-size: 16px; font-weight: bold;
    text-shadow: 0 0 10px rgba(236,72,153,0.5);
    pointer-events: none;
  }
  #start-screen, #game-over {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center;
    background: rgba(26,10,46,0.9);
  }
  #game-over { display: none; }
  h1 { font-size: 28px; margin-bottom: 10px; color: #ec4899;
    text-shadow: 0 0 20px rgba(236,72,153,0.5); }
  .sub { color: #888; font-size: 14px; margin-bottom: 30px; }
  .btn {
    background: linear-gradient(135deg, #ec4899, #f59e0b);
    border: none; color: white; padding: 12px 32px;
    font-size: 16px; border-radius: 12px; cursor: pointer;
    font-family: 'Courier New', monospace; font-weight: bold;
  }
  .btn:hover { opacity: 0.9; }
  .controls { color: #666; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <span id="score-display">Score: 0</span>
  <span id="combo-display"></span>
  <span id="misses-display">Misses: 0/5</span>
</div>

<div id="start-screen">
  <h1>CANDY CATCH</h1>
  <p class="sub">Catch the falling candy!</p>
  <button class="btn" onclick="startGame()">START GAME</button>
  <p class="controls">Arrow keys, A/D, or mouse to move the basket</p>
</div>

<div id="game-over">
  <h1>GAME OVER</h1>
  <p class="sub" id="final-score">Score: 0</p>
  <button class="btn" onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const candyTypes = [
  { emoji: '🍬', points: 10, size: 28 },
  { emoji: '🍭', points: 15, size: 32 },
  { emoji: '🍫', points: 20, size: 28 },
  { emoji: '🍩', points: 25, size: 30 },
  { emoji: '🧁', points: 30, size: 30 },
  { emoji: '🍪', points: 10, size: 26 },
  { emoji: '⭐', points: 50, size: 28 },  // bonus star
];

let basket, candies, particles, score, misses, combo, spawnTimer, gameRunning, mouseX;

const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);
window.addEventListener('mousemove', e => mouseX = e.clientX);
window.addEventListener('touchmove', e => { mouseX = e.touches[0].clientX; e.preventDefault(); }, { passive: false });

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  basket = { x: W / 2, y: H - 50, w: 70, speed: 6 };
  candies = [];
  particles = [];
  score = 0;
  misses = 0;
  combo = 0;
  spawnTimer = 0;
  mouseX = null;
  gameRunning = true;
  loop();
}

function spawnCandy() {
  const type = candyTypes[Math.floor(Math.random() * candyTypes.length)];
  candies.push({
    x: Math.random() * (W - 60) + 30,
    y: -30,
    speed: Math.random() * 1.5 + 1 + score / 500,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: Math.random() * 0.03 + 0.02,
    ...type
  });
}

function addCatchParticles(x, y) {
  const colors = ['#ec4899', '#f59e0b', '#06b6d4', '#10b981', '#7c3aed'];
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i;
    particles.push({
      x, y, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4 - 2,
      life: 1, color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 4 + 2
    });
  }
}

function update() {
  // Basket movement
  if (keys['ArrowLeft'] || keys['a']) basket.x -= basket.speed;
  if (keys['ArrowRight'] || keys['d']) basket.x += basket.speed;
  if (mouseX !== null) {
    const diff = mouseX - basket.x;
    basket.x += diff * 0.15;
  }
  basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

  // Spawn
  spawnTimer++;
  const spawnRate = Math.max(25, 60 - score / 20);
  if (spawnTimer > spawnRate) {
    spawnCandy();
    spawnTimer = 0;
  }

  // Candies
  candies = candies.filter(c => {
    c.y += c.speed;
    c.wobble += c.wobbleSpeed;
    c.x += Math.sin(c.wobble) * 0.8;

    // Caught!
    if (c.y > basket.y - 20 && c.y < basket.y + 10 &&
        Math.abs(c.x - basket.x) < basket.w / 2 + c.size / 2) {
      combo++;
      const multiplier = Math.min(combo, 5);
      score += c.points * multiplier;
      addCatchParticles(c.x, c.y);
      document.getElementById('score-display').textContent = 'Score: ' + score;
      document.getElementById('combo-display').textContent = combo > 1 ? combo + 'x Combo!' : '';
      return false;
    }

    // Missed
    if (c.y > H + 20) {
      misses++;
      combo = 0;
      document.getElementById('misses-display').textContent = 'Misses: ' + misses + '/5';
      document.getElementById('combo-display').textContent = '';
      if (misses >= 5) {
        gameRunning = false;
        document.getElementById('final-score').textContent = 'Score: ' + score;
        document.getElementById('game-over').style.display = 'flex';
      }
      return false;
    }
    return true;
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.03;
    return p.life > 0;
  });
}

function draw() {
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a0a2e');
  grad.addColorStop(1, '#2d1b69');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Candies
  candies.forEach(c => {
    ctx.font = c.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.emoji, c.x, c.y);
  });

  // Basket
  ctx.save();
  ctx.translate(basket.x, basket.y);
  // Basket body
  ctx.fillStyle = '#8B4513';
  ctx.beginPath();
  ctx.moveTo(-basket.w / 2, -5);
  ctx.lineTo(-basket.w / 2 + 8, 20);
  ctx.lineTo(basket.w / 2 - 8, 20);
  ctx.lineTo(basket.w / 2, -5);
  ctx.closePath();
  ctx.fill();
  // Basket rim
  ctx.strokeStyle = '#A0522D';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-basket.w / 2 - 2, -5);
  ctx.lineTo(basket.w / 2 + 2, -5);
  ctx.stroke();
  // Basket weave
  ctx.strokeStyle = '#9B5B2E';
  ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 10, -3);
    ctx.lineTo(i * 8, 18);
    ctx.stroke();
  }
  ctx.restore();

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Combo text flash
  if (combo > 2) {
    ctx.save();
    ctx.font = 'bold 24px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(236, 72, 153, ${0.3 + Math.sin(Date.now() / 200) * 0.2})`;
    ctx.fillText(combo + 'x COMBO!', W / 2, H / 2);
    ctx.restore();
  }
}

function loop() {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
