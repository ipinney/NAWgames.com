<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Geometry Jump</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; }
  body { background:#0b0620; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
         font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color:#fff; }
  canvas#c { display:block; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1; }

  .overlay { position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center;
             text-align:center; padding:16px; }
  .overlay.show { display:flex; }

  #menu { background:rgba(8,4,24,0.55); backdrop-filter: blur(3px); overflow-y:auto; justify-content:flex-start; padding-top:max(14px, env(safe-area-inset-top)); }
  .title { font-size:clamp(34px, 8vw, 64px); font-weight:900; letter-spacing:3px; line-height:1;
           background:linear-gradient(90deg,#ffd93d,#ff6b6b,#c77dff,#4cc9f0); -webkit-background-clip:text; background-clip:text; color:transparent;
           text-shadow:none; filter:drop-shadow(0 4px 0 rgba(0,0,0,0.6)); animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-6px) rotate(1deg)} }
  .subtitle { font-size:clamp(12px,2.6vw,16px); opacity:0.85; margin-top:6px; font-weight:700; letter-spacing:2px; }

  .card { background:rgba(20,12,50,0.85); border:2px solid rgba(255,255,255,0.15); border-radius:16px; padding:12px; width:min(94vw, 560px); margin-top:12px;
          box-shadow:0 8px 30px rgba(0,0,0,0.5); }
  .card h3 { font-size:13px; letter-spacing:2px; opacity:0.75; margin-bottom:8px; text-transform:uppercase; }

  .iconRow { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  #iconPreview { width:64px; height:64px; flex:none; }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .sw { width:30px; height:30px; border-radius:8px; border:3px solid transparent; cursor:pointer; transition:transform .15s; }
  .sw.sel { border-color:#fff; transform:scale(1.15); }
  .faces { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .face { width:34px; height:34px; border-radius:8px; background:rgba(255,255,255,0.08); border:2px solid transparent; cursor:pointer;
          display:flex; align-items:center; justify-content:center; font-size:20px; }
  .face.sel { border-color:#ffd93d; background:rgba(255,217,61,0.2); }

  .levels { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px; }
  .lvl { border-radius:12px; padding:10px 8px; cursor:pointer; border:3px solid transparent; position:relative; text-align:left;
         transition:transform .12s, border-color .12s; }
  .lvl:active { transform:scale(0.97); }
  .lvl.sel { border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.25), 0 6px 20px rgba(0,0,0,0.5); }
  .lvl.locked { opacity:0.45; filter:grayscale(0.6); }
  .lvl .num { font-size:11px; opacity:0.8; letter-spacing:1px; }
  .lvl .nm { font-weight:900; font-size:15px; line-height:1.1; margin:2px 0; }
  .lvl .diff { font-size:12px; opacity:0.9; }
  .lvl .best { margin-top:6px; height:8px; background:rgba(0,0,0,0.4); border-radius:4px; overflow:hidden; }
  .lvl .best i { display:block; height:100%; background:linear-gradient(90deg,#7CFF6B,#FFD93D); border-radius:4px; }
  .lvl .bt { font-size:11px; margin-top:3px; display:flex; justify-content:space-between; }
  .lvl .lock { position:absolute; right:8px; top:8px; font-size:18px; }

  .btnRow { display:flex; gap:10px; margin-top:14px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; }
  .btn { border:none; border-radius:14px; padding:14px 26px; font-size:20px; font-weight:900; letter-spacing:1px; color:#fff; cursor:pointer;
         box-shadow:0 6px 0 rgba(0,0,0,0.35), 0 10px 25px rgba(0,0,0,0.4); transition:transform .1s, box-shadow .1s; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.35); }
  .btn.play { background:linear-gradient(180deg,#7CFF6B,#1fb843); font-size:24px; padding:16px 36px; animation:glow 1.6s infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 6px 0 rgba(0,0,0,0.35), 0 0 12px rgba(124,255,107,0.4)} 50%{box-shadow:0 6px 0 rgba(0,0,0,0.35), 0 0 34px rgba(124,255,107,0.95)} }
  .btn.practice { background:linear-gradient(180deg,#4cc9f0,#1a73b5); }
  .btn.small { padding:10px 18px; font-size:16px; }
  .btn.gray { background:linear-gradient(180deg,#8a86a8,#4d4a66); }
  .btn.gold { background:linear-gradient(180deg,#ffd93d,#e0932a); color:#3a2400; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

  /* HUD */
  #hud { position:fixed; inset:0; z-index:50; pointer-events:none; display:none; }
  #hud.show { display:block; }
  #progWrap { position:absolute; top:max(10px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(60vw,420px); }
  #progBar { height:16px; background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.7); border-radius:10px; overflow:hidden; }
  #progFill { height:100%; width:0%; background:linear-gradient(90deg,#7CFF6B,#FFD93D); transition:width .1s linear; }
  #progPct { text-align:center; font-weight:900; font-size:16px; margin-top:2px; text-shadow:0 2px 4px #000; }
  #coinsHud { position:absolute; top:max(10px, env(safe-area-inset-top)); left:12px; font-size:22px; letter-spacing:2px; text-shadow:0 2px 4px #000; }
  #modeTag { position:absolute; top:max(52px, calc(env(safe-area-inset-top) + 42px)); left:12px; font-size:12px; font-weight:900; letter-spacing:2px; padding:3px 8px; border-radius:6px; background:rgba(0,0,0,0.45); }
  .hudBtn { position:absolute; top:max(8px, env(safe-area-inset-top)); width:42px; height:42px; border-radius:12px; background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.5);
            color:#fff; font-size:20px; pointer-events:auto; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #pauseBtn { right:12px; }
  #muteBtn { right:62px; }
  #hint { position:absolute; bottom:22%; left:50%; transform:translateX(-50%); font-size:clamp(18px,4vw,26px); font-weight:900; letter-spacing:2px;
          text-shadow:0 3px 6px #000; opacity:0; transition:opacity .4s; white-space:nowrap; }
  #hint.show { opacity:1; animation:pulse 1s infinite; }
  #toast { position:absolute; top:22%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); border:2px solid #ffd93d; border-radius:12px;
           padding:10px 16px; font-weight:800; font-size:16px; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; }

  /* touch controls */
  #touch { position:fixed; inset:0; z-index:40; display:none; pointer-events:none; }
  #touch.show { display:block; }
  #jumpBtn { position:absolute; right:18px; bottom:max(18px, env(safe-area-inset-bottom)); width:96px; height:96px; border-radius:50%;
             background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(255,217,61,0.55)); border:3px solid rgba(255,255,255,0.8);
             display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; letter-spacing:1px; color:#fff; text-shadow:0 2px 3px #000;
             pointer-events:auto; box-shadow:0 6px 20px rgba(0,0,0,0.5); }
  #jumpBtn:active { transform:scale(0.92); }
  @media (hover:hover) and (pointer:fine) { #touch { display:none !important; } }

  /* end screens */
  #pauseScreen, #winScreen { background:rgba(5,2,20,0.75); backdrop-filter:blur(4px); }
  .big { font-size:clamp(30px,8vw,58px); font-weight:900; letter-spacing:2px; text-shadow:0 4px 0 rgba(0,0,0,0.5), 0 0 30px rgba(255,217,61,0.6); }
  .stats { display:flex; gap:14px; margin:14px 0; flex-wrap:wrap; justify-content:center; }
  .stat { background:rgba(255,255,255,0.1); border-radius:12px; padding:10px 16px; min-width:110px; }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; opacity:0.75; letter-spacing:1px; }
  .starsRow { font-size:40px; letter-spacing:6px; margin-top:6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="coinsHud">🪙 <span id="coinTxt">☆☆☆</span></div>
  <div id="modeTag">CUBE</div>
  <div id="progWrap"><div id="progBar"><div id="progFill"></div></div><div id="progPct">0%</div></div>
  <div class="hudBtn" id="muteBtn">🔊</div>
  <div class="hudBtn" id="pauseBtn">⏸</div>
  <div id="hint">TAP TO JUMP!</div>
  <div id="toast"></div>
</div>
<div id="flash"></div>
<div id="touch"><div id="jumpBtn">JUMP</div></div>

<div id="menu" class="overlay show">
  <div class="title">GEOMETRY JUMP</div>
  <div class="subtitle">NOLAN'S GAME · TAP TO JUMP · DON'T TOUCH THE SPIKES</div>

  <div class="card">
    <h3>Your Cube</h3>
    <div class="iconRow">
      <canvas id="iconPreview" width="64" height="64"></canvas>
      <div class="swatches" id="swatches"></div>
      <div class="faces" id="faces"></div>
    </div>
  </div>

  <div class="card">
    <h3>Pick a Level</h3>
    <div class="levels" id="levelList"></div>
  </div>

  <div class="btnRow">
    <button class="btn play" id="startBtn">▶ PLAY</button>
    <button class="btn practice" id="practiceBtn">🟢 PRACTICE</button>
  </div>
</div>

<div id="pauseScreen" class="overlay">
  <div class="big">PAUSED</div>
  <div class="btnRow">
    <button class="btn play" id="resumeBtn">▶ RESUME</button>
    <button class="btn gray" id="restartBtn">🔄 RESTART</button>
    <button class="btn gray" id="menuBtn">🏠 MENU</button>
  </div>
</div>

<div id="winScreen" class="overlay">
  <div class="big">LEVEL COMPLETE!</div>
  <div class="starsRow" id="winStars">⭐⭐⭐</div>
  <div class="stats">
    <div class="stat"><b id="winAttempts">1</b><span>ATTEMPTS</span></div>
    <div class="stat"><b id="winCoins">0/3</b><span>COINS</span></div>
    <div class="stat"><b id="winJumps">0</b><span>JUMPS</span></div>
  </div>
  <div id="winMsg" style="font-weight:800;opacity:.9;margin-bottom:4px"></div>
  <div class="btnRow">
    <button class="btn gold" id="nextBtn">NEXT LEVEL ➜</button>
    <button class="btn play" id="replayBtn">🔄 REPLAY</button>
    <button class="btn gray" id="winMenuBtn">🏠 MENU</button>
  </div>
</div>

<script>
// ============================================================
//  GEOMETRY JUMP — one-touch rhythm platformer for NAW Games
// ============================================================
'use strict';

// ---------- Canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 800, H = 600, B = 48, groundY = 400;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  B = Math.max(26, Math.min(W / 12, H / 10, 64));
  groundY = H * (H > W ? 0.66 : 0.72);
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---------- Constants ----------
const CEIL = 8;            // global ceiling height (blocks)
const G = 85;              // cube gravity (blocks/s^2)
const JUMP_V = 20;         // cube jump velocity (peak ≈ 2.35 blocks)
const SHIP_ACC = 40;       // ship accel
const SHIP_MAX = 11;       // ship max |vy|
const DT = 1 / 60;

// ---------- State (ALL arrays initialised up-front) ----------
let particles = [], fireworks = [], trail = [], floaters = [];
let level = null, objs = [], pits = [], checkpoints = [];
let player = { x: 0, y: 0, vy: 0, mode: 'cube', grav: 1, grounded: true, rot: 0, dead: false, alive: false, prevY: 0, shipRot: 0 };
let camX = 0, camY = 0, camShake = 0, camYTarget = 0;
let holding = false, pressBuffer = 0, gameState = 'menu'; // menu | play | dead | win | pause
let attempts = 0, jumps = 0, coinsGot = [], practice = false, lastCheckpoint = null, deathTimer = 0, winTimer = 0, flashA = 0;
let selectedLevel = 0, time = 0, attractX = 0, hintShown = false, practiceTipShown = false, bestThisRun = 0;
let beatPulse = 0;

// ---------- Save ----------
const SAVE_KEY = 'geometry-jump-save-v1';
let save = { best: {}, coins: {}, unlocked: 1, color: 2, face: 0, muted: false, practiceBest: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- Utilities ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }

// ---------- Audio ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol, t0 = 0, curve = 'exp') {
  if (!audioCtx || save.muted) return;
  const t = audioCtx.currentTime + t0;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) { if (curve === 'exp') o.frequency.exponentialRampToValueAtTime(f1, t + dur); else o.frequency.linearRampToValueAtTime(f1, t + dur); }
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, filterFreq, t0 = 0, type = 'lowpass') {
  if (!audioCtx || save.muted) return;
  const t = audioCtx.currentTime + t0;
  const buf = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate * dur), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const s = audioCtx.createBufferSource(); s.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = type; f.frequency.value = filterFreq;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(audioCtx.destination); s.start(t); s.stop(t + dur);
}
function playSound(type) {
  if (!audioCtx) return;
  switch (type) {
    case 'jump': tone('square', 330, 660, 0.12, 0.12); break;
    case 'orb': tone('sine', 700, 1400, 0.18, 0.18); tone('triangle', 1050, 2100, 0.2, 0.1, 0.03); break;
    case 'pad': tone('sawtooth', 200, 900, 0.22, 0.14); tone('sine', 400, 1600, 0.25, 0.08); break;
    case 'coin': tone('sine', 1200, 1800, 0.12, 0.16); tone('sine', 1800, 2400, 0.2, 0.12, 0.08); break;
    case 'portal': tone('sawtooth', 200, 1800, 0.35, 0.12); noise(0.3, 0.12, 2500, 0, 'highpass'); break;
    case 'flip': tone('triangle', 1500, 300, 0.3, 0.14); break;
    case 'death': noise(0.5, 0.45, 900); tone('sawtooth', 220, 30, 0.5, 0.25); tone('square', 110, 20, 0.6, 0.15); break;
    case 'check': tone('sine', 880, 1320, 0.15, 0.12); break;
    case 'click': tone('sine', 800, 600, 0.06, 0.12); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.5, 0.18, i * 0.12)); break;
    case 'firework': noise(0.25, 0.15, 1800, 0, 'bandpass'); tone('sine', 900, 200, 0.3, 0.06); break;
  }
}

// ---------- Music (synth chiptune, tempo per level) ----------
const Music = { on: false, bpm: 130, root: 45, step: 0, next: 0, timer: null, stepDur: 0.12, lastBeat: 0 };
const BASS = [0, null, 0, 0, null, 7, null, 0, 10, null, 0, null, 7, 5, null, 3];
const LEADS = [[12, 15, 19, 15, 12, 15, 19, 22, 10, 14, 17, 14, 12, 15, 19, 15], [12, 19, 15, 19, 12, 19, 15, 22, 10, 17, 14, 17, 10, 17, 14, 24]];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function musicStart(bpm, root) {
  if (!audioCtx) return;
  Music.bpm = bpm; Music.root = root; Music.stepDur = 60 / bpm / 4; Music.step = 0;
  Music.next = audioCtx.currentTime + 0.05; Music.on = true;
  if (!Music.timer) Music.timer = setInterval(musicTick, 40);
}
function musicStop() { Music.on = false; }
function musicTick() {
  if (!Music.on || !audioCtx || save.muted) return;
  while (Music.next < audioCtx.currentTime + 0.18) {
    scheduleStep(Music.step, Music.next);
    Music.next += Music.stepDur; Music.step++;
  }
}
function scheduleStep(step, t) {
  const s = step % 16, bar = Math.floor(step / 16);
  const dst = audioCtx.destination;
  const env = (o, g, vol, dur) => { g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(dst); o.start(t); o.stop(t + dur + 0.02); };
  if (s % 4 === 0) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.14); env(o, g, 0.35, 0.16); Music.lastBeat = t; }
  if (s % 8 === 4) { const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.12, audioCtx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); const src = audioCtx.createBufferSource(); src.buffer = buf; const g = audioCtx.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); src.connect(g); g.connect(dst); src.start(t); }
  if (s % 2 === 1) { const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.03, audioCtx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1); const src = audioCtx.createBufferSource(); src.buffer = buf; const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; const g = audioCtx.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03); src.connect(f); f.connect(g); g.connect(dst); src.start(t); }
  const bn = BASS[s]; if (bn !== null) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'square'; o.frequency.value = midi(Music.root + bn + (bar % 4 === 3 ? -2 : 0)); env(o, g, 0.09, Music.stepDur * 1.6); }
  if (bar >= 2 || s % 2 === 0) { const ln = LEADS[bar % 2][s]; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = bar % 4 < 2 ? 'triangle' : 'sawtooth'; o.frequency.value = midi(Music.root + 12 + ln); env(o, g, bar % 4 < 2 ? 0.07 : 0.045, Music.stepDur * 0.9); }
}

// ---------- Cube customisation ----------
const COLORS = ['#ff4d6d', '#ff9f1c', '#ffd93d', '#7CFF6B', '#4cc9f0', '#c77dff', '#ffffff', '#3ddc97'];
const FACES = ['😀', '😎', '😈', '🤖', '😺', '👽'];

// ---------- Level definitions ----------
const LEVELS = [
  { id: 'l1', name: 'Stereo Start', diff: 'Easy', dEmoji: '😊', speed: 8.5, maxTier: 1, patterns: 32, rest: 4, bpm: 128, root: 45, hue: 225, seed: 11, ship: 0, roof: 0 },
  { id: 'l2', name: 'Back on Beat', diff: 'Easy', dEmoji: '🙂', speed: 9, maxTier: 2, patterns: 32, rest: 4, bpm: 134, root: 43, hue: 280, seed: 22, ship: 0, roof: 0 },
  { id: 'l3', name: 'Polar Flight', diff: 'Normal', dEmoji: '😐', speed: 9.5, maxTier: 2, patterns: 36, rest: 3, bpm: 140, root: 41, hue: 190, seed: 33, ship: 1, roof: 0 },
  { id: 'l4', name: 'Dry Lava', diff: 'Hard', dEmoji: '😠', speed: 10, maxTier: 3, patterns: 38, rest: 3, bpm: 144, root: 40, hue: 20, seed: 44, ship: 1, roof: 1 },
  { id: 'l5', name: 'Base Rush', diff: 'Harder', dEmoji: '😡', speed: 10.5, maxTier: 3, patterns: 42, rest: 3, bpm: 150, root: 38, hue: 135, seed: 55, ship: 2, roof: 1 },
  { id: 'l6', name: 'Neon Nightmare', diff: 'Insane', dEmoji: '😈', speed: 11.5, maxTier: 3, patterns: 48, rest: 2, bpm: 162, root: 36, hue: 320, seed: 66, ship: 2, roof: 2, gravShip: true },
];

// ---------- Level builder ----------
function mk(L) {
  return {
    block: (x, y, w, h) => L.objs.push({ t: 'block', x, y, w, h }),

function shipTunnel(L, m, x, r, def) {

  for (let i = 0; sx < x + len; i++, sx += 4) {
    if (i >= 2) {
      fh = clamp(fh + (r() < 0.5 ? 1 : -1) * (r() < 0.6 ? 1 : 0), 0, 2);
      ch = clamp(ch + (r() < 0.5 ? 1 : -1) * (r() < 0.6 ? 1 : 0), 0, 2);
      if (fh > 0) m.block(sx, 0, 4, fh);
      if (ch > 0) m.block(sx, CEIL - ch, 4, ch);
      const safeZone = sx + 4 < x + len - 3;
      if (i >= 3 && safeZone && r() < 0.3) m.spike(sx + 1, fh, 1);
      if (i >= 3 && safeZone && r() < 0.3) m.spike(sx + 2, CEIL - ch, -1);
      m.coin(sx + 2, (fh + CEIL - ch) / 2, false);

}

}
function buildLevel(def) {
  const r = mulberry32(def.seed);
  const L = { def, objs: [], pits: [], checkpoints: [], coinsTotal: 0, length: 0 };
  const m = mk(L);
  const n = def.patterns;
  const coinSlots = new Set([Math.floor(n * 0.22), Math.floor(n * 0.52), Math.floor(n * 0.82)]);
  const shipSlots = new Set(), roofSlots = new Set();
  for (let j = 0; j < def.ship; j++) { let s = Math.floor(n * (j + 1) / (def.ship + 1)) + 1; while (coinSlots.has(s)) s++; shipSlots.add(s); }
  for (let j = 0; j < def.roof; j++) { let s = Math.floor(n * (j * 2 + 1) / (def.roof * 2 + 1)) - 2; while (coinSlots.has(s) || shipSlots.has(s) || s < 3) s++; roofSlots.add(s); }
  let x = 12;
  for (let i = 0; i < n; i++) {
    const prog = i / n;
    let rest = Math.max(def.rest, Math.ceil(def.speed * 0.47)) + (r() < 0.4 ? 1 : 0);
    x += rest;
    L.checkpoints.push({ x: x - 1.5 });
    if (shipSlots.has(i)) { x = shipTunnel(L, m, x, r, def); continue; }
    if (roofSlots.has(i)) { x = roofRun(L, m, x, r, coinSlots.has(i)); continue; }
    const maxT = Math.min(def.maxTier, 1 + Math.floor(prog * (def.maxTier + 0.6)));
    let tier = 1 + Math.floor(r() * maxT);
    if (i < 3) tier = 1;
    if (tier >= 3 && rest < 3) x += 1;
    const pool = PATTERNS.filter(p => p.tier === tier);
    const p = pool[Math.floor(r() * pool.length)];
    x = p.build(m, x, r, coinSlots.has(i), def);
  }
  x += 10;
  L.length = x;
  L.objs.push({ t: 'finish', x, y: 0 });

}

// ---------- Particles ----------
function addParticle(x, y, type, color, speed) {
  const a = Math.random() * Math.PI * 2, s = speed || (2 + Math.random() * 6);
  particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, max: 1, color, size: 0.12 + Math.random() * 0.22, type });
}
function updateParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 12 * dt; p.vx *= 0.98; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of trail) { t.life -= dt * 2.2; t.x -= 0; }
  trail = trail.filter(t => t.life > 0);
  for (const f of floaters) { f.y += dt * 1.5; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
  for (const f of fireworks) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy -= 6 * dt; f.life -= dt; }
  fireworks = fireworks.filter(f => f.life > 0);
}
function floatText(x, y, txt, color) { floaters.push({ x, y, txt, color, life: 1 }); }

// ---------- Physics ----------
function doJump(mult, sound) {
  player.vy = JUMP_V * mult * player.grav; player.grounded = false; jumps++;
  playSound(sound || 'jump');
  for (let i = 0; i < 6; i++) addParticle(player.x + 0.5, player.y + (player.grav > 0 ? 0 : 1), 'dust', 'rgba(255,255,255,0.7)', 2 + Math.random() * 3);
}
function inPit(px) { for (const p of pits) { if (px + 0.15 >= p.x && px + 0.85 <= p.x + p.w) return true; } return false; }
function overlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }

function step(dt) {
  const spd = level.def.speed;
  const P = player;
  P.prevY = P.y;
  if (pressBuffer > 0) pressBuffer -= dt;

  // --- vertical motion ---
  if (P.mode === 'cube') {
    if (P.grounded && (holding || pressBuffer > 0)) { pressBuffer = 0; doJump(1); }
    P.vy -= G * P.grav * dt;                       // gravity always on; grounded is re-derived from collisions each frame
    if (!P.grounded) P.rot += (P.grav > 0 ? 1 : -1) * 13 * dt;
    P.vy = clamp(P.vy, -40, 40);
  } else {
    const acc = (holding ? 1 : -1) * SHIP_ACC * P.grav;
    P.vy = clamp(P.vy + acc * dt, -SHIP_MAX, SHIP_MAX);
    P.shipRot = lerp(P.shipRot, Math.atan2(P.vy * (P.grav), spd) * 0.9, 0.15);
  }
  P.x += spd * dt;
  P.y += P.vy * dt;
  let landed = false;

  // --- floor & ceiling ---
  if (P.y <= 0 && !inPit(P.x)) {
    if (P.y < -0.4) { die(); return; }             // smacked into the far wall of a pit
    if (P.grav > 0 || P.mode === 'ship') { if (P.grav > 0 || P.vy < 0) { P.y = 0; if (P.vy < 0) P.vy = 0; if (P.grav > 0) landed = true; } }
  }
  if (P.y + 1 >= CEIL) {
    if (P.grav < 0 || P.mode === 'ship') { P.y = CEIL - 1; if (P.vy > 0) P.vy = 0; if (P.grav < 0) landed = true; }
    else if (P.mode === 'cube') { P.y = CEIL - 1; P.vy = 0; }
  }
  if (P.y < -2 || P.y > CEIL + 2) { die(); return; }

  // --- objects ---
  const px = P.x + 0.1, pw = 0.8, py = P.y, ph = 0.95;
  for (const o of objs) {
    if (o.x + (o.w || 3) < P.x - 2 || o.x > P.x + 3) continue;
    if (o.t === 'block') {
      if (!overlap(px, py, pw, ph, o.x, o.y, o.w, o.h)) continue;
      const top = o.y + o.h, bot = o.y;
      const fromAbove = P.prevY >= top - 0.02, fromBelow = P.prevY + 1 <= bot + 0.02;
      if (P.mode === 'ship') {
        if (fromAbove && P.vy <= 0) { P.y = top; P.vy = 0; if (P.grav > 0) landed = true; }
        else if (fromBelow && P.vy >= 0) { P.y = bot - 1; P.vy = 0; if (P.grav < 0) landed = true; }
        else { die(); return; }
      } else {
        if (P.grav > 0 && fromAbove && P.vy <= 0) { P.y = top; P.vy = 0; landed = true; }
        else if (P.grav < 0 && fromBelow && P.vy >= 0) { P.y = bot - 1; P.vy = 0; landed = true; }
        else { die(); return; }
      }
    } else if (o.t === 'spike') {
      const sy = o.dir > 0 ? o.y + 0.2 : o.y - 0.8;

  if (!player.alive && gameState !== 'win') return;
  const cx = sx(player.x + 0.5), cy = sy(player.y + 0.5);
  const col = COLORS[save.color], face = FACES[save.face];
  if (player.mode === 'ship') drawShip(ctx, cx, cy, B, -player.shipRot, col, face, player.grav);
  else {
    // squash/stretch
    ctx.save(); ctx.translate(cx, cy);
    const st = player.grounded ? 1 : 1 + clamp(Math.abs(player.vy) / 60, 0, 0.12);
    ctx.scale(1 / st, st);
    drawCube(ctx, 0, 0, B * 0.94, player.rot * (player.grav > 0 ? 1 : 1), col, face);
    ctx.restore();
  }
}
function drawAttemptText() {
  const x = sx(2), y = sy(4.2);
  if (x < -300 || x > W + 50) return;
  ctx.font = `900 ${B * 0.9}px sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText('Attempt ' + attempts, x, y);
  ctx.fillStyle = '#fff'; ctx.fillText('Attempt ' + attempts, x, y);
  if (attempts === 1 && !hintShown) { ctx.font = `700 ${B * 0.45}px sans-serif`; ctx.strokeText('tap / space to jump  ·  hold to keep jumping', x, y + B * 0.9); ctx.fillText('tap / space to jump  ·  hold to keep jumping', x, y + B * 0.9); }
}

function draw() {
  const hue = level ? level.def.hue : LEVELS[selectedLevel].hue;
  drawBackground(hue);
  if (level) {
    const wantCeil = (player.mode === 'ship' || player.grav < 0) ? 1 : 0;
    ceilAlpha = lerp(ceilAlpha, wantCeil, 0.06);
    drawCeiling(hue, ceilAlpha);
    drawGround(hue);
    drawAttemptText();
    drawObjects(hue);
    drawPlayer();
    drawParticlesAndFX();
    if (gameState === 'win' && winTimer > 0.2) {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.font = `900 ${Math.min(W * 0.09, 70)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const s = 1 + Math.sin(time * 6) * 0.05; ctx.save(); ctx.translate(W / 2, H * 0.35); ctx.scale(s, s); ctx.strokeText('🎉 LEVEL COMPLETE! 🎉', 0, 0); ctx.fillText('🎉 LEVEL COMPLETE! 🎉', 0, 0); ctx.restore();
    }
  } else {
    // attract mode behind the menu: scrolling demo world
    drawAttract(hue);
  }
}
// attract world
let attractLevel = null;
function drawAttract(hue) {
  if (!attractLevel) attractLevel = buildLevel(LEVELS[0]);
  const saveObjs = objs, savePits = pits;
  objs = attractLevel.objs; pits = attractLevel.pits;
  camX = (attractX % (attractLevel.length - 40)) + 10; camY = 0;
  drawGround(hue); drawObjects(hue);
  // demo cube hopping along
  const px = camX + (W / B) * 0.3, hop = Math.abs(Math.sin(attractX * 1.4)) * 2;
  drawCube(ctx, sx(px), sy(hop + 0.5), B * 0.94, attractX * 2, COLORS[save.color], FACES[save.face]);
  objs = saveObjs; pits = savePits;
}

// ---------- Main loop ----------
function loop(now) {
  try {
    const dtReal = Math.min(0.05, (now - lastT) / 1000) || 0.016; lastT = now;
    update(dtReal);
    draw();
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
// pre-init safety
particles = particles || []; fireworks = fireworks || []; trail = trail || []; floaters = floaters || []; objs = objs || []; pits = pits || []; checkpoints = checkpoints || [];
requestAnimationFrame(loop);
</script>
</body>
