<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Glow Coloring Game - NAW Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #1a1330;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-container {
            position: fixed;
            z-index: 2;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
            color: #00ffff;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: bold;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        .subtitle {
            color: #ff00ff;
            font-size: clamp(1rem, 4vw, 2rem);
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            margin-top: 20px;
        }

        .play-button {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 60px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #1a1330;
            border: 3px solid #00ffff;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            z-index: 3;
            box-shadow: 0 0 20px #ff00ff, 0 0 30px #00ffff;
            transition: all 0.3s ease;
            text-shadow: none;
        }

        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 30px #ff00ff, 0 0 50px #00ffff;
        }

        .play-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff; }
            50% { text-shadow: 0 0 30px #00ffff, 0 0 50px #00ffff, 0 0 80px #00ffff; }
        }

        .game-ui {
            display: none;
        }

        .game-ui.active {
            display: block;
        }

        .top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            color: #00ffff;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            text-shadow: 0 0 5px #00ffff;
        }

        .animal-name {
            background: rgba(0, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .completion-indicator {
            background: rgba(0, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            z-index: 2;
            flex-wrap: wrap;
        }

        .color-palette {
            display: flex;
            gap: 8px;
            background: rgba(26, 19, 48, 0.8);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            flex-wrap: wrap;
            max-width: 90vw;
            justify-content: center;
        }

        .color-btn {
            width: clamp(30px, 6vw, 50px);
            height: clamp(30px, 6vw, 50px);
            border-radius: 50%;
            border: 3px solid #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.selected {
            border-width: 5px;
            transform: scale(1.2);
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            background: rgba(26, 19, 48, 0.8);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff00ff, #ff6600);
            color: #1a1330;
            border: 2px solid #ff00ff;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            transition: all 0.2s ease;
            box-shadow: 0 0 10px #ff00ff;
            text-shadow: none;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff00ff;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .tool-selector {
            display: flex;
            gap: 10px;
            background: rgba(26, 19, 48, 0.8);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .tool-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #00ff00, #00ffff);
            color: #1a1330;
            border: 2px solid #00ff00;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            transition: all 0.2s ease;
            box-shadow: 0 0 10px #00ff00;
            text-shadow: none;
        }

        .tool-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ff00;
        }

        .tool-btn.active {
            background: linear-gradient(135deg, #ffff00, #ff6600);
            border-color: #ffff00;
            box-shadow: 0 0 20px #ffff00;
        }

        .brush-size-control {
            display: flex;
            gap: 8px;
            background: rgba(26, 19, 48, 0.8);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
            align-items: center;
        }

        .size-btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #ffaa00, #ff6600);
            color: #1a1330;
            border: 2px solid #ffaa00;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            transition: all 0.2s ease;
            box-shadow: 0 0 10px #ffaa00;
            text-shadow: none;
        }

        .size-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffaa00;
        }

        .size-btn.active {
            background: linear-gradient(135deg, #ffff00, #ffaa00);
            border-color: #ffff00;
            box-shadow: 0 0 20px #ffff00;
        }

        .animal-nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff00ff, #ff6600);
            border: 3px solid #ff00ff;
            color: #1a1330;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px #ff00ff;
            text-shadow: none;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff00ff;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .completion-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 19, 48, 0.95);
            padding: 40px;
            border-radius: 30px;
            border: 3px solid #ffff00;
            text-align: center;
            z-index: 4;
            display: none;
            box-shadow: 0 0 40px #ffff00;
        }

        .completion-popup.show {
            display: block;
            animation: popup-appear 0.5s ease-out;
        }

        @keyframes popup-appear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .completion-popup h2 {
            color: #ffff00;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ffff00;
        }

        .stars {
            font-size: 3rem;
            margin: 20px 0;
            letter-spacing: 10px;
        }

        .continue-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ffff00, #ff6600);
            color: #1a1330;
            border: 3px solid #ffff00;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #ffff00;
            transition: all 0.2s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #ffff00;
        }

        @media (max-height: 600px) {
            .animal-nav {
                top: 30%;
                right: 10px;
            }
            .bottom-bar {
                bottom: 10px;
                gap: 8px;
            }
            .control-buttons, .tool-selector, .brush-size-control, .color-palette {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-container" id="startScreen">
        <div class="title">
            ✨ Capybara Glow ✨
            <div class="subtitle">Neon Coloring Adventure</div>
        </div>
        <button class="play-button" id="playBtn">PLAY</button>
    </div>

    <div class="game-ui" id="gameUI">
        <div class="top-bar">
            <div class="animal-name" id="animalName">Capybara</div>
            <div class="completion-indicator" id="completionIndicator">0%</div>
        </div>

        <div class="bottom-bar">
            <div class="tool-selector">
                <button class="tool-btn active" id="fillTool">🪣 Fill</button>
                <button class="tool-btn" id="brushTool">🖌️ Brush</button>
            </div>

            <div class="color-palette" id="colorPalette"></div>

            <div class="brush-size-control">
                <label for="brushSize" style="color: #ffaa00; font-size: clamp(0.7rem, 1.5vw, 1rem);">Size:</label>
                <button class="size-btn active" data-size="8">S</button>
                <button class="size-btn" data-size="16">M</button>
                <button class="size-btn" data-size="25">L</button>
            </div>

            <div class="control-buttons">
                <button class="btn" id="clearBtn">🔄 Clear</button>
                <button class="btn" id="homeBtn">🏠 Home</button>
            </div>
        </div>

        <div class="animal-nav">
            <button class="nav-btn" id="prevBtn">‹</button>
            <button class="nav-btn" id="nextBtn">›</button>
        </div>
    </div>

    <div class="completion-popup" id="completionPopup">
        <h2>🎉 Amazing! 🎉</h2>
        <p id="popupMessage" style="color: #00ffff; font-size: clamp(1rem, 2vw, 1.5rem); margin-bottom: 20px;"></p>
        <div class="stars" id="starRating">⭐⭐⭐</div>
        <button class="continue-btn" id="nextAnimalBtn">Next Animal →</button>
    </div>

    <script>
        // ===================== AUDIO ENGINE =====================
        const AudioEngine = {
            audioContext: null,

            init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            },

            playPaintSound() {
                this.init();
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.start(now);
                osc.stop(now + 0.1);
            },

            playColorSelectSound() {
                this.init();
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.linearRampToValueAtTime(1500, now + 0.15);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.start(now);
                osc.stop(now + 0.15);
            },

            playAnimalSwitchSound() {
                this.init();
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                [800, 1000].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                    osc.start(now + i * 0.05);
                    osc.stop(now + 0.15);
                });
            },

            playCompletionJingle() {
                this.init();
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6

                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.frequency.setValueAtTime(freq, now + i * 0.15);
                    gain.gain.setValueAtTime(0.3, now + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);

                    osc.start(now + i * 0.15);
                    osc.stop(now + i * 0.15 + 0.3);
                });
            },

            playUIClick() {
                this.init();
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.frequency.setValueAtTime(1500, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.start(now);
                osc.stop(now + 0.08);
            }
        };

        // ===================== ANIMAL DEFINITIONS =====================
        const Animals = {
            capybara: {
                name: 'Capybara',
                draw: function(ctx, x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // Body
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 80, 50, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Head
                    ctx.beginPath();
                    ctx.ellipse(70, -15, 45, 40, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Snout
                    ctx.beginPath();
                    ctx.ellipse(105, -10, 25, 20, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Ears
                    ctx.beginPath();
                    ctx.ellipse(60, -35, 15, 20, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(80, -40, 15, 20, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Eyes
                    ctx.beginPath();
                    ctx.arc(85, -20, 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(95, -22, 6, 0, Math.PI * 2);
                    ctx.stroke();

                    // Legs
                    ctx.beginPath();
                    ctx.moveTo(-30, 40);
                    ctx.lineTo(-30, 70);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-10, 42);
                    ctx.lineTo(-10, 72);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(30, 42);
                    ctx.lineTo(30, 72);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(50, 40);
                    ctx.lineTo(50, 70);
                    ctx.stroke();

                    ctx.restore();
                }
            },
            unicorn: {
                name: 'Unicorn',
                draw: function(ctx, x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // Horn
                    ctx.beginPath();
                    ctx.moveTo(70, -60);
                    ctx.lineTo(75, -30);
                    ctx.lineTo(65, -30);
                    ctx.closePath();
                    ctx.stroke();

                    // Head
                    ctx.beginPath();
                    ctx.ellipse(70, -20, 40, 45, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Mane
                    ctx.beginPath();
                    ctx.arc(50, -40, 20, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(50, -20, 18, 0, Math.PI * 2);
                    ctx.stroke();

                    // Snout
                    ctx.beginPath();
                    ctx.ellipse(100, -10, 20, 18, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Body
                    ctx.beginPath();
                    ctx.ellipse(-10, 5, 85, 55, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-80, 10);
                    ctx.quadraticCurveTo(-120, 20, -110, 60);
                    ctx.stroke();

                    // Eyes
                    ctx.beginPath();
                    ctx.arc(60, -25, 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(75, -28, 5, 0, Math.PI * 2);
                    ctx.stroke();

                    // Legs
                    ctx.beginPath();
                    ctx.moveTo(-40, 50);
                    ctx.lineTo(-40, 85);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-15, 52);
                    ctx.lineTo(-15, 87);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(20, 52);
                    ctx.lineTo(20, 87);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(45, 50);
                    ctx.lineTo(45, 85);
                    ctx.stroke();

                    ctx.restore();
                }
            },
            elephant: {
                name: 'Elephant',
                draw: function(ctx, x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // Body
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 75, 60, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Head
                    ctx.beginPath();
                    ctx.ellipse(50, -30, 50, 55, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Trunk
                    ctx.beginPath();
                    ctx.moveTo(75, -10);
                    ctx.quadraticCurveTo(95, 20, 85, 50);
                    ctx.stroke();

                    // Ears
                    ctx.beginPath();
                    ctx.ellipse(25, -10, 35, 50, 0.3, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(70, -15, 35, 50, -0.3, 0, Math.PI * 2);
                    ctx.stroke();

                    // Eyes
                    ctx.beginPath();
                    ctx.arc(45, -40, 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(60, -45, 6, 0, Math.PI * 2);
                    ctx.stroke();

                    // Tusk
                    ctx.beginPath();
                    ctx.moveTo(70, 10);
                    ctx.quadraticCurveTo(80, 30, 75, 50);
                    ctx.stroke();

                    // Legs
                    ctx.beginPath();
                    ctx.moveTo(-35, 60);
                    ctx.lineTo(-35, 90);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-10, 65);
                    ctx.lineTo(-10, 95);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(25, 65);
                    ctx.lineTo(25, 95);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(50, 60);
                    ctx.lineTo(50, 90);
                    ctx.stroke();

                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-60, 40);
                    ctx.quadraticCurveTo(-90, 50, -95, 75);
                    ctx.stroke();

                    ctx.restore();
                }
            },
            butterfly: {
                name: 'Butterfly',
                draw: function(ctx, x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // Body
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 50, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Left upper wing
                    ctx.beginPath();
                    ctx.ellipse(-50, -25, 40, 35, -0.3, 0, Math.PI * 2);
                    ctx.stroke();

                    // Right upper wing
                    ctx.beginPath();
                    ctx.ellipse(50, -25, 40, 35, 0.3, 0, Math.PI * 2);
                    ctx.stroke();

                    // Left lower wing
                    ctx.beginPath();
                    ctx.ellipse(-45, 30, 35, 30, -0.2, 0, Math.PI * 2);
                    ctx.stroke();

                    // Right lower wing
                    ctx.beginPath();
                    ctx.ellipse(45, 30, 35, 30, 0.2, 0, Math.PI * 2);
                    ctx.stroke();

                    // Antennae
                    ctx.beginPath();
                    ctx.moveTo(-5, -50);
                    ctx.quadraticCurveTo(-15, -70, -20, -75);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(5, -50);
                    ctx.quadraticCurveTo(15, -70, 20, -75);
                    ctx.stroke();

                    // Head
                    ctx.beginPath();
                    ctx.arc(0, -40, 8, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();
                }
            },
            dolphin: {
                name: 'Dolphin',
                draw: function(ctx, x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // Body
                    ctx.beginPath();
                    ctx.ellipse(-10, 0, 90, 45, 0.1, 0, Math.PI * 2);
                    ctx.stroke();

                    // Head
                    ctx.beginPath();
                    ctx.ellipse(50, -10, 35, 40, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Beak
                    ctx.beginPath();
                    ctx.moveTo(75, -5);
                    ctx.lineTo(105, 0);
                    ctx.lineTo(75, 5);
                    ctx.closePath();
                    ctx.stroke();

                    // Dorsal fin
                    ctx.beginPath();
                    ctx.moveTo(-5, -40);
                    ctx.lineTo(5, -15);
                    ctx.lineTo(-5, -15);
                    ctx.closePath();
                    ctx.stroke();

                    // Pectoral fin left
                    ctx.beginPath();
                    ctx.ellipse(-20, 35, 25, 15, 0.3, 0, Math.PI * 2);
                    ctx.stroke();

                    // Tail flukes
                    ctx.beginPath();
                    ctx.moveTo(-80, -5);
                    ctx.quadraticCurveTo(-110, -30, -120, -45);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-80, 5);
                    ctx.quadraticCurveTo(-110, 30, -120, 45);
                    ctx.stroke();

                    // Eye
                    ctx.beginPath();
                    ctx.arc(35, -20, 5, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();
                }
            },
            cat: {
                name: 'Cat',
                draw: function(ctx, x, y, scale) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(scale, scale);

                    // Head
                    ctx.beginPath();
                    ctx.ellipse(0, -10, 45, 50, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Ears
                    ctx.beginPath();
                    ctx.moveTo(-35, -50);
                    ctx.lineTo(-45, -80);
                    ctx.lineTo(-25, -50);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(35, -50);
                    ctx.lineTo(45, -80);
                    ctx.lineTo(25, -50);
                    ctx.closePath();
                    ctx.stroke();

                    // Inner ears
                    ctx.beginPath();
                    ctx.moveTo(-35, -50);
                    ctx.lineTo(-40, -70);
                    ctx.lineTo(-30, -50);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(35, -50);
                    ctx.lineTo(40, -70);
                    ctx.lineTo(30, -50);
                    ctx.closePath();
                    ctx.stroke();

                    // Snout
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 25, 20, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Nose
                    ctx.beginPath();
                    ctx.ellipse(0, 5, 8, 6, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Eyes
                    ctx.beginPath();
                    ctx.arc(-15, -15, 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(15, -15, 8, 0, Math.PI * 2);
                    ctx.stroke();

                    // Body
                    ctx.beginPath();
                    ctx.ellipse(0, 60, 50, 70, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(45, 40);
                    ctx.quadraticCurveTo(80, 60, 75, 10);
                    ctx.stroke();

                    // Front legs
                    ctx.beginPath();
                    ctx.moveTo(-20, 120);
                    ctx.lineTo(-20, 160);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(20, 120);
                    ctx.lineTo(20, 160);
                    ctx.stroke();

                    // Back legs
                    ctx.beginPath();
                    ctx.moveTo(-35, 130);
                    ctx.lineTo(-35, 170);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(35, 130);
                    ctx.lineTo(35, 170);
                    ctx.stroke();

                    ctx.restore();
                }
            }
        };

        // ===================== COLOR PALETTE =====================
        const ColorPalette = [
            { name: 'Neon Pink', hex: '#ff00ff', glow: '#ff00ff' },
            { name: 'Neon Cyan', hex: '#00ffff', glow: '#00ffff' },
            { name: 'Neon Green', hex: '#00ff00', glow: '#00ff00' },
            { name: 'Neon Orange', hex: '#ff6600', glow: '#ff6600' },
            { name: 'Neon Purple', hex: '#bb00ff', glow: '#bb00ff' },
            { name: 'Neon Yellow', hex: '#ffff00', glow: '#ffff00' },
            { name: 'Neon Red', hex: '#ff0055', glow: '#ff0055' },
            { name: 'Neon White', hex: '#ffffff', glow: '#ffffff' },
            { name: 'Neon Blue', hex: '#0099ff', glow: '#0099ff' },
            { name: 'Rainbow Sparkle', hex: '#ff00ff', glow: '#00ffff' }
        ];

        // ===================== GAME STATE =====================
        const GameState = {
            currentAnimal: 0,
            tool: 'fill', // 'fill' or 'brush'
            brushSize: 8,
            selectedColor: 0,
            coloredPixels: new Set(),
            isDrawing: false,
            showStartScreen: true,
            animals: Object.values(Animals),
            totalAnimalPixels: 0,
            completionThreshold: 0.7 // 70% to complete
        };

        // ===================== CANVAS & RENDERING =====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            redrawCanvas();
        }

        function getAnimalScale() {
            return Math.min(canvas.width, canvas.height) / 400;
        }

        function getAnimalPosition() {
            return {
                x: canvas.width * 0.5,
                y: canvas.height * 0.45
            };
        }

        function drawGlowingStroke(color) {
            ctx.shadowBlur = 40;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 25;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.shadowBlur = 10;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawAnimal() {
            const animal = GameState.animals[GameState.currentAnimal];
            const pos = getAnimalPosition();
            const scale = getAnimalScale();

            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';

            animal.draw(ctx, pos.x, pos.y, scale);
        }

        function redrawCanvas() {
            ctx.fillStyle = '#1a1330';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid background for aesthetic
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            drawAnimal();
            drawColoredAreas();
        }

        function drawColoredAreas() {
            if (GameState.coloredPixels.size === 0) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            const colorMap = new Map();

            for (const pixelKey of GameState.coloredPixels) {
                const idx = parseInt(pixelKey);
                const color = colorMap.get(pixelKey);
                if (color) {
                    data[idx] = color.r;
                    data[idx + 1] = color.g;
                    data[idx + 2] = color.b;
                    data[idx + 3] = 200;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function getPixelKey(x, y) {
            return ((y * canvas.width + x) * 4).toString();
        }

        function isPixelInAnimal(x, y) {
            const pos = getAnimalPosition();
            const scale = getAnimalScale();

            const dx = x - pos.x;
            const dy = y - pos.y;

            // Rough circular check for now
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < (150 * scale);
        }

        // ===================== UI INITIALIZATION =====================
        function initializeUI() {
            const paletteContainer = document.getElementById('colorPalette');
            paletteContainer.innerHTML = '';

            ColorPalette.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.style.backgroundColor = color.hex;
                btn.style.boxShadow = `0 0 15px ${color.glow}, inset 0 0 10px ${color.glow}`;
                if (index === 0) btn.classList.add('selected');
                btn.addEventListener('click', () => selectColor(index));
                paletteContainer.appendChild(btn);
            });
        }

        // ===================== EVENT HANDLERS =====================
        function selectColor(index) {
            GameState.selectedColor = index;
            AudioEngine.playColorSelectSound();

            document.querySelectorAll('.color-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === index);
            });
        }

        function selectTool(tool) {
            GameState.tool = tool;
            AudioEngine.playUIClick();

            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (tool === 'fill') {
                document.getElementById('fillTool').classList.add('active');
            } else {
                document.getElementById('brushTool').classList.add('active');
            }
        }

        function selectBrushSize(size) {
            GameState.brushSize = size;
            AudioEngine.playUIClick();

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function clearCanvas() {
            GameState.coloredPixels.clear();
            AudioEngine.playUIClick();
            redrawCanvas();
        }

        function goToHome() {
            AudioEngine.playUIClick();
            GameState.showStartScreen = true;
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('gameUI').classList.remove('active');
            document.getElementById('completionPopup').classList.remove('show');
            redrawCanvas();
        }

        function switchAnimal(direction) {
            AudioEngine.playAnimalSwitchSound();
            GameState.currentAnimal += direction;
            if (GameState.currentAnimal < 0) {
                GameState.currentAnimal = GameState.animals.length - 1;
            } else if (GameState.currentAnimal >= GameState.animals.length) {
                GameState.currentAnimal = 0;
            }

            GameState.coloredPixels.clear();
            document.getElementById('animalName').textContent = GameState.animals[GameState.currentAnimal].name;
            document.getElementById('completionIndicator').textContent = '0%';
            redrawCanvas();
        }

        function updateCompletion() {
            const completion = Math.min(100, Math.round((GameState.coloredPixels.size / Math.max(GameState.totalAnimalPixels, 1)) * 100));
            document.getElementById('completionIndicator').textContent = completion + '%';

            if (completion >= GameState.completionThreshold * 100) {
                showCompletionPopup(completion);
            }
        }

        function showCompletionPopup(completion) {
            AudioEngine.playCompletionJingle();

            const stars = Math.min(3, Math.max(1, Math.ceil((completion / 100) * 3)));
            const starDisplay = '⭐'.repeat(stars);

            document.getElementById('starRating').textContent = starDisplay;
            document.getElementById('popupMessage').textContent =
                `You've colored ${completion}% of the ${GameState.animals[GameState.currentAnimal].name}!`;

            document.getElementById('completionPopup').classList.add('show');
        }

        function startGame() {
            AudioEngine.playUIClick();
            GameState.showStartScreen = false;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameUI').classList.add('active');
            redrawCanvas();
        }

        // ===================== INTERACTION HANDLERS =====================
        function floodFill(x, y) {
            if (!isPixelInAnimal(x, y)) return;

            AudioEngine.playPaintSound();

            const color = ColorPalette[GameState.selectedColor];

            // Simple fill: color nearby pixels
            const radius = 30;
            for (let dx = -radius; dx < radius; dx++) {
                for (let dy = -radius; dy < radius; dy++) {
                    if (dx * dx + dy * dy < radius * radius) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height && isPixelInAnimal(px, py)) {
                            GameState.coloredPixels.add(getPixelKey(px, py));
                        }
                    }
                }
            }

            updateCompletion();
            redrawCanvas();
        }

        function paintBrush(x, y) {
            if (!isPixelInAnimal(x, y)) return;

            AudioEngine.playPaintSound();

            const radius = GameState.brushSize / 2;
            for (let dx = -radius; dx < radius; dx++) {
                for (let dy = -radius; dy < radius; dy++) {
                    if (dx * dx + dy * dy < radius * radius) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height && isPixelInAnimal(px, py)) {
                            GameState.coloredPixels.add(getPixelKey(px, py));
                        }
                    }
                }
            }

            updateCompletion();
            redrawCanvas();
        }

        // ===================== TOUCH/MOUSE EVENTS =====================
        canvas.addEventListener('mousedown', (e) => {
            GameState.isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (GameState.tool === 'fill') {
                floodFill(x, y);
            } else {
                paintBrush(x, y);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!GameState.isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (GameState.tool === 'brush') {
                paintBrush(x, y);
            }
        });

        canvas.addEventListener('mouseup', () => {
            GameState.isDrawing = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            GameState.isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (GameState.tool === 'fill') {
                floodFill(x, y);
            } else {
                paintBrush(x, y);
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!GameState.isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (GameState.tool === 'brush') {
                paintBrush(x, y);
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            GameState.isDrawing = false;
        });

        // ===================== UI BUTTON EVENTS =====================
        document.getElementById('playBtn').addEventListener('click', startGame);
        document.getElementById('homeBtn').addEventListener('click', goToHome);
        document.getElementById('clearBtn').addEventListener('click', clearCanvas);

        document.getElementById('fillTool').addEventListener('click', () => selectTool('fill'));
        document.getElementById('brushTool').addEventListener('click', () => selectTool('brush'));

        document.getElementById('prevBtn').addEventListener('click', () => switchAnimal(-1));
        document.getElementById('nextBtn').addEventListener('click', () => switchAnimal(1));

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => selectBrushSize(parseInt(e.target.dataset.size)));
        });

        document.getElementById('nextAnimalBtn').addEventListener('click', () => {
            document.getElementById('completionPopup').classList.remove('show');
            switchAnimal(1);
        });

        // ===================== INITIALIZATION =====================
        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        initializeUI();

        // Pre-calculate animal pixels for completion
        GameState.totalAnimalPixels = 2000;

        console.log('Capybara Glow Coloring Game loaded! 🌈✨');
    </script>
</body>
</html>
