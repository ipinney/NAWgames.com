<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Capybara Glow - Color Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Star particles background */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Start screen */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            z-index: 1000;
            gap: 2rem;
        }

        .start-screen.hidden {
            display: none;
        }

        .title {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: bold;
            text-align: center;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ff88);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 10px rgba(255, 0, 200, 0.5);
            letter-spacing: 2px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: clamp(1.2rem, 6vw, 2rem);
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .play-button {
            padding: clamp(0.75rem, 4vw, 1.5rem) clamp(1.5rem, 8vw, 3rem);
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            background: linear-gradient(45deg, #ff0080, #ff8c00);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.8);
            transition: all 0.3s ease;
            font-family: 'Comic Sans MS', cursive;
        }

        .play-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 0, 128, 1);
        }

        /* Main game container */
        .game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            gap: 1rem;
        }

        .game-container.hidden {
            display: none;
        }

        /* Top section */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0.5rem;
            gap: 1rem;
        }

        .nav-button {
            background: linear-gradient(45deg, #00ffff, #00ff88);
            color: #1a0033;
            border: none;
            border-radius: 10px;
            width: clamp(2.5rem, 8vw, 3.5rem);
            height: clamp(2.5rem, 8vw, 3.5rem);
            font-size: clamp(1.2rem, 5vw, 2rem);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .nav-button:active {
            transform: scale(0.9);
            box-shadow: 0 0 25px rgba(0, 255, 200, 1);
        }

        .animal-name {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            text-align: center;
            flex-grow: 1;
        }

        /* SVG area */
        .svg-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 90%;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 255, 200, 0.4));
        }

        svg path {
            pointer-events: auto;
            cursor: pointer;
            transition: filter 0.2s ease;
            stroke: #000;
            stroke-width: 3;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        svg path:hover {
            filter: brightness(1.1);
        }

        svg path:active {
            filter: brightness(0.9) drop-shadow(0 0 10px currentColor);
        }

        /* Tools and palette section */
        .controls-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: center;
        }

        .tools-bar {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tool-button {
            padding: clamp(0.6rem, 3vw, 1rem);
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            background: linear-gradient(45deg, #ff00ff, #ff0080);
            color: white;
            border: 2px solid #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
            transition: all 0.2s ease;
            font-family: 'Comic Sans MS', cursive;
            min-width: 2.5rem;
            min-height: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tool-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 0, 255, 1);
        }

        /* Color palette */
        .color-palette {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 100%;
        }

        .color-button {
            width: clamp(2.2rem, 6vw, 3rem);
            height: clamp(2.2rem, 6vw, 3rem);
            border: 3px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        .color-button:hover {
            transform: scale(1.1);
        }

        .color-button:active {
            transform: scale(0.95);
        }

        .color-button.selected {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
            transform: scale(1.2);
        }

        /* Glow effect for colored regions */
        @keyframes glow {
            0% { filter: drop-shadow(0 0 0px currentColor); }
            50% { filter: drop-shadow(0 0 8px currentColor); }
            100% { filter: drop-shadow(0 0 0px currentColor); }
        }

        .glowing {
            animation: glow 0.6s ease-out;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .game-container {
                padding: 0.5rem;
            }

            .top-section {
                padding-top: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Star particles -->
    <div class="stars-bg" id="starsBg"></div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <h1 class="title">CAPYBARA GLOW</h1>
        <p class="subtitle">✨ Tap & Color! ✨</p>
        <button class="play-button" id="playButton">PLAY</button>

        <div class="controls-section">
            <div class="tools-bar">
                <button class="tool-button" id="eraserBtn" title="Erase">🧹</button>
                <button class="tool-button" id="sparkleBtn" title="Magic!">✨</button>

            </div>
            <div class="color-palette" id="colorPalette"></div>
        </div>

    <script>
        // ====== AUDIO CONTEXT ======
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const now = audioContext.currentTime;

            if (type === 'tap') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'sparkle') {
                for (let i = 0; i < 3; i++) {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.setValueAtTime(1200 + i * 200, now + i * 0.05);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15 + i * 0.05);
                    gain.gain.setValueAtTime(0.2, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15 + i * 0.05);
                    osc.start(now + i * 0.05);
                    osc.stop(now + 0.15 + i * 0.05);
                }
            } else if (type === 'pop') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'swoosh') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

                    <!-- Shell Pattern 1 (top center) -->
                    <path id="turtle-hex-1" d="M 200 130 Q 220 140 220 160 Q 200 170 180 160 Q 180 140 200 130 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 2 (upper left) -->
                    <path id="turtle-hex-2" d="M 160 150 Q 175 160 170 180 Q 150 185 140 170 Q 145 160 160 150 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 3 (upper right) -->
                    <path id="turtle-hex-3" d="M 240 150 Q 260 160 260 180 Q 250 185 230 170 Q 235 160 240 150 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 4 (middle left) -->
                    <path id="turtle-hex-4" d="M 140 190 Q 160 195 160 215 Q 135 225 125 205 Q 130 195 140 190 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 5 (middle center) -->
                    <path id="turtle-hex-5" d="M 200 195 Q 225 200 225 225 Q 200 240 175 225 Q 175 200 200 195 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 6 (middle right) -->
                    <path id="turtle-hex-6" d="M 260 190 Q 280 195 280 215 Q 265 225 245 205 Q 250 195 260 190 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 7 (lower left) -->
                    <path id="turtle-hex-7" d="M 160 230 Q 175 235 170 255 Q 150 260 140 245 Q 150 240 160 230 Z" fill="#f5f5f5"/>
                    <!-- Shell Pattern 8 (lower right) -->
                    <path id="turtle-hex-8" d="M 240 230 Q 260 235 250 255 Q 230 260 220 245 Q 230 240 240 230 Z" fill="#f5f5f5"/>
                    <!-- Head -->
                    <path id="turtle-head" d="M 200 280 Q 210 300 200 320 Q 190 310 190 290 Z" fill="#f5f5f5"/>
                    <!-- Left Eye -->
                    <path id="turtle-eye-left" d="M 195 295 Q 198 293 201 296 Q 198 300 195 298 Z" fill="#f5f5f5"/>
                    <!-- Left Front Leg -->
                    <path id="turtle-leg-lf" d="M 160 250 Q 150 270 155 300 Q 165 305 175 295 Z" fill="#f5f5f5"/>
                    <!-- Right Front Leg -->
                    <path id="turtle-leg-rf" d="M 240 250 Q 250 270 245 300 Q 235 305 225 295 Z" fill="#f5f5f5"/>
                    <!-- Left Back Leg -->
                    <path id="turtle-leg-lb" d="M 130 220 Q 110 240 120 270 Q 130 275 140 260 Z" fill="#f5f5f5"/>
                    <!-- Right Back Leg -->
                    <path id="turtle-leg-rb" d="M 270 220 Q 290 240 280 270 Q 270 275 260 260 Z" fill="#f5f5f5"/>
                    <!-- Tail -->
                    <path id="turtle-tail" d="M 200 280 Q 200 300 190 320 Q 195 310 200 285 Z" fill="#f5f5f5"/>
                </svg>`
            }
        ];

        // ====== INITIALIZE STARS ======
        function createStars() {
            const starsBg = document.getElementById('starsBg');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsBg.appendChild(star);
            }
        }

        createStars();

        // ====== LOAD ANIMAL ======
        function loadAnimal(index) {
            currentAnimalIndex = index;
            const animal = animals[index];
            document.getElementById('animalName').textContent = animal.name;
            document.getElementById('svgContainer').innerHTML = animal.svg;

            // Attach click handlers to SVG paths
            document.querySelectorAll('svg path').forEach(path => {
                path.addEventListener('click', colorPath);
                path.addEventListener('touchstart', colorPath);
            });

            coloredRegions = {};
            playSound('swoosh');
        }

        // ====== COLOR PATH ======
        function colorPath(e) {
            e.preventDefault();
            const path = e.target;
            if (!path.id) return;

            if (selectedColor === 'ERASE') {
                path.setAttribute('fill', '#f5f5f5');
                delete coloredRegions[path.id];
                playSound('pop');
            } else {
                path.setAttribute('fill', selectedColor);
                coloredRegions[path.id] = selectedColor;
                path.classList.add('glowing');
                setTimeout(() => path.classList.remove('glowing'), 600);
                playSound('tap');
            }
        }

        // ====== BUILD COLOR PALETTE ======
        function buildPalette() {
            const palette = document.getElementById('colorPalette');
            palette.innerHTML = '';

            colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'color-button';
                btn.style.backgroundColor = color.hex;
                btn.title = color.name;

                if (index === 0) btn.classList.add('selected');

                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-button').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedColor = color.hex;
                });

                palette.appendChild(btn);
            });
        }

        // ====== TOOLS ======
        document.getElementById('eraserBtn').addEventListener('click', () => {
            document.querySelectorAll('.color-button').forEach(b => b.classList.remove('selected'));
            selectedColor = 'ERASE';
            playSound('pop');
        });

        document.getElementById('sparkleBtn').addEventListener('click', () => {
            playSound('sparkle');
            const paths = document.querySelectorAll('svg path');
            paths.forEach(path => {
                if (path.id) {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)].hex;
                    path.setAttribute('fill', randomColor);
                    coloredRegions[path.id] = randomColor;
                    path.classList.add('glowing');
                    setTimeout(() => path.classList.remove('glowing'), 600);
                }
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            playSound('pop');
            document.querySelectorAll('svg path').forEach(path => {
                path.setAttribute('fill', '#f5f5f5');
            });
            coloredRegions = {};
        });

        // ====== NAVIGATION ======
        document.getElementById('prevBtn').addEventListener('click', () => {
            let newIndex = currentAnimalIndex - 1;
            if (newIndex < 0) newIndex = animals.length - 1;
            loadAnimal(newIndex);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            let newIndex = currentAnimalIndex + 1;
            if (newIndex >= animals.length) newIndex = 0;
            loadAnimal(newIndex);
        });

        // ====== START SCREEN ======
        document.getElementById('playButton').addEventListener('click', () => {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            buildPalette();
            loadAnimal(0);
        });

        // ====== PREVENT DEFAULT TOUCH BEHAVIORS ======
        document.addEventListener('touchmove', (e) => {
            if (e.target.tagName === 'path') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
