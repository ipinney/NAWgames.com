<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Glow - Coloring Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1330;
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a1330 50%, #0f0820 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-content {
            text-align: center;
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(120deg, #ff006e, #8338ec, #3a86ff, #06ffa5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 110, 0.5);
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #b195f8;
            margin-bottom: 3rem;
            text-shadow: 0 0 20px rgba(177, 149, 248, 0.5);
        }

        .play-button {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: linear-gradient(120deg, #ff006e, #8338ec);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 0, 110, 0.8);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(26, 19, 48, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 50;
            border-bottom: 2px solid rgba(131, 56, 236, 0.5);
            box-shadow: 0 4px 20px rgba(255, 0, 110, 0.2);
        }

        .animal-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #06ffa5;
            text-shadow: 0 0 10px rgba(6, 255, 165, 0.6);
        }

        .completion {
            font-size: 1rem;
            color: #8338ec;
            text-shadow: 0 0 10px rgba(131, 56, 236, 0.5);
        }

        .nav-arrows {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 40;
        }

        .nav-button {
            width: 45px;
            height: 45px;
            background: rgba(131, 56, 236, 0.6);
            border: 2px solid rgba(131, 56, 236, 0.8);
            color: #06ffa5;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(131, 56, 236, 0.4);
        }

        .nav-button:hover {
            background: rgba(131, 56, 236, 0.8);
            box-shadow: 0 0 25px rgba(131, 56, 236, 0.7);
        }

        .nav-button:active {
            transform: scale(0.9);
        }

        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #bottomToolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 19, 48, 0.98);
            border-top: 2px solid rgba(131, 56, 236, 0.5);
            box-shadow: 0 -4px 20px rgba(255, 0, 110, 0.2);
            z-index: 50;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .palette-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0;
            flex: 0 0 auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .palette-row::-webkit-scrollbar {
            display: none;
        }

        .color-button {
            width: 32px;
            height: 32px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .color-button:hover {
            transform: scale(1.15);
            box-shadow: 0 0 15px currentColor;
        }

        .color-button.selected {
            border-width: 3px;
            transform: scale(1.2);
            box-shadow: 0 0 20px currentColor;
        }

        .tools-row {
            display: flex;
            gap: 6px;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-button {
            width: 36px;
            height: 36px;
            background: rgba(131, 56, 236, 0.5);
            border: 2px solid rgba(131, 56, 236, 0.8);
            color: #06ffa5;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(131, 56, 236, 0.4);
            flex-shrink: 0;
        }

        .tool-button:hover {
            background: rgba(131, 56, 236, 0.7);
            box-shadow: 0 0 15px rgba(131, 56, 236, 0.7);
        }

        .tool-button.active {
            background: rgba(255, 0, 110, 0.7);
            border-color: rgba(255, 0, 110, 0.8);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.7);
        }

        .tool-button:active {
            transform: scale(0.9);
        }

        .size-selector {
            display: flex;
            gap: 4px;
            background: rgba(131, 56, 236, 0.3);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(131, 56, 236, 0.5);
        }

        .size-button {
            width: 28px;
            height: 28px;
            background: transparent;
            border: 1px solid rgba(131, 56, 236, 0.6);
            color: #06ffa5;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .size-button.active {
            background: rgba(131, 56, 236, 0.7);
            border-color: rgba(131, 56, 236, 0.9);
            box-shadow: 0 0 8px rgba(131, 56, 236, 0.6);
        }

        .size-button:hover {
            background: rgba(131, 56, 236, 0.5);
        }

        #starPopup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #2d1b4e 0%, #1a1330 100%);
            border: 3px solid #06ffa5;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            z-index: 200;
            display: none;
            box-shadow: 0 0 40px rgba(6, 255, 165, 0.6), inset 0 0 20px rgba(131, 56, 236, 0.3);
            animation: popupAppear 0.5s ease-out;
            min-width: 280px;
        }

        @keyframes popupAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .popup-stars {
            font-size: 4rem;
            margin: 20px 0;
            animation: starsRotate 1s ease-out;
        }

        @keyframes starsRotate {
            from {
                transform: rotate(-180deg);
            }
            to {
                transform: rotate(0deg);
            }
        }

        .popup-text {
            font-size: 1.5rem;
            color: #06ffa5;
            text-shadow: 0 0 10px rgba(6, 255, 165, 0.6);
            margin-bottom: 20px;
        }

        .continue-button {
            padding: 10px 30px;
            font-size: 1rem;
            background: linear-gradient(120deg, #ff006e, #8338ec);
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6);
            font-weight: bold;
        }

        .continue-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.8);
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .play-button {
                padding: 12px 40px;
                font-size: 1.2rem;
            }

            #topBar {
                height: 45px;
                padding: 0 15px;
            }

            .animal-name {
                font-size: 1rem;
            }

            .completion {
                font-size: 0.9rem;
            }

            .color-button {
                width: 28px;
                height: 28px;
            }

            .tool-button {
                width: 32px;
                height: 32px;
                font-size: 0.95rem;
            }

            #bottomToolbar {
                padding: 6px 8px;
                gap: 6px;
            }

            .tools-row {
                gap: 4px;
            }
        }
    </style>
</head>
<body>

<div id="startScreen">
    <div class="start-content">
        <div class="title">Capybara Glow</div>
        <div class="subtitle">Paint adorable animals with neon colors!</div>
        <button class="play-button" onclick="startGame()">PLAY</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="topBar">
    <div class="animal-name" id="animalName">Capybara</div>
    <div class="completion" id="completion">0%</div>
</div>

<div class="nav-arrows">
    <button class="nav-button" id="prevBtn" onclick="previousAnimal()">◀</button>
    <button class="nav-button" id="nextBtn" onclick="nextAnimal()">▶</button>
</div>

<div id="bottomToolbar">
    <div class="palette-row" id="paletteRow"></div>
    <div class="tools-row">
        <button class="tool-button" id="brushTool" onclick="selectTool('brush')" title="Brush">🖌</button>
        <button class="tool-button" id="fillTool" onclick="selectTool('fill')" title="Fill">🪣</button>
        <div class="size-selector">
            <button class="size-button active" onclick="setBrushSize(5)">S</button>
            <button class="size-button" onclick="setBrushSize(10)">M</button>
            <button class="size-button" onclick="setBrushSize(15)">L</button>
        </div>
        <button class="tool-button" onclick="undoAction()" title="Undo">↶</button>
        <button class="tool-button" onclick="clearCanvas()" title="Clear">🗑</button>
    </div>
</div>

<div id="starPopup">
    <div class="popup-stars" id="starCount">⭐⭐⭐</div>
    <div class="popup-text">Amazing! Keep it up!</div>
    <button class="continue-button" onclick="closeStarPopup()">Continue</button>
</div>

<script>
// ==================== GAME STATE ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const ANIMALS = ['Capybara', 'Unicorn', 'Elephant', 'Butterfly', 'Dolphin', 'Cat'];
const COLORS = [
    '#FF006E', '#FB5607', '#FFBE0B', '#8338EC', '#3A86FF', '#06FFA5',
    '#FF4365', '#FFD166', '#06D6A0', '#EF476F', '#FFFFFF', '#FFB6C1'
];

let currentAnimalIndex = 0;
let currentTool = 'brush';
let currentColor = '#FF006E';
let brushSize = 5;
let isDrawing = false;
let gameStarted = false;
let completion = {};
let showingPopup = false;

// Initialize completion tracking
ANIMALS.forEach(animal => {
    completion[animal] = 0;
});

// ==================== AUDIO SYNTHESIS ====================
const audioContext = new (window.AudioContext || window.webkitAudioContext)();

function playSoundEffect(type) {
    const now = audioContext.currentTime;
    switch (type) {
        case 'paint':
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.connect(gain1);
            gain1.connect(audioContext.destination);
            osc1.frequency.value = 800 + Math.random() * 400;
            gain1.gain.setValueAtTime(0.1, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc1.start(now);
            osc1.stop(now + 0.1);
            break;
        case 'colorSelect':
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);
            osc2.frequency.setValueAtTime(600, now);
            osc2.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
            gain2.gain.setValueAtTime(0.15, now);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc2.start(now);
            osc2.stop(now + 0.15);
            break;
        case 'animalSwitch':
            const osc3 = audioContext.createOscillator();
            const gain3 = audioContext.createGain();
            osc3.connect(gain3);
            gain3.connect(audioContext.destination);
            osc3.frequency.setValueAtTime(1200, now);
            osc3.frequency.exponentialRampToValueAtTime(600, now + 0.2);
            gain3.gain.setValueAtTime(0.15, now);
            gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc3.start(now);
            osc3.stop(now + 0.2);
            break;
        case 'completion':
            for (let i = 0; i < 3; i++) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                const freq = 800 + i * 200;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, now + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.2);
            }
            break;
    }
}

// ==================== DRAWING ANIMALS WITH BEZIER CURVES ====================
function drawAnimals() {
    const animal = ANIMALS[currentAnimalIndex];
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = (canvas.height - 100) / 2 + 25;
    const scale = Math.min(canvas.width, canvas.height) / 500;

    switch (animal) {
        case 'Capybara':
            drawCapybara(centerX, centerY, scale);
            break;
        case 'Unicorn':
            drawUnicorn(centerX, centerY, scale);
            break;
        case 'Elephant':
            drawElephant(centerX, centerY, scale);
            break;
        case 'Butterfly':
            drawButterfly(centerX, centerY, scale);
            break;
        case 'Dolphin':
            drawDolphin(centerX, centerY, scale);
            break;
        case 'Cat':
            drawCat(centerX, centerY, scale);
            break;
    }
}

function drawOutline() {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = '#FF006E';
    ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowColor = 'transparent';
}

function drawCapybara(x, y, s) {
    // Body
    ctx.beginPath();
    ctx.ellipse(x - 30 * s, y - 20 * s, 85 * s, 55 * s, 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE5B4';
    ctx.fill();
    drawOutline();

    // Head
    ctx.beginPath();
    ctx.ellipse(x + 50 * s, y - 40 * s, 55 * s, 50 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE5B4';
    ctx.fill();
    drawOutline();

    // Left ear
    ctx.beginPath();
    ctx.ellipse(x + 20 * s, y - 85 * s, 16 * s, 20 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE5B4';
    ctx.fill();
    drawOutline();

    // Right ear
    ctx.beginPath();
    ctx.ellipse(x + 80 * s, y - 85 * s, 16 * s, 20 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE5B4';
    ctx.fill();
    drawOutline();

    // Snout
    ctx.beginPath();
    ctx.moveTo(x + 100 * s, y - 45 * s);
    ctx.bezierCurveTo(x + 115 * s, y - 50 * s, x + 120 * s, y - 35 * s, x + 115 * s, y - 25 * s);
    ctx.bezierCurveTo(x + 110 * s, y - 30 * s, x + 100 * s, y - 35 * s, x + 100 * s, y - 45 * s);
    ctx.fillStyle = '#FFE5B4';
    ctx.fill();
    drawOutline();

    // Eyes
    ctx.beginPath();
    ctx.ellipse(x + 55 * s, y - 48 * s, 7 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    drawOutline();

    ctx.beginPath();
    ctx.ellipse(x + 85 * s, y - 48 * s, 7 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    drawOutline();

    // Pupils
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(x + 58 * s, y - 48 * s, 3 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 88 * s, y - 48 * s, 3 * s, 0, Math.PI * 2);
    ctx.fill();

    // Nose
    ctx.beginPath();
    ctx.ellipse(x + 105 * s, y - 30 * s, 6 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFB6C1';
    ctx.fill();
    drawOutline();

    // Mouth
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.arc(x + 105 * s, y - 20 * s, 10 * s, 0, Math.PI);
    ctx.stroke();

    // Legs with bezier curves
    const legs = [
        { x: -35, y: 25 },
        { x: -80, y: 25 },
        { x: 15, y: 25 },
        { x: -30, y: 25 }
    ];

    legs.forEach(leg => {
        ctx.beginPath();
        ctx.moveTo(x + leg.x * s, y + leg.y * s);
        ctx.quadraticCurveTo(x + (leg.x - 7) * s, y + 50 * s, x + leg.x * s, y + 60 * s);
        ctx.quadraticCurveTo(x + (leg.x + 15) * s, y + 62 * s, x + (leg.x + 25) * s, y + 58 * s);
        ctx.quadraticCurveTo(x + (leg.x + 10) * s, y + 35 * s, x + leg.x * s, y + leg.y * s);
        ctx.fillStyle = '#FFE5B4';
        ctx.fill();
        drawOutline();
    });

    // Tail
    ctx.beginPath();
    ctx.moveTo(x - 115 * s, y);
    ctx.bezierCurveTo(x - 140 * s, y - 10 * s, x - 150 * s, y + 15 * s, x - 135 * s, y + 25 * s);
    ctx.quadraticCurveTo(x - 120 * s, y + 20 * s, x - 110 * s, y);
    ctx.fillStyle = '#FFE5B4';
    ctx.fill();
    drawOutline();
}

function drawUnicorn(x, y, s) {
    // Body with curve
    ctx.beginPath();
    ctx.moveTo(x - 60 * s, y);
    ctx.bezierCurveTo(x - 40 * s, y - 45 * s, x + 40 * s, y - 50 * s, x + 70 * s, y - 10 * s);
    ctx.quadraticCurveTo(x + 65 * s, y + 35 * s, x - 50 * s, y + 35 * s);
    ctx.bezierCurveTo(x - 55 * s, y + 15 * s, x - 65 * s, y + 5 * s, x - 60 * s, y);
    ctx.fillStyle = '#FFB6C1';
    ctx.fill();
    drawOutline();

    // Head
    ctx.beginPath();
    ctx.ellipse(x + 60 * s, y - 45 * s, 50 * s, 52 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFB6C1';
    ctx.fill();
    drawOutline();

    // Ears with curves
    ctx.beginPath();
    ctx.moveTo(x + 30 * s, y - 90 * s);
    ctx.bezierCurveTo(x + 10 * s, y - 105 * s, x + 18 * s, y - 75 * s, x + 28 * s, y - 80 * s);
    ctx.quadraticCurveTo(x + 32 * s, y - 85 * s, x + 30 * s, y - 90 * s);
    ctx.fillStyle = '#FFB6C1';
    ctx.fill();
    drawOutline();

    ctx.beginPath();
    ctx.moveTo(x + 90 * s, y - 90 * s);
    ctx.bezierCurveTo(x + 110 * s, y - 105 * s, x + 102 * s, y - 75 * s, x + 92 * s, y - 80 * s);
    ctx.quadraticCurveTo(x + 88 * s, y - 85 * s, x + 90 * s, y - 90 * s);
    ctx.fillStyle = '#FFB6C1';
    ctx.fill();
    drawOutline();

    // Spiral horn
    ctx.beginPath();
    ctx.moveTo(x + 60 * s, y - 100 * s);
    ctx.bezierCurveTo(x + 58 * s, y - 140 * s, x + 62 * s, y - 170 * s, x + 60 * s, y - 180 * s);
    ctx.bezierCurveTo(x + 62 * s, y - 170 * s, x + 65 * s, y - 140 * s, x + 60 * s, y - 100 * s);
    ctx.fillStyle = '#FFD700';
    ctx.fill();
    drawOutline();

    // Mane sections (colorable zones)
    const maneSections = [
        { startX: 20, startY: -65, cp1x: -10, cp1y: -85, cp2x: -15, cp2y: -50, endX: 10, endY: -55 },
        { startX: -10, startY: -35, cp1x: -40, cp1y: -50, cp2x: -45, cp2y: -15, endX: -20, endY: -25 },
        { startX: -40, startY: 0, cp1x: -65, cp1y: -15, cp2x: -70, cp2y: 20, endX: -45, endY: 10 }
    ];

    maneSections.forEach(section => {
        ctx.beginPath();
        ctx.moveTo(x + section.startX * s, y + section.startY * s);
        ctx.bezierCurveTo(
            x + section.cp1x * s, y + section.cp1y * s,
            x + section.cp2x * s, y + section.cp2y * s,
            x + section.endX * s, y + section.endY * s
        );
        ctx.quadraticCurveTo(x + (section.startX + 5) * s, y + (section.startY + 5) * s, x + section.startX * s, y + section.startY * s);
        ctx.fillStyle = '#FF69B4';
        ctx.fill();
        drawOutline();
    });

    // Face features
    ctx.beginPath();
    ctx.ellipse(x + 105 * s, y - 40 * s, 24 * s, 20 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFCCD5';
    ctx.fill();
    drawOutline();

    // Eye

// ==================== CANVAS INTERACTION ====================
function getPixelData(imageData, x, y) {
    const data = imageData.data;
    const index = (Math.round(y) * imageData.width + Math.round(x)) * 4;
    return [data[index], data[index + 1], data[index + 2], data[index + 3]];
}

function setPixelData(imageData, x, y, color) {
    const data = imageData.data;
    const index = (Math.round(y) * imageData.width + Math.round(x)) * 4;
    data[index] = color[0];
    data[index + 1] = color[1];
    data[index + 2] = color[2];
    data[index + 3] = color[3];
}

function colorToRGB(color) {
    const hex = color.replace('#', '');
    return [
        parseInt(hex.substr(0, 2), 16),
        parseInt(hex.substr(2, 2), 16),
        parseInt(hex.substr(4, 2), 16),
        255
    ];
}

function floodFill(x, y, newColor) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const colorStack = [];
    const targetColor = getPixelData(imageData, x, y);
    const fillColor = colorToRGB(newColor);

    if (targetColor[3] === 0) return;

    colorStack.push({ x, y });
    const visited = new Set();

    while (colorStack.length > 0) {
        const { x: cx, y: cy } = colorStack.pop();
        const key = `${cx},${cy}`;
        if (visited.has(key)) continue;
        visited.add(key);

        const currentColor = getPixelData(imageData, cx, cy);
        if (
            currentColor[0] === targetColor[0] &&
            currentColor[1] === targetColor[1] &&
            currentColor[2] === targetColor[2] &&
            currentColor[3] === targetColor[3]
        ) {
            setPixelData(imageData, cx, cy, fillColor);

            colorStack.push({ x: cx + 1, y: cy });
            colorStack.push({ x: cx - 1, y: cy });
            colorStack.push({ x: cx, y: cy + 1 });
            colorStack.push({ x: cx, y: cy - 1 });
        }
    }

    ctx.putImageData(imageData, 0, 0);
    updateCompletion();
}

function paintBrush(x, y) {
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, brushSize);
    const rgb = colorToRGB(currentColor);
    gradient.addColorStop(0, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.8)`);
    gradient.addColorStop(1, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0)`);

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, brushSize, 0, Math.PI * 2);
    ctx.fill();

    createParticle(x, y, currentColor);
    playSoundEffect('paint');
}

function createParticle(x, y, color) {
    const particle = {
        x,
        y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 - 2,
        life: 1,
        color
    };
    particles.push(particle);
}

let particles = [];

function updateParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= 0.02;

        const rgb = colorToRGB(p.color);
        ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${p.life * 0.5})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ==================== UI FUNCTIONS ====================
function selectTool(tool) {
    currentTool = tool;
    playSoundEffect('colorSelect');
    document.getElementById('brushTool').classList.remove('active');
    document.getElementById('fillTool').classList.remove('active');
    document.getElementById(tool === 'brush' ? 'brushTool' : 'fillTool').classList.add('active');
}

function setBrushSize(size) {
    brushSize = size;
    document.querySelectorAll('.size-button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
}

function setColor(color) {
    currentColor = color;
    playSoundEffect('colorSelect');
    document.querySelectorAll('.color-button').forEach(btn => btn.classList.remove('selected'));
    event.target.classList.add('selected');
}

function updateCompletion() {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    let coloredPixels = 0;
    let totalPixels = 0;

    for (let i = 3; i < data.length; i += 4) {
        if (data[i] > 200) {
            totalPixels++;
            const r = data[i - 3];
            const g = data[i - 2];
            const b = data[i - 1];
            // Check if pixel is not default colors
            if (!((r === 255 && g === 230 && b === 180) ||
                  (r === 255 && g === 250 && b === 205) ||
                  (r === 165 && g === 42 && b === 42) ||
                  (r === 255 && g === 182 && b === 193) ||
                  (r === 255 && g === 215 && b === 0) ||
                  (r === 169 && g === 169 && b === 169) ||
                  (r === 192 && g === 192 && b === 192) ||
                  (r === 135 && g === 206 && b === 235) ||
                  (r === 255 && g === 165 && b === 0) ||
                  (r === 255 && g === 255 && b === 255) ||
                  (r === 0 && g === 0 && b === 0))) {
                coloredPixels++;
            }
        }
    }

    if (totalPixels > 0) {
        const percent = Math.round((coloredPixels / totalPixels) * 100);
        completion[ANIMALS[currentAnimalIndex]] = percent;
        document.getElementById('completion').textContent = percent + '%';

        if (percent >= 80 && !showingPopup) {
            showingPopup = true;
            setTimeout(() => { showingPopup = false; }, 2000);
            showStarPopup();
        }
    }
}

function showStarPopup() {
    const stars = ['⭐', '⭐⭐', '⭐⭐⭐'];
    const completion_val = completion[ANIMALS[currentAnimalIndex]];
    let starIndex = 0;
    if (completion_val >= 90) starIndex = 2;
    else if (completion_val >= 85) starIndex = 1;

    document.getElementById('starCount').textContent = stars[starIndex];
    document.getElementById('starPopup').style.display = 'block';
    playSoundEffect('completion');
}

function closeStarPopup() {
    document.getElementById('starPopup').style.display = 'none';
}

function previousAnimal() {
    if (currentAnimalIndex > 0) {
        currentAnimalIndex--;
        updateUI();
        playSoundEffect('animalSwitch');
    }
}

function nextAnimal() {
    if (currentAnimalIndex < ANIMALS.length - 1) {
        currentAnimalIndex++;
        updateUI();
        playSoundEffect('animalSwitch');
    }
}

function updateUI() {
    document.getElementById('animalName').textContent = ANIMALS[currentAnimalIndex];
    document.getElementById('completion').textContent = completion[ANIMALS[currentAnimalIndex]] + '%';
    document.getElementById('prevBtn').disabled = currentAnimalIndex === 0;
    document.getElementById('nextBtn').disabled = currentAnimalIndex === ANIMALS.length - 1;
    drawAnimals();
}

function clearCanvas() {
    if (confirm('Clear this animal? (Undo will not work for this)')) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        completion[ANIMALS[currentAnimalIndex]] = 0;
        drawAnimals();
    }
}

function undoAction() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawAnimals();
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    gameStarted = true;
    drawAnimals();
    initPalette();
    selectTool('brush');
    updateUI();
}

function initPalette() {
    const paletteRow = document.getElementById('paletteRow');
    paletteRow.innerHTML = '';
    COLORS.forEach((color, idx) => {
        const btn = document.createElement('button');
        btn.className = 'color-button' + (idx === 0 ? ' selected' : '');
        btn.style.backgroundColor = color;
        btn.onclick = () => setColor(color);
        paletteRow.appendChild(btn);
    });
}

// ==================== CANVAS EVENTS ====================
canvas.addEventListener('mousedown', (e) => {
    if (!gameStarted) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (y > canvas.height - 100) return;

    isDrawing = true;
    if (currentTool === 'brush') {
        paintBrush(x, y);
    } else if (currentTool === 'fill') {
        floodFill(x, y, currentColor);
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing || !gameStarted) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (y > canvas.height - 100) return;

    if (currentTool === 'brush') {
        paintBrush(x, y);
    }
});

canvas.addEventListener('mouseup', () => {
    isDrawing = false;
});

canvas.addEventListener('mouseleave', () => {
    isDrawing = false;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    if (!gameStarted) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    if (y > canvas.height - 100) return;

    isDrawing = true;
    if (currentTool === 'brush') {
        paintBrush(x, y);
    } else if (currentTool === 'fill') {
        floodFill(x, y, currentColor);
    }
});

canvas.addEventListener('touchmove', (e) => {
    if (!isDrawing || !gameStarted) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    if (y > canvas.height - 100) return;

    if (currentTool === 'brush') {
        paintBrush(x, y);
    }
});

canvas.addEventListener('touchend', () => {
    isDrawing = false;
});

// ==================== GAME LOOP ====================
function gameLoop() {
    if (gameStarted) {
        drawAnimals();
        updateParticles();
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
