<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pole Rush</title>
<!--
POLE RUSH - NAW Games
Design: auto-runner on rooftop tracks. Drag left/right to steer. Yellow bars add pieces to the
pole (each bar goes to the shorter side so it stays balanced). Red saws cut off whatever pole sticks
past them; running into a saw with your body bonks you and snaps 30% off. Gaps between towers are
crossed by sliding the pole along two rails: the pole has to reach past BOTH rails or you drop.
Checkpoint before every gap; a long run of bars sits right before each gap so it is always beatable.
Gems are scooped up by the whole pole. Bars and gems fill the FEVER meter: tap it for 5 seconds of
speed, magnet and saw-smashing. 15 levels in 3 worlds (Beach City, Sunset Towers, Neon Night),
stars by falls, gems buy runner colours and pole styles. Endless mode with 3 hearts unlocks at level 4.
-->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1630;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#fff;text-align:center;padding:18px;box-sizing:border-box;overflow-y:auto}
.ov.show{display:flex}
#menu{background:linear-gradient(180deg,rgba(20,10,60,.55),rgba(10,20,60,.25) 45%,rgba(10,20,60,.7))}
.title{font-size:clamp(46px,13vw,86px);font-weight:900;letter-spacing:2px;line-height:.95;margin:0 0 6px;color:#ffd23f;text-shadow:0 5px 0 #e0558f,0 10px 0 #5b2a9e,0 14px 22px rgba(0,0,0,.45);animation:bob 2.2s ease-in-out infinite;transform-origin:center}
.title span{color:#fff}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.sub{font-size:17px;opacity:.95;margin:6px 0 14px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.btn{border:none;border-radius:22px;padding:14px 28px;font:900 22px inherit;font-family:inherit;color:#fff;cursor:pointer;margin:6px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 18px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.go{background:linear-gradient(180deg,#45e07a,#16a34a);font-size:30px;padding:16px 46px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pink{background:linear-gradient(180deg,#ff7ac0,#d6338a)}
.blue{background:linear-gradient(180deg,#4fb7ff,#2563eb)}
.gray{background:linear-gradient(180deg,#8b93a8,#4b5368)}
.gold{background:linear-gradient(180deg,#ffd23f,#e09b00);color:#4a2c00}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.lvls{display:grid;grid-template-columns:repeat(5,54px);gap:8px;margin:10px 0 8px}
.lv{width:54px;height:58px;border-radius:16px;border:none;font:900 20px inherit;font-family:inherit;color:#fff;cursor:pointer;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.lv small{position:absolute;bottom:3px;left:0;right:0;font-size:10px;letter-spacing:-1px}
.lv.w1{background:linear-gradient(180deg,#38c6e8,#1886b8)}.lv.w2{background:linear-gradient(180deg,#ff9a4a,#d9480f)}.lv.w3{background:linear-gradient(180deg,#a76bff,#5b21b6)}
.lv.lock{background:#3b4257;color:#7d859b}
.lv.cur{outline:4px solid #ffd23f}
.pill{display:inline-block;background:rgba(0,0,0,.35);border-radius:16px;padding:6px 14px;font-weight:900;font-size:18px;margin:4px}
.card{background:rgba(15,20,45,.88);border-radius:26px;padding:22px 20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.12)}
.big{font-size:clamp(32px,9vw,46px);font-weight:900;margin:0 0 6px;color:#ffd23f;text-shadow:0 4px 0 #b4570b}
.stars{font-size:54px;margin:4px 0 8px;letter-spacing:4px}
.stars span{display:inline-block;transform:scale(0);filter:grayscale(1) brightness(.5)}
.stars span.on{filter:none}
.stars span.pop{animation:spop .45s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes spop{to{transform:scale(1)}}
.stat{display:flex;justify-content:space-between;font-size:19px;font-weight:800;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.1)}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.item{background:rgba(255,255,255,.08);border-radius:18px;padding:10px 6px;cursor:pointer;border:3px solid transparent}
.item.eq{border-color:#45e07a}
.item canvas{position:static;width:64px;height:64px;display:block;margin:0 auto 4px}
.item b{display:block;font-size:14px}
.item i{font-style:normal;font-size:14px;color:#ffd23f;font-weight:900}
.tabs{display:flex;gap:6px;justify-content:center}
.tab{padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:900;cursor:pointer}
.tab.on{background:#ffd23f;color:#4a2c00}
#hudbtns{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:5;display:none;gap:8px}
#hudbtns button{width:44px;height:44px;border-radius:14px;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hudbtns"><button id="bHome" aria-label="Menu">&#127968;</button><button id="bMute" aria-label="Sound">&#128266;</button></div>

<div id="menu" class="ov show">
  <div class="title">POLE<br><span>RUSH</span></div>
  <div class="sub">Grab bars &bull; Grow your pole &bull; Slide the rails!</div>
  <button class="btn go" id="bPlay">&#9654; PLAY</button>
  <div class="lvls" id="lvls"></div>
  <div class="row">
    <button class="btn pink" id="bEndless">&#9854; ENDLESS</button>
    <button class="btn gold" id="bShop">&#128717; SHOP</button>
  </div>
  <div class="row"><span class="pill" id="mGems">&#128142; 0</span><span class="pill" id="mStars">&#11088; 0/45</span></div>
</div>

<div id="done" class="ov">
  <div class="card">
    <div class="big" id="dTitle">LEVEL COMPLETE!</div>
    <div class="stars" id="dStars"><span>&#11088;</span><span>&#11088;</span><span>&#11088;</span></div>
    <div id="dStats"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn gray" id="dHome">&#127968;</button>
      <button class="btn blue" id="dRetry">&#8635;</button>
      <button class="btn go" id="dNext" style="font-size:26px;padding:14px 32px">NEXT &#9654;</button>
    </div>
  </div>
</div>

<div id="shop" class="ov" style="background:rgba(8,12,35,.9)">
  <div class="card" style="max-width:460px">
    <div class="big" style="font-size:36px">SHOP</div>
    <div class="pill" id="sGems">&#128142; 0</div>
    <div class="tabs" style="margin-top:8px"><div class="tab on" id="tRun">Runners</div><div class="tab" id="tPole">Poles</div></div>
    <div class="shopgrid" id="sGrid"></div>
    <button class="btn blue" id="sBack">&#9664; BACK</button>
  </div>
</div>

<script>
"use strict";
// ================= SETUP =================
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,F=400,CX=0,CY=0;
let PITCH=0.33, CA=Math.cos(PITCH), SA=Math.sin(PITCH), FF=400;
function setPitch(p){PITCH=p;CA=Math.cos(p);SA=Math.sin(p);}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W*1.05,H*0.9);CX=W/2;CY=H*0.36;
}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);

// ================= SAVE =================
const SKEY='poleRush_v1';
const save={unlocked:1,stars:{},gems:0,skin:0,pole:0,skins:[0],poles:[0],best:0,muted:false};
try{Object.assign(save,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}

const SKINS=[
  {n:'Grape',c:'#7b5cff',d:'#4a2fc4',b:'#2b2350',cost:0},
  {n:'Bubblegum',c:'#ff6fb5',d:'#d63384',b:'#4a1d3a',cost:30},
  {n:'Lime',c:'#62e36a',d:'#25a83a',b:'#1f3d23',cost:60},
  {n:'Sunny',c:'#ffcc33',d:'#e09b00',b:'#4b3510',cost:100},
  {n:'Ocean',c:'#35b9ff',d:'#1271c9',b:'#123a55',cost:150},
  {n:'Robot',c:'#d5dbe8',d:'#8d97ab',b:'#3b4252',cost:250}
];
const POLES=[
  {n:'Gold',a:'#ffd84a',b:'#d99100',cost:0},
  {n:'Wood',a:'#d39a5a',b:'#7a4a1f',cost:20},
  {n:'Candy',a:'#ffffff',b:'#ff3b5c',stripe:true,cost:40},
  {n:'Laser',a:'#9ffcff',b:'#1aa3ff',glow:true,cost:90},
  {n:'Lava',a:'#ffb23f',b:'#ff3d00',glow:true,cost:120},
  {n:'Rainbow',rainbow:true,a:'#fff',b:'#888',cost:180}
];

const THEMES=[
  {name:'Beach City',sky:['#2f7fff','#a8dcff'],sea:['#5fe0e0','#0b8fb8'],bld:['#f2a7c8','#e888b5','#f6c1d8','#d97aa9','#ffd0e3'],win:'rgba(120,40,90,.35)',plat:['#f7f5ff','#ebe6fb'],front:'#e4def6',edge:'#c7bbef',cloud:'rgba(255,255,255,.92)'},
  {name:'Sunset Towers',sky:['#ff7a59','#ffd28a'],sea:['#ff9f7a','#7a3e8f'],bld:['#7a4fb3','#9b5fc0','#5b3a8f','#b06ab3','#6c4aa0'],win:'rgba(255,210,120,.55)',plat:['#fff4ea','#ffe6d2'],front:'#f5d9c4',edge:'#f0a77a',cloud:'rgba(255,236,220,.9)'},
  {name:'Neon Night',sky:['#0b0730','#3a1670'],sea:['#1b1050','#05051a'],bld:['#1d1f4f','#24125a','#132a5c','#2b1b62','#1a1a40'],win:'rgba(80,255,240,.65)',plat:['#2a2f5a','#232650'],front:'#1b1d42',edge:'#ff3fd2',cloud:'rgba(140,110,255,.25)'}
];
let theme=THEMES[0];

// ================= AUDIO =================
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,musGain=null,slideSrc=null,slideGain=null,noiseBuf=null;
function ensureAudio(){
  if(!ac){
    try{ac=new AC();}catch(e){return;}
    master=ac.createGain();master.gain.value=save.muted?0:1;master.connect(ac.destination);
    musGain=ac.createGain();musGain.gain.value=0.55;musGain.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*1.5,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    slideGain=ac.createGain();slideGain.gain.value=0;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=1.2;
    slideSrc=ac.createBufferSource();slideSrc.buffer=noiseBuf;slideSrc.loop=true;
    slideSrc.connect(bp);bp.connect(slideGain);slideGain.connect(master);slideSrc.start();
  }
  if(ac.state==='suspended')ac.resume();
}
function tone(f,dur,type,vol,f2,when,dest){
  if(!ac)return;const t=when||ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,type,freq,when,dest){
  if(!ac)return;const t=when||ac.currentTime;
  const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=freq||1000;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(dest||master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
function sfx(k,v){
  if(!ac||attract)return;
  switch(k){
    case 'bar':{const f=520*Math.pow(1.0595,Math.min(v||0,18));tone(f,0.09,'triangle',0.16);tone(f*2,0.06,'sine',0.06);break;}
    case 'gem':tone(1320,0.07,'sine',0.12);tone(1760,0.12,'sine',0.1,null,ac.currentTime+0.05);break;
    case 'cut':noise(0.22,0.35,'highpass',2500);tone(900,0.18,'sawtooth',0.08,200);tone(220,0.12,'square',0.06,90,ac.currentTime+0.05);break;
    case 'bonk':tone(160,0.25,'square',0.18,50);noise(0.18,0.3,'lowpass',600);break;
    case 'clank':tone(880,0.12,'square',0.07,660);tone(1320,0.15,'triangle',0.06);noise(0.1,0.2,'highpass',3000);break;
    case 'land':tone(140,0.12,'sine',0.25,60);noise(0.08,0.15,'lowpass',500);break;
    case 'fall':tone(700,0.9,'sine',0.16,90);break;
    case 'splash':noise(0.6,0.35,'lowpass',900);break;
    case 'fever':tone(300,0.5,'sawtooth',0.1,1400);tone(450,0.5,'square',0.05,2000);break;
    case 'smash':noise(0.25,0.35,'bandpass',1800);tone(600,0.2,'square',0.07,150);break;
    case 'cp':tone(660,0.1,'triangle',0.12);tone(990,0.16,'triangle',0.12,null,ac.currentTime+0.09);break;
    case 'finish':[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.3,'triangle',0.14,null,ac.currentTime+i*0.1));break;
    case 'star':tone(1047+(v||0)*260,0.35,'triangle',0.15);tone(2094+(v||0)*520,0.25,'sine',0.05);break;
    case 'coin':tone(1500+(v||0)*30,0.05,'square',0.05);break;
    case 'click':tone(700,0.05,'triangle',0.1);break;
    case 'buy':[784,988,1175,1568].forEach((f,i)=>tone(f,0.18,'triangle',0.12,null,ac.currentTime+i*0.07));break;
    case 'no':tone(200,0.2,'square',0.1,120);break;
    case 'whoosh':noise(0.5,0.18,'bandpass',900);tone(500,0.4,'sine',0.05,200);break;
    case 'catch':{const k=Math.min(1,(v||0)/14);tone(90,0.35,'sine',0.25+k*0.2,40);noise(0.25,0.25+k*0.3,'lowpass',1200);if(k>0.5)tone(1760,0.4,'triangle',0.08,1200);break;}
    case 'bundle':[660,880,1100].forEach((f,i)=>tone(f,0.12,'triangle',0.14,null,ac.currentTime+i*0.04));break;
    case 'gateGood':[523,784,1047,1568].forEach((f,i)=>tone(f,0.18,'square',0.07,null,ac.currentTime+i*0.05));noise(0.3,0.15,'highpass',4000);break;
    case 'gateBad':tone(300,0.4,'sawtooth',0.1,90);noise(0.25,0.25,'lowpass',700);break;
  }
}
function setSlide(on){
  if(!slideGain)return;const t=ac.currentTime;slideGain.gain.cancelScheduledValues(t);
  slideGain.gain.setTargetAtTime(on&&!attract&&!save.muted?0.07:0,t,0.05);
}
// ---- music: simple upbeat loop (C G Am F) ----
let musOn=false,musNext=0,musStep=0;
const BPM=126,STEP=60/BPM/2;
const PROG=[[48,60,64,67],[43,59,62,67],[45,60,64,69],[41,57,60,65]];
const MEL=[72,null,74,76,null,79,76,74, 74,null,71,74,null,79,74,71, 72,null,76,81,null,79,76,72, 77,null,76,72,null,74,72,69];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musTick(){
  if(!ac||!musOn)return;
  if(musNext<ac.currentTime)musNext=ac.currentTime+0.05;
  while(musNext<ac.currentTime+0.2){
    const bar=Math.floor(musStep/8)%4,s=musStep%8,ch=PROG[bar],t=musNext;
    if(s===0||s===3||s===4||s===6)tone(mtof(ch[0]-12+(s===6?12:0)),STEP*0.9,'square',0.045,null,t,musGain);
    tone(mtof(ch[1+(s%3)]+12),STEP*0.55,'triangle',0.028,null,t,musGain);
    const m=MEL[musStep%32];if(m&&Math.floor(musStep/32)%2===1)tone(mtof(m),STEP*1.4,'sine',0.04,null,t,musGain);
    if(s%4===0)tone(150,0.14,'sine',0.16,40,t,musGain);
    if(s%2===1)noise(0.035,0.05,'highpass',7000,t,musGain);
    if(s===4)noise(0.12,0.08,'bandpass',1800,t,musGain);
    musNext+=STEP;musStep++;
  }
}
setInterval(musTick,40);
function setMute(m){save.muted=m;persist();if(master)master.gain.value=m?0:1;$('bMute').innerHTML=m?'&#128263;':'&#128266;';}

// ================= WORLD GENERATION =================
const PIECE=0.3, BAR_R=0.95, BODY_R=0.42, POLE_RUN=1.15, POLE_HANG=0.14, MAXL=40, START_HALF=1.2, HANG_DROP=1.75, G_GRAV=26;
function mkRng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newWorld(){return{plats:[],gaps:[],bars:[],gems:[],saws:[],gates:[],cps:[],blds:[],finishZ:Infinity,z:0,y:0,bz:-30,len:0}}

function makeGen(w,seed){
  const R=mkRng(seed),pick=a=>a[Math.floor(R()*a.length)];
  const plat=(len,wd)=>{const s=w.z;w.plats.push({z0:s,z1:s+len,w:wd,y:w.y});w.z+=len;return s;};
  const bar=(x,z,v)=>w.bars.push({x,z,y:w.y,v:v||1,t:false});
  const gem=(x,z,y)=>w.gems.push({x,z,y:y==null?w.y+0.55:y,t:false});
  const saw=(x,z,amp,spd)=>w.saws.push({x0:x,x,z,y:w.y,r:0.72,amp:amp||0,spd:spd||0,ph:R()*6.28,broken:false});
  const gatePair=(z,hw,big)=>{
    const good=pick(big?[['x2',2],['x2',2],['+15',15]]:[['x2',2],['+10',10],['+6',6]]),bad=pick([['-8',-8],['÷2',0.5],['-5',-5]]);
    const gl=R()<0.5;
    w.gates.push({z,y:w.y,x0:-hw,x1:0,op:gl?good:bad,good:gl,t:false});
    w.gates.push({z,y:w.y,x0:0,x1:hw,op:gl?bad:good,good:!gl,t:false});
  };
  const g={sinceGap:0,gapEvery:2};
  g.intro=()=>{const s=plat(26,6);w.cps.push(0.5);for(let i=0;i<8;i++)bar(0,s+6+i*1.25);gem(-1.6,s+18);gem(1.6,s+18);gem(0,s+22);};
  g.gap=(d,n)=>{
    // span: narrow, normal or mega
    const r=R();let S;
    if(n>=3&&r<0.3)S=10+R()*(5+d*9);
    else if(r<0.5)S=3.6+R()*1.2;
    else S=4.4+d*5+R()*1.5;
    S=Math.min(S,24);
    const widen=n>=11&&S<16?R()*1.3*d:0;
    const need=S+widen+0.7;
    const trim=S<9&&R()<0.6;
    const gate=d<0.2?2.3:d<0.5?1.9:1.6;
    // supply: enough to make it with ~85% of pickups starting from a short pole; bundles (+5) for big spans
    const Np=Math.max(4,Math.ceil((need-2*START_HALF)/PIECE));
    const sup=Np/0.85;
    const nbund=S>=9?Math.floor(sup*0.55/5):0;
    const nb=Math.max(5,Math.ceil(sup-nbund*5));
    const s=w.z;let z=s+3;
    if(trim){saw(-gate,z);saw(gate,z);}
    w.cps.push(s+5);z=s+8.5;
    if(S>=12){gatePair(z,3,true);z+=6;}
    const ph=R()*6.28,amp=d<0.15?0.5:d<0.5?1.3:1.8;
    const every=nbund?Math.max(2,Math.floor(nb/(nbund+1))):1e9;let bu=0;
    for(let i=0;i<nb;i++){bar(amp*Math.sin(i*0.42+ph),z);z+=1.05;if(bu<nbund&&(i+1)%every===0){bar((bu%2?1:-1)*1.3,z+0.7,5);bu++;z+=2.6;}}
    while(bu<nbund){bar((bu%2?1:-1)*1.3,z+0.7,5);bu++;z+=2.6;}
    plat(z-s+4,6);
    // the drop: rails sit below the roof edge, then may slope downhill
    const yTop=w.y;
    const drop=n<=1?pick([0,1.5]):pick(n<4?[0,2,4,5]:[0,3,6,10,14]);
    const slope=n<=2?0:pick([0,0,2,4,7]);
    const fallT=Math.sqrt(2*(drop+1.0)/G_GRAV),travel=fallT*13;
    const G=Math.max(9+d*13+R()*4,travel+9);
    const z0=w.z,z1=z0+G;w.z=z1;
    const yA=yTop-drop,yB=yA-slope;
    const off=n>=5?(R()<0.5?-1:1)*(0.8+R()*2.4)*d:0;
    const wig=n>=9?d*1.5:0;
    const gp={z0,z1,S,off,wig,widen,wf:1+Math.floor(R()*2),yTop,yA,yB,catchZ:z0+travel};
    w.gaps.push(gp);
    for(let zz=z0+travel+2;zz<z1-1.5;zz+=1.7)gem(railC(gp,zz),zz,railY(gp,zz)+0.6);
    w.y=yB;
    plat(4,7);
  };
  g.chunk=(d,n)=>{
    if(g.sinceGap>=g.gapEvery){g.gap(d,n);g.sinceGap=0;g.gapEvery=n<=2?2:(R()<0.55?1:2);return;}
    g.sinceGap++;
    const wd=d<0.3?6:pick([6,6,5.4,4.8]),hw=wd/2;
    const types=['line','snake','gemArc','field','sawEdge','bundle'];
    if(n>=2)types.push('gates','gates');
    if(d>0.12)types.push('sawSide','sawEdge');
    if(n>=4)types.push('mover');
    if(d>0.45)types.push('mover','sawPair','sawSide');
    const t=pick(types);
    if(t==='line'){const s=plat(18,wd);const x=pick([-1,0,1])*Math.min(1.5,hw-0.7);for(let i=0;i<10;i++)bar(x,s+3+i*1.3);gem(-x||1.6,s+9);gem(-x||-1.6,s+13);}
    else if(t==='snake'){const s=plat(22,wd);const a=Math.min(1.8,hw-0.6);for(let i=0;i<14;i++)bar(a*Math.sin(i*0.55),s+3+i*1.3);}
    else if(t==='gemArc'){const s=plat(20,wd);for(let i=0;i<9;i++)gem((i-4)*0.55,s+6+Math.abs(i-4)*0.8,w.y+0.5+Math.sin(i/8*Math.PI)*0.8);for(let i=0;i<6;i++)bar(0,s+11+i*1.2);}
    else if(t==='field'){const s=plat(20,Math.max(wd,5.4));for(let r=0;r<3;r++)for(let i=0;i<5;i++)bar((r-1)*1.6,s+4+i*1.6+r*0.5);}
    else if(t==='bundle'){const s=plat(22,wd);for(let i=0;i<3;i++)bar((i%2?1:-1)*Math.min(1.4,hw-0.8),s+4+i*5,5);for(let i=0;i<4;i++)bar(0,s+17+i*1.1);}
    else if(t==='gates'){const s=plat(22,wd);for(let i=0;i<4;i++)bar(0,s+2+i*1.2);gatePair(s+10,hw,false);for(let i=0;i<5;i++)bar(0,s+14+i*1.2);}
    else if(t==='sawEdge'){const s=plat(24,wd);for(let i=0;i<5;i++)bar(0,s+2+i*1.2);saw(-(hw-0.1),s+12);saw(hw-0.1,s+12);for(let i=0;i<5;i++)bar(0,s+15+i*1.2);gem(0,s+12.5);}
    else if(t==='sawSide'){const s=plat(24,wd);const sd=R()<0.5?-1:1;saw(sd*(hw-0.9),s+11);for(let i=0;i<9;i++)bar(-sd*Math.min(1.3,hw-0.7),s+3+i*1.3);gem(-sd*0.5,s+18);}
    else if(t==='mover'){const s=plat(26,wd);const sp=1.4+d*1.4;saw(0,s+12,hw-0.75,sp);for(let i=0;i<4;i++)bar(0,s+3+i*1.2);for(let i=0;i<5;i++)bar(0,s+16+i*1.2);}
    else if(t==='sawPair'){const s=plat(30,wd);saw(-1.3,s+9);saw(1.3,s+18);for(let i=0;i<6;i++)bar(1.3,s+3+i*1);for(let i=0;i<6;i++)bar(-1.3,s+11+i*1);for(let i=0;i<5;i++)bar(0,s+21+i*1.2);}
  };
  return g;
}
function railC(gp,z){const u=clamp((z-gp.z0)/(gp.z1-gp.z0),0,1);return gp.off*smooth(u)+gp.wig*Math.sin(u*Math.PI*2*gp.wf)*Math.sin(u*Math.PI);}
function railS(gp,z){const u=clamp((z-gp.z0)/(gp.z1-gp.z0),0,1);return gp.S+gp.widen*u;}
function railY(gp,z){const u=clamp((z-gp.z0)/(gp.z1-gp.z0),0,1);return lerp(gp.yA,gp.yB,smooth(u));}
function yAt(z){for(const p of world.plats)if(z>=p.z0&&z<p.z1)return p.y;for(const g of world.gaps)if(z>=g.z0&&z<g.z1)return g.yA;return world.y;}

function buildLevel(n){
  const w=newWorld(),d=clamp((n-1)/14,0,1),g=makeGen(w,n*7919+31);
  g.intro();g.gapEvery=2;
  const nch=3+Math.round(n*0.55);
  for(let i=0;i<nch;i++)g.chunk(d,n);
  if(g.sinceGap>0)g.gap(d,n);
  const s=w.z;w.plats.push({z0:s,z1:s+60,w:7,y:w.y});w.z+=60;w.finishZ=s+18;
  for(let i=0;i<6;i++){w.gems.push({x:-2+i*0.8,z:s+8,y:w.y+0.55,t:false});}
  w.len=w.finishZ;return w;
}
let endlessGen=null,endlessD=0;
function buildEndless(){
  const w=newWorld(),g=makeGen(w,(Math.random()*1e9)|0);endlessGen=g;
  g.intro();g.gapEvery=2;w.len=Infinity;return w;
}
function extendEndless(){
  while(world.z<P.z+260){const d=clamp(P.z/2600,0,1)*0.95+0.05;endlessGen.chunk(d,Math.round(2+d*13));}
  // cleanup behind
  const cut=P.z-40;
  if(world.bars.length>400)world.bars=world.bars.filter(b=>b.z>cut);
  if(world.gems.length>400)world.gems=world.gems.filter(b=>b.z>cut);
  world.saws=world.saws.filter(b=>b.z>cut);
  world.gates=world.gates.filter(b=>b.z>cut);
  world.plats=world.plats.filter(p=>p.z1>cut-20);
  world.gaps=world.gaps.filter(p=>p.z1>cut-20);
  world.blds=world.blds.filter(b=>b.z>cut-20);
}
function ensureBuildings(upto){
  while(world.bz<upto){
    for(const sd of[-1,1]){
      const near=Math.random()<0.35,base=yAt(world.bz);
      const bw=4+Math.random()*5,bd=5+Math.random()*6;
      const x=sd*(near?17+Math.random()*3:21+Math.random()*14);
      const top=base+(near?-8-Math.random()*10:-6+Math.random()*32);
      world.blds.push({x,z:world.bz+Math.random()*3,bw,bd,top,bot:base-120,col:theme.bld[(Math.random()*theme.bld.length)|0],sd});

}

const P={x:0,z:0,y:0,a:START_HALF,b:START_HALF,state:'run',vy:0,fallT:0,hang:false,poleY:POLE_RUN,
  cpZ:0,cpA:START_HALF,cpB:START_HALF,run:0,bonkT:0,inv:0,tilt:0,grow:0,finT:0,spd:0,vx:0};

let stats=null,combo=0,comboT=0,fever=0,feverT=0,shake=0,hearts=3,hintT=0,toast=null,cpFlash=0,slowT=0,flash=0;
let parts=[],pieces=[],floats=[],inputDX=0,keyL=false,keyR=false;
const clouds=[];for(let i=0;i<9;i++)clouds.push({x:Math.random(),y:Math.random(),s:0.5+Math.random()*0.9,v:0.004+Math.random()*0.01});

function speedNow(){
  const base=endless?8.5+clamp(P.z/2600,0,1)*4.5:8.4+level*0.26;

// ================= HELPERS =================
function platAt(z){for(const p of world.plats)if(z>=p.z0&&z<p.z1)return p;return null;}
function gapAt(z){for(const g of world.gaps)if(z>=g.z0&&z<g.z1)return g;return null;}
function nextGap(z){let best=null;for(const g of world.gaps)if(g.z0>=z&&(!best||g.z0<best.z0))best=g;return best;}
function needOf(g){return Math.max(railS(g,g.z0),railS(g,g.z1));}
function addParts(x,y,z,n,col,spd,size,up){
  for(let i=0;i<n&&parts.length<600;i++){
    const a=Math.random()*6.283,s=(0.4+Math.random())*(spd||3);
    parts.push({x,y,z,vx:Math.cos(a)*s,vy:(up||2)+Math.random()*s,vz:Math.sin(a)*s*0.6+(P.state!=='fall'?P.spd*0.6:0),life:0.6+Math.random()*0.5,col:typeof col==='function'?col():col,size:(size||0.09)*(0.6+Math.random()*0.8),g:9});
  }
}
function floatText(txt,col,size,dy){floats.push({txt,col,size:size||28,life:1,x:CX+(Math.random()-0.5)*40,y:CY+(dy||60),vy:-70});}
const rainbow=()=>'hsl('+((Math.random()*360)|0)+',100%,60%)';

function cutPole(side,newLen){
  // side -1 = left (a), 1 = right (b)
  const cur=side<0?P.a:P.b;newLen=Math.max(0.25,newLen);
  if(newLen>=cur-0.05)return false;
  const rem=cur-newLen,cx=P.x+side*(newLen+rem/2);
  pieces.push({x:cx,y:P.poleY,z:P.z,len:rem,ang:0,va:side*(3+Math.random()*4),vx:side*(2+Math.random()*2),vy:2.5,vz:0,life:2.2,pole:save.pole});
  if(side<0)P.a=newLen;else P.b=newLen;
  addParts(P.x+side*newLen,P.poleY,P.z,14,()=>Math.random()<0.5?'#ffe066':'#ff8a3d',4,0.07,1.5);
  return true;
}
function growPole(pcs){for(let i=0;i<pcs;i++){if(P.a+P.b>=MAXL)break;if(P.a<=P.b)P.a+=PIECE;else P.b+=PIECE;}}
function applyGate(gt){
  const L0=P.a+P.b,lab=gt.op[0],v=gt.op[1];let L;
  if(lab[0]==='x')L=L0*v;else if(lab[0]==='÷')L=L0*v;else L=L0+v*PIECE;
  L=clamp(L,0.6,MAXL);
  if(L>=L0){const k=L/L0;P.a*=k;P.b*=k;P.grow=0.6;sfx('gateGood');shake=Math.max(shake,0.25);cam.kick=Math.max(cam.kick,0.06);
    for(let i=0;i<24;i++)addParts(P.x-P.a+Math.random()*(P.a+P.b),P.poleY,P.z,1,()=>Math.random()<0.5?'#45e07a':'#ffe066',3,0.09,2);
    floatText(lab+'!','#45e07a',46,-40);}
  else{const k=L/L0;cutPole(-1,P.a*k);cutPole(1,P.b*k);sfx('gateBad');shake=Math.max(shake,0.35);floatText(lab,'#ff4d6d',42,-40);combo=0;}
}
function bonk(){
  if(P.inv>0)return;
  cutPole(-1,P.a*0.7);cutPole(1,P.b*0.7);
  P.bonkT=0.6;P.inv=0.8;shake=0.5;sfx('bonk');combo=0;
  floatText('BONK!','#ff4d6d',34,-10);
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
}
function fits(gp,z){const c=railC(gp,z),sp=railS(gp,z);return P.x-P.a<=c-sp/2+0.03&&P.x+P.b>=c+sp/2-0.03;}
function assist(gp,z,dt,str){
  const c=railC(gp,z),sp=railS(gp,z),lo=c+sp/2-P.b,hi=c-sp/2+P.a;
  if(lo<=hi){const mid=(lo+hi)/2;const as=(endless?1.2:(1.8*(1-clamp((level-1)/14,0,1))+0.7))*str;
    P.x=lerp(P.x,clamp(P.x,lo+0.05,hi-0.05),Math.min(1,dt*as*2.2));P.x=lerp(P.x,mid,Math.min(1,dt*as*0.35));}
}
function catchRails(gp){
  const imp=Math.abs(P.vy);P.vy=0;P.state='run';P.hang=true;
  P.poleY=railY(gp,P.z)+POLE_HANG;P.y=P.poleY-HANG_DROP;
  setSlide(true);sfx('clank');sfx('catch',imp);stats.catches++;
  shake=Math.min(0.9,0.12+imp*0.05);cam.kick=Math.min(0.14,0.02+imp*0.008);
  const L=railC(gp,P.z)-railS(gp,P.z)/2,R=railC(gp,P.z)+railS(gp,P.z)/2,ry=railY(gp,P.z);
  addParts(L,ry+0.1,P.z,10+imp*2,'#fff6a0',3+imp*0.3,0.07,2);addParts(R,ry+0.1,P.z,10+imp*2,'#fff6a0',3+imp*0.3,0.07,2);
  if(imp>7&&!attract){slowT=0.32;flash=0.35;floatText(imp>13?'MEGA CATCH!':'NICE CATCH!','#7ff9ff',40,-60);}
  if(navigator.vibrate&&imp>7)try{navigator.vibrate(40)}catch(e){}
}

// ================= UPDATE =================
function update(rdt){
  let dt=rdt;if(slowT>0){slowT-=rdt;dt=rdt*0.28;}
  t+=dt;
  if(!world)return;
  if(shake>0)shake=Math.max(0,shake-rdt*1.8);
  if(flash>0)flash=Math.max(0,flash-rdt*1.5);
  cam.kick=Math.max(0,cam.kick-rdt*0.35);
  if(hintT>0)hintT-=dt;
  if(cpFlash>0)cpFlash-=dt;
  if(toast){toast.life-=dt;if(toast.life<=0)toast=null;}
  if(feverT>0){feverT-=dt;if(feverT<=0){feverT=0;}}
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  P.bonkT=Math.max(0,P.bonkT-dt);P.inv=Math.max(0,P.inv-dt);P.grow=Math.max(0,P.grow-dt);
  for(const s of world.saws)if(s.amp)s.x=s.x0+s.amp*Math.sin(t*s.spd+s.ph);

  let spd=speedNow();
  const gNow=gapAt(P.z);
  if(P.hang&&gNow){const sl=(gNow.yA-gNow.yB)/(gNow.z1-gNow.z0);spd*=1+Math.min(0.7,sl*3);}
  P.spd=spd;
  const px0=P.x;
  if(P.state==='run'||P.state==='drop'){
    const prevZ=P.z;P.z+=spd*dt;P.run+=dt*spd;
    // steering
    if(attract){
      let tx=0;const ng=nextGap(P.z);
      let bestB=null;for(const b of world.bars){if(!b.t&&b.z>P.z+1&&b.z<P.z+12){bestB=b;break;}}
      if(bestB)tx=bestB.x;
      for(const gt of world.gates)if(!gt.t&&gt.good&&gt.z>P.z&&gt.z<P.z+9)tx=(gt.x0+gt.x1)/2;
      const gp=gapAt(P.z)||(ng&&ng.z0-P.z<4?ng:null);
      if(gp){tx=railC(gp,Math.max(P.z,gp.z0));const need=railS(gp,Math.max(P.z,gp.z0))/2+0.35;if(P.a<need)P.a=need;if(P.b<need)P.b=need;}
      P.x=lerp(P.x,tx,Math.min(1,dt*3));
    }else{
      P.x+=inputDX;if(keyL)P.x-=9*dt;if(keyR)P.x+=9*dt;
    }
    inputDX=0;
    const gp=gapAt(P.z);
    if(P.state==='drop'){
      P.vy-=G_GRAV*dt;P.poleY+=P.vy*dt;P.y=P.poleY-HANG_DROP;
      if(gp){
        assist(gp,P.z,dt,0.6);
        const ry=railY(gp,P.z)+POLE_HANG;
        if(P.poleY<=ry){if(fits(gp,P.z)||attract)catchRails(gp);else{P.poleY=ry-0.05;startFall(true);}}
      }else if(P.z>=0){const pl=platAt(P.z);if(pl){P.state='run';P.vy=0;P.y=pl.y;P.poleY=pl.y+POLE_HANG;}}
    }else if(gp){
      if(!P.hang){
        // ran off the roof edge: airborne until the pole meets the rails
        P.state='drop';P.vy=2.2;sfx('whoosh');setSlide(false);
      }else{
        assist(gp,P.z,dt,1);
        P.poleY=railY(gp,P.z)+POLE_HANG;P.y=P.poleY-HANG_DROP;
        if(!fits(gp,P.z)&&!attract){startFall(false);return;}
        const c=railC(gp,P.z),sp=railS(gp,P.z),ry=railY(gp,P.z);
        if(Math.random()<dt*34){addParts(c-sp/2,ry+0.1,P.z,1,'#fff3b0',1.5,0.05,1);addParts(c+sp/2,ry+0.1,P.z,1,'#fff3b0',1.5,0.05,1);}
      }
    }else{
      const pl=platAt(P.z);
      if(P.hang){P.hang=false;setSlide(false);sfx('land');if(pl){P.y=pl.y;}addParts(P.x,P.y,P.z,14,'#ffffff',3,0.08,2);shake=Math.max(shake,0.18);}
      if(pl){const hw=pl.w/2-0.35;if(P.x<-hw||P.x>hw)P.x=lerp(P.x,clamp(P.x,-hw,hw),Math.min(1,dt*12));
        P.y=lerp(P.y,pl.y,Math.min(1,dt*16));P.poleY=lerp(P.poleY,pl.y+POLE_RUN,Math.min(1,dt*14));}
    }
    if(P.state==='fall')return;
    // checkpoints
    for(const cz of world.cps)if(prevZ<cz&&cz<=P.z&&!P.hang){if(cz!==P.cpZ)P.cpFalls=0;P.cpZ=cz;P.cpA=P.a;P.cpB=P.b;if(cz>1&&!attract){cpFlash=1.2;sfx('cp');}}
    // bars and bundles
    const mag=feverT>0?3.4:BAR_R;
    for(const b of world.bars){
      if(b.t||b.z>P.z+4||b.z<prevZ-4)continue;
      if(feverT>0&&b.z>P.z&&b.z<P.z+4&&Math.abs(b.x-P.x)<mag){b.x=lerp(b.x,P.x,Math.min(1,dt*10));}
      if(b.z>prevZ-0.4&&b.z<=P.z+0.2&&Math.abs(b.x-P.x)<mag*(b.v>1?1.15:1)){
        b.t=true;growPole(b.v);
        combo+=b.v>1?3:1;comboT=1.3;stats.bars+=b.v;P.grow=b.v>1?0.45:0.18;
        if(feverT<=0)fever=Math.min(1,fever+b.v/16);
        if(b.v>1){sfx('bundle');shake=Math.max(shake,0.15);addParts(b.x,b.y+0.5,b.z,20,'#ffd23f',4,0.09);if(!attract)floatText('+'+b.v,'#ffe14d',44,10);}
        else{sfx('bar',combo);addParts(b.x,b.y+0.3,b.z,7,'#ffd23f',2.6,0.07);if(!attract)floatText('+1','#ffe14d',26+Math.min(combo,12),20);}
      }
    }
    // gates
    for(const gt of world.gates){
      if(gt.t||!(prevZ<gt.z&&gt.z<=P.z))continue;
      if(P.x>=gt.x0&&P.x<gt.x1){for(const o of world.gates)if(o.z===gt.z)o.t=true;if(!attract)applyGate(gt);}
    }
    // gems: whole pole scoops them
    for(const g of world.gems){
      if(g.t||g.z>P.z+4||g.z<prevZ-4)continue;
      const inPole=g.x>=P.x-P.a-0.35&&g.x<=P.x+P.b+0.35;
      const mg=feverT>0&&Math.abs(g.x-P.x)<6;
      if(g.z>prevZ-0.4&&g.z<=P.z+0.2&&(inPole||mg)){
        g.t=true;stats.gems++;sfx('gem');if(feverT<=0)fever=Math.min(1,fever+1/30);
        addParts(g.x,g.y,g.z,10,()=>Math.random()<0.5?'#ff5fd8':'#ffffff',3,0.06);
      }
    }
    // saws
    for(const s of world.saws){
      if(s.broken)continue;
      if(!(prevZ<s.z&&s.z<=P.z))continue;
      const dx=s.x-P.x;
      const bodyHit=Math.abs(dx)<BODY_R+s.r*0.5;
      const poleHit=dx>0?(s.x-s.r*0.4<P.x+P.b):(s.x+s.r*0.4>P.x-P.a);
      if(feverT>0&&(bodyHit||poleHit)){s.broken=true;stats.smash++;sfx('smash');shake=0.25;addParts(s.x,s.y+s.r,s.z,22,()=>Math.random()<0.6?'#ff3b4f':'#dddddd',5,0.1);floatText('SMASH!',rainbow(),30,-20);continue;}
      if(bodyHit&&!P.hang){bonk();continue;}
      if(poleHit&&Math.abs(dx)>=BODY_R){
        const side=dx>0?1:-1;
        if(cutPole(side,Math.abs(dx)-s.r*0.35)){sfx('cut');shake=Math.max(shake,0.22);combo=0;if(!attract)floatText('SNIP!','#ff6b6b',26,-30);}
      }
    }
    // finish
    if(!endless&&prevZ<world.finishZ&&world.finishZ<=P.z){
      if(attract){resetPlayer();P.a=P.b=2.6;for(const b of world.bars)b.t=false;for(const g of world.gems)g.t=false;for(const s of world.saws)s.broken=false;for(const g of world.gates)g.t=false;}

  }else if(P.state==='fall'){

    P.finT+=dt;const s=spd*Math.max(0,1-P.finT/1.1);P.z+=s*dt;P.spd=s;
    if(Math.random()<dt*40)addParts(P.x+(Math.random()-0.5)*6,P.y+4,P.z+3+Math.random()*4,1,rainbow(),2,0.12,1);
    if(P.finT>1.6&&mode==='play'){mode='done';showResults();}
  }
  P.vx=lerp(P.vx,(P.x-px0)/Math.max(dt,0.001),Math.min(1,dt*8));
  // particles
  for(const p of parts){p.life-=dt;p.vy-=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pieces){p.life-=dt;p.vy-=14*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.ang+=p.va*dt;}
  pieces=pieces.filter(p=>p.life>0);
  for(const f of floats){f.life-=dt*1.1;f.y+=f.vy*dt;}
  floats=floats.filter(f=>f.life>0);
  if(feverT>0&&P.state==='run')addParts(P.x+(Math.random()-0.5)*(P.a+P.b),P.poleY,P.z-0.3,1,rainbow(),0.5,0.08,0.5);
  updateCamera(dt);
  ensureBuildings(cam.z+170);
}
function updateCamera(dt){
  const L=P.a+P.b,zoom=Math.min(5.5,Math.max(0,L-4)*0.42);
  let tp=0.33,rate=3;
  if(P.state==='drop'){tp=0.62;rate=1.6;}
  else if(P.state==='fall'){tp=1.0;rate=0;}
  else if(P.hang)tp=0.42;
  setPitch(lerp(PITCH,tp,Math.min(1,dt*(P.state==='fall'?2.2:3.2))));
  cam.dist=lerp(cam.dist,6.6+zoom+(P.hang?0.4:0)+(P.state==='drop'?1.2:0),Math.min(1,dt*2));
  const camH=4.4+zoom*0.55+(P.state==='drop'?1.5:0);
  if(rate>0)cam.y=lerp(cam.y,P.poleY-POLE_RUN+camH,Math.min(1,dt*rate));
  cam.z=P.z-cam.dist;
  // never let the camera sink inside the roof it is hovering over
  const under=platAt(cam.z);if(under&&cam.y<under.y+2)cam.y=under.y+2;
  const tx=(P.x+(P.b-P.a)/2)*0.65;cam.x=lerp(cam.x,tx,Math.min(1,dt*5));
  let rollT=clamp(-P.vx*0.012,-0.16,0.16);
  if(P.hang)rollT+=Math.sin(t*2.2)*0.025;
  if(P.state==='fall')rollT=0.22*Math.sin(P.fallT*1.5);
  cam.roll=lerp(cam.roll,rollT,Math.min(1,dt*4));
  const boost=P.spd/Math.max(1,speedNow()/(feverT>0?1.35:1))-1;
  cam.fov=lerp(cam.fov,clamp(boost,0,0.7)*0.18+(P.state==='drop'?0.08:0),Math.min(1,dt*3));
}
function startFall(fromDrop){
  P.state='fall';if(!fromDrop)P.vy=1.0;P.fallT=0;P.tilt=0;P.splashed=false;P.hang=false;setSlide(false);sfx('fall');stats.falls++;combo=0;
  if(endless)hearts--;
  shake=0.35;
  // the pole clatters off the rails
  const g=gapAt(P.z);if(g){const ry=railY(g,P.z);addParts(P.x-P.a,ry,P.z,8,'#ffe066',3,0.07,1);addParts(P.x+P.b,ry,P.z,8,'#ffe066',3,0.07,1);}
  if(!attract)floatText(P.a+P.b<needOf(g||{S:0,widen:0,z0:0,z1:1})?'TOO SHORT!':'MISSED!','#ff4d6d',40,-60);
}
function respawn(){
  if(endless&&hearts<=0){mode='done';showOver();return;}
  const pl=platAt(P.cpZ)||{y:0};
  P.state='run';P.z=P.cpZ;P.x=0;P.y=pl.y;P.poleY=pl.y+POLE_RUN;P.vy=0;P.tilt=0;P.a=Math.max(P.cpA,0.5);P.b=Math.max(P.cpB,0.5);P.hang=false;P.inv=1.2;
  for(const b of world.bars)if(b.z>P.cpZ)b.t=false;
  for(const g of world.gems)if(g.z>P.cpZ&&g.t){g.t=false;}
  for(const s of world.saws)if(s.z>P.cpZ)s.broken=false;
  for(const g of world.gates)if(g.z>P.cpZ)g.t=false;
  cam.z=P.z-cam.dist;cam.y=P.poleY+4;setPitch(0.33);cam.roll=0;
  P.cpFalls=(P.cpFalls||0)+1;
  if(!endless&&P.cpFalls>=3){const ng=nextGap(P.z);if(ng){const half=Math.min(MAXL,needOf(ng)+0.6)/2;P.a=Math.max(P.a,half);P.b=Math.max(P.b,half);P.cpA=P.a;P.cpB=P.b;for(const gt of world.gates)if(gt.z>P.cpZ&&gt.z<ng.z0)gt.t=true;toast={txt:'Helping hand!',life:1.8};P.grow=0.4;return;}}
  toast={txt:'Try again!',life:1.4};
}
function finish(){
  hintT=0;P.state='finish';P.finT=0;setSlide(false);sfx('finish');shake=0.3;
  addParts(P.x,P.y+2,P.z+3,60,rainbow,7,0.12,4);
}

// ================= RENDER =================
function proj(x,y,z){
  const dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;
  const zc=dz*CA-dy*SA;if(zc<0.15)return null;
  const yc=dy*CA+dz*SA,s=FF/zc;
  return{x:CX+dx*s,y:CY-yc*s,s,zc};
}
function poly(pts,fill,stroke,lw){
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}
function quad(a,b,c,d){const p=[proj(...a),proj(...b),proj(...c),proj(...d)];return p.some(v=>!v)?null:p;}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f<1){r*=f;g*=f;b*=f;}else{r+=(255-r)*(f-1);g+=(255-g)*(f-1);b+=(255-b)*(f-1);}
  return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function windowsOn(p,rows,cols,col){
  // p: 4 projected corners TL TR BR BL (top edge first)
  ctx.fillStyle=col;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const u0=(c+0.25)/cols,u1=(c+0.75)/cols,v0=(r+0.25)/rows,v1=(r+0.65)/rows;
    const P4=(u,v)=>{const tx=lerp(p[0].x,p[1].x,u),ty=lerp(p[0].y,p[1].y,u),bx=lerp(p[3].x,p[2].x,u),by=lerp(p[3].y,p[2].y,u);return[lerp(tx,bx,v),lerp(ty,by,v)];};
    const a=P4(u0,v0),b=P4(u1,v0),cc=P4(u1,v1),d=P4(u0,v1);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(cc[0],cc[1]);ctx.lineTo(d[0],d[1]);ctx.fill();
  }
}

function render(){
  const sx=(Math.random()-0.5)*shake*16,sy=(Math.random()-0.5)*shake*16;
  FF=F*(1+cam.kick)*(1-cam.fov);
  ctx.save();ctx.translate(sx,sy);
  ctx.translate(CX,CY);ctx.rotate(cam.roll);ctx.translate(-CX,-CY);
  const hor=CY-FF*Math.tan(PITCH);
  // sky
  let g=ctx.createLinearGradient(0,Math.min(-20,hor-H),0,hor);g.addColorStop(0,theme.sky[0]);g.addColorStop(1,theme.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(-W,-H,W*3,hor+H+1);
  if(theme===THEMES[2]){ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<40;i++){const x=((i*137.5)%1)*W,y=((i*71.3)%1)*hor*0.9;ctx.fillRect((i*97)%W,(i*53)%Math.max(1,hor*0.9),2,2);}}
  if(theme===THEMES[1]){ctx.fillStyle='rgba(255,240,180,.9)';ctx.beginPath();ctx.arc(W*0.72,hor-30,48,0,7);ctx.fill();}
  // clouds (parallax with cam.x)
  for(const c of clouds){
    c.x+=c.v*0.016;if(c.x>1.3)c.x=-0.3;
    const x=((c.x-cam.x*0.004)%1.6)*W,y=10+c.y*hor*0.7,r=34*c.s*(W/400+0.5);
    ctx.fillStyle=theme.cloud;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.arc(x+r*0.9,y+r*0.2,r*0.75,0,7);ctx.arc(x-r*0.9,y+r*0.25,r*0.7,0,7);ctx.arc(x+r*0.2,y-r*0.45,r*0.7,0,7);ctx.fill();
  }
  // sea
  g=ctx.createLinearGradient(0,hor,0,Math.max(H,hor+50));g.addColorStop(0,theme.sea[0]);g.addColorStop(1,theme.sea[1]);
  ctx.fillStyle=g;ctx.fillRect(-W,hor,W*3,Math.max(H*2,H*2-hor));
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
  for(let i=0;i<14;i++){const yy=hor+Math.pow(i/14,1.6)*(H-hor);const off=((t*30+i*53)%80);ctx.beginPath();for(let x=-80+off;x<W;x+=80){ctx.moveTo(x,yy);ctx.lineTo(x+18+i*2,yy);}ctx.stroke();}

  const D=[];const zMin=cam.z+0.5,zMax=cam.z+150;
  // buildings
  for(const b of world.blds){
    if(b.z+b.bd<zMin+1||b.z>zMax)continue;
    const z0=b.z,x0=b.x-b.bw/2,x1=b.x+b.bw/2,top=b.top,bot=b.bot;
    const fr=quad([x0,top,z0],[x1,top,z0],[x1,bot,z0],[x0,bot,z0]);if(!fr)continue;
    const ix=b.sd<0?x1:x0;
    const sd=quad([ix,top,z0],[ix,top,z0+b.bd],[ix,bot,z0+b.bd],[ix,bot,z0]);
    const tp=quad([x0,top,z0],[x1,top,z0],[x1,top,z0+b.bd],[x0,top,z0+b.bd]);
    const zc=fr[0].zc+b.bd*0.5;
    D.push({zc,f:()=>{
      if(sd)poly(sd,fogGrad(sd[0].y,sd[2].y,shade(b.col,0.82)));
      poly(fr,fogGrad(fr[0].y,fr[3].y,b.col));
      if(tp&&top<cam.y)poly(tp,shade(b.col,1.18));
      if(fr[0].zc<90)windowsOn([fr[0],fr[1],fr[2],fr[3]],Math.max(3,Math.round((top-bot)/9)),3,theme.win);
    }});
  }
  // platforms (rooftops on deep towers)
  const SL=3,DEEP=110;
  for(const p of world.plats){
    if(p.z1<zMin||p.z0>zMax)continue;const hw=p.w/2,y=p.y;
    if(p.z0>zMin){
      const fr=quad([-hw,y,p.z0],[hw,y,p.z0],[hw,y-DEEP,p.z0],[-hw,y-DEEP,p.z0]);
      if(fr)D.push({zc:fr[0].zc+0.02,f:()=>{poly(fr,fogGrad(fr[0].y,fr[3].y,theme.front));windowsOn(fr,22,3,theme.win);ctx.strokeStyle=theme.edge;ctx.lineWidth=Math.max(2,fr[0].s*0.1);ctx.beginPath();ctx.moveTo(fr[0].x,fr[0].y);ctx.lineTo(fr[1].x,fr[1].y);ctx.stroke();}});
    }
    let k=Math.floor(Math.max(p.z0,zMin)/SL);
    for(;k*SL<Math.min(p.z1,zMax);k++){

      const q=quad([-hw,y,za],[hw,y,za],[hw,y,zb],[-hw,y,zb]);if(!q)continue;
      const col=theme.plat[k&1],edge=zb>=p.z1-0.01&&!!gapAt(p.z1+0.1);
      let side=null;
      if(cam.x<-hw-0.2)side=quad([-hw,y,za],[-hw,y,zb],[-hw,y-DEEP,zb],[-hw,y-DEEP,za]);
      else if(cam.x>hw+0.2)side=quad([hw,y,za],[hw,y,zb],[hw,y-DEEP,zb],[hw,y-DEEP,za]);
      D.push({zc:proj(0,y,(za+zb)/2).zc+0.5,f:()=>{
        if(side)poly(side,fogGrad(side[0].y,side[3].y,shade(theme.front,0.85)));
        poly(q,col);
        ctx.strokeStyle=theme.edge;ctx.lineWidth=Math.max(1.5,q[0].s*0.12);
        ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);ctx.lineTo(q[3].x,q[3].y);ctx.moveTo(q[1].x,q[1].y);ctx.lineTo(q[2].x,q[2].y);ctx.stroke();
        if(edge)for(let i=0;i<8;i++){const xa=-hw+i*hw/4,e=quad([xa,y+0.01,p.z1-0.7],[xa+hw/4,y+0.01,p.z1-0.7],[xa+hw/4,y+0.01,p.z1],[xa,y+0.01,p.z1]);if(e)poly(e,i&1?'#222':'#ffcc00');}
      }});
    }
  }
  // finish arch
  if(!endless&&world.finishZ+9<zMax&&world.finishZ+9>zMin){
    const fz=world.finishZ+9,hw=4.2,fy=yAt(fz);
    const pa=proj(-hw,fy,fz),pb=proj(-hw,fy+4.4,fz),pc=proj(hw,fy,fz),pd=proj(hw,fy+4.4,fz);

      ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.moveTo(pc.x,pc.y);ctx.lineTo(pd.x,pd.y);ctx.stroke();
      const cols=12,rows=2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){

        const q=quad([x0,y0,fz],[x1,y0,fz],[x1,y1,fz],[x0,y1,fz]);if(q)poly(q,(r+c)&1?'#111':'#fff');
      }

  }

        D.push({zc:(a.zc+b.zc)/2+0.3,f:()=>{
          ctx.lineCap='round';
          ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=Math.max(2,a.s*0.2);ctx.beginPath();ctx.moveTo(a.x,a.y+a.s*0.05);ctx.lineTo(b.x,b.y+b.s*0.05);ctx.stroke();
          ctx.strokeStyle=(i&1)?'#2f3442':'#eef1f7';ctx.lineWidth=Math.max(1.5,a.s*0.15);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        }});
      }
    }
    const sup=[gp.z0+0.2];for(let z=gp.z0+8;z<gp.z1-3;z+=8)sup.push(z);
    for(const z of sup){if(z<zMin)continue;
      for(const sd of[-1,1]){
        const x=railC(gp,z)+sd*railS(gp,z)/2,ry=railY(gp,z);const a=proj(x,ry,z),b=proj(x,ry-60,z);if(!a||!b)continue;
        D.push({zc:a.zc+0.35,f:()=>{const gr=ctx.createLinearGradient(0,a.y,0,b.y);gr.addColorStop(0,'#3a3f52');gr.addColorStop(1,'rgba(58,63,82,0)');ctx.strokeStyle=gr;ctx.lineCap='butt';ctx.lineWidth=Math.max(1.5,a.s*0.12);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}});
      }
    }
    // need-indicator posts where the rails start
    if(!P.hang&&P.state==='run'&&gp.z0-P.z<45&&gp.z0>P.z){
      for(const sd of[-1,1]){
        const x=railC(gp,gp.z0)+sd*railS(gp,gp.z0)/2;const a=proj(x,gp.yA,gp.z0+0.2),b=proj(x,gp.yA+1.6,gp.z0+0.2);if(!a||!b)continue;

          ctx.lineCap='round';ctx.strokeStyle=ok?'#3df07a':'#ff4d6d';ctx.globalAlpha=0.6+0.4*Math.sin(t*10);

          ctx.beginPath();ctx.arc(b.x,b.y,Math.max(4,a.s*0.22),0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();ctx.globalAlpha=1;
        }});
      }
    }
  }
  // gates
  for(const gt of world.gates){
    if(gt.t||gt.z<zMin||gt.z>zMax)continue;
    const q=quad([gt.x0+0.08,gt.y+2.5,gt.z],[gt.x1-0.08,gt.y+2.5,gt.z],[gt.x1-0.08,gt.y,gt.z],[gt.x0+0.08,gt.y,gt.z]);if(!q)continue;
    const c=proj((gt.x0+gt.x1)/2,gt.y+1.35,gt.z);

      ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(Math.min(q[0].x,q[3].x),q[0].y,(q[1].x-q[0].x),(q[3].y-q[0].y)*0.18);

  }
  // bars

    if(b.t||b.z<zMin||b.z>zMax)continue;
    if(b.v>1){
      const hl=0.65,ps=[0,1,2].map(k=>[proj(b.x-hl,b.y+0.16+k*0.26,b.z),proj(b.x+hl,b.y+0.16+k*0.26,b.z)]);if(ps.some(p=>!p[0]||!p[1]))continue;
      const lb=proj(b.x,b.y+1.25+Math.sin(t*4+b.z)*0.1,b.z);
      D.push({zc:ps[0][0].zc,f:()=>{
        ctx.lineCap='round';const w=Math.max(3,ps[0][0].s*0.3);
        for(const[a,c]of ps){ctx.strokeStyle='#c98600';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();ctx.strokeStyle='#ffe066';ctx.lineWidth=w*0.5;ctx.beginPath();ctx.moveTo(a.x,a.y-w*0.15);ctx.lineTo(c.x,c.y-w*0.15);ctx.stroke();}
        if(lb){ctx.font='900 '+Math.max(9,Math.round(lb.s*0.6))+'px "Trebuchet MS",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=Math.max(2,lb.s*0.1);ctx.strokeStyle='#7a4a00';ctx.strokeText('+'+b.v,lb.x,lb.y);ctx.fillStyle='#ffe14d';ctx.fillText('+'+b.v,lb.x,lb.y);}
      }});
      continue;
    }
    const a=proj(b.x-0.45,b.y+0.14,b.z),c=proj(b.x+0.45,b.y+0.14,b.z);if(!a||!c)continue;
    D.push({zc:a.zc,f:()=>{
      ctx.lineCap='round';const w=Math.max(2.5,a.s*0.26);
      ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y+w*0.5);ctx.lineTo(c.x,c.y+w*0.5);ctx.stroke();
      ctx.strokeStyle='#e8a400';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();
      ctx.strokeStyle='#ffe066';ctx.lineWidth=w*0.5;ctx.beginPath();ctx.moveTo(a.x,a.y-w*0.15);ctx.lineTo(c.x,c.y-w*0.15);ctx.stroke();
      const gl=(t*1.5+b.z*0.13)%1;if(gl<0.3){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(lerp(a.x,c.x,gl/0.3),a.y-w*0.15,w*0.3,0,7);ctx.fill();}
    }});
  }
  // gems
  for(const gm of world.gems){

    const c=proj(gm.x,gm.y+Math.sin(t*3+gm.z)*0.12,gm.z);if(!c)continue;
    D.push({zc:c.zc,f:()=>{
      const r=Math.max(3,c.s*0.3),sp=Math.cos(t*3+gm.z);
      const rw=r*(0.55+0.45*Math.abs(sp));
      ctx.fillStyle='#d6249f';ctx.beginPath();ctx.moveTo(c.x,c.y-r);ctx.lineTo(c.x+rw,c.y-r*0.2);ctx.lineTo(c.x,c.y+r);ctx.lineTo(c.x-rw,c.y-r*0.2);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff7ce0';ctx.beginPath();ctx.moveTo(c.x,c.y-r);ctx.lineTo(c.x+rw*sp,c.y-r*0.2);ctx.lineTo(c.x,c.y+r);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(c.x-rw*0.3,c.y-r*0.45,r*0.18,0,7);ctx.fill();
    }});
  }
  // saws
  for(const s of world.saws){
    if(s.broken||s.z<zMin||s.z>zMax)continue;
    const c=proj(s.x,s.y+s.r,s.z);if(!c)continue;
    let gr=null;if(s.amp){gr=[proj(s.x0-s.amp-0.4,s.y+0.01,s.z),proj(s.x0+s.amp+0.4,s.y+0.01,s.z)];if(!gr[0]||!gr[1])gr=null;}
    const base=proj(s.x,s.y,s.z);
    D.push({zc:c.zc,f:()=>{
      if(gr){ctx.lineCap='round';ctx.strokeStyle='rgba(30,20,50,.55)';ctx.lineWidth=Math.max(2,c.s*0.18);ctx.beginPath();ctx.moveTo(gr[0].x,gr[0].y);ctx.lineTo(gr[1].x,gr[1].y);ctx.stroke();}
      const R=s.r*c.s,ang=t*9*(s.x0>=0?1:-1);
      if(base){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(base.x,base.y,R*0.9,R*0.22,0,0,7);ctx.fill();}
      ctx.beginPath();
      const N=14;for(let i=0;i<N*2;i++){const a=ang+i*Math.PI/N,rr=i&1?R*0.82:R;ctx.lineTo(c.x+Math.cos(a)*rr,c.y+Math.sin(a)*rr);}
      ctx.closePath();ctx.fillStyle='#e8243c';ctx.fill();ctx.strokeStyle='#8a0f1f';ctx.lineWidth=Math.max(1,R*0.06);ctx.stroke();
      ctx.fillStyle='#ff6b7d';ctx.beginPath();ctx.arc(c.x,c.y,R*0.62,0,7);ctx.fill();
      ctx.fillStyle='#b5162b';ctx.beginPath();ctx.arc(c.x,c.y,R*0.5,0,7);ctx.fill();
      ctx.fillStyle='#d9dde6';ctx.beginPath();ctx.arc(c.x,c.y,R*0.2,0,7);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=Math.max(1,R*0.08);ctx.beginPath();ctx.arc(c.x,c.y,R*0.4,ang,ang+1.2);ctx.stroke();
    }});
  }
  // falling pole pieces
  for(const pc of pieces){
    const c=proj(pc.x,pc.y,pc.z);if(!c)continue;
    D.push({zc:c.zc,f:()=>{
      const hl=pc.len*c.s/2,dx=Math.cos(pc.ang)*hl,dy=Math.sin(pc.ang)*hl;ctx.globalAlpha=Math.min(1,pc.life*1.5);

    }});
  }
  // player
  {const c=proj(P.x,P.y,P.z);if(c)D.push({zc:c.zc,f:drawPlayer});}
  // particles
  for(const p of parts){
    const c=proj(p.x,p.y,p.z);if(!c)continue;
    D.push({zc:c.zc-0.05,f:()=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(c.x,c.y,Math.max(1.2,p.size*c.s),0,7);ctx.fill();ctx.globalAlpha=1;}});
  }
  D.sort((a,b)=>b.zc-a.zc);
  for(const d of D)d.f();

  if(feverT>0){ctx.fillStyle='hsla('+((t*200)%360)+',100%,60%,0.08)';ctx.fillRect(-W,-H,W*3,H*3);}
  ctx.restore();
  speedLines();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.7)+')';ctx.fillRect(0,0,W,H);}
  // palm frond decoration (screen space)
  if(theme!==THEMES[2])drawPalm();
  if(!attract)drawHUD();
}

function fogGrad(y0,y1,col){
  if(!isFinite(y0)||!isFinite(y1)||Math.abs(y1-y0)<2)return col;
  const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,col);g.addColorStop(0.45,col);g.addColorStop(1,theme.sea[1]);return g;
}
function speedLines(){
  if(attract)return;
  const k=(P.state==='drop'?0.7:0)+(P.state==='fall'?0.5:0)+clamp(cam.fov*4,0,1)*0.8+(feverT>0?0.5:0);
  if(k<0.05)return;
  ctx.save();ctx.strokeStyle='rgba(255,255,255,'+Math.min(0.55,k*0.4)+')';ctx.lineCap='round';
  const vx=CX,vy=P.state==='drop'?H*0.8:CY;
  for(let i=0;i<26;i++){
    const a=i*2.399+Math.floor(t*12+i)*0.7,r0=Math.max(W,H)*(0.35+((t*2.5+i*0.37)%1)*0.5),len=40+k*90;
    const cx=Math.cos(a),cy=Math.sin(a);
    ctx.lineWidth=1.5+(i%3);ctx.beginPath();ctx.moveTo(vx+cx*r0,vy+cy*r0);ctx.lineTo(vx+cx*(r0+len),vy+cy*(r0+len));ctx.stroke();
  }
  ctx.restore();
}
function drawPoleSeg(x1,y1,x2,y2,w,st,glow,segPx){
  ctx.lineCap='round';
  if(glow){ctx.strokeStyle=glow;ctx.globalAlpha*=0.45;ctx.lineWidth=w*2.6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha/=0.45;}
  if(st.glow){ctx.strokeStyle=st.b;ctx.globalAlpha*=0.35;ctx.lineWidth=w*2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha/=0.35;}
  ctx.strokeStyle='rgba(40,20,0,.55)';ctx.lineWidth=w+3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(st.rainbow){
    const gr=ctx.createLinearGradient(x1,y1,x2,y2);for(let i=0;i<=6;i++)gr.addColorStop(i/6,'hsl('+((i*60+t*120)%360)+',100%,60%)');ctx.strokeStyle=gr;
  }else ctx.strokeStyle=st.b;
  ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(!st.rainbow){ctx.strokeStyle=st.a;ctx.lineWidth=w*0.5;ctx.beginPath();ctx.moveTo(x1,y1-w*0.12);ctx.lineTo(x2,y2-w*0.12);ctx.stroke();}
  if(segPx&&segPx>5){
    const len=Math.hypot(x2-x1,y2-y1),n=Math.floor(len/segPx);
    ctx.strokeStyle=st.stripe?st.b:'rgba(80,40,0,.35)';ctx.lineWidth=st.stripe?segPx*0.45:Math.max(1,w*0.18);ctx.lineCap='butt';
    ctx.beginPath();
    for(let i=1;i<=n;i++){const u=i*segPx/len,x=lerp(x1,x2,u),y=lerp(y1,y2,u);if(st.stripe){ctx.moveTo(x-segPx*0.22,y);ctx.lineTo(x+segPx*0.22,y);}else{ctx.moveTo(x,y-w*0.5);ctx.lineTo(x,y+w*0.5);}}
    ctx.stroke();ctx.lineCap='round';
  }
}

function drawPlayer(){
  const sk=SKINS[save.skin]||SKINS[0],ps=POLES[save.pole]||POLES[0];
  if(P.inv>0&&Math.floor(t*14)%2===0&&P.state==='run')ctx.globalAlpha=0.45;
  const y0=P.y,tilt=P.state==='fall'?P.tilt:0,air=P.hang||P.state==='drop'||P.state==='fall';
  const pp=(dx,dy)=>{
    if(tilt){const c=Math.cos(tilt*0.5),s=Math.sin(tilt*0.5);const ry=dy-1;dy=1+ry*c;dx=dx+ry*s*0.3;}
    return proj(P.x+dx,y0+dy,P.z);
  };

  if(base&&!air){ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(base.x,base.y,base.s*0.45,base.s*0.13,0,0,7);ctx.fill();}
  const ph=P.run*1.6;
  const running=P.state==='run'&&!P.hang||P.state==='finish'&&P.spd>0.5;
  const kick=P.state==='drop'?Math.sin(t*14)*0.18:0;
  const lift1=running?Math.max(0,Math.sin(ph))*0.28:0,lift2=running?Math.max(0,-Math.sin(ph))*0.28:0;
  const bob=running?Math.abs(Math.sin(ph))*0.06:0;
  const sw=air?Math.sin(t*4)*0.08:0;
  const o=bob;
  const hip=pp(sw,0.72+o),sh=pp(sw*0.6,1.3+o),head=pp(sw*0.4,1.66+o);
  if(!hip||!sh||!head){ctx.globalAlpha=1;return;}
  const s=head.s,lw=Math.max(3,s*0.2);
  ctx.lineCap='round';ctx.lineJoin='round';
  // legs
  const legs=[[-0.15,lift1],[0.15,lift2]];
  for(const[lx,lf]of legs){
    const kn=pp(lx+sw,0.38+o+lf*0.9+(lx<0?kick:-kick)),ft=pp(lx+sw*1.3+(air?lx*0.6:0),0.02+o+lf*(air?0.2:1)+(lx<0?kick:-kick)*1.5);
    if(!kn||!ft)continue;
    ctx.strokeStyle=sk.b;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(hip.x+lx*s*0.8,hip.y);ctx.lineTo(kn.x,kn.y);ctx.lineTo(ft.x,ft.y);ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(ft.x,ft.y,lw*0.7,lw*0.45,0,0,7);ctx.fill();
  }
  // body
  ctx.strokeStyle=sk.b;ctx.lineWidth=lw*1.9;ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(sh.x,sh.y);ctx.stroke();
  // arms to pole
  const hl=pp(-0.42,P.poleY-y0),hr=pp(0.42,P.poleY-y0);
  ctx.strokeStyle=sk.b;ctx.lineWidth=lw*0.85;
  const sl=pp(-0.2+sw*0.6,1.25+o),sr=pp(0.2+sw*0.6,1.25+o);
  if(P.state!=='fall'&&hl&&hr&&sl&&sr){ctx.beginPath();ctx.moveTo(sl.x,sl.y);ctx.lineTo(hl.x,hl.y);ctx.moveTo(sr.x,sr.y);ctx.lineTo(hr.x,hr.y);ctx.stroke();}
  else if(sl&&sr){const wv=Math.sin(t*20)*0.3;const a1=pp(-0.6,1.8+o+wv),a2=pp(0.6,1.8+o-wv);if(a1&&a2){ctx.beginPath();ctx.moveTo(sl.x,sl.y);ctx.lineTo(a1.x,a1.y);ctx.moveTo(sr.x,sr.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();}}
  // head (seen from behind)
  const hr2=s*0.34;
  const hg=ctx.createRadialGradient(head.x-hr2*0.3,head.y-hr2*0.4,hr2*0.2,head.x,head.y,hr2);
  hg.addColorStop(0,shade(sk.c,1.25));hg.addColorStop(1,sk.d);
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(head.x,head.y,hr2,0,7);ctx.fill();
  if(P.bonkT>0){ctx.fillStyle='#fff';ctx.font='bold '+Math.round(s*0.4)+'px system-ui';ctx.textAlign='center';for(let i=0;i<3;i++){const a=t*8+i*2.1;ctx.fillText('★',head.x+Math.cos(a)*hr2*1.3,head.y-hr2*1.1+Math.sin(a)*hr2*0.3);}}

    const a=pp(-P.a,P.poleY-y0+0.3),b=pp(P.b,P.poleY-y0-0.3);

    const need=needOf(ng);glow=(P.a+P.b>=need+0.15)?'#3df07a':'#ff4d6d';
  }
  if(feverT>0)glow='hsl('+((t*400)%360)+',100%,60%)';
  const w=Math.max(3,pa.s*(0.15+Math.min(0.14,(P.a+P.b)*0.0045)))*(1+P.grow*1.2);
  drawPoleSeg(pa.x,pa.y,pb.x,pb.y,w,ps,glow,PIECE*pa.s);
  // end caps
  ctx.fillStyle=ps.b;for(const e of[pa,pb]){ctx.beginPath();ctx.arc(e.x,e.y,w*0.7,0,7);ctx.fill();}
  // hands
  if(hl&&hr){ctx.fillStyle=sk.c;ctx.beginPath();ctx.arc(hl.x,hl.y,lw*0.6,0,7);ctx.arc(hr.x,hr.y,lw*0.6,0,7);ctx.fill();}
  // need more bubble
  const needL=ng?needOf(ng):0;
  if(ng&&!P.hang&&P.state==='run'&&ng.z0-P.z<30&&ng.z0-P.z>0&&P.a+P.b<needL+0.15&&P.state==='run'){
    const need=Math.ceil((needL+0.2-(P.a+P.b))/PIECE);

  }
}
function bubble(x,y,txt,col){
  ctx.font='900 17px "Trebuchet MS",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+22,h=30,sc=1+Math.sin(t*8)*0.05;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle=col;rr(-w/2,-h/2,w,h,14);ctx.fill();
  ctx.beginPath();ctx.moveTo(-6,h/2-1);ctx.lineTo(6,h/2-1);ctx.lineTo(0,h/2+8);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(txt,0,1);ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPalm(){
  const x=W+10,y=-10,sc=Math.min(W,H)/520;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  const sway=Math.sin(t*1.2)*0.05;
  for(let i=0;i<6;i++){
    ctx.save();ctx.rotate(1.75+i*0.32+sway);
    ctx.fillStyle=i%2?'#2e9e4f':'#3cb85f';
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(70,-24,170,8);ctx.quadraticCurveTo(80,10,0,8);ctx.fill();
    ctx.strokeStyle='rgba(0,60,20,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,4);ctx.quadraticCurveTo(80,-6,165,8);ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
const feverBtn={x:0,y:0,r:36};
function drawHUD(){

  }
  // gems

  const gt='💎 '+(save.gems+stats.gems);const gw=ctx.measureText(gt).width+24;
  ctx.fillStyle='rgba(0,0,0,.35)';rr(W-gw-10,top,gw,34,17);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(gt,W-gw/2-10,top+18);

  ctx.strokeStyle='#ffe066';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px-46,py-1);ctx.lineTo(px-14,py-1);ctx.stroke();

  ctx.beginPath();ctx.arc(0,0,fr-5,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);ctx.stroke();

  ctx.restore();
  // floats
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*1.6);ctx.font='900 '+f.size+'px "Trebuchet MS",system-ui';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  // checkpoint flash
  if(cpFlash>0){ctx.globalAlpha=Math.min(1,cpFlash);ctx.font='900 20px "Trebuchet MS",system-ui';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.4)';const y=top+(endless?110:98);ctx.strokeText('⚑ CHECKPOINT',CX,y);ctx.fillStyle='#7ff9ff';ctx.fillText('⚑ CHECKPOINT',CX,y);ctx.globalAlpha=1;}
  // toast
  if(toast){ctx.globalAlpha=Math.min(1,toast.life*2);ctx.font='900 40px "Trebuchet MS",system-ui';ctx.lineWidth=8;ctx.strokeStyle='#5b2a9e';ctx.strokeText(toast.txt,CX,H*0.5);ctx.fillStyle='#fff';ctx.fillText(toast.txt,CX,H*0.5);ctx.globalAlpha=1;}
  // hint
  if(hintT>0){
    ctx.globalAlpha=Math.min(1,hintT);
    const hx=CX+Math.sin(t*4)*60,hy=H*0.66;
    ctx.font='44px system-ui';ctx.fillText('👆',hx,hy);
    ctx.font='900 22px "Trebuchet MS",system-ui';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.5)';
    ctx.strokeText('Drag to move!',CX,hy+46);ctx.fillStyle='#fff';ctx.fillText('Drag to move!',CX,hy+46);
    ctx.strokeText('Grab the yellow bars',CX,hy+74);ctx.fillStyle='#ffe066';ctx.fillText('Grab the yellow bars',CX,hy+74);
    ctx.globalAlpha=1;
  }
  if(feverT>0){ctx.font='900 30px "Trebuchet MS",system-ui';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.strokeText('FEVER!',CX,H*0.22);ctx.fillStyle='hsl('+((t*400)%360)+',100%,62%)';ctx.fillText('FEVER!',CX,H*0.22);}
}

// ================= INPUT =================
let drag=null;
function sens(){const zc=cam.dist*CA+(cam.y-P.poleY)*SA;return zc/FF*1.15;}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();if(mode!=='play')return;
  if(Math.hypot(e.clientX-feverBtn.x,e.clientY-feverBtn.y)<feverBtn.r+12){activateFever();return;}
  drag={id:e.pointerId,x:e.clientX};try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(hintT>2)hintT=2;
});
cv.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){inputDX+=(e.clientX-drag.x)*sens();drag.x=e.clientX;}});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keyL=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keyR=true;
  if(e.key===' '){if(mode==='play')activateFever();e.preventDefault();}
  if(e.key==='Enter'&&mode==='menu')$('bPlay').click();
});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keyL=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keyR=false;});
function activateFever(){
  if(fever<1||feverT>0||P.state!=='run')return;
  fever=0;feverT=5;sfx('fever');shake=0.3;addParts(P.x,1,P.z,40,rainbow,6,0.1,3);floatText('FEVER!','#fff',40,-40);
}

// ================= UI / OVERLAYS =================
function showOv(id){for(const o of['menu','done','shop'])$(o).classList.toggle('show',o===id);}
function totalStars(){let s=0;for(const k in save.stars)s+=save.stars[k];return s;}
function buildMenu(){
  const L=$('lvls');L.innerHTML='';
  for(let i=1;i<=15;i++){
    const b=document.createElement('button');const lock=i>save.unlocked;
    b.className='lv '+(lock?'lock':'w'+(1+Math.floor((i-1)/5)))+(i===Math.min(save.unlocked,15)?' cur':'');
    const st=save.stars[i]||0;
    b.innerHTML=lock?'&#128274;':i+'<small>'+'&#11088;'.repeat(st)+'</small>';
    if(!lock)b.onclick=()=>{ensureAudio();startLevel(i);};
    L.appendChild(b);
  }
  $('bPlay').innerHTML='&#9654; PLAY '+Math.min(save.unlocked,15);
  $('mGems').innerHTML='&#128142; '+save.gems;$('mStars').innerHTML='&#11088; '+totalStars()+'/45';
  const eu=save.unlocked>=4;$('bEndless').style.opacity=eu?1:0.5;
  $('bEndless').innerHTML=eu?'&#9854; ENDLESS'+(save.best?' <small style="font-size:14px">best '+save.best+'m</small>':''):'&#128274; ENDLESS <small style="font-size:13px">(beat level 3)</small>';
}
function goMenu(){$('hudbtns').style.display='none';startAttract();buildMenu();showOv('menu');}
$('bPlay').onclick=()=>{ensureAudio();startLevel(Math.min(save.unlocked,15));};
$('bEndless').onclick=()=>{ensureAudio();if(save.unlocked>=4)startEndless();else sfx('no');};
$('bShop').onclick=()=>{ensureAudio();sfx('click');shopTab='run';buildShop();showOv('shop');};
$('sBack').onclick=()=>{sfx('click');buildMenu();showOv('menu');};
$('bHome').onclick=()=>{sfx('click');goMenu();};
$('bMute').onclick=()=>{ensureAudio();setMute(!save.muted);};
$('dHome').onclick=()=>{sfx('click');goMenu();};
$('dRetry').onclick=()=>{if(endless)startEndless();else startLevel(level);};
$('dNext').onclick=()=>{if(endless)startEndless();else if(level<15)startLevel(level+1);else goMenu();};
$('tRun').onclick=()=>{shopTab='run';buildShop();};
$('tPole').onclick=()=>{shopTab='pole';buildShop();};

function showResults(){
  musOn=false;
  const stars=stats.falls===0?3:stats.falls<=2?2:1;
  const pcs=Math.round((P.a+P.b)/PIECE),bonus=Math.floor(pcs/2);
  const earned=stats.gems+bonus+stars*5;
  save.gems+=earned;save.stars[level]=Math.max(save.stars[level]||0,stars);
  if(level>=save.unlocked&&level<15)save.unlocked=level+1;else if(level===15)save.unlocked=Math.max(save.unlocked,15);
  persist();
  $('dTitle').textContent=level===15?'YOU BEAT IT ALL!':'LEVEL '+level+' DONE!';
  const ss=$('dStars').children;for(let i=0;i<3;i++){ss[i].className=i<stars?'on':'';}
  $('dStats').innerHTML='';
  const rows=[['&#128207; Pole pieces left',pcs],['&#128142; Gems grabbed',stats.gems],['&#127873; Pole bonus','+'+bonus],['&#11088; Star bonus','+'+stars*5],['&#127881; Total gems','+'+earned]];
  if(stats.falls)rows.splice(1,0,['&#128167; Splashes',stats.falls]);
  $('dNext').style.display='';$('dNext').innerHTML=level<15?'NEXT &#9654;':'&#127968; MENU';
  showOv('done');
  rows.forEach((r,i)=>setTimeout(()=>{const d=document.createElement('div');d.className='stat';d.innerHTML='<span>'+r[0]+'</span><span>'+r[1]+'</span>';$('dStats').appendChild(d);sfx('coin',i*3);},250+i*170));
  for(let i=0;i<3;i++)setTimeout(()=>{ss[i].classList.add('pop');if(i<stars)sfx('star',i);},150+i*330);
}
function showOver(){
  musOn=false;setSlide(false);
  const m=Math.floor(P.z),earned=stats.gems+Math.floor(m/50);const nb=m>save.best;
  if(nb)save.best=m;save.gems+=earned;persist();
  $('dTitle').textContent=nb?'NEW BEST!':'RUN OVER';
  const ss=$('dStars').children;const st=m>=1500?3:m>=700?2:m>=250?1:0;
  for(let i=0;i<3;i++)ss[i].className=i<st?'on':'';
  $('dStats').innerHTML='';
  [['&#128207; Distance',m+' m'],['&#127942; Best',save.best+' m'],['&#128142; Gems grabbed',stats.gems],['&#127873; Distance bonus','+'+Math.floor(m/50)],['&#127881; Total gems','+'+earned]].forEach((r,i)=>setTimeout(()=>{const d=document.createElement('div');d.className='stat';d.innerHTML='<span>'+r[0]+'</span><span>'+r[1]+'</span>';$('dStats').appendChild(d);sfx('coin',i*3);},250+i*170));
  $('dNext').innerHTML='&#8635; AGAIN';$('dNext').style.display='';
  showOv('done');for(let i=0;i<3;i++)setTimeout(()=>{ss[i].classList.add('pop');if(i<st)sfx('star',i);},150+i*330);
}
let shopTab='run';
function buildShop(){
  $('tRun').classList.toggle('on',shopTab==='run');$('tPole').classList.toggle('on',shopTab==='pole');
  $('sGems').innerHTML='&#128142; '+save.gems;
  const G=$('sGrid');G.innerHTML='';
  const list=shopTab==='run'?SKINS:POLES,owned=shopTab==='run'?save.skins:save.poles,cur=shopTab==='run'?save.skin:save.pole;
  list.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item'+(i===cur?' eq':'');
    const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
    if(shopTab==='run'){
      x.fillStyle=it.b;x.lineCap='round';x.strokeStyle=it.b;x.lineWidth=18;x.beginPath();x.moveTo(64,70);x.lineTo(64,104);x.stroke();
      x.lineWidth=10;x.beginPath();x.moveTo(56,100);x.lineTo(50,122);x.moveTo(72,100);x.lineTo(78,122);x.moveTo(56,74);x.lineTo(26,92);x.moveTo(72,74);x.lineTo(102,92);x.stroke();
      const gg=x.createRadialGradient(56,40,6,64,48,30);gg.addColorStop(0,shade(it.c,1.25));gg.addColorStop(1,it.d);x.fillStyle=gg;x.beginPath();x.arc(64,48,28,0,7);x.fill();
      x.strokeStyle='#e8a400';x.lineWidth=8;x.beginPath();x.moveTo(8,92);x.lineTo(120,92);x.stroke();
    }else{
      const sv=ctx;
      x.save();x.translate(64,64);x.rotate(-0.6);
      const tmp={w:0};
      x.lineCap='round';x.strokeStyle='rgba(40,20,0,.55)';x.lineWidth=20;x.beginPath();x.moveTo(-54,0);x.lineTo(54,0);x.stroke();
      if(it.rainbow){const gr=x.createLinearGradient(-54,0,54,0);for(let k=0;k<=6;k++)gr.addColorStop(k/6,'hsl('+k*60+',100%,60%)');x.strokeStyle=gr;}else x.strokeStyle=it.b;
      x.lineWidth=16;x.beginPath();x.moveTo(-54,0);x.lineTo(54,0);x.stroke();
      if(!it.rainbow){x.strokeStyle=it.a;x.lineWidth=7;x.beginPath();x.moveTo(-54,-2);x.lineTo(54,-2);x.stroke();}
      if(it.stripe){x.strokeStyle=it.b;x.lineWidth=7;x.lineCap='butt';for(let k=-45;k<50;k+=16){x.beginPath();x.moveTo(k,-8);x.lineTo(k+6,8);x.stroke();}}
      x.restore();
    }
    d.appendChild(c);
    const has=owned.includes(i);
    d.insertAdjacentHTML('beforeend','<b>'+it.n+'</b><i>'+(i===cur?'&#10004; ON':has?'Tap to use':'&#128142; '+it.cost)+'</i>');
    d.onclick=()=>{
      if(has){if(shopTab==='run')save.skin=i;else save.pole=i;sfx('click');}
      else if(save.gems>=it.cost){save.gems-=it.cost;owned.push(i);if(shopTab==='run')save.skin=i;else save.pole=i;sfx('buy');}
      else{sfx('no');d.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250});return;}
      persist();buildShop();
    };
    G.appendChild(d);
  });
}

// ================= LOOP =================
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(mode!=='shop'||attract)update(dt);
  render();
  requestAnimationFrame(frame);
}
setMute(save.muted);
startAttract();buildMenu();
requestAnimationFrame(frame);
// test hook
window.__pr={P,get world(){return world},startLevel,startEndless,get mode(){return mode},get stats(){return stats},setX:x=>{P.x=x;}};
</script>
