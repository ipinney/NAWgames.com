<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Singing Hero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a2e;overflow:hidden;touch-action:none;user-select:none;font-family:'Segoe UI',sans-serif}
canvas#c{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1}
#startScreen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,10,46,0.93)}
#startScreen h1{font-size:clamp(2rem,6vw,3.5rem);background:linear-gradient(90deg,#ec4899,#f59e0b,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#startScreen .sub{color:#ec4899;font-size:clamp(0.9rem,2.5vw,1.1rem);margin-bottom:12px}
#startScreen p{color:#c0a0d0;font-size:clamp(0.8rem,2vw,0.95rem);margin-bottom:8px;text-align:center;padding:0 20px;line-height:1.5}
#playBtn{background:linear-gradient(135deg,#ec4899,#f59e0b);color:#fff;border:none;padding:16px 45px;font-size:clamp(1.1rem,3vw,1.5rem);border-radius:50px;cursor:pointer;font-weight:bold;box-shadow:0 5px 0 #9d174d,0 8px 20px rgba(0,0,0,0.4);margin-top:15px}
#hud{position:fixed;top:0;left:0;right:0;z-index:50;padding:8px 12px;display:none;pointer-events:none;text-align:center}
#phaseDisplay{font-size:clamp(1rem,3vw,1.4rem);color:#ec4899;font-weight:bold}
#timerDisplay{font-size:clamp(0.8rem,2vw,1rem);color:#f59e0b;margin-top:3px}
#scoreDisplay{font-size:clamp(0.9rem,2.5vw,1.2rem);color:#10b981;margin-top:3px}
#noteGrid{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:60;display:none;gap:8px}
.noteBtn{width:clamp(50px,12vw,70px);height:clamp(50px,12vw,70px);border-radius:15px;border:3px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,3vw,1.8rem);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 0.1s}
.noteBtn:active{transform:scale(0.9)}
#recordBtn{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:60;display:none;background:linear-gradient(135deg,#ef4444,#ec4899);color:#fff;border:none;padding:12px 30px;font-size:1rem;border-radius:30px;cursor:pointer;font-weight:bold}
#judgeScreen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.9)}
#judgeScreen h1{font-size:clamp(1.8rem,5vw,3rem);color:#ffd700;margin-bottom:15px}
#judges{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.judge{text-align:center;padding:15px;border-radius:15px;background:rgba(255,255,255,0.05);min-width:100px}
.judge .emoji{font-size:2.5rem}
.judge .name{color:#fff;font-size:0.9rem;margin:5px 0}
.judge .score{font-size:1.5rem;font-weight:bold}
#totalScore{font-size:clamp(1.2rem,3vw,1.8rem);color:#10b981;margin-bottom:15px}
#judgeScreen button{background:linear-gradient(135deg,#ec4899,#f59e0b);color:#fff;border:none;padding:14px 40px;font-size:1.2rem;border-radius:50px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div id="startScreen">
  <h1>🎤 Singing Hero</h1>
  <div class="sub">Addie's Music Stage</div>
  <p>Step 1: Compose your song by tapping the note buttons!</p>
  <p>Step 2: Perform it back from memory for the judges!</p>
  <p>The judges score your rhythm, accuracy, and style!</p>
  <button id="playBtn">HIT THE STAGE!</button>
</div>
<div id="hud">
  <div id="phaseDisplay">🎵 Compose Mode</div>
  <div id="timerDisplay"></div>
  <div id="scoreDisplay"></div>
</div>
<div id="noteGrid"></div>
<div id="recordBtn">🎤 PERFORM!</div>
<div id="judgeScreen">
  <h1 id="judgeTitle">The Judges Say...</h1>
  <div id="judges"></div>
  <div id="totalScore"></div>
  <button id="replayBtn">Try Again!</button>
</div>
<canvas id="c"></canvas>
<script>
// === AUDIO ===
const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume()}

// Musical notes with real frequencies
const NOTES=[
  {name:'C',freq:523.25,color:'#ef4444',emoji:'🔴'},
  {name:'D',freq:587.33,color:'#f59e0b',emoji:'🟡'},
  {name:'E',freq:659.25,color:'#10b981',emoji:'🟢'},
  {name:'F',freq:698.46,color:'#06b6d4',emoji:'🔵'},
  {name:'G',freq:783.99,color:'#7c3aed',emoji:'🟣'},
  {name:'A',freq:880.00,color:'#ec4899',emoji:'🩷'},
  {name:'B',freq:987.77,color:'#f97316',emoji:'🟠'},
  {name:'C2',freq:1046.50,color:'#fbbf24',emoji:'⭐'}
];

function playNote(noteIdx,duration=0.3){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;const note=NOTES[noteIdx];
  const m=audioCtx.createGain();m.connect(audioCtx.destination);
  // Main tone
  const o=audioCtx.createOscillator();const g=audioCtx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(note.freq,t);
  g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+duration);
  o.connect(g);g.connect(m);o.start(t);o.stop(t+duration);
  // Harmonic
  const o2=audioCtx.createOscillator();const g2=audioCtx.createGain();
  o2.type='sine';o2.frequency.setValueAtTime(note.freq*2,t);
  g2.gain.setValueAtTime(0.05,t);g2.gain.exponentialRampToValueAtTime(0.001,t+duration*0.7);
  o2.connect(g2);g2.connect(m);o2.start(t);o2.stop(t+duration*0.7);
  m.gain.setValueAtTime(0.6,t);
}

function playSound(type){
  if(!audioCtx)return;const t=audioCtx.currentTime;const m=audioCtx.createGain();m.connect(audioCtx.destination);
  if(type==='correct'){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sine';
    o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.1);
    g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g);g.connect(m);o.start(t);o.stop(t+0.15);
  } else if(type==='wrong'){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(80,t+0.3);
    g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g);g.connect(m);o.start(t);o.stop(t+0.3);
  } else if(type==='cheer'){
    const notes=[523,659,784,1047,1319];
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator();const g=audioCtx.createGain();
      o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.1);
      g.gain.linearRampToValueAtTime(0.1,t+i*0.1+0.03);g.gain.linearRampToValueAtTime(0,t+i*0.1+0.4);
      o.connect(g);g.connect(m);o.start(t+i*0.1);o.stop(t+i*0.1+0.4);});
    m.gain.setValueAtTime(0.6,t);
  } else if(type==='drumroll'){
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*1.5,audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){const env=Math.min(1,i/(d.length*0.7));d[i]=(Math.random()*2-1)*0.3*env}
    const ns=audioCtx.createBufferSource();ns.buffer=buf;
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.08,t);
    ns.connect(g);g.connect(m);ns.start(t);ns.stop(t+1.5);
  }
}

let ambientOn=false;
function startAmbient(){
  if(ambientOn||!audioCtx)return;ambientOn=true;
  // Crowd murmur
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const ns=audioCtx.createBufferSource();ns.buffer=buf;ns.loop=true;
  const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=400;f.Q.value=0.5;
  const g=audioCtx.createGain();g.gain.value=0.015;
  ns.connect(f);f.connect(g);g.connect(audioCtx.destination);ns.start();
}

// === CANVAS ===
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
let W,H;function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H}
resize();window.addEventListener('resize',resize);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// === GAME STATE ===
let phase='idle'; // idle, compose, perform, judging
let composedSong=[]; // Array of {noteIdx, time}
let performedSong=[];
let composeStart=0,performStart=0;
let maxComposeTime=15000; // 15 seconds
let gameRunning=false;
let particles=[];let floatingTexts=[];let tick=0;let camShake=0;
let spotlights=[];let stageNotes=[];let crowdWave=0;
let roundNumber=0;let totalGameScore=0;
let currentPerformIdx=0;
let performTimings=[];

// Stage visuals
let bgStars=[];
function initStars(){bgStars=[];for(let i=0;i<60;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H*0.4,size:1+Math.random()*2,blink:Math.random()*Math.PI*2})}

function initSpotlights(){
  spotlights=[];
  for(let i=0;i<5;i++){
    spotlights.push({x:W*(0.1+i*0.2),y:0,targetX:W/2,color:`hsla(${Math.random()*360},80%,60%,0.06)`,
      speed:0.5+Math.random(),phase:Math.random()*Math.PI*2});
  }
}

// Particles
function addParticle(x,y,type,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    let life,r,g,b,sz;
    if(type==='note'){life=40+Math.random()*30;const c=NOTES[Math.floor(Math.random()*8)];const rgb=hexToRgb(c.color);r=rgb.r;g=rgb.g;b=rgb.b;sz=4+Math.random()*5}
    else if(type==='sparkle'){life=20+Math.random()*15;r=255;g=215;b=0;sz=2+Math.random()*3}
    else if(type==='confetti'){life=80+Math.random()*40;const cs=[[255,100,180],[255,200,50],[100,255,150],[100,200,255],[180,100,255]];const cc=cs[Math.floor(Math.random()*cs.length)];r=cc[0];g=cc[1];b=cc[2];sz=3+Math.random()*5}
    else if(type==='heart'){life=50+Math.random()*30;r=236;g=72;b=153;sz=5+Math.random()*5}
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life,maxLife:life,r,g,b,size:sz,type});
  }
}
function hexToRgb(hex){const rr=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),bb=parseInt(hex.slice(5,7),16);return{r:rr,g:gg,b:bb}}
function updateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;p.vx*=0.98;p.life--});particles=particles.filter(p=>p.life>0)}
function addFloat(x,y,text,color,size){floatingTexts.push({x,y,text,color,size,life:50,maxLife:50})}
function updateFloats(){floatingTexts.forEach(f=>{f.y-=1.5;f.life--});floatingTexts=floatingTexts.filter(f=>f.life>0)}

// Floating music notes visual
function addStageNote(x,y,noteIdx){
  stageNotes.push({x,y,noteIdx,life:80,maxLife:80,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*2});
}
function updateStageNotes(){stageNotes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;n.vx*=0.99;n.life--});stageNotes=stageNotes.filter(n=>n.life>0)}

// === DRAW ===
function drawBg(){
  // Dark stage background with gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a0418');grad.addColorStop(0.4,'#1a0a2e');grad.addColorStop(1,'#2a1040');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // Stars
  bgStars.forEach(s=>{s.blink+=0.03;ctx.globalAlpha=0.3+Math.sin(s.blink)*0.3;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;

  // Stage floor
  ctx.fillStyle='#1a1030';
  ctx.beginPath();ctx.moveTo(0,H*0.65);ctx.lineTo(W,H*0.65);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  // Stage edge shine
  const edgeGrad=ctx.createLinearGradient(0,H*0.63,0,H*0.68);
  edgeGrad.addColorStop(0,'rgba(236,72,153,0.3)');edgeGrad.addColorStop(1,'rgba(236,72,153,0)');
  ctx.fillStyle=edgeGrad;ctx.fillRect(0,H*0.63,W,H*0.05);
  // Floor tiles
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,H*0.65);ctx.lineTo(x,H);ctx.stroke()}

  // Spotlights
  spotlights.forEach(s=>{
    s.phase+=0.01*s.speed;
    s.targetX=W/2+Math.sin(s.phase)*W*0.3;
    ctx.beginPath();ctx.moveTo(s.x,0);
    ctx.lineTo(s.targetX-80,H*0.65);ctx.lineTo(s.targetX+80,H*0.65);ctx.closePath();
    ctx.fillStyle=s.color;ctx.fill();
  });

  // Crowd (bottom)
  const crowdY=H*0.85;
  for(let x=0;x<W;x+=20){
    const bobY=Math.sin(x*0.05+tick*0.03+crowdWave)*5;
    ctx.fillStyle=`hsl(${(x*2+tick)%360},30%,30%)`;
    ctx.beginPath();ctx.arc(x,crowdY+bobY,10,0,Math.PI*2);ctx.fill();
    // Head
    ctx.fillStyle=`hsl(${(x*2+tick)%360},20%,60%)`;
    ctx.beginPath();ctx.arc(x,crowdY-8+bobY,6,0,Math.PI*2);ctx.fill();
  }
  crowdWave+=0.02;

  // Microphone stand center stage
  const micX=W/2,micY=H*0.45;
  ctx.strokeStyle='#888';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(micX,micY);ctx.lineTo(micX,H*0.65);ctx.stroke();
  // Mic head
  ctx.fillStyle='#444';ctx.beginPath();ctx.arc(micX,micY,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(micX,micY,5,0,Math.PI*2);ctx.fill();
  // Mic glow when performing
  if(phase==='perform'){
    ctx.fillStyle=`rgba(236,72,153,${0.2+Math.sin(tick*0.1)*0.1})`;
    ctx.beginPath();ctx.arc(micX,micY,15+Math.sin(tick*0.15)*5,0,Math.PI*2);ctx.fill();
  }
}

function drawStageNotes(){
  stageNotes.forEach(n=>{
    const lr=n.life/n.maxLife;ctx.globalAlpha=lr;
    const note=NOTES[n.noteIdx];
    ctx.font=`${20+lr*10}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('♪',n.x,n.y);
    ctx.fillStyle=note.color;ctx.beginPath();ctx.arc(n.x,n.y+5,4*lr,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;
}

function drawComposedVisualization(){
  if(composedSong.length===0)return;
  // Show composed notes as a timeline at mid-screen
  const barY=H*0.35;const barW=W*0.8;const barX=(W-barW)/2;
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(barX-5,barY-25,barW+10,50);
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.strokeRect(barX-5,barY-25,barW+10,50);

  const maxTime=phase==='compose'?maxComposeTime:composedSong[composedSong.length-1].time+500;
  composedSong.forEach((n,i)=>{
    const x=barX+(n.time/maxTime)*barW;
    const note=NOTES[n.noteIdx];
    const highlight=phase==='perform'&&i<currentPerformIdx;
    ctx.fillStyle=highlight?'rgba(255,255,255,0.5)':note.color;
    ctx.globalAlpha=highlight?0.4:0.8;
    ctx.beginPath();ctx.arc(x,barY,8,0,Math.PI*2);ctx.fill();
    ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(note.name,x,barY+20);
  });
  ctx.globalAlpha=1;

  // Playhead during perform
  if(phase==='perform'){
    const elapsed=Date.now()-performStart;
    const x=barX+(elapsed/maxTime)*barW;
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,barY-25);ctx.lineTo(x,barY+25);ctx.stroke();
  }
}

function drawParticlesFn(){
  particles.forEach(p=>{const lr=p.life/p.maxLife;ctx.globalAlpha=lr;
    if(p.type==='heart'){
      ctx.font=`${p.size*2}px sans-serif`;ctx.textAlign='center';ctx.fillText('♥',p.x,p.y);
    }else{
      ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*lr,0,Math.PI*2);ctx.fill();
    }});
  ctx.globalAlpha=1;
}
function drawFloatsFn(){
  floatingTexts.forEach(f=>{ctx.globalAlpha=f.life/f.maxLife;ctx.font=`bold ${f.size}px sans-serif`;
    ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y)});ctx.globalAlpha=1;
}

// === NOTE BUTTONS ===
function setupNoteGrid(){
  const grid=document.getElementById('noteGrid');
  grid.innerHTML='';grid.style.display='flex';
  NOTES.forEach((note,i)=>{
    const btn=document.createElement('div');
    btn.className='noteBtn';
    btn.style.background=note.color+'33';btn.style.borderColor=note.color;
    btn.innerHTML=`<div style="text-align:center"><div>${note.emoji}</div><div style="font-size:0.6rem;color:#fff">${note.name}</div></div>`;
    btn.addEventListener('pointerdown',e=>{e.preventDefault();handleNoteTap(i)});
    grid.appendChild(btn);
  });
}

function handleNoteTap(noteIdx){
  ensureAudio();
  playNote(noteIdx,0.4);
  addStageNote(W/2+(Math.random()-0.5)*100,H*0.4,noteIdx);
  addParticle(W/2,H*0.4,'note',5);
  camShake=3;

  const note=NOTES[noteIdx];
  if(phase==='compose'){
    const time=Date.now()-composeStart;
    composedSong.push({noteIdx,time});
    addFloat(W/2,H*0.3,note.name,note.color,24);
  } else if(phase==='perform'){
    const time=Date.now()-performStart;
    performedSong.push({noteIdx,time});
    // Check accuracy against composed song
    if(currentPerformIdx<composedSong.length){
      const expected=composedSong[currentPerformIdx];
      const correct=expected.noteIdx===noteIdx;
      const timeDiff=Math.abs(time-expected.time);
      if(correct&&timeDiff<1500){
        addFloat(W/2,H*0.3,'✓ Perfect!','#10b981',22);
        playSound('correct');addParticle(W/2,H*0.4,'sparkle',10);
      }else if(correct){
        addFloat(W/2,H*0.3,'✓ Good!','#f59e0b',20);
      }else{
        addFloat(W/2,H*0.3,'✗ Wrong!','#ef4444',20);
        playSound('wrong');
      }
      performTimings.push({expected:expected.noteIdx,actual:noteIdx,timeDiff,correct});
      currentPerformIdx++;
      if(currentPerformIdx>=composedSong.length){
        setTimeout(startJudging,1000);
      }
    }
  }
}

// === PHASES ===
function startCompose(){
  phase='compose';composedSong=[];composeStart=Date.now();
  document.getElementById('phaseDisplay').textContent='🎵 Compose Your Song!';
  document.getElementById('recordBtn').style.display='block';
  document.getElementById('recordBtn').textContent='🎤 DONE - PERFORM!';
  setupNoteGrid();
  // Auto-end compose after time limit
  const checkTimer=setInterval(()=>{
    if(phase!=='compose'){clearInterval(checkTimer);return}
    const elapsed=Date.now()-composeStart;
    const remaining=Math.max(0,Math.ceil((maxComposeTime-elapsed)/1000));
    document.getElementById('timerDisplay').textContent='Time: '+remaining+'s';
    if(elapsed>=maxComposeTime){
      clearInterval(checkTimer);
      if(composedSong.length>=3)startPerform();
      else{document.getElementById('timerDisplay').textContent='Add at least 3 notes!';composeStart=Date.now()}
    }
  },100);
}

function startPerform(){
  if(composedSong.length<3){addFloat(W/2,H/3,'Need 3+ notes!','#ef4444',24);return}
  phase='perform';performedSong=[];performStart=Date.now();performTimings=[];currentPerformIdx=0;
  document.getElementById('phaseDisplay').textContent='🎤 Perform Your Song!';
  document.getElementById('recordBtn').style.display='none';
  document.getElementById('timerDisplay').textContent='Play your song back!';
  addFloat(W/2,H/3,'🎤 GO!','#ec4899',32);
  addParticle(W/2,H/3,'heart',15);
  // Auto-end after 2x compose time
  const maxPerform=(composedSong[composedSong.length-1].time+5000);
  setTimeout(()=>{if(phase==='perform')startJudging()},maxPerform);
}

function startJudging(){
  phase='judging';
  document.getElementById('noteGrid').style.display='none';
  document.getElementById('recordBtn').style.display='none';
  playSound('drumroll');

  // Calculate scores
  let accuracyScore=0,rhythmScore=0,styleScore=0;
  if(performTimings.length>0){
    const correctCount=performTimings.filter(t=>t.correct).length;
    accuracyScore=Math.round((correctCount/composedSong.length)*100);
    const avgTimeDiff=performTimings.reduce((s,t)=>s+t.timeDiff,0)/performTimings.length;
    rhythmScore=Math.max(0,Math.round(100-avgTimeDiff/20));
    // Style: variety of notes used + completeness
    const uniqueNotes=new Set(performedSong.map(n=>n.noteIdx)).size;
    const variety=Math.min(100,uniqueNotes*15);
    const completeness=Math.min(100,Math.round((performedSong.length/composedSong.length)*100));
    styleScore=Math.round((variety+completeness)/2);
  }

  // Clamp scores
  accuracyScore=Math.max(0,Math.min(100,accuracyScore));
  rhythmScore=Math.max(0,Math.min(100,rhythmScore));
  styleScore=Math.max(0,Math.min(100,styleScore));

  setTimeout(()=>{
    const judgeData=[
      {name:'Simon',emoji:'😎',aspect:'Accuracy',score:accuracyScore,color:'#ef4444'},
      {name:'Katy',emoji:'🌟',aspect:'Rhythm',score:rhythmScore,color:'#ec4899'},
      {name:'Bruno',emoji:'🎵',aspect:'Style',score:styleScore,color:'#f59e0b'}
    ];
    const total=Math.round((accuracyScore+rhythmScore+styleScore)/3);
    totalGameScore+=total;roundNumber++;

    const container=document.getElementById('judges');container.innerHTML='';
    judgeData.forEach(j=>{
      const div=document.createElement('div');div.className='judge';
      div.innerHTML=`<div class="emoji">${j.emoji}</div><div class="name">${j.name}</div><div class="score" style="color:${j.color}">${j.score}/100</div><div style="color:#a0a0c0;font-size:0.75rem">${j.aspect}</div>`;
      container.appendChild(div);
    });

    const titleText=total>=80?'⭐ AMAZING! ⭐':total>=60?'👏 Great Job!':total>=40?'👍 Not Bad!':'💪 Keep Trying!';
    document.getElementById('judgeTitle').textContent=titleText;
    document.getElementById('totalScore').textContent=`Overall: ${total}/100 | Round ${roundNumber} Total: ${totalGameScore}`;
    document.getElementById('judgeScreen').style.display='flex';
    document.getElementById('hud').style.display='none';

    if(total>=60){playSound('cheer');addParticle(W/2,H/3,'confetti',40)}
    camShake=10;
  },1500);
}

// === MAIN LOOP ===
function loop(){
  try{
    tick++;camShake*=0.92;
    updateParticles();updateFloats();updateStageNotes();
    const sx=(Math.random()-0.5)*camShake;const sy=(Math.random()-0.5)*camShake;
    ctx.save();ctx.translate(sx,sy);
    drawBg();drawStageNotes();drawComposedVisualization();drawParticlesFn();drawFloatsFn();
    ctx.restore();
  }catch(e){console.error(e)}
  requestAnimationFrame(loop);
}

// === START ===
function startGame(){
  ensureAudio();startAmbient();resize();
  initStars();initSpotlights();
  roundNumber=0;totalGameScore=0;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('judgeScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  startCompose();
}

document.getElementById('playBtn').onclick=startGame;
document.getElementById('recordBtn').onclick=()=>{if(phase==='compose')startPerform()};
document.getElementById('replayBtn').onclick=()=>{
  document.getElementById('judgeScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  startCompose();
};

initStars();initSpotlights();
requestAnimationFrame(loop);
</script>
</body>
