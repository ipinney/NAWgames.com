<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Island Attack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { font-family: 'Arial', sans-serif; background: #87CEEB; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    #gameContainer { position: relative; width: 100%; height: 100%; }
    canvas { display: block; background: #87CEEB; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud { position: absolute; pointer-events: auto; z-index: 100; font-weight: bold; }
    #topBar { top: 10px; left: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    #resources { display: flex; gap: 20px; }
    .resource { display: flex; align-items: center; gap: 5px; }
    .resource span:first-child { font-size: 16px; }
    #waveInfo { text-align: center; flex: 1; }
    #population { text-align: right; }
    #buildBar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 8px; display: flex; gap: 8px; justify-content: center; }
    .buildBtn { width: 56px; height: 56px; background: #4CAF50; border: 2px solid #2E7D32; border-radius: 6px; color: white; font-size: 10px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; }
    .buildBtn:hover { background: #66BB6A; transform: scale(1.05); }
    .buildBtn:active { transform: scale(0.95); }
    .buildBtn.active { border-color: #FFD700; box-shadow: 0 0 10px #FFD700; }
    .buildIcon { font-size: 24px; line-height: 1; }
    .buildName { font-size: 9px; margin-top: 2px; }
    #tutorial { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: #FFEB3B; border: 3px solid #FBC02D; border-radius: 8px; padding: 12px 16px; max-width: 300px; text-align: center; font-weight: bold; color: #333; display: none; pointer-events: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
    #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; pointer-events: auto; }
    #startScreen.hidden { display: none; pointer-events: none; }
    .startContent { text-align: center; color: white; }
    .startContent h1 { font-size: 64px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); }
    .startContent h2 { font-size: 28px; margin-bottom: 40px; font-weight: normal; opacity: 0.9; }
    #playBtn { background: #4CAF50; border: none; color: white; padding: 20px 60px; font-size: 32px; font-weight: bold; border-radius: 15px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); }
    #playBtn:hover { background: #66BB6A; transform: scale(1.05); }
    #playBtn:active { transform: scale(0.95); }
    #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; pointer-events: auto; }
    #gameOverScreen.show { display: flex; }
    .gameOverContent { text-align: center; color: white; background: rgba(0, 0, 0, 0.7); padding: 40px; border-radius: 15px; max-width: 400px; }
    .gameOverContent h1 { font-size: 48px; margin-bottom: 20px; }
    .statsBox { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 18px; }
    .statsBox p { margin: 8px 0; }
    .stars { font-size: 48px; margin: 20px 0; }
    #playAgainBtn { background: #4CAF50; border: none; color: white; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    #playAgainBtn:hover { background: #66BB6A; transform: scale(1.05); }
    #upgradePopup { position: absolute; background: rgba(0, 0, 0, 0.9); border: 3px solid #FFD700; border-radius: 10px; padding: 15px; display: none; z-index: 150; pointer-events: auto; min-width: 200px; color: white; font-size: 14px; }
    #upgradePopup.show { display: block; }
    .upgradePopup h3 { margin-bottom: 10px; color: #FFD700; }
    .upgradePopup p { margin: 8px 0; font-size: 12px; }
    .upgradeBtn { background: #4CAF50; border: none; color: white; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: all 0.2s; }
    .upgradeBtn:hover { background: #66BB6A; }
    .upgradeBtn:disabled { background: #888; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="c"></canvas>
    <div id="startScreen">
      <div class="startContent">
        <h1>ISLAND ATTACK</h1>
        <h2>Build • Defend • Survive!</h2>
        <button id="playBtn">PLAY</button>
      </div>
    </div>
    <div id="topBar" class="hud">
      <div id="resources">
        <div class="resource"><span>🪵</span><span id="resWood">200</span></div>
        <div class="resource"><span>🪨</span><span id="resStone">100</span></div>
        <div class="resource"><span>🌾</span><span id="resFood">50</span></div>
        <div class="resource"><span>💰</span><span id="resGold">0</span></div>
      </div>
      <div id="waveInfo">---</div>
      <div id="population">👤 0</div>
    </div>
    <div id="buildBar" class="hud">
      <button class="buildBtn" data-type="farm"><div class="buildIcon">🌾</div><div class="buildName">Farm</div></button>
      <button class="buildBtn" data-type="tower"><div class="buildIcon">🗼</div><div class="buildName">Tower</div></button>
      <button class="buildBtn" data-type="wall"><div class="buildIcon">🧱</div><div class="buildName">Wall</div></button>
      <button class="buildBtn" data-type="house"><div class="buildIcon">🏠</div><div class="buildName">House</div></button>
      <button class="buildBtn" data-type="tree"><div class="buildIcon">🌳</div><div class="buildName">Gather</div></button>
    </div>
    <div id="tutorial" class="hud"></div>
    <div id="upgradePopup" class="hud"></div>
    <div id="gameOverScreen">
      <div class="gameOverContent">
        <h1 id="gameOverTitle">Game Over!</h1>
        <div class="statsBox">
          <p>Wave: <span id="statWave">1</span></p>
          <p>Gold Collected: <span id="statGold">0</span></p>
          <p>Buildings Built: <span id="statBuildings">0</span></p>
        </div>
        <div class="stars" id="starRating">⭐</div>
        <button id="playAgainBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const TILE = 22;
    const MAP_WIDTH = 36;
    const MAP_HEIGHT = 26;

    let gameState = {
      screen: 'start',
      resources: { wood: 200, stone: 100, food: 50, gold: 0 },
      buildings: [],
      invaders: [],
      particles: [],
      floatingText: [],
      wave: 1,
      waveCountdown: 0,
      populationCount: 0,
      buildingCount: 0,
      goldCollected: 0,
      selectedBuildType: null,
      cameraX: 0,
      cameraY: 0,
      tutorial: { step: 0, active: true, timer: 0 },
      lastTime: performance.now(),
      castleHealth: 100,
    };

    const TILE_TYPES = { WATER: 0, SAND: 1, GRASS: 2, ROAD: 3, CASTLE: 4 };

    let tileMap = [];
    function initMap() {
      tileMap = Array(MAP_HEIGHT).fill(null).map(() => Array(MAP_WIDTH).fill(TILE_TYPES.WATER));
      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          const distFromEdge = Math.min(x, y, MAP_WIDTH - 1 - x, MAP_HEIGHT - 1 - y);
          if (distFromEdge === 1) tileMap[y][x] = TILE_TYPES.SAND;
          if (distFromEdge >= 2) tileMap[y][x] = TILE_TYPES.GRASS;
        }
      }
      for (let x = 16; x < 20; x++) {
        for (let y = 2; y < 12; y++) tileMap[y][x] = TILE_TYPES.ROAD;
      }
      for (let x = 16; x < 20; x++) {
        for (let y = 14; y < 24; y++) tileMap[y][x] = TILE_TYPES.ROAD;
      }
      for (let y = 10; y < 14; y++) {
        for (let x = 2; x < 16; x++) tileMap[y][x] = TILE_TYPES.ROAD;
      }
      tileMap[12][17] = TILE_TYPES.CASTLE;
      tileMap[12][18] = TILE_TYPES.CASTLE;
      tileMap[13][17] = TILE_TYPES.CASTLE;
      tileMap[13][18] = TILE_TYPES.CASTLE;
      const decorations = [];
      for (let i = 0; i < 12; i++) {
        let x, y, valid;
        do {
          x = 5 + Math.floor(Math.random() * 25);
          y = 5 + Math.floor(Math.random() * 16);
          valid = tileMap[y][x] === TILE_TYPES.GRASS && !decorations.some(d => d.x === x && d.y === y);
        } while (!valid);
        decorations.push({ x, y, type: 'tree', regrowTimer: 0 });
      }
      for (let i = 0; i < 8; i++) {
        let x, y, valid;
        do {
          x = 5 + Math.floor(Math.random() * 25);
          y = 5 + Math.floor(Math.random() * 16);
          valid = tileMap[y][x] === TILE_TYPES.GRASS && !decorations.some(d => d.x === x && d.y === y);
        } while (!valid);
        decorations.push({ x, y, type: 'rock', regrowTimer: 0 });
      }
      return decorations;
    }

    let decorations = initMap();

    const BUILDING_STATS = {
      farm: { cost: { wood: 30, stone: 20, food: 0 }, levels: [
        { range: 0, damage: 0, fireRate: 5, health: 50, productionRate: 0.2 },
        { range: 0, damage: 0, fireRate: 5, health: 75, productionRate: 0.3 },
        { range: 0, damage: 0, fireRate: 5, health: 100, productionRate: 0.4 },
      ]},
      tower: { cost: { wood: 40, stone: 60, food: 0 }, levels: [
        { range: 4, damage: 10, fireRate: 2, health: 80, productionRate: 0 },
        { range: 6, damage: 15, fireRate: 1.5, health: 120, productionRate: 0 },
        { range: 8, damage: 25, fireRate: 1, health: 160, productionRate: 0 },
      ]},
      wall: { cost: { wood: 20, stone: 30, food: 0 }, levels: [
        { range: 0, damage: 0, fireRate: 0, health: 100, productionRate: 0 },
        { range: 0, damage: 0, fireRate: 0, health: 150, productionRate: 0 },
        { range: 0, damage: 0, fireRate: 0, health: 200, productionRate: 0 },
      ]},
      house: { cost: { wood: 35, stone: 25, food: 10 }, levels: [
        { range: 0, damage: 0, fireRate: 0, health: 60, populationGain: 3, productionRate: 0 },
        { range: 0, damage: 0, fireRate: 0, health: 90, populationGain: 5, productionRate: 0 },
        { range: 0, damage: 0, fireRate: 0, health: 120, populationGain: 8, productionRate: 0 },
      ]},
    };

    function canPlaceBuilding(x, y, type) {
      if (x < 0 || y < 0 || x >= MAP_WIDTH || y >= MAP_HEIGHT) return false;
      const tile = tileMap[y][x];
      if (tile === TILE_TYPES.WATER || tile === TILE_TYPES.SAND || tile === TILE_TYPES.CASTLE) return false;
      if (type !== 'wall' && tile === TILE_TYPES.ROAD) return false;
      if (gameState.buildings.some(b => b.x === x && b.y === y)) return false;
      return true;
    }

    function placeBuilding(x, y, type) {
      if (!canPlaceBuilding(x, y, type)) return false;
      const cost = BUILDING_STATS[type].cost;
      if (gameState.resources.wood < cost.wood || gameState.resources.stone < cost.stone || gameState.resources.food < cost.food) return false;
      gameState.resources.wood -= cost.wood;
      gameState.resources.stone -= cost.stone;
      gameState.resources.food -= cost.food;
      const building = { x, y, type, level: 1, health: BUILDING_STATS[type].levels[0].health, fireTimer: 0, productionTimer: 0, id: Math.random() };
      gameState.buildings.push(building);
      gameState.buildingCount++;
      playSound('build');
      return true;
    }

    function upgradeBuilding(building) {
      if (building.level >= 3) return false;
      const cost = BUILDING_STATS[building.type].cost;
      if (gameState.resources.wood < cost.wood || gameState.resources.stone < cost.stone || gameState.resources.food < cost.food) return false;
      gameState.resources.wood -= cost.wood;
      gameState.resources.stone -= cost.stone;
      gameState.resources.food -= cost.food;
      building.level++;
      const stats = BUILDING_STATS[building.type].levels[building.level - 1];
      building.health = stats.health;
      playSound('build');
      return true;
    }

    const INVADER_TYPES = {
      raider: { health: 30, speed: 40, size: 8, damage: 5, goldDrop: 10, color: '#CC0000' },
      archer: { health: 25, speed: 45, size: 7, damage: 3, goldDrop: 15, color: '#3D2817' },
      siege: { health: 60, speed: 25, size: 12, damage: 15, goldDrop: 30, color: '#888888' },
      boss: { health: 150, speed: 20, size: 16, damage: 20, goldDrop: 100, color: '#FF0000' },
    };

    const ROAD_TILES = [];
    function initRoads() {
      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          if (tileMap[y][x] === TILE_TYPES.ROAD) ROAD_TILES.push({ x, y });
        }
      }
    }
    initRoads();

    function spawnInvaders(types) {
      const spawnPoints = [{ x: 17, y: 1 }, { x: 18, y: 24 }, { x: 1, y: 11 }];
      types.forEach((type, i) => {
        const spawn = spawnPoints[i % spawnPoints.length];
        const invader = { type, x: spawn.x, y: spawn.y, pathIndex: 0, health: INVADER_TYPES[type].health, id: Math.random() };
        gameState.invaders.push(invader);
      });
    }

    function getInvaderPath() {
      return ROAD_TILES.filter(t => Math.abs(t.x - 17) + Math.abs(t.y - 12) > 0).sort((a, b) => {
        const da = Math.abs(a.x - 17) + Math.abs(a.y - 12);
        const db = Math.abs(b.x - 17) + Math.abs(b.y - 12);
        return da - db;
      });
    }

    function fireArrow(tower, target) {
      gameState.particles.push({
        type: 'arrow',
        startX: tower.x,
        startY: tower.y,
        endX: target.x,
        endY: target.y,
        progress: 0,
        damage: BUILDING_STATS[tower.type].levels[tower.level - 1].damage,
        targetId: target.id,
      });
      playSound('shoot');
    }

    const TUTORIAL_STEPS = [
      { text: "Welcome! This is your castle. Protect it!", autoAdvance: 4, condition: () => true },
      { text: "Tap FARM below, then tap grass to build.", autoAdvance: null, condition: () => gameState.buildings.some(b => b.type === 'farm') },
      { text: "Farms make food! Now tap TOWER.", autoAdvance: null, condition: () => gameState.buildings.some(b => b.type === 'tower') },
      { text: "Towers shoot arrows! Build WALLS on roads.", autoAdvance: null, condition: () => gameState.buildings.some(b => b.type === 'wall') },
      { text: "Build a HOUSE for more villagers.", autoAdvance: null, condition: () => gameState.buildings.some(b => b.type === 'house') },
      { text: "Great! First invaders in 60 seconds. Keep building!", autoAdvance: 3, condition: () => true },
    ];

    function updateTutorial(dt) {
      if (!gameState.tutorial.active) return;
      const step = TUTORIAL_STEPS[gameState.tutorial.step];
      if (!step) { gameState.tutorial.active = false; return; }
      if (step.autoAdvance) {
        gameState.tutorial.timer += dt;
        if (gameState.tutorial.timer >= step.autoAdvance) { gameState.tutorial.step++; gameState.tutorial.timer = 0; }
      } else {
        if (step.condition()) { gameState.tutorial.step++; gameState.tutorial.timer = 0; }
      }
      const tutorialEl = document.getElementById('tutorial');
      tutorialEl.textContent = step.text;
      tutorialEl.style.display = 'block';
    }

    const WAVE_SPAWNS = [
      [{ type: 'raider', count: 3 }],
      [{ type: 'raider', count: 5 }],
      [{ type: 'raider', count: 4 }, { type: 'archer', count: 2 }],
      [{ type: 'raider', count: 6 }, { type: 'archer', count: 3 }],
      [{ type: 'raider', count: 8 }, { type: 'archer', count: 4 }, { type: 'siege', count: 1 }],
      [{ type: 'raider', count: 10 }, { type: 'archer', count: 5 }, { type: 'siege', count: 2 }],
      [{ type: 'raider', count: 12 }, { type: 'archer', count: 6 }, { type: 'siege', count: 3 }],
      [{ type: 'raider', count: 14 }, { type: 'archer', count: 7 }, { type: 'siege', count: 4 }],
      [{ type: 'raider', count: 16 }, { type: 'archer', count: 8 }, { type: 'siege', count: 5 }],
      [{ type: 'raider', count: 18 }, { type: 'archer', count: 9 }, { type: 'siege', count: 6 }, { type: 'boss', count: 1 }],
    ];

    function startWave() {
      const spawn = gameState.wave > WAVE_SPAWNS.length ? WAVE_SPAWNS[WAVE_SPAWNS.length - 1] : WAVE_SPAWNS[gameState.wave - 1];
      const invaders = [];
      spawn.forEach(s => { for (let i = 0; i < s.count; i++) invaders.push(s.type); });
      spawnInvaders(invaders);
      playSound('horn');
    }

    function getWaveBreakTime() {
      let timing = 60 - (gameState.wave - 1) * 3;
      return Math.max(30, timing);
    }

    function updateGame(dt) {
      try {
        if (gameState.tutorial.active) updateTutorial(dt);
        if (gameState.waveCountdown > 0) {
          gameState.waveCountdown -= dt;
          if (gameState.waveCountdown <= 0 && !gameState.tutorial.active) { startWave(); gameState.waveCountdown = 0; }
        } else if (gameState.invaders.length === 0 && gameState.screen === 'playing' && !gameState.tutorial.active) {
          gameState.wave++;
          gameState.waveCountdown = getWaveBreakTime();
        }

        gameState.buildings.forEach(building => {
          const stats = BUILDING_STATS[building.type].levels[building.level - 1];
          if (building.type === 'farm') {
            building.productionTimer -= dt;
            if (building.productionTimer <= 0) {
              const production = stats.productionRate * 10;
              gameState.resources.food += production;
              building.productionTimer = 1;
            }
          }
          if (building.type === 'tower' && stats.range > 0) {
            building.fireTimer -= dt;
            if (building.fireTimer <= 0) {
              const nearest = gameState.invaders.reduce((closest, inv) => {
                const dist = Math.hypot(inv.x - building.x, inv.y - building.y);
                if (dist <= stats.range) {
                  if (!closest || dist < Math.hypot(closest.x - building.x, closest.y - building.y)) return inv;
                }
                return closest;
              }, null);
              if (nearest) { fireArrow(building, nearest); building.fireTimer = stats.fireRate; }
            }
          }
        });

        gameState.invaders = gameState.invaders.filter(inv => inv.health > 0);
        gameState.invaders.forEach(inv => {
          const stats = INVADER_TYPES[inv.type];
          const moveDistance = stats.speed * dt;
          let targetTile = { x: 17, y: 12 };
          const path = getInvaderPath();
          if (path.length > 0) {
            const closest = path.reduce((c, t) => {
              const d = Math.hypot(t.x - inv.x, t.y - inv.y);
              const cd = Math.hypot(c.x - inv.x, c.y - inv.y);
              return d < cd ? t : c;
            });
            targetTile = closest;
          }
          const dist = Math.hypot(targetTile.x - inv.x, targetTile.y - inv.y);
          if (dist > 0.5) { inv.x += (targetTile.x - inv.x) / dist * moveDistance; inv.y += (targetTile.y - inv.y) / dist * moveDistance; }
          if (Math.hypot(inv.x - 17.5, inv.y - 12.5) < 1) {
            gameState.castleHealth -= stats.damage;
            inv.health = 0;
            if (gameState.castleHealth <= 0) endGame();
          }
        });

        gameState.particles = gameState.particles.filter(p => {
          if (p.type === 'arrow') {
            p.progress += dt / 0.8;
            if (p.progress >= 1) {
              const target = gameState.invaders.find(i => i.id === p.targetId);
              if (target) {
                target.health -= p.damage;
                if (target.health <= 0) {
                  gameState.resources.gold += INVADER_TYPES[target.type].goldDrop;
                  gameState.goldCollected += INVADER_TYPES[target.type].goldDrop;
                  for (let i = 0; i < 10; i++) {
                    gameState.particles.push({ type: 'fire', x: target.x, y: target.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200 - 100, life: 0.5 });
                  }
                  for (let i = 0; i < 5; i++) {
                    gameState.particles.push({ type: 'coin', x: target.x, y: target.y, vx: (Math.random() - 0.5) * 100, vy: Math.random() * -100 - 50, life: 1 });
                  }
                  gameState.floatingText.push({ text: '+' + INVADER_TYPES[target.type].goldDrop, x: target.x, y: target.y, life: 1.5 });
                  playSound('hit');
                }
              }
              return false;
            }
            return true;
          }
          if (p.type === 'fire' || p.type === 'coin') {
            p.life -= dt;
            p.vy += 300 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            return p.life > 0;
          }
          return true;
        });

        gameState.floatingText = gameState.floatingText.filter(t => { t.life -= dt; t.y -= 50 * dt; return t.life > 0; });

        let housePop = 0;
        gameState.buildings.forEach(b => {
          if (b.type === 'house') {
            const stats = BUILDING_STATS[b.type].levels[b.level - 1];
            housePop += stats.populationGain;
          }
        });
        gameState.populationCount = housePop;

        decorations.forEach(d => { if (d.regrowTimer > 0) d.regrowTimer -= dt; });
      } catch (e) { console.error('Game update error:', e); }
    }

    function drawTile(x, y, type) {
      const px = x * TILE - gameState.cameraX;
      const py = y * TILE - gameState.cameraY;
      ctx.fillStyle = '#87CEEB';
      if (type === TILE_TYPES.WATER) ctx.fillStyle = '#1E90FF';
      else if (type === TILE_TYPES.SAND) ctx.fillStyle = '#F4A460';
      else if (type === TILE_TYPES.GRASS) ctx.fillStyle = '#228B22';
      else if (type === TILE_TYPES.ROAD) ctx.fillStyle = '#8B7355';
      ctx.fillRect(px, py, TILE, TILE);
    }

    function drawCastle() {
      const x = 17 * TILE - gameState.cameraX + TILE / 2;
      const y = 12.5 * TILE - gameState.cameraY;
      ctx.fillStyle = '#808080'; ctx.fillRect(x - 16, y - 16, 32, 32);
      ctx.fillStyle = '#606060'; for (let i = 0; i < 4; i++) ctx.fillRect(x - 16 + i * 8, y - 20, 4, 4);
      ctx.fillStyle = '#8B4513'; ctx.fillRect(x - 4, y, 8, 10);
      ctx.fillStyle = '#FFD700'; ctx.fillRect(x - 2, y + 2, 1.5, 2);
      ctx.fillStyle = '#FFD700'; ctx.fillRect(x - 10, y - 8, 3, 3); ctx.fillRect(x + 7, y - 8, 3, 3);
      ctx.fillStyle = '#FF0000'; ctx.fillRect(x + 12, y - 18, 2, 6); ctx.fillRect(x + 12, y - 18, 6, 3);
    }

    function drawBuilding(building) {
      const x = building.x * TILE - gameState.cameraX + TILE / 2;
      const y = building.y * TILE - gameState.cameraY + TILE / 2;
      const stats = BUILDING_STATS[building.type].levels[building.level - 1];

      if (building.type === 'farm') {
        ctx.fillStyle = '#8B6F47'; ctx.fillRect(x - 8, y - 8, 16, 16);
        ctx.strokeStyle = '#654321'; ctx.lineWidth = 1; ctx.strokeRect(x - 8, y - 8, 16, 16);
        ctx.fillStyle = '#228B22';
        for (let i = 0; i < 3; i++) { ctx.fillRect(x - 6 + i * 6, y - 4, 2, 4); ctx.fillRect(x - 6 + i * 6, y + 2, 2, 4); }
        if (building.level >= 2) for (let i = 0; i < 3; i++) ctx.fillRect(x - 6 + i * 6, y - 4, 2, 6);
        if (building.level >= 3) { ctx.fillStyle = '#FFD700'; for (let i = 0; i < 3; i++) ctx.fillRect(x - 6 + i * 6, y - 4, 2, 6); }
      } else if (building.type === 'tower') {
        ctx.fillStyle = '#A9A9A9'; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#606060'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#8B4513'; ctx.fillRect(x - 6, y - 4, 12, 6);
        if (building.level >= 2) { ctx.fillStyle = '#654321'; ctx.beginPath(); ctx.moveTo(x - 6, y - 4); ctx.lineTo(x, y - 7); ctx.lineTo(x + 6, y - 4); ctx.fill(); }
        ctx.fillStyle = '#228B22'; ctx.fillRect(x - 1, y - 3, 2, 3);
        if (building.level >= 3) { ctx.fillRect(x - 3, y - 3, 2, 3); ctx.fillRect(x + 1, y - 3, 2, 3); }
      } else if (building.type === 'wall') {
        ctx.fillStyle = '#A9A9A9'; ctx.fillRect(x - 8, y - 6, 16, 12);
        ctx.strokeStyle = '#606060'; ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) ctx.strokeRect(x - 8 + i * 4, y - 6, 4, 12);
        if (building.level >= 3) { ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x - 4, y - 8); ctx.lineTo(x + 4, y + 8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x + 4, y - 8); ctx.lineTo(x - 4, y + 8); ctx.stroke();
        }
      } else if (building.type === 'house') {
        ctx.fillStyle = '#8B4513'; ctx.fillRect(x - 8, y - 4, 16, 10);
        ctx.fillStyle = '#654321'; ctx.beginPath(); ctx.moveTo(x - 8, y - 4); ctx.lineTo(x, y - 10); ctx.lineTo(x + 8, y - 4); ctx.fill();
        ctx.fillStyle = '#FFD700'; ctx.fillRect(x - 4, y - 1, 3, 3);
        ctx.fillStyle = '#8B4513'; ctx.fillRect(x + 1, y + 2, 2, 3);
        if (building.level >= 2) { ctx.fillStyle = '#888888'; ctx.fillRect(x + 5, y - 6, 2, 6); }
        if (building.level >= 3) { ctx.fillStyle = '#654321'; ctx.fillRect(x - 8, y - 8, 16, 3); ctx.fillStyle = '#FFD700'; ctx.fillRect(x - 6, y - 7, 2, 2); ctx.fillRect(x - 2, y - 7, 2, 2); ctx.fillRect(x + 2, y - 7, 2, 2); }
      }

      const barW = 14;
      const barH = 2;
      ctx.fillStyle = '#FF0000'; ctx.fillRect(x - barW / 2, y - 12, barW, barH);
      ctx.fillStyle = '#00FF00'; ctx.fillRect(x - barW / 2, y - 12, (building.health / stats.health) * barW, barH);
    }

    function drawInvader(invader) {
      const stats = INVADER_TYPES[invader.type];
      const x = invader.x * TILE - gameState.cameraX;
      const y = invader.y * TILE - gameState.cameraY;
      ctx.fillStyle = stats.color; ctx.fillRect(x - 3, y - 2, 6, 6);
      ctx.fillStyle = '#FFD4A3'; ctx.beginPath(); ctx.arc(x, y - 3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000000'; ctx.fillRect(x - 1, y - 4, 0.5, 0.5); ctx.fillRect(x + 0.5, y - 4, 0.5, 0.5);
      ctx.strokeStyle = stats.color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 1, y + 2); ctx.lineTo(x - 1, y + 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 1, y + 2); ctx.lineTo(x + 1, y + 4); ctx.stroke();
      if (invader.type === 'raider') { ctx.fillStyle = '#654321'; ctx.fillRect(x + 2, y - 1, 2, 4); } else if (invader.type === 'archer') { ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x + 3, y - 1, 1.5, 0, Math.PI * 2); ctx.stroke(); } else if (invader.type === 'siege') { ctx.fillStyle = '#888888'; ctx.fillRect(x - 4, y + 1, 8, 2); } else if (invader.type === 'boss') { ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.moveTo(x - 2, y - 4); ctx.lineTo(x, y - 6); ctx.lineTo(x + 2, y - 4); ctx.fill(); ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 8; }
      ctx.fillStyle = '#FF0000'; ctx.fillRect(x - 3, y - 6, 6, 1);
      ctx.fillStyle = '#00FF00'; ctx.fillRect(x - 3, y - 6, (invader.health / stats.health) * 6, 1);
      ctx.shadowColor = 'transparent';
    }

    function drawArrow(p) {
      const startX = p.startX * TILE - gameState.cameraX;
      const startY = p.startY * TILE - gameState.cameraY;
      const endX = p.endX * TILE - gameState.cameraX;
      const endY = p.endY * TILE - gameState.cameraY;
      const archHeight = -6 * Math.sin(p.progress * Math.PI);
      const x = startX + (endX - startX) * p.progress;
      const y = startY + (endY - startY) * p.progress + archHeight;
      ctx.strokeStyle = 'rgba(139, 69, 19, 0.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 1, y - 1); ctx.lineTo(x - 3, y - 3); ctx.stroke();
      ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y - 1); ctx.stroke();
      ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.moveTo(x + 0.5, y - 0.5); ctx.lineTo(x - 0.5, y + 0.5); ctx.lineTo(x - 1, y); ctx.fill();
    }

    function drawParticle(p) {
      if (p.type === 'fire') { ctx.fillStyle = `rgba(255, 100, 0, ${p.life})`; ctx.beginPath(); ctx.arc(p.x - gameState.cameraX, p.y - gameState.cameraY, 2 * p.life, 0, Math.PI * 2); ctx.fill(); } else if (p.type === 'coin') { ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(p.x - gameState.cameraX, p.y - gameState.cameraY, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#FFA500'; ctx.lineWidth = 0.5; ctx.stroke(); }
    }

    function drawFloatingText(t) {
      ctx.fillStyle = `rgba(255, 215, 0, ${t.life})`; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText(t.text, t.x - gameState.cameraX, t.y - gameState.cameraY);
    }

    function drawMap() {
      for (let y = 0; y < MAP_HEIGHT; y++) for (let x = 0; x < MAP_WIDTH; x++) drawTile(x, y, tileMap[y][x]);
      decorations.forEach(d => {
        const x = d.x * TILE - gameState.cameraX + TILE / 2;
        const y = d.y * TILE - gameState.cameraY + TILE / 2;
        if (d.regrowTimer > 0) return;
        if (d.type === 'tree') { ctx.fillStyle = '#228B22'; ctx.beginPath(); ctx.arc(x, y - 2, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#8B4513'; ctx.fillRect(x - 1, y + 2, 2, 4); } else if (d.type === 'rock') { ctx.fillStyle = '#808080'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#606060'; ctx.lineWidth = 1; ctx.stroke(); }
      });
      drawCastle();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (gameState.screen === 'playing') {
        drawMap();
        gameState.buildings.forEach(drawBuilding);
        gameState.invaders.forEach(drawInvader);
        gameState.particles.forEach(p => { if (p.type === 'arrow') drawArrow(p); else drawParticle(p); });
        gameState.floatingText.forEach(drawFloatingText);
      }
    }

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      if (gameState.screen === 'playing') {
        const x = Math.floor((touch.clientX + gameState.cameraX) / TILE);
        const y = Math.floor((touch.clientY + gameState.cameraY) / TILE);
        if (gameState.selectedBuildType && gameState.selectedBuildType !== 'gather' && canPlaceBuilding(x, y, gameState.selectedBuildType)) {
          placeBuilding(x, y, gameState.selectedBuildType);
          gameState.selectedBuildType = null;
          document.querySelectorAll('.buildBtn').forEach(b => b.classList.remove('active'));
        } else {
          const building = gameState.buildings.find(b => b.x === x && b.y === y);
          if (building) showUpgradePopup(building, touch.clientX, touch.clientY);
        }
      }
      ensureAudio();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if (Math.sqrt(dx * dx + dy * dy) > 10) {
        gameState.cameraX -= dx * 0.5;
        gameState.cameraY -= dy * 0.5;
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => { e.preventDefault(); }, { passive: false });

    canvas.addEventListener('click', e => {
      if (gameState.screen === 'playing') {
        const x = Math.floor((e.clientX + gameState.cameraX) / TILE);
        const y = Math.floor((e.clientY + gameState.cameraY) / TILE);
        if (gameState.selectedBuildType && gameState.selectedBuildType !== 'gather' && canPlaceBuilding(x, y, gameState.selectedBuildType)) {
          placeBuilding(x, y, gameState.selectedBuildType);
          gameState.selectedBuildType = null;
          document.querySelectorAll('.buildBtn').forEach(b => b.classList.remove('active'));
        } else {
          const building = gameState.buildings.find(b => b.x === x && b.y === y);
          if (building) showUpgradePopup(building, e.clientX, e.clientY);
        }
      }
      ensureAudio();
    });

    canvas.addEventListener('click', e => {
      if (gameState.selectedBuildType === 'gather' && gameState.screen === 'playing') {
        const x = Math.floor((e.clientX + gameState.cameraX) / TILE);
        const y = Math.floor((e.clientY + gameState.cameraY) / TILE);
        const deco = decorations.find(d => d.x === x && d.y === y && d.regrowTimer <= 0);
        if (deco) {
          if (deco.type === 'tree') {
            gameState.resources.wood += 15;
            gameState.floatingText.push({ text: '+15 Wood', x, y, life: 1 });
          } else if (deco.type === 'rock') {
            gameState.resources.stone += 15;
            gameState.floatingText.push({ text: '+15 Stone', x, y, life: 1 });
          }
          deco.regrowTimer = deco.type === 'tree' ? 30 : 45;
          playSound('click');
        }
      }
    });

    document.addEventListener('keydown', e => {
      if (gameState.screen === 'playing') {
        if (e.key === 'w' || e.key === 'W') gameState.cameraY -= 50;
        if (e.key === 'a' || e.key === 'A') gameState.cameraX -= 50;
        if (e.key === 's' || e.key === 'S') gameState.cameraY += 50;
        if (e.key === 'd' || e.key === 'D') gameState.cameraX += 50;
      }
    });

    document.querySelectorAll('.buildBtn').forEach(btn => {
      btn.addEventListener('click', e => {
        const type = btn.dataset.type;
        if (gameState.selectedBuildType === type) {
          gameState.selectedBuildType = null;
          btn.classList.remove('active');
        } else {
          gameState.selectedBuildType = type;
          document.querySelectorAll('.buildBtn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
        playSound('click');
      });
    });

    function showUpgradePopup(building, x, y) {
      const popup = document.getElementById('upgradePopup');
      const stats = BUILDING_STATS[building.type].levels[building.level - 1];
      const cost = BUILDING_STATS[building.type].cost;
      let html = `<h3>${building.type.toUpperCase()} (Lv ${building.level})</h3>`;
      html += `<p>Health: ${Math.round(building.health)}</p>`;
      if (building.level < 3) {
        html += `<p>Cost: 🪵${cost.wood} 🪨${cost.stone}</p>`;
        const canAfford = gameState.resources.wood >= cost.wood && gameState.resources.stone >= cost.stone;
        html += `<button class="upgradeBtn" ${!canAfford ? 'disabled' : ''}>${canAfford ? 'UPGRADE' : 'Not enough!'}</button>`;
      } else {
        html += `<p>Max level reached!</p>`;
      }
      popup.innerHTML = html;
      popup.style.left = (x - 100) + 'px';
      popup.style.top = (y - 120) + 'px';
      popup.classList.add('show');
      const btn = popup.querySelector('.upgradeBtn');
      if (btn && !btn.disabled) {
        btn.addEventListener('click', () => {
          if (upgradeBuilding(building)) {
            popup.classList.remove('show');
            playSound('build');
          }
        });
      }
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#upgradePopup') && !e.target.closest('.buildBtn')) {
        document.getElementById('upgradePopup').classList.remove('show');
      }
    });

    function updateHUD() {
      document.getElementById('resWood').textContent = Math.floor(gameState.resources.wood);
      document.getElementById('resStone').textContent = Math.floor(gameState.resources.stone);
      document.getElementById('resFood').textContent = Math.floor(gameState.resources.food);
      document.getElementById('resGold').textContent = Math.floor(gameState.resources.gold);
      document.getElementById('population').textContent = '👤 ' + gameState.populationCount;
      if (gameState.waveCountdown > 0) {
        document.getElementById('waveInfo').textContent = `Wave ${gameState.wave} | ${Math.ceil(gameState.waveCountdown)}s`;
      } else if (gameState.invaders.length > 0) {
        document.getElementById('waveInfo').textContent = `Wave ${gameState.wave} | ${gameState.invaders.length} invaders`;
      } else {
        document.getElementById('waveInfo').textContent = `Wave ${gameState.wave} | Get ready!`;
      }
    }

    function startGame() {
      gameState.screen = 'playing';
      gameState.waveCountdown = 90;
      document.getElementById('startScreen').classList.add('hidden');
    }

    function endGame() {
      gameState.screen = 'gameover';
      document.getElementById('gameOverScreen').classList.add('show');
      document.getElementById('statWave').textContent = gameState.wave;
      document.getElementById('statGold').textContent = Math.floor(gameState.goldCollected);
      document.getElementById('statBuildings').textContent = gameState.buildingCount;
      const stars = Math.min(3, Math.max(1, Math.floor(gameState.wave / 3)));
      document.getElementById('starRating').textContent = '⭐'.repeat(stars);
      playSound('gameover');
    }

    document.getElementById('playBtn').addEventListener('click', startGame);
    document.getElementById('playAgainBtn').addEventListener('click', () => { location.reload(); });

    let audioContext = null;

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(name) {
      if (!audioContext) return;
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.connect(gain);
      gain.connect(audioContext.destination);
      switch (name) {
        case 'build':
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.setValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.setValueAtTime(0, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;
        case 'shoot':
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.setValueAtTime(600, now + 0.05);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.setValueAtTime(0, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
          break;
        case 'hit':
          osc.frequency.setValueAtTime(300, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.setValueAtTime(0, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;
        case 'horn':
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.setValueAtTime(300, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.setValueAtTime(0, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
          break;
        case 'click':
          osc.frequency.setValueAtTime(1000, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.setValueAtTime(0, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
          break;
        case 'gameover':
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.setValueAtTime(100, now + 0.4);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.setValueAtTime(0, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
          break;
      }
    }

    function gameLoop() {
      const now = performance.now();
      const dt = (now - gameState.lastTime) / 1000;
      gameState.lastTime = now;
      try {
        if (gameState.screen === 'playing') {
          updateGame(dt);
          updateHUD();
        }
        render();
      } catch (e) {
        console.error('Render error:', e);
      }
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
