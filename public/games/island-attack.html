<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Attack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100%; height: 100vh; font-family: Arial, sans-serif; background: #1a1a1a; overflow: hidden; touch-action: none; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; background: #87CEEB; }
        .ui-layer { position: fixed; z-index: 50; pointer-events: auto; }
        .top-hud { top: 0; left: 0; right: 0; height: 60px; background: rgba(20,20,20,0.8); border-bottom: 2px solid #FFD700; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; color: #FFF; font-weight: bold; }
        .resource-display { display: flex; gap: 25px; font-size: 14px; }
        .resource-item { display: flex; align-items: center; gap: 6px; }
        .resource-value { min-width: 40px; color: #FFD700; font-weight: bold; }
        .wave-info { text-align: center; font-size: 16px; color: #FFD700; }
        .population { font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .quest-panel { position: fixed; top: 70px; right: 20px; background: rgba(30,30,30,0.9); border: 2px solid #FFD700; padding: 12px; border-radius: 8px; color: #FFF; font-size: 12px; max-width: 180px; z-index: 50; }
        .quest-title { font-weight: bold; color: #FFD700; margin-bottom: 6px; }
        .quest-description { color: #CCC; margin-bottom: 6px; font-size: 11px; }
        .quest-reward { color: #90EE90; font-size: 10px; }
        .bottom-build-bar { bottom: 0; left: 0; right: 0; height: 80px; background: rgba(20,20,20,0.95); border-top: 2px solid #FFD700; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; }
        .build-button { width: 60px; height: 60px; background: rgba(80,80,80,0.8); border: 2px solid #888; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #FFF; font-size: 10px; transition: all 0.2s; }
        .build-button:hover { background: rgba(100,100,100,0.9); border-color: #FFD700; }
        .build-button.selected { background: rgba(255,215,0,0.3); border-color: #FFD700; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .build-icon { font-size: 20px; margin-bottom: 4px; }
        .build-label { font-size: 9px; font-weight: bold; }
        .start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .game-title { font-size: 64px; font-weight: bold; color: #FFD700; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); margin-bottom: 10px; letter-spacing: 3px; }
        .game-subtitle { font-size: 24px; color: #FFF; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .play-button { padding: 18px 60px; font-size: 32px; font-weight: bold; background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s; }
        .play-button:hover { transform: scale(1.05); }
        .controls-text { color: #FFF; font-size: 14px; margin-top: 30px; opacity: 0.8; line-height: 1.6; }
        .game-over-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        .game-over-title { font-size: 48px; font-weight: bold; color: #FF6B6B; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; background: rgba(50,50,50,0.8); padding: 25px; border-radius: 10px; border: 2px solid #FFD700; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 14px; color: #CCC; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #FFD700; }
        .star-rating { font-size: 48px; margin: 20px 0; letter-spacing: 5px; }
        .play-again-button { padding: 15px 50px; font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s; }
        .upgrade-popup { position: fixed; background: rgba(30,30,30,0.95); border: 3px solid #FFD700; padding: 20px; border-radius: 10px; color: white; z-index: 60; min-width: 220px; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .upgrade-title { font-size: 16px; font-weight: bold; color: #FFD700; margin-bottom: 12px; text-align: center; }
        .upgrade-level { font-size: 12px; color: #CCC; margin-bottom: 12px; text-align: center; }
        .upgrade-cost { font-size: 12px; color: #90EE90; margin-bottom: 12px; text-align: center; }
        .upgrade-button { width: 100%; padding: 10px; background: rgba(76,175,80,0.8); border: 2px solid #4CAF50; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; transition: all 0.2s; margin-bottom: 8px; }
        .upgrade-button:hover:not(:disabled) { background: rgba(76,175,80,1); box-shadow: 0 0 10px rgba(76,175,80,0.5); }
        .upgrade-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .close-button { width: 100%; padding: 8px; background: rgba(150,150,150,0.6); border: 2px solid #999; color: white; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .wave-banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #FF6B6B; font-size: 48px; font-weight: bold; padding: 30px 60px; border: 3px solid #FF6B6B; border-radius: 10px; z-index: 70; pointer-events: none; animation: waveBounce 1s ease-out forwards; }
        @keyframes waveBounce { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer top-hud" id="topHUD" style="display: none;">
        <div class="resource-display">
            <div class="resource-item"><span class="resource-icon">🪵</span><span class="resource-value" id="woodValue">200</span></div>
            <div class="resource-item"><span class="resource-icon">🪨</span><span class="resource-value" id="stoneValue">100</span></div>
            <div class="resource-item"><span class="resource-icon">🌾</span><span class="resource-value" id="foodValue">50</span></div>
            <div class="resource-item"><span class="resource-icon">💰</span><span class="resource-value" id="goldValue">0</span></div>
        </div>
        <div class="wave-info" id="waveInfo">Next wave: 90s</div>
        <div class="population"><span>👤</span><span id="populationValue">0/8</span></div>
    </div>
    <div class="ui-layer quest-panel" id="questPanel" style="display: none;">
        <div class="quest-title" id="questTitle">Quest</div>
        <div class="quest-description" id="questDescription">Complete tasks!</div>
        <div class="quest-reward" id="questReward">Reward: +50</div>
    </div>
    <div class="ui-layer bottom-build-bar" id="buildBar" style="display: none;"></div>
    <div class="start-screen" id="startScreen">
        <div>
            <div class="game-title">ISLAND ATTACK</div>
            <div class="game-subtitle">Build • Defend • Survive!</div>
            <button class="play-button" id="playButton">PLAY</button>
            <div class="controls-text">Tap buildings to place them<br>Tap towers to shoot enemies<br>Keep your castle safe!</div>
        </div>
    </div>
    <div class="game-over-screen" id="gameOverScreen" style="display: none;">
        <div>
            <div class="game-over-title">Your Kingdom Has Fallen!</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-label">Waves Survived</div><div class="stat-value" id="statWaves">5</div></div>
                <div class="stat-item"><div class="stat-label">Invaders Defeated</div><div class="stat-value" id="statKills">42</div></div>
                <div class="stat-item"><div class="stat-label">Buildings Built</div><div class="stat-value" id="statBuildings">12</div></div>
                <div class="stat-item"><div class="stat-label">Max Population</div><div class="stat-value" id="statPopulation">8</div></div>
            </div>
            <div class="star-rating" id="starRating">⭐⭐</div>
            <button class="play-again-button" id="playAgainButton">PLAY AGAIN</button>
        </div>
    </div>

    <script>
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resizeCanvas();window.addEventListener('resize',resizeCanvas);let audioContext=null;let audioInitialized=false;function ensureAudio(){if(audioInitialized)return;try{audioContext=new(window.AudioContext||window.webkitAudioContext)();audioInitialized=true;}catch(e){console.warn('Audio not available');}}function playSound(type){if(!audioInitialized||!audioContext)return;try{const now=audioContext.currentTime;const osc=audioContext.createOscillator();const gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);switch(type){case'build':osc.frequency.setValueAtTime(600,now);osc.frequency.exponentialRampToValueAtTime(800,now+0.1);gain.gain.setValueAtTime(0.3,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.1);osc.start(now);osc.stop(now+0.1);break;case'shoot':osc.frequency.setValueAtTime(800,now);osc.frequency.exponentialRampToValueAtTime(300,now+0.15);gain.gain.setValueAtTime(0.25,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.15);osc.start(now);osc.stop(now+0.15);break;case'hit':osc.frequency.setValueAtTime(200,now);gain.gain.setValueAtTime(0.3,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.12);osc.start(now);osc.stop(now+0.12);break;case'boom':osc.frequency.setValueAtTime(150,now);gain.gain.setValueAtTime(0.4,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.3);osc.start(now);osc.stop(now+0.3);break;case'horn':osc.frequency.setValueAtTime(400,now);osc.frequency.setValueAtTime(600,now+0.15);gain.gain.setValueAtTime(0.2,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.3);osc.start(now);osc.stop(now+0.3);break;case'quest':const notes=[523,659,784,1047];for(let i=0;i<notes.length;i++){const noteOsc=audioContext.createOscillator();const noteGain=audioContext.createGain();noteOsc.connect(noteGain);noteGain.connect(audioContext.destination);noteOsc.frequency.setValueAtTime(notes[i],now+i*0.1);noteGain.gain.setValueAtTime(0.1,now+i*0.1);noteGain.gain.exponentialRampToValueAtTime(0.01,now+i*0.1+0.08);noteOsc.start(now+i*0.1);noteOsc.stop(now+i*0.1+0.08);}break;case'gameover':osc.frequency.setValueAtTime(300,now);osc.frequency.exponentialRampToValueAtTime(100,now+0.5);gain.gain.setValueAtTime(0.3,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.5);osc.start(now);osc.stop(now+0.5);break;}}catch(e){}}const gameState={isRunning:false,gameOver:false,resources:{wood:200,stone:100,food:50,gold:0},population:0,maxPopulation:8,wave:0,nextWaveTimer:90,waveInProgress:false,buildings:[],villagers:[],invaders:[],particles:[],projectiles:[],selectedBuilding:null,currentQuest:null,questsAvailable:[],stats:{wavesReached:0,invadersDefeated:0,buildingsBuilt:0,maxPopulationReached:0,goldEarned:0},frame:0,screenShake:0};const TILE_SIZE=28,MAP_WIDTH=32,MAP_HEIGHT=24,MAP_OFFSET_X=0,MAP_OFFSET_Y=80;class Tile{constructor(x,y,type){this.x=x;this.y=y;this.type=type;this.variation=Math.random();this.waterPhase=Math.random()*Math.PI*2;}draw(ctx){const screenX=MAP_OFFSET_X+this.x*TILE_SIZE;const screenY=MAP_OFFSET_Y+this.y*TILE_SIZE;switch(this.type){case'water':ctx.fillStyle=`rgb(65,${80+Math.sin(gameState.frame*0.05)*10},180)`;ctx.fillRect(screenX,screenY,TILE_SIZE,TILE_SIZE);ctx.fillStyle='rgba(100, 150, 200, 0.3)';for(let i=0;i<3;i++){const waveOffset=Math.sin(gameState.frame*0.03+i*Math.PI/3)*2;ctx.fillRect(screenX,screenY+i*8+waveOffset,TILE_SIZE,3);}if(this.variation>0.7){ctx.fillStyle='rgba(255, 255, 255, 0.6)';ctx.fillRect(screenX+2,screenY+2,TILE_SIZE-4,2);}break;case'sand':ctx.fillStyle='#D2B48C';ctx.fillRect(screenX,screenY,TILE_SIZE,TILE_SIZE);ctx.fillStyle='#C9A876';for(let i=0;i<8;i++){const sx=screenX+Math.random()*TILE_SIZE;const sy=screenY+Math.random()*TILE_SIZE;ctx.fillRect(sx,sy,1,1);}break;case'road':ctx.fillStyle='#8B7355';ctx.fillRect(screenX,screenY,TILE_SIZE,TILE_SIZE);ctx.strokeStyle='#654321';ctx.lineWidth=1;ctx.strokeRect(screenX+1,screenY+1,TILE_SIZE-2,TILE_SIZE-2);ctx.fillStyle='rgba(0, 0, 0, 0.15)';for(let i=0;i<6;i++){const sx=screenX+Math.random()*TILE_SIZE;const sy=screenY+Math.random()*TILE_SIZE;ctx.fillRect(sx,sy,2,2);}break;case'grass':default:const grassColor=70+Math.floor(this.variation*30);ctx.fillStyle=`rgb(50, ${grassColor}, 30)`;ctx.fillRect(screenX,screenY,TILE_SIZE,TILE_SIZE);ctx.fillStyle='rgba(30, 50, 20, 0.4)';for(let i=0;i<6;i++){const sx=screenX+Math.random()*TILE_SIZE;const sy=screenY+Math.random()*TILE_SIZE;ctx.fillRect(sx,sy,2,1);}if(this.variation>0.85){const flowerX=screenX+Math.random()*TILE_SIZE;const flowerY=screenY+Math.random()*TILE_SIZE;ctx.fillStyle=this.variation>0.93?'#FF69B4':'#FFD700';ctx.fillRect(flowerX,flowerY,2,2);}break;}}}const tiles=[];function generateMap(){tiles.length=0;for(let y=0;y<MAP_HEIGHT;y++){for(let x=0;x<MAP_WIDTH;x++){let type='grass';if(x<3||y<3||x>MAP_WIDTH-2){type='water';if(x===3||y===3)type='sand';}const centerX=MAP_WIDTH/2;const centerY=MAP_HEIGHT/2;if(x===4&&y>3&&y<centerY)type='road';if(x>4&&x<centerX-1&&y===centerY-2)type='road';if(x===MAP_WIDTH-4&&y>3&&y<centerY)type='road';if(x>centerX+1&&x<MAP_WIDTH-4&&y===centerY+2)type='road';if(x===centerX-1&&y>3&&y<centerY-2)type='road';if(x===centerX&&y>3&&y<centerY-2)type='road';tiles.push(new Tile(x,y,type));}}}generateMap();class Building{constructor(x,y,buildingType,level=1){this.x=x;this.y=y;this.buildingType=buildingType;this.level=level;this.hp=this.getMaxHP();this.maxHP=this.getMaxHP();this.damage=0;this.productionTimer=0;this.shootTimer=0;this.resources={wood:0,stone:0,food:0};this.lastHitFlash=0;this.cracks=[];for(let i=0;i<5;i++){this.cracks.push({x:Math.random()*24+2,y:Math.random()*24+2,length:Math.random()*8+3});}}getMaxHP(){const basHP={farm:40,wall:60,tower:50,house:45,barracks:70,tree:30,rock:35};return(basHP[this.buildingType]||40)+(this.level-1)*20;}getCost(){const costs={farm:[{wood:20,stone:0,gold:0},{wood:30,stone:10,gold:0},{woo .life--;}draw(ctx){const opacity=this.life/this.maxLife;switch(this.type){case'explosion':ctx.fillStyle=`rgba(255, ${Math.random()*100+100}, 0, ${opacity*0.7})`;ctx.fillRect(this.x-2,this.y-2,4,4);break;case'goldCoin':ctx.fillStyle=`rgba(255, 215, 0, ${opacity})`;ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();break;case'damage':ctx.fillStyle=`rgba(255, 100, 100, ${opacity})`;ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('-'+this.data,this.x,this.y);break;case'questReward':ctx.fillStyle=`rgba(150, 255, 150, ${opacity})`;ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(this.data,this.x,this.y);break;}}}function createParticle(x,y,type,data=null){gameState.particles.push(new Particle(x,y,type,data));}function initGame(){gameState.isRunning=true;gameState.gameOver=false;gameState.frame=0;gameState.screenShake=0;gameState.wave=0;gameState.nextWaveTimer=90;gameState.waveInProgress=false;gameState.buildings=[];gameState.villagers=[];gameState.invaders=[];gameState.particles=[];gameState.projectiles=[];gameState.selectedBuilding=null;gameState.resources={wood:200,stone:100,food:50,gold:0};gameState.population=0;gameState.maxPopulation=8;gameState.stats={wavesReached:0,invadersDefeated:0,buildingsBuilt:0,maxPopulationReached:0,goldEarned:0};const castle=new Building(MAP_WIDTH/2-1,MAP_HEIGHT/2-1,'castle');gameState.buildings.push(castle);for(let i=0;i<6;i++){const x=Math.floor(Math.random()*(MAP_WIDTH-6))+3;const y=Math.floor(Math.random()*(MAP_HEIGHT-6))+3;const tile=getTile(x,y);if(tile&&tile.type==='grass'){const building=new Building(x,y,Math.random()>0.5?'tree':'rock');gameState.buildings.push(building);}}generateQuestLine();}function getTile(x,y){for(let tile of tiles){if(tile.x===x&&tile.y===y)return tile;}return null;}const questLine=[{id:'firstFarm',text:'Build your first farm',reward:{wood:50,stone:0,food:0,gold:0}},{id:'twoTowers',text:'Build 2 towers',reward:{wood:0,stone:40,food:0,gold:0}},{id:'surviveWave1',text:'Survive wave 1',reward:{wood:0,stone:0,food:0,gold:100}},{id:'upgrade',text:'Upgrade a building',reward:{wood:30,stone:30,food:0,gold:0}},{id:'population',text:'Reach population 8',reward:{wood:0,stone:0,food:50,gold:50}},{id:'defeats',text:'Defeat 30 invaders',reward:{wood:0,stone:0,food:0,gold:200}}];function generateQuestLine(){gameState.questsAvailable=[...questLine];advanceQuest();}function advanceQuest(){if(gameState.questsAvailable.length===0)return;gameState.currentQuest=gameState.questsAvailable.shift();updateQuestPanel();}function updateQuestPanel(){if(!gameState.currentQuest)return;const questTitle=document.getElementById('questTitle');const questDesc=document.getElementById('questDescription');const questReward=document.getElementById('questReward');questTitle.textContent='Quest';questDesc.textContent=gameState.currentQuest.text;const reward=gameState.currentQuest.reward;let rewardText='Reward: ';if(reward.wood>0)rewardText+=`+${reward.wood}🪵 `;if(reward.stone>0)rewardText+=`+${reward.stone}🪨 `;if(reward.food>0)rewardText+=`+${reward.food}🌾 `;if(reward.gold>0)rewardText+=`+${reward.gold}💰`;questReward.textContent=rewardText||'Reward: +50';}function checkQuestCompletion(){if(!gameState.currentQuest)return;const quest=gameState.currentQuest;let completed=false;switch(quest.id){case'firstFarm':if(gameState.buildings.some(b=>b.buildingType==='farm'))completed=true;break;case'twoTowers':if(gameState.buildings.filter(b=>b.buildingType==='tower').length>=2)completed=true;break;case'surviveWave1':if(gameState.wave>1)completed=true;break;case'upgrade':if(gameState.buildings.some(b=>b.level>1))completed=true;break;case'population':if(gameState.population>=8)completed=true;break;case'defeats':if(gameState.stats.invadersDefeated>=30)completed=true;break;}if(completed){completeQuest();}}function completeQuest(){const reward=gameState.currentQuest.reward;gameState.resources.wood+=reward.wood;gameState.resources.stone+=reward.stone;gameState.resources.food+=reward.food;gameState.resources.gold+=reward.gold;gameState.stats.goldEarned+=reward.gold;playSound('quest');for(let i=0;i<15;i++){createParticle(canvas.width/2+(Math.random()-0.5)*100,canvas.height/2+(Math.random()-0.5)*100,'questReward','+');}advanceQuest();}const buildingTypes=[{name:'Farm',type:'farm',icon:'🌾'},{name:'Wall',type:'wall',icon:'🧱'},{name:'Tower',type:'tower',icon:'🏯'},{name:'House',type:'house',icon:'🏠'},{name:'Barracks',type:'barracks',icon:'⚔️'}];function initBuildMenu(){const buildBar=document.getElementById('buildBar');buildBar.innerHTML='';buildingTypes.forEach((building)=>{const button=document.createElement('button');button.className='build-button';button.innerHTML=`<div class="build-icon">${building.icon}</div><div class="build-label">${building.name}</div><div class="build-cost">Cost</div>`;button.addEventListener('click',()=>selectBuilding(building.type,button));buildBar.appendChild(button);});}let selectedBuildingType=null;let selectedBuildingButton=null;function selectBuilding(type,button){if(selectedBuildingType===type){selectedBuildingType=null;selectedBuildingButton.classList.remove('selected');selectedBuildingButton=null;}else{if(selectedBuildingButton){selectedBuildingButton.classList.remove('selected');}selectedBuildingType=type;selectedBuildingButton=button;button.classList.add('selected');}playSound('click');}function canBuild(type,level=1){const cost=new Building(0,0,type,level).getCost();return gameState.resources.wood>=cost.wood&&gameState.resources.stone>=cost.stone&&gameState.resources.gold>=cost.gold;}function buildBuilding(x,y,type){if(!canBuild(type)){return false;}const cost=new Building(0,0,type).getCost();gameState.resources.wood-=cost.wood;gameState.resources.stone-=cost.stone;gameState.resources.gold-=cost.gold;const building=new Building(x,y,type);gameState.buildings.push(building);gameState.stats.buildingsBuilt++;if(type==='house'){const population=Math.min(3,gameState.maxPopulation-gameState.population);for(let i=0;i<population;i++){const villager=new Villager(x,y,building);gameState.villagers.push(villager);gameState.population++;}}playSound('build');checkQuestCompletion();return true;}function spawnWave(waveNum){const waveConfigs=[{raiders:3,archers:0,siege:0,boss:false},{raiders:5,archers:0,siege:0,boss:false},{raiders:4,archers:2,siege:0,boss:false},{raiders:6,archers:3,siege:0,boss:false},{raiders:8,archers:4,siege:1,boss:false},{raiders:10,archers:5,siege:2,boss:false},{raiders:12,archers:6,siege:2,boss:false},{raiders:14,archers:7,siege:3,boss:false},{raiders:16,archers:8,siege:3,boss:false},{raiders:10,archers:5,siege:2,boss:true},{raiders:20,archers:10,siege:4,boss:false},{raiders:25,archers:12,siege:5,boss:false}];const config=waveConfigs[Math.min(waveNum-1,waveConfigs.length-1)];const startX=4;const startY=4;for(let i=0;i<config.raiders;i++){gameState.invaders.push(new Invader(startX+Math.random()*2,startY+Math.random()*2,'raider'));}for(let i=0;i<config.archers;i++){gameState.invaders.push(new Invader(startX+Math.random()*2,startY+Math.random()*2,'archer'));}for(let i=0;i<config.siege;i++){gameState.invaders.push(new Invader(startX+Math.random()*2,startY+Math.random()*2,'siege'));}if(config.boss){gameState.invaders.push(new Invader(startX+Math.random()*2,startY+Math.random()*2,'boss'));}gameState.waveInProgress=true;playSound('horn');}let lastFrameTime=Date.now();function gameLoop(){try{const now=Date.now();const deltaTime=Math.min((now-lastFrameTime)/16.67,2);lastFrameTime=now;if(!gameState.isRunning||gameState.gameOver){requestAnimationFrame(gameLoop);return;}gameState.frame++;updateResources();gameState.buildings.forEach(building=>{if(building.buildingType==='farm'){building.productionTimer++;if(building.productionTimer>60/building.level){gameState.resources.food+=5*building.level;building.productionTimer=0;}}});gameState.buildings.forEach(tower=>{if(tower.buildingType==='tower'){tower.shootTimer--;let nearest=null;let nearestDist=tower.level===1?5:tower.level===2?7:10;gameState.invaders.forEach(invader=>{const dist=Math.hypot(invader.x-tower.x,invader.y-tower.y);if(dist<nearestDist){nearest=invader;nearestDist=dist;}});if(nearest&&tower.shootTimer<=0){const projectile=new Projectile(tower.x+0.5,tower.y+0.5,nearest.x,nearest.y,'arrow');gameState.projectiles.push(projectile);tower.shootTimer=20/tower.level;playSound('shoot');gameState.towersShot++;}}});gameState.invaders.forEach(invader=>{invader.update();let nearest=null;let nearestDist=invader.range*3;gameState.buildings.forEach(building=>{if(building.buildingType!=='tree'&&building.buildingType!=='rock'){const dist=Math.hypot(invader.x-building.x,invader.y-building.y);if(dist<nearestDist){nearest=building;nearestDist=dist;}}});invader.target=nearest;if(nearest&&nearestDist<1){nearest.takeDamage(invader.damage);}});gameState.projectiles=gameState.projectiles.filter(proj=>!proj.update());gameState.projectiles.forEach(proj=>{gameState.invaders.forEach(invader=>{const dist=Math.hypot(proj.x-invader.x,proj.y-invader.y);if(dist<0.5&&proj.type.includes('arrow')){invader.takeDamage(proj.damage);proj.hit=true;}});});gameState.projectiles=gameState.projectiles.filter(p=>!p.hit);gameState.particles.forEach(p=>p.update());gameState.particles=gameState.particles.filter(p=>p.life>0);gameState.villagers.forEach(villager=>{villager.update();});if(!gameState.waveInProgress){gameState.nextWaveTimer--;if(gameState.nextWaveTimer<=0){gameState.wave++;gameState.stats.wavesReached=gameState.wave;spawnWave(gameState.wave);gameState.nextWaveTimer=Math.max(30,90-gameState.wave*5);showWaveBanner(gameState.wave);}}else{if(gameState.invaders.length===0){gameState.waveInProgress=false;gameState.nextWaveTimer=Math.max(30,90-gameState.wave*5);}}const castle=gameState.buildings.find(b=>b.buildingType==='castle');if(castle&&castle.hp<=0){endGame();}checkQuestCompletion();updateUI();render();requestAnimationFrame(gameLoop);}catch(e){console.error('Game loop error:',e);requestAnimationFrame(gameLoop);}}function updateResources(){gameState.villagers.forEach(villager=>{if(!villager.assignedBuilding){let nearest=null;let nearestDist=5;gameState.buildings.forEach(building=>{if((building.buildingType==='tree'||building.buildingType==='rock')&&building.hp>0){const dist=Math.hypot(villager.x-building.x,villager.y-building.y);if(dist<nearestDist){nearest=building;nearestDist=dist;}}});if(nearest){villager.targetX=nearest.x;villager.targetY=nearest.y;if(nearestDist<0.5){if(nearest.buildingType==='tree'){villager.carryingResource='wood';nearest.hp-=0.5;}else{villager.carryingResource='stone';nearest.hp-=0.5;}if(nearest.hp<=0){gameState.buildings=gameState.buildings.filter(b=>b!==nearest);}villager.targetX=MAP_WIDTH/2;villager.targetY=MAP_HEIGHT/2;}}}if(villager.carryingResource){const castleX=MAP_WIDTH/2;const castleY=MAP_HEIGHT/2;if(Math.hypot(villager.x-castleX,villager.y-castleY)<1){if(villager.carryingResource==='wood'){gameState.resources.wood+=1;}else if(villager.carryingResource==='stone'){gameState.resources.stone+=1;}villager.carryingResource=null;}}});}function updateUI(){document.getElementById('woodValue').textContent=gameState.resources.wood;document.getElementById('stoneValue').textContent=gameState.resources.stone;document.getElementById('foodValue').textContent=gameState.resources.food;document.getElementById('goldValue').textContent=gameState.resources.gold;document.getElementById('populationValue').textContent=gameState.population+'/'+gameState.maxPopulation;if(gameState.waveInProgress){document.getElementById('waveInfo').textContent=`Wave ${gameState.wave} - ${gameState.invaders.length} enemies`;}else{const nextWave=Math.ceil(gameState.nextWaveTimer);document.getElementById('waveInfo').textContent=`Next wave: ${nextWave}s`;}}function render(){ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();if(gameState.screenShake>0){const shake=gameState.screenShake;ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);gameState.screenShake*=0.9;}tiles.forEach(tile=>tile.draw(ctx));gameState.buildings.sort((a,b)=>(a.y+a.x)-(b.y+b.x));gameState.buildings.forEach(building=>building.draw(ctx));gameState.villagers.forEach(villager=>villager.draw(ctx));gameState.projectiles.forEach(proj=>proj.draw(ctx));gameState.invaders.forEach(invader=>invader.draw(ctx));gameState.particles.forEach(particle=>particle.draw(ctx));ctx.restore();}function showWaveBanner(wave){const banner=document.createElement('div');banner.className='wave-banner';banner.textContent=`WAVE ${wave} INCOMING!`;document.body.appendChild(banner);setTimeout(()=>banner.remove(),1000);}function endGame(){gameState.gameOver=true;gameState.isRunning=false;const screen=document.getElementById('gameOverScreen');screen.style.display='flex';document.getElementById('statWaves').textContent=gameState.stats.wavesReached;document.getElementById('statKills').textContent=gameState.stats.invadersDefeated;document.getElementById('statBuildings').textContent=gameState.stats.buildingsBuilt;document.getElementById('statPopulation').textContent=gameState.population;const waves=gameState.stats.wavesReached;let stars=waves<3?1:waves<7?2:3;document.getElementById('starRating').textContent='⭐'.repeat(stars);playSound('gameover');}canvas.addEventListener('click',(e)=>{ensureAudio();if(!gameState.isRunning||gameState.gameOver)return;const rect=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-rect.left-MAP_OFFSET_X)/TILE_SIZE);const y=Math.floor((e.clientY-rect.top-MAP_OFFSET_Y)/TILE_SIZE);if(selectedBuildingType&&x>=0&&x<MAP_WIDTH&&y>=0&&y<MAP_HEIGHT){const tile=getTile(x,y);if(tile&&(tile.type==='grass'||tile.type==='road')){const occupied=gameState.buildings.some(b=>b.x===x&&b.y===y);if(!occupied){if(buildBuilding(x,y,selectedBuildingType)){selectBuilding(selectedBuildingType,selectedBuildingButton);}}}}else if(!selectedBuildingType){gameState.buildings.forEach(building=>{if(building.x===x&&building.y===y&&building.buildingType!=='tree'&&building.buildingType!=='rock'&&building.buildingType!=='castle'&&building.level<3){showUpgradePopup(building);}});}});function showUpgradePopup(building){const popup=document.createElement('div');popup.className='upgrade-popup';const cost=building.getCost();const nextCost=new Building(0,0,building.buildingType,building.level+1).getCost();const canUpgrade=gameState.resources.wood>=nextCost.wood&&gameState.resources.stone>=nextCost.stone&&gameState.resources.gold>=nextCost.gold&&building.level<3;popup.innerHTML=`<div class="upgrade-title">${building.buildingType.charAt(0).toUpperCase()+building.buildingType.slice(1)}</div><div class="upgrade-level">Level ${building.level}/3</div><div class="upgrade-cost">Cost: ${nextCost.wood>0?nextCost.wood+'W ':''}${nextCost.stone>0?nextCost.stone+'S ':''}${nextCost.gold>0?nextCost.gold+'G':''}</div><button class="upgrade-button" ${canUpgrade?'':'disabled'}>UPGRADE</button><button class="close-button">Close</button>`;popup.style.left=(MAP_OFFSET_X+building.x*TILE_SIZE)+'px';popup.style.top=(MAP_OFFSET_Y+building.y*TILE_SIZE+TILE_SIZE)+'px';const upgradeBtn=popup.querySelector('.upgrade-button');const closeBtn=popup.querySelector('.close-button');upgradeBtn.addEventListener('click',()=>{if(canUpgrade){gameState.resources.wood-=nextCost.wood;gameState.resources.stone-=nextCost.stone;gameState.resources.gold-=nextCost.gold;building.level++;building.hp=building.getMaxHP();building.maxHP=building.getMaxHP();playSound('build');checkQuestCompletion();document.body.removeChild(popup);}});closeBtn.addEventListener('click',()=>{document.body.removeChild(popup);});document.body.appendChild(popup);playSound('click');}canvas.addEventListener('touchstart',(e)=>{ensureAudio();e.preventDefault();},false);canvas.addEventListener('touchend',(e)=>{ensureAudio();e.preventDefault();if(!gameState.isRunning||gameState.gameOver)return;const touch=e.changedTouches[0];const rect=canvas.getBoundingClientRect();const x=Math.floor((touch.clientX-rect.left-MAP_OFFSET_X)/TILE_SIZE);const y=Math.floor((touch.clientY-rect.top-MAP_OFFSET_Y)/TILE_SIZE);if(selectedBuildingType&&x>=0&&x<MAP_WIDTH&&y>=0&&y<MAP_HEIGHT){const tile=getTile(x,y);if(tile&&(tile.type==='grass'||tile.type==='road')){const occupied=gameState.buildings.some(b=>b.x===x&&b.y===y);if(!occupied){if(buildBuilding(x,y,selectedBuildingType)){selectBuilding(selectedBuildingType,selectedBuildingButton);}}}}else if(!selectedBuildingType){gameState.buildings.forEach(building=>{if(building.x===x&&building.y===y&&building.buildingType!=='tree'&&building.buildingType!=='rock'&&building.buildingType!=='castle'&&building.level<3){showUpgradePopup(building);}});}},false);document.getElementById('playButton').addEventListener('click',()=>{ensureAudio();document.getElementById('startScreen').style.display='none';document.getElementById('topHUD').style.display='flex';document.getElementById('buildBar').style.display='flex';document.getElementById('questPanel').style.display='block';initBuildMenu();initGame();requestAnimationFrame(gameLoop);});document.getElementById('playAgainButton').addEventListener('click',()=>{ensureAudio();document.getElementById('gameOverScreen').style.display='none';document.getElementById('topHUD').style.display='flex';document.getElementById('buildBar').style.display='flex';document.getElementById('questPanel').style.display='block';initBuildMenu();initGame();requestAnimationFrame(gameLoop);});document.addEventListener('touchmove',(e)=>{if(gameState.isRunning){e.preventDefault();}},{passive:false});
    </script>
