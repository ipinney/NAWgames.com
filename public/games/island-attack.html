<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Island Attack - NAW Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1330;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hud-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 18px;
            color: white;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
        }

        .resource-display {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wave-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
        }

        .hud-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            padding: 10px;
            z-index: 100;
            pointer-events: auto;
            flex-wrap: wrap;
        }

        .build-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 3px solid white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
            transition: all 0.2s;
            pointer-events: auto;
        }

        .build-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
        }

        .build-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 0 20px rgba(245, 87, 108, 1);
            border-color: #ffff00;
        }

        .build-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quest-panel {
            position: fixed;
            top: 80px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 13px;
            max-width: 200px;
            z-index: 100;
            pointer-events: none;
        }

        .quest-title {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: auto;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .overlay-subtitle {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ffffcc;
        }

        .overlay-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .overlay-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .overlay-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            font-size: 14px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .stat-label {
            color: #aaaaff;
        }

        .stat-value {
            color: #ffff00;
            font-size: 18px;
            font-weight: bold;
        }

        .stars {
            font-size: 40px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .resource-display {
                font-size: 14px;
                gap: 12px;
            }
            .build-btn {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="hud-top">
        <div class="resource-display">
            <div class="resource-item"><span>🪵</span> <span id="woodCount">200</span></div>
            <div class="resource-item"><span>🪨</span> <span id="stoneCount">100</span></div>
            <div class="resource-item"><span>🌾</span> <span id="foodCount">50</span></div>
            <div class="resource-item"><span>💰</span> <span id="goldCount">0</span></div>
        </div>
        <div class="wave-info">
            <span id="waveDisplay">Wave: 1</span>
            <span id="populationDisplay">👤 3/5</span>
        </div>
    </div>

    <div class="quest-panel" id="questPanel">
        <div class="quest-title" id="questTitle">Quest</div>
        <div id="questDesc">Build your first farm</div>
    </div>

    <div class="hud-bottom">
        <button class="build-btn" id="farmBtn" data-building="farm">Farm<br>🌾</button>
        <button class="build-btn" id="wallBtn" data-building="wall">Wall<br>🧱</button>
        <button class="build-btn" id="towerBtn" data-building="tower">Tower<br>🏹</button>
        <button class="build-btn" id="houseBtn" data-building="house">House<br>🏠</button>
        <button class="build-btn" id="barracksBtn" data-building="barracks">Barracks<br>⚔️</button>
    </div>

    <div id="startScreen" class="overlay">
        <div class="overlay-content">
            <div class="overlay-title">🏝️ ISLAND ATTACK 🏝️</div>
            <div class="overlay-subtitle">Build. Defend. Survive!</div>
            <div class="overlay-text">
                Tap to build • Drag to explore<br>
                Defend your castle from invaders!<br><br>
                Perfect for ages 8+
            </div>
            <button class="overlay-button" onclick="game.startGame()">PLAY</button>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <div class="overlay-content">
            <div class="overlay-title">⚔️ Island Fallen ⚔️</div>
            <div class="overlay-text" id="gameOverStats"></div>
            <div class="stars" id="stars"></div>
            <button class="overlay-button" onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ AUDIO SYSTEM ============
        class AudioSystem {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.masterVolume = 0.3;
            }

            playSound(type) {
                try {
                    const now = this.audioContext.currentTime;
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioContext.destination);
                    gain.gain.setValueAtTime(this.masterVolume, now);

                    switch(type) {
                        case 'place':
                            osc.frequency.setValueAtTime(600, now);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                            osc.start(now);
                            osc.stop(now + 0.1);
                            break;
                        case 'collect':
                            osc.frequency.setValueAtTime(800, now);
                            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                            osc.start(now);
                            osc.stop(now + 0.1);
                            break;
                        case 'shoot':
                            osc.frequency.setValueAtTime(400, now);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                            osc.start(now);
                            osc.stop(now + 0.05);
                            break;
                        case 'hit':
                            osc.frequency.setValueAtTime(300, now);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                            osc.start(now);
                            osc.stop(now + 0.15);
                            break;
                        case 'boom':
                            osc.frequency.setValueAtTime(150, now);
                            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                            osc.start(now);
                            osc.stop(now + 0.2);
                            break;
                        case 'wave':
                            osc.frequency.setValueAtTime(700, now);
                            gain.gain.setValueAtTime(0.3 * this.masterVolume, now);
                            gain.gain.exponentialRampToValueAtTime(0.05, now + 0.8);
                            osc.start(now);
                            osc.stop(now + 0.8);
                            break;
                        case 'quest':
                            const notes = [523.25, 659.25, 783.99];
                            for (let i = 0; i < notes.length; i++) {
                                const noteOsc = this.audioContext.createOscillator();
                                const noteGain = this.audioContext.createGain();
                                noteOsc.connect(noteGain);
                                noteGain.connect(this.audioContext.destination);
                                noteOsc.frequency.value = notes[i];
                                noteGain.gain.setValueAtTime(this.masterVolume * 0.2, now + i * 0.1);
                                noteGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                                noteOsc.start(now + i * 0.1);
                                noteOsc.stop(now + i * 0.1 + 0.2);
                            }
                            break;
                    }
                } catch(e) {
                    // Audio errors fail silently
                }
            }
        }

        const audio = new AudioSystem();

        // ============ PARTICLE SYSTEM ============
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1;
                this.velocity = {x: 0, y: 0};
                this.gravity = 0.2;

                if (type === 'dust') {
                    this.velocity = {x: (Math.random() - 0.5) * 4, y: -Math.random() * 3 - 1};
                    this.size = 3 + Math.random() * 2;
                    this.color = '#' + Math.floor(Math.random()*16777215).toString(16);
                } else if (type === 'sparkle') {
                    this.velocity = {x: (Math.random() - 0.5) * 6, y: -Math.random() * 4 - 2};
                    this.size = 2 + Math.random() * 2;
                    this.color = '#FFD700';
                } else if (type === 'explosion') {
                    this.velocity = {x: (Math.random() - 0.5) * 8, y: -Math.random() * 5 - 2};
                    this.size = 4 + Math.random() * 3;
                    this.color = ['#FF6B6B', '#FFA500', '#FFD700'][Math.floor(Math.random() * 3)];
                }
            }

            update() {
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.life -= 0.02;
            }

            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // ============ BUILDING SYSTEM ============
        class Building {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.level = 1;

                const buildingStats = {
                    farm: { cost: {wood: 20, stone: 0}, maxHp: 50, width: 2, height: 2, color: '#90EE90' },
                    wall: { cost: {wood: 0, stone: 15}, maxHp: 80, width: 1, height: 1, color: '#A9A9A9' },
                    tower: { cost: {wood: 25, stone: 15}, maxHp: 60, width: 2, height: 2, color: '#8B4513' },
                    house: { cost: {wood: 30, stone: 10}, maxHp: 40, width: 2, height: 2, color: '#CD853F' },
                    barracks: { cost: {wood: 40, stone: 30}, maxHp: 100, width: 3, height: 3, color: '#4B0082' }
                };

                const stats = buildingStats[type];
                this.cost = stats.cost;
                this.maxHp = stats.maxHp;
                this.hp = this.maxHp;
                this.width = stats.width;
                this.height = stats.height;
                this.color = stats.color;

                this.lastShot = 0;
            }

            takeDamage(amount) {
                this.hp = Math.max(0, this.hp - amount);
                return this.hp <= 0;
            }

            draw(ctx, tileSize) {
                // Building base
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x * tileSize, this.y * tileSize, this.width * tileSize, this.height * tileSize);

                // Building outline
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x * tileSize, this.y * tileSize, this.width * tileSize, this.height * tileSize);

                // Special details
                if (this.type === 'farm') {
                    ctx.fillStyle = '#228B22';
                    for (let i = 0; i < 4; i++) {
                        ctx.fillRect(this.x * tileSize + 5 + i * 8, this.y * tileSize + 5, 4, 10);
                    }
                } else if (this.type === 'tower') {
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(this.x * tileSize + 10, this.y * tileSize + 10, this.width * tileSize - 20, this.height * tileSize - 20);
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x * tileSize + tileSize, this.y * tileSize + tileSize, 8, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'house') {
                    ctx.fillStyle = '#DEB887';
                    ctx.beginPath();
                    ctx.moveTo(this.x * tileSize + tileSize, this.y * tileSize);
                    ctx.lineTo(this.x * tileSize + this.width * tileSize, this.y * tileSize + tileSize);
                    ctx.lineTo(this.x * tileSize, this.y * tileSize + tileSize);
                    ctx.fill();
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(this.x * tileSize + 8, this.y * tileSize + 12, 8, 8);
                }

                // Health bar
                const barWidth = this.width * tileSize;
                const barHeight = 4;
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x * tileSize, this.y * tileSize - 8, barWidth, barHeight);
                ctx.fillStyle = this.hp > this.maxHp * 0.5 ? '#00AA00' : this.hp > this.maxHp * 0.25 ? '#FFAA00' : '#AA0000';
                ctx.fillRect(this.x * tileSize, this.y * tileSize - 8, (this.hp / this.maxHp) * barWidth, barHeight);
            }
        }

        // ============ INVADER SYSTEM ============
        class Invader {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.speed = 0.5;
                this.direction = {x: 0, y: 0};
                this.target = null;
                this.size = 12;

                const invaderStats = {
                    raider: { hp: 20, speed: 0.5, damage: 10, color: '#8B4513', reward: 50 },
                    archer: { hp: 15, speed: 0.4, damage: 8, color: '#228B22', reward: 75 },
                    siege: { hp: 50, speed: 0.2, damage: 20, color: '#A9A9A9', reward: 150 },
                    boss: { hp: 100, speed: 0.15, damage: 30, color: '#FF1493', reward: 500 }
                };

                const stats = invaderStats[type];
                this.maxHp = stats.hp;
                this.hp = this.maxHp;
                this.speed = stats.speed;
                this.damage = stats.damage;
                this.color = stats.color;
                this.reward = stats.reward;
                this.lastAttack = 0;
            }

            takeDamage(amount) {
                this.hp = Math.max(0, this.hp - amount);
                return this.hp <= 0;
            }

            update(buildings, castle) {
                // Find target building
                if (!this.target || this.target.hp <= 0) {
                    let closestDist = Infinity;
                    let closestBuilding = null;

                    buildings.forEach(b => {
                        const dist = Math.sqrt((this.x - b.x) ** 2 + (this.y - b.y) ** 2);
                        if (dist < closestDist && b.hp > 0) {
                            closestDist = dist;
                            closestBuilding = b;
                        }
                    });

                    if (!closestBuilding) {
                        closestBuilding = castle;
                    }
                    this.target = closestBuilding;
                }

                // Move towards target
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 1.5) {
                    this.direction.x = dx / dist;
                    this.direction.y = dy / dist;
                    this.x += this.direction.x * this.speed;
                    this.y += this.direction.y * this.speed;
                }
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x * 24, this.y * 24, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x * 24 - 6, this.y * 24 - 4, 4, 4);
                ctx.fillRect(this.x * 24 + 2, this.y * 24 - 4, 4, 4);

                // Health bar
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x * 24 - 15, this.y * 24 - 20, 30, 3);
                ctx.fillStyle = '#00AA00';
                ctx.fillRect(this.x * 24 - 15, this.y * 24 - 20, (this.hp / this.maxHp) * 30, 3);
            }
        }

        // ============ MAIN GAME ============
        class Game {
            constructor() {
                this.state = 'start'; // start, playing, gameOver
                this.cameraX = 0;
                this.cameraY = 0;
                this.islandSize = 40;
                this.tileSize = 24;

                this.resources = {
                    wood: 200,
                    stone: 100,
                    food: 50,
                    gold: 0
                };

                this.population = { current: 3, max: 5 };
                this.wave = 1;
                this.waveTime = 90; // Tutorial phase
                this.waveActive = false;
                this.invaders = [];
                this.buildings = [];
                this.particles = [];
                this.castle = { x: 18, y: 18, maxHp: 100, hp: 100 };

                this.selectedBuilding = null;
                this.mouseX = 0;
                this.mouseY = 0;

                this.tutorial = {
                    active: true,
                    step: 0,
                    steps: [
                        { message: 'Welcome to your island! Tap PLAY to begin.', target: null },
                        { message: 'Let\'s build a farm! Tap the Farm button.', target: 'farmBtn' },
                        { message: 'Now tap the island to place it.', target: null },
                        { message: 'Great! Now build a wall. Tap the Wall button.', target: 'wallBtn' },
                        { message: 'Place it next to your castle to protect it.', target: null },
                        { message: 'Now build a tower! Tap the Tower button.', target: 'towerBtn' },
                        { message: 'Place it near the edge to defend your island.', target: null },
                        { message: 'Build a house for more villagers!', target: 'houseBtn' },
                        { message: 'Ready to defend? The first wave arrives in 60 seconds!', target: null }
                    ]
                };

                this.quests = [
                    { text: 'Build your first farm', completed: false },
                    { text: 'Build 3 walls', completed: false, progress: 0 },
                    { text: 'Survive Wave 1', completed: false },
                    { text: 'Reach population 10', completed: false },
                    { text: 'Build your first tower', completed: false },
                    { text: 'Defeat 20 invaders', completed: false, progress: 0 },
                    { text: 'Upgrade a tower to level 3', completed: false }
                ];
                this.currentQuest = 0;

                this.totalInvadersDefeated = 0;
                this.totalBuildingsBuilt = 0;
                this.shake = 0;
                this.floatingTexts = [];
                this.treePositions = [];
                this.rockPositions = [];
                this.generateIsland();

                this.setupControls();
                this.updateHUD();
            }

            generateIsland() {
                // Place trees and rocks
                for (let i = 0; i < 20; i++) {
                    let x, y, valid;
                    do {
                        x = 5 + Math.floor(Math.random() * 30);
                        y = 5 + Math.floor(Math.random() * 30);
                        valid = Math.sqrt((x - 20) ** 2 + (y - 20) ** 2) > 6;
                    } while (!valid || this.treePositions.some(t => Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2) < 3));
                    this.treePositions.push({x, y, regrowTime: 0});
                }

                for (let i = 0; i < 15; i++) {
                    let x, y, valid;
                    do {
                        x = 5 + Math.floor(Math.random() * 30);
                        y = 5 + Math.floor(Math.random() * 30);
                        valid = Math.sqrt((x - 20) ** 2 + (y - 20) ** 2) > 6;
                    } while (!valid || this.rockPositions.some(r => Math.sqrt((r.x - x) ** 2 + (r.y - y) ** 2) < 3));
                    this.rockPositions.push({x, y, regrowTime: 0});
                }
            }

            setupControls() {
                document.querySelectorAll('.build-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.selectBuilding(btn.dataset.building));
                });

                canvas.addEventListener('mousedown', (e) => this.handleCanvasInput(e.clientX, e.clientY));
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.handleCanvasInput(touch.clientX, touch.clientY);
                });

                canvas.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });

                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.mouseX = touch.clientX;
                    this.mouseY = touch.clientY;
                });

                // Pan controls
                let dragStart = null;
                canvas.addEventListener('mousedown', (e) => {
                    if (!this.selectedBuilding) dragStart = {x: e.clientX, y: e.clientY};
                });

                canvas.addEventListener('mousemove', (e) => {
                    if (dragStart && this.state === 'playing') {
                        const dx = (e.clientX - dragStart.x) / 10;
                        const dy = (e.clientY - dragStart.y) / 10;
                        this.cameraX -= dx;
                        this.cameraY -= dy;
                        dragStart = {x: e.clientX, y: e.clientY};
                    }
                });

                canvas.addEventListener('mouseup', () => dragStart = null);
                canvas.addEventListener('mouseleave', () => dragStart = null);
            }

            selectBuilding(type) {
                if (this.state !== 'playing') return;
                const costs = {
                    farm: {wood: 20, stone: 0},
                    wall: {wood: 0, stone: 15},
                    tower: {wood: 25, stone: 15},
                    house: {wood: 30, stone: 10},
                    barracks: {wood: 40, stone: 30}
                };

                const cost = costs[type];
                if (this.resources.wood >= cost.wood && this.resources.stone >= cost.stone) {
                    this.selectedBuilding = type;
                    document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById(type + 'Btn').classList.add('active');
                } else {
                    audio.playSound('hit');
                }
            }

            handleCanvasInput(clientX, clientY) {
                if (this.state !== 'playing') return;

                const rect = canvas.getBoundingClientRect();
                const worldX = (clientX - rect.left) / (this.tileSize) + this.cameraX;
                const worldY = (clientY - rect.top) / (this.tileSize) + this.cameraY;
                const tileX = Math.floor(worldX);
                const tileY = Math.floor(worldY);

                // Check if clicking on tree
                for (let i = 0; i < this.treePositions.length; i++) {
                    const tree = this.treePositions[i];
                    if (Math.abs(tree.x - worldX) < 0.5 && Math.abs(tree.y - worldY) < 0.5 && tree.regrowTime <= 0) {
                        this.resources.wood += 10;
                        this.createParticles(worldX, worldY, 'sparkle', 5);
                        audio.playSound('collect');
                        tree.regrowTime = 30;
                        this.createFloatingText('+10 Wood', worldX, worldY);
                        this.updateHUD();
                        return;
                    }
                }

                // Check if clicking on rock
                for (let i = 0; i < this.rockPositions.length; i++) {
                    const rock = this.rockPositions[i];
                    if (Math.abs(rock.x - worldX) < 0.5 && Math.abs(rock.y - worldY) < 0.5 && rock.regrowTime <= 0) {
                        this.resources.stone += 10;
                        this.createParticles(worldX, worldY, 'sparkle', 5);
                        audio.playSound('collect');
                        rock.regrowTime = 45;
                        this.createFloatingText('+10 Stone', worldX, worldY);
                        this.updateHUD();
                        return;
                    }
                }

                if (this.selectedBuilding) {
                    this.placeBuilding(tileX, tileY);
                    return;
                }

                // Click on building to upgrade
                const building = this.buildings.find(b => b.x === tileX && b.y === tileY);
                if (building) {
                    this.upgradeBuilding(building);
                }
            }

            placeBuilding(x, y) {
                if (!this.selectedBuilding) return;

                const costs = {
                    farm: {wood: 20, stone: 0},
                    wall: {wood: 0, stone: 15},
                    tower: {wood: 25, stone: 15},
                    house: {wood: 30, stone: 10},
                    barracks: {wood: 40, stone: 30}
                };

                const cost = costs[this.selectedBuilding];

                // Check if enough resources
                if (this.resources.wood < cost.wood || this.resources.stone < cost.stone) {
                    audio.playSound('hit');
                    return;
                }

                // Check if valid placement
                const building = new Building(x, y, this.selectedBuilding);
                const overlaps = this.buildings.some(b =>
                    !(x + building.width <= b.x || x >= b.x + b.width ||
                      y + building.height <= b.y || y >= b.y + b.height)
                );

                if (overlaps || x < 0 || y < 0 || x + building.width > this.islandSize || y + building.height > this.islandSize ||
                    (x < 15 && y < 15 && x + building.width > 25 && y + building.height > 25)) {
                    audio.playSound('hit');
                    return;
                }

                // Place building
                this.buildings.push(building);
                this.resources.wood -= cost.wood;
                this.resources.stone -= cost.stone;
                this.totalBuildingsBuilt++;

                // Update population
                if (this.selectedBuilding === 'house') {
                    this.population.max += 2;
                    this.population.current = Math.min(this.population.current + 1, this.population.max);
                }

                audio.playSound('place');
                this.createParticles(x + 0.5, y + 0.5, 'dust', 10);
                this.createFloatingText('+' + this.selectedBuilding, x + 0.5, y + 0.5);

                // Tutorial progression
                if (this.tutorial.active) {
                    if (this.selectedBuilding === 'farm' && this.tutorial.step === 1) {
                        this.tutorial.step += 2;
                    } else if (this.selectedBuilding === 'wall' && this.tutorial.step === 3) {
                        this.tutorial.step += 2;
                    } else if (this.selectedBuilding === 'tower' && this.tutorial.step === 5) {
                        this.tutorial.step += 2;
                    } else if (this.selectedBuilding === 'house' && this.tutorial.step === 7) {
                        this.tutorial.step += 2;
                    }
                }

                // Check quests
                this.checkQuests();
                this.updateHUD();

                this.selectedBuilding = null;
                document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
            }

            upgradeBuilding(building) {
                if (building.level >= 3) return;
                const costs = {
                    farm: {wood: 30, stone: 0},
                    wall: {wood: 0, stone: 20},
                    tower: {wood: 40, stone: 20},
                    house: {wood: 30, stone: 15},
                    barracks: {wood: 50, stone: 40}
                };

                const cost = costs[building.type];
                if (this.resources.wood >= cost.wood && this.resources.stone >= cost.stone) {
                    building.level++;
                    building.maxHp += 30;
                    building.hp = building.maxHp;
                    this.resources.wood -= cost.wood;
                    this.resources.stone -= cost.stone;
                    audio.playSound('place');
                    this.createParticles(building.x + 0.5, building.y + 0.5, 'explosion', 15);
                    this.checkQuests();
                    this.updateHUD();
                }
            }

            startWave() {
                const waveData = [
                    { invaders: [{type: 'raider', count: 3}], delay: 90 },
                    { invaders: [{type: 'raider', count: 4}], delay: 60 },
                    { invaders: [{type: 'raider', count: 5}, {type: 'archer', count: 1}], delay: 55 },
                    { invaders: [{type: 'raider', count: 6}, {type: 'archer', count: 2}], delay: 50 },
                    { invaders: [{type: 'raider', count: 7}, {type: 'archer', count: 3}], delay: 45 },
                    { invaders: [{type: 'raider', count: 5}, {type: 'archer', count: 2}, {type: 'siege', count: 1}], delay: 45 },
                    { invaders: [{type: 'archer', count: 4}, {type: 'siege', count: 2}], delay: 40 },
                    { invaders: [{type: 'siege', count: 3}, {type: 'archer', count: 2}], delay: 35 },
                    { invaders: [{type: 'siege', count: 4}], delay: 30 },
                    { invaders: [{type: 'boss', count: 1}, {type: 'raider', count: 3}], delay: 60 }
                ];

                const data = waveData[Math.min(this.wave - 1, waveData.length - 1)];

                this.invaders = [];
                data.invaders.forEach(group => {
                    for (let i = 0; i < group.count; i++) {
                        const x = -2 + Math.random() * 4;
                        const y = -2 + Math.random() * 4;
                        this.invaders.push(new Invader(x, y, group.type));
                    }
                });

                this.waveActive = true;
                this.waveTime = data.delay;
                audio.playSound('wave');
                this.tutorial.active = false;
            }

            createParticles(x, y, type, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x * this.tileSize, y * this.tileSize, type));
                }
            }

            createFloatingText(text, x, y) {
                this.floatingTexts.push({
                    text,
                    x: x * this.tileSize,
                    y: y * this.tileSize,
                    life: 1,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -3
                });
            }

            checkQuests() {
                const quest = this.quests[this.currentQuest];
                if (quest.text.includes('Build your first farm') && this.buildings.some(b => b.type === 'farm')) {
                    quest.completed = true;
                    this.resources.wood += 50;
                    audio.playSound('quest');
                    this.currentQuest++;
                }
                if (quest.text.includes('Build 3 walls')) {
                    quest.progress = this.buildings.filter(b => b.type === 'wall').length;
                    if (quest.progress >= 3) {
                        quest.completed = true;
                        this.resources.stone += 30;
                        audio.playSound('quest');
                        this.currentQuest++;
                    }
                }
                if (quest.text.includes('Survive Wave 1') && this.wave > 1) {
                    quest.completed = true;
                    this.resources.gold += 100;
                    audio.playSound('quest');
                    this.currentQuest++;
                }
                if (quest.text.includes('Build your first tower') && this.buildings.some(b => b.type === 'tower')) {
                    quest.completed = true;
                    this.resources.stone += 30;
                    audio.playSound('quest');
                    this.currentQuest++;
                }
                if (quest.text.includes('Reach population 10') && this.population.current >= 10) {
                    quest.completed = true;
                    this.resources.wood += 50;
                    this.resources.stone += 50;
                    audio.playSound('quest');
                    this.currentQuest++;
                }
                if (quest.text.includes('Defeat 20 invaders')) {
                    quest.progress = this.totalInvadersDefeated;
                    if (quest.progress >= 20) {
                        quest.completed = true;
                        this.resources.gold += 200;
                        audio.playSound('quest');
                        this.currentQuest++;
                    }
                }
                if (quest.text.includes('Upgrade a tower to level 3') && this.buildings.some(b => b.type === 'tower' && b.level >= 3)) {
                    quest.completed = true;
                    this.resources.gold += 100;
                    audio.playSound('quest');
                    this.currentQuest++;
                }

                if (this.currentQuest >= this.quests.length) {
                    this.currentQuest = this.quests.length - 1;
                }
            }

            update() {
                if (this.state !== 'playing') return;

                // Update resources
                const farmCount = this.buildings.filter(b => b.type === 'farm').length;
                if (farmCount > 0) {
                    this.resources.food += farmCount * 0.05;
                }

                // Regrow trees/rocks
                this.treePositions.forEach(t => {
                    if (t.regrowTime > 0) t.regrowTime--;
                });
                this.rockPositions.forEach(r => {
                    if (r.regrowTime > 0) r.regrowTime--;
                });

                // Update particles
                this.particles = this.particles.filter(p => {
                    p.update();
                    return p.life > 0;
                });

                // Update floating text
                this.floatingTexts = this.floatingTexts.filter(ft => {
                    ft.x += ft.vx;
                    ft.y += ft.vy;
                    ft.vy -= 0.1;
                    ft.life -= 0.02;
                    return ft.life > 0;
                });

                // Update invaders
                this.invaders.forEach(inv => {
                    inv.update(this.buildings, this.castle);

                    // Invader attacks
                    if (inv.target && Math.sqrt((inv.x - inv.target.x) ** 2 + (inv.y - inv.target.y) ** 2) < 1.5) {
                        if (Date.now() - inv.lastAttack > 1000) {
                            inv.lastAttack = Date.now();
                            const dead = inv.target.takeDamage(inv.damage);
                            audio.playSound('hit');
                            this.shake = 5;
                            if (dead && inv.target !== this.castle) {
                                this.createParticles(inv.target.x + 0.5, inv.target.y + 0.5, 'explosion', 15);
                            } else if (dead && inv.target === this.castle) {
                                this.gameOver();
                            }
                        }
                    }
                });

                // Towers shoot
                this.buildings.filter(b => b.type === 'tower').forEach(tower => {
                    if (Date.now() - tower.lastShot > 1000) {
                        let target = null;
                        let closestDist = 10;
                        this.invaders.forEach(inv => {
                            const dist = Math.sqrt((tower.x - inv.x) ** 2 + (tower.y - inv.y) ** 2);
                            if (dist < closestDist) {
                                closestDist = dist;
                                target = inv;
                            }
                        });

                        if (target) {
                            tower.lastShot = Date.now();
                            audio.playSound('shoot');
                            if (target.takeDamage(15)) {
                                this.totalInvadersDefeated++;
                                this.resources.gold += target.reward;
                                this.createParticles(target.x, target.y, 'explosion', 10);
                                this.checkQuests();
                            }
                        }
                    }
                });

                // Remove defeated invaders
                this.invaders = this.invaders.filter(inv => inv.hp > 0);

                // Wave management
                if (!this.waveActive) {
                    this.waveTime--;
                    if (this.waveTime <= 0) {
                        this.startWave();
                    }
                } else {
                    if (this.invaders.length === 0) {
                        this.waveActive = false;
                        this.wave++;
                        this.waveTime = 60;
                        this.checkQuests();
                    }
                }

                // Update shake
                if (this.shake > 0) this.shake--;

                this.updateHUD();
            }

            draw() {
                // Clear canvas
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                if (this.shake > 0) {
                    ctx.translate(Math.random() * this.shake - this.shake / 2, Math.random() * this.shake - this.shake / 2);
                }

                // Draw island
                ctx.translate(-this.cameraX * this.tileSize, -this.cameraY * this.tileSize);

                // Draw water
                ctx.fillStyle = '#4A90E2';
                for (let x = -10; x < this.islandSize + 10; x++) {
                    for (let y = -10; y < this.islandSize + 10; y++) {
                        if (x < 0 || y < 0 || x >= this.islandSize || y >= this.islandSize) {
                            ctx.fillRect(x * this.tileSize, y * this.tileSize, this.tileSize, this.tileSize);
                        }
                    }
                }

                // Draw island grass
                ctx.fillStyle = '#90EE90';
                for (let x = 0; x < this.islandSize; x++) {
                    for (let y = 0; y < this.islandSize; y++) {
                        const dist = Math.sqrt((x - 20) ** 2 + (y - 20) ** 2);
                        if (dist < 22) {
                            ctx.fillStyle = dist < 20 ? '#7CCC7C' : '#90EE90';
                            ctx.fillRect(x * this.tileSize, y * this.tileSize, this.tileSize, this.tileSize);
                        }
                    }
                }

                // Draw castle
                ctx.fillStyle = '#FFD700';
                const cx = this.castle.x * this.tileSize;
                const cy = this.castle.y * this.tileSize;
                ctx.fillRect(cx - 20, cy - 20, 40, 40);
                ctx.strokeStyle = '#FF6B6B';
                ctx.lineWidth = 3;
                ctx.strokeRect(cx - 20, cy - 20, 40, 40);
                ctx.fillStyle = '#FF6B6B';
                ctx.fillRect(cx - 10, cy - 25, 8, 10);
                ctx.fillRect(cx + 2, cy - 25, 8, 10);

                // Castle health bar
                ctx.fillStyle = '#333';
                ctx.fillRect(cx - 30, cy - 35, 60, 4);
                ctx.fillStyle = '#00AA00';
                ctx.fillRect(cx - 30, cy - 35, 60 * (this.castle.hp / 100), 4);

                // Draw trees
                ctx.fillStyle = '#228B22';
                this.treePositions.forEach(tree => {
                    const opacity = tree.regrowTime > 0 ? 0.5 : 1;
                    ctx.globalAlpha = opacity;
                    ctx.beginPath();
                    ctx.arc(tree.x * this.tileSize, tree.y * this.tileSize, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });

                // Draw rocks
                ctx.fillStyle = '#A9A9A9';
                this.rockPositions.forEach(rock => {
                    const opacity = rock.regrowTime > 0 ? 0.5 : 1;
                    ctx.globalAlpha = opacity;
                    ctx.fillRect(rock.x * this.tileSize - 6, rock.y * this.tileSize - 6, 12, 12);
                    ctx.globalAlpha = 1;
                });

                // Draw buildings
                this.buildings.forEach(b => b.draw(ctx, this.tileSize));

                // Draw invaders
                this.invaders.forEach(inv => inv.draw(ctx));

                // Draw particles
                this.particles.forEach(p => p.draw(ctx));

                // Draw floating text
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                this.floatingTexts.forEach(ft => {
                    ctx.fillStyle = 'rgba(255, 215, 0, ' + Math.max(0, ft.life) + ')';
                    ctx.fillText(ft.text, ft.x, ft.y);
                });

                ctx.restore();

                // Draw wave banner
                if (!this.waveActive && this.tutorial.active === false && this.waveTime > 0 && this.waveTime < 55) {
                    ctx.font = 'bold 32px Arial';
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(canvas.width / 2 - 150, 100, 300, 80);
                    ctx.strokeStyle = '#FF6B6B';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(canvas.width / 2 - 150, 100, 300, 80);
                    ctx.fillStyle = '#FF6B6B';
                    ctx.textAlign = 'center';
                    ctx.fillText('Wave ' + this.wave, canvas.width / 2, 145);
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('Next in ' + Math.ceil(this.waveTime / 60) + 's', canvas.width / 2, 165);
                }

                // Draw tutorial tooltip
                if (this.tutorial.active) {
                    const step = this.tutorial.steps[this.tutorial.step];
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                    ctx.fillRect(canvas.width / 2 - 150, canvas.height - 120, 300, 100);
                    ctx.strokeStyle = '#FFFF00';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(canvas.width / 2 - 150, canvas.height - 120, 300, 100);
                    ctx.fillStyle = '#FFFF00';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(step.message, canvas.width / 2, canvas.height - 70, 280);
                }
            }

            updateHUD() {
                document.getElementById('woodCount').textContent = Math.floor(this.resources.wood);
                document.getElementById('stoneCount').textContent = Math.floor(this.resources.stone);
                document.getElementById('foodCount').textContent = Math.floor(this.resources.food);
                document.getElementById('goldCount').textContent = Math.floor(this.resources.gold);
                document.getElementById('waveDisplay').textContent = 'Wave: ' + this.wave;
                document.getElementById('populationDisplay').textContent = '👤 ' + this.population.current + '/' + this.population.max;

                const quest = this.quests[this.currentQuest];
                if (quest) {
                    document.getElementById('questTitle').textContent = 'Quest ' + (this.currentQuest + 1);
                    document.getElementById('questDesc').textContent = quest.text + (quest.progress !== undefined ? ' (' + quest.progress + ')' : '');
                }
            }

            startGame() {
                this.state = 'playing';
                document.getElementById('startScreen').classList.add('hidden');
            }

            gameOver() {
                this.state = 'gameOver';
                const stats = `
                    <div class="stat-item"><div class="stat-label">Waves Survived</div><div class="stat-value">${this.wave}</div></div>
                    <div class="stat-item"><div class="stat-label">Invaders Defeated</div><div class="stat-value">${this.totalInvadersDefeated}</div></div>
                    <div class="stat-item"><div class="stat-label">Buildings Built</div><div class="stat-value">${this.totalBuildingsBuilt}</div></div>
                    <div class="stat-item"><div class="stat-label">Max Population</div><div class="stat-value">${this.population.max}</div></div>
                `;
                document.getElementById('gameOverStats').innerHTML = stats;

                let stars = '⭐';
                if (this.wave > 5) stars += '⭐';
                if (this.wave > 10) stars += '⭐';
                document.getElementById('stars').textContent = stars;

                document.getElementById('gameOverScreen').classList.remove('hidden');
            }
        }

        const game = new Game();

        function gameLoop() {
            try {
                game.update();
                game.draw();
            } catch(e) {
                console.error('Game error:', e);
            }
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
